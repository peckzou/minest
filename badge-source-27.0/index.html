    <script>
      // The original awards bundle treats TRIGGER_UNLOCK as opening its inspector.
      // The Pokedex wall uses the same message as a completed-ring handoff, so persist
      // the unlock here and reload the wall to render the real unlocked medal.
      (() => {
        const unlockFromMinest = (event) => {
          const data = event && event.data;
          if (!data || data.type !== 'MINEST_TRIGGER_UNLOCK' || !data.badgeId) return;
          const badgeId = String(data.badgeId);
          let catalog;
          try { catalog = JSON.parse(localStorage.getItem('minest_learning_awards_catalog_v27') || '[]'); } catch (_) { catalog = []; }

          const badge = catalog.find((item) => item && (item.id === badgeId || item.name === badgeId));

          badge.state = 'unlocked';
          badge.earnedDate = badge.earnedDate || new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
          badge.earnedCount = (badge.earnedCount || 0) + 1;
          if (badge.progressTotal != null) badge.progressCurrent = badge.progressTotal;
          try { localStorage.setItem('minest_learning_awards_catalog_v27', JSON.stringify(catalog)); } catch (_) { return; }
          if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'MINEST_AWARD_UNLOCKED', badgeId }, '*');
          window.setTimeout(() => window.location.reload(), 30);
        };
        window.addEventListener('message', unlockFromMinest);
      })();
