    }
    buildStarSystem();

    function refreshPlanetBanners() {
      planetNodes.forEach(function (node) {
        var full = node.pi === st.pi && st.phase !== 'cockpit';
        node.bannerMat.map = full ? makePlanetTitleBanner(node.pl, node.B, true) : makeTitleOnlyTex(node.pl, node.B);
        node.bannerMat.needsUpdate = true;
        node.eqBand.visible = full;
        node.banner.scale.setScalar(full ? 1 : 1.9);
      });
    }

    function onPlanetClicked(pi) {
      if (st.phase === 'surface' || st.phase === 'hyperspace' || st.phase === 'landing') return;
      if (!planetNodes[pi] || !planetNodes[pi].group.visible) return;
      if (pi === st.pi && st.phase === 'approach') { landOnPlanet(); return; }
      if (st.phase === 'cockpit') {          // the planet passing by right now
        st.pi = pi; st.visited[pi] = true; persist();
        st.fromRoute = true; st.autoLandNear = true;
        setPhase('approach');
        S.toast('🛬 Heading down to ' + curPlanet().title);
        return;
      }
      st.autoLand = true; selectPlanet(pi);
    }

    // =========================================================================
    // 4. PLANETARY SURFACE EXPLORATION SCENE (4 Biomes + Titled Monuments)
    // =========================================================================
    var surfaceGroup = new T.Group();
    surfaceGroup.visible = false;
    scene.add(surfaceGroup);
    var landmarkList = [];

    function rebuildSurface() {
      while (surfaceGroup.children.length) surfaceGroup.remove(surfaceGroup.children[0]);
      clearHits();
      planetNodes.forEach(function (node) {
        addHit(node.sphere, function () { onPlanetClicked(node.pi); });
        addHit(node.banner, function () { onPlanetClicked(node.pi); });
        addHit(node.eqBand, function () { onPlanetClicked(node.pi); });
      });

      landmarkList = [];
      var pl = curPlanet(), B = curBiome();

      var ground = new T.Mesh(new T.CylinderGeometry(80, 80, 0.6, 48), mat(B.ground, 0.9, 0.05));
      ground.position.y = -0.3;
      surfaceGroup.add(ground);

      var padRing = new T.Mesh(new T.RingGeometry(3.2, 3.6, 36), flat(B.atmo));
      padRing.rotation.x = -Math.PI / 2;
      padRing.position.set(0, 0.02, 15.5);
      surfaceGroup.add(padRing);

      // Giant Planet Title Sky Arch on the Horizon
      var skyTitleMat = new T.MeshBasicMaterial({
        map: makePlanetTitleBanner(pl, B, true),
        transparent: true
      });
      var skyBanner = new T.Mesh(new T.PlaneGeometry(20, 5.1), skyTitleMat);
      skyBanner.position.set(0, 11.2, -26);
      surfaceGroup.add(skyBanner);

      var rng = K.rng(K.hash(pl.id) + 17);
      for (var p = 0; p < 34; p++) {
        var ang = rng() * Math.PI * 2;
        var dist = 16 + rng() * 36;
        var px = Math.cos(ang) * dist, pz = Math.sin(ang) * dist - 4;
        if (Math.abs(px) < 9 && pz > -50) continue;   // keep the trail clear
        if (B.id === 'forest') {
          var trunk = new T.Mesh(new T.CylinderGeometry(0.18, 0.26, 1.3, 6), mat(0x5c3a21, 0.9, 0));
          trunk.position.set(px, 0.65, pz);
          surfaceGroup.add(trunk);
          var crown = new T.Mesh(new T.ConeGeometry(1.25, 3.2, 6), mat(B.land2, 0.8, 0.05));
          crown.position.set(px, 2.5, pz);
          surfaceGroup.add(crown);
        } else if (B.id === 'desert') {
          var dune = new T.Mesh(new T.ConeGeometry(2.6 + rng() * 2, 1.8 + rng() * 2.2, 5), mat(B.land, 0.9, 0.05));
          dune.position.set(px, 0.9, pz);
          surfaceGroup.add(dune);
        } else if (B.id === 'ocean') {
          var spire = new T.Mesh(new T.CylinderGeometry(0.25, 0.85, 2.8 + rng() * 2, 7), mat(B.land2, 0.45, 0.25));
          spire.position.set(px, 1.4, pz);
          surfaceGroup.add(spire);
        } else {
          var crystal = new T.Mesh(new T.OctahedronGeometry(1.3 + rng() * 1.3, 0), mat(0xe0f2fe, 0.2, 0.55));
          crystal.position.set(px, 1.3, pz);
          surfaceGroup.add(crystal);
        }
      }

      // Exploration trail: monuments alternate left/right of a winding path that
      // leads away from the landing pad; each region opens with a beacon arch.
      var regs = pl.regions;
      var globalIdx = 0, step = 0;
      function trailX(z) { return Math.sin((15 - z) * 0.11) * 2.4; }
      var stoneMat = flat(B.atmo, { transparent: true, opacity: 0.55 });
      for (var sz = 13; sz > -6 - 4.6 * 20; sz -= 1.5) {
        var stone = new T.Mesh(new T.CircleGeometry(0.32, 7), stoneMat);
        stone.rotation.x = -Math.PI / 2;
        stone.position.set(trailX(sz) + (rng() - 0.5) * 0.4, 0.03, sz);
        surfaceGroup.add(stone);
      }
      var baseMat = {
        forest: mat(0x6b4a2e, 0.85, 0.05),
        desert: mat(0xc9955a, 0.95, 0.02),
        ocean: mat(0x0e7490, 0.35, 0.3, { transparent: true, opacity: 0.85 }),
        ice: mat(0xdbeafe, 0.15, 0.4, { transparent: true, opacity: 0.9 })
      }[B.id] || mat(0x162238, 0.65, 0.35);
      function monumentBase(g) {
        var m;
        if (B.id === 'forest') {           // tree stump lectern
          m = new T.Mesh(new T.CylinderGeometry(0.62, 0.78, 0.95, 9), baseMat);
          m.position.y = 0.475;
          var lamp = new T.Mesh(new T.SphereGeometry(0.09, 8, 6), flat(0xfde68a));
          lamp.position.set(0.75, 1.5, 0); g.add(lamp);
          var post = new T.Mesh(new T.CylinderGeometry(0.03, 0.03, 1.5, 5), baseMat);
          post.position.set(0.75, 0.75, 0); g.add(post);
        } else if (B.id === 'desert') {    // sandstone obelisk stub
          m = new T.Mesh(new T.CylinderGeometry(0.5, 0.82, 1.05, 4), baseMat);
          m.rotation.y = Math.PI / 4; m.position.y = 0.525;
        } else if (B.id === 'ocean') {     // glass coral column with a ring
          m = new T.Mesh(new T.CylinderGeometry(0.55, 0.7, 1.0, 12), baseMat);
          m.position.y = 0.5;
          var ring = new T.Mesh(new T.TorusGeometry(0.66, 0.03, 6, 24), flat(B.atmo));
          ring.rotation.x = Math.PI / 2; ring.position.y = 1.02; g.add(ring);
        } else {                           // hexagonal ice plinth with shards
          m = new T.Mesh(new T.CylinderGeometry(0.62, 0.7, 1.0, 6), baseMat);
          m.position.y = 0.5;
          [-0.7, 0.7].forEach(function (sx) {
            var shard = new T.Mesh(new T.OctahedronGeometry(0.28, 0), baseMat);
            shard.scale.y = 2.2; shard.position.set(sx, 0.55, -0.15); g.add(shard);
          });
        }
        g.add(m);
        return m;
      }
      var KIND_SCALE = { orb: 2.1, badge: 2.4, book: 1.9, frame: 1 };

      regs.forEach(function (reg, ri) {
        var bz = 12 - step * 4.6;
        var arch = new T.Group();
        arch.position.set(trailX(bz), 0, bz);
        [-1, 1].forEach(function (side) {
          var pole = new T.Mesh(new T.CylinderGeometry(0.1, 0.12, 4.2, 8), flat(B.atmo));
          pole.position.set(side * 2.1, 2.1, 0); arch.add(pole);
        });
        var rSign = new T.Mesh(
          new T.PlaneGeometry(4.0, 1.15),
          new T.MeshBasicMaterial({ map: makePlaqueTex(reg.title, 'Region ' + (ri + 1) + ' · ' + reg.items.length + ' cards', B.accent), transparent: true })
        );
        rSign.position.set(0, 4.25, 0);
        arch.add(rSign);
        surfaceGroup.add(arch);
        step += 0.6;

        reg.items.forEach(function (it, ii) {
          var idx = globalIdx++;
          var mz = 12 - step * 4.6;
          step += 1;
          var side = idx % 2 ? 1 : -1;
          var mx = trailX(mz) + side * 2.6;

          var mGroup = new T.Group();
          mGroup.position.set(mx, 0, mz);
          mGroup.rotation.y = -side * 0.55;   // turn toward the path

          var plinth = monumentBase(mGroup);

          var kinds = ['frame', 'orb', 'book', 'badge'];
          var kind = kinds[idx % kinds.length];
          var cMesh = X.carriers[kind](it, { w: 1.3, h: 0.84 });
          cMesh.scale.setScalar(KIND_SCALE[kind]);
          cMesh.position.set(0, kind === 'frame' ? 1.62 : 1.0, 0);
          mGroup.add(cMesh);

          var titlePlaque = new T.Mesh(
            new T.PlaneGeometry(2.1, 0.6),
            new T.MeshBasicMaterial({ map: makePlaqueTex(it.I.title, it.I.zh || reg.title, B.accent), transparent: true })
          );
          titlePlaque.position.set(0, kind === 'frame' ? 2.5 : 2.75, 0);
          mGroup.add(titlePlaque);

          surfaceGroup.add(mGroup);

          var tx = trailX(mz);
          var lm = {
            idx: idx, it: it, reg: reg, mesh: cMesh, plinth: plinth, titlePlaque: titlePlaque,
            x: mx, z: mz,
            ax: tx + side * 0.2, az: mz + 2.2      // stand on the path, just before it
          };
          landmarkList.push(lm);

          var onTap = (function (landmarkIdx) {
            return function () {
              if (st.focusIdx === landmarkIdx && !RD.open) pullLandmark(landmarkIdx);
              else focusLandmark(landmarkIdx, true);
            };
          })(idx);
          addHit(cMesh, onTap);
          addHit(plinth, onTap);
          addHit(titlePlaque, onTap);
        });
        step += 0.3;
      });
    }

    // =========================================================================
    // 5. FLIGHT & EXPLORATION TRANSITIONS (Cockpit -> Hyperspace -> Approach -> Land)
    // =========================================================================
    function setPhase(ph) {
      st.phase = ph;
      st.phaseT = 0;
      var B = curBiome();
      var pl = curPlanet();

      // Restore all planet home positions
      planetNodes.forEach(function (n) { n.group.position.copy(n.homePos); n.group.visible = ph !== 'cockpit' && n.pi === st.pi; n.group.scale.setScalar(1); });

      if (ph === 'cockpit' || ph === 'hyperspace' || ph === 'approach' || ph === 'landing') {
        surfaceGroup.visible = false;
        systemGroup.visible = true;
        applyView();
        skyMat.color.set('#020612');
        scene.fog.color.set('#030816');
      }

      if (ph === 'cockpit') {
        overviewPose(st.started);
        st.started = true;
        st.routeCur = -1;
        warpLines.visible = false;
        tunnelGroup.visible = false;
        dustLines.visible = true;
        asteroidGroup.visible = true;
        cam.fov = 62;
        cam.updateProjectionMatrix();
        statusEl.style.display = '';
        statusEl.textContent = '🪐 Cruising · planets pass by one at a time';
      } else if (ph === 'hyperspace') {
        warpLines.visible = true;
        tunnelGroup.visible = true;
        dustLines.visible = false;
        asteroidGroup.visible = false;
        statusEl.style.display = '';
        statusEl.textContent = '⚡ HYPERDRIVE → ' + pl.title.toUpperCase() + ' · TAP TO SKIP';
      } else if (ph === 'approach' && st.fromRoute) {
        st.fromRoute = false;
        warpLines.visible = false; tunnelGroup.visible = false;
        dustLines.visible = true; asteroidGroup.visible = true;
        statusEl.style.display = '';
        statusEl.textContent = '🪐 Approaching ' + pl.title + ' · descending…';
      } else if (ph === 'approach') {
        warpLines.visible = false;
        tunnelGroup.visible = false;
        dustLines.visible = true;
        asteroidGroup.visible = true;
        cam.fov = 60;
        cam.updateProjectionMatrix();
        var dirX = pl.pos.x, dirZ = pl.pos.z;
        var len = Math.hypot(dirX, dirZ) || 1;
        var stopDist = pl.radius * 4.4;
        st.shipPos.x = pl.pos.x - (dirX / len) * stopDist;
        st.shipPos.y = pl.pos.y - pl.radius * 0.05;
        st.shipPos.z = pl.pos.z - (dirZ / len) * stopDist;
        st.yaw = Math.atan2(-(pl.pos.x - st.shipPos.x), -(pl.pos.z - st.shipPos.z));
        st.pitch = 0.02;
        statusEl.style.display = '';
        statusEl.textContent = '🪐 Orbiting ' + pl.title + ' · tap the planet or 🛬 Land to descend';
      } else if (ph === 'landing') {
        warpLines.visible = false;
        tunnelGroup.visible = false;
        dustLines.visible = true;
        asteroidGroup.visible = false;
        statusEl.style.display = '';
        statusEl.textContent = '🛬 Atmospheric Entry into ' + pl.title + ' (' + B.name + ')…';
      } else if (ph === 'surface') {
        warpLines.visible = false;
        tunnelGroup.visible = false;
        dustLines.visible = false;
        asteroidGroup.visible = false;
        applyView();
        systemGroup.visible = false;
        surfaceGroup.visible = true;
        cam.fov = 58;
        cam.rotation.z = 0;
        cam.updateProjectionMatrix();
        statusEl.style.display = 'none';
        skyMat.color.set(B.skyBot);
        scene.fog.color.setHex(B.fog);
        rebuildSurface();
        cur.x = 0; cur.y = 1.75; cur.z = 16.5; cur.yaw = 0; cur.pitch = -0.03;
        tgt.x = 0; tgt.y = 1.75; tgt.z = 14.5; tgt.yaw = 0; tgt.pitch = -0.03;
      }
      refreshPlanetBanners();
      ui();
    }

    function selectPlanet(pi) {
      pi = clamp(pi, 0, planets.length - 1);
      if (RD.open) RD.back(true);
      st.pi = pi;
      st.visited[pi] = true;
      persist();
      startHyperspace();
    }

    function startHyperspace() {
      if (RD.open) RD.back(true);
      var pl = curPlanet();
      st.yaw = Math.atan2(-(pl.pos.x - st.shipPos.x), -(pl.pos.z - st.shipPos.z));
      st.pitch = 0;
      setPhase('hyperspace'); if (window.MinestSfx) MinestSfx.play('jump');
      S.toast('⚡ Hyperdrive Engaged · Jumping to ' + pl.title);
    }

    function finishHyperspace() {
      setPhase('approach');
      if (st.autoLand) {
        st.autoLand = false;
        clearTimeout(st.landT);
        st.landT = setTimeout(function () { if (st.phase === 'approach' && S.alive) landOnPlanet(); }, reducedMotion ? 500 : 1500);
      }
      S.toast('🪐 Arrived in orbit around ' + curPlanet().title);
    }

    function approachPlanet() {
      if (st.phase === 'surface') returnToShip();
      setPhase('approach');
    }

    function landOnPlanet() { if (window.MinestSfx) MinestSfx.play("whoosh");
      if (RD.open) RD.back(true);
      if (st.phase === 'cockpit') { onPlanetClicked(st.pi); return; }   // the planet passing by
      if (st.phase === 'surface') {
        S.toast('🧑‍🚀 Already on ' + curPlanet().title + ' · Tap any monument to inspect');
        return;
      }
      setPhase('landing');
    }

    function returnToShip() {
      if (RD.open) RD.back(true);
      st.autoExplore = false;
      st.focusIdx = -1;
      setPhase('approach');
      S.toast('🚀 Back in the cockpit, orbiting ' + curPlanet().title);
    }

    function focusLandmark(idx, openAfter) {
      var lm = landmarkList[idx];
      if (!lm) return;
      if (RD.open) RD.back(true);
      st.focusIdx = idx;
      st.autoExplore = false;
      tgt.x = lm.ax;
      tgt.z = lm.az;
      tgt.y = 1.72;
      tgt.yaw = Math.atan2(tgt.x - lm.x, tgt.z - lm.z);
      tgt.pitch = 0.04;
      st.onArrive = openAfter ? function () { pullLandmark(idx); } : null;
      ui();
    }

    function pullLandmark(idx) {
      var lm = landmarkList[idx != null ? idx : st.focusIdx];
      if (!lm) return;
      st.focusIdx = lm.idx;
      RD.pull(lm.mesh, lm.it, { dist: 1.55 });
      ui();
    }

    // =========================================================================
    // 6. HUD & INTERACTIVE 3D GALAXY STAR CHART
    // =========================================================================
    function ui() {
      var pl = curPlanet(), B = curBiome();
      var phaseTitle =
        st.phase === 'cockpit' ? ('🚀 Cockpit · ' + pl.title) :
        st.phase === 'hyperspace' ? ('⚡ Hyperspace → ' + pl.title) :
        st.phase === 'approach' ? ('🪐 Orbiting ' + pl.title) :
        st.phase === 'landing' ? ('🛬 Landing on ' + pl.title) :
        (B.icon + ' ' + pl.title + ' Surface');

      S.$('.kx-pill i').style.background = B.accent;
      S.$('.kx-pill b').textContent = RD.open && RD.item() ? RD.item().I.title : phaseTitle;
      S.$('.kx-pill small').textContent = B.name + ' · ' + pl.regions.length + ' regions · ' + pl.all.length + ' cards';

      var bWarp = S.$('.kg-b-warp');
      if (bWarp) bWarp.innerHTML = (st.phase === 'approach' || st.phase === 'surface') ? '🛣 <span>Back to Route</span>' : '⚡ <span>Jump Ahead</span>';
      var bCruise = S.$('.kg-b-cruise');
      if (bCruise) {
        if (st.phase === 'surface') {
          bCruise.classList.toggle('on', st.autoExplore);
          bCruise.innerHTML = (st.autoExplore ? '⏸ <span>Pause</span>' : '🚶 <span>Explore</span>');
        } else {
          bCruise.classList.toggle('on', st.cruise);
          bCruise.innerHTML = (st.cruise ? '🚀 <span>Cruising</span>' : '⏸ <span>Paused</span>');
        }
      }

      var bCockpit = S.$('.kg-b-cockpit');
      if (bCockpit) {
        if (st.phase === 'surface') {
          bCockpit.classList.remove('on');
          bCockpit.innerHTML = '🚀 <span>Return Ship</span>';
        } else {
          bCockpit.classList.toggle('on', st.view !== 'open');
          bCockpit.innerHTML = VIEW_LABEL[st.view];
        }
      }
    }

    function toggleGalaxyMap() {
      var sh = S.$('.kx-sheet');
      if (!sh.hidden) { sh.hidden = true; return; }
      var body = S.$('.kg-map-body');
      body.innerHTML = '<div class="kg-starmap"></div>';
      var grid = body.querySelector('.kg-starmap');

      planets.forEach(function (pl, pi) {
        var B = BIOMES[pl.biomeIdx || 0];
        var isCur = pi === st.pi;
        var isVis = !!st.visited[pi];
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'kg-planet-card' + (isCur ? ' on' : '');
        card.innerHTML =
          '<div class="kg-planet-top">' +
            '<div class="kg-planet-orb" style="background:radial-gradient(circle at 32% 30%, ' + B.accent + ', #0b192e);--orb-glow:' + B.accent + '66">' + B.icon + '</div>' +
            '<div class="kg-planet-meta"><b>' + K.esc(pl.title) + '</b><small>' + K.esc(B.name) + ' · ' + pl.regions.length + ' regions</small></div>' +
          '</div>' +
          '<div class="kg-planet-foot">' +
            '<span>' + (isVis ? '✓ Visited' : '○ Uncharted') + ' · ' + pl.all.length + ' cards</span>' +
            '<span style="color:#f2c13d;font-weight:700">' + (isCur ? (st.phase === 'surface' ? 'On Surface' : 'Current Orbit') : '⚡ Hyperspace ›') + '</span>' +
          '</div>';
        card.addEventListener('click', function () {
          sh.hidden = true;
          selectPlanet(pi);
        });
        grid.appendChild(card);
      });
      sh.hidden = false;
    }

    S.onAct = function (k) {
      if (k === 'exit') { self.close(); return; }
      if (k === 'map') toggleGalaxyMap();
      else if (k === 'warp') {
        if (st.phase === 'approach' || st.phase === 'surface') { if (RD.open) RD.back(true); clearTimeout(st.landT); setPhase('cockpit'); S.toast('🛣 Back on the route'); }
        else selectPlanet((st.pi + 1) % planets.length);   // jump ahead to the next planet
      } else if (k === 'land') {
        landOnPlanet();
      } else if (k === 'cruise' || k === 'auto') {
        if (st.phase === 'surface') {
          st.autoExplore = !st.autoExplore;
          if (st.autoExplore && landmarkList.length) {
            var nx = (st.focusIdx + 1) % landmarkList.length;
            focusLandmark(nx, false);
          }
        } else {
          st.cruise = !st.cruise;
          S.toast(st.cruise ? '🚀 Cruise resumed · drag to steer' : '⏸ Space Cruise Paused');
        }
        ui();
      } else if (k === 'cockpit' || k === 'return') {
        if (st.phase === 'surface') {
          returnToShip();
        } else {
          st.view = VIEWS[(VIEWS.indexOf(st.view) + 1) % VIEWS.length];
          applyView(); persist();
          S.toast({ cockpit: '🪟 Cockpit view', chase: '🛸 Chase view · watch the ship fly', open: '✨ Open view' }[st.view]);
          ui();
        }
      } else if (k === 'prev' && st.phase === 'surface' && landmarkList.length) {
        var pIdx = (Math.max(0, st.focusIdx) - 1 + landmarkList.length) % landmarkList.length;
        focusLandmark(pIdx, false);
      } else if (k === 'next' && st.phase === 'surface' && landmarkList.length) {
        var nIdx = (st.focusIdx + 1) % landmarkList.length;
        focusLandmark(nIdx, false);
      }
    };

    S.onTap = function (e) {
      if (RD.open) {
        var rh = S.pick(e.clientX, e.clientY, RD.meshes);
        if (RD.hit(rh)) RD.flip();
        else RD.back();
        return;
      }
      var h = S.pick(e.clientX, e.clientY, hitObjects);
      if (h && h.object) {
        var curObj = h.object;
        while (curObj) {
          if (hitMap.has(curObj)) {
            hitMap.get(curObj)();
            return;
          }
          curObj = curObj.parent;
        }
      }
    };

    S.onDrag = function (dx, dy) {
      if (RD.open) return;
      if (st.phase === 'surface') {
        st.autoExplore = false;
        tgt.yaw += dx * 0.0045;
        tgt.pitch = clamp(tgt.pitch + dy * 0.003, -0.35, 0.45);
      } else if (st.phase === 'cockpit' || st.phase === 'approach') {
        st.yaw += dx * 0.0042;
        st.pitch = clamp(st.pitch + dy * 0.0028, -0.42, 0.45);
        st.bank = clamp(st.bank - dx * 0.0025, -0.28, 0.28);
      }
    };

    S.onWheel = function (d) {
      if (RD.open) return;
      if (st.phase === 'surface') {
        st.autoExplore = false;
        tgt.x -= Math.sin(tgt.yaw) * d * 0.012;
        tgt.z -= Math.cos(tgt.yaw) * d * 0.012;
      } else if (st.phase === 'cockpit' || st.phase === 'approach') {
        var step = -d * 0.035;
        st.shipPos.x -= Math.sin(st.yaw) * step;
        st.shipPos.z -= Math.cos(st.yaw) * step;
      }
    };

    S.onKey = function (e) {
      if (RD.open) {
        if (e.key === 'f' || e.key === 'F' || e.key === ' ') { e.preventDefault(); RD.flip(); }
        else if (e.key === 'Escape') { e.preventDefault(); RD.back(); }
        return;
      }
      if (e.key === 'm' || e.key === 'M') toggleGalaxyMap();
      else if (e.key === 'h' || e.key === 'H') S.onAct('warp');
      else if (e.key === 'l' || e.key === 'L') landOnPlanet();
      else if (e.key === 'r' || e.key === 'R') returnToShip();
      else if (e.key === 'ArrowRight') {
        if (st.phase === 'surface') S.onAct('next');
        else selectPlanet((st.pi + 1) % planets.length);
      } else if (e.key === 'ArrowLeft') {
        if (st.phase === 'surface') S.onAct('prev');
        else selectPlanet((st.pi - 1 + planets.length) % planets.length);
      }
    };

    // =========================================================================
    // 7. MAIN ANIMATION LOOP (Space Flight, Hyperspace Vortex, Planet Titles)
    // =========================================================================
    var lookV = new T.Vector3();
    var hudT = 0;

    // One planet at a time: the nearest one ahead (or just alongside) is shown,
    // grows in from the distance, slides past, and the next one takes its place.
    // Passed planets move to the back of the queue so the road never ends.
    function routeTick(dt) {
      // ease off while a planet is close so it can be read and tapped
      var curN = planetNodes[st.routeCur], relC = curN ? curN.homePos.z - st.shipPos.z : -999;
      var slow = relC > -95 && relC < 30 ? 0.35 + 0.65 * clamp((-relC - 20) / 75, 0, 1) : 1;
      if (st.cruise) st.shipPos.z -= ROUTE_SPEED * slow * dt; if (shipSnd) shipSnd.set(st.cruise ? .25 + .5 * slow : .08);
      st.yaw = lerp(st.yaw, 0, 1 - Math.exp(-dt * 0.5));
      st.pitch = lerp(st.pitch, -0.02, 1 - Math.exp(-dt * 0.5));
      st.shipPos.x = lerp(st.shipPos.x, 0, 1 - Math.exp(-dt * 0.5));
      var cur = null, best = -Infinity, N = planetNodes.length;
      planetNodes.forEach(function (n) {
        var rel = n.homePos.z - st.shipPos.z;          // < 0: ahead
        if (rel > 45) {
          n.homePos.z -= N * ROUTE_GAP; n.pl.pos.z = n.homePos.z; n.group.position.z = n.homePos.z;
          rel = n.homePos.z - st.shipPos.z;
        }
        if (rel < 30 && rel > best) { best = rel; cur = n; }
      });
      planetNodes.forEach(function (n) { n.group.visible = n === cur; });
      if (!cur) return;
      if (st.routeCur !== cur.pi) {
        st.routeCur = cur.pi; st.pi = cur.pi; cur.appear = 0;
        refreshPlanetBanners();
        statusEl.textContent = '🪐 ' + cur.pl.title + ' ahead · tap it to land';
        ui();
      }
      cur.appear = Math.min(1, (cur.appear || 0) + dt * 0.7);
      cur.group.scale.setScalar(0.2 + 0.8 * easeOutCubic(cur.appear));
    }

    S.tick(function (dt, now) {
      st.phaseT += dt;
      spaceGroup.position.copy(cam.position);      // stars and sky stay at infinity
      skyMesh.position.copy(cam.position);

      // Animate cockpit holographic globe & steering yokes
      holoGlobe.rotation.y += dt * 0.85;
      if (cockpitGroup.visible) blinkButtons(dt);
      holoGlobe.rotation.x = Math.sin(now * 0.0016) * 0.22;
      st.bank = lerp(st.bank, 0, 1 - Math.exp(-dt * 4));
      yokes.forEach(function (yk) {
        yk.rotation.z = Math.PI * 0.82 + st.bank * 1.65;
      });
      if (shipGroup.visible) {        // chase view: bob, bank, hyperspace lunge
        var hp = st.phase === 'hyperspace' ? clamp(st.phaseT / st.warpDur, 0, 1) : 0;
        var lunge = hp ? Math.sin(hp * Math.PI) * (reducedMotion ? 0.6 : 2.4) : 0;
        shipGroup.position.set(Math.sin(now * 0.0007) * 0.06, -1.2 + Math.sin(now * 0.0011) * 0.04, -5.9 - lunge);
        shipGroup.rotation.set(0.2, 0, -st.bank * 1.6);   // level, nose straight down the flight line; banks only when steering
        var pulse = 0.75 + Math.sin(now * 0.012) * 0.08 + (hp ? 0.5 : 0);
        var U = shipGroup.userData;
        U.halo.material.opacity = 0.5 * pulse + (hp ? 0.35 : 0);
        U.halo.scale.y = 1 + (hp ? 0.6 : 0);
        U.bloom.opacity = 0.6 * pulse + (hp ? 0.4 : 0);
        U.engMat.opacity = 0.85 + (hp ? 0.15 : 0);
      }

      // Rotate all planets & moons in the 3D star system, and billboard their 3D Title Banners + Equatorial Namebands toward camera!
      planetNodes.forEach(function (node, i) {
        node.sphere.rotation.y += dt * (0.14 + (i % 3) * 0.04);
        node.ring.rotation.z += dt * 0.05;
        var mAng = now * 0.00055 * (1 + (i % 2) * 0.4) + i;
        var mDist = node.pl.radius * 2.25;
        node.moon.position.set(
          Math.cos(mAng) * mDist,
          Math.sin(mAng * 0.7) * (node.pl.radius * 0.45),
          Math.sin(mAng) * mDist
        );
        var dxC = cam.position.x - node.group.position.x;
        var dzC = cam.position.z - node.group.position.z;
        var dLenC = Math.hypot(dxC, dzC) || 1;
        node.eqBand.position.set(
          (dxC / dLenC) * (node.pl.radius * 1.15),
          -node.pl.radius * 1.3,
          (dzC / dLenC) * (node.pl.radius * 0.6)
        );
        node.banner.lookAt(cam.position);
        node.eqBand.lookAt(cam.position);
      });

      // Stream space dust & 3D asteroids past the cockpit window during flight
      if (dustLines.visible) {
        var dAttr = dustGeo.getAttribute('position');
        var dArr = dAttr.array;
        var dustSpeedMult = (st.phase === 'landing') ? 3.2 : (st.cruise ? 1.25 : 0.25);
        for (var d = 0; d < dustCount; d++) {
          var ds = dustSeeds[d];
          ds.z += ds.spd * dt * dustSpeedMult;
          if (ds.z > 2) {
            ds.z = -85 - Math.random() * 20;
            ds.x = (Math.random() - 0.5) * 44;
            ds.y = (Math.random() - 0.5) * 28;
          }
          var streakLen = 0.9 + dustSpeedMult * 1.5;
          dArr[d * 6] = ds.x;     dArr[d * 6 + 1] = ds.y;     dArr[d * 6 + 2] = ds.z;
          dArr[d * 6 + 3] = ds.x; dArr[d * 6 + 4] = ds.y;     dArr[d * 6 + 5] = ds.z - streakLen;
        }
        dAttr.needsUpdate = true;
      }

      if (asteroidGroup.visible) {
        var astMult = st.cruise ? 1.15 : 0.2;
        asteroids.forEach(function (a) {
          a.mesh.position.z += a.spd * dt * astMult;
          a.mesh.rotation.x += a.rx * dt;
          a.mesh.rotation.y += a.ry * dt;
          if (a.mesh.position.z > 3) {
            a.mesh.position.z = -95 - Math.random() * 25;
            a.mesh.position.x = (Math.random() < 0.5 ? -1 : 1) * (4.5 + Math.random() * 22);
            a.mesh.position.y = (Math.random() - 0.5) * 18;
          }
        });
      }

      if (st.phase === 'cockpit' || st.phase === 'approach') {
        leverPivot.rotation.x = lerp(leverPivot.rotation.x, 0, 1 - Math.exp(-dt * 6));
        var pl = curPlanet();

        if ((st.cruise || st.autoLandNear) && st.phase === 'approach') {
          var toX = pl.pos.x - st.shipPos.x;
          var toZ = pl.pos.z - st.shipPos.z;
          var dist = Math.hypot(toX, toZ) || 1;
          var desiredYaw = Math.atan2(-toX, -toZ);
          var dyaw = ((desiredYaw - st.yaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
          st.yaw += dyaw * Math.min(1, dt * 1.8);
          st.bank = clamp(-dyaw * 0.35, -0.22, 0.22);

          var minOrbitDist = pl.radius * 4.4;
          if (st.autoLandNear && dist <= minOrbitDist + 2) { st.autoLandNear = false; landOnPlanet(); }
          if (dist > minOrbitDist + 1.2) {
            var cruiseSpd = clamp((dist - minOrbitDist) * 0.75, 4.0, 16);
            st.shipPos.x -= Math.sin(st.yaw) * cruiseSpd * dt;
            st.shipPos.z -= Math.cos(st.yaw) * cruiseSpd * dt;
            st.shipPos.y = lerp(st.shipPos.y, pl.pos.y - pl.radius * 0.05, dt * 1.5);
          } else {
            var tangX = -toZ / dist, tangZ = toX / dist;
            st.shipPos.x += tangX * 2.2 * dt;
            st.shipPos.z += tangZ * 2.2 * dt;
          }
        }

        if (st.phase === 'cockpit') routeTick(dt);

        var swayX = Math.sin(now * 0.0015) * 0.08;
        var swayY = Math.cos(now * 0.0021) * 0.06;
        cam.position.set(st.shipPos.x + swayX, st.shipPos.y + swayY, st.shipPos.z);
        lookV.set(
          cam.position.x - Math.sin(st.yaw) * Math.cos(st.pitch),
          cam.position.y + Math.sin(st.pitch),
          cam.position.z - Math.cos(st.yaw) * Math.cos(st.pitch)
        );
        cam.lookAt(lookV);
        cam.rotation.z = st.bank + Math.sin(now * 0.0011) * 0.012;

      } else if (st.phase === 'hyperspace') {
        var p = clamp(st.phaseT / st.warpDur, 0, 1);
        var pl2 = curPlanet();

        // 1. Pull the throttle levers back
        leverPivot.rotation.x = lerp(0, -0.72, clamp(p * 3.5, 0, 1));

        // 2. FOV Warp Stretch
        if (!reducedMotion) {
          var fovPeak = st.view === 'cockpit' ? 68 : 86;   // keep the window big in the cockpit
          var fovCurve = p < 0.2 ? lerp(62, fovPeak, p / 0.2) : p < 0.8 ? fovPeak : lerp(fovPeak, 60, (p - 0.8) / 0.2);
          cam.fov = fovCurve;
          cam.updateProjectionMatrix();
        }

        // 3. During deep hyperspace tunnel (0.16 < p < 0.76), hide external planets so only the hyperspace vortex fills the windshield; at p >= 0.76, boom the destination planet in from deep space!
        var dirX2 = pl2.pos.x, dirZ2 = pl2.pos.z;
        var dLen = Math.hypot(dirX2, dirZ2) || 1;
        var stopDist2 = pl2.radius * 4.4;
        var destX = pl2.pos.x - (dirX2 / dLen) * stopDist2;
        var destY = pl2.pos.y - pl2.radius * 0.05;
        var destZ = pl2.pos.z - (dirZ2 / dLen) * stopDist2;

        if (p < 0.74) {
          systemGroup.visible = false;
        } else {
          systemGroup.visible = true;
          var exitT = easeOutCubic((p - 0.74) / 0.26);
          st.shipPos.x = destX;
          st.shipPos.y = destY;
          st.shipPos.z = destZ;
          st.yaw = Math.atan2(-(pl2.pos.x - st.shipPos.x), -(pl2.pos.z - st.shipPos.z));
          // Boom target planet in from 130m ahead along sightline!
          var targetNode = planetNodes[st.pi];
          if (targetNode) {
            var fwdX = -Math.sin(st.yaw), fwdZ = -Math.cos(st.yaw);
            var boomDist = lerp(135, stopDist2, exitT);
            targetNode.group.position.set(
              st.shipPos.x + fwdX * boomDist,
              pl2.pos.y,
              st.shipPos.z + fwdZ * boomDist
            );
          }
        }

        // 4. Stretch 1,100 Star Vectors into radial light streaks
        var wAttr = warpGeo.getAttribute('position');
        var wArr = wAttr.array;
        var stretch = reducedMotion ? 8 : (p < 0.22 ? lerp(1, 48, p / 0.22) : p < 0.8 ? 48 : lerp(48, 1.5, (p - 0.8) / 0.2));
        warpMat.opacity = p < 0.12 ? (p / 0.12) : p > 0.88 ? (1 - p) / 0.12 : 0.98;

        for (var w = 0; w < warpCount; w++) {
          var wb = warpBase[w];
          wb.z += wb.spd * dt * (p < 0.2 ? 0.7 : 2.1);
          if (wb.z > -1.5) wb.z = -115 - Math.random() * 20;
          wArr[w * 6] = wb.x;     wArr[w * 6 + 1] = wb.y;     wArr[w * 6 + 2] = wb.z;

      if (k === 'prev') { RD.back(true); nextStop(-1); return; }
      if (k === 'next') { RD.back(true); nextStop(1); return; }
      if (k === 'up' || k === 'down') return;
      if (k === 'corridor') {
        var c = R.corridors[+el.dataset.i];
        if (c) { st.sTarget = c.s0 + 30; st.altWant = ALT_DEF; st.latWant = 0; st.focus = -1; st.playing = false; cruiseLabel(); mapSheet(); S.hap(); }
        return;
      }
      ui(); persist();
    };
    // hold the climb / descend buttons
    ['up', 'down'].forEach(function (k) {
      var b = S.$('[data-kx="' + k + '"]');
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); st[k] = true; });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, function () { st[k] = false; }); });
    });
    var keys = {};
    S.onKey = function (e) {
      var k = e.key;
      if (k === 'Escape') { e.preventDefault(); if (!S.$('.kx-sheet').hidden) return mapSheet(); if (RD.open) return RD.back(); return self.close(); }
      if (k === 'ArrowUp') { e.preventDefault(); keys.up = true; st.altWant = clamp(st.altWant + 12, ALT_MIN, ALT_MAX); }
      if (k === 'ArrowDown') { e.preventDefault(); keys.down = true; st.altWant = clamp(st.altWant - 12, ALT_MIN, ALT_MAX); }
      if (k === 'ArrowLeft') { e.preventDefault(); st.latWant = clamp(st.latWant - 20, -110, 110); }
      if (k === 'ArrowRight') { e.preventDefault(); st.latWant = clamp(st.latWant + 20, -110, 110); }
      if (k === ' ') { e.preventDefault(); if (RD.open) RD.flip(); else { st.playing = !st.playing; cruiseLabel(); } }
      if (k === 'Enter') { e.preventDefault(); if (st.focus >= 0) pullStop(st.focus); }
      if (k === 'm' || k === 'M') mapSheet();
      if (k === 'v' || k === 'V') S.onAct('view');
    };
    function onKeyUp(e) { if (e.key === 'ArrowUp') keys.up = false; if (e.key === 'ArrowDown') keys.down = false; }
    window.addEventListener('keyup', onKeyUp);

    function persist() { DB.set(C.key, { s: Math.round(st.s), alt: Math.round(st.alt), speed: st.speed, theme: st.theme, view: st.view, playing: st.playing, seed: seed, at: Date.now() }); }
    S.onHide = persist;

    // ---------------- the loop
    var F = {}, look = new T.Vector3(), lookTo = new T.Vector3(), eye = new T.Vector3(), UP = new T.Vector3(0, 1, 0);
    var mgT = 0, hudT = 0, saveT = 0, festT = 0, adT = 0;
    function TICK(dt, now) {
      // the flight
      var target = st.playing ? SPEEDS[st.speed][0] : 0;
      if (st.sTarget != null) {   // flying to an exhibit: ease onto it and stop there
        var d = st.sTarget - st.s;
        target = clamp(Math.abs(d) * .7, 0, 18);
        if (Math.abs(d) < 1.2) { st.sTarget = null; target = 0; }
      }
      st.v = lerp(st.v, target, 1 - Math.exp(-dt * (target > st.v ? .8 : 2.6)));
      st.s = clamp(st.s + st.v * dt, 0, R.len - 1);
      if (st.s >= R.len - 1 && st.playing && st.sTarget == null) { st.playing = false; cruiseLabel(); S.toast('🏁 The end of the route'); }
      // the advertisements: the other balloons carry the exhibits you are flying towards, the way Knowledge
      // Drive's billboards do. An escort takes the next unclaimed exhibit ahead; a drifting balloon
      // advertises the exhibit nearest to it. A cloth is only repainted once its exhibit is behind you.
      adT += dt;
      if (adT > .6) {
        adT = 0;
        var taken = {};
        festival.forEach(function (fb) { if (fb.stop != null) taken[fb.stop] = 1; });
        festival.forEach(function (fb) {
          var cur = fb.stop != null ? R.stops[fb.stop] : null, pick = null, bd = 1e9;
          if (cur && (fb.escort ? cur.s > st.s - 30 : Math.abs(cur.s - fb.s) < 160) && cur.s < st.s + 1400) return;
          if (cur) delete taken[fb.stop];
          for (var ni = 0; ni < R.stops.length; ni++) {
            var spn = R.stops[ni], d = fb.escort ? spn.s - (st.s + 20) : Math.abs(spn.s - fb.s);
            if (fb.escort ? d < 0 : false) continue;
            if (taken[ni] || !spn.it.I || d >= bd) continue;
            bd = d; pick = ni;
          }
          if (pick == null) { fb.stop = null; fb.g.userData.skin.userData.ex = null; paintFest(fb); return; }
          taken[pick] = 1; fb.stop = pick; fb.g.userData.skin.userData.ex = pick; paintFest(fb);
        });
      }
      // the climb
      if (st.up || keys.up) st.altWant = clamp(st.altWant + 26 * dt, ALT_MIN, ALT_MAX);
      if (st.down || keys.down) st.altWant = clamp(st.altWant - 26 * dt, ALT_MIN, ALT_MAX);
      st.alt = lerp(st.alt, st.altWant, 1 - Math.exp(-dt * 2.4));
      st.lat = lerp(st.lat, st.latWant, 1 - Math.exp(-dt * 2));
      if (!st.playing && st.sTarget == null && st.focus < 0) st.latWant = lerp(st.latWant, 0, 1 - Math.exp(-dt * .35));

      frame(st.s, F);
      var bx = F.p.x + F.l.x * st.lat, bz = F.p.z + F.l.z * st.lat;
      var by = hgt(bx, bz) + st.alt;
      balloon.position.set(bx, by, bz);
      var yaw = Math.atan2(F.t.x, F.t.z);
      balloon.rotation.y = lerp(balloon.rotation.y, yaw + st.lat * .0016, 1 - Math.exp(-dt * 2));
      balloon.rotation.z = lerp(balloon.rotation.z, clamp(-st.lat * .0016, -.12, .12), 1 - Math.exp(-dt * 3));
      balloon.rotation.x = lerp(balloon.rotation.x, Math.sin(now / 1600) * .02, 1 - Math.exp(-dt * 2));
      balloon.position.y += Math.sin(now / 900) * .18;
      // the burner flares when you climb
      st.burn = lerp(st.burn, ((st.up || keys.up) ? 1 : 0) + (Math.sin(now / 2400) > .986 ? .85 : 0), 1 - Math.exp(-dt * 9));
      var fl = balloon.userData.flame;
      fl.visible = st.burn > .02;
      if (fl.visible) {
        fl.scale.set(.85 + st.burn * .35, .5 + st.burn * 1.3, .85 + st.burn * .35);
        fl.position.y = balloon.userData.baseY + st.burn * .3;
        var gl = fl.children[2]; if (gl && gl.isPointLight) gl.intensity = st.burn * 26;
      }
      // the print is on the cloth, so it stays where it was painted
      var banG = balloon.userData.banG;
      if (banG) banG.rotation.y = 0;

      // the camera
      var fwd = new T.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      balloon.updateMatrixWorld(true);
      if (st.view === 'basket') {
        // from the basket, looking out under the envelope
        eye.set(.30, .78, .30).applyMatrix4(balloon.matrixWorld);
        cam.position.copy(eye);
        lookTo.copy(eye).addScaledVector(fwd, 30); lookTo.y = eye.y - 2.2;
        cam.lookAt(lookTo);
      } else {
        var side = F.l.clone();
        eye.copy(balloon.position).addScaledVector(fwd, -12.5).addScaledVector(side, 2.4); eye.y += 2.1;
        cam.position.lerp(eye, 1 - Math.exp(-dt * 4));
        if (st.focus >= 0 && R.stops[st.focus] && R.stops[st.focus].pos) {
          lookTo.copy(R.stops[st.focus].pos); lookTo.y += 3.4;
        } else {
          lookTo.copy(balloon.position).addScaledVector(fwd, 22); lookTo.y = balloon.position.y + 2.4;
        }
        look.lerp(lookTo, 1 - Math.exp(-dt * 3.4)); cam.lookAt(look);
      }
      // the sky follows you
      sky.position.copy(cam.position); stars.position.copy(cam.position);
      var sd = sun.userData.dir;
      sunDisc.position.copy(cam.position).addScaledVector(sd, 1100); sunDisc.lookAt(cam.position);
      sun.position.copy(cam.position).addScaledVector(sd, 220); sun.target.position.copy(cam.position);
      // the clouds, along the route
      var m = new T.Matrix4(), q = new T.Quaternion();
      for (var i = 0; i < cloudOff.length; i++) {
        var co = cloudOff[i], cs = st.s + (i * 190) - 600, F4 = frame(clamp(cs, 0, R.len), {});
        var cx = F4.p.x + F4.l.x * co.lat, cz = F4.p.z + F4.l.z * co.lat;
        q.setFromAxisAngle(UP, i * 1.7);
        m.compose(new T.Vector3(cx, hgt(cx, cz) + co.alt, cz), q, new T.Vector3(2.6, 1.1, 1.8).multiplyScalar(co.sc));
        clouds.setMatrixAt(i, m);
      }
      clouds.instanceMatrix.needsUpdate = true;

      // the festival: the other balloons drift around you, free of the route
      festT += dt;
      if (festT > .05) {
        var fdt = festT; festT = 0;
        var Fp = frame(st.s, F);      // the player's own frame, so the flock flies with you
        for (var f = 0; f < festival.length; f++) {
          var fb = festival[f];
          if (fb.escort) {
            // an escort: keeps station beside you, a little ahead and to one side, drifting slowly
            var ealong = fb.along + Math.sin(now * fb.w * .7 + fb.ph) * 14;
            var elat = fb.elat + Math.sin(now * fb.w * 1.7 + fb.ph) * fb.latW;
            var ealt = fb.ealt + Math.sin(now * fb.w * 2.3 + fb.ph) * fb.altW;
            fb.tx = Fp.p.x + Fp.t.x * ealong + Fp.l.x * elat;
            fb.tz = Fp.p.z + Fp.t.z * ealong + Fp.l.z * elat;
            fb.ty = hgt(fb.tx, fb.tz) + st.alt + ealt;
            fb.yaw = Math.atan2(Fp.t.x, Fp.t.z) + Math.sin(now * fb.w + fb.ph) * .2;
          } else {
            // a balloon of the festival: it drifts with the wind, almost as fast as you, so it holds
            // its place in the sky instead of being swept past
            fb.s += (st.v * .84 + fb.vel) * fdt;
            if (fb.s > st.s + 1500) fb.s = st.s + 120;
            else if (fb.s < st.s - 100) fb.s = st.s + 120;
            frame(fb.s, fb.F);
            var la = fb.lat + Math.sin(now * fb.w * 1.7 + fb.ph) * fb.latW;
            var al = fb.alt + Math.sin(now * fb.w * 2.3 + fb.ph) * fb.altW;
            fb.tx = fb.F.p.x + fb.F.l.x * la; fb.tz = fb.F.p.z + fb.F.l.z * la;
            fb.ty = hgt(fb.tx, fb.tz) + al;
            fb.yaw = Math.atan2(fb.F.t.x, fb.F.t.z) + Math.sin(now * fb.w + fb.ph) * .2;
          }
          fb.tilt = Math.sin(now * fb.w * 1.3 + fb.ph) * .06;
          fb.flare = Math.max(0, fb.flare - fdt);
          var ffl = fb.g.userData.flame, burning = fb.flare > 0 || Math.sin(now * .0009 + fb.ph * 3) > .8;
          ffl.visible = burning;
          if (burning) {
            ffl.scale.set(.7 + .3 * Math.sin(now * .02), 1.1, .7);
            var fgl = ffl.children[2]; if (fgl && fgl.isPointLight) fgl.intensity = 22;
          }
        }
      }
      for (var f2 = 0; f2 < festival.length; f2++) {
        var fb2 = festival[f2], gg = fb2.g;
        gg.position.x = lerp(gg.position.x, fb2.tx, 1 - Math.exp(-dt * 4));
        gg.position.y = lerp(gg.position.y, fb2.ty, 1 - Math.exp(-dt * 4));
        gg.position.z = lerp(gg.position.z, fb2.tz, 1 - Math.exp(-dt * 4));
        gg.rotation.y = lerp(gg.rotation.y, fb2.yaw, 1 - Math.exp(-dt * 2));
        gg.rotation.z = lerp(gg.rotation.z, fb2.tilt, 1 - Math.exp(-dt * 2));
        gg.rotation.x = lerp(gg.rotation.x, fb2.tilt * .6, 1 - Math.exp(-dt * 2));
      }
      // the confetti falls around the balloon
      conf.position.copy(cam.position);
      var cpa = confGeo.attributes.position;
      for (var ci2 = 0; ci2 < cpa.count; ci2++) {
        var yy = cpa.getY(ci2) - dt * 3.4; if (yy < -85) yy += 170;
        cpa.setY(ci2, yy);
        cpa.setX(ci2, cpa.getX(ci2) + Math.sin(now * .0011 + ci2 * .7) * dt * 1.8);
      }
      cpa.needsUpdate = true;

      // the world
      mgT += dt; if (mgT > .3) { mgT = 0; manageChunks(st.s); manageIslands(st.s); manageSigns(st.s); manageFests(st.s); }
      hudT += dt; if (hudT > .3) { hudT = 0; ui(); if (mapOpen) drawMap(); }
      saveT += dt; if (saveT > 2.5) { saveT = 0; persist(); }
    }
    S.tick(TICK);
    // a manual frame, for tests and for the background tab where the loop is paused
    this.step = function (dt) { TICK(dt || .016, performance.now()); S.R.render(scene, cam); };

    // ---------------- start
    applyTheme(); speedLabel(); cruiseLabel();
    manageChunks(st.s); manageIslands(st.s); manageSigns(st.s);
    ui(); S.start();
    if (saved.s > 5) S.toast('⟲ Resuming your flight · ' + corridorAt(st.s).name);
    else S.toast('🎈 ' + corridorAt(st.s).name + ' — tap an exhibit to fly to it');
    setTimeout(function () { if (S.alive) S.toast(R.stops.length + ' exhibits over ' + R.corridors.length + ' corridors'); }, 2800);

    var self = this;
    this.close = function () {
      persist();
      Object.keys(chunks).forEach(function (k) { dropChunk(+k); });
      Object.keys(fests).forEach(function (k) { scene.remove(fests[k]); delete fests[k]; });
      R.stops.forEach(dropIsland);
      Object.keys(signs).forEach(function (k) { scene.remove(signs[k]); });
      window.removeEventListener('keyup', onKeyUp);
      S.close();
    };
    this.state = function () {
      var c = corridorAt(st.s), sp = st.focus >= 0 ? R.stops[st.focus] : null;
      return { corridor: c.name, corridorCount: c.g.items.length, exhibits: R.stops.length, visited: visitedCount(c),
        playing: st.playing, alt: Math.round(st.alt), speed: st.speed, theme: st.theme, view: st.view, s: Math.round(st.s),
        focus: sp && sp.it.I ? sp.it.I.title : null, reading: RD.item() ? RD.item().I.title : null,
        built: R.stops.filter(function (x) { return x.island; }).length };
    };
    this.focus = focusStop;
    this.debug = function () {
      var v = balloon.position.clone(); v.y += 5.2; v.project(cam);
      var inView = 0, near = [];
      festival.forEach(function (f) {
        var d = f.g.position.distanceTo(cam.position);
        var q = f.g.position.clone(); q.y += 3; q.project(cam);
        var seen = Math.abs(q.x) < .95 && Math.abs(q.y) < .95 && q.z < 1 && d < 1400;
        if (seen) inView++;
        near.push({ d: Math.round(d), ndc: [Math.round(q.x * 100) / 100, Math.round(q.y * 100) / 100], seen: seen });
      });
      near.sort(function (a, b) { return a.d - b.d; });
      var objs = [];
      scene.children.forEach(function (o) {
        if (!o.name) return;
        var w = o.getWorldPosition(new T.Vector3()), q = w.clone(); q.y += 3; q.project(cam);
        objs.push({ n: o.name, d: Math.round(w.distanceTo(cam.position)), px: Math.round((q.x + 1) / 2 * 878), py: Math.round((1 - q.y) / 2 * 660), z: Math.round(q.z * 1000) / 1000, vis: Math.abs(q.x) < 1 && Math.abs(q.y) < 1 && q.z < 1 });
      });
      objs.sort(function (a, b) { return a.d - b.d; });
      var rc = new T.Raycaster();
      rc.setFromCamera(new T.Vector2(-.3, 0), cam);
      var hits = rc.intersectObjects(scene.children, true).slice(0, 4).map(function (h) {
        var o = h.object, chain = [];
        while (o && o !== scene) { chain.push(o.name || o.type); o = o.parent; }
        var mt = h.object.material;
        return { d: Math.round(h.distance * 100) / 100, chain: chain.join('<'), geo: h.object.geometry.type,
          col: mt && mt.color ? '#' + mt.color.getHexString() : '-', pt: [Math.round(h.point.x), Math.round(h.point.y), Math.round(h.point.z)] };
      });
      var ban = null;
      balloon.traverse(function (o) { if (o.isMesh && o.material === balloon.userData.skin.material) ban = o; });
      var banInfo = null;
      if (ban) {
        ban.updateMatrixWorld(true);
        ban.geometry.computeBoundingBox();
        var bb = ban.geometry.boundingBox;
        var bc = new T.Vector3(); bb.getCenter(bc);
        ban.localToWorld(bc);
        var bq = bc.clone(); bq.project(cam);
        var corner = bb.max.clone().applyMatrix4(ban.matrixWorld).project(cam);
        banInfo = { world: bc.toArray().map(Math.round), ndc: [Math.round(bq.x * 100) / 100, Math.round(bq.y * 100) / 100],
          px: Math.round((bq.x + 1) / 2 * 878), py: Math.round((1 - bq.y) / 2 * 1310),
          size: Math.round((corner.x - bq.x) * 439), hasMap: !!ban.material.map, vis: ban.visible, op: ban.material.opacity };
      }
      return { balloon: balloon.position.toArray().map(Math.round), cam: cam.position.toArray().map(Math.round),
        ad: adTitle, adSub: adSub, adMap: !!(balloon.userData.skin.material.map), ban: banInfo,
        ndc: [Math.round(v.x * 100) / 100, Math.round(v.y * 100) / 100], inView: inView, near: near, objs: objs.slice(0, 10), hits: hits };
    };
    this.pull = function (i) { pullStop(i == null ? st.focus : i); };
    this.flip = RD.flip; this.back = function () { RD.back(); };
    this.act = S.onAct;
    this.goto = function (i) { focusStop(i); };
    this.map = mapSheet;
  }

  var CUR = null;
  window.MinestBalloon = {
    open: function (o) { if (!window.THREE) throw new Error('three.js is not loaded'); if (CUR) CUR.close(); CUR = new Balloon(o || {}); return CUR; },
    current: function () { return CUR; },
    themes: THEMES.map(function (t) { return { id: t.id, name: t.name, icon: t.icon }; })
  };
})();
</script>

<script>/* Minest · 3D 词卡 · 学生页 (vocab3d.html?code=CODE, /vocab) — only the words the teacher assigned, as 3D dynamic
   cards (the 3D Cover modes, card styles, the exploded learning card). No Dock, no system keys, no way into the rest
   of Minest (2026-11-20, the user). The student marks each word 我会了 / 再看看; progress goes to the teacher:
   /minest-live/{CODE}/players/{pid} = { name, seen, known, total, at, k: { cardKey: 1 seen | 2 known } }. */
(function () {
  'use strict';
  var DB = 'https://minest-33761-default-rtdb.firebaseio.com/minest-live/';
  var qs = new URLSearchParams(location.search), PREVIEW = qs.has('preview');
  var VIEW = window.__V3_VIEW || 'cards';   // the page: 'cards' (vocab3d.html), 'dyn' (vocab-drive.html: the Dynamic presentations), 'type' (vocab-type.html)
  function db(path, method, body) {
    return fetch(DB + path + '.json', { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('网络错误（' + r.status + '）'); return r.json(); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clean(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); }   // digits now; older letter codes still open
  function key(id) { return String(id).replace(/[.#$\[\]\/]/g, '_').slice(0, 120); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var $ = function (s, r) { return (r || document).querySelector(s); };

  /* ---------------- the board the 3D cards read (a stand-in for Minest's own board) ---------------- */
  var B = { id: 'vocab3d', title: '', columns: [] }, CARDS = [];
  function raw(c, col) {   // the fields the exploded card reads
    var o = { id: c.id, title: c.title, titleZh: c.titleZh || '', meaning: c.meaning || '', pron: c.pron || '', definitions: { en: c.defEn || '', zh: c.defZh || '' },
      examples: (c.examples || []).map(function (t) { return { text: t }; }), relatedWords: c.related || [], etymology: c.ety || '', hint: c.hint || '', img: c.img || '' };
    o.columnTitle = col.title; o.columnColor = col.color || ''; return o;
  }
  window.MinestAI = { board: function () { return B; }, boards: function () { return [B]; } };
  window.MinestImageViews = {
    cards: function (b) { var out = []; (b.columns || []).forEach(function (c) { (c.cards || []).forEach(function (k) { out.push(k); }); }); return out; },
    image: function (c) { return { thumb: (c && c.img) || '', full: (c && c.img) || '' }; },
    select: function () {}
  };
  window.__mnNoVoice = false;

  /* ---------------- join: the code, then a name ---------------- */
  var code = clean(qs.get('code') || qs.get('c') || ''), host = null, me = null, pid = null;
  var J = $('#v3-join');
  function joinView(step, err) {
    J.hidden = false;
    if (step === 'code') {
      J.innerHTML = '<div class="v3j-card"><div class="v3j-logo">◈</div><h1>3D 词卡</h1><p>输入老师给你的课堂码</p>' +
        '<input class="v3j-code" maxlength="8" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="课堂码" value="' + esc(code) + '">' +
        '<button type="button" class="v3j-go">进入</button><p class="v3j-err">' + esc(err || '') + '</p></div>';
      var inp = $('.v3j-code', J), go = function () { var c = clean(inp.value); if (c.length < 4) { $('.v3j-err', J).textContent = '课堂码不完整。'; return; } code = c; load(); };
      $('.v3j-go', J).onclick = go; inp.onkeydown = function (e) { if (e.key === 'Enter') go(); }; setTimeout(function () { inp.focus(); }, 50);
    } else if (step === 'name') {
      var saved = ls('minest.vocab3d.name') || '';
      J.innerHTML = '<div class="v3j-card"><div class="v3j-logo">◈</div><h1>' + esc(host.title) + '</h1><p>' + (host.words || 0) + ' 个词 · 写上你的名字，老师能看到你的进度</p>' +
        '<input class="v3j-name" maxlength="24" autocomplete="off" placeholder="你的名字" value="' + esc(saved) + '">' +
        '<button type="button" class="v3j-go">开始学习</button><p class="v3j-err">' + esc(err || '') + '</p></div>';
      var ni = $('.v3j-name', J), go2 = function () { var n = ni.value.trim().slice(0, 24); if (!n) { $('.v3j-err', J).textContent = '先写上名字。'; return; } ls('minest.vocab3d.name', n); start(n); };
      $('.v3j-go', J).onclick = go2; ni.onkeydown = function (e) { if (e.key === 'Enter') go2(); }; setTimeout(function () { ni.focus(); }, 50);
    } else {
      J.innerHTML = '<div class="v3j-card"><div class="v3j-logo spin">◈</div><p>' + esc(step) + '</p></div>';
    }
  }
  function load() {
    joinView('正在打开…');
    db(code + '/host').then(function (h) {
      if (!h || h.kind !== 'vocab3d' || !h.board) { joinView('code', '找不到这个课堂码，请检查一下。'); return; }
      host = h; pid = ls('minest.vocab3d.pid.' + code);
      if (PREVIEW) { start('老师预览'); return; }
      /* from the one student entry (/iphone?play): the code and the name were given there */
      var hand = null; try { hand = JSON.parse(sessionStorage.getItem('minest.vocab3d.join') || 'null'); } catch (e) {}
      if (hand && hand.code === code && hand.name && Date.now() - (hand.at || 0) < 6e5) { try { sessionStorage.removeItem('minest.vocab3d.join'); } catch (e) {} ls('minest.vocab3d.name', hand.name); start(hand.name); return; }
      var n = ls('minest.vocab3d.name'); if (pid && n) start(n); else joinView('name');
    }).catch(function (e) { joinView('code', '打不开：' + e.message); });
  }

  /* ---------------- study ---------------- */
  var K = {}, synced = '', syncT = 0, EXTRA = null;
  function counts() { var s = 0, k = 0; CARDS.forEach(function (c) { var v = K[key(c.id)]; if (v) s++; if (v === 2) k++; }); return { seen: s, known: k }; }
  function save() {
    ls('minest.vocab3d.k.' + code, JSON.stringify(K)); paintPill();
    if (PREVIEW || !pid || host.state === 'ended') return;
    clearTimeout(syncT); syncT = setTimeout(function () {
      var c = counts(), body = { name: me, seen: c.seen, known: c.known, total: CARDS.length, at: Date.now(), k: K }, s = JSON.stringify([c, K, EXTRA]);
      if (EXTRA) body.type = EXTRA;
      if (s === synced) return;
      db(code + '/players/' + pid, 'PATCH', body).then(function () { synced = s; }).catch(function () {});
    }, 900);
  }
  function start(name) {
    me = name; J.hidden = true; J.innerHTML = '';
    if (!pid && !PREVIEW) { pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); ls('minest.vocab3d.pid.' + code, pid); }
    try { K = JSON.parse(ls('minest.vocab3d.k.' + code) || '{}') || {}; } catch (e) { K = {}; }
    B.title = host.title; B.columns = (host.board.columns || []).map(function (col) { return { id: col.id, title: col.title, color: col.color, cards: (col.cards || []).map(function (c) { return raw(c, col); }) }; });
    CARDS = []; B.columns.forEach(function (c) { CARDS = CARDS.concat(c.cards); });
    $('#v3-ttl').textContent = host.title;
    if (host.state === 'ended') banner('老师已经结束了这个作业：还可以看，进度不再记录。');
    // (a teacher's preview says so in the Solo bar: no banner over the cards)
    save();   // the teacher sees the student as soon as they are in (on the level map too)
    route();
  }

  /* ---------------- the game modes: the teacher switches them on and off; the level map lights the ones that are on ---------------- */
  /* every game mode: 3D 词卡, the eleven Dynamic presentations (one page: vocab-drive.html), 3D Type */
  var MODE = [['cards', '🧊', '3D 词卡', '九种 3D 动态卡片，展开每个词'],
    ['drive', '🚗', 'Knowledge Drive', '坐车沿路看词，每个词表一条路'], ['train', '🚆', 'Knowledge Train', '坐在车窗边，每个词表一条铁路'],
    ['metro', '🚇', 'Knowledge Metro', '每个词表一条地铁线，每个词一站'], ['tower', '🏙', 'Knowledge Skyscraper', '坐电梯逛玻璃大楼，每层一组词'],
    ['roadtrip', '🛣', 'Road Trip', '沿着有名的公路自驾看词'], ['rack', '🎠', 'Rotating Rack', '旋转展架：转一转，挑一个拿出来'],
    ['library', '📚', 'Library Corridor', '走进图书馆长廊，从书架上抽书'], ['museum', '🏛', 'Museum Walkthrough', '逛博物馆：画、雕塑、展柜'],
    ['city', '🌆', 'Knowledge City', '逛街：每个词表一家店'], ['galaxy', '🌌', 'Knowledge Galaxy', '开飞船，降落在每个星球'],
    ['balloon', '🎈', 'Knowledge Balloon', '坐热气球飘过每个词'], ['type', '⌨️', '3D Type', '拼音打字：跟打 + 四关闯关']];
  var PAGE = {}; MODE.forEach(function (x) { PAGE[x[0]] = x[0] === 'cards' ? 'vocab3d.html' : x[0] === 'type' ? 'vocab-type.html' : 'vocab-drive.html'; });
  var HERE = VIEW === 'cards' ? 'vocab3d.html' : VIEW === 'type' ? 'vocab-type.html' : 'vocab-drive.html', CUR = null;
  function modes() { var m = host.modes; if (!m) { m = {}; m[host.view === 'drive' || host.view === 'type' ? host.view : 'cards'] = true; } return MODE.filter(function (x) { return m[x[0]]; }).map(function (x) { return x[0]; }); }
  function url(m, hub) { return PAGE[m || 'cards'] + '?code=' + encodeURIComponent(code) + (m ? '&m=' + m : '') + (hub ? '&hub=1' : '') + (PREVIEW ? '&preview=1' : ''); }
  var inMode = false;
  function route() {
    var on = modes(), want = qs.get('m');
    if (!qs.has('hub') && want && on.indexOf(want) >= 0) return go(want);
    if (!qs.has('hub') && on.length === 1) return go(on[0]);
    hub();
  }
  function go(m) {
    if (PAGE[m] !== HERE) { location.replace(url(m)); return; }
    CUR = m;
    var H = $('#v3-hub'); if (H) H.hidden = true;
    inMode = true; document.body.classList.add('v3-on');
    if (modes().length > 1) homeKey();
    begin(m);
  }
  function homeKey() {
    if ($('#v3-home')) return;
    var b = document.createElement('button'); b.type = 'button'; b.id = 'v3-home'; b.innerHTML = '<i>★</i>关卡'; b.title = '回到关卡地图';
    b.onclick = function () { location.href = url(null, true); };
    document.body.appendChild(b);
  }
  function stars() { try { var t = JSON.parse(ls('minest.vocab3d.type.' + code) || '{}'); var n = 0; Object.keys(t.lv || {}).forEach(function (k) { n += t.lv[k] || 0; }); return n; } catch (e) { return 0; } }
  function hub() {
    inMode = false;
    var H = $('#v3-hub'); if (!H) { H = document.createElement('div'); H.id = 'v3-hub'; document.body.appendChild(H); }
    H.hidden = false; document.body.classList.remove('v3-on');
    var on = modes(), c = counts(), N = CARDS.length || 1;
    var prog = {}, pct = {};
    MODE.forEach(function (x) { prog[x[0]] = '看过 ' + c.seen + ' / ' + CARDS.length; pct[x[0]] = c.seen / N; });
    prog.cards = '会了 ' + c.known + ' / ' + CARDS.length; pct.cards = c.known / N; prog.type = '★ ' + stars() + ' / 12'; pct.type = stars() / 12;
    H.innerHTML = '<div class="hb-in"><div class="hb-top"><b>' + esc(host.title) + '</b><span>' + esc(me) + '</span></div><h1>选一个关卡</h1>' +
      '<div class="hb-modes">' + MODE.map(function (x, i) {
        var open = on.indexOf(x[0]) >= 0;
        return '<button type="button" class="hb-m m' + i + (open ? '' : ' off') + '" data-m="' + x[0] + '"' + (open ? '' : ' disabled') + '><span class="ic">' + x[1] + '</span><b>' + x[2] + '</b><small>' + x[3] + '</small>' +
          (open ? '<span class="pg"><i style="width:' + Math.round(pct[x[0]] * 100) + '%"></i></span><em>' + prog[x[0]] + '</em>' : '<em class="lk">🔒 老师还没开放</em>') + '</button>';
      }).join('') + '</div>' + (host.state === 'ended' ? '<p class="hb-note">老师已经结束了这个作业：还可以玩，进度不再记录。</p>' : '') + '' + '</div>';
    [].forEach.call(H.querySelectorAll('[data-m]'), function (b) { b.onclick = function () { if (!b.disabled) go(b.getAttribute('data-m')); }; });
  }
  /* the teacher's switches, heard every few seconds: the level map follows; a mode switched off sends you back to it */
  setInterval(function () {
    if (!host || document.hidden) return;
    db(code + '/host/modes').then(function (m) {
      if (!m) return; var before = JSON.stringify(host.modes || null); host.modes = m;
      if (JSON.stringify(m) === before) return;
      if (inMode && CUR && !m[CUR]) { banner('老师关闭了这个模式，回到关卡地图…'); setTimeout(function () { location.href = url(null, true); }, 1800); return; }
      if (!inMode && $('#v3-hub') && !$('#v3-hub').hidden) hub();
      if (inMode && modes().length > 1) homeKey();
    }).catch(function () {});
  }, 6000);

  function begin(m) {
    document.title = host.title + ' · ' + (MODE.filter(function (x) { return x[0] === m; })[0] || ['', '', '3D 词卡'])[2];
    if (VIEW === 'dyn') { dyn(m); paintPill(); save(); return; }
    if (VIEW === 'type') {
      if (window.V3Type) window.V3Type.start({ cards: CARDS, code: code, mark: function (c, v) { var k0 = key(c.id); if ((K[k0] || 0) < v) { K[k0] = v; save(); } }, extra: function (o) { EXTRA = o; synced = ''; save(); } });
      paintPill(); save(); return;
    }
    try { if (!window.MinestCoverModes.get()) window.MinestCoverModes.set('flow'); } catch (e) {}
    try { window.dispatchEvent(new Event('minest:image-assets')); } catch (e) {}
    wrapExplode(); paintPill(); save();
  }

  /* ---------------- Knowledge Drive: the words as billboards along a road (each list a road) ---------------- */
  function driveBoard() {   // the drive reads cards in Minest's shape: title, titleZh, back, a cover picture
    return { id: 'vocab3d', title: B.title, columns: B.columns.map(function (col) {
      return { id: col.id, title: col.title, color: col.color, cards: col.cards.map(function (c) {
        var back = [c.pron, c.meaning || c.definitions.en, c.definitions.zh].filter(Boolean).join('\n');
        var o = { id: c.id, title: c.title, titleZh: c.titleZh || '', back: back, notes: c.examples.length ? c.examples.map(function (e) { return e.text; }).join('\n') : '' };
        if (c.img) o.cover = { type: 'image', value: c.img };
        return o;
      }) };
    }) };
  }
  var DB2 = null, DYN = { drive: 'MinestDrive', roadtrip: 'MinestDrive', train: 'MinestTrain', metro: 'MinestMetro', tower: 'MinestTower', rack: 'MinestRack', library: 'MinestLibrary', museum: 'MinestMuseum', city: 'MinestCity', galaxy: 'MinestGalaxy', balloon: 'MinestBalloon' };
  function dyn(m) {
    var end = $('#v3-end'); end.hidden = true;
    var api = window[DYN[m] || 'MinestDrive'];
    if (!api || !window.THREE) { banner('这台设备打不开这个 3D 呈现（WebGL 不可用）。'); return; }
    DB2 = DB2 || driveBoard();
    var P = { boards: function () { return [DB2]; }, openCard: null };
    var o = { source: { type: 'board', bid: DB2.id }, provider: P, fresh: false, onExit: function () { end.hidden = false; } };
    if (m === 'roadtrip') o.style = 'ca1';
    try { api.open(o); } catch (e) { banner('打不开：' + (e.message || e)); }
  }
  $('#v3-end [data-again]') && ($('#v3-end [data-again]').onclick = function () { dyn(CUR || 'drive'); });
  function driveFocus() { if (CUR !== 'drive' && CUR !== 'roadtrip') return null; try { var d = window.MinestDrive && MinestDrive.current(); var f = d && d.state && d.state().focus; return f || null; } catch (e) { return null; } }
  function banner(t) { var b = $('#v3-banner'); b.textContent = t; b.hidden = false; }

  /* the word in view: the exploded card open on it; "我会了" / "再看看" */
  var cur = null;
  function cardOf(it) { var id = it && (it.id || (it.raw && it.raw.id)); for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === id) return CARDS[i]; return null; }
  function wrapExplode() {
    var X = window.MinestExplode; if (!X || X.__v3) return; X.__v3 = 1;
    var open = X.open; X.open = function (it) { var c = cardOf(it); if (c) { cur = c; if (!K[key(c.id)]) { K[key(c.id)] = 1; save(); } } var r = open.apply(this, arguments); paintMark(); return r; };
  }
  function byTitle() { var t = $('#xl .xl-title'); if (!t) return null; var s = t.textContent.replace(/^Exploded Learning Card · /, ''); for (var i = 0; i < CARDS.length; i++) if (CARDS[i].title === s) return CARDS[i]; return null; }
  function paintMark() {
    var m = $('#v3-mark'), open;
    if (VIEW === 'type') { m.hidden = true; document.body.classList.toggle('vt-playing', !!(document.getElementById('vt-play') && !document.getElementById('vt-play').hidden)); return; }
    if (VIEW === 'dyn') {   // the drive: the billboard in focus is the word in view
      var t = driveFocus(); open = !!t;
      if (t) { var c0 = CARDS.filter(function (x) { return x.title === t; })[0]; if (c0 && c0 !== cur) { cur = c0; if (!K[key(c0.id)]) { K[key(c0.id)] = 1; save(); } } }
      m.hidden = !open || !cur; document.body.classList.toggle('v3-xl', open);
      if (!m.hidden) { var v0 = K[key(cur.id)]; $('[data-known]', m).classList.toggle('on', v0 === 2); $('[data-again]', m).classList.toggle('on', v0 === 1); }
      return;
    }
    open = !!document.getElementById('xl');
    if (open) { var c = byTitle(); if (c && c !== cur) { cur = c; if (!K[key(c.id)]) { K[key(c.id)] = 1; save(); } } }
    m.hidden = !open || !cur; document.body.classList.toggle('v3-xl', open);
    if (!m.hidden) { var v = K[key(cur.id)]; $('[data-known]', m).classList.toggle('on', v === 2); $('[data-again]', m).classList.toggle('on', v === 1); }
  }
  setInterval(paintMark, 350);
  function mark(v) { if (!cur) return; K[key(cur.id)] = v; save(); paintMark(); try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  $('#v3-mark [data-known]').onclick = function () { mark(2); };
  $('#v3-mark [data-again]').onclick = function () { mark(1); };

  /* the progress pill; a tap lists the words (a tap on one opens it) */
  function paintPill() {
    var c = counts(), n = CARDS.length || 1;
    $('#v3-n').textContent = c.known + ' / ' + CARDS.length;
    $('#v3-ring').style.setProperty('--p', (c.known / n * 100).toFixed(1));
    $('#v3-seen').textContent = '看过 ' + c.seen;
  }
  $('#v3-pill').onclick = function () {
    var s = $('#v3-sheet'); if (!s.hidden) { s.hidden = true; return; }
    s.innerHTML = '<div class="v3s-hd"><b>' + esc(host.title) + '</b><span>' + esc(me) + '</span><button type="button" data-x aria-label="关闭">✕</button></div><div class="v3s-tabs"><button data-f="all" class="on">全部</button><button data-f="again">再看看</button><button data-f="new">没看过</button><button data-f="known">会了</button></div><div class="v3s-list"></div>';
    var f = 'all';
    function list() {
      $('.v3s-list', s).innerHTML = CARDS.filter(function (c) { var v = K[key(c.id)]; return f === 'all' || (f === 'known' && v === 2) || (f === 'again' && v === 1) || (f === 'new' && !v); }).map(function (c) {
        var v = K[key(c.id)]; return '<button data-id="' + esc(c.id) + '"><i class="' + (v === 2 ? 'k' : v === 1 ? 'a' : '') + '"></i><b>' + esc(c.title) + '</b><small>' + esc(c.titleZh || c.meaning || '') + '</small></button>';
      }).join('') || '<p class="v3s-none">这里没有词。</p>';
      [].forEach.call(s.querySelectorAll('.v3s-list [data-id]'), function (b) { if (VIEW !== 'cards') { b.disabled = true; return; } b.onclick = function () { var c = CARDS.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; s.hidden = true; openWord(c); }; });
    }
    [].forEach.call(s.querySelectorAll('[data-f]'), function (b) { b.onclick = function () { f = b.getAttribute('data-f'); [].forEach.call(s.querySelectorAll('[data-f]'), function (x) { x.classList.toggle('on', x === b); }); list(); }; });
    $('[data-x]', s).onclick = function () { s.hidden = true; };
    list(); s.hidden = false;
  };
  function openWord(c) {
    var slot = document.querySelector('.sf-slot[data-sf-view="coverflow"]'); if (!c || !slot || !window.MinestExplode) return;
    var it = { raw: c, id: c.id, title: c.title, sub: c.columnTitle, src: c.img || '', desc: c.meaning || '', color: c.columnColor || '' };
    window.MinestExplode.open(it, CARDS.map(function (x) { return { raw: x, id: x.id, title: x.title, sub: x.columnTitle, src: x.img || '', desc: x.meaning || '' }; }), { container: slot });
  }

  /* students stay here: no links out, no right-click menu into the rest of the site */
  document.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('a[href]'); if (a) e.preventDefault(); }, true);
  if (code) load(); else joinView('code');
})();
</script>
</body>
</html>
