<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b16">
<title>动态呈现 · Minest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>/* Minest · 3D 词卡 · 学生页 */
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; color: #e8eefb; font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { position: fixed; inset: 0; }
.sf-slot[data-sf-view="coverflow"] { position: absolute; inset: 0; overflow: hidden; }
/* 3D Cover here is drawn by the modes' engine (Minest's own lives in its board): the cards stand on a reflection */
#cm-ov.flow .cm-orb { -webkit-box-reflect: below 8px linear-gradient(transparent 58%, rgba(255,255,255,.26)); }
/* nothing that leads out of the words: no AI call, no "open the card", no style chip */
#xl .xl-ai, #xl [data-a="card"], #cs-btn { display: none !important; }
/* no Dock here: the controls sit lower */
#cm-ov .cm-gbar { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px) !important; }
#cm-ov .cm-hback { bottom: calc(env(safe-area-inset-bottom, 0px) + 22px) !important; }
#cm-bar { top: calc(env(safe-area-inset-top, 0px) + 54px) !important; }

/* the join card */
#v3-join { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: radial-gradient(90% 70% at 50% 20%, rgba(56,189,248,.22), transparent 60%), radial-gradient(80% 60% at 80% 100%, rgba(167,139,250,.18), transparent 60%), #070b16; }
#v3-join[hidden] { display: none; }
.v3j-card { width: min(380px, 100%); text-align: center; padding: 30px 24px 22px; border-radius: 28px; background: linear-gradient(180deg, rgba(30,36,52,.78), rgba(14,18,28,.82)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 40px 90px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.v3j-logo { font-size: 42px; line-height: 1; color: #7dd3fc; text-shadow: 0 0 24px rgba(125,211,252,.7); margin-bottom: 10px; }
.v3j-logo.spin { animation: v3spin 1.4s linear infinite; display: inline-block; }
@keyframes v3spin { to { transform: rotate(360deg); } }
.v3j-card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 750; letter-spacing: .01em; }
.v3j-card p { margin: 0 0 18px; color: #93a0b8; font-size: 14px; line-height: 1.5; }
.v3j-card input { display: block; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #fff; outline: none; font: 600 18px inherit; text-align: center; }
.v3j-card input:focus { border-color: rgba(125,211,252,.6); box-shadow: 0 0 0 4px rgba(125,211,252,.15); }
.v3j-card .v3j-code { font: 800 28px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .22em; text-transform: uppercase; }
.v3j-go { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 16px; font: 700 16px inherit; color: #04203a; background: linear-gradient(180deg, #a5e3fd, #38bdf8); cursor: pointer; box-shadow: 0 12px 30px -10px rgba(56,189,248,.7); }
.v3j-go:active { transform: scale(.98); }
.v3j-err { min-height: 18px; margin: 12px 0 0 !important; color: #fca5a5 !important; font-size: 13px !important; }

/* the title, top left */
#v3-top { position: fixed; z-index: 2200; left: calc(env(safe-area-inset-left, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px); top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; align-items: center; gap: 10px; pointer-events: none; }
#v3-top b { font: 700 15px/1.2 inherit; color: #f1f5f9; text-shadow: 0 1px 8px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#v3-top i { font-style: normal; font-size: 18px; color: #7dd3fc; text-shadow: 0 0 12px rgba(125,211,252,.7); }
body:not(.v3-on) #v3-top, body:not(.v3-on) #v3-pill { display: none; }
#v3-banner { position: fixed; z-index: 2200; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 100px); transform: translateX(-50%); padding: 7px 14px; border-radius: 12px; background: rgba(120,53,15,.75); border: 1px solid rgba(253,186,116,.35); color: #fed7aa; font-size: 12.5px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
#v3-banner[hidden] { display: none; }

/* progress, bottom right */
#v3-pill { position: fixed; z-index: 2200; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid rgba(255,255,255,.12); border-radius: 99px; color: #e8eefb; background: linear-gradient(180deg, rgba(30,34,46,.78), rgba(14,16,22,.8)); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); box-shadow: 0 12px 30px -10px rgba(0,0,0,.6); cursor: pointer; font: inherit; }
#v3-ring { --p: 0; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(#7dd3fc calc(var(--p) * 1%), rgba(255,255,255,.1) 0); display: grid; place-items: center; }
#v3-ring::after { content: "✓"; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #111522; color: #a7f3d0; font-size: 13px; font-weight: 800; }
#v3-pill span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
#v3-pill b { font: 750 14px ui-monospace, "SF Mono", Menlo, monospace; }
#v3-pill small { font-size: 11px; color: #93a0b8; }
body.v3-xl #v3-pill { display: none; }

/* 我会了 / 再看看 while a word is open */
#v3-mark { position: fixed; z-index: 2600; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: translateX(-50%); display: flex; gap: 10px; padding: 6px; border-radius: 20px; background: rgba(10,14,26,.72); border: 1px solid rgba(255,255,255,.12); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 16px 40px -14px rgba(0,0,0,.7); }
#v3-mark[hidden] { display: none; }
#v3-mark button { white-space: nowrap; border: 1px solid transparent; border-radius: 15px; padding: 11px 18px; font: 700 15px inherit; cursor: pointer; color: #e8eefb; background: rgba(255,255,255,.07); }
#v3-mark [data-known] { color: #052e1f; background: linear-gradient(180deg, #a7f3d0, #34d399); }
#v3-mark [data-again].on { border-color: rgba(253,186,116,.7); color: #fed7aa; background: rgba(253,186,116,.16); }
#v3-mark [data-known].on { box-shadow: 0 0 0 3px rgba(167,243,208,.35); }
#v3-mark [data-known].on::before { content: "✓ "; }

/* the word list */
#v3-sheet { position: fixed; z-index: 2700; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: min(360px, calc(100vw - 24px)); max-height: min(70vh, 560px); display: flex; flex-direction: column; border-radius: 22px; background: linear-gradient(180deg, rgba(28,32,44,.95), rgba(14,17,26,.96)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 70px -20px rgba(0,0,0,.8); overflow: hidden; }
#v3-sheet[hidden] { display: none; }
.v3s-hd { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px 16px; }
.v3s-hd b { font-size: 15px; } .v3s-hd span { color: #93a0b8; font-size: 12.5px; }
.v3s-hd button { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); color: #cfd8ea; cursor: pointer; }
.v3s-tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
.v3s-tabs button { flex: 1; border: 0; border-radius: 10px; padding: 7px 0; font: 600 12.5px inherit; color: #93a0b8; background: rgba(255,255,255,.04); cursor: pointer; }
.v3s-tabs button.on { color: #fff; background: rgba(255,255,255,.14); }
.v3s-list { overflow: auto; padding: 0 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.v3s-list button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 12px; padding: 10px 10px; background: none; color: #e8eefb; cursor: pointer; font: inherit; }
.v3s-list button:hover { background: rgba(255,255,255,.06); }
.v3s-list i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.18); }
.v3s-list i.k { background: #34d399; box-shadow: 0 0 8px #34d399; } .v3s-list i.a { background: #fdba74; }
.v3s-list b { font-size: 15px; font-weight: 650; white-space: nowrap; }
.v3s-list small { color: #8190a8; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v3s-none { color: #8190a8; text-align: center; font-size: 13px; }
/* a word open: its card has the screen — the mode bar and the title step aside */
body.v3-xl #cm-bar, body.v3-xl #v3-top, body.v3-xl #cm-pick { display: none !important; }
#v3-mark { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
/* the roots layer with no breakdown of its own (the AI one is not offered here) */
#xl .xl-c[data-k="ety"]:has(.xl-ai)::before { content: "这个词没有可拆的词根。点「Word」层听发音，或者翻到下一层。"; position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); color: #b9d0ff; font-size: 14px; line-height: 1.6; text-align: center; opacity: .85; }

/* ===== the look of Minest Live (Blooket-like): a purple room, white chunky cards, Titan One titles, buttons that press down (2026-11-20, the user) ===== */
:root { --bk-ink: #2f2a3d; --bk-mute: #7a7090; --bk-purp: #7b2ff7; --bk-teal: #0bc2cf; --bk-gold: #ffcc00; --bk-title: "Titan One", "Lilita One", Nunito, system-ui, sans-serif; --bk-body: Nunito, "Nunito Sans", ui-rounded, system-ui, sans-serif; }
#v3-join, #v3-end { background: repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 26px, transparent 26px 52px), radial-gradient(1200px 700px at 15% -10%, #a46bff, transparent 60%), linear-gradient(160deg, #6a22ee 0%, #7b2ff7 45%, #9b4dff 100%) !important; }
.v3j-card { background: #fff !important; color: var(--bk-ink); border: 0 !important; border-radius: 24px !important; box-shadow: inset 0 -7px 0 rgba(0,0,0,.09), 0 14px 34px rgba(40,0,90,.35) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; font-family: var(--bk-body); font-weight: 800; }
.v3j-logo { color: var(--bk-gold) !important; text-shadow: 0 4px 0 rgba(0,0,0,.15) !important; font-size: 50px !important; }
.v3j-card h1 { font: 400 30px/1.15 var(--bk-title) !important; color: var(--bk-purp); letter-spacing: .02em; }
.v3j-card p { color: var(--bk-mute) !important; font-weight: 800; font-size: 15px !important; }
.v3j-card input { background: #fff !important; color: var(--bk-ink) !important; border: 3px solid #e4d9ff !important; border-radius: 14px !important; font: 900 20px var(--bk-body) !important; }
.v3j-card input:focus { border-color: #9b4dff !important; box-shadow: none !important; }
.v3j-card .v3j-code { font: 400 34px var(--bk-title) !important; letter-spacing: .18em; color: var(--bk-purp) !important; }
.v3j-go { background: var(--bk-teal) !important; color: #fff !important; font: 400 20px var(--bk-title) !important; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.18); border-radius: 16px !important; padding: 13px 14px 17px !important; box-shadow: inset 0 -6px 0 rgba(0,0,0,.22), 0 4px 10px rgba(40,0,90,.2) !important; }
.v3j-go:active { transform: translateY(3px) !important; box-shadow: inset 0 -2px 0 rgba(0,0,0,.22) !important; }
.v3j-err { color: #e8505b !important; }
#v3-top b { font: 400 18px var(--bk-title) !important; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.45), 0 0 14px rgba(0,0,0,.35) !important; }
#v3-top i { color: var(--bk-gold) !important; text-shadow: 0 2px 0 rgba(0,0,0,.3) !important; }
#v3-banner { background: var(--bk-gold) !important; color: var(--bk-ink) !important; border: 0 !important; border-radius: 14px !important; font: 800 13.5px var(--bk-body) !important; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15) !important; }
#v3-pill { background: #fff !important; color: var(--bk-ink) !important; border: 0 !important; box-shadow: inset 0 -5px 0 rgba(0,0,0,.09), 0 6px 16px rgba(0,0,0,.3) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; font-family: var(--bk-body); }
#v3-pill b { font: 400 16px var(--bk-title) !important; color: var(--bk-purp); letter-spacing: .04em; } #v3-pill small { color: var(--bk-mute) !important; font-weight: 800; }
#v3-ring { background: conic-gradient(var(--bk-teal) calc(var(--p) * 1%), #e4d9ff 0) !important; } #v3-ring::after { background: #fff !important; color: var(--bk-teal) !important; }
#v3-mark { background: #fff !important; border: 0 !important; border-radius: 20px !important; box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), 0 10px 26px rgba(0,0,0,.35) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
#v3-mark button { font: 400 17px var(--bk-title) !important; letter-spacing: .02em; border: 0 !important; border-radius: 14px !important; padding: 10px 18px 14px !important; color: #fff !important; text-shadow: 0 2px 0 rgba(0,0,0,.18); box-shadow: inset 0 -5px 0 rgba(0,0,0,.22) !important; }
#v3-mark [data-again] { background: #ff9f1c !important; } #v3-mark [data-known] { background: #22b35e !important; }
#v3-mark button.on { outline: 4px solid rgba(255,204,0,.9); outline-offset: 1px; }
#v3-mark button:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.22) !important; }
#v3-sheet { background: #fff !important; color: var(--bk-ink); border: 0 !important; box-shadow: inset 0 -7px 0 rgba(0,0,0,.08), 0 20px 50px rgba(0,0,0,.45) !important; font-family: var(--bk-body); font-weight: 800; }
.v3s-hd b { font: 400 18px var(--bk-title); color: var(--bk-purp); letter-spacing: .02em; } .v3s-hd span { color: var(--bk-mute) !important; }
.v3s-hd button { background: #f1ebff !important; color: var(--bk-purp) !important; border-radius: 11px !important; box-shadow: inset 0 -3px 0 rgba(0,0,0,.1); font-family: var(--bk-title); }
.v3s-tabs button { background: #f1ebff !important; color: var(--bk-purp) !important; font: 800 13px var(--bk-body) !important; box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); }
.v3s-tabs button.on { background: var(--bk-purp) !important; color: #fff !important; }
.v3s-list button { color: var(--bk-ink) !important; font-family: var(--bk-body) !important; } .v3s-list button:hover { background: #f6f2ff !important; }
.v3s-list b { font-weight: 900 !important; } .v3s-list small { color: var(--bk-mute) !important; }
.v3s-list i { background: #e4d9ff !important; } .v3s-list i.k { background: #22b35e !important; box-shadow: none !important; } .v3s-list i.a { background: #ff9f1c !important; }

/* the level map: one big tile per game mode — lit when the teacher has it on, grey and locked when not */
#v3-hub { position: fixed; inset: 0; z-index: 2147483600; overflow: auto; display: grid; place-items: center; padding: 24px 16px; background: repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 26px, transparent 26px 52px), radial-gradient(1200px 700px at 15% -10%, #a46bff, transparent 60%), linear-gradient(160deg, #6a22ee 0%, #7b2ff7 45%, #9b4dff 100%); font-family: var(--bk-body); font-weight: 800; color: #fff; }
#v3-hub[hidden] { display: none; }
.hb-in { width: min(860px, 100%); }
.hb-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.hb-top b { font: 400 20px var(--bk-title); letter-spacing: .02em; text-shadow: 0 3px 0 rgba(0,0,0,.2); } .hb-top span { padding: 6px 14px 9px; border-radius: 12px; background: #fff; color: var(--bk-purp); box-shadow: inset 0 -4px 0 rgba(0,0,0,.1); }
#v3-hub h1 { margin: 6px 0 18px; font: 400 40px var(--bk-title); letter-spacing: .02em; text-shadow: 0 4px 0 rgba(0,0,0,.22); text-align: center; }
.hb-modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.hb-m { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 18px 18px; border: 0; border-radius: 22px; color: #fff; cursor: pointer; text-align: center; font-family: var(--bk-body); box-shadow: inset 0 -8px 0 rgba(0,0,0,.22), 0 10px 24px rgba(40,0,90,.3); }
.hb-m.m0 { background: #0bc2cf; } .hb-m.m1 { background: #ff9f1c; } .hb-m.m2 { background: #3d8bfd; } .hb-m.m3 { background: #7b2ff7; } .hb-m.m4 { background: #00a69c; } .hb-m.m5 { background: #e8505b; } .hb-m.m6 { background: #ff4f7b; }
.hb-m.m7 { background: #a46bff; } .hb-m.m8 { background: #c98a1c; } .hb-m.m9 { background: #ff7a59; } .hb-m.m10 { background: #4b11b8; } .hb-m.m11 { background: #22b35e; } .hb-m.m12 { background: #ff4f7b; }
.hb-modes { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)) !important; } .hb-m { padding: 16px 12px 14px !important; } .hb-m .ic { font-size: 42px !important; } .hb-m b { font-size: 19px !important; } .hb-m small { min-height: 0 !important; }
.hb-m .ic { font-size: 54px; line-height: 1.1; filter: drop-shadow(0 4px 0 rgba(0,0,0,.15)); }
.hb-m b { font: 400 24px var(--bk-title); letter-spacing: .02em; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
.hb-m small { font-size: 13.5px; color: rgba(255,255,255,.92); min-height: 2.6em; }
.hb-m .pg { width: 100%; height: 12px; border-radius: 6px; background: rgba(0,0,0,.18); overflow: hidden; margin-top: 4px; } .hb-m .pg i { display: block; height: 100%; border-radius: 6px; background: var(--bk-gold); }
.hb-m em { font-style: normal; font: 400 15px var(--bk-title); letter-spacing: .03em; }
.hb-m:not(.off):hover { filter: brightness(1.05); } .hb-m:not(.off):active { transform: translateY(4px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
.hb-m.off { background: #c9c2d8 !important; color: #fff; cursor: default; box-shadow: inset 0 -8px 0 rgba(0,0,0,.12); } .hb-m.off .ic { filter: grayscale(1); opacity: .6; } .hb-m em.lk { font: 800 14px var(--bk-body); }
.hb-note { margin: 18px auto 0; width: fit-content; padding: 8px 16px 11px; border-radius: 14px; background: var(--bk-gold); color: var(--bk-ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); font-size: 14px; }
/* back to the level map, from inside a mode */
#v3-home { position: fixed; z-index: 2147483500; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; align-items: center; gap: 6px; padding: 7px 16px 11px; border: 0; border-radius: 14px; background: #fff; color: var(--bk-purp); font: 400 16px var(--bk-title); letter-spacing: .03em; box-shadow: inset 0 -5px 0 rgba(0,0,0,.1), 0 6px 16px rgba(0,0,0,.35); cursor: pointer; }
#v3-home i { font-style: normal; color: var(--bk-gold); } #v3-home:active { transform: translateX(-50%) translateY(3px); }
body.v3-xl #v3-home, body.vt-playing #v3-home { display: none; }

/* notes sit top left, small, under the title — never over the cards in the middle (2026-11-20, the user) */
#v3-banner { left: calc(env(safe-area-inset-left, 0px) + 14px) !important; right: auto !important; top: calc(env(safe-area-inset-top, 0px) + 46px) !important; transform: none !important; max-width: min(360px, 60vw) !important; white-space: normal !important; font-size: 12.5px !important; padding: 6px 12px 8px !important; }

/* Light FX: the room's light effects (FBFX); its own floating key gives way to the mode bar's */
.fbfx-btn { display: none !important; }
/* Card FX */
#cm-ov .cm-c > .cfx { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 40; display: none; }
html.cfx-ink #cm-ov .cm-c > .cfx, html.cfx-liq #cm-ov .cm-c > .cfx { display: block; }
html.cfx-ink #cm-ov .cm-c > .cfx { background: radial-gradient(circle, rgba(255,255,255,.5) .7px, transparent 1.3px) 0 0 / 6px 6px, radial-gradient(circle, rgba(170,200,255,.35) .7px, transparent 1.3px) 3px 3px / 6px 6px, linear-gradient(160deg, rgba(30,34,52,.94), rgba(14,16,26,.96)); animation: cfxink 2.8s linear infinite; transition: opacity .35s ease; }
html.cfx-ink #cm-ov .cm-c.act > .cfx, html.cfx-ink #cm-ov .cm-c:hover > .cfx { opacity: 0; }

  // Ensure every shop along the street gets a DISTINCT archetype first so adjacent stores never look identical
  function assignShopType(title, idx) {
    var s = String(title || '').toLowerCase();
    var preferred = -1;
    if (/book|read|lit|novel|elar|书|阅读|文学/.test(s)) preferred = 0;
    else if (/music|song|album|audio|音|歌|唱/.test(s)) preferred = 1;
    else if (/movie|film|cinema|tv|影|视|剧/.test(s)) preferred = 2;
    else if (/philo|cafe|plan|found|思|哲|咖啡/.test(s)) preferred = 3;
    else if (/art|design|draw|visual|美|艺|设/.test(s)) preferred = 4;
    else if (/game|play|arcade|pe|游|玩|体/.test(s)) preferred = 5;
    else if (/word|vocab|lang|english|词|语|英/.test(s)) preferred = 6;
    else if (/sci|math|phys|chem|科|理|数/.test(s)) preferred = 7;
    else if (/hist|social|ss|古|史|社/.test(s)) preferred = 8;

    var chosen = (preferred >= 0 && idx < 2) ? preferred : (idx % SHOP_TYPES.length);
    return SHOP_TYPES[chosen];
  }

  function buildCityShops(P, src) {
    var C = { key: 'city:demo', groups: [], all: [] };
    try { C = X.collect(P, src || { type: 'workspace' }); } catch (e) {}
    var shops = [];
    var usedKinds = {};

    (C.groups || []).forEach(function (g) {
      if (!g.items || !g.items.length || shops.length >= 10) return;
      var stype = assignShopType(g.title, shops.length);
      if (usedKinds[stype.kind]) {
        for (var m = 0; m < SHOP_TYPES.length; m++) {
          var cand = SHOP_TYPES[(shops.length + m) % SHOP_TYPES.length];
          if (!usedKinds[cand.kind]) { stype = cand; break; }
        }
      }
      usedKinds[stype.kind] = true;
      shops.push({
        id: g.id,
        title: g.title,
        baseTitle: g.title,
        color: g.color || stype.neon,
        type: stype,
        items: g.items.slice(0, 3)
      });
    });

    var dIdx = 0;
    while (shops.length < 18 && dIdx < DEMO_SHOPS.length) {
      var ds = DEMO_SHOPS[dIdx++];
      var stype = SHOP_TYPES[ds.kind % SHOP_TYPES.length];
      var demoGroup = { id: 'demo-shop-' + dIdx, title: ds.title, color: ds.color };
      var items = ds.items.map(function (c, ci) {
        var ref = { bid: 'demo', col: demoGroup.id, id: demoGroup.id + '-c' + ci };
        return {
          ref: ref,
          g: demoGroup,
          I: {
            ref: ref,
            card: { title: c.title, desc: c.back },
            list: { title: ds.title },
            board: { title: 'Knowledge Metropolis' },
            title: c.title,
            zh: c.zh,
            sub: c.zh,
            back: c.back,
            desc: c.back,
            notes: '',
            checklist: [],
            labels: [stype.tag],
            type: stype.carrier === 'book' ? 'book' : stype.carrier === 'frame' ? 'poster' : 'concept',
            sig: K.hash(c.title + '|' + c.zh)
          }
        };
      });
      shops.push({
        id: demoGroup.id,
        title: ds.title,
        baseTitle: ds.title,
        color: ds.color,
        type: stype,
        items: items
      });
    }

    var allItems = [];
    shops.forEach(function (sh, si) {
      sh.k = si;
      sh.side = si % 2 === 0 ? -1 : 1; // Left (-x) and Right (+x) sides of the avenue
      sh.pair = si >> 1;
      sh.z = -(sh.pair * 15.5 + 11 + (si % 2) * 3.8);
      sh.items.forEach(function (it, j) {
        it.shopIdx = si;
        it.winIdx = j;
        allItems.push(it);
      });
    });
    return { key: C.key || 'city:workspace', shops: shops, all: allItems };
  }

  // ---------------- Bespoke Storefront Fascia & Blade Sign Textures ----------------
  function makeFasciaSignTex(sh, isNight) {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 256;
    var x = c.getContext('2d');
    var st = sh.type;

    // Architectural Fascia Background tailored to shop archetype
    var bg = isNight ? '#090d1a' : (st.arch === 'modern_gallery' ? '#ffffff' : st.arch === 'parisian_bistro' ? '#1e3a2f' : '#161b26');
    var fg = (!isNight && st.arch === 'modern_gallery') ? '#0f172a' : '#ffffff';
    var accent = isNight ? st.neon : st.gold;

    x.fillStyle = bg;
    K.rr(x, 6, 6, 1012, 244, 22);
    x.fill();

    // Double architectural border with corner rivets/ornaments
    x.lineWidth = isNight ? 10 : 7;
    x.strokeStyle = accent;
    K.rr(x, 14, 14, 996, 228, 16);
    x.stroke();

    x.lineWidth = 2;
    x.strokeStyle = isNight ? 'rgba(255,255,255,0.28)' : 'rgba(212,175,55,0.45)';
    K.rr(x, 26, 26, 972, 204, 10);
    x.stroke();

    // Cinema marquee bulb dots along top & bottom!
    if (st.kind === 'movie') {
      x.fillStyle = '#fde047';
      for (var bx = 36; bx < 990; bx += 28) {
        x.beginPath(); x.arc(bx, 20, 5, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(bx, 236, 5, 0, Math.PI * 2); x.fill();
      }
    }

    // Left Emblem Medallion
    x.fillStyle = accent;
    K.rr(x, 42, 42, 172, 172, st.arch === 'art_deco' || st.arch === 'neoclassical' ? 86 : 26);
    x.fill();
    x.font = '92px ' + K.FONT;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(st.icon, 128, 132);

    // Shop Name in bespoke typography
    x.textAlign = 'left';
    x.fillStyle = fg;
    var titleFont = (st.kind === 'book' || st.kind === 'hist' || st.kind === 'cafe') ? 'Georgia, "Times New Roman", serif' : K.FONT;
    var t = sh.title;
    x.font = '800 58px ' + titleFont;
    while (x.measureText(t).width > 740 && t.length > 4) t = t.slice(0, -2) + '…';
    x.fillText(t, 242, 98);

    // Category Tag + Vitrine Showcase count pill
    x.fillStyle = accent;
    x.font = '700 30px ' + K.FONT;
    x.fillText('★ ' + st.tag.toUpperCase() + '  ·  ' + sh.items.length + ' CURATED VITRINE DISPLAYS', 244, 168);

    // Est. / Street Number badge on right
    x.textAlign = 'right';
    x.fillStyle = isNight ? 'rgba(255,255,255,0.55)' : 'rgba(212,175,55,0.85)';
    x.font = '700 24px monospace';
    x.fillText('NO. ' + (100 + sh.k * 12) + ' AVE', 974, 58);

    var tx = new T.CanvasTexture(c);
    tx.anisotropy = 4;
    return tx;
  }

  // Projecting Vertical Metropolitan Blade Sign Texture (Ginza / Broadway / Fifth Ave style)
  function makeBladeSignTex(sh, isNight) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 768;
    var x = c.getContext('2d');
    var st = sh.type;
    var bg = isNight ? '#070b16' : '#181824';
    var border = isNight ? st.neon : st.gold;

    x.fillStyle = bg;
    K.rr(x, 8, 8, 240, 752, 28);
    x.fill();
    x.lineWidth = 10;
    x.strokeStyle = border;
    K.rr(x, 14, 14, 228, 740, 22);
    x.stroke();

    // Top Icon Circle
    x.fillStyle = border;
    x.beginPath();
    x.arc(128, 102, 58, 0, Math.PI * 2);
    x.fill();
    x.font = '64px ' + K.FONT;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(st.icon, 128, 105);

    // Vertical stacked word characters or rotated title
    x.save();
    x.translate(128, 435);
    x.rotate(-Math.PI / 2);
    x.fillStyle = '#ffffff';
    x.font = '800 44px ' + K.FONT;
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    var label = sh.title.length > 16 ? st.blade : sh.title.toUpperCase();
    x.fillText(label, 0, -14);
    x.fillStyle = border;
    x.font = '700 24px ' + K.FONT;
    x.fillText(st.tag.toUpperCase(), 0, 28);
    x.restore();

    // Bottom directional arrow toward vitrine
    x.fillStyle = border;
    x.font = '700 26px monospace';
    x.fillText('OPEN 24H', 128, 718);

    var tx = new T.CanvasTexture(c);
    tx.anisotropy = 4;
    return tx;
  }

  // Rich Interior Vitrine Backdrop Mural Texture (Unique to each of the 9 shop archetypes!)
  function makeVitrineBackdropTex(sh, isNight) {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    var x = c.getContext('2d');
    var st = sh.type;
    var w = c.width, h = c.height;

    if (st.kind === 'book') {
      // Warm mahogany floor-to-ceiling library bookshelves with hundreds of colorful spines!
      x.fillStyle = '#24150e';
      x.fillRect(0, 0, w, h);
      var bookCols = ['#b91c1c', '#1d4ed8', '#15803d', '#d97706', '#6d28d9', '#0f766e', '#9a3412', '#c2410c'];
      for (var row = 0; row < 4; row++) {
        var sy = 30 + row * 118;
        // Shelf plank
        x.fillStyle = '#452719';
        x.fillRect(20, sy + 96, w - 40, 16);
        x.fillStyle = '#d4af37';
        x.fillRect(20, sy + 96, w - 40, 3);
        var bx = 34;
        while (bx < w - 50) {
          var bw = 18 + ((bx * 13 + row * 7) % 22);
          var bh = 72 + ((bx * 7 + row * 19) % 22);
          x.fillStyle = bookCols[(bx + row) % bookCols.length];
          x.fillRect(bx, sy + (96 - bh), bw - 2, bh);
          x.fillStyle = 'rgba(253,224,71,0.65)';
          x.fillRect(bx + 2, sy + (96 - bh) + 10, bw - 6, 4);
          bx += bw + 2;

      }
      // Center arched brass plaque
      x.fillStyle = 'rgba(20, 12, 8, 0.88)';
      K.rr(x, 312, 36, 400, 96, 16);
      x.fill();
      x.strokeStyle = '#d4af37';
      x.lineWidth = 4;
      K.rr(x, 312, 36, 400, 96, 16);
      x.stroke();
      x.fillStyle = '#fde68a';
      x.font = '700 28px Georgia, serif';
      x.textAlign = 'center';
      x.fillText('RARE EDITIONS & CURATED FOLIOS', 512, 92);

    } else if (st.kind === 'music') {
      // Studio acoustic wall + Gold & Platinum Vinyl Records + Neon Equalizer
      x.fillStyle = '#0f131d';
      x.fillRect(0, 0, w, h);
      // Grid acoustic tiles
      x.strokeStyle = 'rgba(255,255,255,0.06)';
      x.lineWidth = 2;
      for (var gx = 0; gx < w; gx += 64) { x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, h); x.stroke(); }
      for (var gy = 0; gy < h; gy += 64) { x.beginPath(); x.moveTo(0, gy); x.lineTo(w, gy); x.stroke(); }
      // Mounted Gold & Platinum Vinyl LPs on the back wall
      [170, 380, 644, 854].forEach(function (vx, vi) {
        var vy = 155;
        x.fillStyle = '#111115';
        x.beginPath(); x.arc(vx, vy, 78, 0, Math.PI * 2); x.fill();
        x.strokeStyle = vi % 2 === 0 ? '#fbbf24' : '#38bdf8';
        x.lineWidth = 5;
        x.beginPath(); x.arc(vx, vy, 62, 0, Math.PI * 2); x.stroke();
        x.fillStyle = vi % 2 === 0 ? '#ef4444' : '#ec4899';
        x.beginPath(); x.arc(vx, vy, 26, 0, Math.PI * 2); x.fill();
      });
      // Neon equalizer bars at bottom
      for (var eq = 40; eq < w - 40; eq += 24) {
        var eh = 40 + ((eq * 29) % 140);
        x.fillStyle = eq % 48 === 0 ? '#ff2e63' : '#00f2fe';
        x.fillRect(eq, h - eh - 20, 14, eh);
      }

    } else if (st.kind === 'movie') {
      // Crimson Velvet Theatre Curtain pleats + Golden Art Deco Sunburst
      var grd = x.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, '#450a1a');
      grd.addColorStop(1, '#7f1d1d');
      x.fillStyle = grd;
      x.fillRect(0, 0, w, h);
      for (var cx = 0; cx < w; cx += 48) {
        x.fillStyle = 'rgba(0,0,0,0.28)';
        x.fillRect(cx, 0, 22, h);
      }

            }
          };
          all.push(it);
          return it;
        });
        return { id: gObj.id, title: rg.title, color: gObj.color, items: items };
      });
      planets.push({
        id: dp.id,
        title: dp.title,
        rawTitle: dp.title,
        biome: BIOMES[bIdx].id,
        biomeIdx: bIdx,
        regions: regs,
        all: all
      });
    }

    // Highway route: one planet every ROUTE_GAP units, alternating left/right of
    // the flight line, so they pass by one at a time like roadside billboards.
    planets.forEach(function (pl, pi) {
      pl.pi = pi;
      pl.pos = {
        x: (pi % 2 ? 1 : -1) * (24 + (pi % 3) * 3),
        y: ((pi % 3) - 1) * 3,
        z: -ROUTE_GAP * (pi + 1)
      };
      pl.radius = 5.5 + (pi % 3) * 0.6;
    });

    return planets;
  }

  // ---------------- Procedural Textures: Planet Surface, 3D Planet Title Banner, Plaque ----------------
  var planetTexCache = new Map();
  function makePlanetTexture(B, seed) {
    var key = B.id + ':' + seed;
    if (planetTexCache.has(key)) return planetTexCache.get(key);
    var hex = function (n) { return '#' + ('000000' + n.toString(16)).slice(-6); };
    var tex = makeCanvasTex(512, 256, function (g) {
      var baseGrad = g.createLinearGradient(0, 0, 0, 256);
      baseGrad.addColorStop(0, hex(B.land2));
      baseGrad.addColorStop(0.18, hex(B.sea));
      baseGrad.addColorStop(0.5, hex(B.sea));
      baseGrad.addColorStop(0.82, hex(B.sea));
      baseGrad.addColorStop(1, hex(B.land2));
      g.fillStyle = baseGrad;
      g.fillRect(0, 0, 512, 256);

      for (var b = 0; b < 14; b++) {
        g.fillStyle = (b % 2 === 0) ? hex(B.land) : hex(B.land2);
        g.globalAlpha = 0.16;
        g.fillRect(0, b * 18, 512, 8);
      }

      var rng = K.rng(seed || 101);
      for (var i = 0; i < 38; i++) {
        var x = rng() * 512, y = 28 + rng() * 200;
        var rx = 18 + rng() * 68, ry = 10 + rng() * 34;
        g.fillStyle = i % 3 === 0 ? hex(B.land2) : hex(B.land);
        g.globalAlpha = 0.65 + rng() * 0.3;
        g.beginPath();
        g.ellipse(x, y, rx, ry, (rng() - 0.5) * 0.6, 0, Math.PI * 2);
        g.fill();
      }

      g.globalAlpha = 0.32;
      g.fillStyle = B.cloud;
      for (var k = 0; k < 18; k++) {
        var cx = rng() * 512, cy = 16 + rng() * 224;
        g.beginPath();
        g.ellipse(cx, cy, 34 + rng() * 70, 3 + rng() * 7, 0, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    });
    planetTexCache.set(key, tex);
    return tex;
  }

  // Crisp 3D Floating Title Banner directly on/above each Planet!
  var bannerTexCache = new Map();
  function makePlanetTitleBanner(pl, B, isTarget) {
    var key = pl.id + '|' + (isTarget ? '1' : '0');
    if (bannerTexCache.has(key)) return bannerTexCache.get(key);
    var tex = makeCanvasTex(1024, 260, function (g, w, h) {
      g.clearRect(0, 0, w, h);

      var pad = 14;
      g.fillStyle = isTarget ? 'rgba(6, 22, 46, 0.92)' : 'rgba(6, 15, 32, 0.86)';
      g.strokeStyle = isTarget ? '#f2c13d' : B.accent;
      g.lineWidth = isTarget ? 7 : 5;
      K.rr(g, pad, pad, w - pad * 2, h - pad * 2 - 30, 28);
      g.fill();
      g.stroke();

      // Inner targeting corner brackets
      g.strokeStyle = isTarget ? '#fff3b0' : '#ffffff';
      g.lineWidth = 4;
      var bLen = 26;
      g.beginPath(); g.moveTo(pad + 14, pad + 14 + bLen); g.lineTo(pad + 14, pad + 14); g.lineTo(pad + 14 + bLen, pad + 14); g.stroke();
      g.beginPath(); g.moveTo(w - pad - 14 - bLen, pad + 14); g.lineTo(w - pad - 14, pad + 14); g.lineTo(w - pad - 14, pad + 14 + bLen); g.stroke();

      // Biome badge pill on left
      g.fillStyle = B.accent;
      K.rr(g, pad + 30, pad + 26, 168, 44, 22);
      g.fill();
      g.fillStyle = '#04101e';
      g.font = '800 24px ' + K.FONT;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('PLANET #' + (pl.pi + 1), pad + 30 + 84, pad + 48);

      // Target lock tag on right
      g.fillStyle = isTarget ? '#f2c13d' : 'rgba(148, 210, 255, 0.92)';
      g.font = '700 22px "SF Mono", Menlo, monospace';
      g.textAlign = 'right';
      g.fillText(isTarget ? '[ TARGET LOCKED · TAP TO LAND ]' : '[ TAP TO WARP ]', w - pad - 32, pad + 48);

      // Large Planet Title (Board Name)
      g.fillStyle = '#ffffff';
      g.shadowColor = isTarget ? 'rgba(242, 193, 61, 0.8)' : 'rgba(56, 189, 248, 0.8)';
      g.shadowBlur = 14;
      g.font = '800 54px ' + K.FONT;
      g.textAlign = 'center';
      g.fillText(trunc(pl.title, 25), w / 2, pad + 118);
      g.shadowBlur = 0;

      // Subtitle: Biome + Regions + Cards count
      g.fillStyle = isTarget ? '#fde68a' : '#93c5fd';
      g.font = '600 28px ' + K.FONT;
      g.fillText(B.name + '  ·  ' + pl.regions.length + ' Regions  ·  ' + pl.all.length + ' Cards', w / 2, pad + 174);

      // Downward pointer arrow toward planet north pole
      g.fillStyle = isTarget ? '#f2c13d' : B.accent;
      g.beginPath();
      g.moveTo(w / 2 - 22, h - pad - 28);
      g.lineTo(w / 2 + 22, h - pad - 28);
      g.lineTo(w / 2, h - 4);
      g.closePath();
      g.fill();
    });
    bannerTexCache.set(key, tex);
    return tex;
  }

  // Equatorial Orbital Ring Nameband Texture (wraps Planet Title right onto the planet's glowing hologram band!)
  var titleTexCache = new Map();
  function makeTitleOnlyTex(pl, B) {
    if (titleTexCache.has(pl.id)) return titleTexCache.get(pl.id);
    var tex = makeCanvasTex(1024, 260, function (g, w, h) {
      g.clearRect(0, 0, w, h);
      g.font = '800 92px ' + K.FONT;
      var t = trunc(pl.title, 22), tw = Math.min(w - 60, g.measureText(t).width + 150);
      g.fillStyle = 'rgba(4, 12, 28, 0.78)';

      g.strokeStyle = B.accent; g.lineWidth = 6; g.stroke();
      g.fillStyle = '#f8fafc'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(t, w / 2, 128);
    });
    titleTexCache.set(pl.id, tex);
    return tex;
  }
  function makeOrbitalTitleBandTex(pl, B) {
    return makeCanvasTex(1024, 96, function (g, w, h) {
      g.fillStyle = 'rgba(4, 14, 30, 0.78)';
      g.fillRect(0, 12, w, h - 24);
      g.strokeStyle = B.accent;
      g.lineWidth = 4;
      g.beginPath(); g.moveTo(0, 14); g.lineTo(w, 14); g.moveTo(0, h - 14); g.lineTo(w, h - 14); g.stroke();
      g.fillStyle = '#ffffff';

  function makePlaqueTex(title, sub, accent) {
    return makeCanvasTex(512, 148, function (g, w, h) {
      g.fillStyle = 'rgba(6, 14, 28, 0.92)';
      g.strokeStyle = accent || '#38bdf8';
      g.lineWidth = 5;
      K.rr(g, 6, 6, w - 12, h - 12, 22);
      g.fill();
      g.stroke();

      g.fillStyle = '#ffffff';
      g.font = '800 32px ' + K.FONT;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(trunc(title, 22), w / 2, 54);

      g.fillStyle = accent || '#7dd3fc';
      g.font = '600 22px ' + K.FONT;
      g.fillText(trunc(sub || '', 28), w / 2, 102);
    });
  }

  function makeCockpitScreenTex(kind) {
    return makeCanvasTex(256, 160, function (g, w, h) {
      g.fillStyle = '#040c18';
      g.fillRect(0, 0, w, h);
      g.strokeStyle = kind === 'radar' ? '#38bdf8' : kind === 'nav' ? '#4ade80' : '#f59e0b';
      g.lineWidth = 3;
      g.strokeRect(5, 5, w - 10, h - 10);

      if (kind === 'radar') {
        var cx = w / 2, cy = h / 2, r = 56;
        g.strokeStyle = 'rgba(56, 189, 248, 0.48)';
        g.lineWidth = 2;
        [r, r * 0.66, r * 0.33].forEach(function (rad) {
          g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.stroke();
        });
        g.beginPath(); g.moveTo(cx - r, cy); g.lineTo(cx + r, cy); g.stroke();
        g.beginPath(); g.moveTo(cx, cy - r); g.lineTo(cx, cy + r); g.stroke();
        g.fillStyle = '#4ade80';
        [[cx + 22, cy - 18], [cx - 30, cy - 12], [cx + 10, cy + 26], [cx - 12, cy + 32]].forEach(function (pt) {
          g.beginPath(); g.arc(pt[0], pt[1], 5, 0, Math.PI * 2); g.fill();
        });
      } else if (kind === 'nav') {
        // Targeting grid
        g.strokeStyle = '#4ade80';
        g.lineWidth = 2;
        for (var i = 1; i <= 4; i++) {
          var s = i * 16;
          g.strokeRect(w / 2 - s * 1.4, h / 2 - s, s * 2.8, s * 2);
        }
        g.beginPath();
        g.moveTo(16, 16); g.lineTo(w - 16, h - 16);
        g.moveTo(w - 16, 16); g.lineTo(16, h - 16);
        g.stroke();
        g.fillStyle = '#f2c13d';
        g.font = '700 16px monospace';
        g.textAlign = 'center';
        g.fillText('LOCK 042.8', w / 2, h - 16);
      } else {
        var colors = ['#ef4444', '#f59e0b', '#38bdf8', '#4ade80', '#f59e0b'];
        for (var row = 0; row < 5; row++) {
          g.fillStyle = colors[row];
          var bw = 50 + ((row * 37) % 120);
          g.fillRect(18, 20 + row * 24, bw, 14);
          g.fillStyle = 'rgba(255,255,255,0.2)';
          g.fillRect(18 + bw + 8, 20 + row * 24, w - 44 - bw, 14);
        }
      }
    });
  }

  // ---------------- Main Galaxy Class ----------------
  function Galaxy(opts) {
    opts = opts || {};
    var self = this;
    var P = opts.provider || K.defaultProvider();
    var planets = buildGalaxyData(P);
    var saved = DB.get('galaxy') || {};
    var reducedMotion = false;
    try { reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    var st = {
      phase: 'cockpit', // 'cockpit' | 'hyperspace' | 'approach' | 'landing' | 'surface'
      pi: clamp(saved.pi || 0, 0, Math.max(0, planets.length - 1)),
      visited: saved.visited || { 0: true },
      phaseT: 0,
      warpDur: reducedMotion ? 1.0 : 2.5,
      cruise: true,        // Continuous space flight in cockpit
      cockpitFrame: true,  // legacy flag (kept for saved state)
      view: ['cockpit', 'chase', 'open'].indexOf(saved.view) >= 0 ? saved.view : 'cockpit',
      autoExplore: false,
      focusIdx: -1,
      yaw: 0,
      pitch: 0.02,
      bank: 0,
      shipPos: { x: 0, y: 0, z: 24 }
    };

    function persist() {
      DB.set('galaxy', { pi: st.pi, visited: st.visited, view: st.view });
    }
    function curPlanet() { return planets[st.pi] || planets[0]; }
    function curBiome() { return BIOMES[curPlanet().biomeIdx || 0]; }

    // Overview pose: parked well back from the system so every planet is a small
    // titled globe across the windshield; tapping one flies there and lands.
    // Route pose: on the flight line, either well before the current planet
    // (start) or just past it (resuming after a visit).
    function overviewPose(resume) {
      var pl = curPlanet();
      st.shipPos.x = 0; st.shipPos.y = 1.5; st.shipPos.z = pl.pos.z + (resume ? 12 : 118);
      st.yaw = 0; st.pitch = -0.02;
    }
    overviewPose();

    var cur = { x: 0, y: 1.75, z: 16, yaw: 0, pitch: -0.04 };
    var tgt = { x: 0, y: 1.75, z: 16, yaw: 0, pitch: -0.04 };

    var S = X.stage({
      cls: 'kg-root',
      maxDpr: 1.5,
      container: opts.container,
      onExit: opts.onExit,
      hFov: 74,
      maxFov: 88,
      far: 380,
      hint: 'Tap card to flip · tap outside to return',
      html:
        '<div class="kx-top">' +
          '<div class="kx-pill"><i></i><span><b></b><small></small></span></div>' +
          '<div class="kx-tr">' +
            '<button type="button" class="kx-b" data-kx="map">🌌 <span>Galaxy Map (' + planets.length + ')</span></button>' +
            '<button type="button" class="kx-b" data-kx="exit" aria-label="Exit">✕</button>' +
          '</div>' +
        '</div>' +
        '<div class="kg-status"></div>' +
        '<div class="kx-bar">' +
          '<button type="button" class="kx-b" data-kx="map">🌌 <span>Planets</span></button>' +
          '<button type="button" class="kx-b kg-b-warp" data-kx="warp">⚡ <span>Hyperspace</span></button>' +
          '<button type="button" class="kx-b" data-kx="land">🛬 <span>Land</span></button>' +
          '<button type="button" class="kx-b kg-b-cruise" data-kx="cruise">🚀 <span>Cruise</span></button>' +
          '<button type="button" class="kx-b kg-b-cockpit" data-kx="cockpit">🪟 <span>Cockpit</span></button>' +
        '</div>' +
        '<div class="kx-sheet" hidden>' +
          '<div class="kx-card">' +
            '<div class="kx-head"><b>🌌 3D Galaxy Navigation Chart · ' + planets.length + ' Planets</b><button type="button" class="kx-b" data-kx="map">✕</button></div>' +
            '<div class="kx-list kg-map-body"></div>' +
          '</div>' +
        '</div>'
    });

    var scene = S.scene, cam = S.cam, RD = X.reader(S);
    var statusEl = S.$('.kg-status');
    statusEl.addEventListener('click', function () {
      if (st.phase === 'hyperspace') finishHyperspace();
      else if (st.phase === 'approach') landOnPlanet();
      else if (st.phase === 'cockpit') startHyperspace();
    });

    var hitMap = new Map();
    var hitObjects = [];
    function clearHits() {
      hitMap.clear();
      hitObjects.length = 0;
    }
    function addHit(obj, fn) {
      hitMap.set(obj, fn);
      hitObjects.push(obj);
    }

    // Sky sphere + lighting
    var skyGeo = new T.SphereGeometry(340, 20, 12);
    var skyMat = new T.MeshBasicMaterial({ color: '#020612', side: T.BackSide, fog: false, depthWrite: false });
    var skyMesh = new T.Mesh(skyGeo, skyMat);
    skyMesh.renderOrder = -10;
    scene.add(skyMesh);
    scene.fog = new T.Fog('#030816', 75, 320);

    var hemi = new T.HemisphereLight('#dbeafe', '#0f172a', 0.9);
    var sun = new T.DirectionalLight('#ffffff', 1.25);
    sun.position.set(35, 50, 30);
    var fill = new T.DirectionalLight('#38bdf8', 0.45);
    fill.position.set(-25, 15, 20);
    scene.add(hemi, sun, fill);

    // =========================================================================
    // 1. DEEP SPACE ENVIRONMENT (Starfield + Asteroids + Hyperspace Tunnel)
    // =========================================================================
    var spaceGroup = new T.Group();
    scene.add(spaceGroup);

    // 1A. 1,600 Pinpoint Stars around the ship
    var starCount = 1600;
    var starPos = new Float32Array(starCount * 3);
    for (var i = 0; i < starCount; i++) {
      var r = 95 + Math.random() * 170;
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos(2 * Math.random() - 1);
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i * 3 + 2] = r * Math.cos(phi);
    }
    var starGeo = new T.BufferGeometry();
    starGeo.setAttribute('position', new T.BufferAttribute(starPos, 3));
    var starMat = new T.PointsMaterial({ color: 0xf8fafc, size: 0.72, transparent: true, opacity: 0.95 });
    var starPoints = new T.Points(starGeo, starMat);
    spaceGroup.add(starPoints);

    // 1B. Streaming Space Dust & Micro-Meteoroids
    var dustCount = 360;
    var dustGeo = new T.BufferGeometry();
    var dustPos = new Float32Array(dustCount * 6);
    var dustSeeds = [];
    for (var d = 0; d < dustCount; d++) {
      var dx = (Math.random() - 0.5) * 44;
      var dy = (Math.random() - 0.5) * 28;
      var dz = -Math.random() * 90;
      dustSeeds.push({ x: dx, y: dy, z: dz, spd: 22 + Math.random() * 28 });
      dustPos[d * 6] = dx; dustPos[d * 6 + 1] = dy; dustPos[d * 6 + 2] = dz;
      dustPos[d * 6 + 3] = dx; dustPos[d * 6 + 4] = dy; dustPos[d * 6 + 5] = dz + 2.2;
    }
    dustGeo.setAttribute('position', new T.BufferAttribute(dustPos, 3));
    var dustMat = new T.LineBasicMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.52 });
    var dustLines = new T.LineSegments(dustGeo, dustMat);
    cam.add(dustLines);

    // 1C. Passing 3D Low-Poly Asteroids outside the cockpit window (for true 3D motion parallax!)
    var asteroidGroup = new T.Group();
    cam.add(asteroidGroup);
    var asteroids = [];
    var astMat = mat(0x475569, 0.85, 0.15);
    for (var ai = 0; ai < 28; ai++) {
      var aRad = 0.22 + Math.random() * 0.65;
      var aMesh = new T.Mesh(new T.DodecahedronGeometry(aRad, 0), astMat);
      var ax = (Math.random() < 0.5 ? -1 : 1) * (4.5 + Math.random() * 22);
      var ay = (Math.random() - 0.5) * 18;
      var az = -10 - Math.random() * 95;
      aMesh.position.set(ax, ay, az);
      aMesh.scale.set(1, 0.7 + Math.random() * 0.5, 0.8 + Math.random() * 0.5);
      asteroidGroup.add(aMesh);
      asteroids.push({
        mesh: aMesh,
        spd: 9 + Math.random() * 14,
        rx: (Math.random() - 0.5) * 2,
        ry: (Math.random() - 0.5) * 2
      });
    }

    // 1D. Hyperspace star streaks (1,100 radial light beams)
    var warpCount = 1100;
    var warpPos = new Float32Array(warpCount * 6);
    var warpBase = [];
    for (var w = 0; w < warpCount; w++) {
      var rad = 1.6 + Math.random() * 28;
      var ang = Math.random() * Math.PI * 2;
      var wx = Math.cos(ang) * rad;
      var wy = Math.sin(ang) * rad;
      var wz = -4 - Math.random() * 120;
      warpBase.push({ x: wx, y: wy, z: wz, spd: 85 + Math.random() * 75 });
      warpPos[w * 6] = wx; warpPos[w * 6 + 1] = wy; warpPos[w * 6 + 2] = wz;
      warpPos[w * 6 + 3] = wx; warpPos[w * 6 + 4] = wy; warpPos[w * 6 + 5] = wz - 0.5;
    }
    var warpGeo = new T.BufferGeometry();
    warpGeo.setAttribute('position', new T.BufferAttribute(warpPos, 3));
    var warpMat = new T.LineBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0 });
    var warpLines = new T.LineSegments(warpGeo, warpMat);
    warpLines.visible = false;
    cam.add(warpLines);

    // 1E. Swirling Blue-Cyan Hyperspace Plasma Tunnel
    var tunnelGroup = new T.Group();
    tunnelGroup.visible = false;
    var tunnelRings = [];
    var ringGeo = new T.TorusGeometry(8.5, 0.16, 8, 40);
    for (var tr = 0; tr < 22; tr++) {
      var rMat = new T.MeshBasicMaterial({
        color: tr % 3 === 0 ? 0xe0f2fe : tr % 2 === 0 ? 0x38bdf8 : 0x60a5fa,
        transparent: true,
        opacity: 0
      });
      var rMesh = new T.Mesh(ringGeo, rMat);
      rMesh.position.z = -tr * 5.5 - 4;
      rMesh.rotation.z = tr * 0.35;
      tunnelGroup.add(rMesh);
      tunnelRings.push({ mesh: rMesh, mat: rMat });
    }
    function makeWarpTex() {
      return makeCanvasTex(1024, 1024, function (g, w, h) {
        var cx = w / 2, cy = h / 2, rg = g.createRadialGradient(cx, cy, 0, cx, cy, w * 0.7);
        rg.addColorStop(0, '#0a2348'); rg.addColorStop(0.25, '#123d78'); rg.addColorStop(1, '#5d9ee8');
        g.fillStyle = rg; g.fillRect(0, 0, w, h);
        g.lineCap = 'round';
        for (var n = 0; n < 2200; n++) {
          var an = Math.random() * Math.PI * 2, r0 = 40 + Math.pow(Math.random(), 0.7) * w * 0.62, len = (0.15 + Math.random() * 0.6) * r0;
          var lw = 1 + Math.random() * (r0 / w) * 9, a = 0.25 + Math.random() * 0.6;
          g.strokeStyle = Math.random() < 0.6 ? 'rgba(235,245,255,' + a + ')' : 'rgba(120,180,255,' + a + ')';
          g.lineWidth = lw; g.beginPath();
          g.moveTo(cx + Math.cos(an) * r0, cy + Math.sin(an) * r0);
          g.lineTo(cx + Math.cos(an) * (r0 + len), cy + Math.sin(an) * (r0 + len)); g.stroke();
        }
        for (var m = 0; m < 160; m++) {             // speckled core
          var ma = Math.random() * Math.PI * 2, mr = Math.random() * 70;
          g.fillStyle = 'rgba(200,225,255,' + (0.3 + Math.random() * 0.6) + ')';
          g.fillRect(cx + Math.cos(ma) * mr, cy + Math.sin(ma) * mr, 2 + Math.random() * 3, 2 + Math.random() * 3);
        }
      });
    }
    var warpWallMat = new T.MeshBasicMaterial({ map: makeWarpTex(), transparent: true, opacity: 0, depthWrite: false, fog: false });
    var warpWall = new T.Mesh(new T.PlaneGeometry(150, 150), warpWallMat);
    warpWall.position.z = -60; warpWall.renderOrder = -5;
    tunnelGroup.add(warpWall);
    cam.add(tunnelGroup);
    scene.add(cam);

    // =========================================================================
    // 2. FREIGHTER COCKPIT (attached to the camera)
    //    Classic space-opera greenhouse: a round pane dead ahead, two glazing
    //    rings stepping back toward the pilot, heavy radial mullions between
    //    them, and a solid hull collar around everything.
    // =========================================================================
    var cockpitGroup = new T.Group();
    cam.add(cockpitGroup);

    var cockpitBlueLight = new T.PointLight(0x7cc4ff, 0.7, 4, 1.5);

      // 4. Top turret + front-starboard sensor dish
      var turret = new T.Mesh(new T.CylinderGeometry(0.24, 0.28, 0.08, 20), dark); turret.position.y = 0.38; shipGroup.add(turret);
      var dome = new T.Mesh(new T.SphereGeometry(0.15, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), flat(0x9fd4ff, { transparent: true, opacity: 0.75 }));
      dome.position.y = 0.42; shipGroup.add(dome);
      [-0.08, 0.08].forEach(function (bx) {
        var barrel = tube(new T.Vector3(bx, 0.48, 0), new T.Vector3(bx, 0.5, -0.32), 0.012, 0.012, dark); shipGroup.add(barrel);
      });
      var mast = tube(new T.Vector3(0.62, 0.3, -0.62), new T.Vector3(0.66, 0.48, -0.66), 0.03, 0.03, dark); shipGroup.add(mast);
      var dish = new T.Mesh(new T.CylinderGeometry(0.26, 0.04, 0.1, 20, 1, true), mat(0xc9c5bc, 0.6, 0.25, { side: T.DoubleSide }));
      dish.position.set(0.66, 0.52, -0.66); dish.rotation.set(-0.7, 0, 0.3); shipGroup.add(dish);
      // 5. Stern engine: a thick rim wall with a recessed slot; inside it a row
      //    of separate glowing vent cells (white core, cyan edge) behind dark
      //    dividers, under two additive glow layers and a line of bloom sprites.
      var ARC = 2.75, RW = 1.7;                          // arc centred on the stern (+z)
      function ribbon(r, h, tex, m, start, len) {
        var g = new T.CylinderGeometry(r, r, h, 72, 1, true, start, len);
        return new T.Mesh(g, m || new T.MeshBasicMaterial({ map: tex, toneMapped: false, side: T.DoubleSide }));
      }
      // rim wall all the way round (panelled), the engine sits in it
      var wallTex = hullTex(21, false); wallTex.repeat.set(3, 1);
      var wall = ribbon(RW - 0.01, 0.24, null, mat(0x8a867f, 0.85, 0.15, { map: wallTex, side: T.DoubleSide }), 0, Math.PI * 2);
      wall.position.y = 0.03; shipGroup.add(wall);
      var CELLS = 44;
      var ventTex = makeCanvasTex(2048, 64, function (g, w, h) {
        g.fillStyle = '#05080c'; g.fillRect(0, 0, w, h);
        var cw = w / CELLS;
        for (var c = 0; c < CELLS; c++) {
          var x0 = c * cw + cw * 0.12, ww = cw * 0.76;
          var gr = g.createLinearGradient(0, 6, 0, h - 6);
          gr.addColorStop(0, '#1479ff'); gr.addColorStop(0.3, '#7fd8ff'); gr.addColorStop(0.5, '#e6fbff'); gr.addColorStop(0.7, '#7fd8ff'); gr.addColorStop(1, '#1479ff');
          g.fillStyle = gr; K.rr(g, x0, 7, ww, h - 14, 6); g.fill();
          g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(x0 + ww * 0.25, h * 0.45, ww * 0.5, h * 0.1);
        }
      });
      var vents = ribbon(RW + 0.004, 0.11, ventTex, null, -ARC / 2, ARC); vents.position.y = 0.035; shipGroup.add(vents);
      // slot lips above and below the vents
      [0.1, -0.03].forEach(function (ly) {
        var lip = ribbon(RW + 0.03, 0.025, null, mat(0x3a3834, 0.6, 0.5, { side: T.DoubleSide }), -ARC / 2 - 0.02, ARC + 0.04);
        lip.position.y = ly; shipGroup.add(lip);
      });
      // exhaust grille boxes on the upper hull just ahead of the vents
      for (var gx = 0; gx < 9; gx++) {
        var ga2 = -ARC / 2 + (gx + 0.5) * ARC / 9, gbx = new T.Mesh(new T.BoxGeometry(0.22, 0.035, 0.12), dark);
        gbx.position.set(Math.sin(ga2) * 1.5, 0.15, Math.cos(ga2) * 1.5); gbx.rotation.y = ga2; shipGroup.add(gbx);
      }
      // glow layers: soft vertical falloff, additive
      function glowTex(core) {
        return makeCanvasTex(256, 128, function (g, w, h) {
          var gr = g.createLinearGradient(0, 0, 0, h);
          gr.addColorStop(0, 'rgba(20,110,255,0)'); gr.addColorStop(0.5 - core, 'rgba(40,160,255,.6)');
          gr.addColorStop(0.5, 'rgba(150,225,255,.95)'); gr.addColorStop(0.5 + core, 'rgba(40,160,255,.6)'); gr.addColorStop(1, 'rgba(20,110,255,0)');
          g.fillStyle = gr; g.fillRect(0, 0, w, h);
        });
      }
      function glowMat(tex, op) { return new T.MeshBasicMaterial({ map: tex, transparent: true, opacity: op, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide, toneMapped: false }); }
      var glowIn = ribbon(RW + 0.02, 0.26, null, glowMat(glowTex(0.12), 0.9), -ARC / 2, ARC); glowIn.position.y = 0.035; shipGroup.add(glowIn);
      var halo = ribbon(RW + 0.07, 0.62, null, glowMat(glowTex(0.2), 0.6), -ARC / 2 - 0.05, ARC + 0.1); halo.position.y = 0.035; shipGroup.add(halo);
      // bloom sprites along the arc
      var bloomTex = makeCanvasTex(64, 64, function (g, w, h) {
        var rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        rg.addColorStop(0, 'rgba(170,230,255,.9)'); rg.addColorStop(0.3, 'rgba(40,150,255,.5)'); rg.addColorStop(1, 'rgba(20,110,255,0)');
        g.fillStyle = rg; g.fillRect(0, 0, w, h);
      });
      var bloomMat = new T.SpriteMaterial({ map: bloomTex, transparent: true, depthWrite: false, blending: T.AdditiveBlending, opacity: 0.7 });
      for (var bs = 0; bs < 14; bs++) {
        var ba = -ARC / 2 + (bs + 0.5) * ARC / 14, sp = new T.Sprite(bloomMat);
        sp.position.set(Math.sin(ba) * (RW + 0.12), 0.035, Math.cos(ba) * (RW + 0.12)); sp.scale.set(1.0, 0.55, 1);
        shipGroup.add(sp);
      }
      var engMat = glowIn.material;
      var engLight = new T.PointLight(0x7dd3fc, 1.2, 3, 2); engLight.position.set(0, 0.05, 2.1); shipGroup.add(engLight);
      // raised round hatches on the upper lens
      for (var hh = 0; hh < 6; hh++) {
        var ha = hh / 6 * Math.PI * 2 + 0.5;
        if (Math.cos(ha) > 0.8) continue;
        var hatch = new T.Mesh(new T.CylinderGeometry(0.11, 0.12, 0.03, 16), mat(0x5c5953, 0.8, 0.3));
        hatch.position.set(Math.cos(ha) * 1.12, slopeY(1.12) + 0.012, Math.sin(ha) * 1.12);
        hatch.rotation.set(0, -ha, -0.35, 'YXZ'); shipGroup.add(hatch);
      }
      var bounce = new T.PointLight(0xff8a3d, 1.1, 7, 1.6); bounce.position.set(0.6, -2.4, 0.4); shipGroup.add(bounce);
      shipGroup.userData = { engMat: engMat, halo: halo, bloom: bloomMat };
    })();
    shipGroup.position.set(0, -1.3, -7.2);
    shipGroup.scale.setScalar(1);
    shipGroup.visible = false;
    cam.add(shipGroup);

    // view: 'cockpit' | 'chase' | 'open' (cycled by the view button)
    var VIEWS = ['cockpit', 'chase', 'open'];
    var VIEW_LABEL = { cockpit: '🪟 <span>Cockpit</span>', chase: '🛸 <span>Chase</span>', open: '✨ <span>Open View</span>' };
    function applyView() {
      var inSpace = st.phase !== 'surface';
      cockpitGroup.visible = inSpace && st.view === 'cockpit';
      shipGroup.visible = inSpace && st.view === 'chase' && st.phase !== 'landing';
    }

    // =========================================================================
    // 3. MULTI-PLANET 3D STAR SYSTEM WITH FLOATING 3D PLANET TITLES
    // =========================================================================
    var systemGroup = new T.Group();
    scene.add(systemGroup);
    var planetNodes = [];

    function buildStarSystem() {
      planets.forEach(function (pl, pi) {
        var B = BIOMES[pl.biomeIdx || 0];
        var pGroup = new T.Group();
        pGroup.position.set(pl.pos.x, pl.pos.y, pl.pos.z);

        // 1. Textured Low-Poly Planet Sphere
        var pGeo = new T.IcosahedronGeometry(pl.radius, 3);
        var pMat = new T.MeshStandardMaterial({
          map: makePlanetTexture(B, 100 + pi * 37),
          roughness: 0.7,
          metalness: 0.08,
          flatShading: true
        });
        var pMesh = new T.Mesh(pGeo, pMat);
        pGroup.add(pMesh);

        // 2. Atmosphere Rim Halo
        var atmoMat = new T.MeshBasicMaterial({
          color: B.atmo,
          transparent: true,
          opacity: 0.2,
          side: T.BackSide
        });
        var atmoMesh = new T.Mesh(new T.IcosahedronGeometry(pl.radius * 1.13, 2), atmoMat);
        pGroup.add(atmoMesh);

        // 3. Planetary Ring
        var ringMat = new T.MeshBasicMaterial({
          color: B.ring,
          transparent: true,
          opacity: (pi % 2 === 0) ? 0.36 : 0.18,
          side: T.DoubleSide
        });
        var ringMesh = new T.Mesh(new T.RingGeometry(pl.radius * 1.36, pl.radius * 1.92, 40), ringMat);
        ringMesh.rotation.x = Math.PI * 0.42;
        ringMesh.rotation.y = (pi % 3 - 1) * 0.25;
        pGroup.add(ringMesh);

        // 4. Nameplate strip floating just below the planet (kept off its face)
        var eqMat = new T.MeshBasicMaterial({
          map: makeOrbitalTitleBandTex(pl, B),
          transparent: true
        });
        var eqBand = new T.Mesh(new T.PlaneGeometry(pl.radius * 2.15, pl.radius * 0.24), eqMat);
        eqBand.position.set(0, -pl.radius * 0.15, pl.radius * 1.06);
        pGroup.add(eqBand);

        // 5. Orbiting Moon
        var moonMesh = new T.Mesh(new T.IcosahedronGeometry(pl.radius * 0.18, 1), mat(0xdbeafe, 0.85, 0.05));
        moonMesh.position.set(pl.radius * 2.2, pl.radius * 0.45, pl.radius * 0.8);
        pGroup.add(moonMesh);

        // 6. Crisp Floating 3D Title Banner directly above the Planet North Pole (proportioned to never clip!)
        var isTarget = (pi === st.pi);
        var bannerMat = new T.MeshBasicMaterial({
          map: makePlanetTitleBanner(pl, B, isTarget),
          transparent: true,
          depthTest: true
        });
        var bannerW = pl.radius * 2.35;
        var bannerH = bannerW * (260 / 1024);
        var bannerMesh = new T.Mesh(new T.PlaneGeometry(bannerW, bannerH), bannerMat);
        bannerMesh.position.set(0, pl.radius * 1.6, 0);
        pGroup.add(bannerMesh);

        addHit(pMesh, function () { onPlanetClicked(pi); });
        addHit(bannerMesh, function () { onPlanetClicked(pi); });
        addHit(eqBand, function () { onPlanetClicked(pi); });

        systemGroup.add(pGroup);
        planetNodes.push({
          pi: pi,
          pl: pl,
          B: B,
          group: pGroup,
          sphere: pMesh,
          ring: ringMesh,
          eqBand: eqBand,
          moon: moonMesh,
          banner: bannerMesh,
