<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>3D 词卡 · Minest</title>
<style>/* Minest · 3D 词卡 · 学生页 */
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; color: #e8eefb; font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { position: fixed; inset: 0; }
.sf-slot[data-sf-view="coverflow"] { position: absolute; inset: 0; overflow: hidden; }
/* the original 3D Cover (flow) lives in Minest itself — here every other mode */
#cm-bar button[data-m="flow"], #cm-pick button[data-m="flow"] { display: none !important; }
/* nothing that leads out of the words: no AI call, no "open the card", no style chip */
#xl .xl-ai, #xl [data-a="card"], #cs-btn { display: none !important; }
/* no Dock here: the controls sit lower */
#cm-ov .cm-gbar { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px) !important; }
#cm-ov .cm-hback { bottom: calc(env(safe-area-inset-bottom, 0px) + 22px) !important; }
#cm-bar { top: calc(env(safe-area-inset-top, 0px) + 54px) !important; }

/* the join card */
#v3-join { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: radial-gradient(90% 70% at 50% 20%, rgba(56,189,248,.22), transparent 60%), radial-gradient(80% 60% at 80% 100%, rgba(167,139,250,.18), transparent 60%), #070b16; }
#v3-join[hidden] { display: none; }
.v3j-card { width: min(380px, 100%); text-align: center; padding: 30px 24px 22px; border-radius: 28px; background: linear-gradient(180deg, rgba(30,36,52,.78), rgba(14,18,28,.82)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 40px 90px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.v3j-logo { font-size: 42px; line-height: 1; color: #7dd3fc; text-shadow: 0 0 24px rgba(125,211,252,.7); margin-bottom: 10px; }
.v3j-logo.spin { animation: v3spin 1.4s linear infinite; display: inline-block; }
@keyframes v3spin { to { transform: rotate(360deg); } }
.v3j-card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 750; letter-spacing: .01em; }
.v3j-card p { margin: 0 0 18px; color: #93a0b8; font-size: 14px; line-height: 1.5; }
.v3j-card input { display: block; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #fff; outline: none; font: 600 18px inherit; text-align: center; }
.v3j-card input:focus { border-color: rgba(125,211,252,.6); box-shadow: 0 0 0 4px rgba(125,211,252,.15); }
.v3j-card .v3j-code { font: 800 28px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .22em; text-transform: uppercase; }
.v3j-go { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 16px; font: 700 16px inherit; color: #04203a; background: linear-gradient(180deg, #a5e3fd, #38bdf8); cursor: pointer; box-shadow: 0 12px 30px -10px rgba(56,189,248,.7); }
.v3j-go:active { transform: scale(.98); }
.v3j-err { min-height: 18px; margin: 12px 0 0 !important; color: #fca5a5 !important; font-size: 13px !important; }

/* the title, top left */
#v3-top { position: fixed; z-index: 2200; left: calc(env(safe-area-inset-left, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px); top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; align-items: center; gap: 10px; pointer-events: none; }
#v3-top b { font: 700 15px/1.2 inherit; color: #f1f5f9; text-shadow: 0 1px 8px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#v3-top i { font-style: normal; font-size: 18px; color: #7dd3fc; text-shadow: 0 0 12px rgba(125,211,252,.7); }
body:not(.v3-on) #v3-top, body:not(.v3-on) #v3-pill { display: none; }
#v3-banner { position: fixed; z-index: 2200; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 100px); transform: translateX(-50%); padding: 7px 14px; border-radius: 12px; background: rgba(120,53,15,.75); border: 1px solid rgba(253,186,116,.35); color: #fed7aa; font-size: 12.5px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
#v3-banner[hidden] { display: none; }

/* progress, bottom right */
#v3-pill { position: fixed; z-index: 2200; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid rgba(255,255,255,.12); border-radius: 99px; color: #e8eefb; background: linear-gradient(180deg, rgba(30,34,46,.78), rgba(14,16,22,.8)); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); box-shadow: 0 12px 30px -10px rgba(0,0,0,.6); cursor: pointer; font: inherit; }
#v3-ring { --p: 0; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(#7dd3fc calc(var(--p) * 1%), rgba(255,255,255,.1) 0); display: grid; place-items: center; }
#v3-ring::after { content: "✓"; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #111522; color: #a7f3d0; font-size: 13px; font-weight: 800; }
#v3-pill span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
#v3-pill b { font: 750 14px ui-monospace, "SF Mono", Menlo, monospace; }
#v3-pill small { font-size: 11px; color: #93a0b8; }
body.v3-xl #v3-pill { display: none; }

/* 我会了 / 再看看 while a word is open */
#v3-mark { position: fixed; z-index: 2600; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: translateX(-50%); display: flex; gap: 10px; padding: 6px; border-radius: 20px; background: rgba(10,14,26,.72); border: 1px solid rgba(255,255,255,.12); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 16px 40px -14px rgba(0,0,0,.7); }
#v3-mark[hidden] { display: none; }
#v3-mark button { white-space: nowrap; border: 1px solid transparent; border-radius: 15px; padding: 11px 18px; font: 700 15px inherit; cursor: pointer; color: #e8eefb; background: rgba(255,255,255,.07); }
#v3-mark [data-known] { color: #052e1f; background: linear-gradient(180deg, #a7f3d0, #34d399); }
#v3-mark [data-again].on { border-color: rgba(253,186,116,.7); color: #fed7aa; background: rgba(253,186,116,.16); }
#v3-mark [data-known].on { box-shadow: 0 0 0 3px rgba(167,243,208,.35); }
#v3-mark [data-known].on::before { content: "✓ "; }

/* the word list */
#v3-sheet { position: fixed; z-index: 2700; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: min(360px, calc(100vw - 24px)); max-height: min(70vh, 560px); display: flex; flex-direction: column; border-radius: 22px; background: linear-gradient(180deg, rgba(28,32,44,.95), rgba(14,17,26,.96)); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 70px -20px rgba(0,0,0,.8); overflow: hidden; }
#v3-sheet[hidden] { display: none; }
.v3s-hd { display: flex; align-items: center; gap: 10px; padding: 14px 14px 8px 16px; }
.v3s-hd b { font-size: 15px; } .v3s-hd span { color: #93a0b8; font-size: 12.5px; }
.v3s-hd button { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); color: #cfd8ea; cursor: pointer; }
.v3s-tabs { display: flex; gap: 4px; padding: 0 12px 10px; }
.v3s-tabs button { flex: 1; border: 0; border-radius: 10px; padding: 7px 0; font: 600 12.5px inherit; color: #93a0b8; background: rgba(255,255,255,.04); cursor: pointer; }
.v3s-tabs button.on { color: #fff; background: rgba(255,255,255,.14); }
.v3s-list { overflow: auto; padding: 0 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.v3s-list button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 12px; padding: 10px 10px; background: none; color: #e8eefb; cursor: pointer; font: inherit; }
.v3s-list button:hover { background: rgba(255,255,255,.06); }
.v3s-list i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.18); }
.v3s-list i.k { background: #34d399; box-shadow: 0 0 8px #34d399; } .v3s-list i.a { background: #fdba74; }
.v3s-list b { font-size: 15px; font-weight: 650; white-space: nowrap; }
.v3s-list small { color: #8190a8; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v3s-none { color: #8190a8; text-align: center; font-size: 13px; }
/* a word open: its card has the screen — the mode bar and the title step aside */
body.v3-xl #cm-bar, body.v3-xl #v3-top, body.v3-xl #cm-pick { display: none !important; }
#v3-mark { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
/* the roots layer with no breakdown of its own (the AI one is not offered here) */
#xl .xl-c[data-k="ety"]:has(.xl-ai)::before { content: "这个词没有可拆的词根。点「Word」层听发音，或者翻到下一层。"; position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); color: #b9d0ff; font-size: 14px; line-height: 1.6; text-align: center; opacity: .85; }
</style>
</head>

  function hashStr(s) {
    var h = 2166136261 ^ seedSalt;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function colorizeCard(el, idx, force) {
    if (!force && el.dataset.csSalt === String(seedSalt)) return;
    var key = el.dataset.cardId || el.dataset.i || (el.textContent || '').slice(0, 24) || String(idx);
    var p = PALETTES[hashStr(String(key) + ':' + idx) % PALETTES.length];
    el.style.setProperty('--cs-hue', p[0] + 'deg');
    el.style.setProperty('--cs-c1', p[1]);
    el.style.setProperty('--cs-c2', p[2]);
    el.style.setProperty('--cs-bd', p[3]);
    el.style.setProperty('--cs-lip', p[4]);
    el.style.setProperty('--cs-lt', p[5]);
    el.dataset.csSalt = String(seedSalt);
  }

  function colorizeAll(force) {
    if (cur === 'default' && !force && !document.querySelector('#cs-modal.open')) return;   // nothing to colour
    var nodes = document.querySelectorAll(TARGETS);
    for (var i = 0; i < nodes.length; i++) colorizeCard(nodes[i], i, force);
  }

  function shuffleColors() {
    seedSalt = Math.floor(Math.random() * 100000);
    colorizeAll(true);
  }

    cur = STYLES.some(function (s) { return s.id === id; }) ? id : 'default';
    document.documentElement.dataset.cardStyle = cur;

    var st = STYLES.find(function (s) { return s.id === cur; }) || STYLES[0];

      btn.querySelector('.cs-lbl').textContent = '风格 · ' + st.zh;

    var modal = document.getElementById('cs-modal');
    if (modal) {
      [].forEach.call(modal.querySelectorAll('.cs-opt'), function (el) {
        el.classList.toggle('on', el.dataset.id === cur);
      });
    }
  }

    if (d && d.morph && d.morph.length) out.morph = d.morph.map(function (m) { return { p: String(m.part || ''), m: String(m.meaning || ''), k: m.type === 'prefix' ? 'pre' : m.type === 'suffix' ? 'suf' : 'root' }; });
    else if (fam) out.morph = fam.map(function (x) { var q = String(x); return { p: q, m: morphMeaning(q), k: /-$/.test(q) ? 'pre' : /^-/.test(q) ? 'suf' : 'root' }; });
    else if (f.parts && f.parts.form) out.morph = [{ p: f.parts.base, m: '原形', k: 'root' }].concat(f.parts.sufs.map(function (x) { return { p: x.p, m: x.m, k: 'suf' }; })), out.form = true;
    else if (f.parts) out.morph = f.parts.map(function (x) { return { p: x.p, m: x.m, k: x.k }; });
    if (d && d.origin) out.origin = String(d.origin);
    var tc = d && d.chunks && d.chunks.length ? d.chunks : (f.title.split(/\s+/).length > 2 ? chunks(f.title, 1).map(function (g) { return { text: g.join(' ') }; }) : []);
    if (tc.length > 1) out.chunks = tc.map(function (c) { return { text: String(c.text || ''), zh: String(c.zh || '') }; });
    var sd = d && d.sentence && d.sentence.chunks && d.sentence.chunks.length ? d.sentence : null;
    if (sd || f.sent) out.sentence = { text: sd ? String(sd.text || f.sent) : f.sent, chunks: (sd ? sd.chunks : chunks(f.sent).map(function (g) { return { text: g.join(' '), words: g.map(function (w) { return { w: w }; }) }; })).slice(0, 8).map(function (c) {
      var ws = (c.words && c.words.length ? c.words : String(c.text || '').split(/\s+/).map(function (w) { return { w: w }; })).slice(0, 10);
      return { text: String(c.text || ''), zh: String(c.zh || ''), words: ws.map(function (w) { return { w: String(w.w || ''), zh: String(w.zh || ''), pos: String(w.pos || ''), fn: FUNC.test(w.w || '') }; }) }; }) };
    return out;
  }
  window.MinestExplode = { open: open, close: close, isOpen: function () { return !!cur; }, facts: facts, parts: parts, breakdown: breakdown };
})();
</script>
<script>/* Minest · 3D 词卡 · 学生页 (vocab3d.html?code=CODE, /vocab) — only the words the teacher assigned, as 3D dynamic
   cards (the 3D Cover modes, card styles, the exploded learning card). No Dock, no system keys, no way into the rest
   of Minest (2026-11-20, the user). The student marks each word 我会了 / 再看看; progress goes to the teacher:
   /minest-live/{CODE}/players/{pid} = { name, seen, known, total, at, k: { cardKey: 1 seen | 2 known } }. */
(function () {
  'use strict';
  var DB = 'https://minest-33761-default-rtdb.firebaseio.com/minest-live/';
  var qs = new URLSearchParams(location.search), PREVIEW = qs.has('preview');
  var VIEW = window.__V3_VIEW || 'cards';   // 'cards' (vocab3d.html) or 'drive' (vocab-drive.html): how the teacher chose to present the words
  function db(path, method, body) {
    return fetch(DB + path + '.json', { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('网络错误（' + r.status + '）'); return r.json(); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clean(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); }
  function key(id) { return String(id).replace(/[.#$\[\]\/]/g, '_').slice(0, 120); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var $ = function (s, r) { return (r || document).querySelector(s); };

  /* ---------------- the board the 3D cards read (a stand-in for Minest's own board) ---------------- */
  var B = { id: 'vocab3d', title: '', columns: [] }, CARDS = [];
  function raw(c, col) {   // the fields the exploded card reads
    var o = { id: c.id, title: c.title, titleZh: c.titleZh || '', meaning: c.meaning || '', pron: c.pron || '', definitions: { en: c.defEn || '', zh: c.defZh || '' },
      examples: (c.examples || []).map(function (t) { return { text: t }; }), relatedWords: c.related || [], etymology: c.ety || '', hint: c.hint || '', img: c.img || '' };
    o.columnTitle = col.title; o.columnColor = col.color || ''; return o;
  }
  window.MinestAI = { board: function () { return B; }, boards: function () { return [B]; } };
  window.MinestImageViews = {
    cards: function (b) { var out = []; (b.columns || []).forEach(function (c) { (c.cards || []).forEach(function (k) { out.push(k); }); }); return out; },
    image: function (c) { return { thumb: (c && c.img) || '', full: (c && c.img) || '' }; },
    select: function () {}
  };
  window.__mnNoVoice = false;

  /* ---------------- join: the code, then a name ---------------- */
  var code = clean(qs.get('code') || qs.get('c') || ''), host = null, me = null, pid = null;
  var J = $('#v3-join');
  function joinView(step, err) {
    J.hidden = false;
    if (step === 'code') {
      J.innerHTML = '<div class="v3j-card"><div class="v3j-logo">◈</div><h1>3D 词卡</h1><p>输入老师给你的课堂码</p>' +
        '<input class="v3j-code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="V·····" value="' + esc(code) + '">' +
        '<button type="button" class="v3j-go">进入</button><p class="v3j-err">' + esc(err || '') + '</p></div>';
      var inp = $('.v3j-code', J), go = function () { var c = clean(inp.value); if (c.length < 4) { $('.v3j-err', J).textContent = '课堂码不完整。'; return; } code = c; load(); };
      $('.v3j-go', J).onclick = go; inp.onkeydown = function (e) { if (e.key === 'Enter') go(); }; setTimeout(function () { inp.focus(); }, 50);
    } else if (step === 'name') {
      var saved = ls('minest.vocab3d.name') || '';
      J.innerHTML = '<div class="v3j-card"><div class="v3j-logo">◈</div><h1>' + esc(host.title) + '</h1><p>' + (host.words || 0) + ' 个词 · 写上你的名字，老师能看到你的进度</p>' +
        '<input class="v3j-name" maxlength="24" autocomplete="off" placeholder="你的名字" value="' + esc(saved) + '">' +
        '<button type="button" class="v3j-go">开始学习</button><p class="v3j-err">' + esc(err || '') + '</p></div>';
      var ni = $('.v3j-name', J), go2 = function () { var n = ni.value.trim().slice(0, 24); if (!n) { $('.v3j-err', J).textContent = '先写上名字。'; return; } ls('minest.vocab3d.name', n); start(n); };
      $('.v3j-go', J).onclick = go2; ni.onkeydown = function (e) { if (e.key === 'Enter') go2(); }; setTimeout(function () { ni.focus(); }, 50);
    } else {
      J.innerHTML = '<div class="v3j-card"><div class="v3j-logo spin">◈</div><p>' + esc(step) + '</p></div>';
    }
  }
  function load() {
    joinView('正在打开…');
    db(code + '/host').then(function (h) {
      if (!h || h.kind !== 'vocab3d' || !h.board) { joinView('code', '找不到这个课堂码，请检查一下。'); return; }
      var want = h.view === 'drive' || h.view === 'type' ? h.view : 'cards';
      if (want !== VIEW) { location.replace({ drive: 'vocab-drive.html', type: 'vocab-type.html', cards: 'vocab3d.html' }[want] + location.search); return; }
      host = h; pid = ls('minest.vocab3d.pid.' + code);
      if (PREVIEW) { start('老师预览'); return; }
      var n = ls('minest.vocab3d.name'); if (pid && n) start(n); else joinView('name');
    }).catch(function (e) { joinView('code', '打不开：' + e.message); });
  }

  /* ---------------- study ---------------- */
  var K = {}, synced = '', syncT = 0, EXTRA = null;
  function counts() { var s = 0, k = 0; CARDS.forEach(function (c) { var v = K[key(c.id)]; if (v) s++; if (v === 2) k++; }); return { seen: s, known: k }; }
  function save() {
    ls('minest.vocab3d.k.' + code, JSON.stringify(K)); paintPill();
    if (PREVIEW || !pid || host.state === 'ended') return;
    clearTimeout(syncT); syncT = setTimeout(function () {
      var c = counts(), body = { name: me, seen: c.seen, known: c.known, total: CARDS.length, at: Date.now(), k: K }, s = JSON.stringify([c, K, EXTRA]);
      if (EXTRA) body.type = EXTRA;
      if (s === synced) return;
      db(code + '/players/' + pid, 'PATCH', body).then(function () { synced = s; }).catch(function () {});
    }, 900);
  }
  function start(name) {
    me = name; J.hidden = true; J.innerHTML = '';
    if (!pid && !PREVIEW) { pid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); ls('minest.vocab3d.pid.' + code, pid); }
    try { K = JSON.parse(ls('minest.vocab3d.k.' + code) || '{}') || {}; } catch (e) { K = {}; }
    B.title = host.title; B.columns = (host.board.columns || []).map(function (col) { return { id: col.id, title: col.title, color: col.color, cards: (col.cards || []).map(function (c) { return raw(c, col); }) }; });
    CARDS = []; B.columns.forEach(function (c) { CARDS = CARDS.concat(c.cards); });
    document.title = host.title + (VIEW === 'drive' ? ' · Knowledge Drive' : VIEW === 'type' ? ' · 3D Type' : ' · 3D 词卡');
    $('#v3-ttl').textContent = host.title;
    if (host.state === 'ended') banner('老师已经结束了这个作业：还可以看，进度不再记录。');
    if (PREVIEW) banner('老师预览：这里的标记不会记进学生进度。');
    document.body.classList.add('v3-on');
    if (VIEW === 'drive') { drive(); paintPill(); save(); return; }
    if (VIEW === 'type') {
      if (window.V3Type) window.V3Type.start({ cards: CARDS, code: code, mark: function (c, v) { var k0 = key(c.id); if ((K[k0] || 0) < v) { K[k0] = v; save(); } }, extra: function (o) { EXTRA = o; synced = ''; save(); } });
      paintPill(); save(); return;
    }
    try { if (!window.MinestCoverModes.get() || window.MinestCoverModes.get() === 'flow') window.MinestCoverModes.set('wall'); } catch (e) {}
    try { window.dispatchEvent(new Event('minest:image-assets')); } catch (e) {}
    wrapExplode(); paintPill(); save();
  }

  /* ---------------- Knowledge Drive: the words as billboards along a road (each list a road) ---------------- */
  function driveBoard() {   // the drive reads cards in Minest's shape: title, titleZh, back, a cover picture
    return { id: 'vocab3d', title: B.title, columns: B.columns.map(function (col) {
      return { id: col.id, title: col.title, color: col.color, cards: col.cards.map(function (c) {
        var back = [c.pron, c.meaning || c.definitions.en, c.definitions.zh].filter(Boolean).join('\n');
        var o = { id: c.id, title: c.title, titleZh: c.titleZh || '', back: back, notes: c.examples.length ? c.examples.map(function (e) { return e.text; }).join('\n') : '' };
        if (c.img) o.cover = { type: 'image', value: c.img };
        return o;
      }) };
    }) };
  }
  var DB2 = null;
  function drive() {
    var end = $('#v3-end'); end.hidden = true;
    if (!window.MinestDrive || !window.THREE) { banner('这台设备打不开 3D 驾驶（WebGL 不可用）。'); return; }
    DB2 = DB2 || driveBoard();
    var P = { boards: function () { return [DB2]; }, openCard: null };
    try {
      window.MinestDrive.open({ source: { type: 'board', bid: DB2.id }, provider: P, fresh: false, onExit: function () { end.hidden = false; } });
    } catch (e) { banner('打不开 3D 驾驶：' + (e.message || e)); }
  }
  $('#v3-end [data-again]') && ($('#v3-end [data-again]').onclick = function () { drive(); });
  function driveFocus() { try { var d = window.MinestDrive && MinestDrive.current(); var f = d && d.state && d.state().focus; return f || null; } catch (e) { return null; } }
  function banner(t) { var b = $('#v3-banner'); b.textContent = t; b.hidden = false; }

  /* the word in view: the exploded card open on it; "我会了" / "再看看" */
  var cur = null;
  function cardOf(it) { var id = it && (it.id || (it.raw && it.raw.id)); for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === id) return CARDS[i]; return null; }
  function wrapExplode() {
    var X = window.MinestExplode; if (!X || X.__v3) return; X.__v3 = 1;
    var open = X.open; X.open = function (it) { var c = cardOf(it); if (c) { cur = c; if (!K[key(c.id)]) { K[key(c.id)] = 1; save(); } } var r = open.apply(this, arguments); paintMark(); return r; };
  }
  function byTitle() { var t = $('#xl .xl-title'); if (!t) return null; var s = t.textContent.replace(/^Exploded Learning Card · /, ''); for (var i = 0; i < CARDS.length; i++) if (CARDS[i].title === s) return CARDS[i]; return null; }
  function paintMark() {
    var m = $('#v3-mark'), open;
    if (VIEW === 'type') { m.hidden = true; document.body.classList.toggle('vt-playing', !!(document.getElementById('vt-play') && !document.getElementById('vt-play').hidden)); return; }
    if (VIEW === 'drive') {   // the billboard in focus is the word in view
      var t = driveFocus(); open = !!t;
      if (t) { var c0 = CARDS.filter(function (x) { return x.title === t; })[0]; if (c0 && c0 !== cur) { cur = c0; if (!K[key(c0.id)]) { K[key(c0.id)] = 1; save(); } } }
      m.hidden = !open || !cur; document.body.classList.toggle('v3-xl', open);
      if (!m.hidden) { var v0 = K[key(cur.id)]; $('[data-known]', m).classList.toggle('on', v0 === 2); $('[data-again]', m).classList.toggle('on', v0 === 1); }
      return;
    }
    open = !!document.getElementById('xl');
    if (open) { var c = byTitle(); if (c && c !== cur) { cur = c; if (!K[key(c.id)]) { K[key(c.id)] = 1; save(); } } }
    m.hidden = !open || !cur; document.body.classList.toggle('v3-xl', open);
    if (!m.hidden) { var v = K[key(cur.id)]; $('[data-known]', m).classList.toggle('on', v === 2); $('[data-again]', m).classList.toggle('on', v === 1); }
  }
  setInterval(paintMark, 350);
  function mark(v) { if (!cur) return; K[key(cur.id)] = v; save(); paintMark(); try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  $('#v3-mark [data-known]').onclick = function () { mark(2); };
  $('#v3-mark [data-again]').onclick = function () { mark(1); };

  /* the progress pill; a tap lists the words (a tap on one opens it) */
  function paintPill() {
    var c = counts(), n = CARDS.length || 1;
    $('#v3-n').textContent = c.known + ' / ' + CARDS.length;
    $('#v3-ring').style.setProperty('--p', (c.known / n * 100).toFixed(1));
    $('#v3-seen').textContent = '看过 ' + c.seen;
  }
  $('#v3-pill').onclick = function () {
    var s = $('#v3-sheet'); if (!s.hidden) { s.hidden = true; return; }
    s.innerHTML = '<div class="v3s-hd"><b>' + esc(host.title) + '</b><span>' + esc(me) + '</span><button type="button" data-x aria-label="关闭">✕</button></div><div class="v3s-tabs"><button data-f="all" class="on">全部</button><button data-f="again">再看看</button><button data-f="new">没看过</button><button data-f="known">会了</button></div><div class="v3s-list"></div>';
    var f = 'all';
    function list() {
      $('.v3s-list', s).innerHTML = CARDS.filter(function (c) { var v = K[key(c.id)]; return f === 'all' || (f === 'known' && v === 2) || (f === 'again' && v === 1) || (f === 'new' && !v); }).map(function (c) {
        var v = K[key(c.id)]; return '<button data-id="' + esc(c.id) + '"><i class="' + (v === 2 ? 'k' : v === 1 ? 'a' : '') + '"></i><b>' + esc(c.title) + '</b><small>' + esc(c.titleZh || c.meaning || '') + '</small></button>';
      }).join('') || '<p class="v3s-none">这里没有词。</p>';
      [].forEach.call(s.querySelectorAll('.v3s-list [data-id]'), function (b) { if (VIEW !== 'cards') { b.disabled = true; return; } b.onclick = function () { var c = CARDS.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; s.hidden = true; openWord(c); }; });
    }
    [].forEach.call(s.querySelectorAll('[data-f]'), function (b) { b.onclick = function () { f = b.getAttribute('data-f'); [].forEach.call(s.querySelectorAll('[data-f]'), function (x) { x.classList.toggle('on', x === b); }); list(); }; });
    $('[data-x]', s).onclick = function () { s.hidden = true; };
    list(); s.hidden = false;
  };
  function openWord(c) {
    var slot = document.querySelector('.sf-slot[data-sf-view="coverflow"]'); if (!c || !slot || !window.MinestExplode) return;
    var it = { raw: c, id: c.id, title: c.title, sub: c.columnTitle, src: c.img || '', desc: c.meaning || '', color: c.columnColor || '' };
    window.MinestExplode.open(it, CARDS.map(function (x) { return { raw: x, id: x.id, title: x.title, sub: x.columnTitle, src: x.img || '', desc: x.meaning || '' }; }), { container: slot });
  }

  /* students stay here: no links out, no right-click menu into the rest of the site */
  document.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('a[href]'); if (a) e.preventDefault(); }, true);
  if (code) load(); else joinView('code');
})();
