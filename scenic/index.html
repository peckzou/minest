<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Minest · Scenic World</title>
<style>
:root{--ink:#f6f1e8;--dim:rgba(246,241,232,.62);--glass:rgba(22,24,30,.38);--line:rgba(255,255,255,.16)}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1612;color:var(--ink);font:500 12px/1.4 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
/* the photo shows at once (no black, no white) while the 3D scene loads; the canvas fades in over it */
#plate{position:fixed;inset:0;background:#1a1612 center/cover no-repeat;transition:opacity 1.2s ease}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.2s ease}
body.live #gl{opacity:1}
.ui{position:fixed;z-index:3;transition:opacity .5s ease,transform .5s ease}
body.calm .ui.auto{opacity:0;pointer-events:none;transform:translateY(8px)}
#bar{left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--glass);
  border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.25)}
body.calm #bar{transform:translate(-50%,8px)}
#bar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;padding:7px 8px 6px;border-radius:16px;color:var(--ink);font-size:10.5px;letter-spacing:.02em}
#bar button:hover,#bar button.on{background:rgba(255,255,255,.12)}
#bar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panel{left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(380px,calc(100vw - 28px));padding:14px 16px;border-radius:20px;background:var(--glass);
  border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.panel[hidden]{display:none}
.panel h4{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline}
.panel h4 small{font-weight:400;color:var(--dim)}
.row{display:grid;grid-template-columns:62px 1fr 52px;align-items:center;gap:10px;margin:8px 0}
.row span{color:var(--dim)}.row b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.25);outline:none;touch-action:pan-x}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.scene{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;background:rgba(255,255,255,.08)}
.scene i{width:84px;height:56px;border-radius:9px;background:center/cover;flex:none}
.scene div{display:flex;flex-direction:column;gap:2px}.scene em{font-style:normal;color:var(--dim);font-size:11px}
.tag{display:inline-block;margin-top:4px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim);font-size:10px;width:max-content}
#shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:46vh;overflow:auto}
.shot{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:#222 center/cover}
.shot span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:10px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.shot button{all:unset;position:absolute;right:4px;top:3px;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;background:rgba(0,0,0,.45);font-size:11px;cursor:pointer}
.empty{color:var(--dim);padding:6px 2px}
#credit{right:calc(10px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));font-size:9.5px;color:rgba(255,255,255,.62);text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:62vw;text-align:right;pointer-events:none}
#credit a{color:inherit;pointer-events:auto}
#toast{left:50%;top:calc(22px + env(safe-area-inset-top));transform:translateX(-50%);padding:8px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none}
#toast.on{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .35s}
#hint{left:50%;top:calc(20px + env(safe-area-inset-top));transform:translateX(-50%);color:var(--dim);font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.5)}

/* the drone remote (Mode 2): left stick = throttle (rise / sink) and yaw (turn), right stick = pitch (forward / back) and roll (slide) */
.stick{position:fixed;z-index:3;bottom:calc(98px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);touch-action:none;transition:opacity .5s ease,transform .5s ease}
.stick::before,.stick::after{content:'';position:absolute;background:rgba(255,255,255,.18)}
.stick::before{left:50%;top:14px;bottom:14px;width:1px}.stick::after{top:50%;left:14px;right:14px;height:1px}
.stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#d8d8de);box-shadow:0 3px 10px rgba(0,0,0,.35);z-index:1}
.stick span{position:absolute;left:-20px;right:-20px;top:-19px;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.04em}
.stick b{position:absolute;font-size:9px;font-weight:500;color:rgba(255,255,255,.45)}
#stL{left:calc(22px + env(safe-area-inset-left))}#stR{right:calc(22px + env(safe-area-inset-right))}
body.calm .stick{opacity:0;pointer-events:none;transform:translateY(8px)}
@media (max-width:520px){.stick{width:104px;height:104px;bottom:calc(92px + env(safe-area-inset-bottom))}.stick i{width:42px;height:42px;margin:-21px}}
@media (max-width:420px){#bar button{min-width:44px;font-size:9.5px;padding:7px 5px 6px}}
</style>
</head>
<body class="calm">
<div id="plate"></div>
<canvas id="gl"></canvas>
<div class="ui auto" id="hint">左摇杆 升降·转向 · 右摇杆 前后·横移 · 拖动画面 云台 · 滚轮/双指 变焦 · 键盘 WASD QE RF</div>
<nav class="ui auto" id="bar">
  <button type="button" data-a="scenes"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 3-3 6 5"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>Scenes</button>
  <button type="button" data-a="camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
  <button type="button" data-a="reset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>Reset</button>
  <button type="button" data-a="capture"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/></svg>Capture</button>
  <button type="button" data-a="moments"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 15l4-3 3 2 4-4 5 4"/></svg>Moments</button>
  <button type="button" data-a="ambient"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Ambient</button>
  <button type="button" data-a="exit"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Exit</button>
</nav>
<section class="ui panel" id="pScenes" hidden><h4>Scenes <small>风景</small></h4><div id="sceneList"></div></section>
<section class="ui panel" id="pCamera" hidden>
  <h4>Scenic Camera <small id="camKind"></small></h4>
  <div class="row"><span>高度</span><input type="range" id="sHeight" min="0" max="1000" value="500"><b id="vHeight"></b></div>
  <div class="row"><span>推拉</span><input type="range" id="sDolly" min="0" max="1000" value="500"><b id="vDolly"></b></div>
  <div class="row"><span>焦距</span><input type="range" id="sFocal" min="0" max="1000" value="0"><b id="vFocal"></b></div>
  <div class="row"><span>侧移</span><input type="range" id="sOrbit" min="0" max="1000" value="500"><b id="vOrbit"></b></div>
</section>
<section class="ui panel" id="pMoments" hidden><h4>Return to This Moment <small>收藏的机位</small></h4><div id="shots"></div></section>
<div class="stick" id="stL"><span>升降 · 转向</span><b style="left:50%;top:4px;transform:translateX(-50%)">升</b><b style="left:50%;bottom:4px;transform:translateX(-50%)">降</b><b style="left:6px;top:50%;transform:translateY(-50%)">↺</b><b style="right:6px;top:50%;transform:translateY(-50%)">↻</b><i></i></div>
<div class="stick" id="stR"><span>前进 · 横移</span><b style="left:50%;top:4px;transform:translateX(-50%)">前</b><b style="left:50%;bottom:4px;transform:translateX(-50%)">后</b><b style="left:6px;top:50%;transform:translateY(-50%)">左</b><b style="right:6px;top:50%;transform:translateY(-50%)">右</b><i></i></div>
<div class="ui" id="credit"></div>
<div class="ui" id="toast"></div>
<div id="flash"></div>
<script src="../vendor/three.min.js"></script>
<script src="scenic-core.js"></script>
<script src="scenic.js"></script>
</body>
</html>
