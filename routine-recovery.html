<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Routine 本机恢复检查</title><style>body{font:16px/1.6 system-ui;margin:40px auto;max-width:900px;padding:20px;color:#23344b;background:#f7f9fc}article{padding:20px;margin:18px 0;border:1px solid #c8d5e5;border-radius:16px;background:white}button{padding:10px 18px;cursor:pointer}small{color:#65778f}p{overflow-wrap:anywhere}</style><h1>Routine 本机恢复检查</h1><p>只读取此网站在当前浏览器保留的日程与恢复副本，不写入、不同步、不替换任何数据。请保留原 Minest 标签页。</p><div id="status">正在检查…</div><main id="results"></main><script>
(function(){'use strict';var seen=new Set(),found=0,results=document.getElementById('results');function add(value,label){if(!value)return;if(Array.isArray(value)){value.forEach(function(v,i){add(v,label+' · 副本 '+(i+1));});return;}if(value.state){add(value.state,label+(value.at?' · '+new Date(value.at).toLocaleString():''));return;}if(value.version!==1||!Array.isArray(value.tasks))return;var raw=JSON.stringify(value);if(seen.has(raw))return;seen.add(raw);found++;var article=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),small=document.createElement('small'),b=document.createElement('button');h.textContent=label;p.textContent='日程标签：'+(value.routines||[{name:'主日程'}]).map(function(r){return r.name||r.id;}).join('、')+'。活动 '+value.tasks.length+' 项：'+value.tasks.map(function(t){return t.title;}).join('、');small.textContent='只读副本；导出后保存在本机。';b.textContent='导出这份日程 JSON';b.onclick=function(){var url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='routine-recovered-'+found+'-'+Date.now()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},10000);};article.append(h,p,small,document.createElement('br'),b);results.appendChild(article);}
try{for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(!/routine/i.test(key)||/sync-management|savedAt|theme|settings|palettes|immersive/i.test(key))continue;try{add(JSON.parse(localStorage.getItem(key)),key);}catch(e){}}document.getElementById('status').textContent='检查完成：找到 '+found+' 份不同的本机日程。此结果仅覆盖 '+location.origin+'；其它网站或 localhost 入口的数据互相独立。';}catch(e){document.getElementById('status').textContent='本机存储读取失败：'+e.message;}
})();
</script></html>
