<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17110d">
<title>EC–6 布告栏 2.0 · Study Studio MK II</title>
<link rel="icon" href="data:,">
<script>/* the files beside this page are addressed relatively: the address needs its last slash */
if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);</script>
<link rel="stylesheet" href="v2.css">
</head>
<body class="v2">
<!-- EC–6 布告栏 2.0: 1.0's board (../spatial-home/js/board-ec6.js) loaded unchanged; v2.css + v2.js are the whole upgrade -->
<div id="board"></div>
<nav id="rail" aria-label="布告栏工具 Board tools"></nav>
<button id="unzen" type="button" hidden>退出全屏</button>
<div id="sample" hidden>示例内容 · 在 Minest 里登录后，这里显示你的看板</div>
<iframe id="host" title="Minest" allow="camera; microphone; fullscreen; autoplay; clipboard-write" tabindex="-1"></iframe>
<button id="toBoard" type="button" hidden>↩ 回到布告栏</button>
<script>/* 2.0 keeps its own board, apart from 1.0's (same origin, same key in board-ec6.js). The first time, it starts from 1.0's board as it is now.
   ?demo=1 is the sample board, kept apart again so it never mixes with yours. */
(function () {
  var demo = /[?&]demo=1\b/.test(location.search);
  var K = 'minest.ec6board.v1', K2 = demo ? 'minest.ec6board2.demo' : 'minest.ec6board2.v1', g = Storage.prototype.getItem, s = Storage.prototype.setItem;
  try { if (g.call(localStorage, K2) == null) { window.EC6V2_FRESH = true; var v1 = demo ? null : g.call(localStorage, K); if (v1) s.call(localStorage, K2, v1); } } catch (e) {}
  Storage.prototype.getItem = function (k) { return g.call(this, k === K ? K2 : k); };
  Storage.prototype.setItem = function (k, v) { return s.call(this, k === K ? K2 : k, v); };
  window.EC6V2_DEMO = demo;
})();</script>
<script src="../spatial-home/js/board-ec6.js"></script>
<script src="v2.js"></script>
</body>
</html>
