<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Minest Badge Wall 28.6</title>
    <style>html, body, iframe { width: 100%; height: 100%; min-height: 100%; margin: 0; border: 0; background: #000; } body { overflow: hidden; }</style>
  </head>
  <body>
    <iframe id="compat-wall" src="./badge-wall-30.0.html?preview=1&v=badge-wall-28-6-compat" title="Minest Badge Wall 28.6"></iframe>
    <script>
      (function () {
        var frame = document.getElementById('compat-wall');
        window.addEventListener('message', function (event) {
          if (event.source === window.parent && frame.contentWindow) frame.contentWindow.postMessage(event.data, '*');
          if (event.source === frame.contentWindow && window.parent !== window) window.parent.postMessage(event.data, '*');
        });
      }());
    </script>
  </body>
</html>
