<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Minest · Interior</title>
<style>
html,body{margin:0;height:100%;background:#0b0a09;color:#f3ecdf;overflow:hidden;font:500 12px/1.45 ui-monospace,"SF Mono",Menlo,"PingFang SC",monospace;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;z-index:3}
#top{left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;pointer-events:auto}
.b{all:unset;cursor:pointer;padding:7px 11px;background:rgba(110,110,118,.55);border:2px solid #111;color:#fff;text-shadow:1px 1px 0 #3f3f3f;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.4)}
.b:active{box-shadow:inset -2px -2px 0 rgba(255,255,255,.3),inset 2px 2px 0 rgba(0,0,0,.45)}
#name{padding:6px 10px;background:rgba(0,0,0,.45);border:2px solid #111;text-shadow:1px 1px 0 #3f3f3f}
#views{right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
#credit{left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));text-align:center;font-size:10.5px;color:rgba(243,236,223,.75);text-shadow:1px 1px 0 #000}
#credit a{color:inherit;pointer-events:auto}
#hint{left:0;right:0;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 20px);text-align:center;color:rgba(243,236,223,.6);transition:opacity .8s}
#stick{position:fixed;z-index:3;left:max(20px,env(safe-area-inset-left));bottom:calc(max(20px,env(safe-area-inset-bottom)) + 34px);width:104px;height:104px;display:none;background:rgba(110,110,118,.3);border:2px solid rgba(0,0,0,.55);box-shadow:inset 2px 2px 0 rgba(255,255,255,.25),inset -2px -2px 0 rgba(0,0,0,.35)}
#stick i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;background:rgba(198,198,198,.9);box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #555}
body.touch #stick{display:block}
#load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#0b0a09}
#load .bar{width:min(320px,70vw);height:12px;border:2px solid #111;background:#2a2a2a;box-shadow:inset 2px 2px 0 rgba(0,0,0,.5)}
#load .bar i{display:block;height:100%;width:0;background:#4f8f3a;box-shadow:inset 2px 2px 0 rgba(255,255,255,.3)}
#load p{margin:10px 0 0;text-align:center;color:rgba(243,236,223,.75)}
html.mf-top #views{top:auto;bottom:calc(50% - 46px)}
html.mf-book #views{right:max(14px,env(safe-area-inset-right));left:calc(50% + 14px);justify-content:flex-start}
html.mf-book #stick{left:calc(50% + 20px)}
</style>
</head>
<body>
<div id="load"><div><div class="bar"><i></i></div><p id="loadTxt">正在载入…</p></div></div>
<div class="hud" id="top"><button class="b" id="back" type="button">‹ 返回</button><span id="name"></span></div>
<div class="hud" id="views"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="credit"></div>
<div id="stick" aria-hidden="true"><i></i></div>
<script src="../vendor/three.min.js"></script>
<script src="../vendor/GLTFLoader.js"></script>
<script src="../vendor/meshopt_decoder.js"></script>
<script src="../type3d/fold.js"></script>
<script src="viewer.js"></script>
</body>
</html>
