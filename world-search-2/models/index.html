<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d18">
<title>哲学模型馆 2.0 · Philosophy Models MK II · Minest</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="models.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button type="button" id="exit" class="pill" hidden>✕ 返回搜索</button>
    <a id="home" class="pill" href="../">← 搜索 2.0</a>
    <h1>哲学模型馆 <b>2.0</b><small>Philosophy Models MK II</small></h1>
    <div class="prog" title="已探索 Explored"><span id="prog-t"></span><i><u id="prog-b"></u></i></div>
  </header>
  <div class="tools">
    <label class="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg><input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索模型、哲学家、关键词 · Search" aria-label="搜索模型"><kbd>/</kbd></label>
    <div class="views" role="tablist" aria-label="视图 View">
      <button type="button" role="tab" data-view="grid">全部 <em>Grid</em></button><button type="button" role="tab" data-view="time">时间线 <em>Timeline</em></button><button type="button" role="tab" data-view="paths">学习路径 <em>Paths</em></button>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="筛选 Filter"></div>
  <main id="list" aria-live="polite"></main>
</div>

<section id="player" hidden aria-label="模型 Model">
  <div class="p-top">
    <button type="button" class="pill" id="p-back">← 模型馆</button>
    <button type="button" class="ic" id="p-prev" aria-label="上一个 Previous">‹</button>
    <div class="p-title"><b id="p-name"></b><small id="p-sub"></small></div>
    <button type="button" class="ic" id="p-next" aria-label="下一个 Next">›</button>
    <button type="button" class="pill" id="p-fav" aria-pressed="false">☆ 收藏</button>
    <button type="button" class="pill" id="p-done" aria-pressed="false">○ 标记已探索</button>
    <button type="button" class="pill" id="p-guide" aria-pressed="true">导览</button>
  </div>
  <div class="p-body">
    <iframe id="p-frame" title="哲学交互模型" allow="fullscreen"></iframe>
    <aside id="guide" aria-label="导览 Guide"></aside>
  </div>
</section>

<script>window.MinestToolkit = window.MinestToolkit || {};   /* 1.0's list of the models hangs itself on this (it is read, not changed) */</script>
<script src="../../tools/toolkit/phil-models.js"></script>
<script src="models.js"></script>
</body>
</html>
