<div id="sky" aria-hidden="true"></div>
<main>
  <div class="eyebrow"><b>2.0</b>MINEST · MY WORLD SEARCH MK II</div>
  <h1>My World <span>搜索 2.0</span></h1>
  <p class="lead">同一个搜索框，新的一版：它现在也搜索知识本身。知识引擎 2.0、五张卡片和哲学模型馆 2.0 都在这里试，原版 1.0 一行没改。</p>
  <button type="button" id="open" aria-label="打开搜索 Open search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg><span>搜索世界、知识与哲学模型…</span><kbd>⌘K</kbd></button>
  <div class="tiles">
    <button type="button" class="tile" style="--c:#9b5de5" data-q="人工智能会取代老师吗"><i></i><b>知识引擎 2.0</b><small>认得更多领域（物理、数学、AI、历史、健康…），给出置信度和候选位置。</small></button>
    <button type="button" class="tile" style="--c:#5e9cff" data-q="自由"><i></i><b>搜索框 2.0</b><small>世界、哲学模型、知识框架、思维模型、实验一起搜；分组、范围、最近搜索、键盘。</small></button>
    <a class="tile" style="--c:#f08c3a" href="models/"><i></i><b>哲学模型馆 2.0</b><small>46 个可以动手的模型：搜索、时间线、七条学习路径、进度和笔记。</small></a>
  </div>
  <div class="tries"><span>试试</span><button type="button" data-q="什么是自由？">什么是自由？</button><button type="button" data-q="因果">因果</button><button type="button" data-q="为什么天是蓝的">为什么天是蓝的</button><button type="button" data-q="柏拉图">柏拉图</button><button type="button" data-q="nietzche">nietzche（拼错也行）</button></div>
  <footer>这一页单独运行，「我的世界」里是示例内容；做出来的思考只存在这台设备的 2.0 记录里。 · <a href="../iphone.html">原版 Minest</a></footer>

<script>
(function () {
  function open(q) { MinestWorldSearch2.open(q == null ? undefined : q); }

  var h = {}; location.hash.slice(1).split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) { try { h[kv[0]] = decodeURIComponent(kv[1] || ''); } catch (e) {} } });
