<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>威尼斯水城 · Venezia Voxel</title>
<style>
  :root { --ink:#fff; --shadow:#3a3a3a; --slot:#8b8b8b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#9cc4e8; touch-action:none; overscroll-behavior:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace; color:var(--ink); -webkit-user-select:none; user-select:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .mc { color:#fff; font-weight:800; letter-spacing:.5px; text-shadow:2px 2px 0 var(--shadow); }
  .panel { background:rgba(20,20,24,.62); border:3px solid #111; box-shadow:inset 2px 2px 0 rgba(255,255,255,.18), inset -2px -2px 0 rgba(0,0,0,.35); }

  /* ---------- loading ---------- */
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:linear-gradient(#3b78c9,#cfe3f3 62%,#e9b88a); transition:opacity .8s; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading h1 { margin:0; font-size:clamp(34px,8vw,72px); }
  #loading .sub { font-size:clamp(13px,2.4vw,18px); opacity:.95; }
  #bar { width:min(380px,70vw); height:18px; border:3px solid #111; background:#2b2b2b; }
  #bar i { display:block; height:100%; width:0; background:repeating-linear-gradient(90deg,#6ee05a 0 10px,#58c247 10px 12px); transition:width .15s; }
  #loadMsg { font-size:14px; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; left:14px; top:calc(12px + env(safe-area-inset-top)); }
  #title b { font-size:clamp(18px,3vw,26px); display:block; }
  #title span { font-size:12px; opacity:.9; }
  #coords { margin-top:6px; font-size:12px; }
  #crosshair { position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; display:none; }
  #crosshair:before,#crosshair:after { content:""; position:absolute; background:#fff; mix-blend-mode:difference; }
  #crosshair:before { left:9px; top:0; width:2px; height:20px; } #crosshair:after { top:9px; left:0; height:2px; width:20px; }
  #banner { position:absolute; left:50%; top:16%; transform:translateX(-50%); text-align:center; opacity:0; transition:opacity .6s; }
  #banner.show { opacity:1; }
  #banner b { display:block; font-size:clamp(24px,5vw,46px); } #banner span { font-size:clamp(12px,2vw,16px); opacity:.9; }
  #mmWrap { position:absolute; right:12px; top:calc(12px + env(safe-area-inset-top)); padding:4px; pointer-events:auto; }
  #mm { display:block; width:168px; height:auto; image-rendering:pixelated; cursor:crosshair; }
  #timeBox { margin-top:4px; font-size:12px; display:flex; align-items:center; gap:6px; }
  #timeBox input { flex:1; accent-color:#6ee05a; min-width:0; pointer-events:auto; }
  #held { position:absolute; right:12px; bottom:calc(86px + env(safe-area-inset-bottom)); padding:6px 10px; font-size:13px; display:none; align-items:center; gap:8px; }
  #held i { width:18px; height:18px; border:2px solid #000; display:inline-block; }
  #hint { position:absolute; left:14px; bottom:calc(86px + env(safe-area-inset-bottom)); padding:8px 10px; font-size:12px; line-height:1.55; max-width:min(340px,60vw); }
  #hint.hide { display:none; }
  #hotbar { position:absolute; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; padding:3px; background:rgba(0,0,0,.55); border:3px solid #1a1a1a; pointer-events:auto; max-width:98vw; }
  .slot { position:relative; width:clamp(38px,8.6vw,58px); height:clamp(38px,8.6vw,58px); background:var(--slot); border:3px solid; border-color:#373737 #fff #fff #373737; margin:0 1px; display:flex; align-items:center; justify-content:center; font-size:clamp(18px,4.2vw,28px); cursor:pointer; }
  .slot small { position:absolute; left:3px; top:1px; font-size:10px; color:#fff; text-shadow:1px 1px 0 #222; }
  .slot em { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; white-space:nowrap; opacity:0; transition:opacity .15s; color:#fff; text-shadow:1px 1px 0 #000; pointer-events:none; }
  .slot:hover em { opacity:1; }
  .slot.on { outline:4px solid #fff; outline-offset:-1px; z-index:2; background:#a9a9a9; }
  .slot.off { filter:grayscale(1) brightness(.75); }
  #lmMenu { position:absolute; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none; flex-direction:column; gap:3px; padding:6px; pointer-events:auto; min-width:230px; }
  #lmMenu button { all:unset; cursor:pointer; padding:7px 10px; font-size:14px; color:#fff; text-shadow:1px 1px 0 #000; background:rgba(255,255,255,.08); border:2px solid transparent; }
  #lmMenu button:hover { background:rgba(255,255,255,.22); border-color:#fff; }
  #lmMenu small { opacity:.7; margin-left:8px; font-size:11px; }
  #lockHint { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); padding:10px 18px; font-size:15px; display:none; text-align:center; }
  #uw { position:absolute; inset:0; background:rgba(20,90,140,.38); display:none; }
  #toast { position:absolute; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translateX(-50%); padding:6px 12px; font-size:13px; opacity:0; transition:opacity .3s; }
  #toast.show { opacity:1; }

  /* ---------- touch controls ---------- */
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch #hint { display:none; }
  #joy { position:fixed; left:calc(22px + env(safe-area-inset-left)); bottom:calc(96px + env(safe-area-inset-bottom)); width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.14); border:3px solid rgba(255,255,255,.45); pointer-events:auto; touch-action:none; z-index:12; }
  #joy i { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.55); }
  .tbtn { position:fixed; width:54px; height:54px; border-radius:12px; background:rgba(255,255,255,.2); border:3px solid rgba(255,255,255,.55); color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; pointer-events:auto; z-index:12; touch-action:none; }
  #tJump { right:calc(24px + env(safe-area-inset-right)); bottom:calc(150px + env(safe-area-inset-bottom)); }
  #tDown { right:calc(24px + env(safe-area-inset-right)); bottom:calc(90px + env(safe-area-inset-bottom)); }
  #tFly { right:calc(92px + env(safe-area-inset-right)); bottom:calc(120px + env(safe-area-inset-bottom)); font-size:14px; }

  /* ---------- model library panel ---------- */
  #mpanel { position:fixed; z-index:30; right:0; top:0; bottom:0; width:min(520px,100vw); display:none; flex-direction:column; background:rgba(16,18,24,.94); border-left:3px solid #000; color:#eee; pointer-events:auto; font-size:13px; }
  #mpanel.open { display:flex; }
  #mpanel header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:2px solid #000; }
  #mpanel header b { font-size:16px; } #mpanel button, #mpanel input[type=button] { cursor:pointer; }
  .mbtn { background:#4a4a50; color:#fff; border:2px solid #000; padding:6px 10px; font:inherit; box-shadow:inset 2px 2px 0 rgba(255,255,255,.25), inset -2px -2px 0 rgba(0,0,0,.4); }
  .mbtn:hover { background:#5d5d66; }
  #mpanel .row { display:flex; gap:6px; padding:8px 14px; flex-wrap:wrap; align-items:center; }
  #mpanel input[type=text] { flex:1; min-width:120px; background:#0d0e12; color:#fff; border:2px solid #000; padding:7px 8px; font:inherit; }
  #mchips button { background:#2b2d35; color:#cfd3e0; border:1px solid #444; padding:3px 8px; font-size:12px; border-radius:10px; }
  #mchips button:hover { background:#3b3e4a; }
  #mstat { padding:2px 14px 6px; font-size:12px; color:#aab; min-height:18px; }
  #mgrid { flex:1; overflow:auto; padding:8px 14px 14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; align-content:start; -webkit-overflow-scrolling:touch; }
  .mcard { background:#20222a; border:2px solid #000; cursor:pointer; display:flex; flex-direction:column; }
  .mcard:hover { border-color:#6ee05a; }
  .mcard img { width:100%; aspect-ratio:16/9; object-fit:cover; background:#111; display:block; }
  .mcard div { padding:5px 7px 7px; } .mcard b { display:block; font-size:12px; line-height:1.3; overflow:hidden; max-height:2.6em; }
  .mcard span { font-size:11px; color:#9aa; display:block; margin-top:2px; }
  #mview { display:none; flex:1; flex-direction:column; min-height:0; }
  #mview.open { display:flex; } #mview iframe { flex:1; border:0; width:100%; background:#000; min-height:0; }
  #mview .cap { padding:8px 14px; font-size:12px; line-height:1.5; color:#bbc; } #mview a { color:#7ecbff; }
  #mpanel .imp { border-top:2px solid #000; padding:8px 14px 12px; font-size:12px; color:#aab; }
  #mpanel .imp .row { padding:4px 0; }
  #mpanel input[type=range] { accent-color:#6ee05a; flex:1; }
  #dropHint { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); font-size:28px; pointer-events:none; }
  body.dragging #dropHint { display:flex; }
</style>
<link rel="stylesheet" href="ui/voxel-shell.css?v=71" data-shell="71">
</head>
<body>
<nav id="mn-venice-nav" style="position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));z-index:99999999;display:flex;align-items:center;gap:8px;pointer-events:auto;font-family:system-ui,-apple-system,sans-serif;">
  <button type="button" id="mn-venice-back" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:24px;font-size:13px;font-weight:800;background:rgba(15,23,42,0.92);border:2px solid #60a5fa;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,0.55);cursor:pointer;backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none;"><span style="font-size:16px;">‹</span> <b>回到 My World (小岛)</b></button>
  <a href="worlds.html" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:24px;font-size:13px;font-weight:700;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.22);color:#cbd5e1;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,0.5);backdrop-filter:blur(8px);"><span>🌍</span> <span>3D世界大厅</span></a>
</nav>
<script>
document.getElementById('mn-venice-back').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation();
  if (window.parent && window.parent !== window) {
    try {
      if (window.parent.closeWorldOverlay3D) { window.parent.closeWorldOverlay3D(); return; }
      window.parent.postMessage({ action: 'closeMinest3DOverlay' }, '*');
      return;
    } catch(err) {}
  }
  window.location.href = 'iPhoneDuo.html';
});
</script>
<canvas id="gl" tabindex="0"></canvas>

<div id="loading">
  <h1 class="mc">VENEZIA</h1>
  <div class="mc sub">威尼斯水城 · 方块世界 · 圣马可广场 / 大运河 / 里亚托桥 / 叹息桥</div>
  <div id="bar"><i></i></div>
  <div id="loadMsg" class="mc">准备中…</div>
</div>

<div id="hud">
  <div id="title" class="mc"><b>VENEZIA 威尼斯</b><span id="modeLabel">导览模式</span><div id="coords"></div></div>
  <div id="crosshair"></div>
  <div id="banner" class="mc"><b id="bannerT"></b><span id="bannerS"></span></div>
  <div id="mmWrap" class="panel">
    <canvas id="mm" width="224" height="192"></canvas>
    <div id="timeBox" class="mc"><span id="clock">17:48</span><input id="timeSlider" type="range" min="0" max="24" step="0.05" value="17.8"></div>
  </div>
  <div id="held" class="panel mc"><i id="heldSw"></i><span id="heldName"></span></div>
  <div id="hint" class="panel mc"></div>
  <div id="lmMenu" class="panel"></div>
  <div id="lockHint" class="panel mc">点击画面开始 · Esc 退出鼠标控制</div>
  <div id="hotbar"></div>
  <div id="toast" class="panel mc"></div>
  <div id="uw"></div>
</div>

<div id="touch">
  <div id="joy"><i></i></div>
  <div id="tJump" class="tbtn">⤒</div>
  <div id="tDown" class="tbtn">⤓</div>
  <div id="tFly" class="tbtn">飞</div>
</div>

<div id="mpanel">
  <header><b>🌐 威尼斯 3D 模型库 · Sketchfab</b><button class="mbtn" id="mClose">✕ 关闭</button></header>
  <div class="row">
    <input type="text" id="mq" value="venice city" placeholder="搜索 Sketchfab 模型…">
    <button class="mbtn" id="mGo">搜索</button>
  </div>
  <div class="row" id="mchips"></div>
  <div class="row" style="padding-top:0"><label><input type="checkbox" id="mDl"> 仅可下载（CC）</label>
    <label><input type="checkbox" id="mAnim"> 仅含动画</label></div>
  <div id="mstat"></div>
  <div id="mgrid"></div>
  <div id="mview">
    <div class="row"><button class="mbtn" id="mBack">← 返回列表</button><span id="mTitle" style="font-weight:800"></span></div>
    <iframe id="mFrame" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen mozallowfullscreen webkitallowfullscreen></iframe>
    <div class="cap" id="mCap"></div>
  </div>
  <div class="imp">
    <b>导入 glTF / GLB 到当前场景</b>（来自 Sketchfab 下载、Kenney、Poly Pizza 等；也可直接把文件拖进页面）
    <div class="row"><input type="file" id="glbFile" accept=".glb,.gltf" style="max-width:190px">
      <input type="text" id="glbUrl" placeholder="https://…/model.glb（需允许跨域）"><button class="mbtn" id="glbGo">加载</button></div>
    <div class="row">缩放 <input type="range" id="glbScale" min="0.2" max="4" step="0.05" value="1"><button class="mbtn" id="glbClear">移除</button></div>
  </div>
</div>
<div id="dropHint" class="mc">松开以导入 .glb 模型</div>
