<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f1e">
<title>动态呈现 2.0 · Dynamic Presentation MK II</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tools/knowledge-drive/drive.css">
<link rel="stylesheet" href="../tools/knowledge-rail/rail.css">
<link rel="stylesheet" href="../tools/knowledge-rail/phase3.css">
<link rel="stylesheet" href="../tools/knowledge-balloon/balloon.css">
<link rel="stylesheet" href="v2.css">
</head>
<body>
<!-- 动态呈现 2.0: the eleven 1.0 presentations (../tools/knowledge-drive, knowledge-rail, knowledge-balloon) loaded unchanged;
     v2-data.js (the cards they travel through), v2-fx.js (画风 and 氛围), v2.css and v2.js are the whole upgrade -->
<main id="d2-lobby">
  <header>
    <div class="d2-brand"><small>Presentation Gallery · MK II</small><b>动态呈现 <i>2.0</i></b></div>
    <button id="d2-src" type="button" data-d2="srcbtn" aria-haspopup="dialog" aria-expanded="false"></button>
    <div id="d2-pass" title="体验过的呈现"></div>
  </header>
  <div id="d2-grid" role="listbox" aria-label="十一种动态呈现"></div>
  <footer id="d2-detail"></footer>
</main>
<div id="d2-panel" role="dialog" aria-label="选择看板和清单" hidden></div>
<button id="d2-fab" type="button" data-d2="side" aria-label="动态呈现 2.0：换乘、画风、氛围"><i>✦</i></button>
<aside id="d2-side" aria-label="动态呈现 2.0"></aside>
<div id="d2-curtain" aria-hidden="true"></div>
<div id="d2-toast" role="status"></div>
<script>/* 2.0 keeps its own progress, car, sound and settings apart from Minest's (same web address, and the 1.0 scripts use the same keys) */
(function () { var P = Storage.prototype, g = P.getItem, s = P.setItem, r = P.removeItem;
  function k2(k) { k = String(k); return /^minest[.-]/.test(k) && !/^minest\.dyn2\./.test(k) ? 'minest.dyn2.' + k.slice(7) : k; }
  P.getItem = function (k) { return g.call(this, k2(k)); }; P.setItem = function (k, v) { return s.call(this, k2(k), v); }; P.removeItem = function (k) { return r.call(this, k2(k)); }; })();</script>
<script src="../vendor/three.min.js"></script>
<script src="../v2-bridge/bridge.js"></script>
<script src="v2-data.js"></script>
<script src="v2-fx.js"></script>
<script src="../tools/knowledge-drive/sfx.js"></script>
<script src="../tools/knowledge-drive/drive.js"></script>
<script src="../tools/knowledge-drive/cars.js"></script>
<script src="../tools/knowledge-rail/rail-common.js"></script>
<script src="../tools/knowledge-rail/train.js"></script>
<script src="../tools/knowledge-rail/metro.js"></script>
<script src="../tools/knowledge-rail/tower.js"></script>
<script src="../tools/knowledge-rail/showcase-common.js"></script>
<script src="../tools/knowledge-rail/rack.js"></script>
<script src="../tools/knowledge-rail/library.js"></script>
<script src="../tools/knowledge-rail/museum.js"></script>
<script src="../tools/knowledge-rail/city.js"></script>
<script src="../tools/knowledge-rail/galaxy.js"></script>
<script src="../tools/knowledge-balloon/balloon.js"></script>
<script src="v2.js"></script>
</body>
</html>
