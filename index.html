<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focusboard Studio 8.1</title>
    <meta http-equiv="refresh" content="0; url=web8.1.html" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var forcedView = params.get("view");
          var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent) || (window.innerWidth <= 640 && window.innerHeight > window.innerWidth);
          if (forcedView === "mobile" || (!forcedView && isMobile)) {
            window.location.replace("iphone.html" + window.location.search);
          } else if (forcedView === "web8") {
            window.location.replace("web8.0.html" + window.location.search);
          } else if (forcedView === "web7") {
            window.location.replace("web7.0.html" + window.location.search);
          } else if (forcedView === "web6") {
            window.location.replace("web6.0.html" + window.location.search);
          } else {
            window.location.replace("web8.1.html" + window.location.search);
          }
        } catch(e) {
          window.location.replace("web8.1.html");
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #0b1117;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 12px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #30d158;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div style="font-size: 14px; opacity: 0.85; font-weight: 500;">Loading Focusboard Studio 8.1...</div>
  </body>
</html>
