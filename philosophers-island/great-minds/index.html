<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>思想家小岛 · Great Minds Island</title>
<style>
:root{color-scheme:light;--bg:#faf9f6;--surface:#fff;--ink:#252a2d;--muted:#697276;--line:#dfe3df;--soft:#f0f2ed;--brand:#334f48;--brand-ink:#fff;--sea:#83b8b8;--land:#aec38d;--landside:#758e69;--path:#e5d4ab;--roof:#b9654d;--wall:#ecddc1;--wood:#795d4a;--leaf:#687e58;--skin:#d2a780;--house:#ead9b9;--sky:#dce9e4;--shadow:#293b37;--model:#f5f2e9;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex="0"]:focus-visible{outline:2px solid #536e65;outline-offset:2px}.shell{max-width:1180px;margin:auto;min-height:100vh}.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted)}h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{display:flex;align-items:center;gap:6px;flex-shrink:0}.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-height:36px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .16s ease,color .16s ease}.btn:hover{background:var(--soft)}.btn.main{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.main:hover{filter:brightness(.93)}.btn.icon{width:36px;padding:0}.btn.ghost{border-color:transparent;background:transparent}.btn:disabled{opacity:.48;cursor:not-allowed}.content{padding:16px 20px 36px}.world{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--sky)}.scene{display:block;width:100%;height:auto;min-height:250px;max-height:520px}.caption{font-size:11px;color:var(--muted);padding:3px 14px 10px}.scene-label{font-size:13px;font-weight:650;fill:#253336;paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}.thinker-house{cursor:pointer}.thinker-house:hover{filter:brightness(1.05)}.house-roof{fill:var(--roof)}.house-wall{fill:var(--wall)}.house-door{fill:var(--wood)}.house-window{fill:#8bb5b7}.pillar{stroke:#f5ebd7;stroke-width:7}.tree{fill:var(--leaf)}.trunk{stroke:var(--wood);stroke-width:5}.head{fill:var(--skin)}.body{fill:#55736e}.road{fill:none;stroke:var(--path);stroke-width:16;stroke-linecap:round}.road-shadow{fill:none;stroke:var(--landside);stroke-width:24;stroke-linecap:round}.figure{transition:transform .35s ease}.ring{fill:none;stroke:#e6b660;stroke-width:3}.person{fill:#46667e}.visitor-shadow{fill:var(--shadow);opacity:.28}.plaza{fill:#d1bb89}.lamp{fill:#e2af59}.island-side{fill:var(--landside)}.island-top{fill:var(--land)}.sea{fill:var(--sea)}.wave{fill:none;stroke:#e0f0eb;stroke-width:3;opacity:.5}.night{--sky:#263544;--sea:#305563;--land:#596f54;--landside:#3d5147;--path:#8e8067;--roof:#945346;--wall:#b7a688;--wood:#56473f;--leaf:#455e4a;--ink:#eee9de;--muted:#aab5b4;--line:#47545a;--surface:#303a41;--soft:#3b464c;--brand:#8a9e8d;--brand-ink:#17231f;--model:#303a41}.night .scene-label{fill:#f4efe4;stroke:#596f54}.selected{margin-top:14px;border-bottom:1px solid var(--line);padding-bottom:14px}.selected-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.name{font-size:19px;font-weight:650;margin:0}.place{font-size:13px;color:var(--muted);margin:2px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.quick-title{font-size:13px;margin:15px 0 7px}.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 12px;border-top:1px solid var(--line)}.shortcut{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);padding:11px 6px;background:transparent}.shortcut:hover{background:var(--soft)}.dot{width:9px;height:9px;border-radius:99px;background:var(--leaf);flex:none}.shortcut-meta{min-width:0;flex:1}.shortcut-name{font-weight:550;display:block}.shortcut-place{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex;gap:3px;overflow:auto;white-space:nowrap;background:var(--soft);border-radius:10px;padding:4px;width:max-content;max-width:100%;margin-top:12px}.tab{border:0;background:transparent;border-radius:7px;padding:7px 12px;font-size:13px}.tab.active{background:var(--surface);box-shadow:0 1px 3px #0001}.panel{padding-top:13px}.chat{max-height:350px;min-height:100px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surface)}.message{max-width:min(90%,760px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}.message.user{margin-left:auto;background:var(--soft)}.message.thinker{margin-right:auto}.basis{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted);margin-top:7px}.composer{display:flex;align-items:flex-end;gap:8px;margin-top:10px}.composer textarea{flex:1;min-height:44px;max-height:130px;resize:vertical;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 11px}.notice{font-size:11px;color:var(--muted);margin:8px 0}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.bookgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}.bookgrid h3{font-size:14px;margin:0 0 8px}.bookgrid li{margin:7px 0;font-size:13px;color:var(--muted)}.model{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--model)}.model-title{font-weight:650}.model-text{min-height:55px;margin:12px 0}.model-steps{display:flex;align-items:center;justify-content:space-between;gap:8px}.overlay{position:fixed;inset:0;z-index:5;background:#10191875;display:flex;justify-content:flex-end}.drawer{height:100%;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 12px 40px #0003}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.drawer-head h2{font-size:16px;margin:0}.drawer-body{overflow:auto;padding:14px 16px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 4px}.list-row button.text{border:0;background:transparent;text-align:left;min-width:0;flex:1}.list-row small{display:block;color:var(--muted);font-size:12px}.compare-card{border-bottom:1px solid var(--line);padding:14px 2px}.compare-card h3{font-size:14px;margin:0}.compare-card p{font-size:13px;line-height:1.65}.field{display:block;font-size:13px;margin:12px 0}.field input,.field textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--surface);color:var(--ink)}.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 8px}.fine{font-size:11px;color:var(--muted)}.delete-box{padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:12px}.footer-note{font-size:11px;color:var(--muted);padding-top:14px}
@media(max-width:600px){.top{padding:0 10px;height:56px}.content{padding:10px 10px 24px}.nav{gap:2px}.nav .label{display:none}.nav .btn{padding:7px 9px}.scene{min-height:220px}.drawer{height:88vh;align-self:flex-end;border:1px solid var(--line);border-radius:16px 16px 0 0}.overlay{align-items:flex-end}.name{font-size:17px}.caption{padding-bottom:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="app">
  <header class="top">
    <div class="brand"><div class="brand-mark" aria-hidden="true">◈</div><h1>思想家小岛 · Great Minds Island</h1></div>
    <nav class="nav" aria-label="小岛功能">
      <button class="btn" data-panel="map" title="思想家地图">⌖ <span class="label">地图</span></button>
      <button class="btn" data-panel="compare" title="比较观点">⇄ <span class="label">观点对比</span></button>
      <button class="btn" data-panel="saved" title="我的收藏">▤ <span class="label">收藏</span></button>
      <button class="btn icon ghost" id="toggleNight" aria-label="切换昼夜" title="切换昼夜">☾</button>
    </nav>
  </header>
  <main class="content">
    <section class="world" aria-label="可探索的小岛场景">
      <svg class="scene" viewBox="0 0 900 440" role="group" aria-label="等距风格的小岛，选择住宅进行拜访">
        <rect width="900" height="440" fill="var(--sky)"/>
        <path class="sea" d="M0 316q145-55 275 0t270 0 355-15v139H0Z"/>
        <path class="wave" d="M20 365q110-25 210 2m455-38q100-25 180-4M135 405q110-25 205-4m410-9q70-18 126-6"/>
        <ellipse class="sea" cx="450" cy="252" rx="385" ry="170" opacity=".55"/>
        <path class="island-side" d="M110 230q18-104 155-133 168-49 313-11 154 30 217 119 43 65-34 124-111 73-289 76-189 5-307-51-81-39-55-124Z"/>
        <path class="island-top" d="M110 215q18-104 155-133 168-49 313-11 154 30 217 119 43 65-34 124-111 73-289 76-189 5-307-51-81-39-55-124Z"/>
        <path class="road-shadow" d="M210 237q112-41 206-1t181-4 148-5"/><path class="road" d="M210 229q112-41 206-1t181-4 148-5"/>
        <path class="road" d="M450 247q-50-42-99-66m99 66q47-40 105-67m-105 67q73 24 164 30" stroke-width="9"/>
        <g aria-hidden="true"><ellipse cx="450" cy="248" rx="66" ry="32" class="visitor-shadow"/><path d="m385 240 65-31 65 31-65 31Z" class="plaza"/><path d="m385 240 65 31v10l-65-31Zm130 0-65 31v10l65-31Z" class="island-side"/><circle cx="450" cy="238" r="10" class="lamp"/><text x="450" y="307" text-anchor="middle" class="scene-label">中央广场</text></g>
        <g id="houses"></g>
        <g id="visitor" class="figure" aria-hidden="true"><ellipse cx="450" cy="267" rx="9" ry="4" class="visitor-shadow"/><circle cx="450" cy="255" r="6" class="head"/><path d="M444 269q0-12 6-12t6 12Z" class="person"/></g>
      </svg>
      <div class="caption">点击地面走动或用方向键移动；点击房屋拜访思想家。</div>
    </section>
    <section id="details" aria-live="polite"></section>
    <p class="footer-note">独立 HTML 界面演示 · 对谈回复为本地示例，不连接 AI 服务；刷新后本页状态会重置。</p>
  </main>
</div>
<div id="overlay"></div>
<script>
const thinkers=[
 {id:'kant',name:'康德',latin:'Immanuel Kant',place:'柯尼斯堡书房',angle:306,open:false,works:['《纯粹理性批判》（1781/1787），A80/B106','《道德形而上学奠基》（1785）','《实践理性批判》（1788）','《什么是启蒙？》（1784）'],concepts:['定言命令：只按照你愿意它成为普遍法则的准则行动。','人是目的：永远不要把人仅仅当作手段。','自律：自由就是理性为自己立法。'],model:'十二范畴',steps:['量：单一性、多数性、全体性。','质：实在性、否定性、限制性。','关系：实体与偶性、原因与结果、交互作用。','模态：可能性、存在、必然性。'],voice:'理性要求我们先弄清自己行动的准则；若它不能成为普遍法则，我们便应重新审视它。'},
 {id:'socrates',name:'苏格拉底',latin:'Socrates',place:'雅典广场柱廊',angle:252,open:true,works:['柏拉图：《申辩篇》，38a','柏拉图：《克力同篇》','柏拉图：《游叙弗伦篇》','色诺芬：《回忆苏格拉底》'],concepts:['经过省察的人生：未经省察的人生不值得过。','自知无知：智慧始于承认自己的无知。','美德即知识：真正知道善的人必然行善。'],model:'苏格拉底问答法',steps:['提问：追问一件事物是什么。什么是勇敢？','回答：对话者给出一个定义。','检验：用例子揭示定义在哪里不成立。','困惑：承认自己并不知道，更诚实地重新探求。'],voice:'朋友，我不急于给你一个答案。先告诉我，你所说的“勇敢”究竟是什么？'},
 {id:'plato',name:'柏拉图',latin:'Plato',place:'柏拉图学园',angle:200,open:true,works:['《理想国》（约公元前375年），514a–520a','《会饮篇》（约公元前385年）','《斐多篇》（约公元前380年）','《斐德若篇》（约公元前370年）'],concepts:['理念：可见事物只是永恒不变的理念的影像。','善的理念：最高的理念，真理与存在的源泉。','灵魂三分：理性、激情与欲望；正义是三者的和谐。'],model:'洞穴寓言',steps:['影子：囚徒把墙上的影子当作真实。','火光：一名囚徒转过身，看见投下影子的物体。','上升：陡峭而痛苦地爬出洞穴。','太阳：洞外的太阳象征善的理念。','返回：他回到洞中想解救他人，却受到嘲笑。'],voice:'试想我们都坐在洞穴里，只看见墙上的影子。你追问的，也许正是影子背后那个真实。'},
 {id:'nietzsche',name:'尼采',latin:'Friedrich Nietzsche',place:'锡尔斯·玛丽亚山间小屋',angle:350,open:false,works:['《查拉图斯特拉如是说》（1883–85），第一部：论三种变形','《快乐的科学》（1882），第341节','《善恶的彼岸》（1886）','《道德谱系》（1887）'],concepts:['重估一切价值：追问你的价值从何而来，又为谁服务。','永恒轮回：你是否愿意让这一生无限次重来？','自我超越：通过超越自己，成为你自己。'],model:'精神三变',steps:['骆驼：精神跪下，背负最沉重的负担。“你应当”。','狮子：在荒漠中说出神圣的“不”，赢得自由。“我要”。','孩子：纯真与新的开始，以神圣的“是”创造新价值。'],voice:'不要先问哪种价值被允许；先问：你愿不愿意为自己的生命承担它的重量？'},
 {id:'confucius',name:'孔子',latin:'Confucius · Kong Qiu',place:'鲁国庭院',angle:158,open:true,works:['《论语·为政》2.4','《论语·颜渊》12.1–12.2','《论语·卫灵公》15.24'],concepts:['仁：爱人，以人道待人。','礼：使行为合乎分寸的规范。','恕：己所不欲，勿施于人。'],model:'人生的阶段（《论语·为政》）',steps:['吾十有五而志于学。','三十而立。','四十而不惑。','五十而知天命。','六十而耳顺。','七十而从心所欲，不逾矩。'],voice:'学习使人日日有所进。你此刻所忧虑的事，能否从身边的一件小事开始，照看好它？'}
];
let selected=null,knocked=false,inside=false,seated=false,night=false,tab='talk',stepIndex=0,chat=[],saved=[],snippets=[],modal=null,compareText='',compareDone=false;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function point(t){const a=t.angle*Math.PI/180;return{x:450+Math.cos(a)*292,y:242+Math.sin(a)*154}}
function drawHomes(){ $('#houses').innerHTML=thinkers.map(t=>{const p=point(t),w=t.id==='plato'?68:58;let hut=t.open?`<path d="M${p.x-w/2} ${p.y}L${p.x} ${p.y-40}L${p.x+w/2} ${p.y}Z" class="house-roof"/><path d="M${p.x-w/2+5} ${p.y}v18m${p.x} -18v18m${p.x+w/2-5} -18v18" class="pillar"/><path d="M${p.x-w/2-5} ${p.y+19}h${w+10}" stroke="var(--house)" stroke-width="5"/>`:`<path d="M${p.x-w/2} ${p.y-6}L${p.x} ${p.y-40}L${p.x+w/2} ${p.y-6}V${p.y+17}H${p.x-w/2}Z" class="house-wall"/><path d="M${p.x-w/2-5} ${p.y-6}L${p.x} ${p.y-47}L${p.x+w/2+5} ${p.y-6}Z" class="house-roof"/><path d="M${p.x-6} ${p.y+17}v-14q6-7 12 0v14Z" class="house-door"/><rect x="${p.x-23}" y="${p.y-16}" width="12" height="11" class="house-window"/><rect x="${p.x+12}" y="${p.y-16}" width="12" height="11" class="house-window"/>`;
return `<g class="thinker-house" tabindex="0" role="button" aria-label="拜访${esc(t.name)}" data-visit="${t.id}"><ellipse cx="${p.x}" cy="${p.y+22}" rx="38" ry="11" class="visitor-shadow"/><g>${hut}</g><path d="M${p.x+35} ${p.y+13}v17" class="trunk"/><path d="M${p.x+35} ${p.y-22}l-16 30h32Zm0 17-20 27h40Z" class="tree"/><circle cx="${p.x}" cy="${p.y-4}" r="8" class="head"/><path d="M${p.x-8} ${p.y+12}q2-15 8-15t8 15Z" class="body"/>${selected===t.id?`<circle cx="${p.x}" cy="${p.y-5}" r="37" class="ring"/>`:''}<text x="${p.x}" y="${p.y+49}" text-anchor="middle" class="scene-label">${esc(t.name)}</text></g>`}).join('');}
function showVisitor(x,y){$('#visitor').setAttribute('transform',`translate(${x-450} ${y-267})`)}
function renderDetails(){const host=$('#details');if(!selected){host.innerHTML=`<h2 class="quick-title">思想家地图</h2><div class="shortcuts">${thinkers.map(t=>`<button class="shortcut" data-visit="${t.id}"><span class="dot"></span><span class="shortcut-meta"><span class="shortcut-name">${esc(t.name)}</span><span class="shortcut-place">${esc(t.place)}</span></span><span aria-hidden="true">→</span></button>`).join('')}</div>`;return}
const t=thinkers.find(x=>x.id===selected);let action=!inside?(t.open?`<button class="btn main" id="enter">进入${t.name}的场景</button>`:knocked?`<button class="btn main" id="enter">进入${t.name}的住宅</button>`:`<button class="btn main" id="knock">敲门拜访</button>`):!seated?`<button class="btn main" id="sit">坐下对谈</button>`:`<button class="btn" id="stand">起身</button>`;
host.innerHTML=`<section class="selected"><div class="selected-head"><div><h2 class="name">${esc(t.name)} <span class="fine">${esc(t.latin)}</span></h2><p class="place">${esc(t.place)} · 时代风格重建</p></div><div class="actions">${action}<button class="btn" id="leave">${inside?'离开':'返回广场'}</button></div></div>${inside&&!seated?'<p class="fine">这是时代风格重建，不是原建筑的复制。</p>':''}${inside&&seated?`<div class="tabs" role="tablist"><button class="tab ${tab==='talk'?'active':''}" data-tab="talk">对谈</button><button class="tab ${tab==='works'?'active':''}" data-tab="works">著作</button><button class="tab ${tab==='model'?'active':''}" data-tab="model">思想模型</button></div><div id="tabContent" class="panel"></div>`:''}</section>`;
$('#enter')?.addEventListener('click',()=>{inside=true;seated=false;renderAll()});$('#knock')?.addEventListener('click',()=>{knocked=true;renderAll()});$('#sit')?.addEventListener('click',()=>{seated=true;renderAll()});$('#stand')?.addEventListener('click',()=>{seated=false;renderAll()});$('#leave')?.addEventListener('click',()=>{selected=null;inside=false;seated=false;knocked=false;chat=[];renderAll()});host.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAll()});if(inside&&seated)renderTab(t);
}
function renderTab(t){const pane=$('#tabContent');if(tab==='talk'){pane.innerHTML=`<div class="chat" id="chat">${chat.length?chat.map(m=>`<div class="message ${m.role}">${esc(m.text)}${m.role==='thinker'?`<br><span class="basis">${esc(m.basis)}</span>`:''}</div>`).join(''):'<p class="fine">问一个你正在思考的问题。这里展示的是本地示例回复，不是真正的 AI 对谈。</p>'}</div><form class="composer" id="chatForm"><textarea id="question" aria-label="向思想家提问" placeholder="向${esc(t.name)}提问"></textarea><button class="btn main" type="submit">发送</button></form><p class="notice">独立 HTML 演示：发送后会显示示例回应，不会连接 AI 服务。</p><div class="row-between"><button class="btn" id="saveChat" ${chat.length?'':'disabled'}>保存这段对话</button><button class="btn ghost" id="resetChat">重新开始</button></div>`;
$('#chatForm').onsubmit=e=>{e.preventDefault();const q=$('#question').value.trim();if(!q)return;chat.push({role:'user',text:q});chat.push({role:'thinker',text:t.voice,basis:'思想立场示例'});renderTab(t);$('#chat').scrollTop=$('#chat').scrollHeight};$('#saveChat').onclick=()=>{if(chat.length){saved.unshift({id:Date.now(),thinker:t.name,title:chat.find(m=>m.role==='user').text.slice(0,55),messages:[...chat],date:new Date().toLocaleDateString('zh-CN')});openPanel('saved')}};$('#resetChat').onclick=()=>{chat=[];renderTab(t)};
}else if(tab==='works'){pane.innerHTML=`<div class="bookgrid"><section><h3>著作与出处</h3><ol>${t.works.map(w=>`<li>${esc(w)}</li>`).join('')}</ol><p class="fine">出处请以原文版本为准。</p></section><section><h3>核心概念</h3><ul>${t.concepts.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section></div>`}else{pane.innerHTML=`<section class="model"><div class="model-title">${esc(t.model)}</div><p class="model-text">${esc(t.steps[stepIndex]||t.steps[0])}</p><div class="model-steps"><button class="btn" id="prev" ${stepIndex===0?'disabled':''}>上一步</button><span class="fine">第 ${stepIndex+1} 步 / 共 ${t.steps.length} 步</span><button class="btn" id="next" ${stepIndex===t.steps.length-1?'disabled':''}>下一步</button></div></section>`;$('#prev').onclick=()=>{stepIndex--;renderTab(t)};$('#next').onclick=()=>{stepIndex++;renderTab(t)}}}
function visit(id){const t=thinkers.find(x=>x.id===id);selected=id;knocked=t.open;inside=false;seated=false;chat=[];tab='talk';stepIndex=0;const p=point(t);showVisitor(p.x,p.y);drawHomes();renderDetails();$('#overlay').innerHTML=''}
function renderAll(){drawHomes();renderDetails();document.querySelector('.world').classList.toggle('night',night)}
function openPanel(type){modal=type;const o=$('#overlay');let title=type==='map'?'思想家地图':type==='saved'?'我的收藏':'观点对比';let body='';if(type==='map'){body=thinkers.map(t=>`<div class="list-row"><div><strong>${esc(t.name)}</strong><small>${esc(t.place)}</small></div><button class="btn" data-visit="${t.id}">前往</button></div>`).join('')}else if(type==='saved'){body=`<div class="tabs"><button class="tab active" data-save-tab="talks">对话</button><button class="tab" data-save-tab="snippets">片段</button></div><div id="savedBody">${saved.length?saved.map(s=>`<div class="list-row"><button class="text" data-open-save="${s.id}"><strong>${esc(s.title)}</strong><small>${esc(s.thinker)} · ${esc(s.date)} · ${s.messages.length} 条消息</small></button><button class="btn" data-delete-save="${s.id}">删除</button></div>`).join(''):'<p class="empty">还没有保存的对话。</p>'}</div>`}else{body=`<form id="compareForm"><label class="field">向五位思想家提出同一个问题<textarea id="compareQuestion" rows="3" placeholder="例如：什么使一种生活值得过？">${esc(compareText)}</textarea></label><button class="btn main" type="submit">比较五家观点</button></form><div id="compareResults">${compareDone?thinkers.map(t=>`<article class="compare-card"><h3>${esc(t.name)}</h3><p>${esc(t.voice)}</p><span class="basis">本地示例，不是 AI 生成</span></article>`).join(''):''}</div>`}
o.innerHTML=`<div class="overlay" role="presentation"><section class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><header class="drawer-head"><h2>${title}</h2><button class="btn icon" id="closePanel" aria-label="关闭">×</button></header><div class="drawer-body">${body}</div></section></div>`;$('#closePanel').onclick=()=>o.innerHTML='';o.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>visit(b.dataset.visit));if(type==='compare'){$('#compareForm').onsubmit=e=>{e.preventDefault();compareText=$('#compareQuestion').value.trim();if(compareText){compareDone=true;openPanel('compare')}}}if(type==='saved'){o.querySelectorAll('[data-delete-save]').forEach(b=>b.onclick=()=>{saved=saved.filter(x=>x.id!==Number(b.dataset.deleteSave));openPanel('saved')});o.querySelectorAll('[data-open-save]').forEach(b=>b.onclick=()=>{const item=saved.find(x=>x.id===Number(b.dataset.openSave));if(!item)return;const t=thinkers.find(x=>x.name===item.thinker);visit(t.id);chat=item.messages;inside=true;seated=true;tab='talk';renderAll()})}}
function moveTo(x,y){const clamped={x:Math.max(145,Math.min(755,x)),y:Math.max(105,Math.min(382,y))};showVisitor(clamped.x,clamped.y)}
drawHomes();renderDetails();document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));$('#toggleNight').onclick=()=>{night=!night;$('#toggleNight').textContent=night?'☀':'☾';document.querySelector('.world').classList.toggle('night',night)};$('#houses').addEventListener('click',e=>{const g=e.target.closest('[data-visit]');if(g)visit(g.dataset.visit)});$('#houses').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-visit]')){e.preventDefault();visit(e.target.closest('[data-visit]').dataset.visit)}});document.querySelector('.shortcuts').addEventListener('click',e=>{const b=e.target.closest('[data-visit]');if(b)visit(b.dataset.visit)});document.querySelector('.scene').addEventListener('keydown',e=>{const moves={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-12],ArrowDown:[0,12]};if(moves[e.key]){e.preventDefault();const tr=$('#visitor').getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/);const x=450+Number(tr?.[1]||0),y=267+Number(tr?.[2]||0);moveTo(x+moves[e.key][0],y+moves[e.key][1])}});document.querySelector('.scene').addEventListener('click',e=>{if(e.target.closest('[data-visit]'))return;const rect=e.currentTarget.getBoundingClientRect();const x=(e.clientX-rect.left)*900/rect.width,y=(e.clientY-rect.top)*440/rect.height;moveTo(x,y)});
</script>
</body>
</html>
