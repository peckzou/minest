<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 盖梯尔问题 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>盖梯尔问题</b>
  <button class="tab on" data-l="1">① 知识三条件</button>
  <button class="tab" data-l="2">② 十枚硬币</button>
  <button class="tab" data-l="3">③ 巴塞罗那</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div><div class="bd" id="sBody"></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;const done={};
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2800);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ======== 原文：Edmund Gettier, “Is Justified True Belief Knowledge?”, Analysis 23(6), 1963, pp.121–123。
   该文受版权保护：仅摘引极短原句；中文为编者转述（标“转述”）或短句翻译。 ======== */
const G='Gettier 1963';
const MAP={
1:[["三个仪表：真、信、理由","传统分析可表述为：S 知道 P，当且仅当 P 为真、S 相信 P、S 有理由相信 P。（转述）","(i) P is true, (ii) S believes that",G+"，p.121"],
   ["三灯齐亮：“知识”灯亮起","按这一分析，三个条件合在一起就足以构成知识。（转述）","S is justified in believing that P",G+"，p.121"],
   ["缺任一条件：灯灭","若命题为假，或不相信，或没有理由，就不是知识。（编者说明，非原文）","—","编者说明"]],
2:[["拖证据给史密斯：总裁的保证、数硬币","史密斯有强证据相信：琼斯会得到这份工作，并且琼斯口袋里有十枚硬币。（转述）","Jones is the man who will get the job, and Jones has ten coins in his pocket",G+" Case I"],
   ["史密斯推出(e)","(e) 将得到这份工作的人口袋里有十枚硬币。","The man who will get the job has ten",G+" Case I"],
   ["世界悄悄改变：史密斯自己得到工作","但设想，史密斯不知道的是，得到工作的是他自己，而不是琼斯。","he himself, not Jones, will get the job",G+" Case I"],
   ["他自己口袋里恰好也有十枚","也是在史密斯不知道的情况下，他自己口袋里有十枚硬币。","he himself has ten coins in his pocket",G+" Case I"],
   ["三灯齐亮，链条却断了","(e) 为真、史密斯相信、且有理由相信；但同样清楚的是，他并不知道(e)为真。（转述）","Smith does not know that (e) is true",G+" Case I"]],
3:[["拖证据：琼斯一直开福特","史密斯有强证据相信：(f) 琼斯有一辆福特车。","Jones owns a Ford",G+" Case II"],
   ["把随机地名拖进“或”槽","史密斯完全随机地选了三个地名，构造出三个“或者……或者……”的命题。（转述）","Either Jones owns a Ford, or Brown is in Barcelona",G+" Case II"],
   ["每个析取都由(f)推出：完全有理由","因此史密斯完全有理由相信这三个命题中的每一个。","Smith is therefore completely justified in believing each of these three propositions",G+" Case II"],
   ["揭晓：琼斯开的是租来的车","琼斯并没有福特车，而是正开着一辆租来的车。","Jones does not own a Ford, but is at present driving a rented car",G+" Case II"],
   ["布朗恰好在巴塞罗那","纯属巧合，而且完全不为史密斯所知，(h) 中提到的地方恰好就是布朗所在的地方。","by the sheerest coincidence, and entirely unknown to Smith",G+" Case II"]]};
const TITLE={1:'① 知识三条件 · 拖动“世界”开关改变事实；把证据卡拖给信念者；按住“相信”',2:'② 十枚硬币（Case I）· 把证据拖给史密斯，按住让他推理；然后让时间流逝，看世界如何悄悄改变',3:'③ 巴塞罗那（Case II）· 把地名拖进命题的空槽，再按住“揭晓”'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——${r[3]}</div></div></div>`).join('');}
function hit(l,i){const e=$('mr'+l+'_'+i);if(!e||e.classList.contains('on'))return;e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(MAP[l].every((_,k)=>$('mr'+l+'_'+k).classList.contains('on'))){done[l]=1;tabs();}}
let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});

/* 通用：三个仪表 + 知识灯 */
function gauge(x,y,r,v,label,col){ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(x,y,r,Math.PI*0.8,Math.PI*2.2);ctx.stroke();
  ctx.strokeStyle=v>0.99?col:'rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(x,y,r,Math.PI*0.8,Math.PI*0.8+Math.PI*1.4*clamp(v,0,1));ctx.stroke();
  txt(label,x,y+6,'#fff',14,'center',true);txt(v>0.99?'✓':Math.round(v*100)+'%',x,y+r+18,v>0.99?col:'#aab',12);}
function lamp(x,y,on,label,broken){const g=ctx.createRadialGradient(x,y,4,x,y,60);g.addColorStop(0,on?'rgba(255,230,120,.95)':'rgba(120,120,120,.3)');g.addColorStop(1,'rgba(255,230,120,0)');ctx.fillStyle=g;ctx.fillRect(x-60,y-60,120,120);
  ctx.fillStyle=on?'#ffe27a':'#555';ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fill();txt(label,x,y+46,on?'#ffe27a':'#889',14,'center',true);
  if(broken){ctx.strokeStyle='#ff5a5a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-26,y-26);ctx.lineTo(x+26,y+26);ctx.stroke();txt('知识？',x,y-34,'#ff8a8a',13,'center',true);}}
function card(x,y,w,h,t,c,sel){ctx.fillStyle=sel?'#fff7d6':c||'#fff';ctx.strokeStyle=sel?'#f3a52b':'#889';ctx.lineWidth=sel?3:1;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,8);ctx.fill();ctx.stroke();
  const lines=t.split('\n');lines.forEach((ln,i)=>txt(ln,x,y+5+(i-(lines.length-1)/2)*15,'#223',12));}

/* ================= 第 1 关：JTB 机器 ================= */
let A;
function init1(){A={world:false,worldX:0,believe:0,hold:false,just:0,cards:[{t:'窗外地面\n是湿的',w:0.35,x:0.1,y:0.25},{t:'天气预报\n说有雨',w:0.35,x:0.1,y:0.45},{t:'听到\n雨声',w:0.35,x:0.1,y:0.65},{t:'掷硬币\n正面',w:0,x:0.1,y:0.85}],drag:null,given:[],lit:false,litOnce:false};}
HD[1]={down(x,y){if(Math.abs(x-W*0.5)<70&&Math.abs(y-H*0.15)<30){A.world=!A.world;toast(A.world?'世界：正在下雨':'世界：没有下雨');return;}
  if(Math.hypot(x-W*0.5,y-H*0.62)<50){A.hold=true;return;}
  for(const c of A.cards){if(!c.used&&Math.abs(x-W*c.x)<50&&Math.abs(y-H*c.y)<26){A.drag=c;return;}}},
 move(x,y){if(A.drag){A.drag.x=x/W;A.drag.y=y/H;}},
 up(){A.hold=false;if(A.drag){const c=A.drag;A.drag=null;if(Math.hypot(W*c.x-W*0.5,H*c.y-H*0.62)<90){c.used=true;A.given.push(c);if(c.w===0)toast('掷硬币不是相信下雨的理由');}else{const i=A.cards.indexOf(c);c.x=0.1;c.y=0.25+i*0.2;}}}};
function t1(dt){ctx.fillStyle='#1c2230';ctx.fillRect(0,0,W,H);
  // 世界开关
  A.worldX=lerp(A.worldX,A.world?1:0,dt*5);ctx.fillStyle=A.world?'#3a6f99':'#555';ctx.beginPath();ctx.roundRect(W*0.5-70,H*0.15-24,140,48,24);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(W*0.5-46+92*A.worldX,H*0.15,18,0,7);ctx.fill();txt(A.world?'世界：在下雨 ☔':'世界：没下雨 ☀',W*0.5,H*0.15-34,'#cfd6e6',13);
  if(A.world)for(let i=0;i<30;i++){const x=(i*73+T*200)%W,y=(i*131+T*500)%H;ctx.strokeStyle='rgba(120,170,230,.25)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+12);ctx.stroke();}
  // 信念者
  if(A.hold)A.believe=Math.min(1,A.believe+dt*0.6);else A.believe=Math.max(0,A.believe-dt*0.15);
  const target=Math.min(1,A.given.reduce((s,c)=>s+c.w,0));A.just=lerp(A.just,target,dt*2);
  const px=W*0.5,py=H*0.62;ctx.fillStyle='#c79bff';ctx.beginPath();ctx.arc(px,py,40+A.believe*8,0,7);ctx.fill();txt('S',px,py+6,'#221',20,'center',true);
  txt(A.hold?'相信中……':'按住：让 S 相信“在下雨”',px,py+68,'#e8dcff',12);
  A.given.forEach((c,i)=>card(px-90+i*60,py+100,54,34,c.t,'#e6f0ff'));
  // 卡片
  A.cards.forEach(c=>{if(!c.used)card(W*c.x,H*c.y,96,44,c.t);});
  // 仪表
  const gx=W*0.8;const truth=A.world?1:0;gauge(gx-90,H*0.3,34,truth,'真','#7dffb0');gauge(gx,H*0.3,34,A.believe,'信','#c79bff');gauge(gx+90,H*0.3,34,A.just,'理由','#6ec6ff');
  hit(1,0);
  const all=truth>0.99&&A.believe>0.99&&A.just>0.99;lamp(gx,H*0.68,all,'知识');
  if(all){hit(1,1);A.litOnce=true;}
  if(A.litOnce&&!all)hit(1,2);
  txt('把左边的证据卡拖到 S 身上',W*0.1,H*0.08,'#cfd6e6',12);}

/* ================= 第 2 关：Case I ================= */
let B;
function init2(){B={ev:[{t:'总裁保证：\n琼斯会被录用',x:0.12,y:0.3,used:false},{t:'十分钟前\n数过琼斯的\n十枚硬币',x:0.12,y:0.58,used:false}],drag:null,given:0,reason:0,hold:false,time:0,timeHold:false,shift:0,inferred:false};}
HD[2]={down(x,y){if(x>W*0.72&&y>H*0.78){B.timeHold=true;return;}if(Math.hypot(x-W*0.42,y-H*0.45)<60&&B.given>=2){B.hold=true;return;}
  for(const c of B.ev){if(!c.used&&Math.abs(x-W*c.x)<60&&Math.abs(y-H*c.y)<34){B.drag=c;return;}}},
 move(x,y){if(B.drag){B.drag.x=x/W;B.drag.y=y/H;}},
 up(){B.hold=false;B.timeHold=false;if(B.drag){const c=B.drag;B.drag=null;if(Math.hypot(W*c.x-W*0.42,H*c.y-H*0.45)<90){c.used=true;B.given++;hit(2,0);}else{c.x=0.12;c.y=B.ev.indexOf(c)?0.58:0.3;}}}};
function person(x,y,r,col,name,coins,crown){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-r*1.6,r*0.5,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-r*0.6,y+r*0.4);ctx.quadraticCurveTo(x,y-r*1.6,x+r*0.6,y+r*0.4);ctx.fill();
  txt(name,x,y+r*0.4+18,'#fff',13,'center',true);
  if(coins!=null){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x-r*0.35,y-r*0.2,r*0.7,r*0.45);for(let i=0;i<coins;i++){ctx.fillStyle='#e8c34a';ctx.beginPath();ctx.arc(x-r*0.25+(i%5)*r*0.12,y-r*0.05+Math.floor(i/5)*r*0.14,r*0.06,0,7);ctx.fill();}}
  if(crown){ctx.fillStyle='#ffd27a';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('录用 ✓',x,y-r*2.4);}}
function t2(dt){ctx.fillStyle='#1c2230';ctx.fillRect(0,0,W,H);
  if(B.hold&&B.given>=2){B.reason=Math.min(1,B.reason+dt*0.5);if(B.reason>=1&&!B.inferred){B.inferred=true;hit(2,1);toast('史密斯推出：“将得到工作的人口袋里有十枚硬币”');}}
  if(B.timeHold&&B.inferred){B.time=Math.min(1,B.time+dt*0.25);}
  const sh=B.time;if(sh>0.45)hit(2,2);if(sh>0.8)hit(2,3);
  // 人物
  const sx=W*0.42,sy=H*0.62,jx=W*0.66,jy=H*0.62,r=H*0.08;
  person(sx,sy,r,'#3a6f99','史密斯',sh>0.8?10:null,sh>0.45);
  person(jx,jy,r,'#a0522d','琼斯',10,sh<0.45&&false);
  // 证据卡
  B.ev.forEach(c=>{if(!c.used)card(W*c.x,H*c.y,120,60,c.t);});
  // 史密斯头顶的信念泡泡
  if(B.given>0){ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.roundRect(sx-140,sy-r*4.2,280,r*1.4,14);ctx.fill();
    txt(B.reason>=1?'(e) 将得到工作的人有十枚硬币':`(d) 琼斯会被录用，且琼斯有十枚硬币`,sx,sy-r*3.4,'#223',13,'center',true);
    if(!B.inferred)meterBar(sx-60,sy-r*2.65,120,B.reason,'#c79bff','按住史密斯：推理');}
  // 理由链：从证据 → 史密斯信念 → 指向琼斯（他以为的使真者）
  const truthTarget=sh>0.8?{x:sx,y:sy}:{x:jx,y:jy};
  if(B.inferred){ctx.strokeStyle='#6ec6ff';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(sx,sy-r*2.8);ctx.quadraticCurveTo((sx+jx)/2,sy-r*4.5,jx,jy-r*2);ctx.stroke();ctx.setLineDash([]);txt('理由指向：琼斯',(sx+jx)/2,sy-r*4.5,'#6ec6ff',12);}
  // 使真者：真正让(e)为真的是谁
  if(sh>0.8){ctx.strokeStyle='#7dffb0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy-r*2.8);ctx.lineTo(sx,sy-r*0.3);ctx.stroke();txt('使(e)为真的：史密斯自己',sx-110,sy-r*1.2,'#7dffb0',12);
    // 断开标记
    const mx=(sx+jx)/2,my=sy-r*4.0;ctx.strokeStyle='#ff5a5a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(mx-14,my-10);ctx.lineTo(mx+14,my+10);ctx.moveTo(mx+14,my-10);ctx.lineTo(mx-14,my+10);ctx.stroke();}
  // 仪表与灯
  const gx=W*0.88;const truth=B.inferred?1:0;const bel=B.inferred?1:B.reason;const jus=B.given/2;
  gauge(gx,H*0.14,26,truth,'真','#7dffb0');gauge(gx,H*0.36,26,bel,'信','#c79bff');gauge(gx,H*0.58,26,jus,'理由','#6ec6ff');
  if(B.inferred&&sh<0.8)txt('此时(e)为真：琼斯会被录用且有十枚',W*0.62,H*0.08,'#aab',12);
  const all=truth&&bel>0.99&&jus>0.99;lamp(W*0.42,H*0.1+10,all&&sh<=0.8,'知识',all&&sh>0.8);
  if(all&&sh>0.8)hit(2,4);
  // 时间按钮
  ctx.fillStyle=B.timeHold?'#f3a52b':'rgba(255,255,255,.88)';ctx.fillRect(W*0.73,H*0.8,W*0.24,H*0.15);txt(B.inferred?'按住：让时间流逝':'（先让史密斯推理）',W*0.85,H*0.885,'#222',13,'center',true);
  if(B.inferred)meterBar(W*0.74,H*0.77,W*0.22,sh,'#f3a52b','');}
function meterBar(x,y,w,v,c,t){ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x,y,w,7);ctx.fillStyle=c;ctx.fillRect(x,y,w*v,7);if(t)txt(t,x+w/2,y+20,'#ccd',11);}

/* ================= 第 3 关：Case II ================= */
let C;
const PLACES=['波士顿','巴塞罗那','布列斯特-立托夫斯克','东京','开罗'];
function init3(){C={ev:false,evx:0.12,evy:0.25,drag:null,dragE:false,slots:[],places:PLACES.map((p,i)=>({p,x:0.08+i*0.12,y:0.88})),brown:PLACES[1],reveal:0,hold:false,shuffle:0};
  C.brown=PLACES[1];}
HD[3]={down(x,y){if(x>W*0.78&&y>H*0.78){C.hold=true;return;}
  if(!C.ev&&Math.abs(x-W*C.evx)<70&&Math.abs(y-H*C.evy)<32){C.dragE=true;return;}
  for(const p of C.places){if(!p.used&&Math.abs(x-W*p.x)<55&&Math.abs(y-H*p.y)<20){C.drag=p;return;}}},
 move(x,y){if(C.dragE){C.evx=x/W;C.evy=y/H;}if(C.drag){C.drag.x=x/W;C.drag.y=y/H;}},
 up(){C.hold=false;if(C.dragE){C.dragE=false;if(Math.hypot(W*C.evx-W*0.3,H*C.evy-H*0.5)<100){C.ev=true;hit(3,0);}else{C.evx=0.12;C.evy=0.25;}}
  if(C.drag){const p=C.drag;C.drag=null;if(p.x>0.38&&p.x<0.78&&p.y>0.2&&p.y<0.72&&C.slots.length<3){p.used=true;C.slots.push(p.p);hit(3,1);if(C.ev&&C.slots.length>=1)hit(3,2);}else{const i=C.places.indexOf(p);p.x=0.08+i*0.12;p.y=0.88;}}}};
function t3(dt){ctx.fillStyle='#1c2230';ctx.fillRect(0,0,W,H);
  if(C.hold&&C.slots.length)C.reveal=Math.min(1,C.reveal+dt*0.35);
  if(C.reveal>0.45)hit(3,3);
  // 史密斯
  const sx=W*0.3,sy=H*0.56,r=H*0.07;person(sx,sy,r,'#3a6f99','史密斯');
  if(!C.ev)card(W*C.evx,H*C.evy,140,56,'琼斯一直开福特，\n刚才还开福特载我','#e6f0ff');
  else{ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.roundRect(sx-90,sy-r*3.6,180,34,12);ctx.fill();txt('(f) 琼斯有一辆福特',sx,sy-r*3.6+22,C.reveal>0.45?'#c33':'#223',13,'center',true);
    if(C.reveal>0.45){ctx.strokeStyle='#ff5a5a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx-80,sy-r*3.6+17);ctx.lineTo(sx+80,sy-r*3.6+17);ctx.stroke();txt('其实是租来的车',sx,sy-r*3.6-8,'#ff8a8a',12);}}
  // 命题槽
  const px=W*0.58;txt('Smith 构造的命题：',px,H*0.14,'#cfd6e6',13);
  for(let i=0;i<3;i++){const y=H*0.24+i*H*0.16,pl=C.slots[i];ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(px-W*0.19,y-20,W*0.38,40);
    const fordOK=C.reveal<0.45;const brownHere=pl&&pl===C.brown&&C.reveal>0.85;
    txt('琼斯有福特',px-W*0.11,y+5,fordOK?'#cfe':'#c66',13);txt('或',px-W*0.03,y+5,'#ffd27a',14,'center',true);
    if(pl){txt(`布朗在${pl}`,px+W*0.08,y+5,brownHere?'#7dffb0':C.reveal>0.85?'#c66':'#cfe',13,'center',brownHere);
      const val=fordOK||brownHere;ctx.fillStyle=C.reveal>0.85?(val?'#7dffb0':'#c33'):'#7dffb0';txt(C.reveal>0.85?(val?'真':'假'):'由(f)推出 ✓',px+W*0.21,y+5,ctx.fillStyle,12,'left');
      if(brownHere){hit(3,4);ctx.strokeStyle='#ff5a5a';ctx.lineWidth=3;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(sx+r,sy-r*2.5);ctx.lineTo(px-W*0.15,y);ctx.stroke();ctx.setLineDash([]);txt('理由来自左边，真却来自右边：纯属巧合',px,y+34,'#ff8a8a',12);}}
    else{ctx.strokeStyle='rgba(255,255,255,.3)';ctx.setLineDash([4,4]);ctx.strokeRect(px+W*0.01,y-14,W*0.15,28);ctx.setLineDash([]);txt('拖入地名',px+W*0.085,y+5,'#889',11);}}
  // 地名
  C.places.forEach(p=>{if(!p.used)card(W*p.x,H*p.y,110,30,p.p,'#fff');});
  // 布朗真实位置（揭晓）
  if(C.reveal>0.85){txt(`布朗其实在：${C.brown}`,W*0.12,H*0.12,'#ffd27a',15,'left',true);}
  // 仪表
  const gx=W*0.9,anyBarca=C.slots.includes(C.brown);const truth=C.reveal>0.85?(anyBarca?1:0):1;
  gauge(gx,H*0.14,24,C.slots.length?truth:0,'真','#7dffb0');gauge(gx,H*0.34,24,C.slots.length?1:0,'信','#c79bff');gauge(gx,H*0.54,24,C.ev&&C.slots.length?1:0,'理由','#6ec6ff');
  ctx.fillStyle=C.hold?'#f3a52b':'rgba(255,255,255,.88)';ctx.fillRect(W*0.79,H*0.8,W*0.18,H*0.15);txt('按住：揭晓真相',W*0.88,H*0.885,'#222',13,'center',true);
  if(C.reveal>0)meterBar(W*0.8,H*0.77,W*0.16,C.reveal,'#f3a52b','');
  txt(!C.ev?'先把证据卡拖给史密斯':'把下方的地名随意拖进命题空槽',W*0.3,H*0.06+10,'#cfd6e6',12);}

/* ======== 调度 ======== */
const INIT={1:init1,2:init2,3:init3},TICK={1:t1,2:t2,3:t3};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!done[t.dataset.l]);});}
function go(n){L=n;tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);INIT[L]();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{INIT[L]();toast('已重置（已对应的原文保留）');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(1);requestAnimationFrame(loop);
</script>
