<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 笛卡尔方法性怀疑 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>笛卡尔 · 方法性怀疑</b>
  <button class="tab on" data-l="1">① 信念的大厦</button>
  <button class="tab" data-l="2">② 感官</button>
  <button class="tab" data-l="3">③ 梦</button>
  <button class="tab" data-l="4">④ 恶魔与我思</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div><div class="bd" id="sBody"></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;const done={};
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ======== 原文：Veitch 英译《第一哲学沉思集》（1901）；中文编译 ======== */
const M1='《第一哲学沉思集》第一沉思',M2='《第一哲学沉思集》第二沉思';
const MAP={
1:[["一座由信念垒成的大厦","我早年把许多错误的意见当作真的接受下来，此后建立在这些原则上的东西都十分可疑。","I had accepted, even from my youth, many false opinions for true, and that consequently what I afterward based on such principles was highly doubtful",M1+" §1"],
   ["想一块块检验：太慢了","也没有必要逐一处理每个信念，那将是无尽的劳作。","Nor for this purpose will it be necessary even to deal with each belief individually, which would be truly an endless labor",M1+" §2"],
   ["撬动地基：整层随之倒塌","既然从底下移除地基必然导致整座大厦倒塌，我就直接去批判我以前一切信念所依据的原则。","as the removal from below of the foundation necessarily involves the downfall of the whole edifice, I will at once approach the criticism of the principles on which all my former beliefs rested",M1+" §2"],
   ["只要有可疑之处就推倒","只要我在每一个里面找到某种怀疑的理由，就足以把全部拒绝。","it will be sufficient to justify the rejection of the whole if I shall find in each some ground for doubt",M1+" §2"]],
2:[["远处的塔：看起来是圆的","我至今接受为最真实、最确定的一切，都是从感官或通过感官得来的。","All that I have, up to this moment, accepted as possessed of the highest truth and certainty, I received either from or through the senses",M1+" §3"],
   ["走近：原来是方的","我发现感官有时会误导我们；而对曾经欺骗过我们一次的东西，不完全信任才是审慎的。","it is the part of prudence not to place absolute confidence in that by which we have even once been deceived",M1+" §3"],
   ["近处的东西：炉火、手、纸","感官虽然在微小或遥远的事物上有时误导我们，但还有许多……似乎显然不可能怀疑：比如我在这里，坐在炉火旁。","although the senses occasionally mislead us respecting minute objects, and such as are so far removed … as for example, that I am in this place, seated by the fire",M1+" §4"]],
3:[["按住“掐自己”：寻找醒着的标志","此刻我确实睁着眼睛看这张纸；我现在转动的头并没有睡着；我有意识地伸出这只手。","At the present moment, however, I certainly look upon this paper with eyes wide awake; the head which I now move is not asleep",M1+" §5"],
   ["醒与梦交替：找不到区别","我清楚地看到，没有任何确定的标志可以把醒与睡区别开来。","there exist no certain marks by which the state of waking can ever be distinguished from sleep",M1+" §5"],
   ["梦里梦外：2 + 3 = 5 不变","无论我醒着还是在做梦，二加三总是五，正方形总只有四条边。","whether I am awake or dreaming, it remains true that two and three make five, and that a square has but four sides",M1+" §8"],
   ["可是：若有一位全能者让我算错？","我怎么知道，每次我把二和三相加，或数正方形的边时，我不是也被欺骗了？","how do I know that I am not also deceived each time I add together two and three, or number the sides of a square",M1+" §9"]],
4:[["恶魔出现：吞噬一切信念","我将假定……有某个既强大又狡诈的恶魔，用尽一切伎俩来欺骗我。","some malignant demon, who is at once exceedingly potent and deceitful, has employed all his artifice to deceive me",M1+" §12"],
   ["天空、大地、颜色……都成了梦的幻象","我将假定天空、空气、大地、颜色、形状、声音以及一切外物，都不过是梦的幻象。","the sky, the air, the earth, colors, figures, sounds, and all external things, are nothing better than the illusions of dreams",M1+" §12"],
   ["按住“悬置判断”：不让假信念进入","我至少能做在我能力之内的事，即悬置判断，坚决地防止自己同意虚假的东西。","[suspend my judgment], and guard with settled purpose against giving my assent to what is false",M1+" §12"],
   ["寻找一个不动的点","阿基米德为了把整个地球移到别处，只要求一个坚实不动的点。","Archimedes, that he might transport the entire globe from the place it occupied to another, demanded only a point that was firm and immovable",M2+" §1"],
   ["把攻击拖向“我”：每一次欺骗都证明我在","那么毫无疑问，既然我被欺骗，我就存在；任凭他怎样欺骗我，只要我意识到我是某种东西，他就永远不能使我什么都不是。","Doubtless, then, I exist, since I am deceived; and, let him deceive me as he may, he can never bring it about that I am nothing",M2+" §3"],
   ["“我在，我存在”","“我在，我存在”这个命题，每当我说出或在心中想到它时，必然是真的。","this proposition (pronunciatum) I am, I exist, is necessarily true each time it is expressed by me, or conceived in my mind",M2+" §3"],
   ["我是什么？一个思维的东西","确切地说，我只是一个思维的东西，即一个心灵、理智或理性。","I am therefore, precisely speaking, only a thinking thing, that is, a mind (mens sive animus), understanding, or reason",M2+" §6"]]};
const TITLE={1:'① 信念的大厦 · 点击单块砖：逐一检验；把撬棍拖到地基下，按住来回撬动',2:'② 感官 · 按住画面向前走，接近远处的塔；再看看近处',3:'③ 梦 · 按住“掐自己”；在醒与梦之间寻找区别',4:'④ 恶魔与我思 · 按住“悬置判断”抵御；把恶魔的攻击拖向中心'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——笛卡尔${r[3]}</div></div></div>`).join('');}
function hit(l,i){const e=$('mr'+l+'_'+i);if(!e||e.classList.contains('on'))return;e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(MAP[l].every((_,k)=>$('mr'+l+'_'+k).classList.contains('on'))){done[l]=1;tabs();}}

let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});

/* ================= 第 1 关：信念的大厦 ================= */
const TIERS=[ // 自下而上：地基层名称 + 其上的信念
 {f:'感官',bel:['火是热的','雪是白的','钟声在响','这是我的手','远山是青的','蜜是甜的']},
 {f:'醒着',bel:['我坐在炉火旁','我穿着睡袍','我手里拿着纸','我在这个房间']},
 {f:'物体的一般本性',bel:['物体有广延','形状与大小','数与位置']},
 {f:'简单真理',bel:['2 + 3 = 5','正方形四条边']}];
let A;
function init1(){A={bricks:[],checked:0,pry:null,pryX:0,pryHold:false,shake:[0,0,0,0],fallen:[false,false,false,false],t0:T};
  // 大厦：每层地基一排宽砖，上面若干信念砖（越高越窄）
  const bw=W*0.5,cx=W*0.42,base=H*0.92;let y=base;
  TIERS.forEach((t,ti)=>{const fh=H*0.07,w=bw*(1-ti*0.16);A.bricks.push({tier:ti,found:true,label:t.f,x:cx-w/2,y:y-fh,w,h:fh,vx:0,vy:0,rot:0,vr:0,live:true});y-=fh;
    const n=t.bel.length,rh=H*0.055,cols=Math.min(3,n),rows=Math.ceil(n/cols);
    for(let r=0;r<rows;r++){const k=Math.min(cols,n-r*cols);const bwid=w*0.9/k;for(let c=0;c<k;c++){const idx=r*cols+c;A.bricks.push({tier:ti,found:false,label:t.bel[idx],x:cx-w*0.45+c*bwid,y:y-rh,w:bwid-3,h:rh-3,vx:0,vy:0,rot:0,vr:0,live:true,ok:false});}y-=rh;}});
  A.pryX=W*0.9;A.pryY=H*0.8;}
HD[1]={down(x,y){if(Math.hypot(x-A.pryX,y-A.pryY)<40){A.pry=true;return;}
  for(const b of A.bricks){if(!b.found&&b.live&&!b.falling&&x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){b.testing=0.001;hit(1,0);return;}}},
 move(x,y,dx){if(A.pry){A.pryX=x;A.pryY=y;const f=A.bricks.find(b=>b.found&&!b.falling&&x>b.x-20&&x<b.x+b.w&&Math.abs(y-(b.y+b.h/2))<b.h);A.target=f?f.tier:null;if(f&&Math.abs(dx)>1){A.shake[f.tier]+=Math.abs(dx)/(W*0.25);}}},
 up(){A.pry=false;}};
function topple(ti){A.fallen[ti]=true;A.bricks.forEach(b=>{if(b.tier>=ti&&!b.falling){b.falling=true;b.vx=(Math.random()-.5)*160+(b.tier-ti)*20;b.vy=-Math.random()*120;b.vr=(Math.random()-.5)*4;}});
  hit(1,2);if(ti===0)hit(1,3);toast(`撬倒了“${TIERS[ti].f}”：它上面的一切信念随之倒塌`);}
function t1(dt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#dfe7ee');g.addColorStop(1,'#c4cfd8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8a8478';ctx.fillRect(0,H*0.92,W,H*0.08);if(T-A.t0>1)hit(1,0);
  // 逐一检验：被点击的砖慢慢“检验”
  A.bricks.forEach(b=>{if(b.testing>0&&!b.ok){b.testing+=dt*0.25;if(b.testing>=1){b.ok=true;b.testing=0;A.checked++;if(A.checked>=2)hit(1,1);toast(`检验完一个信念，用时 4 秒。还剩 ${A.bricks.filter(x=>!x.found&&!x.ok).length} 个……`);}}});
  // 撬动：震动累积超过阈值则倒塌
  A.shake=A.shake.map((s,i)=>A.fallen[i]?0:Math.max(0,s-dt*0.12));
  A.shake.forEach((s,i)=>{if(s>1&&!A.fallen[i])topple(i);});
  A.bricks.forEach(b=>{let ox=0;if(!b.falling){const s=Math.max(...A.shake.map((v,i)=>b.tier>=i?v:0));ox=(Math.random()-.5)*s*8;}
    if(b.falling){b.vy+=900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vr*dt;if(b.y+b.h>H*0.92){b.y=H*0.92-b.h;b.vy*=-0.25;b.vx*=0.6;b.vr*=0.5;}}
    ctx.save();ctx.translate(b.x+b.w/2+ox,b.y+b.h/2);ctx.rotate(b.rot);
    ctx.fillStyle=b.found?(b.falling?'#8a7d6a':'#a8957a'):b.falling?'#c9c1b3':b.ok?'#b9d6b0':'#efe6d4';ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
    if(b.testing>0){ctx.fillStyle='rgba(58,111,153,.35)';ctx.fillRect(-b.w/2,-b.h/2,b.w*b.testing,b.h);}
    txt(b.label,0,4,b.found?'#fff':'#333',b.found?13:11,'center',b.found);ctx.restore();});
  // 撬棍
  ctx.save();ctx.translate(A.pryX,A.pryY);ctx.rotate(-0.5+(A.pry&&PT?Math.sin(T*20)*0.1:0));ctx.fillStyle='#555';ctx.fillRect(-6,-60,12,70);ctx.fillRect(-6,6,30,8);ctx.restore();
  if(!A.pry)txt('撬棍',A.pryX,A.pryY+30,'#444',12);
  // 震动计
  TIERS.forEach((t,i)=>{if(A.fallen[i])return;const s=A.shake[i];if(s>0.02){const b=A.bricks.find(x=>x.found&&x.tier===i);ctx.fillStyle='rgba(192,57,43,.8)';ctx.fillRect(b.x+b.w+8,b.y,6,b.h*clamp(s,0,1));}});
  const left=A.bricks.filter(b=>!b.found&&!b.falling&&!b.ok).length;
  txt(A.fallen[0]?'地基没了：建立在感官之上的一切都倒下了。剩下的去下几关检验':`未检验的信念：${left}　·　把撬棍拖到某一层地基边缘，按住左右来回撬`,W*0.45,22,'#223',13);}

/* ================= 第 2 关：感官 ================= */
let B;
function init2(){B={walk:0,hold:false,near:false};}
HD[2]={down(){B.hold=true;},up(){B.hold=false;},move(x,y,dx,dy,down){if(down&&dy<0)B.walk=clamp(B.walk-dy/(H*1.2),0,1);}};
function t2(dt){if(B.hold)B.walk=clamp(B.walk+dt*0.12,0,1);const k=B.walk;
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a9d2ee');sky.addColorStop(1,'#f0e8d6');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const hz=H*lerp(0.55,0.75,k);ctx.fillStyle='#b9a77e';ctx.fillRect(0,hz,W,H-hz);
  // 路
  ctx.fillStyle='#d6c49a';ctx.beginPath();ctx.moveTo(W*0.4,H);ctx.lineTo(W*0.49,hz);ctx.lineTo(W*0.51,hz);ctx.lineTo(W*0.6,H);ctx.fill();
  // 塔：远处由于大气模糊，看上去是圆柱；近了变成方柱
  const s=lerp(0.08,0.55,k*k),tx=W/2,tw=W*0.12*s/0.08*0.35,th=H*lerp(0.12,0.9,k*k);
  const sq=clamp((k-0.55)/0.35,0,1);
  ctx.save();ctx.filter=`blur(${Math.round((1-k)*4)}px)`;
  ctx.fillStyle='#8c8f98';ctx.fillRect(tx-tw/2,hz-th,tw,th);
  // 圆柱高光 vs 方柱棱角
  const gr=ctx.createLinearGradient(tx-tw/2,0,tx+tw/2,0);gr.addColorStop(0,`rgba(60,60,70,${0.6*(1-sq)})`);gr.addColorStop(0.5,`rgba(220,220,230,${0.6*(1-sq)})`);gr.addColorStop(1,`rgba(60,60,70,${0.6*(1-sq)})`);ctx.fillStyle=gr;ctx.fillRect(tx-tw/2,hz-th,tw,th);
  ctx.fillStyle=`rgba(70,72,82,${sq})`;ctx.fillRect(tx,hz-th,tw/2,th);ctx.fillStyle=`rgba(190,192,200,${sq})`;ctx.fillRect(tx-tw/2,hz-th,tw/2,th);
  // 顶
  ctx.fillStyle='#6e717c';if(sq<0.5){ctx.beginPath();ctx.ellipse(tx,hz-th,tw/2,tw*0.15*(1-sq*2)+1,0,0,7);ctx.fill();}else{ctx.beginPath();ctx.moveTo(tx-tw/2,hz-th);ctx.lineTo(tx,hz-th-tw*0.12);ctx.lineTo(tx+tw/2,hz-th);ctx.lineTo(tx,hz-th+tw*0.12);ctx.fill();}
  ctx.restore();
  if(k<0.05)hit(2,0);
  const looks=sq<0.3?'圆的':sq<0.8?'……':'方的';
  txt(`那座塔看起来是：${looks}`,W/2,26,'#223',16,'center',true);
  if(sq>0.9){hit(2,1);txt('刚才的感官骗了我。被骗过一次，就不该完全信任',W/2,50,'#b00020',14);}
  if(k>=0.98){B.near=true;}
  // 近处：炉火与手（到达后出现）
  if(B.near){ctx.fillStyle='rgba(40,25,15,.82)';ctx.fillRect(0,0,W,H);const fx=W*0.3,fy=H*0.75;
    for(let i=0;i<6;i++){const h=40+Math.sin(T*10+i)*12;ctx.fillStyle=`rgba(255,${130+i*15},40,.9)`;ctx.beginPath();ctx.moveTo(fx-30+i*12,fy);ctx.quadraticCurveTo(fx-24+i*12,fy-h*2,fx-18+i*12,fy);ctx.fill();}
    ctx.fillStyle='#f0d9b5';ctx.beginPath();ctx.ellipse(W*0.62,H*0.62,W*0.09,H*0.12,-0.3,0,7);ctx.fill();for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(W*0.58+i*W*0.025,H*0.47,W*0.012,H*0.06,-0.1,0,7);ctx.fill();}
    ctx.fillStyle='#fffdf3';ctx.fillRect(W*0.68,H*0.55,W*0.14,H*0.2);ctx.strokeStyle='#ccc';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W*0.69,H*0.58+i*H*0.03);ctx.lineTo(W*0.81,H*0.58+i*H*0.03);ctx.stroke();}
    txt('可是这炉火、这只手、这张纸——近在眼前，怎么可能怀疑？',W/2,H*0.2,'#ffe7b5',15,'center',true);hit(2,2);}
  else txt(B.hold?'走近中……':'按住画面（或向上拖动）向塔走去',W/2,H-14,'#223',13);}

/* ================= 第 3 关：梦 ================= */
let C;
function init3(){C={dream:0,pinch:0,hold:false,flip:0,t:0,seenFlip:0,mathTap:false};}
HD[3]={down(x,y){if(y>H*0.78&&x<W*0.3){C.hold=true;return;}if(y>H*0.78&&x>W*0.7){C.mathTap=true;hit(3,2);if(isOn3())setTimeout(()=>{C.doubtMath=1;hit(3,3);},1800);}},up(){C.hold=false;}};
const isOn3=()=>true;
function t3(dt){C.t+=dt;
  // 每隔几秒在“醒”与“梦”之间悄悄切换；用户分不出
  if(Math.floor(C.t/4)!==Math.floor((C.t-dt)/4)){C.dream=1-C.dream;C.seenFlip++;if(C.seenFlip>=3)hit(3,1);}
  if(C.hold){C.pinch=Math.min(1,C.pinch+dt*1.5);if(C.pinch>0.5)hit(3,0);}else C.pinch=Math.max(0,C.pinch-dt*2);
  // 场景：房间、炉火、纸、手——醒和梦时完全相同
  ctx.fillStyle='#3b2a1c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#5a4330';ctx.fillRect(0,H*0.7,W,H*0.3);
  const fx=W*0.22,fy=H*0.66;ctx.fillStyle='#2a1c12';ctx.fillRect(fx-70,fy-90,140,100);
  for(let i=0;i<7;i++){const h=34+Math.sin(T*10+i)*10;ctx.fillStyle=`rgba(255,${130+i*15},40,.9)`;ctx.beginPath();ctx.moveTo(fx-40+i*12,fy);ctx.quadraticCurveTo(fx-34+i*12,fy-h*2,fx-28+i*12,fy);ctx.fill();}
  const glow=ctx.createRadialGradient(fx,fy-40,10,fx,fy-40,W*0.6);glow.addColorStop(0,'rgba(255,170,80,.25)');glow.addColorStop(1,'rgba(255,170,80,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fffdf3';ctx.fillRect(W*0.5,H*0.42,W*0.2,H*0.28);ctx.strokeStyle='#bbb';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(W*0.52,H*0.47+i*H*0.035);ctx.lineTo(W*0.68,H*0.47+i*H*0.035);ctx.stroke();}
  ctx.fillStyle='#f0d9b5';ctx.beginPath();ctx.ellipse(W*0.78,H*0.6-C.pinch*8,W*0.07,H*0.1,-0.4,0,7);ctx.fill();
  if(C.pinch>0.2){ctx.strokeStyle=`rgba(200,60,60,${C.pinch})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W*0.78,H*0.58,18+C.pinch*10,0,7);ctx.stroke();txt('疼！……可是梦里也会疼',W*0.78,H*0.4,'#ffe7b5',14);}
  // 唯一的“标签”：用户看不见是醒是梦。底部只显示问号
  txt('现在是：醒着？还是在梦里？',W/2,28,'#ffe7b5',16,'center',true);
  txt(`（场景已悄悄切换 ${C.seenFlip} 次。你察觉到了吗？）`,W/2,50,'rgba(255,231,181,.7)',12);
  // 按钮
  ctx.fillStyle=C.hold?'#f3a52b':'rgba(255,255,255,.9)';ctx.fillRect(W*0.03,H*0.82,W*0.24,H*0.12);txt('按住：掐自己',W*0.15,H*0.89,'#222',14);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(W*0.73,H*0.82,W*0.24,H*0.12);txt('点：做一道算术',W*0.85,H*0.89,'#222',14);
  if(C.mathTap){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W*0.32,H*0.2,W*0.36,H*0.18);txt('醒着：2 + 3 = 5',W/2,H*0.27,'#fff',16);txt('梦里：2 + 3 = 5',W/2,H*0.33,'#fff',16);
    if(C.doubtMath){const k=(Math.sin(T*3)+1)/2;txt(`可万一有全能者让我每次都算错？  2 + 3 = ${k>0.5?'5':'?'}`,W/2,H*0.44,'#ffb0b0',14);}}
  // 梦的暗示（极其轻微，几乎看不出）
  ctx.fillStyle=`rgba(120,90,160,${C.dream*0.02})`;ctx.fillRect(0,0,W,H);}

/* ================= 第 4 关：恶魔与我思 ================= */
const BEL=['天空','空气','大地','颜色','形状','声音','我的手','我的身体','2 + 3 = 5','过去的记忆'];
let D;
function init4(){D={orbs:BEL.map((n,i)=>({n,a:i/BEL.length*6.283,r:0.32,life:1,false:false})),bolts:[],susp:false,suspT:0,core:0,hitsCore:0,dragBolt:null,demon:{x:0.85,y:0.2},t:0,planted:0,phase:0};}
const C4=()=>({cx:W*0.45,cy:H*0.52,R:Math.min(W,H)*0.36});
HD[4]={down(x,y){const c=C4();
  if(x<W*0.2&&y>H*0.8){D.susp=true;return;}
  for(const b of D.bolts){if(!b.dead&&Math.hypot(x-b.x,y-b.y)<26){D.dragBolt=b;b.dragged=true;return;}}},
 move(x,y){if(D.dragBolt){D.dragBolt.x=x;D.dragBolt.y=y;}},
 up(){D.susp=false;if(D.dragBolt){const b=D.dragBolt,c=C4();if(Math.hypot(b.x-c.cx,b.y-c.cy)<40&&D.phase>=1){b.dead=true;D.core=Math.min(1,D.core+0.22);D.hitsCore++;hit(4,4);if(D.hitsCore>=3)hit(4,5);if(D.core>=0.99)hit(4,6);toast('他在欺骗我——那么，被欺骗的我，必定存在');}else b.dragged=false;D.dragBolt=null;}}};
function t4(dt){D.t+=dt;const c=C4();
  ctx.fillStyle='#0d0f18';ctx.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect((i*131%100)/100*W,(i*57%100)/100*H,2,2);}
  if(D.t>1)hit(4,0);
  // 恶魔
  const dx=W*D.demon.x+Math.sin(T*0.7)*W*0.05,dy=H*D.demon.y+Math.cos(T*0.9)*H*0.04;
  ctx.fillStyle='#3a0d18';ctx.beginPath();ctx.arc(dx,dy,34,0,7);ctx.fill();ctx.fillStyle='#ff3355';ctx.beginPath();ctx.arc(dx-11,dy-4,5,0,7);ctx.arc(dx+11,dy-4,5,0,7);ctx.fill();
  ctx.strokeStyle='#ff3355';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(dx-26,dy-28);ctx.lineTo(dx-18,dy-48);ctx.moveTo(dx+26,dy-28);ctx.lineTo(dx+18,dy-48);ctx.stroke();
  txt('欺骗的恶魔',dx,dy+52,'#ff8899',12);
  // 发射攻击
  if(Math.random()<dt*(D.phase>=1?0.9:1.6)){const alive=D.orbs.filter(o=>o.life>0);const tgt=D.phase>=1||!alive.length?null:alive[Math.floor(Math.random()*alive.length)];
    D.bolts.push({x:dx,y:dy,tgt,t:0,dead:false,dragged:false,toCore:!tgt});}
  D.bolts.forEach(b=>{if(b.dead||b.dragged)return;b.t+=dt;let tx,ty;
    if(b.tgt){const o=b.tgt;tx=c.cx+Math.cos(o.a+T*0.15)*c.R*o.r*2.4;ty=c.cy+Math.sin(o.a+T*0.15)*c.R*o.r*2.4;}else{tx=c.cx+Math.cos(b.t*3)*c.R*0.35;ty=c.cy+Math.sin(b.t*3)*c.R*0.35;}
    b.x=lerp(b.x,tx,dt*1.6);b.y=lerp(b.y,ty,dt*1.6);
    if(b.tgt&&Math.hypot(b.x-tx,b.y-ty)<14){b.dead=true;const o=b.tgt;
      if(D.susp){toast('悬置判断：我不同意，它进不来');hit(4,2);}else{o.life=Math.max(0,o.life-0.5);if(o.life<=0)hit(4,1);D.planted++;}}
    if(b.toCore&&b.t>6)b.dead=true;});
  D.bolts=D.bolts.filter(b=>!b.dead).slice(-12);
  // 信念球
  const alive=D.orbs.filter(o=>o.life>0).length;if(alive===0&&D.phase===0){D.phase=1;hit(4,3);toast('一切都可疑了。还剩下什么不动的点？');}
  D.orbs.forEach(o=>{const x=c.cx+Math.cos(o.a+T*0.15)*c.R*o.r*2.4,y=c.cy+Math.sin(o.a+T*0.15)*c.R*o.r*2.4;
    if(o.life<=0){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.stroke();ctx.setLineDash([]);txt(o.n,x,y+4,'rgba(255,255,255,.2)',11);return;}
    ctx.globalAlpha=0.3+0.7*o.life;ctx.fillStyle=o.life<1?'#a07a9a':'#7fb0d8';ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fill();ctx.globalAlpha=1;txt(o.n,x,y+4,'#fff',11);});
  // 核心：我思
  const glow=D.phase>=1?0.25+0.75*D.core:0.08;const rr=24+D.core*26+Math.sin(T*3)*2*D.core;
  const gg=ctx.createRadialGradient(c.cx,c.cy,2,c.cx,c.cy,rr*3);gg.addColorStop(0,`rgba(255,240,170,${glow})`);gg.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`rgba(255,240,170,${0.3+0.7*glow})`;ctx.beginPath();ctx.arc(c.cx,c.cy,rr,0,7);ctx.fill();
  txt(D.core>=0.99?'我是一个思维的东西':D.hitsCore>=3?'我在，我存在':D.phase>=1?'我？':'',c.cx,c.cy+5,'#3a2a00',D.core>0.6?15:13,'center',true);
  D.bolts.forEach(b=>{ctx.fillStyle='#ff3355';ctx.beginPath();ctx.moveTo(b.x,b.y-10);ctx.lineTo(b.x+6,b.y);ctx.lineTo(b.x,b.y+10);ctx.lineTo(b.x-6,b.y);ctx.fill();if(D.phase>=1){ctx.strokeStyle='rgba(255,51,85,.5)';ctx.beginPath();ctx.arc(b.x,b.y,16,0,7);ctx.stroke();}});
  // 悬置判断按钮
  ctx.fillStyle=D.susp?'#7dffb0':'rgba(255,255,255,.9)';ctx.fillRect(W*0.02,H*0.82,W*0.17,H*0.12);txt('按住：悬置判断',W*0.105,H*0.89,'#123',13);
  if(D.susp){ctx.strokeStyle='rgba(125,255,176,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.cx,c.cy,c.R*0.95,0,7);ctx.stroke();}
  txt(D.phase===0?`恶魔正在吞噬你的信念（剩 ${alive}）。按住左下角“悬置判断”可暂时挡住——但挡不住一切`:D.core<0.99?'信念已全部可疑。把恶魔的红色攻击拖向中心的光点':'无论他怎样欺骗，“我在，我存在”都必然为真',W*0.5,24,'#ffe7b5',13);}

/* ======== 调度 ======== */
const INIT={1:init1,2:init2,3:init3,4:init4},TICK={1:t1,2:t2,3:t3,4:t4};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!done[t.dataset.l]);});}
function go(n){L=n;tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);INIT[L]();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{INIT[L]();toast('已重置（已对应的原文保留）');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(1);requestAnimationFrame(loop);
</script>
