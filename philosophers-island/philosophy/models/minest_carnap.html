<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 卡尔纳普语言框架 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .q0{padding:4px 10px;font-size:12.5px;color:#1f2b38;background:#fff7e0;border-bottom:1px solid #f0d08a}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
#side .bnd{padding:4px 10px 8px;font-size:11.5px;color:#667}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>卡尔纳普 · 语言框架</b>
  <button class="tab on" data-l="1">① 事物框架</button>
  <button class="tab" data-l="2">② 搭建数的框架</button>
  <button class="tab" data-l="3">③ 外部问题</button>
  <button class="tab" data-l="4">④ 实用的选择</button>
  <button class="tab" data-l="5">⑤ 应用练习</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div>
  <div class="q0"><b>核心问题：</b>“数真的存在吗？”——这是一个能用证据回答的理论问题，还是关于用不用某种说话方式的实用决定？</div>
  <div class="bd" id="sBody"></div>
  <div class="bnd"><b>适用边界：</b>画面中的“框”“墙”“刻度盘”只是教学比喻；卡尔纳普的框架是一套语言表达式及其规则，不是空间中的容器。奎因等人反对内外问题的截然二分，本模型只呈现卡尔纳普本人的立场。</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ===== 保存与恢复 ===== */
const KEY='minest_carnap_v1';let MEM={};
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return MEM;}
function save(){const st={lit:LIT,done:DONE,L};try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){MEM=st;}}
const ST=load();let LIT=ST.lit||{},DONE=ST.done||{};

/* ===== 原文：Carnap, "Empiricism, Semantics, and Ontology"（1950；1956 增订本附录）。短句引用，中文为编译 ===== */
const SRC='卡尔纳普《经验主义、语义学与本体论》';
const MAP={
1:[["按住探灯照桌面：“桌上有白纸吗？”","一旦接受了事物语言及其框架，我们就能提出并回答内部问题，例如：“我桌上有一张白纸吗？”","Once we have accepted the thing language with its framework for things, we can raise and answer internal questions","§2 事物世界"],
   ["收集观察：答案来自经验调查","这些问题要通过经验调查来回答。","These questions are to be answered by empirical investigations.","§2 事物世界"],
   ["寻找独角兽：搜遍也找不到","“独角兽和半人马是真实的，还是仅仅是想象的？”","\"Are unicorns and centaurs real or merely imaginary?\"","§2 事物世界"],
   ["把找到的东西放进时空网格：“真实”就是被纳入体系","把某物认作真实的事物或事件，意味着成功地把它纳入事物体系中某个时空位置。","To recognize something as a real thing or event means to succeed in incorporating it into the system of things","§2 事物世界"]],
2:[["把规则块拖进框里：搭建新框架","想用自己的语言谈论一类新的实体，就必须引入一套服从新规则的新说话方式；我们称之为构造一个语言框架。","we shall call this procedure the construction of a linguistic framework for the new entities in question","§2 语言框架"],
   ["框架内提问：“有大于 100 的素数吗？”","内部问题，即新实体在框架内存在与否的问题。","questions of the existence of certain entities of the new kind within the framework; we call them internal questions","§2 语言框架"],
   ["按住运行筛法：靠规则的逻辑分析得答","这里的答案不是通过基于观察的经验调查，而是通过基于新表达式规则的逻辑分析得到的。","the answers are found not by empirical investigation based on observations but by logical analysis based on the rules for the new expressions","§2 数的体系"],
   ["“有数存在”：分析的、平凡的","因此这里的答案是分析的，即逻辑上为真的。","Therefore the answers are here analytic, i.e., logically true.","§2 数的体系"]],
3:[["从框外抛出：“数真的存在吗？”","关于整个实体体系之存在或实在的问题，称为外部问题。","questions concerning the existence or reality of the system of entities as a whole, called external questions","§2 语言框架"],
   ["问题撞上框架边界：无法在框内提出","在科学意义上是实在的，就是成为该体系中的一个元素；因此这个概念不能有意义地用于体系本身。","To be real in the scientific sense means to be an element of the system","§2 事物世界"],
   ["再用力也只是反弹：争论数百年无解","实在论者给出肯定回答，主观唯心论者给出否定回答，争论持续了几个世纪而从未解决。","the controversy goes on for centuries without ever being solved","§2 事物世界"],
   ["被偏转到刻度盘：其实是实用决定","他们心中所想的……也许是一个实用问题，即关于我们语言结构的实用决定。","a matter of a practical decision concerning the structure of our language","§2 事物世界"],
   ["“伪问题”","我们有理由怀疑，他们的问题是一个伪问题。","we are justified in our suspicion that their question is a pseudo-question","§2 数的体系"]],
4:[["按住使用框架完成任务：效率累积","使用事物语言的效率、富有成果性和简单性，可能是决定性因素之一。","The efficiency, fruitfulness, and simplicity of the use of the thing language may be among the decisive factors.","§2 事物世界"],
   ["刻度盘只有程度，没有是/否","它们不是“是或否”的问题，而是程度的问题。","They are not yes-no questions but questions of degree.","§2 事物世界"],
   ["只用有理数坐标：正方形对角线无处落脚","只用有理坐标并不与任何实验知识冲突……然而它会妨碍使用通常的几何学。","it would prevent the use of ordinary geometry","§2 时空坐标系"],
   ["接受框架不是断言：不判真假，只判适宜","接受不能被判断为真或假，因为它不是断言；它只能被判断为或多或少适宜、富有成果。","The acceptance cannot be judged as being either true or false because it is not an assertion.","§3"],
   ["效率高，只说明值得采用","我们应当说：“这个事实使接受事物语言成为可取的。”","\"This fact makes it advisable to accept the thing language.\"","§2 事物世界"]],
5:[["新问题：“时空点真的存在吗？”有歧义","像“（真的）有时空点吗？”这样的问题是有歧义的。","A question like: \"Are there (really) space-time points?\" is ambiguous.","§2 时空坐标系"],
   ["拖进框内：分析的、平凡的","它可以被理解为内部问题；那么肯定的回答当然是分析的、平凡的。","It may be meant as an internal question; then the affirmative answer is, of course, analytic and trivial.","§2 时空坐标系"],
   ["拖到框外：变成“要不要引入”","“我们要不要在语言中引入如此这般的形式？”","\"Shall we introduce such and such forms into our language?\"","§2 时空坐标系"],
   ["拖到经验刻度上：是程度的事实问题","“我们的经验是否使得使用这些语言形式是适宜的、富有成果的？”","\"Are our experiences such that the use of the linguistic forms in question will be expedient and fruitful?\"","§2 时空坐标系"],
   ["结语：对断言审慎，对语言形式宽容","让我们在作出断言时审慎、在检验时批判，但在允许语言形式时宽容。","Let us be cautious in making assertions and critical in examining them, but tolerant in permitting linguistic forms.","§5 结论"]]};
const TITLE={1:'① 事物框架 · 按住并拖动探灯照亮桌面和森林；把找到的东西拖进时空网格',2:'② 搭建数的框架 · 把四块规则拖进框里；再按住框内，让筛法运行',3:'③ 外部问题 · 把框外的问号拖向框架，用力推；看它被偏转到哪里',4:'④ 实用的选择 · 在左右两个框架里按住完成任务；拖动对角线到有理坐标网上',5:'⑤ 应用练习 · 把飘浮的“时空点真的存在吗？”分别拖进框内、框外、经验刻度'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr${LIT[l+'_'+i]?' on':''}" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——${SRC} ${r[3]}</div></div></div>`).join('');}
function hit(l,i){const k=l+'_'+i;if(LIT[k])return;LIT[k]=1;const e=$('mr'+l+'_'+i);if(e){e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});}
  if(MAP[l].every((_,j)=>LIT[l+'_'+j])){DONE[l]=1;tabs();}save();}

let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});

/* 框架外框（教学比喻） */
function frame(x,y,w,h,label,col,glow){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.setLineDash([]);if(glow){ctx.shadowColor=col;ctx.shadowBlur=14*glow;}ctx.strokeRect(x,y,w,h);ctx.restore();
  ctx.fillStyle=col;ctx.fillRect(x,y-22,Math.min(w,ctx.measureText?260:260),22);txt(label,x+8,y-6,'#fff',13,'left',true);}

/* ================= 第 1 关：事物框架 ================= */
let A;
function init1(){A={lx:0.3,ly:0.5,hold:false,ev:{paper:0,uni:0},found:[],grid:[],drag:null,t:0};
  A.items=[{n:'白纸',x:0.28,y:0.46,real:true,seen:0},{n:'墨水瓶',x:0.36,y:0.5,real:true,seen:0},{n:'书',x:0.2,y:0.52,real:true,seen:0},{n:'鹿',x:0.66,y:0.52,real:true,seen:0}];}
HD[1]={down(x,y){for(const it of A.found){if(Math.hypot(x-it.dx,y-it.dy)<26){A.drag=it;return;}}A.hold=true;A.lx=x/W;A.ly=y/H;},
 move(x,y){if(A.drag){A.drag.dx=x;A.drag.dy=y;return;}if(A.hold){A.lx=x/W;A.ly=y/H;}},
 up(){if(A.drag){const it=A.drag;const gx=W*0.74,gy=H*0.12,gw=W*0.23,gh=H*0.34;if(it.dx>gx&&it.dx<gx+gw&&it.dy>gy&&it.dy<gy+gh&&!it.placed){it.placed=true;A.grid.push(it);hit(1,3);toast(`“${it.n}”被纳入时空体系：坐标 (${Math.round((it.dx-gx)/gw*10)}, ${Math.round((it.dy-gy)/gh*10)})`);}A.drag=null;}A.hold=false;}};
function t1(dt){A.t+=dt;
  ctx.fillStyle='#1b2230';ctx.fillRect(0,0,W,H);
  const fx=W*0.04,fy=H*0.1,fw=W*0.66,fh=H*0.84;
  frame(fx,fy,fw,fh,'事物框架（已接受）','#3a6f99',0.4);
  // 场景：左书桌，右森林
  ctx.fillStyle='#4a3a2a';ctx.fillRect(fx+fw*0.05,fy+fh*0.55,fw*0.45,fh*0.08);
  ctx.fillStyle='#2f4a2f';for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(fx+fw*(0.6+i*0.055),fy+fh*0.7);ctx.lineTo(fx+fw*(0.63+i*0.055),fy+fh*(0.3+(i%3)*0.05));ctx.lineTo(fx+fw*(0.66+i*0.055),fy+fh*0.7);ctx.fill();}
  // 暗处：只有探灯照到的才显现
  ctx.save();ctx.fillStyle='rgba(0,0,0,.82)';ctx.beginPath();ctx.rect(fx,fy,fw,fh);const lx=W*A.lx,ly=H*A.ly,lr=Math.min(W,H)*0.11*(A.hold?1:0.6);ctx.arc(lx,ly,lr,0,7,true);ctx.fill('evenodd');ctx.restore();
  // 物体（被照到才显示并累积观察）
  A.items.forEach(it=>{const x=W*it.x,y=H*it.y,d=Math.hypot(x-lx,y-ly);const lit=d<lr;
    if(lit&&A.hold){it.seen=Math.min(1,it.seen+dt*0.7);if(it.seen>=1&&!it.got){it.got=true;A.found.push({n:it.n,dx:x,dy:y});if(it.n==='白纸'){hit(1,1);toast('观察结果：有一张白纸。按框架的规则，这是确认证据');}}}
    if(lit||it.seen>0.2){ctx.globalAlpha=lit?1:0.35;ctx.fillStyle=it.n==='白纸'?'#f5f5f0':it.n==='鹿'?'#a87a4a':'#6b7fa0';ctx.fillRect(x-16,y-10,32,20);txt(it.n,x,y+28,'#e8edf3',12);ctx.globalAlpha=1;
      if(it.seen<1&&lit){ctx.strokeStyle='#7dffb0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,24,-1.57,-1.57+6.28*it.seen);ctx.stroke();}}});
  // 独角兽搜寻：照森林越久，搜寻进度越高，但永远找不到
  if(A.hold&&lx>fx+fw*0.55){A.ev.uni=Math.min(1,A.ev.uni+dt*0.15);if(A.ev.uni>0.6)hit(1,2);}
  if(A.ev.uni>0)txt(`寻找独角兽：森林已搜遍 ${Math.round(A.ev.uni*100)}%，找到 0 只`,fx+fw*0.75,fy+fh*0.9,'#ffb0b0',12);
  if(A.t>1)hit(1,0);
  // 时空网格
  const gx=W*0.74,gy=H*0.12,gw=W*0.23,gh=H*0.34;ctx.strokeStyle='rgba(125,200,255,.35)';ctx.lineWidth=1;for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(gx+gw*i/10,gy);ctx.lineTo(gx+gw*i/10,gy+gh);ctx.stroke();ctx.beginPath();ctx.moveTo(gx,gy+gh*i/10);ctx.lineTo(gx+gw,gy+gh*i/10);ctx.stroke();}
  txt('事物体系（时空网格）',gx+gw/2,gy-6,'#9fd3ff',12);
  A.found.forEach(it=>{ctx.fillStyle=it.placed?'#7dffb0':'#f3a52b';ctx.beginPath();ctx.arc(it.dx,it.dy,10,0,7);ctx.fill();txt(it.n,it.dx,it.dy-14,'#fff',11);});
  txt('“桌上有白纸吗？”  “独角兽是真的吗？”',fx+fw/2,fy+22,'#ffe7b5',14,'center',true);
  txt(A.found.length?'把找到的东西（橙点）拖进右上的时空网格':'按住并拖动：探灯照到哪里，就观察哪里',W*0.5,H-10,'#cfd6e6',12);}

/* ================= 第 2 关：搭建数的框架 ================= */
let B;
const RULES=['数词：一、五、一百','总称：“数”','性质与运算：素数、加、大于','变量与量词：对一切 n / 有 n'];
function init2(){B={blocks:RULES.map((r,i)=>({r,x:0.08,y:0.2+i*0.17,in:false})),drag:null,sieve:0,hold:false,built:0};}
HD[2]={down(x,y){for(const b of B.blocks){if(!b.in&&Math.abs(x-W*b.x-W*0.1)<W*0.12&&Math.abs(y-H*b.y)<20){B.drag=b;return;}}if(B.built>=4)B.hold=true;else if(x>W*0.4)toast('框架还没搭好：先把四块规则都拖进来');},
 move(x,y,dx,dy){if(B.drag){B.drag.x=clamp(B.drag.x+dx/W,0,0.8);B.drag.y=clamp(B.drag.y+dy/H,0.05,0.95);}},
 up(){if(B.drag){const b=B.drag;if(b.x>0.33){b.in=true;B.built++;b.x=0.42;b.y=0.12+(B.built-1)*0.07;if(B.built===1)hit(2,0);if(B.built===4){hit(2,1);toast('数的框架建成：现在可以在框内提问');}}B.drag=null;}B.hold=false;}};
function isP(n){if(n<2)return false;for(let k=2;k*k<=n;k++)if(n%k===0)return false;return true;}
function t2(dt){ctx.fillStyle='#1b2230';ctx.fillRect(0,0,W,H);
  const fx=W*0.4,fy=H*0.08,fw=W*0.56,fh=H*0.86;const k=B.built/4;
  ctx.globalAlpha=0.25+0.75*k;frame(fx,fy,fw,fh,`数的框架（${B.built}/4 条规则）`,'#8a6ab0',k);ctx.globalAlpha=1;
  txt('规则块（拖进框里）',W*0.18,H*0.1,'#cfd6e6',12);
  B.blocks.forEach(b=>{const x=W*b.x,y=H*b.y,w=W*(b.in?0.3:0.24);ctx.fillStyle=b.in?'#5a3f8a':'#3a4a66';ctx.fillRect(x,y-14,w,28);ctx.strokeStyle='#b49cff';ctx.strokeRect(x,y-14,w,28);txt(b.r,x+8,y+5,'#fff',12,'left');});
  if(B.built>=4){
    txt('内部问题：“有大于 100 的素数吗？”',fx+fw/2,fy+fh*0.42,'#ffe7b5',15,'center',true);
    if(B.hold){B.sieve=Math.min(1,B.sieve+dt*0.35);hit(2,2);}
    const N=Math.floor(100+B.sieve*40);const cols=10,cw=fw*0.08,ox=fx+fw*0.1,oy=fy+fh*0.5;
    for(let n=101;n<=140;n++){const i=n-101,cx=ox+(i%cols)*cw,cy=oy+Math.floor(i/cols)*cw*0.8;const done=n<=N;
      ctx.fillStyle=!done?'rgba(255,255,255,.08)':isP(n)?'#7dffb0':'rgba(255,255,255,.18)';ctx.fillRect(cx,cy,cw-4,cw*0.8-4);txt(String(n),cx+cw/2-2,cy+cw*0.45,done&&isP(n)?'#123':'#cfd6e6',11);}
    if(N>=101&&isP(101)&&B.sieve>0.03){txt('101 是素数 → 有。答案依据规则得出，不需要观察',fx+fw/2,fy+fh*0.94,'#7dffb0',13,'center',true);}
    if(B.sieve>0.5){txt('“有数存在”：由“五是一个数”直接推出 → 分析的、平凡的',fx+fw/2,fy+fh*0.36,'#c9b8ff',12);hit(2,3);}
    if(!B.hold&&B.sieve<0.05)txt('按住框内：让规则运行（筛法）',fx+fw/2,fy+fh*0.98,'#cfd6e6',12);}
  else txt('框内空空：没有规则，就没有“数”的说话方式',fx+fw/2,fy+fh/2,'rgba(255,255,255,.35)',14);}

/* ================= 第 3 关：外部问题 ================= */
let C;
function init3(){C={qx:0.12,qy:0.5,drag:false,push:0,bounces:0,toDial:0,deflect:null,vx:0,vy:0};}
const F3=()=>({x:W*0.32,y:H*0.12,w:W*0.42,h:H*0.78});
HD[3]={down(x,y){if(Math.hypot(x-W*C.qx,y-H*C.qy)<40){C.drag=true;hit(3,0);}},
 move(x,y){if(!C.drag)return;const f=F3();let nx=x/W,ny=y/H;
   // 问题无法进入框内：碰到边界就被顶住，并累积“推力”
   if(x>f.x-26&&x<f.x+f.w+26&&y>f.y-26&&y<f.y+f.h+26){const left=x<f.x+f.w/2;nx=(left?f.x-28:f.x+f.w+28)/W;C.push+=0.02;if(C.push>0.15)hit(3,1);if(C.push>1.2)hit(3,2);}
   C.qx=nx;C.qy=ny;},
 up(){if(!C.drag)return;C.drag=false;if(C.push>0.2){C.deflect=1;C.bounces++;hit(3,3);toast('问题被偏转到“实用决定”刻度盘上');if(C.bounces>=2)hit(3,4);}}};
function t3(dt){ctx.fillStyle='#1b2230';ctx.fillRect(0,0,W,H);const f=F3();
  frame(f.x,f.y,f.w,f.h,'数的框架','#8a6ab0',0.3+0.6*Math.min(1,C.push));
  // 框内运作：内部问题照常回答
  for(let i=0;i<8;i++){const a=T*0.6+i;txt(['2+3=5','101 是素数','对一切 n…','有 n 使…','五是一个数','7>3','n+1','偶数'][i],f.x+f.w*(0.2+0.6*((Math.sin(a)+1)/2)),f.y+f.h*(0.15+i*0.1),'rgba(201,184,255,.75)',13);}
  // 外部问题
  const qx=W*C.qx,qy=H*C.qy;
  if(C.deflect){C.deflect-=dt*0.8;const tx=W*0.88,ty=H*0.75;C.qx=lerp(C.qx,tx/W,dt*3);C.qy=lerp(C.qy,ty/H,dt*3);if(C.deflect<=0){C.deflect=null;C.qx=0.12;C.qy=0.5;C.push*=0.5;}}
  ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.arc(qx,qy,30,0,7);ctx.fill();txt('?',qx,qy+9,'#222',28,'center',true);txt('数真的存在吗？',qx,qy+48,'#ffe7b5',13,'center',true);
  if(C.push>0.15){ctx.strokeStyle=`rgba(255,120,120,${Math.min(1,C.push)})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(qx,qy,36+Math.sin(T*20)*3,0,7);ctx.stroke();txt('框架内无法提出：“实在”只适用于体系的元素',W*0.5,f.y+f.h+30,'#ffb0b0',13);}
  // 刻度盘
  const dx=W*0.88,dy=H*0.75,r=Math.min(W,H)*0.09;ctx.strokeStyle='#7dffb0';ctx.lineWidth=6;ctx.beginPath();ctx.arc(dx,dy,r,Math.PI,0);ctx.stroke();
  txt('实用决定',dx,dy+20,'#7dffb0',13,'center',true);txt('要不要采用这套语言？',dx,dy+38,'#cfe',11);
  const na=Math.PI+Math.PI*((Math.sin(T*0.7)+1)/2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(dx,dy);ctx.lineTo(dx+Math.cos(na)*r*0.9,dy+Math.sin(na)*r*0.9);ctx.stroke();
  if(C.push>1.2)txt('实在论 ⇄ 唯名论：推了几百年，问题仍在原地',W*0.16,H*0.2,'#ffcf80',12);
  txt(C.bounces?`偏转次数：${C.bounces}`:'把左边的问号拖向框架，用力往里推，再松手',W*0.5,H-10,'#cfd6e6',12);}

/* ================= 第 4 关：实用的选择 ================= */
let D;
function init4(){D={eff:{thing:0,sense:0},hold:null,dial:0,diag:{x:0,y:0,drag:false},ratTried:false};}
HD[4]={down(x,y){if(y>H*0.62&&x>W*0.55){D.diag.drag=true;return;}D.hold=x<W*0.5?'thing':'sense';},
 move(x,y){if(D.diag.drag){D.diag.x=x;D.diag.y=y;}},
 up(){if(D.diag.drag){D.diag.drag=false;D.ratTried=true;hit(4,2);toast('√2 不在有理坐标网上：不与观察冲突，却让几何学寸步难行');}D.hold=null;}};
function t4(dt){ctx.fillStyle='#1b2230';ctx.fillRect(0,0,W,H);
  const hw=W*0.46;frame(W*0.02,H*0.08,hw,H*0.5,'事物语言','#3a6f99',D.hold==='thing'?1:0.2);frame(W*0.52,H*0.08,hw,H*0.5,'感觉材料语言','#a0622a',D.hold==='sense'?1:0.2);
  // 任务：描述一次搬家
  ['thing','sense'].forEach((k,i)=>{const x0=W*(0.02+i*0.5);if(D.hold===k){D.eff[k]=Math.min(1,D.eff[k]+dt*(k==='thing'?0.35:0.08));hit(4,0);}
    const words=k==='thing'?['把','箱子','搬到','楼上']:['此刻','有','棕色','方形','色块…','又有','压觉…','视野上移…'];
    words.forEach((w,j)=>{const show=D.eff[k]*words.length>j;ctx.globalAlpha=show?1:0.15;txt(w,x0+hw*0.08+(j%4)*hw*0.22,H*0.25+Math.floor(j/4)*30,'#e8edf3',15,'left');ctx.globalAlpha=1;});
    txt('任务：说清楚“搬家”这件事',x0+hw/2,H*0.44,'#9fb0c3',12);
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x0+hw*0.1,H*0.5,hw*0.8,10);ctx.fillStyle=k==='thing'?'#4a9fe0':'#d08a4a';ctx.fillRect(x0+hw*0.1,H*0.5,hw*0.8*D.eff[k],10);txt(`效率·成果·简单  ${Math.round(D.eff[k]*100)}%`,x0+hw/2,H*0.49,'#cfd6e6',11);});
  if(D.eff.thing>0.5&&D.eff.sense>0.15){hit(4,1);const r=Math.min(W,H)*0.1,cx=W*0.25,cy=H*0.82;ctx.strokeStyle='#7dffb0';ctx.lineWidth=6;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.stroke();
    const v=D.eff.thing/(D.eff.thing+D.eff.sense+0.01);const na=Math.PI+Math.PI*v;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r,cy+Math.sin(na)*r);ctx.stroke();
    txt('适宜程度：连续刻度，没有“真/假”档',cx,cy+22,'#7dffb0',12);
    if(D.eff.thing>0.9){hit(4,4);txt('→ 值得采用事物语言（而不是“证明了事物世界实在”）',cx,cy+40,'#cfe',11);}
    if(D.eff.thing>0.9&&D.ratTried)hit(4,3);}
  // 有理坐标网与对角线
  const gx=W*0.62,gy=H*0.64,gs=Math.min(W*0.3,H*0.3);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;for(let i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(gx+gs*i/10,gy);ctx.lineTo(gx+gs*i/10,gy+gs*0.9);ctx.stroke();}
  ctx.strokeStyle='#f3a52b';ctx.lineWidth=2;ctx.strokeRect(gx,gy+gs*0.9-gs*0.5,gs*0.5,gs*0.5);
  const ex=D.diag.drag?D.diag.x:gx+gs*0.5,ey=D.diag.drag?D.diag.y:gy+gs*0.9-gs*0.5;ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx,gy+gs*0.9);ctx.lineTo(ex,ey);ctx.stroke();
  if(D.diag.drag){const len=Math.hypot(ex-gx,ey-gy-gs*0.9)/(gs*0.5);txt(`长度 ≈ ${len.toFixed(4)}（√2 = 1.41421…，有理网上找不到落点）`,gx+gs/2,gy-8,'#ffb0b0',12);}
  else txt('拖动红色对角线：只准用有理坐标',gx+gs/2,gy-8,'#cfd6e6',12);
  txt('按住左框或右框：用这套语言完成同一任务',W*0.25,H-10,'#cfd6e6',12);}

/* ================= 第 5 关：应用练习 ================= */
let E;
function init5(){E={q:{x:0.5,y:0.2},drag:false,tried:{},vx:0.03,vy:0.02,anim:null};}
const Z5=()=>({inF:{x:W*0.05,y:H*0.36,w:W*0.3,h:H*0.5},out:{x:W*0.4,y:H*0.36,w:W*0.24,h:H*0.5},exp:{x:W*0.69,y:H*0.36,w:W*0.28,h:H*0.5}});
HD[5]={down(x,y){if(Math.hypot(x-W*E.q.x,y-H*E.q.y)<46){E.drag=true;hit(5,0);}},move(x,y){if(E.drag){E.q.x=x/W;E.q.y=y/H;}},
 up(){if(!E.drag)return;E.drag=false;const z=Z5(),x=W*E.q.x,y=H*E.q.y;const inZ=r=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;
  if(inZ(z.inF)){E.anim={k:'in',t:0};E.tried.in=1;hit(5,1);}else if(inZ(z.out)){E.anim={k:'out',t:0};E.tried.out=1;hit(5,2);}else if(inZ(z.exp)){E.anim={k:'exp',t:0};E.tried.exp=1;hit(5,3);}
  if(E.tried.in&&E.tried.out&&E.tried.exp)setTimeout(()=>hit(5,4),2200);}};
function t5(dt){ctx.fillStyle='#1b2230';ctx.fillRect(0,0,W,H);const z=Z5();
  frame(z.inF.x,z.inF.y,z.inF.w,z.inF.h,'时空坐标框架（框内）','#3a6f99',E.anim&&E.anim.k==='in'?1:0.2);
  ctx.strokeStyle='rgba(243,165,43,.7)';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.strokeRect(z.out.x,z.out.y,z.out.w,z.out.h);ctx.setLineDash([]);txt('框外：引入与否',z.out.x+z.out.w/2,z.out.y-8,'#f3a52b',13,'center',true);
  ctx.strokeStyle='rgba(125,255,176,.7)';ctx.setLineDash([2,6]);ctx.strokeRect(z.exp.x,z.exp.y,z.exp.w,z.exp.h);ctx.setLineDash([]);txt('经验刻度：适宜到什么程度',z.exp.x+z.exp.w/2,z.exp.y-8,'#7dffb0',13,'center',true);
  for(let i=0;i<=6;i++)for(let j=0;j<=6;j++){ctx.fillStyle='rgba(159,211,255,.35)';ctx.fillRect(z.inF.x+z.inF.w*(0.1+i*0.13),z.inF.y+z.inF.h*(0.1+j*0.13),3,3);}
  if(!E.drag&&!E.anim){E.q.x+=E.vx*dt;E.q.y+=E.vy*dt;if(E.q.x<0.1||E.q.x>0.9)E.vx*=-1;if(E.q.y<0.12||E.q.y>0.3)E.vy*=-1;}
  const qx=W*E.q.x,qy=H*E.q.y;
  if(E.anim){E.anim.t+=dt;const a=E.anim;
    if(a.k==='in'){txt('“有时空点”：由坐标规则直接推出 → 分析的、平凡的 ✓',z.inF.x+z.inF.w/2,z.inF.y+z.inF.h+22,'#9fd3ff',12);}
    if(a.k==='out'){const r=Math.min(W,H)*0.07,cx=z.out.x+z.out.w/2,cy=z.out.y+z.out.h*0.6;ctx.strokeStyle='#f3a52b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,0);ctx.stroke();const na=Math.PI+Math.PI*((Math.sin(a.t*2)+1)/2);ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r,cy+Math.sin(na)*r);ctx.stroke();txt('“要不要引入？”：决定，不是断言',cx,z.out.y+z.out.h+22,'#ffcf80',12);}
    if(a.k==='exp'){const v=clamp(a.t/2,0,1)*0.82;ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(z.exp.x+20,z.exp.y+z.exp.h*0.5,z.exp.w-40,12);ctx.fillStyle='#7dffb0';ctx.fillRect(z.exp.x+20,z.exp.y+z.exp.h*0.5,(z.exp.w-40)*v,12);txt(`适宜程度 ${Math.round(v*100)}%（程度问题，不是“是/否”）`,z.exp.x+z.exp.w/2,z.exp.y+z.exp.h+22,'#7dffb0',12);}
    if(a.t>3){E.anim=null;E.q={x:0.5,y:0.2};}}
  ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.arc(qx,qy,40,0,7);ctx.fill();txt('时空点',qx,qy-4,'#222',13,'center',true);txt('真的存在吗？',qx,qy+14,'#222',13,'center',true);
  const n=Object.keys(E.tried).length;txt(n<3?`同一句话的三种读法：已试 ${n}/3。把问号拖进下面任一区域`:'三种读法各得其所：对断言审慎，对语言形式宽容',W/2,H-10,'#cfd6e6',12);}

/* ===== 调度 ===== */
const INIT={1:init1,2:init2,3:init3,4:init4,5:init5},TICK={1:t1,2:t2,3:t3,4:t4,5:t5};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!DONE[t.dataset.l]);});}
function go(n){L=n;tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);INIT[L]();save();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{INIT[L]();toast('已重置本关（已对应的原文保留）');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(ST.L||1);requestAnimationFrame(loop);
</script>
