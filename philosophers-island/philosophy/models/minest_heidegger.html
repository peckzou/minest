<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}

.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .q{padding:4px 10px;background:#fff7e0;border-bottom:1px solid #eadfb8;font-size:12.5px}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
#side .bound{padding:4px 10px 8px;font-size:11.5px;color:#667}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}

.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 36%)}#side{height:36%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>

<body>
<div id="tabs">
  <b>海德格尔 · 此在分析</b>
  <button class="tab on" data-l="1">① 上手</button>
  <button class="tab" data-l="2">② 坏掉的锤子</button>
  <button class="tab" data-l="3">③ 常人</button>
  <button class="tab" data-l="4">④ 向死而在</button>
  <button class="tab" data-l="5">⑤ 应用练习</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side">
  <div class="tt" id="sTitle"></div>
  <div class="q"><b>核心问题：</b>我们首先是“看着”一个个物体的主体，还是早已“在世界之中”忙碌着的存在者？</div>
  <div class="bd" id="sBody"></div>
  <div class="bound"><b>适用边界：</b>锤子、人群、时间轴都是教学类比。海德格尔说的“上手”“常人”“死亡”是此在的存在论结构，不是心理注意力的高低，也不是生物学上的寿命；画面中的数值条只是帮助体验的示意。</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ===== 保存与恢复 ===== */
const KEY='minest_heidegger_v1';let SAVE={lit:{},done:{}};
try{const s=localStorage.getItem(KEY);if(s)SAVE=JSON.parse(s);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}

/* ===== 原文：均据《斯坦福哲学百科》“Martin Heidegger”词条（2025）转引；SZ 为《存在与时间》德文第 7 版边码（词条所注）；中文为编译 ===== */
const SRC='据 SEP “Martin Heidegger”（2025）转引';
const MAP={
1:[["节奏稳定地按住、松开：一下下钉钉子","处于应付之中时……我根本没有在经验门，而只是投入到出门这一可能性之中。","I’m not experiencing the door at all but simply pressing into the possibility of going out.","Dreyfus 2014: 256（"+SRC+"）"],
   ["锤子淡去，指引链浮现：锤→钉→板→书架","寻视：环顾以把握“为了作……”的种种指引。","the manifold references of the ‘in-order-to’",SRC+"（词条注 12）"],
   ["钉越多，世界越完整：上手之物属于一个用具整体","在对世界的意义构成中起首要作用的，不是物，而是指引。","it is not things but references which have the primary function in the structure of encounter belonging to the world","GA20: 272（"+SRC+"）"]],
2:[["敲得太急、太猛：锤柄折断","一件工具结果是坏了的。","a tool turns out to be damaged","SZ 73（"+SRC+"）"],
   ["拖动断锤端详：重量、长度、材质显现","纯粹的现成性宣告出来。","pure occurrentness announces itself","SZ 73（"+SRC+"）"]],
3:[["什么都不做：你被人流带着走","此在把自己交付给“世界”，让“世界”以某种方式对它“要紧”，以致此在以某种方式逃避了它自身。","surrenders itself to the ‘world’ and lets the ‘world’ ‘matter’ to it in such a way that somehow Dasein evades its very self","SZ 139（"+SRC+"）"],
   ["试图穿过田地：被推回田埂","沿着田边走，但在田“外”。","walk along the edge of the field but ‘outside it’","SZ 118（"+SRC+"）"],
   ["靠近闲谈的气泡","闲谈是无须先把事情据为己有就理解一切的可能性。","Idle talk is the possibility of understanding everything without previously making the thing one’s own","SZ 169（"+SRC+"）"],
   ["按住逆流而行，一松手又被卷回","一种向着沉沦的持续诱惑。","a constant temptation towards falling","SZ 177（"+SRC+"）"]],
4:[["不按住时：可能性自己飘来粘上你","偶然地强加于人的那些可能性。","may accidentally thrust themselves upon one","SZ 264（"+SRC+"）"],
   ["把“现在”拖向尽头：撞上一堵墙","此在之绝对不可能的可能性。","the possibility of the absolute impossibility of Dasein","SZ 250（"+SRC+"）"],
   ["再用力也拖不过去","那不可逾越的可能性。","that possibility which is not to be outstripped","SZ 263（"+SRC+"）"],
   ["按住先行：人群淡去，剩下的可能性亮起为“我的”","对死亡的先行把此在个别化到它自身。","individualizes Dasein down to itself","SZ 263（"+SRC+"）"]],
5:[["骑行中链条突然脱落：车从“透明”变得刺眼","必须先有与世界操劳交往中的某种欠缺。","there must first be a deficiency in the concernful dealings with the world","SZ 61（"+SRC+"）"],
   ["拖动链条把它挂回齿轮","明确地“看着”所遭遇的东西。","explicitly looking-at (Hinsehen) what is encountered","SZ 61（"+SRC+"）"]]};
const TITLE={1:'① 上手 · 按节奏按住、松开画面来钉钉子',2:'② 坏掉的锤子 · 继续钉，敲得太急锤柄会断；然后拖动断锤端详它',3:'③ 常人 · 先什么都别做；再按住拖动你（橙点）逆流而行，或试着穿过田地',4:'④ 向死而在 · 拖动“现在”向右；按住空白处“先行”',5:'⑤ 应用练习 · 有节奏地按住、松开来蹬车；链条掉了就把它拖回齿轮'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr${SAVE.lit[l+'_'+i]?' on':''}" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——${r[3]}</div></div></div>`).join('');}
function hit(l,i){if(SAVE.lit[l+'_'+i])return;SAVE.lit[l+'_'+i]=1;const e=$('mr'+l+'_'+i);if(e){e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});}
  if(MAP[l].every((_,k)=>SAVE.lit[l+'_'+k])){SAVE.done[l]=1;tabs();}persist();}

let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});

/* ===== 锤子工坊（第 1、2 关共用） ===== */
let K;
function initHammer(breakable){K={hits:[],absorb:0,swing:0,nails:[{d:0}],boards:0,chainT:0,wear:0,broken:false,breakable,brokenT:0,drag:false,hx:0,hy:0,lookT:0,flash:0};}
function steadiness(){const h=K.hits;if(h.length<3)return 0;const iv=[];for(let i=1;i<h.length;i++)iv.push(h[i]-h[i-1]);const last=iv.slice(-4);const m=last.reduce((a,b)=>a+b,0)/last.length;
  const v=last.reduce((a,b)=>a+(b-m)*(b-m),0)/last.length;if(m<0.3||m>1.4)return 0;return clamp(1-Math.sqrt(v)/m*2.2,0,1);}
function hammerDown(x,y){
  if(K.broken){const hx=K.hx||W*0.5,hy=K.hy||H*0.5;if(Math.hypot(x-hx,y-hy)<90){K.drag=true;}return;}
  const now=T;const gap=K.hits.length?now-K.hits[K.hits.length-1]:9;K.hits.push(now);if(K.hits.length>8)K.hits.shift();
  K.swing=1;const n=K.nails[K.nails.length-1];n.d=Math.min(1,n.d+0.22+0.1*steadiness());
  if(n.d>=1){K.nails.push({d:0});if(K.nails.length%4===0)K.boards++;}
  if(K.breakable){K.wear+=gap<0.28?0.16:0.035;if(K.wear>=1&&!K.broken){K.broken=true;K.brokenT=0;K.hx=W*0.5;K.hy=H*0.42;K.flash=1;hit(2,0);toast('咔！锤柄断了');}}}
function hammerMove(x,y){if(K.drag){K.hx=x;K.hy=y;}}
function hammerUp(){K.drag=false;}
function drawWorkshop(dt,lvl){
  const st=steadiness(),recent=K.hits.length&&T-K.hits[K.hits.length-1]<1.3;
  K.absorb=lerp(K.absorb,(!K.broken&&recent)?st:0,dt*(recent?1.2:2.5));
  const A=K.absorb;
  // 背景：工作台，随“专注”而世界变得完整、温暖
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${Math.round(lerp(60,214,A*0.7))},${Math.round(lerp(64,190,A*0.7))},${Math.round(lerp(72,150,A*0.7))})`);g.addColorStop(1,'#3a2f25');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const by=H*0.72;ctx.fillStyle='#8a6a48';ctx.fillRect(W*0.12,by,W*0.76,H*0.08);
  // 已完成的书架（指引整体）
  for(let i=0;i<K.boards;i++){ctx.fillStyle='#b08a5a';ctx.fillRect(W*0.62,by-20-i*26,W*0.22,10);}
  if(K.boards>0){ctx.fillStyle='#6b4f2a';ctx.fillRect(W*0.62,by-20-(K.boards-1)*26,8,(K.boards-1)*26+20);ctx.fillRect(W*0.84-8,by-20-(K.boards-1)*26,8,(K.boards-1)*26+20);
    for(let i=1;i<K.boards;i++)for(let b=0;b<5;b++){ctx.fillStyle=['#a0522d','#3a6f99','#2f7a4a','#8a6ab0','#c9a14a'][b];ctx.fillRect(W*0.64+b*16,by-20-i*26+10-22,12,22);}}
  // 木板与钉子
  ctx.fillStyle='#c49a66';ctx.fillRect(W*0.2,by-18,W*0.34,18);
  K.nails.forEach((n,i)=>{const nx=W*0.23+(i%9)*W*0.035,ny=by-18;const out=(1-n.d)*28;ctx.fillStyle='#777';ctx.fillRect(nx-1.5,ny-out,3,out+2);ctx.fillStyle='#999';ctx.fillRect(nx-5,ny-out-3,10,3);});
  const cur=K.nails[K.nails.length-1],cx=W*0.23+((K.nails.length-1)%9)*W*0.035,cy=by-18-(1-cur.d)*28;
  // 锤子：越投入越透明
  K.swing=Math.max(0,K.swing-dt*5);
  if(!K.broken){const a=1-0.88*A;const ang=-0.9+K.swing*0.9;ctx.save();ctx.globalAlpha=a;ctx.translate(cx+70,cy-20);ctx.rotate(ang);
    ctx.fillStyle='#9a7346';ctx.fillRect(-4,0,8,90);ctx.fillStyle='#5b6168';ctx.fillRect(-26,-10,52,20);ctx.restore();ctx.globalAlpha=1;
    if(K.breakable&&K.wear>0.5){ctx.strokeStyle=`rgba(200,40,40,${(K.wear-0.5)*1.6})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx+70,cy+30,6+K.wear*8,0,7);ctx.stroke();}}
  else{K.brokenT+=dt;const hx=K.hx,hy=K.hy;K.flash=Math.max(0,K.flash-dt);
    ctx.fillStyle='rgba(20,22,28,.55)';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(hx,hy);ctx.fillStyle='#9a7346';ctx.fillRect(-90,-7,110,14);ctx.fillStyle='#7a5530';ctx.beginPath();ctx.moveTo(20,-7);ctx.lineTo(30,-2);ctx.lineTo(24,3);ctx.lineTo(32,7);ctx.lineTo(20,7);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(hx+80,hy+50);ctx.rotate(0.6);ctx.fillStyle='#5b6168';ctx.fillRect(-28,-11,56,22);ctx.restore();
    if(K.drag){K.lookT+=dt;}
    const k=clamp(K.lookT/2,0,1);
    ['重量 0.62 kg','柄长 32 cm','山毛榉木','断口：纵向撕裂','锤头：铸铁'].forEach((s,i)=>{ctx.globalAlpha=clamp(k*5-i,0,1);txt(s,hx-150+((i%2)?320:0),hy-60+i*26,'#ffe7b5',14,'left');});ctx.globalAlpha=1;
    if(K.lookT>2)hit(2,1);
    if(K.flash>0){ctx.fillStyle=`rgba(255,255,255,${K.flash*0.7})`;ctx.fillRect(0,0,W,H);}
    txt(K.lookT<0.3?'锤子不再“消失”：它突然成了一个摆在眼前的东西。拖动它端详':'你在“看着”它，而不再用它',W/2,30,'#ffe7b5',14);}
  // 指引链
  if(!K.broken){K.chainT=A>0.75?K.chainT+dt:Math.max(0,K.chainT-dt);
    const chain=['锤子','钉子','木板','书架','放书','读书的我'];const vis=Math.min(chain.length,Math.floor(K.chainT*1.6));
    for(let i=0;i<vis;i++){const x=W*0.1+i*W*0.15,y=H*0.14;ctx.globalAlpha=i===0?Math.max(0.2,1-A):1;txt(chain[i],x,y,'#fff',15,'center',true);ctx.globalAlpha=1;if(i<vis-1)txt('→',x+W*0.075,y,'#ffe7b5',15);}
    if(lvl===1){if(A>0.6)hit(1,0);if(vis>=5)hit(1,1);if(K.boards>=2&&A>0.4)hit(1,2);}
    txt(K.hits.length<3?'按一下钉一下。试着用稳定的节奏连续钉':A>0.6?'你在钉钉子……锤子几乎从注意中消失了':'节奏乱了：锤子又回到眼前',W/2,H*0.06+6,'#fff',13);
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(W*0.02,H*0.88,W*0.2,8);ctx.fillStyle='#7dffb0';ctx.fillRect(W*0.02,H*0.88,W*0.2*A,8);txt('投入程度（示意）',W*0.12,H*0.87,'#e8eef4',11);
    if(K.breakable){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(W*0.78,H*0.88,W*0.2,8);ctx.fillStyle='#e06a4a';ctx.fillRect(W*0.78,H*0.88,W*0.2*Math.min(1,K.wear),8);txt('锤柄磨损',W*0.88,H*0.87,'#e8eef4',11);}}}

/* ===== 第 3 关：常人 ===== */
let C3;
function init3(){C3={crowd:[],me:{x:0,y:0,vx:0,vy:0},hold:false,absorbT:0,resistT:0,wasResist:false,talk:[],fieldPush:0};
  for(let i=0;i<46;i++)C3.crowd.push({s:Math.random(),o:(Math.random()-.5)*0.08,sp:0.035+Math.random()*0.02});
  const p=path3(0.2);C3.me.x=p[0];C3.me.y=p[1];}
function path3(s){s=((s%1)+1)%1;// 沿田埂的环路：田地在中央
  const cx=W*0.5,cy=H*0.52,rx=W*0.34,ry=H*0.3;const a=s*Math.PI*2;return[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry];}
function inField(x,y){const cx=W*0.5,cy=H*0.52,rx=W*0.27,ry=H*0.22;return((x-cx)/rx)**2+((y-cy)/ry)**2<1;}
const TALK=['大家都这么说','听说了吗？','早就懂了','人们就是这样做的','这不用想','别人怎么做我就怎么做'];
HD[3]={down(x,y){C3.hold=true;},move(x,y,dx,dy,down){if(down){C3.me.tx=x;C3.me.ty=y;}},up(){C3.hold=false;}};
function t3(dt){C3.crowd.forEach(p=>p.s+=p.sp*dt);
  // 背景
  ctx.fillStyle='#cfd8c2';ctx.fillRect(0,0,W,H);
  const cx=W*0.5,cy=H*0.52;ctx.fillStyle='#d9b85a';ctx.beginPath();ctx.ellipse(cx,cy,W*0.27,H*0.22,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,90,30,.4)';for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(cx+i*W*0.04,cy-H*0.2);ctx.lineTo(cx+i*W*0.04,cy+H*0.2);ctx.stroke();}
  txt('别人的田',cx,cy+5,'#6b5020',14,'center',true);
  ctx.strokeStyle='#a89a7a';ctx.lineWidth=16;ctx.beginPath();ctx.ellipse(cx,cy,W*0.34,H*0.3,0,0,7);ctx.stroke();ctx.lineWidth=1;
  // 人群
  let ax=0,ay=0;C3.crowd.forEach(p=>{const q=path3(p.s);const n=path3(p.s+0.01);const nx=-(n[1]-q[1]),ny=(n[0]-q[0]);const L0=Math.hypot(nx,ny)||1;const x=q[0]+nx/L0*p.o*W*0.3,y=q[1]+ny/L0*p.o*W*0.3;p.x=x;p.y=y;
    ctx.fillStyle='#5b6b7d';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();});
  // 闲谈气泡
  if(Math.random()<dt*0.8){const p=C3.crowd[Math.floor(Math.random()*C3.crowd.length)];C3.talk.push({p,t:3,s:TALK[Math.floor(Math.random()*TALK.length)]});}
  C3.talk=C3.talk.filter(b=>(b.t-=dt)>0);
  // 我：被人流牵引
  const me=C3.me;let near=null,nd=1e9;C3.crowd.forEach(p=>{const d=Math.hypot(p.x-me.x,p.y-me.y);if(d<nd){nd=d;near=p;}});
  const fl=path3(near.s+0.012);let fx=(fl[0]-me.x),fy=(fl[1]-me.y);
  if(C3.hold&&me.tx!=null){const dx=me.tx-me.x,dy=me.ty-me.y;const L1=Math.hypot(dx,dy)||1;const pull=0.55;me.vx=lerp(me.vx,(dx/L1)*70*(1-pull)+fx*1.6*pull,dt*4);me.vy=lerp(me.vy,(dy/L1)*70*(1-pull)+fy*1.6*pull,dt*4);
    C3.resistT+=dt;C3.absorbT=0;if(C3.resistT>3)C3.wasResist=true;}
  else{me.vx=lerp(me.vx,fx*2.2,dt*2);me.vy=lerp(me.vy,fy*2.2,dt*2);C3.absorbT+=dt;if(C3.absorbT>3)hit(3,0);if(C3.wasResist&&C3.absorbT>0.6){hit(3,3);C3.wasResist=false;toast('一松手，又被卷回人流');}C3.resistT=0;}
  me.x+=me.vx*dt;me.y+=me.vy*dt;
  if(inField(me.x,me.y)){const dx=me.x-cx,dy=me.y-cy;const L2=Math.hypot(dx,dy)||1;me.x+=dx/L2*120*dt;me.y+=dy/L2*120*dt;C3.fieldPush+=dt;if(C3.fieldPush>0.6){hit(3,1);}
    if(Math.random()<dt*3)C3.talk.push({p:{x:me.x+20,y:me.y-10},t:1.5,s:'那是别人的地！'});}
  C3.talk.forEach(b=>{ctx.globalAlpha=Math.min(1,b.t);ctx.fillStyle='#fff';const w=ctx.measureText?ctx.measureText(b.s).width:60;ctx.font='12px sans-serif';const tw=ctx.measureText(b.s).width+12;ctx.fillRect(b.p.x-tw/2,b.p.y-30,tw,18);txt(b.s,b.p.x,b.p.y-17,'#334',12);ctx.globalAlpha=1;
    if(Math.hypot(b.p.x-me.x,b.p.y-me.y)<40&&b.s!=='那是别人的地！')hit(3,2);});
  ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.arc(me.x,me.y,8,0,7);ctx.fill();ctx.strokeStyle='#7a4a00';ctx.lineWidth=2;ctx.stroke();txt('你',me.x,me.y-14,'#7a4a00',12,'center',true);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(W*0.02,H*0.9,W*0.2,8);ctx.fillStyle='#5b6b7d';ctx.fillRect(W*0.02,H*0.9,W*0.2*clamp(C3.absorbT/3,0,1),8);txt('被“常人”带走（示意）',W*0.12,H*0.89,'#334',11);
  txt(C3.hold?'你在逆流而行……感到那股拉力了吗？':'你什么都没做——却一直在走，走的是“人们”走的路',W/2,24,'#223',14);}

/* ===== 第 4 关：向死而在 ===== */
let D4;
function init4(){D4={now:0.05,drag:false,poss:[],hold:false,holdT:0,shake:0,pushT:0,own:0,attached:[]};
  const names=['学画','远行','去看海','写一本书','学一门语言','照顾父母','换个城市','种一棵树','和解','开一家店','学游泳','重新开始'];
  names.forEach((n,i)=>D4.poss.push({n,x:0.12+i*0.072,y:0.3+((i*37)%5)*0.09,mine:false}));}
const X0=()=>W*0.06,X1=()=>W*0.9;
HD[4]={down(x,y){const nx=lerp(X0(),X1(),D4.now);if(Math.abs(x-nx)<40&&y>H*0.6){D4.drag=true;}else D4.hold=true;},
 move(x){if(D4.drag){const t=(x-X0())/(X1()-X0());if(t>0.985){D4.now=0.985;D4.pushT+=0.02;D4.shake=1;hit(4,1);if(D4.pushT>0.6)hit(4,2);}else D4.now=Math.max(D4.now,clamp(t,0,0.985));}},
 up(){D4.drag=false;D4.hold=false;D4.pushT=0;}};
function t4(dt){D4.now=Math.min(0.985,D4.now+dt*0.006);
  ctx.fillStyle='#1e2433';ctx.fillRect(0,0,W,H);
  // 人群背景（常人）：先行时淡去
  if(D4.hold){D4.holdT+=dt;D4.own=Math.min(1,D4.own+dt*0.4);}else{D4.holdT=0;D4.own=Math.max(0,D4.own-dt*0.15);}
  for(let i=0;i<30;i++){ctx.fillStyle=`rgba(120,135,160,${0.35*(1-D4.own)})`;ctx.beginPath();ctx.arc(((i*97)%100)/100*W,H*0.12+((i*53)%30)/100*H,5,0,7);ctx.fill();}
  if(D4.own<0.3)txt('“人总有一天会死，但还早呢。”',W*0.5,H*0.08+6,`rgba(200,210,230,${0.8*(1-D4.own)})`,13);
  // 时间轴
  const y=H*0.75,x0=X0(),x1=X1();ctx.strokeStyle='#7f93a8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();ctx.lineWidth=1;
  const sh=D4.shake*(Math.random()-.5)*6;D4.shake*=0.9;
  ctx.fillStyle='#0b0d12';ctx.fillRect(x1+sh,H*0.15,W-x1,H*0.75);ctx.fillStyle='#e8e8e8';ctx.fillRect(x1+sh,H*0.15,3,H*0.75);txt('死亡',x1+(W-x1)/2,H*0.5,'#ccc',14,'center',true);
  const nx=lerp(x0,x1,D4.now);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(x0,H*0.18,nx-x0,H*0.6);
  // 可能性
  D4.poss.forEach(p=>{const px=lerp(x0,x1,p.x),py=H*p.y;if(px<nx){p.gone=true;}
    if(p.gone){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(px,py,16,0,7);ctx.stroke();ctx.setLineDash([]);return;}
    if(!D4.hold&&!p.stuck&&Math.random()<dt*0.05&&D4.attached.length<4){p.stuck=true;D4.attached.push(p);hit(4,0);}
    if(p.stuck&&!D4.hold){p.ax=lerp(p.ax||px,nx+30+D4.attached.indexOf(p)*26,dt*2);p.ay=lerp(p.ay||py,y-40,dt*2);}
    else if(p.stuck&&D4.hold){p.stuck=false;D4.attached=D4.attached.filter(a=>a!==p);}
    const qx=p.stuck?p.ax:px,qy=p.stuck?p.ay:py;const mine=D4.own>0.6;
    ctx.fillStyle=mine?`rgba(243,165,43,${0.6+0.4*Math.sin(T*3+p.x*9)})`:p.stuck?'#8a7a9a':'#4f6b86';ctx.beginPath();ctx.arc(qx,qy,16,0,7);ctx.fill();txt(p.n,qx,qy+30,mine?'#ffd27a':'#cfd6e6',11);});
  if(D4.own>0.6)hit(4,3);
  // 现在
  ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.arc(nx,y,12,0,7);ctx.fill();txt('现在',nx,y+30,'#ffd27a',13,'center',true);
  const left=D4.poss.filter(p=>!p.gone).length;txt(`尚在前方的可能性：${left}`,W*0.03,H-10,'#cfd6e6',12,'left');
  txt(D4.drag?'拖向尽头……':D4.hold?'先行：不是去想死在何时，而是把有限的可能性当作自己的':'拖动“现在”向右；按住空白处“先行”',W/2,H*0.95,'#ffe7b5',13);}

/* ===== 第 5 关：应用练习 · 自行车 ===== */
let E5;
function init5(){E5={hits:[],absorb:0,ang:0,speed:0,slip:false,slipT:0,ride:0,chain:{x:0,y:0},drag:false,fixed:0,lookT:0};}
HD[5]={down(x,y){if(E5.slip){if(Math.hypot(x-E5.chain.x,y-E5.chain.y)<50)E5.drag=true;return;}E5.hits.push(T);if(E5.hits.length>8)E5.hits.shift();E5.speed=Math.min(1,E5.speed+0.25);},
 move(x,y){if(E5.drag){E5.chain.x=x;E5.chain.y=y;E5.lookT+=0.016;}},
 up(){if(E5.drag){E5.drag=false;const gx=W*0.42,gy=H*0.62;if(Math.hypot(E5.chain.x-gx,E5.chain.y-gy)<40){E5.slip=false;E5.fixed++;E5.ride=0;hit(5,1);toast('链条挂回去了——车又将“消失”在骑行之中');}}}};
function stead5(){const h=E5.hits;if(h.length<3)return 0;const iv=[];for(let i=1;i<h.length;i++)iv.push(h[i]-h[i-1]);const l=iv.slice(-4),m=l.reduce((a,b)=>a+b,0)/l.length,v=l.reduce((a,b)=>a+(b-m)**2,0)/l.length;if(m<0.25||m>1.3)return 0;return clamp(1-Math.sqrt(v)/m*2.2,0,1);}
function t5(dt){const recent=E5.hits.length&&T-E5.hits[E5.hits.length-1]<1.2&&!E5.slip;E5.absorb=lerp(E5.absorb,recent?stead5():0,dt*(recent?1.2:2.5));
  E5.speed=Math.max(0,E5.speed-dt*0.25);if(!E5.slip){E5.ride+=dt*E5.speed;E5.ang+=dt*E5.speed*8;}
  if(!E5.slip&&E5.ride>6&&E5.absorb>0.4){E5.slip=true;E5.slipT=0;E5.chain={x:W*0.5,y:H*0.82};hit(5,0);toast('链条掉了！');}
  const A=E5.absorb;const off=(T*E5.speed*200)%80;
  ctx.fillStyle=E5.slip?'#2a2d35':`rgb(${Math.round(lerp(120,170,A))},${Math.round(lerp(170,210,A))},${Math.round(lerp(220,235,A))})`;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#6a9a52';ctx.fillRect(0,H*0.8,W,H*0.2);for(let i=-1;i<W/80+1;i++){ctx.fillStyle='#4e7a3a';ctx.fillRect(i*80-off,H*0.8,30,6);}
  for(let i=0;i<5;i++){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(((i*230-off*0.3)%(W+200)+W+200)%(W+200)-100,H*0.15+i*14,40,12,0,0,7);ctx.fill();}
  const a=E5.slip?1:1-0.85*A;const bx=W*0.5,by=H*0.66,r=H*0.12;
  ctx.globalAlpha=a;ctx.strokeStyle='#223';ctx.lineWidth=4;[[bx-r*1.3,by],[bx+r*1.3,by]].forEach(([x,yy])=>{ctx.beginPath();ctx.arc(x,yy,r,0,7);ctx.stroke();for(let k=0;k<6;k++){const q=E5.ang+k*1.05;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+Math.cos(q)*r,yy+Math.sin(q)*r);ctx.stroke();}});
  ctx.beginPath();ctx.moveTo(bx-r*1.3,by);ctx.lineTo(bx-r*0.6,by-r*1.1);ctx.lineTo(bx+r*0.7,by-r*1.1);ctx.lineTo(bx+r*1.3,by);ctx.moveTo(bx-r*0.6,by-r*1.1);ctx.lineTo(bx-r*0.6,by);ctx.lineTo(bx+r*0.7,by-r*1.1);ctx.stroke();
  ctx.beginPath();ctx.arc(bx-r*0.6,by,r*0.25,0,7);ctx.stroke();
  if(!E5.slip){ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx-r*0.6,by-r*0.25);ctx.lineTo(bx+r*1.3,by-r*0.12);ctx.moveTo(bx-r*0.6,by+r*0.25);ctx.lineTo(bx+r*1.3,by+r*0.12);ctx.stroke();}
  ctx.globalAlpha=1;ctx.lineWidth=1;
  if(E5.slip){E5.slipT+=dt;ctx.strokeStyle='#ffd27a';ctx.lineWidth=3;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(E5.chain.x-30,E5.chain.y);ctx.quadraticCurveTo(E5.chain.x,E5.chain.y+20,E5.chain.x+30,E5.chain.y);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
    ctx.strokeStyle='rgba(125,255,176,.7)';ctx.beginPath();ctx.arc(W*0.42,H*0.62,36,0,7);ctx.stroke();
    ['齿数 44','链节 1/2 英寸','后轮直径 66 cm','车架：钢'].forEach((s,i)=>txt(s,W*0.08,H*0.25+i*24,'#ffe7b5',13,'left'));
    txt('车突然“出现”在眼前：把链条拖回绿色圈（齿轮）',W/2,26,'#ffe7b5',14);}
  else txt(E5.hits.length<3?'有节奏地按住、松开来蹬车':A>0.5?'你在骑车去某处……车几乎不在注意里':'节奏不稳：车又回到眼前',W/2,26,'#123',14);
  txt(`已骑行 ${E5.ride.toFixed(1)} · 修好链条 ${E5.fixed} 次`,W*0.97,H-10,'#e8eef4',12,'right');}

/* ===== 调度 ===== */
const INIT={1:()=>initHammer(false),2:()=>initHammer(true),3:init3,4:init4,5:init5};
const TICK={1:dt=>drawWorkshop(dt,1),2:dt=>drawWorkshop(dt,2),3:t3,4:t4,5:t5};
HD[1]={down:hammerDown,move:hammerMove,up:hammerUp};HD[2]={down:hammerDown,move:hammerMove,up:hammerUp};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!SAVE.done[t.dataset.l]);});}
function go(n){L=n;SAVE.level=n;persist();tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);INIT[L]();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{INIT[L]();toast('已重置本关（已点亮的原文保留）');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(SAVE.level&&TICK[SAVE.level]?SAVE.level:1);requestAnimationFrame(loop);
</script>
