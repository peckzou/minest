<!doctype html>
<html lang="zh-CN">

<body>

  addEventListener('message', function (e) { var m = e.data; if (m && m.paper === 1 && e.source === parent && m.op === 'map') { map = m; if (m.title) document.querySelector('.top h1').innerHTML = m.title; if (m.goLabel) document.getElementById('go').textContent = m.goLabel; if (m.hint) document.getElementById('hint').textContent = m.hint; build(); } });
  map = fake(); build(); requestAnimationFrame(frame);
  if (EMBED) parent.postMessage({ paper: 1, op: 'ready' }, location.origin);
  window.__paper = { show: show, view: view, get halls() { return map.halls; }, get n() { return [houses.length, trees.length]; } };
})();
</script>
