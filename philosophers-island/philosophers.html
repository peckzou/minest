<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>哲学家体素小岛 · Philosophers’ Island V2.0 (Top 20 Philosophers)</title>
<style>
  :root { --ink:#fff; --shadow:#1e293b; --slot:#475569; --gold:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1120; touch-action:none; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .mc { color:#fff; font-weight:800; letter-spacing:.4px; text-shadow:0 2px 6px rgba(0,0,0,0.75); }
  .panel { background:rgba(15,23,42,.82); border:1.5px solid rgba(255,255,255,.18); border-radius:14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 28px rgba(0,0,0,.45); }

  /* ---------- loading ---------- */
  #loading { position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(circle at 50% 25%, #1e3a5f 0%, #090d16 85%); transition:opacity .7s; padding:20px; text-align:center; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading .badge { padding:5px 14px; border-radius:999px; background:rgba(245,158,11,.18); border:1px solid rgba(245,158,11,.5); color:#fbbf24; font-size:12px; font-weight:800; letter-spacing:1.2px; }
  #loading h1 { margin:0; font-size:clamp(28px,6vw,54px); background:linear-gradient(135deg,#fde68a,#f59e0b,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  #loading .sub { font-size:clamp(13px,2.2vw,16px); color:#cbd5e1; max-width:660px; line-height:1.55; font-weight:500; }
  #bar { width:min(400px,78vw); height:12px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(15,23,42,.8); overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#f59e0b,#38bdf8); transition:width .15s; }
  #loadMsg { font-size:13px; color:#fde68a; }

  /* ---------- HUD (Minimalist, Zero-Occlusion Glass) ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; left:calc(12px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #title-card { padding:6px 10px 6px 12px; display:flex; align-items:center; gap:10px; border-radius:999px; background:rgba(12,18,32,.68); border:1px solid rgba(255,255,255,.16); }
  #title b { font-size:13.5px; display:inline; color:#fde68a; letter-spacing:.3px; }
  #modeLabel { display:none; }
  #coords { display:none; }
  #compass-top-btn { padding:5px 11px; border-radius:999px; background:linear-gradient(135deg,#f59e0b,#d97706); color:#090d16; font-weight:900; font-size:11.5px; border:none; cursor:pointer; box-shadow:0 2px 10px rgba(245,158,11,.35); display:inline-flex; align-items:center; gap:5px; }
  #compass-top-btn:hover { transform:translateY(-1px); filter:brightness(1.06); }

  #crosshair { position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; display:none; opacity:.72; }
  #crosshair:before,#crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair:before { left:6px; top:1px; width:2px; height:12px; }
  #crosshair:after { top:6px; left:1px; height:2px; width:12px; }

  #banner { position:absolute; left:50%; top:calc(54px + env(safe-area-inset-top)); transform:translateX(-50%); text-align:center; opacity:0; transition:opacity .4s; padding:5px 14px; border-radius:999px; background:rgba(12,18,32,.72); border:1px solid rgba(245,158,11,.35); backdrop-filter:blur(8px); max-width:min(380px, 68vw); }
  #banner.show { opacity:1; }
  #banner b { display:block; font-size:13px; color:#fde68a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #banner span { display:none; }

  #mmWrap { position:absolute; right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); padding:5px; pointer-events:auto; border-radius:12px; background:rgba(12,18,32,.68); border:1px solid rgba(255,255,255,.15); }
  #mm { display:block; width:177px; height:112px; border-radius:8px; image-rendering:pixelated; cursor:crosshair; border:1px solid rgba(255,255,255,.14); }
  #timeBox { margin-top:4px; font-size:10.5px; display:flex; align-items:center; gap:5px; padding:0 2px; color:#cbd5e1; }
  #timeBox input { flex:1; accent-color:#f59e0b; min-width:0; pointer-events:auto; cursor:pointer; height:3px; }

  #hint { position:absolute; left:calc(12px + env(safe-area-inset-left)); bottom:calc(62px + env(safe-area-inset-bottom)); padding:8px 12px; font-size:11px; line-height:1.5; max-width:min(300px,62vw); color:#e2e8f0; display:none; }
  #hint.show { display:block; }

  /* Floating Interaction Prompt Pill */
  #pi-portal-prompt {
    position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:25; display:none; align-items:center; gap:8px; padding:8px 18px; border-radius:999px;
    background:rgba(12,18,32,.86);
    border:1.5px solid rgba(245,158,11,.85); color:#fde68a; font-weight:800; font-size:12.5px;
    box-shadow:0 6px 22px rgba(0,0,0,.45); cursor:pointer; pointer-events:auto; white-space:nowrap;
    backdrop-filter:blur(10px);
  }
  #pi-portal-prompt:hover { background:rgba(245,158,11,.22); }

  #hotbar { position:absolute; left:50%; bottom:calc(10px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:4px; padding:4px 6px; background:rgba(12,18,32,.72); border:1px solid rgba(255,255,255,.16); border-radius:999px; pointer-events:auto; max-width:96vw; backdrop-filter:blur(10px); }
  .slot { position:relative; width:36px; height:36px; background:rgba(51,65,85,.45); border:1px solid rgba(255,255,255,.12); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; transition:all .14s; }
  .slot:hover { background:rgba(71,85,105,.88); transform:translateY(-2px); }
  .slot small { display:none; }
  .slot em { position:absolute; top:-28px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; white-space:nowrap; opacity:0; transition:opacity .15s; color:#fde68a; background:rgba(12,18,32,.92); padding:3px 8px; border-radius:6px; border:1px solid rgba(245,158,11,.35); pointer-events:none; }
  .slot:hover em { opacity:1; }
  .slot.on { border-color:#f59e0b; background:rgba(245,158,11,.28); box-shadow:0 0 10px rgba(245,158,11,.35); }

  #lockHint { display:none !important; }
  #toast { position:absolute; left:50%; top:calc(92px + env(safe-area-inset-top)); transform:translateX(-50%); padding:5px 14px; font-size:11.5px; opacity:0; transition:opacity .28s; color:#fde68a; border-color:rgba(245,158,11,.35); white-space:nowrap; max-width:min(420px, 84vw); overflow:hidden; text-overflow:ellipsis; border-radius:999px; background:rgba(12,18,32,.78); }
  #toast.show { opacity:1; }

  /* ---------- touch controls ---------- */
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch #hint { display:none; }
  #joy { position:fixed; left:calc(20px + env(safe-area-inset-left)); bottom:calc(84px + env(safe-area-inset-bottom)); width:114px; height:114px; border-radius:50%; background:rgba(15,23,42,.45); border:2px solid rgba(255,255,255,.35); pointer-events:auto; touch-action:none; z-index:12; }
  #joy i { position:absolute; left:37px; top:37px; width:40px; height:40px; border-radius:50%; background:rgba(245,158,11,.75); }
  .tbtn { position:fixed; width:50px; height:50px; border-radius:14px; background:rgba(15,23,42,.65); border:1.5px solid rgba(255,255,255,.35); color:#fff; font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center; pointer-events:auto; z-index:12; touch-action:none; }
  #tJump { right:calc(20px + env(safe-area-inset-right)); bottom:calc(142px + env(safe-area-inset-bottom)); }
  #tDown { right:calc(20px + env(safe-area-inset-right)); bottom:calc(84px + env(safe-area-inset-bottom)); }
  #tFly { right:calc(80px + env(safe-area-inset-right)); bottom:calc(112px + env(safe-area-inset-bottom)); font-size:13px; }
  #tUse { right:calc(80px + env(safe-area-inset-right)); bottom:calc(172px + env(safe-area-inset-bottom)); font-size:18px; border-color:#f59e0b; background:rgba(245,158,11,.28); }

  /* ---------- INTERACTION PORTAL & TOP 20 COMPASS MODAL ---------- */
  #pi-modal-overlay {
    position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(2,6,23,.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  #pi-modal-content {
    width:min(760px, 96vw); max-height:86dvh; overflow-y:auto;
    background:linear-gradient(165deg, #0f172a 0%, #1e293b 100%);
    border:1.5px solid rgba(245,158,11,.45); border-radius:22px;
    padding:20px 22px; color:#f8fafc; box-shadow:0 24px 70px rgba(0,0,0,.75);
  }
  .pi-m-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
  .pi-m-badge { display:inline-block; padding:3px 10px; border-radius:999px; background:rgba(56,189,248,.16); border:1px solid rgba(56,189,248,.4); color:#7dd3fc; font-size:11px; font-weight:800; margin-bottom:6px; }
  .pi-m-header h2 { margin:0 0 4px; font-size:clamp(18px,3vw,23px); color:#fde68a; }
  .pi-m-sub { font-size:12.5px; color:#94a3b8; }
  .pi-m-close { width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#e2e8f0; font-size:16px; cursor:pointer; flex-shrink:0; }
  .pi-m-quote { margin:12px 0; padding:10px 14px; border-left:3.5px solid #f59e0b; background:rgba(245,158,11,.08); border-radius:0 10px 10px 0; font-style:italic; font-size:13.5px; color:#fef3c7; }
  .pi-m-section h4 { margin:10px 0 6px; font-size:13.5px; color:#7dd3fc; }
  .pi-m-section p { margin:0; font-size:13.5px; line-height:1.65; color:#e2e8f0; }

  .pi-exp-box { margin:14px 0; padding:14px; border-radius:14px; background:rgba(2,6,23,.55); border:1px solid rgba(245,158,11,.35); }
  .pi-exp-head { font-weight:800; font-size:13.5px; color:#fbbf24; margin-bottom:6px; }
  .pi-exp-sub { margin:0 0 10px; font-size:12px; color:#cbd5e1; }
  .pi-btn-row { display:flex; gap:8px; flex-wrap:wrap; }
  .pi-act-btn { padding:8px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(30,41,59,.9); color:#f1f5f9; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; }
  .pi-act-btn:hover, .pi-act-btn.active { border-color:#38bdf8; background:rgba(14,116,144,.45); color:#fff; }
  .pi-act-btn.gold { background:linear-gradient(135deg,#f59e0b,#d97706); border-color:#fbbf24; color:#090d16; font-weight:900; }
  .pi-slider-row { margin-top:10px; display:flex; align-items:center; gap:10px; font-size:12px; color:#cbd5e1; flex-wrap:wrap; }
  .pi-slider-row input { flex:1; accent-color:#f59e0b; min-width:140px; }

  .pi-grid-2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:8px; }
  .pi-cause-card { padding:9px 11px; border-radius:10px; background:rgba(30,41,59,.7); border:1px solid rgba(255,255,255,.1); }
  .pi-cause-card b { display:block; font-size:12.5px; color:#fde68a; margin-bottom:3px; }
  .pi-cause-card span { font-size:11.5px; color:#cbd5e1; line-height:1.45; }

  .pi-m-guardrail { margin-top:12px; padding:9px 12px; border-radius:10px; background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); font-size:12px; color:#a7f3d0; line-height:1.5; }
  .pi-m-meta { margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:#94a3b8; font-family:ui-monospace,monospace; }
  .pi-m-meta code { color:#7dd3fc; }
  .pi-m-footer { margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }

  /* Top 20 Philosophers Grid inside Compass Modal */
  .pi-phil-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(215px, 1fr)); gap:10px; margin-top:8px; }
  .pi-phil-card { padding:11px 12px; border-radius:12px; background:rgba(15,23,42,.75); border:1px solid rgba(255,255,255,.12); display:flex; flex-direction:column; justify-content:space-between; gap:6px; }
  .pi-phil-card.visited { border-color:rgba(245,158,11,.55); background:rgba(245,158,11,.07); }
  .pi-pc-top { display:flex; align-items:center; justify-content:space-between; }
  .pi-pc-num { font-weight:900; font-size:13.5px; color:#fde68a; }
  .pi-pc-status { font-size:10.5px; padding:2px 7px; border-radius:999px; background:rgba(255,255,255,.07); color:#94a3b8; }
  .pi-phil-card.visited .pi-pc-status { background:rgba(245,158,11,.25); color:#fbbf24; font-weight:800; }
  .pi-pc-dist { font-size:10.5px; color:#7dd3fc; font-weight:700; }
  .pi-pc-portal { font-size:11.5px; color:#cbd5e1; line-height:1.35; }
  .pi-pc-actions { display:flex; gap:6px; margin-top:4px; }
  .pi-pc-actions button { flex:1; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.18); background:rgba(30,41,59,.9); color:#e2e8f0; font-size:11.5px; font-weight:700; cursor:pointer; }
  .pi-pc-actions button.pri { background:rgba(245,158,11,.22); border-color:#f59e0b; color:#fde68a; }
  .pi-pc-actions button:hover { background:#f59e0b; color:#090d16; }

  /* ---------- compare & saved modals ---------- */
  .pi-cmp-q { display:block; width:100%; margin:12px 0 10px; padding:10px 12px; border-radius:10px; border:1px solid rgba(148,163,184,.4); background:rgba(15,23,42,.92); color:#f8fafc; font-family:inherit; font-size:13.5px; line-height:1.5; outline:none; resize:vertical; -webkit-user-select:text; user-select:text; }
  .pi-cmp-q:focus { border-color:#fbbf24; }
  .pi-cmp-warn { margin-top:12px; font-size:12.5px; color:#fca5a5; }
  .pi-cmp-card { display:flex; gap:12px; margin-top:10px; padding:11px 12px; border-radius:12px; background:rgba(15,23,42,.75); border:1px solid rgba(255,255,255,.12); }
  .pi-cmp-card img { width:46px; height:56px; object-fit:cover; border-radius:6px; border:1.5px solid #d97706; flex-shrink:0; }
  .pi-cmp-body { flex:1; min-width:0; }
  .pi-cmp-body h4 { margin:0 0 5px; font-size:13.5px; color:#fde68a; }
  .pi-cmp-body h4 span { font-size:11px; font-weight:600; color:#93c5fd; margin-left:6px; }
  .pi-cmp-text { font-size:13px; line-height:1.65; color:#e2e8f0; margin-bottom:8px; -webkit-user-select:text; user-select:text; }
  .pi-act-btn:disabled { opacity:.6; cursor:default; }
  .pi-save-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .pi-save-meta { min-width:0; }
  .pi-save-meta b { display:block; font-size:13.5px; color:#f8fafc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pi-save-meta span { font-size:11.5px; color:#94a3b8; }
  .pi-save-row .pi-pc-actions { flex-shrink:0; margin-top:0; }
  .pi-save-row .pi-pc-actions button { white-space:nowrap; }
  .pi-save-empty { margin:18px 0; font-size:13px; color:#94a3b8; }

  .pi-cmp-toggle { margin-right:8px; padding:3px 10px; border-radius:999px; border:1px solid rgba(251,191,36,.45); background:transparent; color:#fbbf24; font-family:inherit; font-size:11px; font-weight:800; cursor:pointer; }
  .pi-cmp-toggle:hover { background:#f59e0b; color:#090d16; }
  .pi-cmp-rest { margin-top:-2px; }
  .pi-tr-row { padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:13.5px; line-height:1.7; -webkit-user-select:text; user-select:text; }
  .pi-tr-row b { display:block; font-size:11px; letter-spacing:1px; color:#fbbf24; margin-bottom:2px; }
  .pi-tr-row.user b { color:#7dd3fc; }
  .pi-tr-row.user div { color:#bae6fd; }

  /* ================= ENCOUNTER: cinematic conversation + thought constellation ================= */
  body.pi-encounter #hud > :not(#toast), body.pi-encounter #touch { opacity:0 !important; pointer-events:none !important; transition:opacity .35s; }
  #pi-rpg-dialogue { position:fixed; inset:0; z-index:45; display:none; overflow:hidden; color:#f8fafc; cursor:pointer; animation:piEncIn .5s ease both; }
  @keyframes piEncIn { from { opacity:0; } }
  .pi-enc-bar { position:absolute; left:0; right:0; pointer-events:none; }
  .pi-enc-bar.top { top:0; height:17vh; background:linear-gradient(#04060c 0%, rgba(4,6,12,.72) 45%, transparent); animation:piBarT .8s cubic-bezier(.16,1,.3,1) both; }
  .pi-enc-bar.bottom { bottom:0; height:60vh; background:linear-gradient(transparent, rgba(4,6,12,.78) 36%, #04060c 90%); animation:piBarB .8s cubic-bezier(.16,1,.3,1) both; }
  @keyframes piBarT { from { transform:translateY(-100%); } }
  @keyframes piBarB { from { transform:translateY(50%); opacity:0; } }
  .pi-enc-vig { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 36%, transparent 34%, rgba(4,6,12,.5) 100%); }
  .pi-enc-motes { position:absolute; inset:0; pointer-events:none; }
  .pi-enc-motes i { position:absolute; bottom:38vh; width:3px; height:3px; border-radius:50%; background:#fde68a; box-shadow:0 0 6px #f59e0b; opacity:0; animation:piMote 9s linear infinite; }
  @keyframes piMote { 0% { transform:translate(0,0); opacity:0; } 12% { opacity:.75; } 100% { transform:translate(36px,-52vh); opacity:0; } }

  .pi-enc-lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .pi-enc-lines line { stroke:rgba(253,230,138,.15); stroke-width:1; stroke-dasharray:3 7; transition:stroke .4s; }
  .pi-enc-lines line.lit { stroke:rgba(245,158,11,.42); stroke-dasharray:none; }
  .pi-enc-lines line.active { stroke:#fbbf24; stroke-width:1.6; stroke-dasharray:6 6; animation:piDash 1s linear infinite; }
  @keyframes piDash { to { stroke-dashoffset:-24; } }

  .pi-orb { position:absolute; left:0; top:0; width:66px; height:66px; margin:-33px 0 0 -33px; padding:0; border:0; background:none; color:inherit; font-family:inherit; cursor:pointer; will-change:transform; }
  .pi-orb-in { position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.26), rgba(15,23,42,.74) 64%); border:1.5px solid rgba(253,230,138,.5);
    box-shadow:0 0 18px rgba(245,158,11,.2), inset 0 0 12px rgba(255,255,255,.08); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
    animation:piOrbIn .75s cubic-bezier(.2,1.5,.4,1) backwards; transition:transform .22s, border-color .3s, background .4s, box-shadow .4s; }
  @keyframes piOrbIn { from { transform:scale(0); opacity:0; } }
  .pi-orb-glyph { font:700 25px/1 "Songti SC","STSong","Noto Serif SC",serif; color:#fde68a; text-shadow:0 0 12px rgba(245,158,11,.65); transition:color .3s; }
  .pi-orb-label { position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:6px; max-width:124px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11.5px; font-weight:700; color:#e2e8f0; text-shadow:0 1px 5px #000, 0 0 2px #000; }
  .pi-orb.know { width:50px; height:50px; margin:-25px 0 0 -25px; }
  .pi-orb.know .pi-orb-in { border-color:rgba(125,211,252,.5); box-shadow:0 0 14px rgba(56,189,248,.2), inset 0 0 10px rgba(255,255,255,.08); }
  .pi-orb.know .pi-orb-glyph { font-size:18px; color:#bae6fd; text-shadow:0 0 10px rgba(56,189,248,.65); }
  .pi-orb.know .pi-orb-label { font-size:10.5px; color:#cbd5e1; }
  .pi-orb:hover .pi-orb-in { transform:scale(1.14); border-color:#fbbf24; }
  .pi-orb.lit .pi-orb-in { background:radial-gradient(circle at 34% 28%, #fef3c7, #f59e0b 46%, #92400e 100%); border-color:#fde68a; box-shadow:0 0 24px rgba(245,158,11,.6); }
  .pi-orb.lit .pi-orb-glyph { color:#1c1206; text-shadow:none; }
  .pi-orb.active .pi-orb-in { transform:scale(1.2); }

  .pi-enc-id { position:absolute; left:calc(18px + env(safe-area-inset-left)); top:calc(14px + env(safe-area-inset-top)); display:flex; align-items:center; gap:12px; cursor:default; animation:piSlideR .7s cubic-bezier(.16,1,.3,1) both; }

  .pi-enc-tools { position:absolute; right:calc(18px + env(safe-area-inset-right)); top:calc(14px + env(safe-area-inset-top)); display:flex; gap:8px; }

  .pi-rpg-menu { position:absolute; right:0; top:44px; z-index:3; flex-direction:column; gap:2px; padding:6px; border-radius:12px; background:rgba(11,17,30,.97); border:1px solid rgba(245,158,11,.45); box-shadow:0 12px 30px rgba(0,0,0,.6); }

  .pi-stage-node.done { border-color:rgba(245,158,11,.6); color:#fde68a; }

  .pi-enc-stage.books .pi-stage-node.on { background:linear-gradient(160deg,#f59e0b,#b45309); color:#1c1206; transform:translateY(-6px) rotate(-2deg); }

  .pi-enc-you { min-height:18px; margin-bottom:4px; font-size:12.5px; color:#7dd3fc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pi-enc-you.pop { animation:piYou .5s ease both; }
  @keyframes piYou { from { transform:translateY(14px); opacity:0; } }
  .pi-enc-tag { display:inline-block; margin-bottom:8px; padding-bottom:4px; border-bottom:1px solid rgba(245,158,11,.55); font-size:12px; font-weight:800; letter-spacing:2px; color:#fbbf24; }
  .pi-enc-text { min-height:5.4em; font:500 clamp(17px, 2vw, 23px)/1.8 "Songti SC","STSong","Noto Serif SC","PingFang SC",serif; letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.95); }
  .pi-enc-text .c { opacity:0; animation:piChar .5s ease forwards; }
  @keyframes piChar { from { opacity:0; filter:blur(5px); } to { opacity:1; filter:none; } }
  .pi-enc-text .k { color:#fde68a; font-weight:700; text-shadow:0 0 14px rgba(245,158,11,.6), 0 2px 10px rgba(0,0,0,.95); }
  .pi-enc-text.instant .c { animation:none; opacity:1; }
  .pi-enc-text.is-q { font-style:italic; color:#bae6fd; }
  .pi-enc-foot { display:flex; align-items:center; gap:10px; min-height:32px; margin-top:8px; }
  .pi-enc-dots i { display:inline-block; width:18px; height:3px; margin-right:4px; border-radius:2px; background:rgba(255,255,255,.2); transition:background .3s; }
  .pi-enc-dots i.done { background:rgba(245,158,11,.5); }
  .pi-enc-dots i.on { background:#fbbf24; box-shadow:0 0 8px #f59e0b; }
  .pi-enc-next { margin-left:auto; padding:5px 14px; border-radius:999px; border:1px solid #fbbf24; background:rgba(245,158,11,.12); color:#fde68a; font-family:inherit; font-size:12px; font-weight:800; cursor:pointer; animation:piPulse 1.5s ease-in-out infinite; }
  @keyframes piPulse { 50% { box-shadow:0 0 14px rgba(245,158,11,.7); background:rgba(245,158,11,.28); } }
  .pi-enc-act { padding:5px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(15,23,42,.55); color:#e2e8f0; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; animation:piYou .4s ease both; }
  .pi-enc-act:hover { border-color:#fbbf24; color:#fde68a; }
  #pi-enc-rebut:hover { border-color:#f87171; color:#fecaca; }
  #pi-rpg-dialogue.clash .pi-enc-caption { animation:piShake .45s; }
  @keyframes piShake { 20% { margin-left:-9px; } 40% { margin-left:8px; } 60% { margin-left:-5px; } 80% { margin-left:3px; } }
  #pi-rpg-dialogue.clash::after { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 40%, rgba(248,113,113,.28), transparent 65%); animation:piFlash .6s ease forwards; }
  @keyframes piFlash { to { opacity:0; } }

  .pi-enc-ask { position:absolute; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(860px, 90vw); cursor:default; }
  .pi-rpg-chips { display:flex; gap:6px; margin-bottom:6px; overflow-x:auto; scrollbar-width:none; }
  .pi-rpg-chips::-webkit-scrollbar { display:none; }
  .pi-rpg-chip { flex-shrink:0; padding:3px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:transparent; color:#cbd5e1; font-family:inherit; font-size:11.5px; white-space:nowrap; cursor:pointer; transition:all .15s; }
  .pi-rpg-chip:hover { border-color:#fbbf24; color:#fde68a; }
  .pi-enc-inputrow { display:flex; align-items:center; gap:8px; border-bottom:1px solid rgba(255,255,255,.28); transition:border-color .2s; }
  .pi-enc-inputrow:focus-within { border-color:#fbbf24; }
  #pi-rpg-input { flex:1; min-width:0; padding:8px 2px; border:0; outline:0; background:transparent; color:#f8fafc; font-family:inherit; font-size:14px; -webkit-user-select:text; user-select:text; }
  #pi-rpg-input::placeholder { color:#64748b; }
  #pi-rpg-send { padding:6px 8px; border:0; background:none; color:#fbbf24; font-size:16px; cursor:pointer; }
  @media (max-width:640px), (max-height:600px) {

    .pi-enc-ring { width:48px; height:48px; } .pi-enc-ring svg { width:48px; height:48px; } .pi-enc-ring img { left:5px; top:5px; width:38px; height:38px; }
    .pi-enc-name { font-size:17px; }
  }

  /* ================= HOLO CONSOLE overlay ================= */
  #pi-holo { position:fixed; inset:0; z-index:70; display:none; background:#02060d; }

    padding:8px; border-radius:14px; background:rgba(6,18,34,.74); border:1px solid rgba(120,214,255,.3); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); color:#e8f8ff; font-size:12.5px; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .pi-holo-fold { display:flex; width:100%; align-items:center; justify-content:space-between; gap:8px; padding:4px 6px; border:0; background:none; color:#dff7ff; font-family:inherit; font-size:13px; font-weight:800; text-align:left; cursor:pointer; text-shadow:0 0 10px rgba(80,210,255,.6); }
  .pi-holo-fold i { font-style:normal; color:#6fe3ff; transition:transform .2s; }
  #pi-holo-rail.min .pi-holo-fold i { transform:rotate(-90deg); }
  #pi-holo-rail.min .pi-holo-body { display:none; }
  .pi-holo-body .sub { margin:4px 6px 2px; color:rgba(200,232,255,.7); font-size:11px; line-height:1.5; }

  .pi-holo-m:hover { background:#ffb454; color:#231500; }
  .pi-holo-m.holo { border-color:rgba(111,227,255,.7); background:rgba(70,210,255,.12); color:#dff7ff; }
  .pi-holo-m.holo:hover { background:#6fe3ff; color:#04202e; }
  .pi-holo-m em { margin-left:auto; padding:1px 6px; border-radius:999px; border:1px solid currentColor; font-style:normal; font-size:10px; white-space:nowrap; }
  .pi-holo-m.holo.done::after { margin-left:6px; }
  .pi-holo-m.done::after { content:"✓"; margin-left:auto; color:#7dffb0; }
  .pi-holo-m.done:hover::after { color:#14532d; }

  .pi-holo-bar button:hover { border-color:#6fe3ff; background:rgba(40,120,170,.45); }

<body>
<canvas id="gl" tabindex="0"></canvas>

<div id="loading">
  <span class="badge">MINEST · MY WORLD · SPATIAL EPISTEMOLOGY V2.0</span>
  <h1>PHILOSOPHERS’ ISLAND</h1>
  <div class="sub">哲学家体素小岛 · 主岛七大街区 + 社会科学附属岛 · 43 座展馆 · 柏拉图地下洞穴光影剧场 · 康德星空阁楼 · 休谟台球因果厅</div>
  <div id="bar"><i></i></div>
  <div id="loadMsg">正在开辟思想岛屿…</div>
</div>

<div id="hud">
  <div id="title">
    <div id="title-card" class="panel">
      <b>🏛️ 哲学家小岛</b>
      <span id="modeLabel"></span>
      <div id="coords"></div>
      <button type="button" id="compass-top-btn" onclick="window.__philosophersIsland && window.__philosophersIsland.portals.openCompassModal()">
        <span>🧭</span> <span>罗盘 <span id="pi-journal-count">0/20</span></span>
      </button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="banner" class="mc"><b id="bannerT"></b><span id="bannerS"></span></div>

  <div id="mmWrap" class="panel">
    <canvas id="mm" width="608" height="384" title="点击小地图上的金色标记可瞬间传送至该哲学家住宅"></canvas>
    <div id="timeBox" class="mc"><span id="clock">10:30</span><input id="timeSlider" type="range" min="0" max="24" step="0.05" value="10.5"></div>
  </div>

  <div id="hint" class="panel"></div>
  <div id="lockHint" class="panel mc">点击画面进入第一人称视角 · 按 M 打开哲学家罗盘</div>

  <button type="button" id="pi-portal-prompt" onclick="window.__philosophersIsland && window.__philosophersIsland.interact()">
    <span class="pi-pp-title">✨ [按 E 或点击] 启动思想实验</span>
  </button>

  <div id="hotbar"></div>
  <div id="toast" class="panel mc"></div>
</div>

<div id="touch">
  <div id="joy"><i></i></div>
  <div id="tJump" class="tbtn">⤒</div>
  <div id="tDown" class="tbtn">⤓</div>
  <div id="tFly" class="tbtn">飞</div>
  <div id="tUse" class="tbtn">✨</div>
</div>

<!-- Encounter: cinematic face-to-face conversation with a thought constellation -->
<div id="pi-rpg-dialogue" class="pi-enc" role="dialog" aria-label="与哲学家对谈">
  <div class="pi-enc-vig"></div>
  <div class="pi-enc-bar top"></div>
  <div class="pi-enc-bar bottom"></div>
  <div class="pi-enc-motes"><i style="left:12%;animation-delay:0s"></i><i style="left:24%;animation-delay:3.1s"></i><i style="left:37%;animation-delay:6.2s"></i><i style="left:49%;animation-delay:1.4s"></i><i style="left:61%;animation-delay:4.6s"></i><i style="left:73%;animation-delay:7.3s"></i><i style="left:85%;animation-delay:2.5s"></i><i style="left:93%;animation-delay:5.5s"></i></div>
  <svg id="pi-enc-lines" class="pi-enc-lines"></svg>
  <div id="pi-enc-orbs"></div>
  <header class="pi-enc-id">
    <div class="pi-enc-ring">
      <svg viewBox="0 0 64 64" width="64" height="64"><circle class="bg" cx="32" cy="32" r="29"/><circle id="pi-enc-prog" class="fg" cx="32" cy="32" r="29"/></svg>
      <img id="pi-rpg-portrait" src="" alt="哲学家肖像">
    </div>
    <div>
      <div id="pi-rpg-name" class="pi-enc-name"></div>
      <div id="pi-rpg-era" class="pi-enc-era"></div>
      <div id="pi-enc-count" class="pi-enc-count"></div>
    </div>
  </header>
  <div class="pi-enc-tools">
    <button type="button" id="pi-rpg-more" aria-haspopup="true" title="更多">⋯</button>
    <button type="button" id="pi-rpg-close" title="结束对谈 (Esc)">✕</button>
    <div id="pi-rpg-menu" class="pi-rpg-menu" style="display:none">
      <button type="button" id="pi-rpg-stick">🎬 火柴人小动画</button>
      <button type="button" id="pi-rpg-shelf">📚 读他的书</button>
      <button type="button" id="pi-rpg-walk">🚶 边走边谈</button>
      <button type="button" id="pi-rpg-council">🏛 请其他人来开圆桌会议</button>
      <button type="button" id="pi-rpg-table">🪑 回到圆桌</button>
      <button type="button" id="pi-rpg-transcript">📜 对话回顾</button>
      <button type="button" id="pi-rpg-save">💾 保存对话</button>
      <button type="button" id="pi-rpg-reset">↺ 重新开始</button>
      <button type="button" id="pi-rpg-open-compare">⚖️ 同一问题问诸家</button>
      <button type="button" id="pi-rpg-open-saved">📑 我的收藏</button>
      <button type="button" id="pi-rpg-open-holo">🔷 全息操作台 · 交互模型</button>
      <button type="button" id="pi-rpg-open-wiki">📚 百科与馆藏</button>
      <button type="button" id="pi-rpg-open-exp">✨ 思想实验</button>
    </div>
  </div>
  <div class="pi-enc-caption">
    <div id="pi-enc-stage" class="pi-enc-stage"></div>
    <div id="pi-enc-you" class="pi-enc-you"></div>
    <div id="pi-enc-tag" class="pi-enc-tag"></div>
    <div id="pi-enc-text" class="pi-enc-text"></div>
    <div class="pi-enc-foot">
      <span id="pi-enc-dots" class="pi-enc-dots"></span>
      <button type="button" id="pi-enc-rebut" class="pi-enc-act">⚔ 反驳</button>
      <button type="button" id="pi-enc-deeper" class="pi-enc-act">↧ 再深一层</button>
      <button type="button" id="pi-enc-next" class="pi-enc-next">继续 ▸</button>
    </div>
  </div>
  <div class="pi-enc-ask">
    <div id="pi-rpg-chips" class="pi-rpg-chips"></div>
    <div class="pi-enc-inputrow">
      <input id="pi-rpg-input" type="text" placeholder="点亮一颗星，或在这里直接提问…" autocomplete="off">
      <button type="button" id="pi-rpg-send" title="发送">↵</button>
    </div>
  </div>
</div>

<!-- Holo console: the star map (holo-lab-2) with the hall's interactive thinking models -->
<div id="pi-holo">
  <iframe id="pi-holo-frame" title="全息操作台" allow="fullscreen"></iframe>
  <div id="pi-holo-rail"></div>
  <div id="pi-holo-model">
    <div class="pi-holo-bar">

      <span id="pi-holo-model-note"></span>
      <button type="button" id="pi-holo-exit">✕ 回到小岛</button>

    <iframe id="pi-holo-model-frame" title="交互模型"></iframe>
  </div>
</div>

<!-- InteractionPortal & Top 20 Compass Overlay Modal -->
<div id="pi-modal-overlay">
  <div id="pi-modal-content"></div>
</div>
