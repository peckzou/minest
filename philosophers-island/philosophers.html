<style>

    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .mc { color:#fff; font-weight:800; letter-spacing:.4px; text-shadow:0 2px 6px rgba(0,0,0,0.75); }
  .panel { background:rgba(15,23,42,.82); border:1.5px solid rgba(255,255,255,.18); border-radius:14px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 28px rgba(0,0,0,.45); }

  /* ---------- loading ---------- */
  #loading { position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(circle at 50% 25%, #1e3a5f 0%, #090d16 85%); transition:opacity .7s; padding:20px; text-align:center; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading .badge { padding:5px 14px; border-radius:999px; background:rgba(245,158,11,.18); border:1px solid rgba(245,158,11,.5); color:#fbbf24; font-size:12px; font-weight:800; letter-spacing:1.2px; }
  #loading h1 { margin:0; font-size:clamp(28px,6vw,54px); background:linear-gradient(135deg,#fde68a,#f59e0b,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  #loading .sub { font-size:clamp(13px,2.2vw,16px); color:#cbd5e1; max-width:660px; line-height:1.55; font-weight:500; }
  #bar { width:min(400px,78vw); height:12px; border-radius:999px; border:1px solid rgba(255,255,255,.25); background:rgba(15,23,42,.8); overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#f59e0b,#38bdf8); transition:width .15s; }

  /* ---------- HUD (Minimalist, Zero-Occlusion Glass) ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; left:calc(12px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #title-card { padding:6px 10px 6px 12px; display:flex; align-items:center; gap:10px; border-radius:999px; background:rgba(12,18,32,.68); border:1px solid rgba(255,255,255,.16); }
  #title b { font-size:13.5px; display:inline; color:#fde68a; letter-spacing:.3px; }
  #modeLabel { display:none; }
  #coords { display:none; }
  #compass-top-btn { padding:5px 11px; border-radius:999px; background:linear-gradient(135deg,#f59e0b,#d97706); color:#090d16; font-weight:900; font-size:11.5px; border:none; cursor:pointer; box-shadow:0 2px 10px rgba(245,158,11,.35); display:inline-flex; align-items:center; gap:5px; }

  #crosshair { position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; display:none; opacity:.72; }
  #crosshair:before,#crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair:before { left:6px; top:1px; width:2px; height:12px; }
  #crosshair:after { top:6px; left:1px; height:2px; width:12px; }

  #banner { position:absolute; left:50%; top:calc(54px + env(safe-area-inset-top)); transform:translateX(-50%); text-align:center; opacity:0; transition:opacity .4s; padding:5px 14px; border-radius:999px; background:rgba(12,18,32,.72); border:1px solid rgba(245,158,11,.35); backdrop-filter:blur(8px); max-width:min(380px, 68vw); }
  #banner.show { opacity:1; }
  #banner b { display:block; font-size:13px; color:#fde68a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #mmWrap { position:absolute; right:calc(12px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); padding:5px; pointer-events:auto; border-radius:12px; background:rgba(12,18,32,.68); border:1px solid rgba(255,255,255,.15); }

  #timeBox input { flex:1; accent-color:#f59e0b; min-width:0; pointer-events:auto; cursor:pointer; height:3px; }

  #hint { position:absolute; left:calc(12px + env(safe-area-inset-left)); bottom:calc(62px + env(safe-area-inset-bottom)); padding:8px 12px; font-size:11px; line-height:1.5; max-width:min(300px,62vw); color:#e2e8f0; display:none; }

  /* Floating Interaction Prompt Pill */

  .slot:hover em { opacity:1; }

  #lockHint { display:none !important; }
  #toast { position:absolute; left:50%; top:calc(92px + env(safe-area-inset-top)); transform:translateX(-50%); padding:5px 14px; font-size:11.5px; opacity:0; transition:opacity .28s; color:#fde68a; border-color:rgba(245,158,11,.35); white-space:nowrap; max-width:min(420px, 84vw); overflow:hidden; text-overflow:ellipsis; border-radius:999px; background:rgba(12,18,32,.78); }
  #toast.show { opacity:1; }

  /* ---------- touch controls ---------- */
  #touch { display:none; }
  body.touch #touch { display:block; }
  body.touch #hint { display:none; }
  #joy { position:fixed; left:calc(20px + env(safe-area-inset-left)); bottom:calc(84px + env(safe-area-inset-bottom)); width:114px; height:114px; border-radius:50%; background:rgba(15,23,42,.45); border:2px solid rgba(255,255,255,.35); pointer-events:auto; touch-action:none; z-index:12; }
  #joy i { position:absolute; left:37px; top:37px; width:40px; height:40px; border-radius:50%; background:rgba(245,158,11,.75); }
  .tbtn { position:fixed; width:50px; height:50px; border-radius:14px; background:rgba(15,23,42,.65); border:1.5px solid rgba(255,255,255,.35); color:#fff; font-size:19px; font-weight:800; display:flex; align-items:center; justify-content:center; pointer-events:auto; z-index:12; touch-action:none; }
  #tJump { right:calc(20px + env(safe-area-inset-right)); bottom:calc(142px + env(safe-area-inset-bottom)); }
  #tDown { right:calc(20px + env(safe-area-inset-right)); bottom:calc(84px + env(safe-area-inset-bottom)); }
  #tFly { right:calc(80px + env(safe-area-inset-right)); bottom:calc(112px + env(safe-area-inset-bottom)); font-size:13px; }
  #tUse { right:calc(80px + env(safe-area-inset-right)); bottom:calc(172px + env(safe-area-inset-bottom)); font-size:18px; border-color:#f59e0b; background:rgba(245,158,11,.28); }

  /* ---------- INTERACTION PORTAL & TOP 20 COMPASS MODAL ---------- */
  #pi-modal-overlay {
    position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(2,6,23,.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  #pi-modal-content {
    width:min(760px, 96vw); max-height:86dvh; overflow-y:auto;
    background:linear-gradient(165deg, #0f172a 0%, #1e293b 100%);
    border:1.5px solid rgba(245,158,11,.45); border-radius:22px;
    padding:20px 22px; color:#f8fafc; box-shadow:0 24px 70px rgba(0,0,0,.75);
  }
  .pi-m-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:12px; }
  .pi-m-badge { display:inline-block; padding:3px 10px; border-radius:999px; background:rgba(56,189,248,.16); border:1px solid rgba(56,189,248,.4); color:#7dd3fc; font-size:11px; font-weight:800; margin-bottom:6px; }
  .pi-m-header h2 { margin:0 0 4px; font-size:clamp(18px,3vw,23px); color:#fde68a; }
  .pi-m-sub { font-size:12.5px; color:#94a3b8; }
  .pi-m-close { width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#e2e8f0; font-size:16px; cursor:pointer; flex-shrink:0; }
  .pi-m-quote { margin:12px 0; padding:10px 14px; border-left:3.5px solid #f59e0b; background:rgba(245,158,11,.08); border-radius:0 10px 10px 0; font-style:italic; font-size:13.5px; color:#fef3c7; }
  .pi-m-section h4 { margin:10px 0 6px; font-size:13.5px; color:#7dd3fc; }

  .pi-exp-box { margin:14px 0; padding:14px; border-radius:14px; background:rgba(2,6,23,.55); border:1px solid rgba(245,158,11,.35); }
  .pi-exp-head { font-weight:800; font-size:13.5px; color:#fbbf24; margin-bottom:6px; }
  .pi-exp-sub { margin:0 0 10px; font-size:12px; color:#cbd5e1; }
  .pi-btn-row { display:flex; gap:8px; flex-wrap:wrap; }
  .pi-act-btn { padding:8px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(30,41,59,.9); color:#f1f5f9; font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; }
  .pi-act-btn:hover, .pi-act-btn.active { border-color:#38bdf8; background:rgba(14,116,144,.45); color:#fff; }
  .pi-act-btn.gold { background:linear-gradient(135deg,#f59e0b,#d97706); border-color:#fbbf24; color:#090d16; font-weight:900; }
  .pi-slider-row { margin-top:10px; display:flex; align-items:center; gap:10px; font-size:12px; color:#cbd5e1; flex-wrap:wrap; }
  .pi-slider-row input { flex:1; accent-color:#f59e0b; min-width:140px; }

  .pi-grid-2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:8px; }
  .pi-cause-card { padding:9px 11px; border-radius:10px; background:rgba(30,41,59,.7); border:1px solid rgba(255,255,255,.1); }
  .pi-cause-card b { display:block; font-size:12.5px; color:#fde68a; margin-bottom:3px; }
  .pi-cause-card span { font-size:11.5px; color:#cbd5e1; line-height:1.45; }

  .pi-m-guardrail { margin-top:12px; padding:9px 12px; border-radius:10px; background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); font-size:12px; color:#a7f3d0; line-height:1.5; }
  .pi-m-meta { margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:#94a3b8; font-family:ui-monospace,monospace; }
  .pi-m-meta code { color:#7dd3fc; }
  .pi-m-footer { margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }

  /* Top 20 Philosophers Grid inside Compass Modal */
  .pi-phil-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(215px, 1fr)); gap:10px; margin-top:8px; }
  .pi-phil-card { padding:11px 12px; border-radius:12px; background:rgba(15,23,42,.75); border:1px solid rgba(255,255,255,.12); display:flex; flex-direction:column; justify-content:space-between; gap:6px; }
  .pi-phil-card.visited { border-color:rgba(245,158,11,.55); background:rgba(245,158,11,.07); }
  .pi-pc-top { display:flex; align-items:center; justify-content:space-between; }
  .pi-pc-num { font-weight:900; font-size:13.5px; color:#fde68a; }

  .pi-phil-card.visited .pi-pc-status { background:rgba(245,158,11,.25); color:#fbbf24; font-weight:800; }
  .pi-pc-dist { font-size:10.5px; color:#7dd3fc; font-weight:700; }
  .pi-pc-portal { font-size:11.5px; color:#cbd5e1; line-height:1.35; }
  .pi-pc-actions { display:flex; gap:6px; margin-top:4px; }
  .pi-pc-actions button { flex:1; padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.18); background:rgba(30,41,59,.9); color:#e2e8f0; font-size:11.5px; font-weight:700; cursor:pointer; }
  .pi-pc-actions button.pri { background:rgba(245,158,11,.22); border-color:#f59e0b; color:#fde68a; }
  .pi-pc-actions button:hover { background:#f59e0b; color:#090d16; }

  /* ================= IMMERSIVE 3D BOTTOM RPG / FACE-TO-FACE DIALOGUE DOCK ================= */
  #pi-rpg-dialogue {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    width:min(820px, 92vw); max-height:36vh; z-index:45; display:none;
    background:linear-gradient(165deg, rgba(11,17,30,.86), rgba(15,23,42,.90));
    border:1px solid rgba(245,158,11,.5); border-radius:16px;
    box-shadow:0 16px 46px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter:blur(12px); color:#f1f5f9;
    overflow:hidden; animation:piDlgSlide .2s cubic-bezier(.16,1,.3,1);
  }
  @keyframes piDlgSlide { from { opacity:0; transform:translate(-50%, 14px); } to { opacity:1; transform:translate(-50%, 0); } }
  .pi-rpg-inner { display:flex; gap:12px; padding:10px 14px; height:100%; max-height:36vh; box-sizing:border-box; }
  .pi-rpg-left {
    width:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:5px;

  .pi-rpg-portrait-wrap {
    width:78px; height:98px; border-radius:8px; overflow:hidden; position:relative;

  .pi-rpg-portrait-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

  .pi-rpg-era { font-size:10px; color:#93c5fd; text-align:center; line-height:1.2; }

  .pi-rpg-right { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; max-height:calc(36vh - 20px); }
  .pi-rpg-head {
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:6px;
  }
  .pi-rpg-stance { font-size:11.5px; color:#cbd5e1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:340px; }
  .pi-rpg-stance b { color:#fbbf24; }
  .pi-rpg-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .pi-rpg-btn {
    padding:4px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.18);

    cursor:pointer; transition:all .15s;
  }
  .pi-rpg-btn:hover { border-color:#38bdf8; background:rgba(14,116,144,.45); color:#fff; }
  .pi-rpg-btn.gold { background:rgba(245,158,11,.2); border-color:rgba(245,158,11,.6); color:#fde68a; }

  .pi-rpg-btn.close { background:rgba(239,68,68,.15); border-color:rgba(239,68,68,.4); color:#fecaca; }
  .pi-rpg-btn.close:hover { background:rgba(239,68,68,.4); color:#fff; }

  .pi-rpg-log {
    flex:1; min-height:76px; overflow-y:auto; padding-right:4px;
    display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth;
  }
  .pi-rpg-log::-webkit-scrollbar { width:5px; }
  .pi-rpg-log::-webkit-scrollbar-thumb { background:rgba(245,158,11,.35); border-radius:999px; }

  .pi-msg { display:flex; flex-direction:column; max-width:92%; }
  .pi-msg.phil { align-self:flex-start; }
  .pi-msg.user { align-self:flex-end; align-items:flex-end; }
  .pi-msg-who { font-size:10.5px; font-weight:800; margin-bottom:2px; color:#94a3b8; }
  .pi-msg.phil .pi-msg-who { color:#fbbf24; }
  .pi-msg.user .pi-msg-who { color:#7dd3fc; }
  .pi-msg-bubble {
    padding:8px 12px; border-radius:12px; font-size:13.5px; line-height:1.62;
    word-break:break-word;
  }
  .pi-msg.phil .pi-msg-bubble {
    background:rgba(30,41,59,.78); border:1px solid rgba(245,158,11,.28);

  .pi-msg.user .pi-msg-bubble {

  .pi-msg-cursor {

  .pi-rpg-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .pi-rpg-chip {

    cursor:pointer; transition:all .14s; white-space:nowrap;
  }
  .pi-rpg-chip:hover { background:#f59e0b; color:#090d16; transform:translateY(-1px); }

  .pi-rpg-input-row { display:flex; gap:8px; align-items:center; }
  #pi-rpg-input {
    flex:1; padding:8px 12px; border-radius:10px;
    border:1px solid rgba(148,163,184,.4); background:rgba(15,23,42,.92);
    color:#f8fafc; font-size:13px; outline:none; transition:border-color .15s;

  #pi-rpg-send {

  @media (max-width:640px) {

</head>

<canvas id="gl" tabindex="0"></canvas>

<div id="loading">
  <span class="badge">MINEST · MY WORLD · SPATIAL EPISTEMOLOGY V2.0</span>
  <h1>PHILOSOPHERS’ ISLAND</h1>

  <div id="bar"><i></i></div>
  <div id="loadMsg">正在开辟思想岛屿…</div>
</div>

<div id="hud">
  <div id="title">
    <div id="title-card" class="panel">
      <b>🏛️ 哲学家小岛</b>
      <span id="modeLabel"></span>
      <div id="coords"></div>
      <button type="button" id="compass-top-btn" onclick="window.__philosophersIsland && window.__philosophersIsland.portals.openCompassModal()">
        <span>🧭</span> <span>罗盘 <span id="pi-journal-count">0/20</span></span>
      </button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="banner" class="mc"><b id="bannerT"></b><span id="bannerS"></span></div>

  <div id="mmWrap" class="panel">
    <canvas id="mm" width="384" height="384" title="点击小地图上的金色标记可瞬间传送至该哲学家住宅"></canvas>
    <div id="timeBox" class="mc"><span id="clock">10:30</span><input id="timeSlider" type="range" min="0" max="24" step="0.05" value="10.5"></div>
  </div>

  <div id="hint" class="panel"></div>
  <div id="lockHint" class="panel mc">点击画面进入第一人称视角 · 按 M 打开 Top 20 哲学家罗盘</div>

  <button type="button" id="pi-portal-prompt" onclick="window.__philosophersIsland && window.__philosophersIsland.interact()">
    <span class="pi-pp-title">✨ [按 E 或点击] 启动思想实验</span>
  </button>

  <div id="hotbar"></div>
  <div id="toast" class="panel mc"></div>
</div>

<div id="touch">
  <div id="joy"><i></i></div>
  <div id="tJump" class="tbtn">⤒</div>
  <div id="tDown" class="tbtn">⤓</div>
  <div id="tFly" class="tbtn">飞</div>
  <div id="tUse" class="tbtn">✨</div>
</div>

<!-- Immersive 3D Bottom RPG Face-to-Face Philosopher Dialogue Dock -->
<div id="pi-rpg-dialogue" role="dialog" aria-label="哲学家面对面对话">
  <div class="pi-rpg-inner">
    <div class="pi-rpg-left">
      <div class="pi-rpg-portrait-wrap">
        <img id="pi-rpg-portrait" src="" alt="哲学家肖像">
      </div>
      <div id="pi-rpg-name" class="pi-rpg-name"></div>
      <div id="pi-rpg-era" class="pi-rpg-era"></div>
    </div>
    <div class="pi-rpg-right">
      <div class="pi-rpg-head">
        <div id="pi-rpg-stance" class="pi-rpg-stance"></div>
        <div class="pi-rpg-actions">
          <button type="button" class="pi-rpg-btn gold" id="pi-rpg-open-wiki">📚 维基百科与馆藏</button>
          <button type="button" class="pi-rpg-btn" id="pi-rpg-open-exp">✨ 思想实验</button>
          <button type="button" class="pi-rpg-btn close" id="pi-rpg-close">✕ 结束对话 (Esc)</button>
        </div>
      </div>
      <div id="pi-rpg-log" class="pi-rpg-log"></div>
      <div id="pi-rpg-chips" class="pi-rpg-chips"></div>
      <div class="pi-rpg-input-row">
        <input id="pi-rpg-input" type="text" placeholder="直接和这位哲学家聊天、追问或辩论…（按 Enter 发送）" autocomplete="off">
        <button type="button" id="pi-rpg-send">发送 ↵</button>
      </div>
    </div>
  </div>
</div>

<!-- InteractionPortal & Top 20 Compass Overlay Modal -->
<div id="pi-modal-overlay">
  <div id="pi-modal-content"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="pi-world/world.js"></script>
<script src="pi-world/wiki.js"></script>
<script src="pi-world/textures.js"></script>
<script src="pi-world/mesher.js"></script>
<script src="pi-world/props.js"></script>
<script src="pi-world/portals.js"></script>
<script src="pi-world/app.js"></script>
</body>
</html>
