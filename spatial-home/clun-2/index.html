<style>
  :root { --ink: #2b2a27; --mute: #77726a; --panel: rgba(255, 253, 249, .86); --line: rgba(60, 50, 40, .14); --accent: #b8553f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#cfe0ee 0%, #e9eef0 46%, #efe9de 100%); color: var(--ink);
    font: 13px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-user-select: none; user-select: none; }
  #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .card { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(40, 30, 20, .08); }
  #title { left: 14px; top: 14px; max-width: 300px; }
  #title h1 { margin: 0; font: 600 17px/1.2 "Iowan Old Style", Georgia, "Songti SC", serif; letter-spacing: .01em; }
  #title p { margin: 3px 0 0; color: var(--mute); font-size: 11.5px; }
  #title .tag { display: inline-block; margin-top: 6px; padding: 1px 7px; border-radius: 9px; background: rgba(184, 85, 63, .12); color: var(--accent); font-size: 10.5px; letter-spacing: .04em; }
  #panel { right: 14px; top: 14px; width: 212px; max-height: calc(100% - 52px); overflow: auto; }
  #panel h2 { margin: 8px 0 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; color: var(--mute); }
  #panel h2:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: rgba(60, 50, 40, .35); } button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #layers { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; } #layers label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #cutrow { display: flex; align-items: center; gap: 8px; } #cut { flex: 1; min-width: 0; accent-color: var(--accent); } #cutVal { width: 52px; text-align: right; color: var(--mute); font-variant-numeric: tabular-nums; }
  #foot { left: 14px; bottom: 12px; padding: 5px 10px; border-radius: 10px; color: var(--mute); font-size: 11px; font-variant-numeric: tabular-nums; }
  #pwrap { position: fixed; inset: 0; background: rgba(40, 34, 28, .32); display: flex; align-items: center; justify-content: center; z-index: 5; } #pwrap[hidden] { display: none; }
  #pbox { background: #fffdf9; border-radius: 16px; width: min(1040px, 94vw); max-height: 86vh; overflow: auto; padding: 16px 18px; -webkit-user-select: text; user-select: text; }
  #pbox h2 { margin: 0 0 4px; font: 600 16px Georgia, "Songti SC", serif; } #pbox h3 { margin: 16px 0 6px; font-size: 13px; } #pbox p { color: var(--mute); margin: 6px 0; }
  #pbox table { border-collapse: collapse; width: 100%; font-size: 12px; } #pbox th, #pbox td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #pbox th { color: var(--mute); font-weight: 600; position: sticky; top: -16px; background: #fffdf9; } #pbox td.est { color: var(--accent); white-space: nowrap; } #pbox code { font: 11.5px ui-monospace, Menlo, monospace; }
  #pclose { float: right; }
  body.noui .card { display: none; }
  body.valley .studio-only { display: none; } body:not(.valley) .valley-only { display: none; }
  /* Duo 预览：画面放进机身框里，框的宽度变化有动画（外屏窄长，内屏接近方形，中间一道折痕） */
  html body.duo-sim { background: #20242a !important; }
  body.duo-screen #panel, body.duo-screen #title, body.duo-screen #foot { display: none; }
  body.clun-entry-mode #panel, body.clun-entry-mode #title, body.clun-entry-mode #foot { display: none; }   /* Minest 开屏：只留画面和进门提示 */   /* 真机 Duo 外屏 / 内屏：只留画面 */
  body.duo-sim #stage { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); height: min(86vh, 900px); border-radius: 28px; overflow: hidden;
    box-shadow: 0 0 0 10px #0d0f12, 0 30px 80px rgba(0,0,0,.5); transition: width .7s cubic-bezier(.65,0,.35,1); }
  body.duo-sim[data-sim="outer"] #stage { width: calc(min(86vh, 900px) * 0.44); }
  body.duo-sim[data-sim="inner"] #stage { width: min(94vw, calc(min(86vh, 900px) * 1.45)); }
  body.duo-sim[data-sim="inner"] #stage::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: linear-gradient(rgba(0,0,0,.05), rgba(0,0,0,.12), rgba(0,0,0,.05)); pointer-events: none; }
  body.duo-sim #stage canvas { position: absolute; }
  body.valley { background: #2f78d8; }
  @media (max-width: 640px) { #panel { top: auto; bottom: 44px; left: 10px; right: 10px; width: auto; max-height: 40vh; } #title { left: 10px; top: 10px; } }

<div id="stage"></div>
<script>
/* 外景首屏：底图（1 MB 多）下载、上色之前先铺一张小预览图，取景和 plate.js 的 frameFor / clampRect 一致（改了那边这里要跟着改）；
   同时提前开始下载底图。底图画出来以后 plate.js 调 __clunPoster.off() 把它淡掉。 */
(function () {
  var q = new URLSearchParams(location.search); if (q.get('scene') !== 'valley') return;
  var pre = document.createElement('link'); pre.rel = 'preload'; pre.as = 'image'; pre.href = 'art/delivery-plate-tree-v2.jpg'; document.head.appendChild(pre);
  document.body.classList.add('valley'); if (q.get('entry') === '1') document.body.classList.add('clun-entry-mode');
  if (q.get('inside') === '1' || q.get('tree') === '1') return;
  var W = 2576, H = 1438, A = W / H, HOUSE = [860, 868], R = document.documentElement;
  var p = document.createElement('div'); p.id = 'plate-poster'; p.setAttribute('aria-hidden', 'true');
  p.style.cssText = 'position:fixed;inset:0;z-index:1;pointer-events:none;background:#9cc3e6 url(art/plate-poster.jpg) no-repeat;transition:opacity .45s ease';
  function kind(w, h) {
    var f = q.get('duo'); if (f === 'outer' || f === 'inner') return f;
    if (R.classList.contains('duo-inner')) return 'inner'; if (R.classList.contains('duo-outer')) return 'outer';
    if (!(navigator.maxTouchPoints > 0)) return 'normal';
    if (Math.min(w, h) >= 600 && Math.max(w, h) / Math.min(w, h) < 1.6) return 'inner';
    return w < h ? 'outer' : 'normal';
  }
  function fit() {
    var vw = window.innerWidth || 1, vh = window.innerHeight || 1, va = vw / vh, k = kind(vw, vh), r;
    if (k === 'outer') { var ho = Math.min(H, Math.max(1100, 640 / va)); r = { cx: HOUSE[0], cy: HOUSE[1] - 30, w: ho * va, h: ho }; }
    else { var fw = va > A ? W : H * va; r = { cx: va > A ? W / 2 : (k === 'inner' ? 520 + fw / 2 : W / 2), cy: H / 2, w: fw, h: fw / va }; }
    var w = Math.min(r.w, W, H * r.w / r.h), h = w * r.h / r.w, x = Math.max(0, Math.min(W - w, r.cx - w / 2)), y = Math.max(0, Math.min(H - h, r.cy - h / 2)), s = vw / w;
    p.style.backgroundSize = (W * s).toFixed(1) + 'px ' + (H * s).toFixed(1) + 'px'; p.style.backgroundPosition = (-x * s).toFixed(1) + 'px ' + (-y * s).toFixed(1) + 'px';
  }
  fit(); window.addEventListener('resize', fit); document.body.appendChild(p);
  window.__clunPoster = { off: function () {
    window.__clunPoster = null; window.removeEventListener('resize', fit); p.style.opacity = '0';
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 520);
  } };
})();
</script>
