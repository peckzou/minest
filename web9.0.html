/* Focusboard 5.5 Enhanced Styling */
.mini-scrubber-pill {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px -4px rgba(0,0,0,0.5), inset 0 1px 1.5px rgba(255,255,255,0.2);
}
.scrubber-dot {
  transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.scrubber-dot:hover {
  transform: scale(1.6);
}
.scrubber-dot.active {
  transform: scale(1.75);
  box-shadow: 0 0 12px currentColor;
}
.sound-wave-anim {
  animation: soundWave 0.7s ease-in-out infinite alternate;
}
@keyframes soundWave {
  0% { height: 4px; opacity: 0.5; }
  100% { height: 14px; opacity: 1; }
}
.column-ribbon {
  writing-mode: vertical-rl;
  text-orientation: mixed;
}
.mastery-star-gold {
  color: #fbbf24;
  filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.6));
}
.perspective-drill {
  perspective: 1200px;
  perspective-origin: 50% 50%;
  transform-style: preserve-3d;
}
.drill-flipper {
  transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1);
  transform-style: preserve-3d !important;
}
.zen-mode-active header {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-100%);
  transition: all 0.4s ease;
}
.zen-mode-active main {
  padding-top: 0 !important;
}
.stats-banner-glass-dark {
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.stats-banner-glass-white {
  background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(245,248,252,0.85) 100%);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 8px 24px rgba(15,23,42,0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

/* ========================================================================= */
/* Web 9.0 Apple Liquid Glass, iOS Notification Center Card Stacks & Styles     */
/* ========================================================================= */
.liquid-glass-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(22px) saturate(190%);
  -webkit-backdrop-filter: blur(22px) saturate(190%);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-top: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: none !important;
  transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
}
body.theme-white {
  color: #0f172a !important;
  background-color: #f1f5f9 !important;
  background-image: 
    radial-gradient(at 12% 15%, rgba(186, 230, 253, 0.6) 0px, transparent 55%),
    radial-gradient(at 88% 12%, rgba(221, 214, 254, 0.5) 0px, transparent 55%),
    radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.7) 0px, transparent 70%),
    radial-gradient(at 82% 85%, rgba(167, 243, 208, 0.45) 0px, transparent 50%),
    radial-gradient(at 18% 85%, rgba(254, 215, 170, 0.4) 0px, transparent 50%),
    linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%) !important;
  background-size: cover !important;
  background-attachment: fixed !important;
}
.theme-white .liquid-glass-card {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.44) 100%) !important;
  backdrop-filter: blur(24px) saturate(190%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(190%) !important;
  border: 1px solid rgba(255, 255, 255, 0.38) !important;
  border-top: 1px solid rgba(255, 255, 255, 0.65) !important;
  box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 1px 3px 0 rgba(15, 23, 42, 0.03), inset 0 1px 1px 0 rgba(255, 255, 255, 0.45) !important;
}
.theme-white .liquid-glass-card:hover {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.58) 100%) !important;
  border-color: rgba(255, 255, 255, 0.55) !important;
  border-top-color: rgba(255, 255, 255, 0.8) !important;
  box-shadow: 0 12px 28px -4px rgba(15, 23, 42, 0.1), 0 3px 8px -2px rgba(15, 23, 42, 0.04), inset 0 1px 1px 0 rgba(255, 255, 255, 0.6) !important;
  transform: translateY(-2px);
}
.liquid-glass-card:hover {
  transform: translateY(-2px);
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.18);
  border-top-color: rgba(255, 255, 255, 0.35);
  box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.25) !important;
}
.liquid-glass-list {
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
  box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.08), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12) !important;
}
.theme-white .liquid-glass-list {
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid rgba(255, 255, 255, 0.32) !important;
  box-shadow: 0 8px 30px -4px rgba(15, 23, 42, 0.05), inset 0 1px 1px 0 rgba(255, 255, 255, 0.45) !important;
}
.pinned-column {
  position: sticky !important;
  left: 0 !important;
  z-index: 30 !important;
  backdrop-filter: blur(36px) saturate(220%) brightness(1.05) !important;
  -webkit-backdrop-filter: blur(36px) saturate(220%) brightness(1.05) !important;
  background-color: rgba(18, 26, 36, 0.72) !important;
  box-shadow: 6px 0 20px -4px rgba(0, 0, 0, 0.10), inset -1px 0 1.5px 0 rgba(255, 255, 255, 0.18) !important;
}
.theme-white .pinned-column {
  backdrop-filter: blur(36px) saturate(220%) brightness(1.03) !important;
  -webkit-backdrop-filter: blur(36px) saturate(220%) brightness(1.03) !important;
  background-color: rgba(255, 255, 255, 0.65) !important;
  border: 1px solid rgba(255, 255, 255, 0.5) !important;
  border-right: 1px solid rgba(255, 255, 255, 0.6) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.7) !important;
  box-shadow: 8px 0 28px -4px rgba(15, 23, 42, 0.04), 0 4px 16px -2px rgba(255, 255, 255, 0.8), inset -1px 0 1px 0 rgba(255, 255, 255, 0.5) !important;
}
.theme-white .liquid-glass-list {
  backdrop-filter: blur(28px) saturate(190%) !important;
  -webkit-backdrop-filter: blur(28px) saturate(190%) !important;
  border: 1px solid rgba(255, 255, 255, 0.25) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
  box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.03), inset 0 1px 1px 0 rgba(255, 255, 255, 0.4) !important;
}
.liquid-glass-panel-white {
  -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
  backdrop-filter: blur(28px) saturate(180%) !important;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.92) 0%, rgba(243, 247, 252, 0.82) 100%) !important;
  border: 1px solid rgba(255, 255, 255, 0.45) !important;
  border-top: 1.5px solid rgba(255, 255, 255, 0.8) !important;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6), 0 24px 60px -12px rgba(30, 45, 65, 0.12) !important;
}
.liquid-glass-flow-white {
  -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
  backdrop-filter: blur(24px) saturate(180%) !important;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.90) 0%, rgba(248, 250, 253, 0.80) 100%) !important;
  border: 1px solid rgba(255, 255, 255, 0.42) !important;
  border-top: 1.5px solid rgba(255, 255, 255, 0.75) !important;
  box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.08), 0 6px 16px -4px rgba(15, 23, 42, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.6) !important;
}
/* Pinned List Overlapping Transition (optical liquid glass refraction, never disappears) */
.occluded-by-pin {
  opacity: 0.95 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  transform: scale(0.99) translateZ(0) !important;
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease !important;
}
/* Card Hover Action Capsule (Slender Capsule Wheel / Dock) */
.card-action-capsule {
  opacity: 0;
  transform: scale(0.92);
  transition: opacity 0.18s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.18s ease;
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
}
.liquid-glass-card:hover .card-action-capsule {
  opacity: 1 !important;

.card-check-trigger-btn {

  opacity: 0;

  background: rgba(255, 255, 255, 0.12);

  background: rgba(16, 185, 129, 0.22) !important;
  transform: translateY(-50%) scale(1.15) !important;
}
/* When completed: permanently visible emerald circle with checkmark */
.card-check-trigger-btn.is-completed {
  opacity: 1 !important;
  pointer-events: auto !important;
  background: #10b981 !important;
  border: 1.5px solid #10b981 !important;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);

.simulate-hover .card-content-flow.has-completed.has-priority-completed,
.liquid-glass-card:hover .subcard-content-flow.has-completed.has-priority-completed,

.kanban-subcard:hover .subcard-content-flow.has-completed.has-priority-completed,
.simulate-hover .subcard-content-flow.has-completed.has-priority-completed {
  padding-left: 48px !important;
}

/* Right Side Action Group in 8.0 position: 3 Traffic Lights [ 🔴 🟡 🟢 ] + Pencil [ ✏️ ] */
.card-action-group {
  position: absolute;
  right: 8px;

  z-index: 25;

  bottom: 10px;
  transform: none;
}

.group:hover .card-action-group,
.kanban-card:hover .card-action-group,
.kanban-subcard:hover .card-action-group,
.simulate-hover .card-action-group {
  opacity: 1 !important;

  padding: 0;
