<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1028">
<title>时代广场 · Times Square</title>
<link rel="icon" href="data:,">
<style>
  :root { --glass: rgba(14,16,30,.62); --line: rgba(255,255,255,.14); --ink: #f4f1ff; --dim: rgba(244,241,255,.68); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1028; color: var(--ink);
    font: 14px/1.35 -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .glass { background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #close { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top) + 10px); left: calc(env(safe-area-inset-left) + 10px);
    border-radius: 999px; padding: 8px 14px; font-weight: 650; }
  #title { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; max-width: 52vw; }
  #title b { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 750; letter-spacing: .02em; white-space: nowrap; }
  #title small { display: block; margin-top: 4px; color: var(--dim); font-size: 11px; text-shadow: 0 1px 2px #000; white-space: nowrap; }
  #sample { display: none; margin: 6px auto 0; padding: 5px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 650;
    background: rgba(255,196,64,.92); color: #231500; box-shadow: 0 2px 10px rgba(0,0,0,.35); white-space: normal; max-width: 300px; }
  #sample.on { display: inline-block; }
  #map { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px);
    border-radius: 14px; padding: 8px; width: 156px; }
  #map canvas { display: block; width: 156px; height: 156px; border-radius: 9px; }
  #map h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 700; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  #map h4 button { background: none; border: 0; padding: 0 2px; color: var(--dim); font-size: 12px; }
  #ents { list-style: none; margin: 6px 0 0; padding: 0; font-size: 11.5px; }
  #ents li { display: flex; align-items: center; gap: 6px; padding: 3px 2px; border-top: 1px solid rgba(255,255,255,.07); }
  #ents li i { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  #ents li span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ents li em { font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ents li b { display: inline-block; width: 12px; text-align: center; transition: transform .2s; }
  #map.min #ents, #map.min canvas { display: none; }
  #map.min { width: auto; }
  #prompt { position: fixed; z-index: 6; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; border-radius: 16px; padding: 12px 14px 12px 16px;
    display: flex; align-items: center; gap: 14px; max-width: min(92vw, 520px); }
  #prompt.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #prompt .t { font-weight: 750; font-size: 15px; }
  #prompt .s { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  #prompt button { flex: none; border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 800; color: #10101a; background: #fff; box-shadow: 0 0 18px currentColor; }
  #toast { position: fixed; z-index: 7; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.96); padding: 12px 18px; border-radius: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; text-align: center; max-width: 80vw; font-weight: 600; }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #run { position: fixed; z-index: 5; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 18px);
    border-radius: 999px; padding: 10px 14px; font-weight: 700; }
  #run.on { background: rgba(255,214,74,.9); color: #1d1500; border-color: transparent; }
  #hint { position: fixed; z-index: 3; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%);
    padding: 8px 14px; border-radius: 12px; font-size: 12.5px; color: var(--dim); transition: opacity 1s; white-space: nowrap; pointer-events: none; }
  #joy { position: fixed; z-index: 3; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: none; pointer-events: none;
    border: 2px solid rgba(255,255,255,.28); background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.02)); }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,255,255,.55); box-shadow: 0 0 16px rgba(255,255,255,.4); }
  #loading { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(ellipse at 50% 70%, #3b2d63, #0b1028 70%); transition: opacity .6s; font-weight: 700; letter-spacing: .04em; }
  #loading small { color: var(--dim); font-weight: 500; }
  #loading.off { opacity: 0; pointer-events: none; }
  #stats { position: fixed; z-index: 8; left: 10px; bottom: 10px; font: 11px/1.3 ui-monospace, Menlo, monospace; color: #9f9; background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 6px; display: none; white-space: pre; pointer-events: none; }
  @media (max-width: 520px) {
    #map { width: 118px; padding: 6px; } #map canvas { width: 118px; height: 118px; }
    #ents { font-size: 10.5px; }
    #title { left: calc(env(safe-area-inset-left) + 10px); top: calc(env(safe-area-inset-top) + 54px); transform: none; text-align: left; max-width: calc(100vw - 168px); }
    #title b { padding: 5px 10px; font-size: 13px; } #title small { display: none; } #sample { font-size: 10.5px; }
  }
  @media (max-height: 460px) { #map canvas { display: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="时代广场 3D 场景 · Times Square 3D scene"></canvas>
<button id="close" class="glass" type="button">⟵ 回到房间</button>
<div id="title"><b class="glass">时代广场 · Times Square</b><small id="sub">Minest 学习大街 · Learning on the big screens</small><div id="sample">示例内容 · 从 Spatial Home 进入可显示你的学习数据</div></div>
<div id="map" class="glass"><h4><span>入口 Entrances</span><button id="mapToggle" type="button" aria-label="收起 / 展开">▾</button></h4><canvas id="mini" width="312" height="312"></canvas><ul id="ents"></ul></div>
<div id="prompt" class="glass"><div><div class="t" id="pt"></div><div class="s" id="ps"></div></div><button id="pgo" type="button">进入</button></div>
<div id="toast" class="glass"></div>
<button id="run" class="glass" type="button">🏃 跑 Run</button>
<div id="hint" class="glass">左边拖动走路 · 右边拖动看 &nbsp;|&nbsp; WASD / 方向键 + 鼠标拖动</div>
<div id="joy"><i></i></div>
<div id="loading">正在点亮时代广场…<small>Lighting up Times Square</small></div>
<div id="stats"></div>
<script src="../vendor/three.min.js"></script>
<script src="../type3d/fold.js"></script>
<script src="world.js"></script>
</body>
</html>
