<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>奇想主题乐园 · Minest Imagineering Theme Park</title>
<style>
  :root { --ink:#fff; --gold:#fbbf24; --pink:#f472b6; --cyan:#38bdf8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1120; touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); user-select:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  .panel { background:rgba(15,23,42,.80); border:1px solid rgba(255,255,255,.18); border-radius:14px; backdrop-filter:blur(10px); }

  #loading { position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 25%, #3b1d6a 0%, #0b1120 85%); transition:opacity .65s; padding:20px; text-align:center; }
  #loading.done { opacity:0; pointer-events:none; }
  #loading .badge { padding:5px 14px; border-radius:999px; background:rgba(244,114,182,.2); border:1px solid rgba(244,114,182,.55); color:#fbcfe8; font-size:12px; font-weight:800; }
  #loading h1 { margin:0; font-size:clamp(26px,5.5vw,50px); background:linear-gradient(135deg,#fde68a,#f472b6,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  #bar { width:min(380px,78vw); height:10px; border-radius:999px; border:1px solid rgba(255,255,255,.22); background:rgba(15,23,42,.8); overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#fbbf24,#f472b6,#38bdf8); transition:width .18s; }
  #loadMsg { font-size:13px; color:#fde68a; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #title { position:absolute; left:12px; top:10px; display:flex; align-items:center; gap:8px; pointer-events:auto; }
  #title-card { padding:6px 10px 6px 12px; display:flex; align-items:center; gap:10px; border-radius:999px; background:rgba(15,23,42,.76); border:1px solid rgba(255,255,255,.18); }
  #title b { font-size:13.5px; color:#fde68a; }
  #guide-top-btn { padding:5px 12px; border-radius:999px; background:linear-gradient(135deg,#f472b6,#a855f7); color:#fff; font-weight:900; font-size:11.5px; border:none; cursor:pointer; }
  #guide-top-btn:hover { filter:brightness(1.1); }

  #crosshair { position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; display:none; opacity:.72; }
  #crosshair:before,#crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.85); }
  #crosshair:before { left:6px; top:1px; width:2px; height:12px; }
  #crosshair:after { top:6px; left:1px; height:2px; width:12px; }

  #mmWrap { position:absolute; right:12px; top:10px; padding:5px; pointer-events:auto; border-radius:12px; background:rgba(15,23,42,.76); border:1px solid rgba(255,255,255,.16); }
  #mm { display:block; width:112px; height:112px; border-radius:8px; border:1px solid rgba(255,255,255,.16); }
  #timeBox { margin-top:4px; font-size:10.5px; display:flex; align-items:center; gap:5px; color:#cbd5e1; }
  #timeBox input { flex:1; accent-color:#f472b6; min-width:0; cursor:pointer; height:3px; }

  #hint { position:absolute; left:12px; bottom:62px; padding:8px 12px; font-size:11.5px; line-height:1.55; color:#e2e8f0; display:none; }
  #hint.show { display:block; }

  #tp-action-prompt {
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:25; display:none; align-items:center; gap:8px;
    padding:9px 20px; border-radius:999px; background:rgba(15,23,42,.90); border:1.5px solid rgba(244,114,182,.9);
    color:#fde68a; font-weight:800; font-size:13px; cursor:pointer; pointer-events:auto; backdrop-filter:blur(10px);
  }

  /* ---------- Active Ride Control Bar ---------- */
  #tp-ride-bar {
    position:fixed; left:50%; bottom:62px; transform:translateX(-50%); z-index:40; display:none; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 14px; border-radius:999px; background:rgba(15,23,42,.92); border:1.5px solid rgba(56,189,248,.85);
    pointer-events:auto; backdrop-filter:blur(12px); box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #tp-ride-title { font-size:13px; font-weight:800; color:#fde68a; margin-right:4px; }

  #hotbar { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:flex; gap:4px; padding:4px 6px;
    background:rgba(15,23,42,.76); border:1px solid rgba(255,255,255,.16); border-radius:999px; pointer-events:auto; backdrop-filter:blur(10px); }
  .slot { position:relative; width:36px; height:36px; background:rgba(51,65,85,.45); border:1px solid rgba(255,255,255,.12);
    border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; transition:all .14s; }
  .slot:hover { background:rgba(71,85,105,.9); transform:translateY(-2px); }
  .slot em { position:absolute; top:-28px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; white-space:nowrap;
    opacity:0; color:#fde68a; background:rgba(15,23,42,.92); padding:3px 8px; border-radius:6px; pointer-events:none; }
  .slot:hover em { opacity:1; }
  .slot.on { border-color:#f472b6; background:rgba(244,114,182,.28); }

  #toast { position:absolute; left:50%; top:56px; transform:translateX(-50%); padding:6px 16px; font-size:12.5px; opacity:0;
    transition:opacity .28s; color:#fde68a; border-radius:999px; background:rgba(15,23,42,.86); border:1px solid rgba(244,114,182,.45); white-space:nowrap; }
  #toast.show { opacity:1; }

  /* ---------- Park Guide Modal ---------- */
  #tp-modal-overlay { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(2,6,23,.74); backdrop-filter:blur(8px); padding:16px; pointer-events:auto; }
  #tp-modal-content { width:min(880px,96vw); max-height:86dvh; overflow-y:auto; background:linear-gradient(165deg,#0f172a,#1e1b4b);
    border:1.5px solid rgba(244,114,182,.48); border-radius:18px; padding:20px; box-shadow:0 18px 56px rgba(0,0,0,.6); }
  .tp-m-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
  .tp-m-head h2 { margin:0; font-size:20px; color:#fde68a; }
  .tp-m-sub { margin:4px 0 0; font-size:12.5px; color:#cbd5e1; }
  .tp-m-close { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:15px; }
  .tp-quick-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tp-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .tp-card { background:rgba(15,23,42,.82); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .tp-card-top { display:flex; justify-content:space-between; align-items:center; font-size:11px; gap:6px; }
  .tp-badge { padding:2px 8px; border-radius:999px; font-weight:800; border:1px solid; }
  .tp-en { color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tp-card-name { font-size:14.5px; font-weight:800; color:#fff; }
  .tp-hl { margin:2px 0 6px; padding-left:16px; font-size:11.5px; color:#cbd5e1; line-height:1.5; }
  .tp-card-btns { display:flex; gap:6px; margin-top:auto; flex-wrap:wrap; }
  .tp-btn { padding:6px 10px; border-radius:8px; background:rgba(51,65,85,.78); border:1px solid rgba(255,255,255,.16); color:#fff; font-size:11.5px; font-weight:700; cursor:pointer; }
  .tp-btn.gold { background:linear-gradient(135deg,#f59e0b,#d97706); color:#090d16; border:none; }
  .tp-btn.pink { background:linear-gradient(135deg,#ec4899,#a855f7); color:#fff; border:none; }
  .tp-btn.cyan { background:linear-gradient(135deg,#0284c7,#38bdf8); color:#090d16; border:none; }

  /* ---------- Cast Member Dialogue Dock ---------- */
  #tp-rpg-dialogue { position:fixed; left:50%; bottom:12px; transform:translateX(-50%) translateY(130%); width:min(720px,94vw);
    z-index:75; background:rgba(15,23,42,.92); border:1.5px solid rgba(244,114,182,.65); border-radius:16px; padding:14px 16px;
    backdrop-filter:blur(12px); transition:transform .24s ease; pointer-events:auto; display:flex; flex-direction:column; gap:8px; }
  #tp-rpg-dialogue.open { transform:translateX(-50%) translateY(0); }
  #tp-rpg-name { font-size:15px; font-weight:800; color:#fde68a; }
  #tp-rpg-sub { font-size:12px; color:#93c5fd; }
  #tp-rpg-text { font-size:13.5px; color:#f8fafc; line-height:1.55; background:rgba(244,114,182,.10); padding:8px 12px; border-radius:8px; }
  #tp-rpg-acts { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">
  <div class="badge">MINEST MY WORLD · 1:1 DISNEYLAND ARCHITECTURAL EDITION</div>
  <h1>奇想迪士尼乐园 · 1:1 全境还原</h1>
  <div id="bar"><i></i></div>
  <div id="loadMsg">正在初始化 1:1 迪士尼乐园 16 大主题分区…</div>
</div>

<div id="hud">
  <div id="title">
    <div id="title-card">
      <b>🎡 奇想主题乐园</b>
      <button id="guide-top-btn">🗺️ 导览与设施</button>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="mmWrap">
    <canvas id="mm" width="112" height="112"></canvas>
    <div id="timeBox">☀️<input id="timeSlider" type="range" min="0" max="24" step="0.1" value="15.2"></div>
  </div>
  <div id="hint" class="panel"><b>WASD</b> 移动 · <b>鼠标</b> 转向 · <b>E</b> 乘坐/互动<br><b>M</b> 导览图 · <b>N</b> 城堡烟花秀 · <b>F</b> 飞行 · <b>T</b> 昼夜 · <b>Esc</b> 离开设施</div>
  <div id="toast"></div>
  <div id="hotbar"></div>
</div>

<button id="tp-action-prompt"><span class="tp-ap-title">🎢 按 E 乘坐游乐设施</span></button>

<div id="tp-ride-bar">
  <span id="tp-ride-title">🎢 正在乘坐</span>
  <button class="tp-btn gold" id="tp-ride-fire" style="display:none">🔫 激光炮射击 (Space)</button>
  <button class="tp-btn cyan" id="tp-ride-hyper" style="display:none">⚡ 超空间跃迁 (H)</button>
  <button class="tp-btn gold" id="tp-ride-toggle">⏸️ 暂停</button>
  <button class="tp-btn cyan" id="tp-ride-cam">📷 第三人称视角</button>
  <button class="tp-btn pink" id="tp-ride-exit">🚪 离开设施</button>
</div>

<div id="tp-rpg-dialogue">
  <div>
    <div id="tp-rpg-name"></div>
    <div id="tp-rpg-sub"></div>
  </div>
  <div id="tp-rpg-text"></div>
  <div id="tp-rpg-acts"></div>
</div>

<div id="tp-modal-overlay"><div id="tp-modal-content"></div></div>
