<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 罗尔斯无知之幕 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .core{padding:4px 10px;font-size:12.5px;color:#2c3e50;background:#e6edf3;border-bottom:1px solid #d5d8de}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
#side .bound{padding:4px 10px 8px;font-size:11.5px;color:#667}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>罗尔斯 · 无知之幕</b>
  <button class="tab on" data-l="1">① 幕后立规</button>
  <button class="tab" data-l="2">② 抽签过一生</button>
  <button class="tab" data-l="3">③ 最大最小 vs 平均</button>
  <button class="tab" data-l="4">④ 差别原则</button>
  <button class="tab" data-l="5">⑤ 应用练习</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div>
  <div class="core"><b>核心问题：</b>如果你不知道自己会成为社会中的哪一个人，你会为这个社会选择什么样的分配规则？</div>
  <div class="bd" id="sBody"></div>
  <div class="bound"><b>适用边界：</b>本模型把“社会基本善”简化为一个收入数字、把制度简化为一根“激励强度”滑杆，产出曲线是教学假设，不是罗尔斯的经济学主张；原初状态是思想实验，不是历史事件。罗尔斯原文受版权保护，仅引短句，多数引自斯坦福哲学百科 Freeman 词条的转引与概述。</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ===== 原文（罗尔斯《正义论》受版权保护：只引短句，经斯坦福哲学百科 Freeman “Original Position” 词条转引；页码按该词条标注：1971 版/修订版） ===== */
const SEP='Freeman，《斯坦福哲学百科》“Original Position”';
const MAP={
1:[["幕布落下：你不知道自己会是谁","（转述·词条概述）原初状态的要点之一：没有人知道自己在社会中的位置、阶级、财富或社会地位。","no one knows their place in society, class position, wealth, or social status",SEP+" §3（概述 TJ）"],
   ["在幕后拖动分配规则","原初状态被设计为一个严格的“平等的位置”。","position of equality","《正义论》TJ 12/11（据 "+SEP+" 转引）"],
   ["按住揭开幕布：落到某个位置","（转述）立约各方对每一种社会位置都必须同样关心，因为他们可能正落在那个位置上。","since they could end up in that same position",SEP+" §4"]],
2:[["按住连续抽签：一生接一生","（转述·词条概述）原初状态中的选择是一次独特且不可撤回的选择，决定了一个人此后的全部前景。","a unique and irrevocable choice",SEP+" §6.2"],
   ["看最坏的那一生","（转述）一旦原则确定，它们将永久适用，没有重新谈判或逃离的机会。","there is no opportunity to renegotiate or escape the situation",SEP+" §6.2"]],
3:[["拖动规则：平均收入的峰值","（转述·词条概述）海萨尼认为，若假定落入每个位置的概率相等，各方会选择平均效用原则。","the parties in the original position would choose the principle of average utility",SEP+" §6.2（述海萨尼 1975）"],
   ["找到最坏者最好的那一点：最大最小","最大最小规则要求：选择那个“最坏结果比其他所有方案的最坏结果都要好”的方案。","choosing the alternative whose worst outcome leaves us better off than the worst outcome of all other alternatives",SEP+" §6.2"],
   ["最大最小并非处处适用","最大最小“一般而言，并不是不确定条件下选择的合适指南”。","is not, in general, a suitable guide for choices under uncertainty","《正义论》TJ 153（据 "+SEP+" 转引）"]],
4:[["拖动激励：最底层随之上升","社会和经济的不平等……必须对社会中最不利者最有利。","they must be to the greatest advantage of the least advantaged members of society","《正义论》TJ 302/266 rev.；《政治自由主义》281（据 "+SEP+" 转引）"],
   ["越过峰值：不平等变红","……应当平等分配，除非对其中任何一种或全部的不平等分配有利于最不利者。","are to be distributed equally unless an unequal distribution of any or all of these goods is to the advantage of the least favored","《正义论》TJ 1971, 302（一般正义观，据 "+SEP+" 转引）"],
   ["把滑杆推回峰值：放弃多余的收益","把人当作目的，就是同意放弃那些不能增进每个人期望的收益。","to agree to forgo those gains that do not contribute to everyone’s expectations","《正义论》TJ 157 rev.（据 "+SEP+" 转引）"]],
5:[["新社会：仇人替你安排位置","（转述）按最大最小来选择，就要像让你的仇人来分配你的社会位置那样去选。","you should choose as if your enemy were to assign your social position",SEP+" §6.2（述 TJ §26）"],
   ["在新曲线上找到正义点并守住","既然每个人的善都得到肯定，所有人都会获得维护这一体制的倾向。","Since everyone’s good is affirmed, all acquire inclinations to uphold the scheme","《正义论》TJ 177/155（据 "+SEP+" 转引）"]]};
const TITLE={1:'① 幕后立规 · 幕布遮住“你”是谁；左右拖动下方滑杆设定分配规则，然后按住画面揭开幕布',2:'② 抽签过一生 · 按住画面连续抽签，看你一次次落到哪里',3:'③ 最大最小 vs 平均 · 拖动规则点，看两条曲线',4:'④ 差别原则 · 拖动激励强度，盯住最底层那根柱子',5:'⑤ 应用练习 · 新社会的产出曲线不同，“仇人”会把你放到最差的位置；拖动找到并守住正义点'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——${r[3]}</div></div></div>`).join('');}
const DONE={};const LIT={};
function hit(l,i){LIT[l+'_'+i]=1;save();const e=$('mr'+l+'_'+i);if(!e||e.classList.contains('on'))return;e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(MAP[l].every((_,k)=>LIT[l+'_'+k])){DONE[l]=1;tabs();save();}}

/* ===== 保存与恢复 ===== */
const KEY='minest_rawls_v1';let MEM=null;
const S={k:0.5,tally:[0,0,0,0,0,0,0,0],lives:0,worst:null,best:null};
function save(){const data=JSON.stringify({S,DONE,LIT});try{localStorage.setItem(KEY,data);}catch(e){MEM=data;}}
function load(){let d=null;try{d=localStorage.getItem(KEY);}catch(e){d=MEM;}if(!d)return;try{const o=JSON.parse(d);Object.assign(S,o.S||{});Object.assign(DONE,o.DONE||{});Object.assign(LIT,o.LIT||{});}catch(e){}}
load();

/* ===== 社会模型：8 个位置；k = 激励/不平等强度 ===== */
const N=8;
let ECON={a:0.6,b:1.2,c:0.9}; // 产出 Y=N(1+b k-c k²)；份额 1 + a k (i-3.5)/3.5
function incomes(k,e){e=e||ECON;const Y=N*(1+e.b*k-e.c*k*k);return Array.from({length:N},(_,i)=>Y/N*(1+e.a*k*(i-3.5)/3.5));}
const minOf=k=>incomes(k)[0],avgOf=k=>incomes(k).reduce((s,v)=>s+v,0)/N;
function argmax(f){let best=0,bv=-1e9;for(let k=0;k<=1.0001;k+=0.005){const v=f(k);if(v>bv){bv=v;best=k;}}return best;}
const PEOPLE=['日工','清洁工','店员','司机','教师','工程师','医生','老板'];
function bars(x0,y0,w,h,inc,opt){opt=opt||{};const bw=w/N*0.7,maxv=opt.maxv||2.4;
  inc.forEach((v,i)=>{const x=x0+i*w/N+(w/N-bw)/2,bh=clamp(v/maxv,0,1)*h;
    ctx.fillStyle=opt.hl===i?'#f3a52b':i===0&&opt.mark0?(opt.red0?'#c0392b':'#2f9e57'):'#7fa7c9';ctx.fillRect(x,y0+h-bh,bw,bh);
    txt(v.toFixed(2),x+bw/2,y0+h-bh-4,'#334',11);
    if(!opt.veil)txt(PEOPLE[i],x+bw/2,y0+h+14,'#556',11);
    // 小人
    ctx.fillStyle=opt.veil?'#999':'#445';ctx.beginPath();ctx.arc(x+bw/2,y0+h+30,6,0,7);ctx.fill();});
  ctx.strokeStyle='#bbb';ctx.beginPath();ctx.moveTo(x0,y0+h);ctx.lineTo(x0+w,y0+h);ctx.stroke();}
function slider(x,y,w,v,label,col){ctx.fillStyle='#d5d8de';ctx.fillRect(x,y-3,w,6);ctx.fillStyle=col||'#3a6f99';ctx.fillRect(x,y-3,w*v,6);
  ctx.beginPath();ctx.arc(x+w*v,y,11,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  txt(label,x+w/2,y+26,'#334',12);txt('平等',x,y+26,'#778',11,'left');txt('高激励 / 高不平等',x+w,y+26,'#778',11,'right');}

/* ===== 输入 ===== */
let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});
const SL=()=>({x:W*0.12,y:H*0.86,w:W*0.76});
function onSlider(x,y){const s=SL();return Math.abs(y-s.y)<30&&x>s.x-20&&x<s.x+s.w+20;}
function setK(x){const s=SL();S.k=clamp((x-s.x)/s.w,0,1);}

/* ===== 第 1 关：幕后立规 ===== */
let A;function init1(){A={drag:false,veil:1,lift:false,you:null,moved:0,lastK:S.k};hit(1,0);}
HD[1]={down(x,y){if(onSlider(x,y)){if(A.veil<0.98){toast('幕布已揭开：规则已定，不能再改。按“重置本关”重来');return;}A.drag=true;setK(x);}else{A.lift=true;if(A.you==null)A.you=Math.floor(Math.random()*N);}},
 move(x,y,d){if(A.drag){setK(x);A.moved+=Math.abs(S.k-A.lastK);A.lastK=S.k;if(A.moved>0.3)hit(1,1);}},
 up(){A.drag=false;A.lift=false;save();}};
function t1(dt){ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);
  const inc=incomes(S.k),x0=W*0.12,w=W*0.76,y0=H*0.12,h=H*0.5;
  if(A.lift)A.veil=Math.max(0,A.veil-dt*0.35);
  bars(x0,y0,w,h,inc,{veil:A.veil>0.5,hl:A.veil<0.5?A.you:null});
  // 幕布
  if(A.veil>0){ctx.save();ctx.globalAlpha=0.92*A.veil;const g=ctx.createLinearGradient(0,0,0,H*0.8);g.addColorStop(0,'#3b2f4f');g.addColorStop(1,'#5a4a72');ctx.fillStyle=g;
    const drop=(1-A.veil)*H*0.8;ctx.fillRect(x0-20,y0+h*0.0-10-drop*0,w+40,(h+50)*A.veil);
    for(let i=0;i<12;i++){ctx.strokeStyle='rgba(255,255,255,.08)';ctx.beginPath();const xx=x0-20+i*(w+40)/12+Math.sin(T+i)*4;ctx.moveTo(xx,y0-10);ctx.lineTo(xx,y0-10+(h+50)*A.veil);ctx.stroke();}
    ctx.restore();txt('无知之幕：你不知道哪一根柱子是你',W/2,y0+h*0.45,`rgba(255,255,255,${A.veil})`,17,'center',true);}
  slider(SL().x,SL().y,SL().w,S.k,`分配规则（激励强度）k = ${S.k.toFixed(2)}`);
  txt(`社会总产出 ${(avgOf(S.k)*N).toFixed(1)}　·　最低 ${inc[0].toFixed(2)}　·　最高 ${inc[7].toFixed(2)}`,W/2,y0-14,'#334',13);
  if(A.veil<=0.01&&A.you!=null){hit(1,2);txt(`你是「${PEOPLE[A.you]}」：收入 ${inc[A.you].toFixed(2)}${A.you===0?'　— 这就是最不利者的处境':''}`,W/2,H*0.72,'#a0620a',16,'center',true);}
  else txt(A.veil>0.98?'先拖动下方滑杆定规则；定好后，在画面上按住揭开幕布':'揭开中……',W/2,H*0.72,'#556',13);}

/* ===== 第 2 关：抽签过一生 ===== */
let B;function init2(){B={hold:false,acc:0,flash:null,ft:0};}
HD[2]={down(x,y){if(onSlider(x,y)){B.slide=true;setK(x);S.tally=[0,0,0,0,0,0,0,0];S.lives=0;S.worst=null;S.best=null;}else B.hold=true;},move(x,y){if(B.slide)setK(x);},up(){B.hold=false;B.slide=false;save();}};
function t2(dt){ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);const inc=incomes(S.k),x0=W*0.12,w=W*0.76,y0=H*0.1,h=H*0.42;
  if(B.hold){B.acc+=dt*(2+Math.min(18,S.lives*0.3));while(B.acc>1){B.acc-=1;const i=Math.floor(Math.random()*N);S.tally[i]++;S.lives++;B.flash=i;B.ft=1;
      const v=inc[i];S.worst=S.worst==null?v:Math.min(S.worst,v);S.best=S.best==null?v:Math.max(S.best,v);}}
  B.ft=Math.max(0,B.ft-dt*3);
  bars(x0,y0,w,h,inc,{hl:B.ft>0?B.flash:null});
  // 计数条
  const ty=y0+h+50,mx=Math.max(1,...S.tally);S.tally.forEach((c,i)=>{const x=x0+i*w/N+w/N*0.15,bw=w/N*0.7;ctx.fillStyle='#c9b8e6';ctx.fillRect(x,ty,bw*(c/mx),12);txt(c,x+bw*(c/mx)+12,ty+11,'#556',11,'left');});
  txt(`已经活过 ${S.lives} 生`,W/2,ty+34,'#334',14,'center',true);
  if(S.lives>0)txt(`最好的一生 ${S.best.toFixed(2)}　·　最坏的一生 ${S.worst.toFixed(2)}`,W/2,ty+54,'#334',13);
  if(S.lives>=20)hit(2,0);
  if(S.lives>=8&&S.tally[0]>0){hit(2,1);txt('你一定会在某一生里成为「日工」。规则一旦定下，就不能重新谈判',W/2,ty+76,'#c0392b',13);}
  slider(SL().x,SL().y+H*0.05,SL().w,S.k,`当前规则 k = ${S.k.toFixed(2)}（拖动会清空记录）`);
  if(S.lives===0)txt('按住画面，连续抽签',W/2,ty+76,'#556',13);}

/* ===== 第 3 关：最大最小 vs 平均 ===== */
let C;function init3(){C={drag:false,visAvg:0,visMin:0};}
HD[3]={down(x,y){if(y>H*0.1&&y<H*0.92){C.drag=true;setK(x);}},move(x,y){if(C.drag)setK(x);},up(){C.drag=false;save();}};
function plot(x0,y0,w,h,f,col,lbl){ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=100;i++){const k=i/100,v=f(k),X=x0+w*k,Y=y0+h-(v/2.0)*h;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();
  const v=f(1);txt(lbl,x0+w+6,y0+h-(v/2.0)*h+4,col,12,'left',true);}
function t3(dt){ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);const x0=W*0.1,w=W*0.72,y0=H*0.08,h=H*0.7;
  ctx.strokeStyle='#ccc';ctx.lineWidth=1;for(let i=0;i<=4;i++){const Y=y0+h*i/4;ctx.beginPath();ctx.moveTo(x0,Y);ctx.lineTo(x0+w,Y);ctx.stroke();txt((2-i*0.5).toFixed(1),x0-8,Y+4,'#999',11,'right');}
  plot(x0,y0,w,h,avgOf,'#3a6f99','平均收入');plot(x0,y0,w,h,minOf,'#c0392b','最不利者');
  const kA=argmax(avgOf),kM=argmax(minOf);
  // 当前 k
  const X=x0+w*S.k;ctx.strokeStyle='#f3a52b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X,y0);ctx.lineTo(X,y0+h);ctx.stroke();
  [[avgOf,'#3a6f99'],[minOf,'#c0392b']].forEach(([f,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(X,y0+h-(f(S.k)/2)*h,7,0,7);ctx.fill();});
  txt(`k = ${S.k.toFixed(2)}　平均 ${avgOf(S.k).toFixed(2)}　最不利者 ${minOf(S.k).toFixed(2)}`,x0+w/2,y0+h+24,'#334',13,'center',true);
  if(Math.abs(S.k-kA)<0.02){C.visAvg=1;hit(3,0);txt('平均收入的峰值（等概率押注者会选这里）',X,y0+14,'#3a6f99',12);}
  if(Math.abs(S.k-kM)<0.02){C.visMin=1;hit(3,1);txt('最不利者最好的一点：最大最小',X,y0+30,'#c0392b',12);}
  if(C.visAvg&&C.visMin){hit(3,2);txt(`两点不重合：${kM.toFixed(2)} vs ${kA.toFixed(2)}。罗尔斯认为只有在原初状态这种特殊情形下，最大最小才是合理的`,x0+w/2,y0+h+46,'#556',12);}
  else txt('在图上按住左右拖动，分别找到两条曲线的最高点',x0+w/2,y0+h+46,'#556',12);}

/* ===== 第 4 关：差别原则 ===== */
let D;function init4(){D={drag:false,back:false,over:false};}
HD[4]={down(x,y){if(onSlider(x,y)){D.drag=true;setK(x);}},move(x,y){if(D.drag)setK(x);},up(){D.drag=false;save();}};
function t4(dt){ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);const inc=incomes(S.k),x0=W*0.12,w=W*0.76,y0=H*0.1,h=H*0.5;
  const kM=argmax(minOf),eps=0.015;const rising=S.k<kM-eps,over=S.k>kM+eps;
  bars(x0,y0,w,h,inc,{mark0:true,red0:over});
  // 平等基线
  const base=minOf(0);const by=y0+h-(base/2.4)*h;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x0,by);ctx.lineTo(x0+w,by);ctx.stroke();ctx.setLineDash([]);txt('完全平等时每人 1.00',x0+w,by-4,'#556',11,'right');
  // 滑杆区段着色
  const s=SL();ctx.fillStyle='rgba(47,158,87,.25)';ctx.fillRect(s.x,s.y-10,s.w*kM,20);ctx.fillStyle='rgba(192,57,43,.18)';ctx.fillRect(s.x+s.w*kM,s.y-10,s.w*(1-kM),20);
  slider(s.x,s.y,s.w,S.k,`激励强度 k = ${S.k.toFixed(2)}`,over?'#c0392b':'#2f9e57');
  if(S.k>0.05&&!over){hit(4,0);txt(`不平等出现了，但最底层从 1.00 升到 ${inc[0].toFixed(2)}：允许`,W/2,y0+h+60,'#2f9e57',14,'center',true);}
  if(over){D.over=true;hit(4,1);txt(`继续加大不平等：总产出还在涨，最底层却降到 ${inc[0].toFixed(2)}：不被允许`,W/2,y0+h+60,'#c0392b',14,'center',true);}
  if(D.over&&Math.abs(S.k-kM)<=eps){hit(4,2);txt('退回峰值：放弃那些不能增进最不利者的收益',W/2,y0+h+60,'#1f5e2f',14,'center',true);}
  if(S.k<=0.05)txt('从平等出发，向右拖动激励强度',W/2,y0+h+60,'#556',13);}

/* ===== 第 5 关：应用练习 ===== */
let E;const E2={a:0.9,b:2.0,c:1.4};
function init5(){E={drag:false,hold:0,enemy:0,kE:0.1};}
HD[5]={down(x,y){if(onSlider(x,y)){E.drag=true;E.kE=clamp((x-SL().x)/SL().w,0,1);E.hold=0;}},move(x,y){if(E.drag){E.kE=clamp((x-SL().x)/SL().w,0,1);E.hold=0;}},up(){E.drag=false;save();}};
function t5(dt){ctx.fillStyle='#eef1f6';ctx.fillRect(0,0,W,H);const inc=incomes(E.kE,E2),x0=W*0.12,w=W*0.76,y0=H*0.1,h=H*0.48;
  E.enemy=lerp(E.enemy,1,dt*0.8);
  bars(x0,y0,w,h,inc,{maxv:3,hl:0});
  // 仇人：一只手把“你”拖到最差位置
  const tx=x0+w/N*0.5,ty=y0+h+30,hx=lerp(W*0.9,tx,E.enemy);ctx.fillStyle='#7a1f2b';ctx.beginPath();ctx.arc(hx,ty-34,10,0,7);ctx.fill();ctx.strokeStyle='#7a1f2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx,ty-24);ctx.lineTo(tx,ty-8);ctx.stroke();
  txt('仇人替你安排位置：永远是最差的那一个',W*0.62,y0+h+60,'#7a1f2b',13);if(E.enemy>0.8)hit(5,0);
  let kM=0,bv=-1;for(let k=0;k<=1;k+=0.005){const v=incomes(k,E2)[0];if(v>bv){bv=v;kM=k;}}
  slider(SL().x,SL().y,SL().w,E.kE,`新社会的规则 k = ${E.kE.toFixed(2)}　·　你的收入 ${inc[0].toFixed(2)}`,'#7a1f2b');
  const near=Math.abs(E.kE-kM)<0.02;if(near&&!E.drag){E.hold+=dt;}
  if(near){ctx.strokeStyle='#2f9e57';ctx.lineWidth=3;ctx.strokeRect(x0+w/N*0.15-4,y0-4,w/N*0.7+8,h+8);
    txt(E.hold<2?`守住 ${(2-E.hold).toFixed(1)} 秒……`:'找到并守住了：这里的最不利者过得最好，每个人都有理由维护这个体制',W/2,y0-8,'#2f9e57',13,'center',true);
    if(E.hold>=2)hit(5,1);}
  else txt('这个社会的激励更有效：正义点不在原来的位置。拖动滑杆重新找',W/2,y0-8,'#556',13);}

/* ===== 调度 ===== */
const INIT={1:init1,2:init2,3:init3,4:init4,5:init5},TICK={1:t1,2:t2,3:t3,4:t4,5:t5};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!DONE[t.dataset.l]);});}
function go(n){L=n;tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);MAP[L].forEach((_,i)=>{if(LIT[L+'_'+i])$('mr'+L+'_'+i).classList.add('on');});INIT[L]();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{if(L===2){S.tally=[0,0,0,0,0,0,0,0];S.lives=0;S.worst=null;S.best=null;}if(L===1)S.k=0.5;if(L===4)S.k=0;INIT[L]();save();toast('已重置本关（已对应的原文保留）');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(1);requestAnimationFrame(loop);
</script>
