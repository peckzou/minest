<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 忒修斯之船 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>忒修斯之船</b>
  <button class="tab on" data-l="1">① 腐朽与替换</button>
  <button class="tab" data-l="2">② 第二艘船</button>
  <button class="tab" data-l="3">③ 河流与人</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div><div class="bd" id="sBody"></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;const done={};
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;

/* ======== 原文 ======== */
const PL='普鲁塔克《忒修斯传》（Dryden 英译）',HB='霍布斯《论物体》第二部分第11章',HW='霍布斯《评怀特〈论世界〉》第12章 §3–4';
const MAP={
1:[["一艘三十桨的船，在港口里慢慢腐朽","忒修斯和雅典青年乘坐返航的那艘船有三十支桨，雅典人一直保存到德米特里乌斯·法勒鲁斯的时代。","The ship wherein Theseus and the youth of Athens returned had thirty oars, and was preserved by the Athenians down even to the time of Demetrius Phalereus",PL],
   ["拖出朽板，拖入新板","因为他们在旧船板朽坏时把它们拆下，换上新的、更结实的木料。","for they took away the old planks as they decayed, putting in new and stronger timber in their place",PL],
   ["你的判断：拖动“同一 ↔ 不同”指针","这艘船于是成了哲学家们讨论生长之物这一逻辑问题的常用例子；一方认为船仍是同一艘，另一方认为不是。","one side holding that the ship remained the same, and the other contending that it was not the same",PL],
   ["始终能航行：形式未被破坏","因为“船”这个词所规定的形式是适于航行，……剩下的总是一艘船，而且是原来那艘，因为原先的船从未被毁坏。","because its form is determined by the word “ship”, namely that it may be suitable for sailing … that ship the same as before, because the ship previously existing was never destroyed",HW],
   ["拆掉太多：船沉了，不再是船","但如果拆掉船的某部分，使它不再适于航行，剩下的就根本不是船了。","But, if some part of the ship is removed so as to make the ship no longer fit to sail, what is left will not be a ship at all",HW]],
2:[["旧板没有丢弃：有人收起来","如果有人把拆下的旧船板按原样保存起来……","if some man had kept the old planks as they were taken out",HB],
   ["按原来的顺序拼起旧板","……后来按同样的顺序把它们拼起来，又造成一艘船……","putting them together afterwards in the same order, and had again made a ship of them",HB],
   ["两艘船并排：都声称是原船","那么这艘无疑也和起初那艘在数目上是同一艘船，于是就会有两艘在数目上同一的船，这是荒谬的。","this without doubt had also been numerically the same ship with that which was at the beginning—and so there would have been two ships numerically the same, which is absurd",HB],
   ["若只认质料：换掉一块就已不同","如果第一批质料有一部分被拆下或加入了别的部分，那艘船就是另一个存在者、另一个物体。","if some part of the first material has been removed or another part has been added, that ship will be another being, or another body",HW],
   ["若完全不认同一：人坐下站起都不同","按照第三种意见，没有什么东西会和原来一样；一个站着的人和他坐着时就不是同一个人。","according to the third opinion, nothing would be the same as it was; so that a man standing would not be the same as he was sitting",HB]],
3:[["河水一直在流走、被替换","河水向前流入大海，又被从泉源流出的、数目上不同的水所替换。","waters move along and pour themselves into the sea, being replaced by waters, different as to number, that are discharged from a spring",HW],
   ["按住筑坝：水流中断","一条河是按它连续的流动来分类的，那是一个不间断的运动。","a single river is classified by the continuity of its flow, which is one unbroken motion",HW],
   ["人从少到老：组织不断替换","由于身体组织不断脱落、获得新的，持存的不是同一质料，因而不是同一物体。","because of the continual casting of [existing] body-tissue and the acquisition of new, it is not the same material [that endures], and hence not the same body",HW],
   ["但流变不间断：始终是同一个人","然而由于质料衰败、更新的流变是不间断的，他始终是同一个人。","yet, because of the unbroken nature of the flux by which matter decays and is replaced, he is always the same man",HW]]};
const TITLE={1:'① 腐朽与替换 · 把发黑的朽板拖出船体，从岸上拖新板补上；随时拖动右侧指针给出你的判断',2:'② 第二艘船 · 旧板被收进仓库；把它们按编号拖到右边船台上',3:'③ 河流与人 · 按住河道筑坝；按住人物让时间流逝'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——${r[3]}</div></div></div>`).join('');}
function hit(l,i){const e=$('mr'+l+'_'+i);if(!e||e.classList.contains('on'))return;e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(MAP[l].every((_,k)=>$('mr'+l+'_'+k).classList.contains('on'))){done[l]=1;tabs();}}
function txt(t,x,y,c,sz,al){ctx.fillStyle=c||'#223';ctx.font=`${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ======== 船模型：30 块板（上 10、中 10、下 10），共享于第 1、2 关 ======== */
const N=30;let S;
function fresh(){S={planks:[],t:0,drag:null,judge:0.5,log:[],sink:0,water:0,store:[],ship2:new Array(N).fill(null),sel:null,replacedCount:0};
  for(let i=0;i<N;i++)S.planks.push({id:i+1,orig:true,rot:0,rate:0.02+Math.random()*0.05,present:true});}
fresh();
function hull(cx,cy,w,h){return{cx,cy,w,h,slot:i=>{const row=Math.floor(i/10),col=i%10;const y=cy-h*0.35+row*h*0.28;const shrink=row*0.06;const x0=cx-w*(0.5-shrink)+col*w*(1-2*shrink)/10;return{x:x0,y,w:w*(1-2*shrink)/10-2,h:h*0.26};}};}
function drawShip(hl,planks,opts={}){const {cx,cy,w,h}=hl;const tilt=opts.tilt||0,sinkY=opts.sinkY||0;
  ctx.save();ctx.translate(cx,cy+sinkY);ctx.rotate(tilt);ctx.translate(-cx,-cy);
  // 桅杆与帆
  ctx.fillStyle='#5a3b1e';ctx.fillRect(cx-3,cy-h*1.9,6,h*1.5);
  ctx.fillStyle=opts.sail||'rgba(245,240,225,.95)';ctx.beginPath();ctx.moveTo(cx+4,cy-h*1.8);ctx.quadraticCurveTo(cx+w*0.32,cy-h*1.2,cx+4,cy-h*0.55);ctx.fill();
  // 桨
  for(let i=0;i<15;i++){const x=cx-w*0.42+i*w*0.06;const sw=Math.sin(T*2+i*0.2)*6*(opts.row?1:0);ctx.strokeStyle='#6b4a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,cy+h*0.35);ctx.lineTo(x-8+sw,cy+h*0.95);ctx.stroke();}
  for(let i=0;i<N;i++){const sl=hl.slot(i);const p=planks[i];
    if(!p){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.setLineDash([3,3]);ctx.strokeRect(sl.x,sl.y,sl.w,sl.h);ctx.setLineDash([]);continue;}
    const rot=p.rot;const base=p.orig?[150,105,60]:[200,160,105];const c=base.map(v=>Math.round(lerp(v,40,rot)));
    ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;ctx.fillRect(sl.x,sl.y,sl.w,sl.h);
    if(rot>0.5){ctx.fillStyle=`rgba(40,60,30,${(rot-0.5)})`;for(let k=0;k<3;k++)ctx.fillRect(sl.x+((p.id*7+k*11)%Math.max(1,sl.w-4)),sl.y+((p.id*3+k*5)%Math.max(1,sl.h-4)),4,3);}
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeRect(sl.x,sl.y,sl.w,sl.h);
    if(opts.ids){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(p.id,sl.x+sl.w/2,sl.y+sl.h/2+3);}}
  ctx.restore();}
function sea(y){const g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'#3e86b8');g.addColorStop(1,'#1d4d78');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,y+Math.sin(x*0.03+T*1.5)*4);ctx.lineTo(W,H);ctx.fill();}
function sky(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

/* ======== 输入 ======== */
let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});

/* ======== 第 1 关 ======== */
function g1(){const hl=hull(W*0.4,H*0.5,Math.min(W*0.55,H*1.3),H*0.3);return{hl,shoreX:W*0.08,shoreY:H*0.85,meterX:W*0.9};}
HD[1]={down(x,y){const g=g1();
  if(Math.abs(x-g.meterX)<40&&y>H*0.12&&y<H*0.72){S.drag={judge:true};return;}
  for(let i=0;i<N;i++){const sl=g.hl.slot(i);if(x>sl.x&&x<sl.x+sl.w&&y>sl.y+S.sink&&y<sl.y+sl.h+S.sink&&S.planks[i]){S.drag={out:i,x,y};return;}}
  if(x<W*0.2&&y>H*0.7){S.drag={newp:true,x,y};}},
 move(x,y){if(!S.drag)return;S.drag.x=x;S.drag.y=y;if(S.drag.judge){S.judge=clamp(1-(y-H*0.12)/(H*0.6),0,1);hit(1,2);}},
 up(){const d=S.drag;S.drag=null;if(!d)return;const g=g1();
  if(d.out!=null){const sl=g.hl.slot(d.out);if(Math.hypot(d.x-(sl.x+sl.w/2),d.y-(sl.y+sl.h/2))>40){const p=S.planks[d.out];S.planks[d.out]=null;S.store.push({...p});hit(1,1);toast(`第 ${p.id} 号${p.orig?'原':'新'}板被拆下${p.orig?'，收进仓库':''}`);}}
  if(d.newp){for(let i=0;i<N;i++){const sl=g.hl.slot(i);if(!S.planks[i]&&Math.hypot(d.x-(sl.x+sl.w/2),d.y-(sl.y+sl.h/2))<50){S.planks[i]={id:i+1,orig:false,rot:0,rate:0.02+Math.random()*0.05,present:true};S.replacedCount++;hit(1,1);
      S.log.push({orig:S.planks.filter(p=>p&&p.orig).length,judge:S.judge});break;}}}}};
function t1(dt){const g=g1();S.t+=dt;
  sky('#9fd0ee','#e6f3fb');sea(H*0.62);
  // 时间：木板慢慢腐朽
  S.planks.forEach(p=>{if(p)p.rot=Math.min(1,p.rot+p.rate*dt);});
  // 漏水与下沉：缺板数 + 严重腐朽数
  const missing=S.planks.filter(p=>!p).length,rotten=S.planks.filter(p=>p&&p.rot>0.92).length;
  const leak=missing*1.0+rotten*0.5;S.water=clamp(S.water+(leak-2.5)*dt*0.02,0,1);
  const sinkTarget=S.water*H*0.35;S.sink=lerp(S.sink,sinkTarget,dt*2);
  if(T>1.5)hit(1,0);
  // 岸
  ctx.fillStyle='#c8b48a';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*0.68);ctx.quadraticCurveTo(W*0.12,H*0.66,W*0.2,H*0.75);ctx.lineTo(W*0.2,H);ctx.fill();
  for(let i=0;i<4;i++){ctx.fillStyle='#d4ad72';ctx.fillRect(W*0.02,H*0.78+i*10,W*0.12,7);}txt('新木料（拖出）',W*0.08,H*0.76,'#5a3b1e',12);
  drawShip(g.hl,S.planks,{sinkY:S.sink,tilt:S.water*0.12,row:S.water<0.3});
  // 水线
  sea(H*0.62+Math.max(0,S.sink*0.15));
  if(S.water>0.75){txt('它不再适于航行：这还是一艘船吗？',W*0.4,H*0.2,'#b00020',16);hit(1,4);}
  else if(S.replacedCount>=3&&S.water<0.2)hit(1,3);
  // 拖动中的板
  if(S.drag&&(S.drag.out!=null||S.drag.newp)&&S.drag.x){const sl=g.hl.slot(0);ctx.fillStyle=S.drag.newp?'#c8a06a':'#6b4a2a';ctx.fillRect(S.drag.x-sl.w/2,S.drag.y-sl.h/2,sl.w,sl.h);}
  // 统计
  const orig=S.planks.filter(p=>p&&p.orig).length;
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(10,10,230,58);txt(`原有船板：${orig} / 30`,20,30,'#5a3b1e',14,'left');txt(`仓库里的旧板：${S.store.filter(p=>p.orig).length}`,20,50,'#5a3b1e',13,'left');
  txt(`船体进水：${Math.round(S.water*100)}%`,20,64,S.water>0.5?'#b00020':'#335',11,'left');
  // 判断指针
  const mx=g.meterX,y0=H*0.12,y1=H*0.72;ctx.fillStyle='#fff';ctx.fillRect(mx-8,y0,16,y1-y0);const gr=ctx.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,'#3a6f99');gr.addColorStop(1,'#c0392b');ctx.fillStyle=gr;ctx.fillRect(mx-6,y0+2,12,y1-y0-4);
  const jy=lerp(y1,y0,S.judge);ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.moveTo(mx-20,jy);ctx.lineTo(mx-8,jy-8);ctx.lineTo(mx-8,jy+8);ctx.fill();
  txt('同一艘',mx,y0-6,'#3a6f99',12);txt('不同的',mx,y1+16,'#c0392b',12);txt('你的判断',mx,y1+32,'#334',11);
  // 判断曲线
  if(S.log.length>1){const gx=W*0.62,gy=H*0.08,gw=W*0.2,gh=H*0.18;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(gx,gy,gw,gh);ctx.strokeStyle='#f3a52b';ctx.lineWidth=2;ctx.beginPath();
    S.log.forEach((p,i)=>{const X=gx+gw*(1-p.orig/30),Y=gy+gh*(1-p.judge);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();txt('替换比例 → 你的判断',gx+gw/2,gy+gh+13,'#334',11);}
  const hintT=S.replacedCount===0?'船板在慢慢变黑。按住一块朽板拖出船外，再从左下角拖新板补进空位':orig===0?'全部换完了。它还是忒修斯的船吗？去下一关看看仓库里的旧板':'';if(hintT)txt(hintT,W*0.42,H*0.97,'#123',13);
  if(orig===0)S.allReplaced=true;}

/* ======== 第 2 关：第二艘船 ======== */
function ensureStore(){ // 若用户未在第 1 关换完，补齐：模拟已全部替换
  if(S.planks.some(p=>p&&p.orig)){S.planks.forEach((p,i)=>{if(p&&p.orig){S.store.push({...p});S.planks[i]={id:i+1,orig:false,rot:0.1,rate:0.02,present:true};}});}
  S.store=S.store.filter(p=>p.orig);const seen=new Set();S.store=S.store.filter(p=>!seen.has(p.id)&&seen.add(p.id));
  S.store.forEach((p,k)=>{p.sx=0.08+(k%10)*0.035;p.sy=0.82+Math.floor(k/10)*0.05;p.rot=Math.min(p.rot,0.85);});S.ship2=new Array(N).fill(null);S.merge=0;}
function g2(){const sz=Math.min(W*0.36,H*0.95);return{h1:hull(W*0.26,H*0.42,sz,H*0.24),h2:hull(W*0.72,H*0.42,sz,H*0.24)};}
HD[2]={down(x,y){for(let k=S.store.length-1;k>=0;k--){const p=S.store[k];if(p.placed)continue;if(Math.hypot(x-W*p.sx,y-H*p.sy)<18){S.sel={p,x,y};hit(2,0);return;}}},
 move(x,y){if(S.sel){S.sel.x=x;S.sel.y=y;}},
 up(){const s=S.sel;S.sel=null;if(!s)return;const g=g2();let best=-1,bd=1e9;for(let i=0;i<N;i++){if(S.ship2[i])continue;const sl=g.h2.slot(i);const d=Math.hypot(s.x-(sl.x+sl.w/2),s.y-(sl.y+sl.h/2));if(d<bd){bd=d;best=i;}}
  if(best>=0&&bd<40){if(best===s.p.id-1){S.ship2[best]=s.p;s.p.placed=true;hit(2,1);const n=S.ship2.filter(Boolean).length;if(n===N){hit(2,2);toast('两艘船都完整了');}}else toast(`第 ${s.p.id} 号板不属于这个位置：要按原来的顺序`);}}};
function t2(dt){const g=g2();sky('#f3d9b0','#fbefdc');
  ctx.fillStyle='#b89a6a';ctx.fillRect(0,H*0.62,W,H*0.38);
  ctx.fillStyle='#8a6b42';ctx.fillRect(W*0.52,H*0.6,W*0.42,8);txt('船台',W*0.72,H*0.7,'#5a3b1e',12);
  ctx.fillStyle='#6b543a';ctx.fillRect(W*0.04,H*0.77,W*0.4,H*0.16);txt('仓库：拆下的旧板',W*0.24,H*0.76,'#5a3b1e',12);
  drawShip(g.h1,S.planks,{});txt('A：在港口里修补的船（全部新板）',W*0.26,H*0.06,'#2c3e50',14);
  drawShip(g.h2,S.ship2,{ids:true,sail:S.ship2.filter(Boolean).length===N?'rgba(245,240,225,.95)':'rgba(0,0,0,0)'});txt('B：用旧板重新拼起的船',W*0.72,H*0.06,'#2c3e50',14);
  S.store.forEach(p=>{if(p.placed)return;const sl=g.h2.slot(p.id-1);let x=W*p.sx,y=H*p.sy;if(S.sel&&S.sel.p===p){x=S.sel.x;y=S.sel.y;}
    const c=[150,105,60].map(v=>Math.round(lerp(v,40,p.rot)));ctx.fillStyle=`rgb(${c})`;ctx.fillRect(x-sl.w/2,y-sl.h/2,sl.w,sl.h);ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(p.id,x,y+3);});
  const n=S.ship2.filter(Boolean).length;
  if(n===N){S.merge=Math.min(1,S.merge+dt*0.5);
    // 两艘船上方同时出现“忒修斯之船”标签，向中间争夺
    const k=S.merge;['A','B'].forEach((s,i)=>{const x=lerp(i?W*0.72:W*0.26,W*0.49,k*0.6);ctx.fillStyle='rgba(243,165,43,.92)';ctx.fillRect(x-70,H*0.12,140,26);txt('忒修斯之船 #1',x,H*0.12+18,'#222',14);});
    if(k>0.9)txt('两艘船在数目上都同一于原船？ 2 = 1？',W/2,H*0.55,'#b00020',17);}
  // 视角按钮：只认质料 / 只认形式 / 都不认
  const bx=W*0.52,by=H*0.9,bw=W*0.15;[['只认质料（板）','mat'],['只认形式与连续','form'],['什么都不认','none']].forEach(([t,k],i)=>{const x=bx+i*(bw+6);ctx.fillStyle=S.view===k?'#f3a52b':'rgba(255,255,255,.9)';ctx.fillRect(x,by,bw,30);txt(t,x+bw/2,by+20,'#222',12);});
  S._vb={bx,by,bw};
  if(S.view){let a='',b='';if(S.view==='mat'){a='✗ 不是原船（换掉了第一块板就已不同）';b='✓ 原船的质料';hit(2,3);}else if(S.view==='form'){a='✓ 从未被毁坏，一直适于航行';b='？ 曾被拆散，不再连续';}else{a='✗ 不同';b='✗ 不同（连坐下站起都不同）';hit(2,4);}
    txt(a,W*0.26,H*0.66,'#123',13);txt(b,W*0.72,H*0.66,'#123',13);}
  txt(n<N?`按住仓库中的旧板，按编号拖到右侧船台（${n}/30）`:'点下方按钮：用不同的同一性标准看这两艘船',W/2,H*0.985,'#123',13);}
const _d2=HD[2].down;HD[2].down=(x,y)=>{if(S._vb&&y>S._vb.by&&y<S._vb.by+30&&x>S._vb.bx){const i=Math.floor((x-S._vb.bx)/(S._vb.bw+6));S.view=['mat','form','none'][i]||S.view;return;}_d2(x,y);};

/* ======== 第 3 关：河流与人 ======== */
let R3;
function init3(){R3={parts:[],dam:0,damHold:false,age:0,ageHold:false,cells:[],gap:0,brokenAt:null};for(let i=0;i<60;i++)R3.cells.push({x:Math.random(),y:Math.random(),gen:0});}
HD[3]={down(x){if(x<W/2)R3.damHold=true;else R3.ageHold=true;},up(){R3.damHold=false;R3.ageHold=false;}};
function t3(dt){sky('#e8f1f6','#f3f6ee');ctx.fillStyle='#bbb';ctx.fillRect(W/2-1,0,2,H);
  txt('河流',14,24,'rgba(0,0,0,.6)',15,'left');txt('人：从少到老',W/2+14,24,'rgba(0,0,0,.6)',15,'left');
  // 河
  const rx0=W*0.05,rx1=W*0.45,ry=H*0.5;ctx.fillStyle='#7aa35a';ctx.fillRect(0,34,W/2-1,H);
  ctx.fillStyle='#3e86b8';ctx.beginPath();ctx.moveTo(rx0,ry-40);ctx.quadraticCurveTo(W*0.25,ry-70,rx1,ry-35);ctx.lineTo(rx1,ry+35);ctx.quadraticCurveTo(W*0.25,ry,rx0,ry+40);ctx.fill();
  ctx.fillStyle='#8a7a66';ctx.beginPath();ctx.arc(rx0,ry,22,0,7);ctx.fill();txt('泉源',rx0,ry+40,'#335',11);txt('→ 大海',rx1-10,ry+56,'#335',11);
  R3.dam=lerp(R3.dam,R3.damHold?1:0,dt*3);
  if(Math.random()<0.9){R3.parts.push({x:0,y:(Math.random()-.5)*50,id:Math.floor(Math.random()*1e6)});}
  const damX=0.55;
  R3.parts.forEach(p=>{const block=R3.dam>0.5&&p.x<damX&&p.x>damX-0.05;if(!block)p.x+=dt*0.18*(1-R3.dam*(p.x<damX?0.95:0));});
  R3.parts=R3.parts.filter(p=>p.x<1);
  R3.parts.forEach(p=>{const X=lerp(rx0,rx1,p.x),Y=ry+p.y*(1-0.3*Math.sin(p.x*3))-25*Math.sin(p.x*3.14);ctx.fillStyle='rgba(220,240,255,.85)';ctx.beginPath();ctx.arc(X,Y,2.5,0,7);ctx.fill();});
  if(R3.dam>0.05){const X=lerp(rx0,rx1,damX);ctx.fillStyle=`rgba(110,80,50,${R3.dam})`;ctx.fillRect(X-6,ry-80,12,140);}
  const downstream=R3.parts.filter(p=>p.x>damX+0.02).length;
  if(T>2)hit(3,0);
  if(R3.dam>0.8&&downstream<5){hit(3,1);txt('下游干涸：流动中断了。它还是同一条河吗？',W*0.25,H*0.12,'#b00020',14);}
  else txt(R3.damHold?'筑坝中……':'没有一滴水是刚才的水。按住左半边筑坝',W*0.25,H*0.12,'#123',13);
  txt(`此刻河里的水滴：${R3.parts.length}（都是新的）`,W*0.25,H*0.9,'#123',12);
  // 人
  if(R3.ageHold)R3.age=Math.min(1,R3.age+dt*0.08);
  R3.cells.forEach(c=>{if(R3.ageHold&&Math.random()<dt*0.9)c.gen++;});
  const cx=W*0.75,base=H*0.85,hgt=lerp(H*0.3,H*0.6,clamp(R3.age*2.5,0,1))*(1-0.08*clamp((R3.age-0.7)/0.3,0,1));
  const bodyCol=`rgb(${Math.round(lerp(240,215,R3.age))},${Math.round(lerp(190,170,R3.age))},${Math.round(lerp(160,150,R3.age))})`;
  ctx.fillStyle=bodyCol;const hr=hgt*0.12;ctx.beginPath();ctx.arc(cx,base-hgt+hr,hr,0,7);ctx.fill();ctx.fillRect(cx-hgt*0.12,base-hgt+hr*2,hgt*0.24,hgt*0.5);ctx.fillRect(cx-hgt*0.12,base-hgt*0.32,hgt*0.09,hgt*0.32);ctx.fillRect(cx+hgt*0.03,base-hgt*0.32,hgt*0.09,hgt*0.32);
  ctx.fillStyle=`rgb(${Math.round(lerp(60,230,R3.age))},${Math.round(lerp(40,230,R3.age))},${Math.round(lerp(30,230,R3.age))})`;ctx.beginPath();ctx.arc(cx,base-hgt+hr*0.8,hr*1.02,Math.PI,0);ctx.fill();
  // 细胞替换：颜色代表“代”
  const orig=R3.cells.filter(c=>c.gen===0).length;
  R3.cells.forEach(c=>{const X=cx-hgt*0.12+c.x*hgt*0.24,Y=base-hgt+hr*2+c.y*hgt*0.5;ctx.fillStyle=c.gen===0?'rgba(160,82,45,.9)':`hsla(${(c.gen*47)%360},60%,55%,.8)`;ctx.beginPath();ctx.arc(X,Y,2.4,0,7);ctx.fill();});
  const yrs=Math.round(lerp(8,80,R3.age));txt(`${yrs} 岁 · 原有组织 ${Math.round(orig/60*100)}%`,cx,base+20,'#123',13);
  if(orig<45)hit(3,2);if(orig===0){hit(3,3);txt('没有一处原来的质料，但他一直是同一个人',cx,H*0.12,'#1f5e2f',14);}
  else txt(R3.ageHold?'时间流逝……':'按住右半边，让时间流逝',cx,H*0.12,'#123',13);}

/* ======== 调度 ======== */
const TICK={1:t1,2:t2,3:t3};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!done[t.dataset.l]);});}
function go(n){L=n;tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);if(L===2)ensureStore();if(L===3)init3();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{if(L===1){fresh();}else if(L===2){fresh();ensureStore();S.view=null;}else init3();toast('已重置');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(1);requestAnimationFrame(loop);
</script>
