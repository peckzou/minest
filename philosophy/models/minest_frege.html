<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 弗雷格意义与指称 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .q{padding:4px 10px;font-size:12.5px;color:#2c3e50;background:#fff7e0;border-bottom:1px solid #eadfb8}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
#side .lim{padding:4px 10px 8px;font-size:11.5px;color:#667}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 36%)}#side{height:36%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>弗雷格 · 意义与指称</b>
  <button class="tab on" data-l="1">① 晨星与暮星</button>
  <button class="tab" data-l="2">② 三条中线</button>
  <button class="tab" data-l="3">③ 望远镜</button>
  <button class="tab" data-l="4">④ 有意义无指称</button>
  <button class="tab" data-l="5">⑤ 应用练习</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div><div class="q"><b>核心问题：</b>“a = a”是废话，“a = b”却可能是一项发现——两个名字指同一个东西，差别在哪里？</div><div class="bd" id="sBody"></div><div class="lim"><b>适用边界：</b>星空、几何图与望远镜是教学类比；弗雷格的“意义”是客观的呈现方式，不是画面里的路径或图像本身。中文为编译，英文据 Max Black 译本（Wikisource）。</div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;
const SAVE='minest_frege_v1';let MEM={};
function load(){try{return JSON.parse(localStorage.getItem(SAVE)||'{}');}catch(e){return MEM;}}
function save(o){MEM=o;try{localStorage.setItem(SAVE,JSON.stringify(o));}catch(e){}}
let ST=load();ST.lit=ST.lit||{};ST.done=ST.done||{};
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=(b?'bold ':'')+(sz||13)+'px sans-serif';ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ======== 原文：Frege, On Sense and Reference, tr. Max Black (1948), Wikisource ======== */
const SRC="弗雷格《论意义与指称》（1892）";
const MAP={
1:[["拖动“晨星 = 晨星”：毫无新意","a = a 与 a = b 显然是认识价值不同的陈述。","a = a and a = b are obviously statements of differing cognitive value","第 1 段"],
   ["按住让日子流逝，日复一日观察","发现每天升起的太阳并非新的，而总是同一个，这是天文学上最富成果的发现之一。","The discovery that the rising sun is not new every morning, but always the same, was one of the most fertile astronomical discoveries.","第 1 段"],
   ["两根线各自顺着清晨、黄昏的路径拉","只有当符号之间的差别对应于被指称者的呈现方式的差别时，才会产生不同。","A difference can arise only if the difference between the signs corresponds to a difference in the mode of presentation of that which is designated.","第 1 段"],
   ["两条路径汇合：同一颗行星","“暮星”的指称与“晨星”相同，但意义不同。","The reference of 'evening star' would be the same as that of 'morning star', but not the sense.","第 2 段"]],
2:[["拖动顶点：两个交点始终重合","于是我们对同一个点有了不同的称谓。","So we have different designations for the same point","第 1 段"],
   ["坚持拖动足够久：这是真知识","因此这一陈述包含了实际的知识。","and hence the statement contains actual knowledge.","第 1 段"]],
3:[["拖动望远镜对准月亮","有人通过望远镜观察月亮。我把月亮本身比作指称。","Somebody observes the Moon through a telescope. I compare the Moon itself to the reference","“望远镜”类比"],
   ["把多位观察者拖到目镜前：物镜像共享","望远镜中的光学像固然是片面的、依赖于观察位置；但它仍是客观的，因为它可以被几位观察者使用。","The optical image in the telescope is indeed one-sided and dependent upon the standpoint of observation; but it is still objective, inasmuch as it can be used by several observers.","“望远镜”类比"],
   ["比较各人的视网膜像：各不相同","但每个人都会有他自己的视网膜像。","But each one would have his own retinal image.","“望远镜”类比"],
   ["把名字“布克法洛斯”拖给三个人","一位画家、一位骑手和一位动物学家，大概会把不同的观念与“布克法洛斯”这个名字联系起来。","A painter, a horseman, and a zoologist will probably connect different ideas with the name 'Bucephalus'.","“观念”一节"]],
4:[["把“离地球最远的天体”拖进探测器","“离地球最远的天体”这几个词有意义，但它们是否也有指称，却非常可疑。","The words 'the celestial body most distant from the Earth' have a sense, but it is very doubtful if they also have a reference.","第 5 段"],
   ["意义格亮起，指称格始终空","把握一个意义，并不能确保有一个指称。","In grasping a sense, one is not certainly assured of a reference.","第 5 段"],
   ["把“奥德修斯”拖进句子：句子仍有意义","“奥德修斯在熟睡中被送上伊萨卡的岸”这个句子显然有意义。","The sentence 'Odysseus was set ashore at Ithaca while sound asleep' obviously has a sense.","“句子的指称”一节"],
   ["按住“追问真假”：从史诗走向真理","正是对真理的追求，驱使我们总是从意义推进到指称。","It is the striving for truth that drives us always to advance from the sense to the reference.","“句子的指称”一节"],
   ["把“暮星”换进“晨星”的位置：信念灯变化","不知道暮星就是晨星的人，可能认为一个思想为真，另一个为假。","Anybody who did not know that the evening star is the morning star might hold the one thought to be true, the other false.","“句子的指称”一节"]],
5:[["同一个人，两个名字：鲁迅 / 周树人","对于一个给定的指称（一个对象），并不只有一个符号属于它。","while to a given reference (an object) there does not belong only a single sign","第 5 段"],
   ["沿各自的线索调查，直到汇合","只要指称保持不变，意义上的这种差异是可以容忍的。","So long as the reference remains the same, such variations of sense may be tolerated","注 2（亚里士多德的例子）"]]};
const TITLE={1:'① 晨星与暮星 · 按住天空让日子流逝；把两根名字线分别沿清晨、黄昏的轨迹拖到行星上',2:'② 三条中线 · 拖动三角形的顶点',3:'③ 望远镜 · 拖动望远镜对准月亮；把观察者拖到目镜前；把名字拖给三个人',4:'④ 有意义无指称 · 把名字拖进下方探测器；按住“追问真假”；替换句中的词',5:'⑤ 应用练习 · 按住两条线索的调查箭头，让它们各自前进'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr${ST.lit[l+'_'+i]?' on':''}" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——${SRC}，${r[3]}（Black 英译）</div></div></div>`).join('');}
function hit(l,i){if(ST.lit[l+'_'+i])return;ST.lit[l+'_'+i]=1;const e=$('mr'+l+'_'+i);if(e){e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});}
  if(MAP[l].every((_,k)=>ST.lit[l+'_'+k])){ST.done[l]=1;tabs();}save(ST);}
let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]&&HD[L].down&&HD[L].down(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]&&HD[L].move&&HD[L].move(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]&&HD[L].up&&HD[L].up();});

/* ================= 第 1 关：晨星与暮星 ================= */
let A;
function init1(){const s=ST.s1||{};A={day:s.day||0,obs:s.obs||[],hold:false,strM:null,strE:null,merged:!!s.merged,drag:null,tautT:0};}
function venus(day){ // 金星：会合周期约 584 天；简化为周期 16 “天”，前半为晨星（东方），后半为暮星（西方）
  const ph=((day%16)+16)%16/16;const morning=ph<0.5;const k=morning?Math.sin(ph*2*Math.PI):Math.sin((ph-0.5)*2*Math.PI);return{morning,elong:k};}
function skyXY(v){const hz=H*0.62;return v.morning?[W*0.2-v.elong*W*0.05,hz-v.elong*H*0.42]:[W*0.8+v.elong*W*0.05,hz-v.elong*H*0.42];}
HD[1]={down(x,y){const lm=[W*0.08,H*0.9],le=[W*0.92,H*0.9];
  if(Math.hypot(x-lm[0],y-lm[1])<34){A.drag='M';return;}if(Math.hypot(x-le[0],y-le[1])<34){A.drag='E';return;}
  if(Math.abs(x-W/2)<W*0.13&&y>H*0.82){A.drag='taut';A.tautT=0;return;}
  A.hold=true;},
 move(x,y){if(A.drag==='M'||A.drag==='E'){A.tip=[x,y];}},
 up(){if(A.drag==='M'||A.drag==='E'){const v=venus(A.day),p=skyXY(v);if(A.tip&&Math.hypot(A.tip[0]-p[0],A.tip[1]-p[1])<36&&v.elong>0.15){
      if(A.drag==='M'&&v.morning){A.strM=1;toast('“晨星”挂在清晨东方的那颗亮星上');}else if(A.drag==='E'&&!v.morning){A.strE=1;toast('“暮星”挂在黄昏西方的那颗亮星上');}
      else toast(A.drag==='M'?'现在是黄昏，看不到“晨星”的那个呈现方式':'现在是清晨，看不到“暮星”的那个呈现方式');
      if(A.strM&&A.strE)hit(1,2);}}
  A.drag=null;A.tip=null;A.hold=false;}};
function t1(dt){if(A.hold){A.day+=dt*2.2;const v=venus(A.day);if(v.elong>0.2){const key=Math.floor(A.day);if(!A.obs.length||A.obs[A.obs.length-1].d!==key)A.obs.push({d:key,m:v.morning});}if(A.day>20)hit(1,1);}
  const v=venus(A.day),ph=(A.day%1);
  const g=ctx.createLinearGradient(0,0,0,H);const dawn=v.morning;g.addColorStop(0,'#0b1430');g.addColorStop(0.75,dawn?'#3a3f72':'#5a3550');g.addColorStop(1,dawn?'#f0a860':'#e07040');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){ctx.fillStyle='rgba(255,255,255,'+(0.3+0.3*Math.sin(T*2+i))+')';ctx.fillRect((i*137%100)/100*W,(i*71%55)/100*H*0.6,2,2);}
  const hz=H*0.62;ctx.fillStyle='#14202b';ctx.fillRect(0,hz,W,H-hz);txt('东 · 清晨',W*0.12,hz+18,'#ffcf90',12);txt('西 · 黄昏',W*0.88,hz+18,'#ffb0a0',12);
  // 行星
  if(v.elong>0.08){const p=skyXY(v);const r=4+v.elong*4;const gg=ctx.createRadialGradient(p[0],p[1],1,p[0],p[1],r*5);gg.addColorStop(0,'rgba(255,250,220,1)');gg.addColorStop(1,'rgba(255,250,220,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(p[0],p[1],r*5,0,7);ctx.fill();}
  // 观测记录：天空中的轨迹点
  A.obs.slice(-60).forEach(o=>{const vv=venus(o.d+0.5);const p=skyXY(vv);ctx.fillStyle=o.m?'rgba(255,200,120,.5)':'rgba(255,150,150,.5)';ctx.beginPath();ctx.arc(p[0],p[1],2,0,7);ctx.fill();});
  // 名字标签与线
  const lm=[W*0.08,H*0.9],le=[W*0.92,H*0.9],p=skyXY(v);
  function label(pt,t,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(pt[0]-34,pt[1]-14,68,28,10);ctx.fill();txt(t,pt[0],pt[1]+5,'#222',14,'center',true);}
  // 已挂上的线：跟随行星（只在对应时段可见）
  const merged=A.merged;
  if(A.strM){ctx.strokeStyle='rgba(255,200,120,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lm[0],lm[1]);if(merged||v.morning&&v.elong>0.08)ctx.quadraticCurveTo(W*0.15,H*0.5,(merged&&!v.morning)?p[0]:(v.morning?p[0]:W*0.2),(v.elong>0.08)?p[1]:hz);else ctx.lineTo(W*0.2,hz);ctx.stroke();}
  if(A.strE){ctx.strokeStyle='rgba(255,150,150,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(le[0],le[1]);if(merged||!v.morning&&v.elong>0.08)ctx.quadraticCurveTo(W*0.85,H*0.5,(merged&&v.morning)?p[0]:(!v.morning?p[0]:W*0.8),(v.elong>0.08)?p[1]:hz);else ctx.lineTo(W*0.8,hz);ctx.stroke();}
  if(A.tip){ctx.strokeStyle='#fff';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(...(A.drag==='M'?lm:le));ctx.lineTo(A.tip[0],A.tip[1]);ctx.stroke();ctx.setLineDash([]);}
  label(lm,'晨星','#ffcf90');label(le,'暮星','#ffb0a0');
  // 轨道插图：观测足够多才显现
  const nm=A.obs.filter(o=>o.m).length,ne=A.obs.filter(o=>!o.m).length,know=clamp(Math.min(nm,ne)/12,0,1);
  if(know>0.05){const ox=W*0.5,oy=H*0.22,R=Math.min(W,H)*0.12;ctx.globalAlpha=know;ctx.strokeStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(ox,oy,R,0,7);ctx.stroke();ctx.fillStyle='#ffd96b';ctx.beginPath();ctx.arc(ox,oy,6,0,7);ctx.fill();
    const a=(A.day%16)/16*6.283;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox+Math.cos(a)*R,oy+Math.sin(a)*R,4,0,7);ctx.fill();ctx.fillStyle='#4aa0e0';ctx.beginPath();ctx.arc(ox,oy+R*1.6,5,0,7);ctx.fill();
    txt('观测拼出的轨道（俯视）',ox,oy-R-8,'#cfe',11);ctx.globalAlpha=1;}
  // 句子板
  const sx=W/2,sy=H*0.9;ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.roundRect(sx-W*0.13,sy-18,W*0.26,36,8);ctx.fill();
  const ident=merged?'晨星 = 暮星':'晨星 = 晨星';txt(ident,sx,sy+5,'#223',15,'center',true);
  if(A.drag==='taut'){A.tautT+=dt;if(A.tautT>0.8){hit(1,0);}}
  // 汇合：两线都挂上 且 轨道已被观测出来
  if(!merged&&A.strM&&A.strE&&know>=1){A.merged=true;hit(1,3);toast('两条呈现方式汇合于同一颗行星：“晨星 = 暮星”是一项发现');}
  if(merged){txt('✦ 一项发现：同一指称，两种意义',sx,sy-28,'#ffe7b5',13,'center',true);}
  else if(A.strM&&A.strE)txt('两根线挂在“两颗”星上……再多观测些日子，看看它们的关系',W/2,H*0.08,'#ffe7b5',13);
  else txt(A.day<1?'按住天空让日子流逝；按住中间句子板感受“晨星 = 晨星”':'把左下“晨星”拖到清晨的亮星上，把右下“暮星”拖到黄昏的亮星上',W/2,H*0.08,'#ffe7b5',13);
  txt('第 '+Math.floor(A.day)+' 天 · '+(v.morning?'清晨':'黄昏'),W*0.5,H*0.13,'rgba(255,255,255,.7)',12);
  ST.s1={day:A.day,obs:A.obs.slice(-80),merged:A.merged};}

/* ================= 第 2 关：三条中线 ================= */
let B;
function init2(){B={v:[[0.25,0.8],[0.75,0.78],[0.5,0.15]],drag:-1,moveT:0};}
HD[2]={down(x,y){B.v.forEach((p,i)=>{if(Math.hypot(x-p[0]*W,y-p[1]*H)<26)B.drag=i;});},move(x,y){if(B.drag>=0){B.v[B.drag]=[clamp(x/W,0.05,0.95),clamp(y/H,0.08,0.95)];}},up(){B.drag=-1;}};
function inter(p1,p2,p3,p4){const d=(p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]);if(Math.abs(d)<1e-9)return p1;const a=p1[0]*p2[1]-p1[1]*p2[0],b=p3[0]*p4[1]-p3[1]*p4[0];return[(a*(p3[0]-p4[0])-(p1[0]-p2[0])*b)/d,(a*(p3[1]-p4[1])-(p1[1]-p2[1])*b)/d];}
function t2(dt){ctx.fillStyle='#f4f1ea';ctx.fillRect(0,0,W,H);const P=B.v.map(p=>[p[0]*W,p[1]*H]);
  if(B.drag>=0){B.moveT+=dt;hit(2,0);if(B.moveT>3)hit(2,1);}
  ctx.fillStyle='rgba(58,111,153,.08)';ctx.beginPath();ctx.moveTo(...P[0]);ctx.lineTo(...P[1]);ctx.lineTo(...P[2]);ctx.closePath();ctx.fill();ctx.strokeStyle='#3a6f99';ctx.lineWidth=2;ctx.stroke();
  const mid=(i,j)=>[(P[i][0]+P[j][0])/2,(P[i][1]+P[j][1])/2];
  const lines=[[P[0],mid(1,2),'#c0392b','a'],[P[1],mid(0,2),'#2f9e57','b'],[P[2],mid(0,1),'#8e44ad','c']];
  lines.forEach(([s,e,c,n])=>{ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...s);ctx.lineTo(...e);ctx.stroke();txt(n,e[0]+8,e[1]+4,c,14,'left',true);});
  const ab=inter(lines[0][0],lines[0][1],lines[1][0],lines[1][1]),bc=inter(lines[1][0],lines[1][1],lines[2][0],lines[2][1]);
  const k=(Math.sin(T*2)+1)/2;
  ctx.strokeStyle='rgba(192,57,43,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ab[0]-6*k,ab[1],9,0,7);ctx.stroke();ctx.strokeStyle='rgba(142,68,173,.8)';ctx.beginPath();ctx.arc(bc[0]+6*k,bc[1],9,0,7);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ab[0],ab[1],3,0,7);ctx.fill();
  txt('“a 与 b 的交点”',ab[0]-80,ab[1]-14,'#c0392b',12);txt('“b 与 c 的交点”',bc[0]+80,bc[1]+22,'#8e44ad',12);
  const d=Math.hypot(ab[0]-bc[0],ab[1]-bc[1]);txt('两个交点的距离：'+d.toFixed(2)+' px',W/2,H*0.06,'#334',14,'center',true);
  P.forEach(p=>{ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.arc(p[0],p[1],10,0,7);ctx.fill();});
  txt(B.moveT<3?'拖动橙色顶点，把三角形变成任意形状':'无论怎么拖：两种称谓，同一个点——这是几何知识，不是同义反复',W/2,H*0.97,'#334',13);}

/* ================= 第 3 关：望远镜 ================= */
let C;
const OBS=[{c:'#e8743b',e:1.0},{c:'#3d7fe0',e:0.8},{c:'#2f9e57',e:1.25}];
function init3(){C={aim:[0.3,0.75],drag:null,aimed:false,obsPos:OBS.map((o,i)=>[0.12+i*0.08,0.88]),at:[false,false,false],word:[0.5,0.9],wordTo:[false,false,false]};}
const MOON=()=>[W*0.82,H*0.18];
HD[3]={down(x,y){if(Math.hypot(x-C.aim[0]*W,y-C.aim[1]*H)<40){C.drag='tel';return;}
  C.obsPos.forEach((p,i)=>{if(Math.hypot(x-p[0]*W,y-p[1]*H)<22)C.drag='o'+i;});
  if(!C.drag&&Math.hypot(x-C.word[0]*W,y-C.word[1]*H)<40)C.drag='w';},
 move(x,y){if(C.drag==='tel')C.aim=[clamp(x/W,0.05,0.6),clamp(y/H,0.3,0.92)];else if(C.drag&&C.drag[0]==='o'){const i=+C.drag[1];C.obsPos[i]=[clamp(x/W,0,1),clamp(y/H,0.2,0.98)];}else if(C.drag==='w')C.word=[x/W,y/H];},
 up(){if(C.drag==='w'){const xs=[0.66,0.78,0.9];xs.forEach((px,i)=>{if(Math.hypot(C.word[0]*W-px*W,C.word[1]*H-H*0.78)<50){C.wordTo[i]=true;}});if(C.wordTo.filter(Boolean).length>=3)hit(3,3);C.word=[0.5,0.9];}
  if(C.drag&&C.drag[0]==='o'){const i=+C.drag[1];const ep=eyepiece();C.at[i]=Math.hypot(C.obsPos[i][0]*W-ep[0],C.obsPos[i][1]*H-ep[1])<60;if(C.at.filter(Boolean).length>=2&&C.aimed)hit(3,1);}
  C.drag=null;}};
function eyepiece(){return[C.aim[0]*W-40,C.aim[1]*H+30];}
function t3(dt){ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);const m=MOON();
  for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect((i*131%100)/100*W,(i*57%60)/100*H,2,2);}
  ctx.fillStyle='#f2efe0';ctx.beginPath();ctx.arc(m[0],m[1],34,0,7);ctx.fill();ctx.fillStyle='rgba(0,0,0,.12)';[[-10,-6,7],[8,10,5],[12,-12,4]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(m[0]+a,m[1]+b,r,0,7);ctx.fill();});
  txt('月亮本身 = 指称',m[0],m[1]+54,'#f2efe0',12);
  const tx=C.aim[0]*W,ty=C.aim[1]*H,ang=Math.atan2(m[1]-ty,m[0]-tx);
  ctx.save();ctx.translate(tx,ty);ctx.rotate(ang);ctx.fillStyle='#7a8796';ctx.fillRect(-50,-10,110,20);ctx.fillStyle='#4a5563';ctx.fillRect(60,-14,12,28);ctx.restore();
  // 是否对准
  const dist=Math.abs(Math.atan2(m[1]-ty,m[0]-tx)-ang);C.aimed=true;if(C.drag==='tel')hit(3,0);
  // 物镜像（共享的“意义”）
  const ix=W*0.4,iy=H*0.12;ctx.strokeStyle='#ffd96b';ctx.lineWidth=2;ctx.strokeRect(ix-50,iy-30,100,60);ctx.save();ctx.beginPath();ctx.rect(ix-50,iy-30,100,60);ctx.clip();
  const off=(C.aim[1]-0.6)*40;ctx.fillStyle='#f2efe0';ctx.beginPath();ctx.arc(ix+off,iy,22,0,Math.PI);ctx.fill();ctx.restore();
  txt('镜筒中的实像 = 意义（片面，但客观、可共享）',ix,iy+46,'#ffd96b',11);
  // 观察者与视网膜像
  const ep=eyepiece();ctx.fillStyle='rgba(255,217,107,.25)';ctx.beginPath();ctx.arc(ep[0],ep[1],50,0,7);ctx.fill();txt('目镜',ep[0],ep[1]+4,'#ffd96b',11);
  let n=0;OBS.forEach((o,i)=>{const p=[C.obsPos[i][0]*W,C.obsPos[i][1]*H];ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(p[0],p[1]-16,9,0,7);ctx.fill();ctx.fillRect(p[0]-7,p[1]-8,14,20);
    if(C.at[i]){n++;const rx=W*0.08+n*0;const bx=W*0.06+i*W*0.1,by=H*0.08;ctx.strokeStyle=o.c;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(bx+30,by+30,28,28,0,0,7);ctx.stroke();
      ctx.save();ctx.translate(bx+30,by+30);ctx.scale(o.e,1/o.e);ctx.rotate(i*0.4+Math.sin(T+i)*0.05);ctx.fillStyle=o.c;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI);ctx.fill();ctx.restore();
      txt('观察者'+(i+1)+'的视网膜像',bx+30,by+72,o.c,10);}});
  if(n>=2&&C.drag==null&&ST.lit['3_1'])hit(3,2);
  // 布克法洛斯
  const xs=[0.66,0.78,0.9],who=['画家','骑手','动物学家'],ideas=['光影与马的轮廓','缰绳、速度、脾气','马科 · 骨骼'];
  xs.forEach((px,i)=>{const x=px*W,y=H*0.78;ctx.fillStyle='#c9d1da';ctx.beginPath();ctx.arc(x,y-14,8,0,7);ctx.fill();ctx.fillRect(x-6,y-6,12,18);txt(who[i],x,y+26,'#cfd6e6',11);
    if(C.wordTo[i]){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(x-48,y-64,96,30,10);ctx.fill();txt(ideas[i],x,y-44,'#334',10);}});
  ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.roundRect(C.word[0]*W-46,C.word[1]*H-14,92,28,10);ctx.fill();txt('布克法洛斯',C.word[0]*W,C.word[1]*H+5,'#222',13,'center',true);
  txt('拖动望远镜；把左下三位观察者拖到目镜前；把“布克法洛斯”拖给右边三个人',W/2,H*0.97,'#cfe',12);}

/* ================= 第 4 关：有意义无指称 ================= */
let D;
const NAMES=[{n:'离地球最远的天体',ref:false,k:'far'},{n:'奥德修斯',ref:null,k:'ody'},{n:'金星',ref:true,k:'venus'}];
function init4(){D={drag:null,probe:null,scan:0,truth:0,truthHold:false,sent:'晨星',dragW:null,swapped:false};}
const SLOT=()=>({x:W*0.5,y:H*0.62});
HD[4]={down(x,y){NAMES.forEach((o,i)=>{const p=[W*(0.15+i*0.17),H*0.12];if(Math.hypot(x-p[0],y-p[1])<60&&Math.abs(y-p[1])<18)D.drag={i,x,y};});
  if(!D.drag&&x>W*0.72&&y<H*0.32&&y>H*0.18){D.dragW={x,y};}
  if(!D.drag&&!D.dragW&&x<W*0.25&&y>H*0.82)D.truthHold=true;},
 move(x,y){if(D.drag){D.drag.x=x;D.drag.y=y;}if(D.dragW){D.dragW.x=x;D.dragW.y=y;}},
 up(){if(D.drag){const s=SLOT();if(Math.hypot(D.drag.x-s.x,D.drag.y-s.y)<90){D.probe=NAMES[D.drag.i];D.scan=0;if(D.probe.k==='ody')hit(4,2);}D.drag=null;}
  if(D.dragW){if(Math.abs(D.dragW.y-H*0.42)<30&&Math.abs(D.dragW.x-W*0.73)<80){D.swapped=!D.swapped;hit(4,4);toast('换成“'+(D.swapped?'暮星':'晨星')+'”：指称没变，不知情者的判断却变了');}D.dragW=null;}
  D.truthHold=false;}};
function t4(dt){ctx.fillStyle='#1c2431';ctx.fillRect(0,0,W,H);
  NAMES.forEach((o,i)=>{const p=D.drag&&D.drag.i===i?[D.drag.x,D.drag.y]:[W*(0.15+i*0.17),H*0.12];ctx.fillStyle='#f3a52b';ctx.beginPath();ctx.roundRect(p[0]-62,p[1]-15,124,30,10);ctx.fill();txt(o.n,p[0],p[1]+5,'#222',13,'center',true);});
  // 探测器
  const s=SLOT();ctx.strokeStyle='#4a9fe0';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.strokeRect(s.x-110,s.y-50,220,60);ctx.setLineDash([]);txt('名字放这里',s.x,s.y-20,'rgba(255,255,255,.4)',12);
  const sx=W*0.2,rx=W*0.8,by=H*0.66;ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(sx-80,by-40,160,70);ctx.fillRect(rx-80,by-40,160,70);
  txt('意义',sx,by-48,'#cfe',13,'center',true);txt('指称',rx,by-48,'#cfe',13,'center',true);
  if(D.probe){D.scan+=dt;const p=D.probe;txt(p.n,s.x,s.y-14,'#ffe7b5',15,'center',true);
    ctx.fillStyle='rgba(125,255,176,.85)';ctx.fillRect(sx-70,by-30,140*clamp(D.scan,0,1),50);txt('✓ 可以理解',sx,by+4,'#123',13,'center',true);
    // 扫描射线
    const k=(T*0.8)%1;ctx.strokeStyle='rgba(74,159,224,.6)';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lerp(s.x,rx,k),lerp(s.y,by,k));ctx.stroke();
    if(D.scan>2){if(p.ref===true){ctx.fillStyle='#ffd96b';ctx.beginPath();ctx.arc(rx,by-5,14,0,7);ctx.fill();txt('找到：金星',rx,by+22,'#ffd96b',12);}
      else if(p.ref===false){txt('搜索中……无法确定',rx,by,'#ff9b9b',13);if(D.scan>3){hit(4,0);hit(4,1);}}
      else{txt(D.truth>0.9?'找不到奥德修斯':'（史诗中：不必追问）',rx,by,D.truth>0.9?'#ff9b9b':'#cfd6e6',13);}}}
  // 追问真假
  if(D.truthHold){D.truth=Math.min(1,D.truth+dt*0.6);if(D.truth>0.9&&D.probe&&D.probe.k==='ody')hit(4,3);}else D.truth=Math.max(0,D.truth-dt*0.3);
  ctx.fillStyle=D.truthHold?'#f3a52b':'rgba(255,255,255,.88)';ctx.fillRect(4,H*0.84,W*0.21,H*0.13);txt('按住：追问真假',W*0.115,H*0.92,'#222',13,'center',true);
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(W*0.27,H*0.86,W*0.2,8);ctx.fillStyle='#f3a52b';ctx.fillRect(W*0.27,H*0.86,W*0.2*D.truth,8);txt(D.truth<0.5?'欣赏史诗':'追求真理',W*0.37,H*0.84,'#cfe',11);
  // 替换句
  const bx=W*0.73,byy=H*0.42;ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(bx-150,byy-20,300,40,8);ctx.fill();
  txt('“'+(D.swapped?'暮星':'晨星')+'是被太阳照亮的天体”',bx,byy+5,'#223',13,'center',true);
  ctx.fillStyle='#ffb0a0';const wx=D.dragW?D.dragW.x:W*0.86,wy=D.dragW?D.dragW.y:H*0.25;ctx.beginPath();ctx.roundRect(wx-40,wy-14,80,28,10);ctx.fill();txt(D.swapped?'晨星':'暮星',wx,wy+5,'#222',13,'center',true);
  const lampOn=!D.swapped;ctx.fillStyle=lampOn?'#7dffb0':'#ff6b6b';ctx.beginPath();ctx.arc(bx+170,byy,10,0,7);ctx.fill();txt('不知情者：'+(lampOn?'真':'不确定/假'),bx+170,byy+26,'#cfe',10);
  txt('把上方名字拖进探测框；把右上“暮星”卡拖进句子里替换',W/2,H*0.985,'#cfe',12);}

/* ================= 第 5 关：应用练习 ================= */
let E;
function init5(){const s=ST.s5||{};E={a:s.a||0,b:s.b||0,hA:false,hB:false,met:!!s.met};}
HD[5]={down(x,y){if(x<W/2)E.hA=true;else E.hB=true;},up(){E.hA=false;E.hB=false;}};
function t5(dt){ctx.fillStyle='#f3ede2';ctx.fillRect(0,0,W,H);
  if(E.hA)E.a=Math.min(1,E.a+dt*0.18);if(E.hB)E.b=Math.min(1,E.b+dt*0.18);
  if(E.a>0.05||E.b>0.05)hit(5,0);
  const L1=[[W*0.1,H*0.2],[W*0.25,H*0.35],[W*0.32,H*0.55],[W*0.45,H*0.62]],L2=[[W*0.9,H*0.2],[W*0.75,H*0.35],[W*0.68,H*0.55],[W*0.55,H*0.62]];
  const clueA=['《狂人日记》署名','《呐喊》作者','北京八道湾寓所','同一个人？'],clueB=['绍兴周家长孙','留学仙台学医','教育部佥事','同一个人？'];
  function path(Lp,k,c,clues){ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(...Lp[0]);Lp.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();
    const n=k*(Lp.length-1);ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(...Lp[0]);for(let i=1;i<=Math.floor(n);i++)ctx.lineTo(...Lp[i]);const f=n-Math.floor(n),i0=Math.floor(n);if(i0<Lp.length-1)ctx.lineTo(lerp(Lp[i0][0],Lp[i0+1][0],f),lerp(Lp[i0][1],Lp[i0+1][1],f));ctx.stroke();
    Lp.forEach((p,i)=>{const on=i<=n;ctx.fillStyle=on?c:'#ccc';ctx.beginPath();ctx.arc(p[0],p[1],7,0,7);ctx.fill();if(on&&i<3)txt(clues[i],p[0],p[1]-14,'#334',12);});}
  path(L1,E.a,'#c0392b',clueA);path(L2,E.b,'#3a6f99',clueB);
  txt('鲁迅',W*0.1,H*0.13,'#c0392b',18,'center',true);txt('周树人',W*0.9,H*0.13,'#3a6f99',18,'center',true);
  if(!E.met&&E.a>=1&&E.b>=1){E.met=true;hit(5,1);toast('两条线索汇合：“鲁迅 = 周树人”是一项发现');}
  const cx=W/2,cy=H*0.7;if(E.met){ctx.fillStyle='#ffd96b';ctx.beginPath();ctx.arc(cx,cy,22,0,7);ctx.fill();txt('同一个人',cx,cy+5,'#5a3b00',13,'center',true);}
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.roundRect(cx-120,H*0.82,240,36,8);ctx.fill();txt(E.met?'鲁迅 = 周树人  ✦ 有认识价值':'鲁迅 = 周树人  ？',cx,H*0.82+23,'#223',15,'center',true);
  txt('按住左半边：沿“鲁迅”的线索调查；按住右半边：沿“周树人”的线索调查',W/2,H*0.97,'#334',12);
  ST.s5={a:E.a,b:E.b,met:E.met};}

/* ======== 调度 ======== */
const INIT={1:init1,2:init2,3:init3,4:init4,5:init5},TICK={1:t1,2:t2,3:t3,4:t4,5:t5};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!ST.done[t.dataset.l]);});}
function go(n){L=n;ST.level=n;save(ST);tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);INIT[L]();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{if(L===1)delete ST.s1;if(L===5)delete ST.s5;save(ST);INIT[L]();toast('已重置（已对应的原文保留）');};
let last=performance.now(),saveT=0;
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);saveT+=dt;if(saveT>2){saveT=0;save(ST);}requestAnimationFrame(loop);}
go(ST.level||1);requestAnimationFrame(loop);
</script>
