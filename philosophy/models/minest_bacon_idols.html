<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 培根四假相 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
#cv{position:fixed;left:0;top:48px;width:100%;height:calc(100% - 48px - 190px);touch-action:none}
#side{position:fixed;left:0;bottom:0;right:0;height:190px;overflow:auto;background:#f1f1f2;border-top:1px solid #444;font-size:13px;line-height:1.5}
#side .tt{background:#3a6f99;color:#fff;padding:5px 10px;font-size:14px;position:sticky;top:0;z-index:1}
#side .q0{padding:4px 10px;font-size:12.5px;color:#2c3e50;background:#fff7e0;border-bottom:1px solid #f0d08a}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
#side .edge{padding:4px 10px 8px;font-size:11.5px;color:#667}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}

.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>

<body>
<div id="tabs">
  <b>培根 · 四假相</b>
  <button class="tab on" data-l="1">① 种族假相</button>

<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div><div class="q0"><b>核心问题：</b>我们看见的“证据”，有多少是心灵自己投上去的？</div><div class="bd" id="sBody"></div><div class="edge"><b>适用边界：</b>透镜、星点与舞台只是教学比喻；培根讲的是心灵的固有倾向与清除它们的归纳方法，并非光学或统计模型。</div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;
const store={get(k,d){try{const v=localStorage.getItem('minest_bacon_'+k);return v==null?d:JSON.parse(v);}catch(e){return (store.m||{})[k]??d;}},set(k,v){try{localStorage.setItem('minest_bacon_'+k,JSON.stringify(v));}catch(e){store.m=store.m||{};store.m[k]=v;}}};
let done=store.get('done',{}),lit=store.get('lit',{});
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ===== 原文：培根《新工具》第一卷（Gutenberg #45988 英译，1902 年 Dewey 编本）；中文编译 ===== */
const NO='《新工具》第一卷 箴言';
const MAP={
1:[["四种假相盘踞心灵","有四种假相困扰人的心灵……第一种叫种族假相，第二种叫洞穴假相，第三种叫市场假相，第四种叫剧场假相。","Four species of idols beset the human mind","XXXIX"],
   ["拖动“种族透镜”：所见皆按人的尺度","人的感官被错误地当作事物的尺度；相反，感官和心灵的一切知觉都是相对于人的，而不是相对于宇宙的。","all the perceptions both of the senses and the mind bear reference to man and not to the universe","XLI"],
   ["凹凸镜：扭曲了物体","人心就像那些凹凸不平的镜子，把自己的性质混入物体，使它们扭曲变形。","the human mind resembles those uneven mirrors which impart their own properties to different objects","XLI"],
   ["按住数还愿牌：只看见应验的","可是那些尽管许了愿却仍然葬身海底的人，他们的画像在哪里呢？","But where are the portraits of those who have perished in spite of their vows?","XLVI"],
   ["拉近“落空”的事例：它们其实更多","受骗的信徒们注意到那些应验的事，却忽略、略过那些落空的，尽管落空的要常见得多。","observe events which are fulfilled, but neglect and pass over their failure, though it be much more common","XLVI"],
   ["一旦立下结论，一切都来佐证","人的理解力一旦采纳了某个命题，就迫使其他一切都来为它提供新的支持与证实。","forces everything else to add fresh support and confirmation","XLVI"],
   ["自动补全：想象出不存在的规则","人的理解力由于其本性，容易设想事物中有比实际更多的秩序与齐一。","easily supposes a greater degree of order and equality in things than it really finds","XLV"]],
2:[["每个人有自己的洞穴","每个人……都有他自己的洞穴，它遮断并败坏了自然之光。","has his own individual den or cavern, which intercepts and corrupts the light of nature","XLII"],
   ["拖动“教育、阅读、所敬之人”滑杆","或者出于他的教育与交往，或者出于他的阅读以及他所尊敬钦佩之人的权威。","from his education and intercourse with others, or from his reading, and the authority acquired by those whom he reverences and admires","XLII"],
   ["两个观察者看同一片天空：各不相同","洞穴假相源于每个人心灵与身体的特殊本性，也源于教育、习惯和偶然。","derive their origin from the peculiar nature of each individual's mind and body, and also from education, habit, and accident","LIII"],
   ["小世界与大世界","赫拉克利特说得好：人们在较小的世界里寻求知识，而不是在较大的或公共的世界里。","men search for knowledge in lesser worlds, and not in the greater or common world","XLII"]],
3:[["给东西贴标签：词语由大众形成","人们借语言交谈，而词语是按一般人的意愿形成的。","men converse by means of language, but words are formed at the will of the generality","XLIII"],
   ["标签反过来改变所见","人们以为自己的理性支配着词语，事实上，词语也反作用于理解力。","men imagine that their reason governs words, while, in fact, words react upon the understanding","LIX"],
   ["“命运”“火元素”：有名无物","它们或者是根本不存在之物的名称……","They are either the names of things which have no existence","LX"],
   ["同一个词罩住不同的东西","或者是实际事物的名称，但混乱、定义不良，并且是草率而不规则地从事物中抽象出来的。","or they are the names of actual objects, but confused, badly defined, and hastily and irregularly abstracted from things","LX"],
   ["争论变成词语之争","学者们庄严的大辩论，常常以关于词语和名称的争论告终。","the great and solemn disputes of learned men often terminate in controversies about words and names","LIX"]],
4:[["舞台上演一出“体系”","我们把迄今接受或想象出的一切哲学体系，都看作许多上演的戏剧，创造出虚构的舞台世界。","as so many plays brought out and performed, creating fictitious and theatrical worlds","XLIV"],
   ["数据被塞进完美圆周","由此产生了一种虚构：一切天体都沿完美的圆周运动。","Hence the fiction, that all celestial bodies move in perfect circles","XLV"],
   ["剧场假相是被灌输的","剧场假相不是天生的……而是由各种理论的虚构和错误的证明规则明白地灌输和培育的。","manifestly instilled and cherished by the fictions of theories and depraved rules of demonstration","LXI"],
   ["换一出戏：同样能自圆其说","还可以编出许多同类的戏来，彼此相合。","numerous other plays of a similar nature can be still composed and made to agree with each other","XLIV"]],
5:[["摘下透镜：真正的归纳","以真正的归纳为基础来形成概念和公理，是抵御并驱除这些假相的唯一适当的办法。","The formation of notions and axioms on the foundation of true induction is the only fitting remedy","XL"],
   ["指出假相，本身就有用","指出它们是很有用处的；假相学说之于解释自然，正如驳斥诡辩之于普通逻辑。","the doctrine of idols bears the same relation to the interpretation of nature as that of the confutation of sophisms does to common logic","XL"],
   ["提防：它们还会再来","这些假相……即使已被接近，在复兴科学时还会再次来困扰我们，除非人们预先得到警告，尽力提防。","unless mankind when forewarned guard themselves with all possible care against them","XXXVIII"]]};
const TITLE={1:'① 种族假相 · 拖动透镜扫过星空；按住还愿墙数“应验”，再把“落空”拉近',2:'② 洞穴假相 · 拖动三根滑杆改变观察者的洞穴，看同一片天空',3:'③ 市场假相 · 把词语标签拖到东西上；按住拉扯同一个词',4:'④ 剧场假相 · 按住让“体系”上演；把数据点拖出舞台的轨道',5:'⑤ 应用练习 · 一则新闻证据：逐个摘下四面透镜，再按住收集全部事例'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr${lit[l+'_'+i]?' on':''}" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——培根${NO} ${r[3]}</div></div></div>`).join('');}
function hit(l,i){const k=l+'_'+i;const e=$('mr'+l+'_'+i);if(lit[k]){return;}lit[k]=1;store.set('lit',lit);if(e){e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});}
  if(MAP[l].every((_,j)=>lit[l+'_'+j])){done[l]=1;store.set('done',done);tabs();}}
let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]?.down?.(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]?.move?.(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]?.up?.();});
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

/* ================= ① 种族假相 ================= */
let A;
function init1(){const r=rng(7);A={stars:[],lens:{x:0.25,y:0.4},drag:false,swept:0,tablets:[],count:0,hold:false,pull:0,pulling:false,pattern:0};
  for(let i=0;i<70;i++)A.stars.push({x:r(),y:r()*0.9+0.05,b:r()});
  const r2=rng(11);for(let i=0;i<40;i++)A.tablets.push({x:0.58+r2()*0.38,y:0.12+r2()*0.75,ok:i<9,seen:false,ph:r2()*6});hit(1,0);}
HD[1]={down(x,y){if(x<W*0.52){A.drag=true;A.lens.x=x/W;A.lens.y=y/H;}else{A.hold=true;}},
 move(x,y,dx,dy,down){if(A.drag){A.lens.x=clamp(x/W,0.04,0.5);A.lens.y=clamp(y/H,0.1,0.9);A.swept+=Math.hypot(dx,dy);if(A.swept>200)hit(1,1);if(A.swept>600)hit(1,2);}
  else if(A.hold&&down){if(dx<-2){A.pulling=true;A.pull=clamp(A.pull-dx/(W*0.3),0,1);if(A.pull>0.6)hit(1,4);}}},
 up(){A.drag=false;A.hold=false;A.pulling=false;}};
function t1(dt){ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W*0.52,H);ctx.fillStyle='#2a2218';ctx.fillRect(W*0.52,0,W*0.48,H);
  txt('夜空',W*0.04,22,'#cfe',13,'left',true);txt('海神庙的还愿墙',W*0.55,22,'#f3e0c0',13,'left',true);
  const lx=W*A.lens.x,ly=H*A.lens.y,lr=Math.min(W,H)*0.16;
  // 星星：透镜外是随机点；透镜内被“扭曲”，连成人形/动物星座，并呈现出过多的秩序
  A.stars.forEach(s=>{const x=W*0.52*s.x,y=H*s.y;const d=Math.hypot(x-lx,y-ly);
    ctx.fillStyle=`rgba(255,255,230,${0.4+0.6*s.b})`;ctx.beginPath();ctx.arc(x,y,1.2+s.b*1.6,0,7);ctx.fill();});
  const inL=A.stars.map(s=>({x:W*0.52*s.x,y:H*s.y})).filter(p=>Math.hypot(p.x-lx,p.y-ly)<lr);
  if(inL.length>2){ctx.save();ctx.beginPath();ctx.arc(lx,ly,lr,0,7);ctx.clip();
    // 凹凸镜扭曲：向中心拉近并对齐成圆
    const pts=inL.map(p=>{const a=Math.atan2(p.y-ly,p.x-lx);const rr=lr*0.55;return{x:lerp(p.x,lx+Math.cos(a)*rr,0.65),y:lerp(p.y,ly+Math.sin(a)*rr,0.65),a};}).sort((a,b)=>a.a-b.a);
    ctx.strokeStyle='rgba(243,165,43,.9)';ctx.lineWidth=2;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
    pts.forEach(p=>{ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();});
    ctx.restore();A.pattern+=dt;if(A.pattern>3)hit(1,6);}
  ctx.strokeStyle='rgba(243,165,43,.9)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(lx,ly,lr,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(243,165,43,.4)';ctx.lineWidth=10;ctx.beginPath();ctx.arc(lx,ly,lr+6,-0.6+Math.sin(T)*0.2,0.6+Math.sin(T)*0.2);ctx.stroke();
  txt('种族透镜（拖动）',lx,ly+lr+18,'#ffd27a',12);
  txt(inL.length>2?'透镜里，散乱的星“排成”了完美的圆：秩序是镜子加上的':'把透镜拖到星空上',W*0.26,H-14,'#cfe',12);
  // 还愿墙：按住时，“应验”的牌子发光变大，落空的人暗下去；向左拉出落空者
  if(A.hold&&!A.pulling){A.count+=dt;if(A.count>1.2)hit(1,3);if(A.count>2.5)hit(1,5);}
  const focus=A.hold?1:0;
  A.tablets.forEach(t=>{const x=W*t.x,y=H*t.y;
    if(t.ok){const s=1+focus*0.5+0.05*Math.sin(T*3+t.ph);ctx.fillStyle=`rgba(243,201,107,${0.7+0.3*focus})`;ctx.fillRect(x-12*s,y-9*s,24*s,18*s);ctx.fillStyle='#5a3b1e';ctx.font=`${9*s}px sans-serif`;ctx.textAlign='center';ctx.fillText('得救',x,y+3*s);}
    else{const vis=Math.max(A.pull,(1-focus)*0.35);const px=lerp(x,x-W*0.04,A.pull);ctx.fillStyle=`rgba(120,140,170,${vis})`;ctx.beginPath();ctx.arc(px,y,7+A.pull*3,0,7);ctx.fill();if(A.pull>0.5){ctx.fillStyle=`rgba(200,220,255,${A.pull})`;ctx.font='9px sans-serif';ctx.fillText('葬身海底',px,y+18);}}});
  const okN=A.tablets.filter(t=>t.ok).length,failN=A.tablets.length-okN;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W*0.55,H-62,W*0.42,50);
  txt(`你“看到”的应验：${okN}${A.hold?'  ★ 神灵真灵！':''}`,W*0.57,H-42,'#ffd27a',13,'left');
  txt(A.pull>0.5?`被忽略的落空：${failN}（多得多）`:'按住墙面计数；按住时向左拖，把暗处的“落空”拉近',W*0.57,H-22,A.pull>0.5?'#9fc3ff':'#cdb98f',12,'left');}

/* ================= ② 洞穴假相 ================= */
let B;
function init2(){B={o1:{edu:0.2,read:0.8,awe:0.3},o2:{edu:0.8,read:0.2,awe:0.9},drag:null,moved:new Set()};}
const SL=[['edu','教育'],['read','阅读'],['awe','所敬之人']];
function sl(i,j){return{x:i?W*0.62:W*0.06,y:H*0.62+j*H*0.1,w:W*0.3};}
HD[2]={down(x,y){for(let i=0;i<2;i++)for(let j=0;j<3;j++){const s=sl(i,j);if(y>s.y-14&&y<s.y+14&&x>s.x-10&&x<s.x+s.w+10){B.drag={i,j};}}},
 move(x){if(B.drag){const s=sl(B.drag.i,B.drag.j);const o=B.drag.i?B.o2:B.o1;o[SL[B.drag.j][0]]=clamp((x-s.x)/s.w,0,1);B.moved.add(B.drag.i+''+B.drag.j);hit(2,1);if(B.moved.size>=3)hit(2,2);}},up(){B.drag=null;}};
function sky(cx,cy,w,h,o,label){const hue=200+o.edu*120,tint=o.read,glow=o.awe;
  ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,w/2,h/2,0,0,7);ctx.clip();
  const g=ctx.createLinearGradient(cx,cy-h/2,cx,cy+h/2);g.addColorStop(0,`hsl(${hue},40%,${20+tint*20}%)`);g.addColorStop(1,'#0b0f18');ctx.fillStyle=g;ctx.fillRect(cx-w/2,cy-h/2,w,h);
  // 同一片天体：一颗彗星
  const kx=cx+w*0.1,ky=cy-h*0.1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(kx,ky,4,0,7);ctx.fill();
  ctx.strokeStyle=`rgba(255,255,255,.6)`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(kx,ky);ctx.lineTo(kx-30,ky+12);ctx.stroke();
  // 解读：所敬之人越高，越看成“预兆”；阅读越多越看成“天体”
  const omen=glow*(1-o.edu),science=o.edu*o.read;
  if(omen>0.3){ctx.fillStyle=`rgba(255,80,80,${omen})`;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('凶兆！',kx,ky-14);}
  if(science>0.3){ctx.strokeStyle=`rgba(120,200,255,${science})`;ctx.beginPath();ctx.ellipse(cx,cy,w*0.3,h*0.18,0.4,0,7);ctx.stroke();ctx.fillStyle=`rgba(160,220,255,${science})`;ctx.font='12px sans-serif';ctx.fillText('轨道',cx-w*0.25,cy+h*0.2);}
  ctx.restore();
  ctx.strokeStyle='#5a4733';ctx.lineWidth=14;ctx.beginPath();ctx.ellipse(cx,cy,w/2+6,h/2+6,0,0,7);ctx.stroke();
  txt(label,cx,cy+h/2+26,'#e8dcc8',13,'center',true);}
function t2(dt){ctx.fillStyle='#2a2016';ctx.fillRect(0,0,W,H);
  txt('同一片天空，两个洞口',W/2,22,'#e8dcc8',14,'center',true);
  sky(W*0.25,H*0.32,W*0.36,H*0.4,B.o1,'观察者甲的洞穴');sky(W*0.75,H*0.32,W*0.36,H*0.4,B.o2,'观察者乙的洞穴');
  if(T>1)hit(2,0);
  for(let i=0;i<2;i++)for(let j=0;j<3;j++){const s=sl(i,j);const o=i?B.o2:B.o1;const v=o[SL[j][0]];
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(s.x,s.y-3,s.w,6);ctx.fillStyle='#f3a52b';ctx.fillRect(s.x,s.y-3,s.w*v,6);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x+s.w*v,s.y,9,0,7);ctx.fill();txt(SL[j][1],s.x-4,s.y+4,'#e8dcc8',12,'right');}
  const d=Math.abs(B.o1.edu-B.o2.edu)+Math.abs(B.o1.read-B.o2.read)+Math.abs(B.o1.awe-B.o2.awe);
  if(d<0.25&&B.moved.size>=2){hit(2,3);txt('洞穴相近，所见才相近；但那仍是“小世界”',W/2,H*0.58,'#9fe0b0',13);}
  else txt('拖动滑杆：同一颗彗星，有人看见凶兆，有人看见轨道',W/2,H*0.58,'#cdb98f',12);}

/* ================= ③ 市场假相 ================= */
let C;
const WORDS=[{w:'湿',c:'#4a9fe0'},{w:'命运',c:'#c79bff'},{w:'火元素',c:'#ff7b3a'}];
const THINGS=[{n:'水',k:'liquid'},{n:'泥',k:'mud'},{n:'火焰',k:'flame'},{n:'雾',k:'mist'},{n:'空处',k:'void'}];
function init3(){C={labels:WORDS.map((w,i)=>({...w,x:0.08,y:0.2+i*0.18,on:null})),drag:null,stretch:0,stretchHold:false,dispute:0,things:THINGS.map((t,i)=>({...t,x:0.38+i*0.12,y:0.55})),applied:[]};}
HD[3]={down(x,y){for(const l of C.labels){if(Math.abs(x-W*l.x)<40&&Math.abs(y-H*l.y)<16){C.drag=l;l.on=null;return;}}
  if(y>H*0.78)C.stretchHold=true;},
 move(x,y,dx){if(C.drag){C.drag.x=x/W;C.drag.y=y/H;}if(C.stretchHold&&Math.abs(dx)>1){C.stretch=clamp(C.stretch+Math.abs(dx)/(W*0.8),0,1);if(C.stretch>0.4)hit(3,3);if(C.stretch>0.8)hit(3,4);}},
 up(){C.stretchHold=false;if(C.drag){const l=C.drag;C.drag=null;const t=C.things.find(t=>Math.hypot(W*t.x-W*l.x,H*t.y-H*l.y)<50);
   if(t){l.on=t.k;l.x=t.x;l.y=t.y-0.12;hit(3,0);C.applied.push(l.w+'→'+t.n);if(C.applied.length>=2)hit(3,1);
     if(l.w==='命运'||(l.w==='火元素'&&t.k==='void'))hit(3,2);if(t.k==='void')toast(`“${l.w}”贴在了一个什么都没有的地方`);}}}};
function drawThing(t,x,y,lab){const k=t.k;
  // 标签反作用于感知：贴上“湿”的东西被画成滴水的；贴“火元素”的空处会凭空出现火苗
  ctx.save();
  if(k==='liquid'){ctx.fillStyle='#4a9fe0';ctx.beginPath();ctx.ellipse(x,y,26,14,0,0,7);ctx.fill();}
  if(k==='mud'){ctx.fillStyle='#7a5a3a';ctx.beginPath();ctx.ellipse(x,y,26,12,0,0,7);ctx.fill();}
  if(k==='flame'){ctx.fillStyle='#ff8b3a';ctx.beginPath();ctx.moveTo(x-12,y+12);ctx.quadraticCurveTo(x,y-30,x+12,y+12);ctx.fill();}
  if(k==='mist'){for(let i=0;i<5;i++){ctx.fillStyle='rgba(220,230,240,.35)';ctx.beginPath();ctx.arc(x-16+i*8,y+Math.sin(T+i)*3,12,0,7);ctx.fill();}}
  if(k==='void'){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.setLineDash([4,4]);ctx.strokeRect(x-22,y-16,44,32);ctx.setLineDash([]);}
  if(lab){if(lab==='湿'){for(let i=0;i<3;i++){const yy=y+14+((T*40+i*12)%30);ctx.fillStyle='rgba(74,159,224,.9)';ctx.beginPath();ctx.arc(x-10+i*10,yy,3,0,7);ctx.fill();}}
    if(lab==='火元素'){const f=1+Math.sin(T*9)*0.2;ctx.fillStyle='rgba(255,120,40,.8)';ctx.beginPath();ctx.moveTo(x-8,y+8);ctx.quadraticCurveTo(x,y-26*f,x+8,y+8);ctx.fill();}
    if(lab==='命运'){ctx.strokeStyle='rgba(199,155,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,30+Math.sin(T*2)*3,0,7);ctx.stroke();}}
  ctx.restore();txt(t.n,x,y+44,'#e8ecf4',12);}
function t3(dt){ctx.fillStyle='#24303d';ctx.fillRect(0,0,W,H);txt('市场：人们用词语交换意见',W/2,22,'#e8ecf4',14,'center',true);
  C.things.forEach(t=>{const lab=C.labels.find(l=>l.on===t.k);drawThing(t,W*t.x,H*t.y,lab&&lab.w);});
  C.labels.forEach(l=>{const x=W*l.x,y=H*l.y;ctx.fillStyle=l.c;ctx.beginPath();ctx.roundRect(x-36,y-14,72,28,14);ctx.fill();txt(l.w,x,y+5,'#fff',14,'center',true);
    if(l.on){ctx.strokeStyle=l.c;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x,y+14);ctx.lineTo(x,y+H*0.08);ctx.stroke();ctx.setLineDash([]);}});
  // 拉伸“湿”：同一个词被扯着去罩住水、泥、雾
  const by=H*0.86;ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,H*0.78,W,H*0.22);
  const k=C.stretch;const x0=W*0.38,x1=lerp(W*0.42,W*0.86,k);ctx.fillStyle='rgba(74,159,224,.35)';ctx.beginPath();ctx.roundRect(x0-20,by-16,x1-x0+40,32,16);ctx.fill();
  txt(`“湿”${k>0.3?' = 水？泥？雾？……':''}`,(x0+x1)/2,by+5,'#cfe8ff',14,'center',true);
  if(k>0.8){C.dispute=Math.min(1,C.dispute+dt*0.5);const a=C.dispute;txt('学者甲：“泥是湿的！” 学者乙：“不，泥是土！”',W/2,H*0.74,`rgba(255,200,200,${a})`,13);}
  txt('把词语标签拖到东西上；按住下方区域左右拖，拉扯“湿”这个词',W/2,H-4,'#9fb0c3',11);}

/* ================= ④ 剧场假相 ================= */
let D;
function init4(){const r=rng(23);D={pts:[],play:0,hold:false,drag:null,pulled:0,plays:0,play2:0};for(let i=0;i<14;i++){const a=i/14*6.28;const ex=1+0.35*Math.cos(a);D.pts.push({a,r:0.75+0.35*Math.cos(a)+0.06*(r()-.5),ox:0,oy:0});}}
const C4=()=>({cx:W*0.42,cy:H*0.48,R:Math.min(W,H)*0.28});
HD[4]={down(x,y){const c=C4();if(x>W*0.78){D.switch=true;return;}
  for(const p of D.pts){const px=c.cx+Math.cos(p.a)*c.R*lerp(p.r,1,D.play)+p.ox,py=c.cy+Math.sin(p.a)*c.R*0.7*lerp(p.r,1,D.play)+p.oy;if(Math.hypot(x-px,y-py)<14&&D.play>0.5){D.drag=p;return;}}
  D.hold=true;},
 move(x,y,dx,dy){if(D.drag){D.drag.ox+=dx;D.drag.oy+=dy;}},
 up(){D.hold=false;if(D.switch){D.switch=false;D.plays++;D.play2=1;if(D.plays>=1)hit(4,3);toast('换一出戏：另一个体系也能把同样的数据摆得天衣无缝');}
  if(D.drag){const p=D.drag;if(Math.hypot(p.ox,p.oy)>40){D.pulled++;hit(4,2);toast('拉出轨道的点被舞台的弹簧拽了回去');}D.drag=null;}}};
function t4(dt){const c=C4();ctx.fillStyle='#1a1020';ctx.fillRect(0,0,W,H);
  // 舞台
  ctx.fillStyle='#5a1a2a';ctx.fillRect(0,0,W*0.06,H);ctx.fillRect(W*0.72,0,W*0.06,H);ctx.fillStyle='#3a2a1a';ctx.fillRect(0,H*0.88,W*0.78,H*0.12);
  for(let i=0;i<6;i++){ctx.fillStyle=`rgba(255,230,160,${0.05+0.03*i})`;ctx.beginPath();ctx.moveTo(W*0.42,0);ctx.lineTo(W*0.18+i*W*0.02,H*0.88);ctx.lineTo(W*0.66-i*W*0.02,H*0.88);ctx.fill();}
  if(D.hold){D.play=Math.min(1,D.play+dt*0.5);if(D.play>0.3)hit(4,0);if(D.play>0.9)hit(4,1);}else D.play=Math.max(0,D.play-dt*0.15);
  D.play2=Math.max(0,D.play2-dt*0.4);
  // 完美圆周（体系）
  if(D.play>0.05){ctx.strokeStyle=`rgba(243,201,107,${D.play})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c.cx,c.cy,c.R,c.R*0.7,0,0,7);ctx.stroke();txt('“天体沿完美圆周运动”',c.cx,c.cy-c.R*0.7-14,`rgba(243,201,107,${D.play})`,14,'center',true);}
  if(D.play2>0.05){ctx.strokeStyle=`rgba(160,220,255,${D.play2})`;ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(c.cx+Math.cos(T+i*2)*c.R*0.5,c.cy+Math.sin(T+i*2)*c.R*0.35,c.R*0.4,0,7);ctx.stroke();}txt('另一出戏：本轮 + 均轮',c.cx,c.cy+c.R*0.7+30,`rgba(160,220,255,${D.play2})`,13);}
  // 数据点：真实是椭圆偏心；上演时被拉到圆上；拖出后被弹簧拉回
  D.pts.forEach(p=>{p.ox*=D.drag===p?1:0.9;p.oy*=D.drag===p?1:0.9;const rr=lerp(p.r,1,D.play);
    const x=c.cx+Math.cos(p.a)*c.R*rr+p.ox,y=c.cy+Math.sin(p.a)*c.R*0.7*rr+p.oy;
    if(D.play>0.2){ctx.strokeStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.moveTo(c.cx+Math.cos(p.a)*c.R*p.r,c.cy+Math.sin(p.a)*c.R*0.7*p.r);ctx.lineTo(x,y);ctx.stroke();}
    ctx.fillStyle=D.drag===p?'#ff8b8b':'#e8ecf4';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();});
  ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(W*0.8,H*0.35,W*0.18,H*0.18);txt('点击：换一出戏',W*0.89,H*0.45,'#3a1a2a',13,'center',true);
  txt(D.play<0.3?'按住舞台：让“体系”上演':'上演中：把一个数据点拖出圆周，再松手',W*0.39,H*0.95,'#f3e0c0',12);}

/* ================= ⑤ 应用练习 ================= */
let E;
function init5(){E={lenses:[{k:'种族',x:0.2,y:0.25,on:true,c:'#f3a52b'},{k:'洞穴',x:0.4,y:0.25,on:true,c:'#8a6a4a'},{k:'市场',x:0.6,y:0.25,on:true,c:'#4a9fe0'},{k:'剧场',x:0.8,y:0.25,on:true,c:'#c0396b'}],drag:null,collect:0,hold:false,cases:[]};
  const r=rng(31);for(let i=0;i<60;i++)E.cases.push({x:0.08+r()*0.84,y:0.5+r()*0.36,pos:r()<0.35,got:false});}
HD[5]={down(x,y){for(const l of E.lenses){if(l.on&&Math.hypot(x-W*l.x,y-H*l.y)<40){E.drag=l;return;}}if(y>H*0.45)E.hold=true;},
 move(x,y){if(E.drag){E.drag.x=x/W;E.drag.y=y/H;}},
 up(){E.hold=false;if(E.drag){const l=E.drag;if(l.y>0.42||l.x<0.02||l.x>0.98||l.y<0.05){l.on=false;toast(`摘下了“${l.k}”透镜`);}else{l.x=[0.2,0.4,0.6,0.8][E.lenses.indexOf(l)];l.y=0.25;}E.drag=null;}
  if(E.lenses.every(l=>!l.on))hit(5,1);}};
function t5(dt){ctx.fillStyle='#eef2f5';ctx.fillRect(0,0,W,H);
  txt('新闻：“喝了这种茶的人都说病好了。”这能证明茶治病吗？',W/2,22,'#223',14,'center',true);
  const anyOn=E.lenses.some(l=>l.on);
  E.lenses.forEach(l=>{if(!l.on)return;const x=W*l.x,y=H*l.y;ctx.strokeStyle=l.c;ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,32,0,7);ctx.stroke();txt(l.k,x,y+5,l.c,14,'center',true);
    const eff={种族:'只记得好转的',洞穴:'我妈就信这个',市场:'“排毒”“调理”',剧场:'整套养生理论'}[l.k];txt(eff,x,y+52,'#556',11);});
  // 证据区：透镜在时，阴性事例几乎看不见；全部摘下并按住收集，才看到全部
  if(E.hold&&!anyOn){E.collect=Math.min(1,E.collect+dt*0.3);if(E.collect>0.6)hit(5,0);if(E.collect>=1)hit(5,2);}
  const hidden=E.lenses.filter(l=>l.on).length/4;
  E.cases.forEach((c,i)=>{const vis=c.pos?1:(1-hidden)*(anyOn?0.4:Math.min(1,E.collect*1.6));const x=W*c.x,y=H*c.y;
    ctx.fillStyle=c.pos?`rgba(46,160,90,${vis})`:`rgba(192,57,43,${vis})`;ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();});
  const pos=E.cases.filter(c=>c.pos).length,neg=E.cases.length-pos;
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(W*0.02,H*0.88,W*0.96,H*0.1);
  txt(anyOn?`戴着 ${E.lenses.filter(l=>l.on).length} 面透镜：你看到 ${pos} 个“好了”的例子`:E.collect<1?`按住证据区，收集全部事例……（${Math.round(E.collect*100)}%）`:`全部事例：好转 ${pos}，没好 ${neg}。还需要对照组。`,W/2,H*0.94,'#223',13,'center',true);
  if(anyOn)txt('把四面透镜一个个拖到画面外摘掉',W/2,H*0.45,'#3a6f99',12);}

/* ===== 调度 ===== */
const INIT={1:init1,2:init2,3:init3,4:init4,5:init5},TICK={1:t1,2:t2,3:t3,4:t4,5:t5};
function tabs(){document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',+t.dataset.l===L);t.classList.toggle('done',!!done[t.dataset.l]);});}
function go(n){L=n;store.set('level',L);tabs();$('sTitle').textContent=TITLE[L];$('sBody').innerHTML=mapHTML(L);INIT[L]();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(+t.dataset.l));
$('bReset').onclick=()=>{INIT[L]();toast('已重置本关（已对应的原文保留）');};
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,0.05);last=now;T+=dt;ctx.clearRect(0,0,W,H);TICK[L](dt);requestAnimationFrame(loop);}
go(clamp(+store.get('level',1)||1,1,5));requestAnimationFrame(loop);
</script>
