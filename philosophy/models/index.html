.body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top b{font-size:17px}
.batch{font-size:11px;color:#9fb0c3;border:1px solid #33475b;border-radius:8px;padding:1px 7px;white-space:nowrap}
.levels{font-size:12.5px;color:#c6d2df;line-height:1.6}

.meta{display:flex;gap:10px;font-size:11.5px;color:#9fb0c3}

 monad:(x,w,h,t)=>{[[0.3,0],[0.5,1],[0.7,2]].forEach(([p,i])=>{const cx=w*p,cy=h/2;x.strokeStyle='#9fb0c3';x.lineWidth=2;x.beginPath();x.arc(cx,cy,20,0,7);x.stroke();x.strokeStyle='#ffd27a';x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(t*1.2)*14,cy+Math.sin(t*1.2)*14);x.stroke();});},
 moral:(x,w,h,t)=>{for(let i=0;i<30;i++){const lie=i<((Math.sin(t*0.5)+1)/2)*30;x.fillStyle=lie?'#c0392b':'#7dffb0';x.beginPath();x.arc(w*0.15+(i%10)*w*0.075,h*0.3+Math.floor(i/10)*24,6,0,7);x.fill();}},
 gettier:(x,w,h,t)=>{['真','信','理由'].forEach((s,i)=>{const v=(Math.sin(t+i)+1)/2*0.3+0.7;x.fillStyle='#2c3b4c';x.fillRect(w*0.15+i*w*0.2,h*0.2,w*0.12,h*0.6);x.fillStyle='#4a9fe0';x.fillRect(w*0.15+i*w*0.2,h*0.8-h*0.6*v,w*0.12,h*0.6*v);});x.fillStyle=`rgba(255,210,80,${0.5+0.5*Math.sin(t*3)})`;x.beginPath();x.arc(w*0.85,h*0.5,14,0,7);x.fill();x.strokeStyle='#c0392b';x.lineWidth=3;x.beginPath();x.moveTo(w*0.8,h*0.38);x.lineTo(w*0.9,h*0.62);x.stroke();},
 free:(x,w,h,t)=>{for(let i=0;i<14;i++){const a=i*1.7+t*0.8;x.fillStyle='#9fb0c3';x.beginPath();x.arc(w/2+Math.cos(a)*(30+i*4),h/2+Math.sin(a*1.3)*(18+i),3,0,7);x.fill();}const left=Math.sin(t*0.4)>0;x.strokeStyle='#f3a52b';x.lineWidth=2;x.beginPath();x.moveTo(w/2,h*0.1);x.lineTo(w/2+(left?-1:1)*w*0.3,h*0.9);x.stroke();}};
function lerp(a,b,k){return a+(b-a)*k;}
let T=0,last=performance.now();
function loop(now){T+=(now-last)/1000;last=now;cvs.forEach(c=>{const x=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);x.save();G[c.dataset.g]&&G[c.dataset.g](x,w,h,T);x.restore();});requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
