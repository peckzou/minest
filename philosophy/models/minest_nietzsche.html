<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minest · 尼采价值谱系学 · 实时模拟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none;background:#000;color:#111}
#tabs{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2b38;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5;overflow-x:auto}
#tabs b{color:#fff;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{background:#33475b;color:#cfe;border:none;border-radius:6px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:#f3a52b;color:#222;font-weight:600}
.tab.done::after{content:" ✓";color:#7dffb0}
#tabs .sp{margin-left:auto}
#tabs .view{background:#4f6b86;color:#fff;border:none;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}

#side .core{padding:4px 10px 0;font-size:12.5px;color:#7a4f00;font-weight:600}
#side .bound{padding:2px 10px 8px;font-size:11px;color:#777}
#side .bd{padding:4px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px 10px}
.mr{display:grid;grid-template-columns:34% 66%;border:1px solid #d5d8de;border-radius:6px;background:#fafafa;opacity:.4;transition:.4s}
.mr.on{opacity:1;border-color:#3a6f99;background:#fff;box-shadow:0 0 0 2px rgba(58,111,153,.18)}
.mr .op{padding:5px 7px;font-size:12.5px;color:#2c3e50;border-right:1px dashed #ccd;display:flex;gap:5px}
.mr .n{flex:0 0 17px;height:17px;border-radius:50%;background:#99a;color:#fff;font-size:11px;text-align:center;line-height:17px}
.mr.on .n{background:#3a6f99}
.mr .tx{padding:5px 7px;font-size:12.5px}
.mr .en{font-style:italic;color:#778;font-size:10.5px}
.mr .ref{font-size:10.5px;color:#3a6f99}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:7px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
@media (max-width:820px){#cv{height:calc(100% - 48px - 34%)}#side{height:34%}#side .bd{grid-template-columns:1fr}#tabs b{display:none}.tab{font-size:12px;padding:6px 8px}}
</style>
</head>
<body>
<div id="tabs">
  <b>尼采 · 价值谱系学</b>
  <button class="tab on" data-l="1">① 词语的谱系</button>
  <button class="tab" data-l="2">② 羔羊与猛禽</button>
  <button class="tab" data-l="3">③ 闪电与闪光</button>
  <button class="tab" data-l="4">④ 理想的作坊</button>
  <button class="tab" data-l="5">⑤ 应用练习</button>
  <span class="sp"></span><button class="view" id="bReset">↺ 重置本关</button>
</div>
<canvas id="cv"></canvas>
<div id="side"><div class="tt" id="sTitle"></div>
  <div class="core">核心问题：“好／坏”与“善／恶”这些价值从何而来？——这些价值本身又有什么价值？</div>
  <div class="bd" id="sBody"></div>
  <div class="bound">适用边界：时间轴、羊与猛禽、“作坊”都是教学比喻；尼采的谱系学是一种关于价值起源的历史—心理学假说，并非史实记录。原书中涉及种族与民族的论断极具争议，本模型只呈现其论证结构，不代表认同。</div>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,T=0,L=1;
function resize(){const d=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
addEventListener('resize',resize);resize();
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2600);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,t)=>{const k=clamp((t-a)/(b-a),0,1);return k*k*(3-2*k);};
const lerpC=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`;
function txt(t,x,y,c,sz,al,b){ctx.fillStyle=c||'#223';ctx.font=`${b?'bold ':''}${sz||13}px sans-serif`;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}

/* ===== 保存与恢复 ===== */
const KEY='minest_nietzsche_v1';
let store={lit:{},done:{},L:1};
try{const s=localStorage.getItem(KEY);if(s)store=Object.assign(store,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

/* ===== 原文：Horace B. Samuel 英译《道德的谱系》(1913)，Gutenberg #52319；中文为编译 ===== */
const MAP={
1:[
 [`拖动时间：贵族先给自己命名为“好”`,`“好”这一判断并非起源于那些受到善待的人；而是“好人”自己——高贵者、有力者——感到自己是好的。`,`the judgment "good" did not originate among those to whom goodness was shown`,`§2`],
 [`高台与平地之间：距离的激情`,`正是出于这种距离的激情，他们才首先僭取了为自己创造价值、为价值命名的权利。`,`It was out of this pathos of distance that they first arrogated the right to create values for their own profit`,`§2`],
 [`“好”与“坏”的对立由此生成`,`……这就是“好”与“坏”这一对立的起源。`,`this is the origin of the antithesis of good and bad`,`§2`],
 [`“朴素的”一词渐渐变成“坏的”`,`……“粗俗的”“平民的”“低下的”最终都变成了“坏的”。`,`"vulgar," "plebeian," "low," are made to change finally into "bad."`,`§4`],
 [`前后对照：同一群人被称作“坏”与“恶”`,`“坏”与“恶”这两个词，标示出多么大的差异！`,`these two words "bad" and "evil," how great a difference do they mark`,`§11`],
 [`拖到尽头：两种价值的千年之战`,`“好与坏”“善与恶”这两种对立的价值，在世上进行了一场可怕的千年之战。`,`have fought a dreadful, thousand-year fight in the world`,`§16`]],
2:[
 [`按住羊群：怨恨积聚`,`羔羊对大猛禽怀恨在心，这并不奇怪。`,`It is not surprising that the lambs should bear a grudge against the great birds of prey`,`§13`],
 [`羊群的低语`,`“这些猛禽是恶的；谁离猛禽最远、与之相反，是一只羔羊——他难道不是善的吗？”`,`"These birds of prey are evil, and he who is as far removed from being a bird of prey, who is rather its opposite, a lamb,--is he not good?"`,`§13`],
 [`把“怨恨”拖到羊群上：价值开始翻转`,`道德上的奴隶起义，始于怨恨本身变得具有创造性、并产生价值之时。`,`The revolt of the slaves in morals begins in the very principle of resentment becoming creative and giving birth to values`,`§10`],
 [`先出现的是“恶”：对外说“不”`,`奴隶道德从一开始就对“外在的”“不同的”“非我的”说“不”：这个“不”就是它的创造行为。`,`the slave morality says "no" from the very outset to what is "outside itself," "different from itself," and "not itself": and this "no" is its creative deed`,`§10`],
 [`“善”是从“恶”反推出来的`,`它的行动从根本上说是一种反应。`,`its action is fundamentally a reaction`,`§10`],
 [`先构想“恶敌”，再得出“善者”——自己`,`他构想出了“恶的敌人”“恶者”……并由此演化出一个与之相对的“善者”——他自己。`,`he has conceived "the evil enemy," the "evil one," … a "good one," himself`,`§10`]],
3:[
 [`试着把“闪电”从闪光里拖出来`,`在作为、行动、生成背后并没有什么“存在”；“行动者”只是附加给行动的。行动就是一切。`,`there is no "being" behind doing, working, becoming; "the doer" is a mere appanage to the action. The action is everything.`,`§13`],
 [`把“选择做羔羊”拖给猛禽`,`……仿佛强者有选择软弱的自由，猛禽有选择成为羔羊的自由。`,`that the strong has the option of being weak, and the bird of prey of being a lamb`,`§13`],
 [`按住羊群：“无力”被改写成“自由选择”`,`……把软弱解释为自由。`,`the interpretation of weakness as freedom`,`§13`]],
4:[
 [`把“无能”“卑怯”压成“善良”“谦卑”`,`不还击的无能被改称为“善良”，卑怯的低劣被改称为“谦卑”。`,`And the impotence which requites not, is turned to 'goodness,' craven baseness to meekness`,`§14`],
 [`把“无力报复”压成“不愿报复”`,`不能报复，被叫做不愿报复。`,`not being able to avenge one's self, is called not wishing to avenge one's self`,`§14`],
 [`四件全部压完：价值的彻底重估`,`……对其敌人和压迫者取得满足的唯一方法，就是彻底地重估价值。`,`the one method of effecting satisfaction on its enemies and tyrants was by means of a radical transvaluation of values`,`§7`],
 [`作坊门口挂出的新招牌`,`“唯有可怜者才是善的；穷人、弱者、卑贱者才是善的……”`,`the wretched are alone the good; the poor, the weak, the lowly, are alone the good`,`§7`],
 [`招牌的另一面`,`“……而你们，你们这些贵族、有权势的人，你们永远是恶的……”`,`you aristocrats, you men of power, you are to all eternity the evil`,`§7`]],
5:[
 [`按住“骄傲”“慷慨”：它们自己就能长`,`贵族的价值体系自发地行动和生长；它寻找对立面，只是为了更感激、更欢欣地对自己说“是”。`,`it acts and grows spontaneously, it merely seeks its antithesis in order to pronounce a more grateful and exultant "yes" to its own self`,`§10`],
 [`没有“他者”时，“谦卑”“温顺”长不起来`,`奴隶道德需要一个外在的、对象性的世界，作为它存在的条件。`,`the slave-morality requires as the condition of its existence an external and objective world`,`§10`],
 [`两种价值都追溯完：追问价值的价值`,`这些“价值”的价值一向被视为不容置疑的事实，被认为超出一切疑问。`,`The value of these "values" was taken for granted as an indisputable fact, which was beyond all question.`,`序言 §6`]]};
const TITLE={1:'① 词语的谱系 · 在画面上按住左右拖动，穿越时间，看“好／坏”“善／恶”的标签如何漂移、翻转',2:'② 羔羊与猛禽 · 按住下方羊群积聚怨恨；再把右上角的“怨恨”拖到羊群上',3:'③ 闪电与闪光 · 按住闪电向外拖；把“选择做羔羊”拖给猛禽；按住羊群',4:'④ 理想的作坊 · 把左侧的“原料”拖进压机，按住右侧压杆把它压成新名字',5:'⑤ 应用练习 · 按住种子让它生长；拖动右上角的“他者”靠近或远离'};
function mapHTML(l){return MAP[l].map((r,i)=>`<div class="mr${store.lit[l+'_'+i]?' on':''}" id="mr${l}_${i}"><div class="op"><span class="n">${i+1}</span>${r[0]}</div><div class="tx">「${r[1]}」<div class="en">${r[2]}</div><div class="ref">——尼采《道德的谱系》${r[3].startsWith('序言')?'':'第一篇 '}${r[3]}</div></div></div>`).join('');}
function hit(l,i){if(store.lit[l+'_'+i])return;store.lit[l+'_'+i]=1;const e=$('mr'+l+'_'+i);if(e){e.classList.add('on');e.scrollIntoView({block:'nearest',behavior:'smooth'});}
  if(MAP[l].every((_,k)=>store.lit[l+'_'+k])){store.done[l]=1;tabs();}save();}

/* ===== 输入 ===== */
let PT=null;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const HD={};
cv.addEventListener('pointerdown',e=>{const [x,y]=pos(e);PT={x,y};cv.setPointerCapture(e.pointerId);HD[L]&&HD[L].down&&HD[L].down(x,y);});
cv.addEventListener('pointermove',e=>{const [x,y]=pos(e);const dx=PT?x-PT.x:0,dy=PT?y-PT.y:0;if(PT){PT.x=x;PT.y=y;}HD[L]&&HD[L].move&&HD[L].move(x,y,dx,dy,!!PT);});
addEventListener('pointerup',()=>{PT=null;HD[L]&&HD[L].up&&HD[L].up();});

/* ===== 绘制工具 ===== */
function fig(x,y,s,col,o){o=o||{};ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);ctx.globalAlpha=o.a==null?1:o.a;ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(0,-s*2.1,s*.42,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.55,0);ctx.quadraticCurveTo(-s*.6,-s*1.7,0,-s*1.72);ctx.quadraticCurveTo(s*.6,-s*1.7,s*.55,0);ctx.closePath();ctx.fill();
  if(o.crown){ctx.fillStyle='#e0b020';ctx.beginPath();ctx.moveTo(-s*.32,-s*2.45);ctx.lineTo(-s*.32,-s*2.8);ctx.lineTo(-s*.1,-s*2.6);ctx.lineTo(0,-s*2.9);ctx.lineTo(s*.1,-s*2.6);ctx.lineTo(s*.32,-s*2.8);ctx.lineTo(s*.32,-s*2.45);ctx.fill();}
  if(o.robe){ctx.fillStyle='#f4f0e6';ctx.fillRect(-s*.08,-s*1.6,s*.16,s*1.3);}
  ctx.restore();}
function tag(x,y,t,bg,fg,a){if(a<=0.01)return;ctx.save();ctx.globalAlpha=a;ctx.font='bold 15px sans-serif';const w=ctx.measureText(t).width+22;ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x-w/2,y-14,w,28,14);ctx.fill();ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(t,x,y+5);ctx.restore();}
function lamb(x,y,s,f,col){ctx.save();ctx.translate(x+(f?Math.sin(T*40)*3*f:0),y);ctx.fillStyle=col||'#f6f3ea';ctx.beginPath();ctx.ellipse(0,0,s,s*.62,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.15)';ctx.stroke();
  ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(s*.95,-s*.25,s*.32,s*.24,0,0,7);ctx.fill();ctx.fillRect(-s*.6,s*.4,s*.14,s*.5);ctx.fillRect(s*.4,s*.4,s*.14,s*.5);ctx.restore();}
function bird(x,y,s,flap){ctx.save();ctx.translate(x,y);ctx.fillStyle='#2b2420';const w=Math.sin(flap)*s*.5;ctx.beginPath();ctx.moveTo(-s*1.4,-w);ctx.quadraticCurveTo(-s*.5,-s*.2,0,0);ctx.quadraticCurveTo(s*.5,-s*.2,s*1.4,-w);ctx.quadraticCurveTo(s*.5,s*.25,0,s*.35);ctx.quadraticCurveTo(-s*.5,s*.25,-s*1.4,-w);ctx.fill();
  ctx.fillStyle='#e0a020';ctx.beginPath();ctx.moveTo(0,s*.3);ctx.lineTo(s*.12,s*.55);ctx.lineTo(-s*.12,s*.55);ctx.fill();ctx.restore();}
function card(x,y,t,bg,fg){ctx.save();ctx.font='bold 14px sans-serif';const w=ctx.measureText(t).width+26;ctx.fillStyle=bg;ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=8;ctx.beginPath();ctx.roundRect(x-w/2,y-17,w,34,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(t,x,y+5);ctx.restore();}

/* ================= 第 1 关：词语的谱系 ================= */
let A1;
function init1(){A1={t:store.t1||0,drag:false,early:false,late:false};}
const tOf=x=>clamp((x-W*0.08)/(W*0.84),0,1);
HD[1]={down(x){A1.drag=true;A1.t=tOf(x);},move(x,y,dx,dy,d){if(A1.drag){A1.t=tOf(x);store.t1=A1.t;}},up(){A1.drag=false;save();}};
function t1(dt){const t=A1.t,s=Math.min(W,H)*0.052,gy=H*0.74;
  const late=ss(0.55,0.75,t);const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,lerpC([236,218,165],[66,66,92],late));g.addColorStop(1,lerpC([248,238,212],[146,146,168],late));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=lerpC([186,160,110],[90,88,104],late);ctx.fillRect(0,gy,W,H-gy);
  // 距离：贵族的高台
  const ph=H*0.13*ss(0.15,0.26,t)*(1-ss(0.6,0.8,t));
  ctx.fillStyle=lerpC([150,120,70],[80,78,92],late);ctx.fillRect(W*0.12,gy-ph,W*0.26,ph);
  const nx=[0.18,0.25,0.32].map(v=>v*W),cx=[0.58,0.65,0.72,0.79,0.86].map(v=>v*W);
  nx.forEach((x,i)=>fig(x,gy-ph,s,'#3a5f8f',{crown:true,rot:Math.sin(T*1.5+i)*0.02}));
  cx.forEach((x,i)=>fig(x,gy,s*0.92,'#8a6a48',{rot:Math.sin(T*1.3+i)*0.02}));
  // 祭司
  const pa=ss(0.47,0.55,t);if(pa>0.01){fig(W*0.46,gy,s,'#5a4a6a',{a:pa,robe:true});txt('祭司',W*0.46,gy+18,`rgba(40,30,60,${pa})`,12);
    if(t>0.58&&t<0.68){const k=(t-0.58)/0.1;ctx.strokeStyle=`rgba(180,40,60,${1-k})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(W*0.46,gy-s*2,30+k*W*0.3,0,7);ctx.stroke();}}
  // 距离的激情
  const da=ss(0.18,0.26,t)*(1-ss(0.55,0.64,t));if(da>0.01){const y=gy-ph-s*1.2;ctx.strokeStyle=`rgba(120,80,20,${da})`;ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(W*0.38,y);ctx.lineTo(W*0.54,gy-s*1.2);ctx.stroke();ctx.setLineDash([]);
    txt('距离的激情',W*0.46,y-8,`rgba(120,80,20,${da})`,13,'center',true);}
  // 标签
  const nyTop=gy-ph-s*3.5,cyTop=gy-s*3.4;
  const ga=ss(0.12,0.18,t),kg=ss(0.6,0.75,t);
  const gx=lerp(W*0.25,W*0.72,kg),gyy=lerp(nyTop,cyTop,kg)-Math.sin(kg*Math.PI)*H*0.2;
  tag(gx,gyy,kg<0.5?'好 · good':'善 · good',kg<0.5?'#e0b020':'#9fd0ff','#1b2333',ga);
  const ba=ss(0.12,0.18,t)*(1-ss(0.58,0.66,t)),cr=ss(0.35,0.43,t);
  tag(W*0.72,cyTop,'朴素的 · schlicht','#d8cdb6','#3b3020',ba*(1-cr));
  tag(W*0.72,cyTop,'坏 · schlecht / bad','#7a6a55','#fff',ba*cr);
  const ea=ss(0.62,0.66,t),ke=ss(0.64,0.78,t);
  const ex=lerp(W*0.72,W*0.25,ke),ey=lerp(cyTop+34,nyTop,ke)+Math.sin(ke*Math.PI)*H*0.12;
  tag(ex,ey,'恶 · evil','#b02a3a','#fff',ea);
  if(ea>0.01&&ke<1){ctx.strokeStyle=`rgba(176,42,58,${0.4*ea})`;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(W*0.72,cyTop+30);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);}
  // 时代标题
  const era=t<0.12?'命名之前':t<0.47?'贵族的评价：好与坏':t<0.6?'祭司的评价':t<0.82?'奴隶起义：善与恶':'千年之战（至今未决）';
  txt(era,16,28,late>0.5?'#eef':'#3b2a10',16,'left',true);
  if(t>0.84){txt('“好与坏” ⟷ “善与恶”',W/2,H*0.14,'rgba(255,240,200,.95)',18,'center',true);}
