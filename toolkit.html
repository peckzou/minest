<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognitive Toolkit</title>
<style>
:root { --bg: #f4f2fb; --card: #fff; --ink: #1d1838; --dim: #6d6889; --line: #e3dff2; --acc: #6b4ce6; --ok: #1f9d55; --warn: #c27a00; --bad: #d1435b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #14121f; --card: #1e1b2e; --ink: #ece9fb; --dim: #a29dc0; --line: #34304a; --acc: #9b85ff; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Nunito, sans-serif; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--acc); color: #fff; border-color: transparent; font-weight: 700; }
button.ghost { background: transparent; }
button.small { padding: 4px 10px; font-size: 13px; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 24px 6px; max-width: 1180px; margin: 0 auto; }
.top h1 { margin: 0; font-size: 26px; } .top h1 span { color: var(--acc); }
.top p { margin: 2px 0 0; color: var(--dim); }
.badge { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
main { max-width: 1180px; margin: 0 auto; padding: 10px 24px 60px; display: grid; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.ask label { font-weight: 700; display: block; margin-bottom: 8px; }
.ask textarea { font-size: 17px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; color: var(--dim); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; }
.compass-card svg { width: 100%; max-width: 340px; display: block; margin: 0 auto; }
.ring { fill: none; stroke: var(--line); stroke-dasharray: 3 4; }
.sec { fill: var(--h); fill-opacity: .07; stroke: var(--card); stroke-width: 2; transition: fill-opacity .4s; }
.sec.on { fill-opacity: .28; }
.lab { font-size: 11px; text-anchor: middle; dominant-baseline: middle; fill: var(--dim); font-weight: 600; }
.lab.on { fill: var(--ink); font-weight: 800; }
.needle path { fill: var(--acc); opacity: .9; } .needle { transition: transform .9s cubic-bezier(.2, 1.3, .4, 1); }
.pin { fill: var(--acc); stroke: var(--card); stroke-width: 3; }
.rel { fill: var(--card); stroke: var(--acc); stroke-width: 2.5; stroke-dasharray: 3 2; }
.hub { fill: var(--ink); }
.meta { display: grid; gap: 10px; margin-top: 10px; }
.meta small { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.meta b { font-size: 16px; } .meta em { display: block; font-style: normal; font-size: 13px; color: var(--dim); }
.meta em.warn { color: var(--warn); } .meta em.ok { color: var(--ok); }
.tag { display: inline-block; font-size: 12.5px; padding: 2px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); margin: 2px 4px 2px 0; }
.why h3, .log h3 { margin: 0 0 8px; }
.why ul { margin: 0 0 12px; padding-left: 18px; } .why li { margin: 3px 0; }
.dim { color: var(--dim); font-size: 13px; }
.fix { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.fix h4 { margin: 0; } .fix label { display: grid; gap: 4px; font-size: 13px; color: var(--dim); }
.msg { font-size: 13px; color: var(--ok); }
.ai { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; display: grid; gap: 6px; }
.ai .msg { color: var(--ink); }
.frameworks { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.fw header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.fw h3 { margin: 0; font-size: 17px; } .fw h4 { margin: 10px 0 2px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; }
.fw p, .fw ul { margin: 2px 0; } .fw ul { padding-left: 18px; }
.fw.best { border-color: var(--acc); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 20%, transparent); }
.kind { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; background: var(--bg); }
.k-philosophical { color: #9b5de5; } .k-method { color: var(--ok); } .k-model { color: #f08c3a; } .k-classification { color: #5e9cff; }
.kindnote { font-size: 12.5px; color: var(--dim); } .fit { font-size: 13px; }
.concepts { margin-top: 8px; } .src { font-size: 12px; color: var(--dim); margin-top: 8px !important; }
.play { width: 100%; margin-top: 12px; text-align: left; } .play small { font-weight: 400; opacity: .85; }
.entry { border-top: 1px solid var(--line); padding: 10px 0; } .entry .q { font-weight: 700; margin: 0; } .entry p { margin: 2px 0; }
.run { margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 10px; font-size: 13.5px; }
.st { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); }
.st.ok { color: var(--ok); border-color: currentColor; }
.err { background: var(--bad); color: #fff; padding: 10px 20px; margin: 0; }
@media (max-width: 760px) { .result { grid-template-columns: 1fr; } main, .top { padding-left: 16px; padding-right: 16px; } .top { flex-direction: column; } }

/* ------------------------------------------------------------------ micro-interaction player */
.mi-ov { position: fixed; inset: 0; background: rgba(15, 10, 40, .55); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 50; padding: 16px; }
.mi-card { background: var(--card); color: var(--ink); width: min(980px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 22px; padding: 18px 22px; display: grid; gap: 10px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
.mi-hd { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mi-hd b { font-size: 20px; display: block; } .mi-hd small { color: var(--dim); }
.mi-dots { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
.mi-dots li { display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 3px; border-radius: 99px; }
.mi-dots span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-size: 11px; }
.mi-dots li.on { color: var(--ink); background: var(--bg); font-weight: 700; } .mi-dots li.on span { background: var(--acc); color: #fff; }
.mi-dots li.done span { background: var(--ok); color: #fff; }
.mi-x { border: 0; font-size: 24px; line-height: 1; padding: 4px 10px; }
.mi-prompt { margin: 0; font-size: 17px; font-weight: 700; }
.mi-stage { min-height: 300px; }
.mi-fb { min-height: 0; padding: 0 14px; border-radius: 12px; font-size: 14.5px; opacity: 0; transform: translateY(6px); transition: .3s; }
.mi-fb.show { opacity: 1; transform: none; padding: 10px 14px; }
.mi-fb.info { background: color-mix(in srgb, var(--acc) 12%, transparent); } .mi-fb.good { background: color-mix(in srgb, var(--ok) 15%, transparent); } .mi-fb.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.mi-ft { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.mi-disc { flex: 1; font-size: 12px; color: var(--dim); }
.mi-next { background: var(--acc); color: #fff; border-color: transparent; font-weight: 700; }

/* lamps */
.kl-solo { display: grid; place-items: center; gap: 8px; padding-top: 10px; }
.kl-rig { position: relative; width: 300px; max-width: 100%; }
.kl-lamps { display: flex; justify-content: space-around; }
.kl-lamp { display: grid; place-items: center; gap: 6px; }
.kl-lamp i { width: 70px; height: 70px; border-radius: 50%; background: #3a3550; box-shadow: inset 0 -6px 12px rgba(0, 0, 0, .4); transition: background .08s, box-shadow .08s; }
.kl-lamp[data-l=a].on i { background: #ffd23f; box-shadow: 0 0 40px 10px rgba(255, 210, 63, .7); }
.kl-lamp[data-l=b].on i { background: #4fd1ff; box-shadow: 0 0 40px 10px rgba(79, 209, 255, .7); }
.kl-lamp.pressed b { color: var(--acc); }
.kl-box { position: relative; height: 110px; margin-top: 4px; }
.kl-wires { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 60px; opacity: 0; transition: opacity .5s; }
.kl-w { fill: none; stroke: var(--line); stroke-width: 3; } .kl-w.on { stroke: var(--acc); }
.kl-timer, .kl-curtain { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: 110px; height: 52px; border-radius: 12px; display: grid; place-items: center; }
.kl-timer { grid-template-columns: 40px auto; gap: 6px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.kl-timer svg { width: 36px; } .kl-timer circle { fill: none; stroke: var(--ink); stroke-width: 2.5; } .kl-hand { stroke: var(--bad); stroke-width: 3; stroke-linecap: round; }
.kl-curtain { z-index: 2; background: repeating-linear-gradient(90deg, #7a2b45 0 10px, #92334f 10px 20px); color: #fff; font-weight: 800; font-size: 22px; transition: transform .6s, opacity .6s; }
.kl-rig.revealed .kl-curtain { transform: translateX(-50%) translateY(-30px) scaleY(.2); opacity: 0; pointer-events: none; }
.kl-rig.revealed .kl-wires { opacity: 1; }
.kl-rig.stopped .kl-timer { opacity: .5; }
.kl-count { color: var(--dim); font-size: 14px; }
/* judge */
.kl-judge { display: grid; place-items: center; gap: 14px; padding-top: 40px; }
.kl-opts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.kl-opts button { font-size: 18px; padding: 16px 24px; border-radius: 16px; border-width: 2px; }
.kl-opts button.on { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, var(--card)); font-weight: 700; }
.kl-was { color: var(--dim); }
/* probe */
.kl-probe { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kl-pane { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; align-content: start; justify-items: center; }
.kl-pane h4 { margin: 0; justify-self: start; }
.kl-ctrl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.kl-tabs { display: flex; gap: 6px; justify-self: start; } .kl-tabs .on { background: var(--acc); color: #fff; border-color: transparent; }
.kl-tab { display: none; width: 100%; } .kl-tab.on { display: grid; gap: 8px; justify-items: center; }
.kl-hint { margin: 0; color: var(--dim); font-size: 13.5px; }
.kl-hs { display: grid; grid-template-columns: 120px 120px; gap: 6px; width: 246px; }
.kl-hs button { height: 64px; border-width: 2px; }
.kl-roof { grid-column: 1 / -1; clip-path: polygon(50% 0, 100% 100%, 0 100%); border-radius: 0 !important; background: #e9d8ff !important; color: #3d2a6e !important; }
.kl-hs .seen { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 20%, var(--card)); }
.kl-roof.seen { background: #b89bff !important; }
.kl-river { position: relative; width: 100%; height: 120px; border-radius: 14px; background: linear-gradient(180deg, #bfe6ff, #6fb8ef); display: flex; align-items: flex-end; justify-content: space-around; padding: 8px; }
.kl-river button { font-size: 12.5px; padding: 4px 10px; background: rgba(255, 255, 255, .85); color: #12324d; }
.kl-flow { position: absolute; top: 6px; right: 12px; font-size: 12px; color: #0d3b66; }
.kl-boat { position: absolute; top: 34px; left: 12%; font-size: 32px; font-style: normal; transition: left .6s ease; }
.kl-river.shake { animation: klshake .4s; }
@keyframes klshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.kl-seq, .kl-seq2 { margin: 0; font-size: 13px; min-height: 1.4em; }
.kl-todo { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; list-style: none; padding: 0; margin: 0; }
.kl-todo li { font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px dashed var(--line); color: var(--dim); }
.kl-todo li.done { border-style: solid; border-color: var(--ok); color: var(--ok); } .kl-todo li.done::before { content: "✓ "; }
/* layers */
.kl-layers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kl-layer { text-align: left; border-radius: 16px; padding: 0; min-height: 380px; perspective: 900px; border: 0; background: transparent; position: relative; }
.kl-back, .kl-face { position: absolute; inset: 0; border-radius: 16px; padding: 14px; backface-visibility: hidden; transition: transform .6s; display: grid; align-content: start; gap: 6px; }
.kl-back { background: linear-gradient(140deg, #6b4ce6, #9b5de5); color: #fff; font-weight: 800; font-size: 18px; place-content: center; text-align: center; }
.kl-back small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.kl-layer:not(.next):not(.open) .kl-back { filter: grayscale(.7); opacity: .6; }
.kl-face { background: var(--bg); border: 1px solid var(--line); transform: rotateY(180deg); font-size: 13.5px; overflow: auto; }
.kl-face b { font-size: 16px; } .kl-face em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--acc); }
.kl-layer.open .kl-back { transform: rotateY(-180deg); } .kl-layer.open .kl-face { transform: none; }
.kl-map, .kl-src { color: var(--dim); font-size: 12px; }
.kl-note { grid-column: 1 / -1; margin: 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 14%, transparent); opacity: 0; transition: opacity .4s; }
.kl-note.show { opacity: 1; }
/* apply + save */
.kl-apply, .kl-save { display: grid; gap: 10px; max-width: 640px; }
.kl-apply label, .kl-save label { display: grid; gap: 4px; font-size: 13.5px; color: var(--dim); }
.kl-apply fieldset { border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 4px; }
.kl-apply legend { font-size: 13px; color: var(--dim); }
.kl-chk { display: flex !important; align-items: center; gap: 8px; color: var(--ink) !important; } .kl-chk input { width: auto; }
.kl-go { justify-self: start; background: var(--acc); color: #fff; border-color: transparent; font-weight: 700; }
.kl-ok { color: var(--ok); font-size: 13.5px; margin: 0; }
.kl-save dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; } .kl-save dt { color: var(--dim); } .kl-save dd { margin: 0; }
@media (max-width: 760px) { .kl-probe, .kl-layers { grid-template-columns: 1fr; } .kl-layer { min-height: 360px; } }
main > *, .result > *, .frameworks > * { min-width: 0; }
select { max-width: 100%; text-overflow: ellipsis; }
.result[hidden] { display: none; }

</style>
<style>
/* Cognitive Toolkit — builds on ../compass/lab.css tokens (--bg --card --ink --dim --line --acc --ok --warn --bad) */
.tk-main { max-width: 1240px; }
[hidden] { display: none !important; }
.tk-ask label { font-weight: 700; display: block; margin-bottom: 8px; }
.tk-askrow { display: flex; gap: 10px; }
.tk-askrow input { font-size: 18px; padding: 12px 14px; }
.tk-ask .chips { margin-top: 10px; }
.tk-recent { margin-top: 6px !important; }
.tk-intro { text-align: center; color: var(--dim); padding: 30px 10px; }
.tk-file { display: inline-block; margin-top: 10px; border: 1px dashed var(--line); padding: 6px 12px; border-radius: 10px; cursor: pointer; }
.tk-file input { display: none; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--dim); vertical-align: middle; }
.pill.ok { color: var(--ok); border-color: currentColor; } .pill.sug { color: var(--warn); border-color: currentColor; }
.tag button { border: 0; background: none; padding: 0 2px; color: var(--dim); }

/* object header + tabs */
.tk-obj { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px; }
.tk-obj h2 { margin: 0; font-size: 24px; display: grid; }
.tk-obj h2 small { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
.tk-place { font-size: 14px; font-weight: 500; color: var(--dim); }
.tk-place em { font-style: normal; font-size: 12px; } .tk-place em.ok { color: var(--ok); } .tk-place em.sug { color: var(--warn); }
.tk-objact { display: flex; gap: 6px; }
.tk-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; scrollbar-width: none; }
.tk-tabs button { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; white-space: nowrap; padding: 8px 12px; border-radius: 12px; color: var(--dim); }
.tk-tabs button svg { width: 18px; height: 18px; }
.tk-tabs button.on { background: var(--bg); color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1px var(--line); }
.tk-tabs button.on svg { color: var(--cc, var(--acc)); }

/* five-card entry */
.tk-stage.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.tk-card { position: relative; text-align: left; display: grid; align-content: start; gap: 8px; padding: 16px 14px 14px; min-height: 250px; border-radius: 20px; border: 1px solid var(--line);
  background: linear-gradient(160deg, color-mix(in srgb, var(--cc) 10%, var(--card)), var(--card) 55%); box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 10px 24px -18px color-mix(in srgb, var(--cc) 60%, transparent);
  transition: transform .25s cubic-bezier(.2, .9, .3, 1.2), box-shadow .25s; animation: tkIn .5s both; animation-delay: calc(var(--i) * 60ms); }
.tk-card:hover { transform: translateY(-3px); box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 18px 30px -18px color-mix(in srgb, var(--cc) 70%, transparent); }
.tk-card:active { transform: translateY(0) scale(.99); }
@keyframes tkIn { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .tk-card { animation: none; transition: none; } }
.tk-num { position: absolute; top: 12px; right: 14px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tk-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 16%, var(--card)); color: var(--cc); }
.tk-ic svg { width: 24px; height: 24px; }
.tk-names b { display: block; font-size: 16px; } .tk-names em { font-style: normal; color: var(--dim); font-size: 13px; }
.tk-line { font-size: 13px; color: var(--dim); }
.tk-pv { display: grid; gap: 4px; font-size: 13px; padding-top: 8px; border-top: 1px dashed var(--line); }
.tk-open { font-size: 13px; font-weight: 700; color: var(--cc); margin-top: auto; }
.pv-list { display: flex; flex-wrap: wrap; gap: 4px; } .pv-list i { font-style: normal; font-size: 12px; padding: 1px 7px; border-radius: 8px; background: var(--bg); }
.pv-list small { color: var(--dim); }
.pv-compass { display: flex; gap: 6px; align-items: center; font-weight: 600; } .pv-compass i { width: 10px; height: 10px; border-radius: 50%; background: var(--h); flex: none; }
.pv-graph b { font-size: 18px; }
@media (max-width: 1100px) { .tk-stage.grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .tk-stage.grid { grid-template-columns: 1fr 1fr; } .tk-card { min-height: 200px; } }
@media (max-width: 440px) { .tk-stage.grid { grid-template-columns: 1fr; } .tk-askrow { flex-direction: column; } }

#tk-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: .3s; z-index: 80; max-width: calc(100vw - 32px); }
#tk-toast.on { opacity: 1; transform: translate(-50%, 0); }
.row { margin-top: 8px; }

/* ---------------- Card 01 · Thought Compass */
.cp-wrap { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(300px, 400px); gap: 16px; align-items: start; }
.cp-instrument { position: relative; aspect-ratio: 1; max-width: 640px; width: 100%; margin: 0 auto; --px: 0; --py: 0; }
.cp-bezel { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at calc(35% + var(--px) * 20%) calc(25% + var(--py) * 20%), #fff 0, #d9d4e8 18%, #8e88a8 48%, #3c3752 80%, #1e1b2e 100%);
  box-shadow: 0 30px 50px -24px rgba(20, 10, 60, .6), inset 0 2px 3px rgba(255, 255, 255, .8), inset 0 -8px 16px rgba(0, 0, 0, .35); transform: translate(calc(var(--px) * -6px), calc(var(--py) * -6px)); transition: transform .3s; }
.cp-svg { position: absolute; inset: 3.5%; width: 93%; height: 93%; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .25)); }
.cp-svg:focus-visible { outline: 3px solid var(--acc); outline-offset: 4px; border-radius: 50%; }

ion"],["Immanuel Kant","influences","Kant’s category of causality"]],"frameworks":["causal-inference","kant"],"labs":["kant-causality"]}]},"data/models.json":{"format":"minest.models/1","version":"0.1.0","angles":[{"id":"define","label":"Define","hint":"What is it?"},{"id":"compare","label":"Compare","hint":"How do views differ?"},{"id":"cause","label":"Cause","hint":"Why does it happen?"},{"id":"value","label":"Value","hint":"Is it good or right?"},{"id":"system","label":"System","hint":"How do parts interact?"},{"id":"experience","label":"Experience","hint":"Try it in an experiment"}],"models":[{"id":"causal-analysis","title":"Cause-and-effect analysis","angle":"cause","principle":"Coming first is not causing. Check common causes, reverse causation and chance, and ask what evidence would settle it.","fits":{"places":["philosophy.epistemology.causation","nature.method.causal-inference","systems","society"],"words":["why","为什么","because","导致","cause","effect","结果"]},"steps":[{"id":"claim","title":"The claim","prompt":"Write the cause-and-effect claim: A leads to B.","input":"text"},{"id":"checks","title":"Check it","prompt":"Which of these could be going on?","input":"multi","options":[["order","I only know A came before B"],["common","A third factor could cause both"],["reverse","B could cause A"],["chance","It could be chance"],["intervene","Someone could change A and watch B"]]},{"id":"alternatives","title":"Other explanations","prompt":"List other things that could explain B.","input":"list"},{"id":"evidence","title":"Evidence that would settle it","prompt":"What would you need to see?","input":"list"},{"id":"verdict","title":"Your judgment","prompt":"For now, I think…","input":"choice","options":[["causal","A probably causes B"],["correlated","They are probably only correlated"],["unsure","Not sure yet"]]}],"result":[{"label":"Claim","from":"claim"},{"label":"Possible issues","from":"checks"},{"label":"Other explanations","from":"alternatives"},{"label":"Evidence needed","from":"evidence"},{"label":"Judgment","from":"verdict"}],"rules":[{"when":{"all":[{"has":["checks","order"]},{"eq":{"verdict":"causal"}}]},"say":"You only know the order but judged it causal — order alone is not evidence.","tone":"warn"},{"when":{"all":[{"minItems":{"alternatives":1}},{"minItems":{"evidence":1}}]},"say":"You named other explanations and the evidence that would decide — that is the core of a causal analysis.","tone":"good"}],"limits":"Good for empirical claims. It does not answer philosophical questions about what causation is."},{"id":"systems-thinking","title":"Systems thinking (feedback loops)","angle":"system","principle":"Outcomes often come from loops: parts that affect each other in circles. Reinforcing loops amplify, balancing loops hold things steady.","fits":{"places":["systems","society","nature","psychology"],"words":["system","系统","循环","cycle","policy","政策","keeps","总是"]},"steps":[{"id":"parts","title":"Parts","prompt":"List the parts or quantities involved (at least 2).","input":"list"},{"id":"links","title":"Links","prompt":"Connect parts: when the first goes up, does the second go up (+) or down (−)?","input":"links","from":"parts"},{"id":"leverage","title":"Where to intervene","prompt":"Which link or part would you change, and why?","input":"text"}],"result":[{"label":"Parts","from":"parts"},{"label":"Links","from":"links"},{"label":"Loops found","from":"links","compute":"loops"},{"label":"Intervention","from":"leverage"}],"rules":[{"when":{"minItems":{"links":2}},"say":"Look at the loops below: a loop with an even number of ‘−’ links is reinforcing, an odd number is balancing.","tone":"info"}],"limits":"A loop diagram is a simplification; real systems have delays and more parts than any sketch."},{"id":"incentives","title":"Incentive analysis","angle":"system","principle":"People respond to what they are rewarded and punished for — which may differ from what a rule intends.","fits":{"places":["society.economy","society", ry","title":"Necessary conditions","prompt":"Without these, it can’t be X.","input":"list"},{"id":"sufficient","title":"Sufficient conditions","prompt":"If these hold, it is definitely X.","input":"list"},{"id":"cases","title":"Test cases","prompt":"Add cases; mark whether they meet your conditions and whether they really are X.","input":"cases","cols":["Meets my conditions","Really is X"]}],"result":[{"label":"Necessary","from":"necessary"},{"label":"Sufficient","from":"sufficient"},{"label":"Cases","from":"cases","compute":"mismatch"}],"rules":[{"when":{"mismatch":"cases"},"say":"At least one case doesn’t match — your conditions need another look.","tone":"warn"}],"limits":"Many everyday concepts work by family resemblance rather than strict conditions."}]},"../compass/micro/kant-causality.json":{"format":"minest.micro/1","interaction_id":"kant-causality","framework_id":"kant","also_for":["causal-inference"],"concept_id":"understanding.relation","interaction_type":"thought-experiment","version":"0.1.0","title":"Before ≠ Because","subtitle":"Two lamps, a house and a ship","learning_objective":"Tell three things apart: (1) the order in which events happen; (2) empirical judgments of cause (Hume: habit of association; modern causal inference: intervention and ruling out common causes); (3) Kant’s philosophical claim that causality is a category of the understanding — a condition for experiencing an objective order in time.","disclaimer":"A teaching analogy to help understand Kant — it does not prove or test his transcendental philosophy.","steps":[{"id":"observe","title":"Observe","scene":"lamps","prompt":"Watch the two lamps: A lights, then B. Watch a few rounds."},{"id":"judge","title":"Judge","scene":"judge","prompt":"Did A cause B?","field":"judge1"},{"id":"probe","title":"Experiment","scene":"probe","prompt":"Change the conditions and see what happens. Then look at the house and the ship."},{"id":"rejudge","title":"Judge again","scene":"judge","prompt":"Do you still think A caused B?","field":"judge2"},{"id":"explain","title":"Explain","scene":"layers","prompt":"Split what you just saw into three layers."},{"id":"apply","title":"Apply","scene":"apply","prompt":"Check a claim from real life the same way."},{"id":"save","title":"Keep","scene":"save","prompt":"Keep what you understood and what you still wonder about."}],"initial_state":{"step":"observe","cycles":0,"judge1":null,"judge2":null,"pressA":0,"curtain":false,"stopped":false,"houseOrders":0,"houseLast":[],"shipTries":0,"shipWrong":0,"shipDone":false,"layers":0,"apply":null,"note":"","question":"","last":null,"saved":false},"user_actions":[{"id":"cycle","label":"The lamps finish a round","step":"observe"},{"id":"judge","label":"Choose yes / no / not sure","payload":"value","step":["judge","rejudge"]},{"id":"press-a","label":"Press A yourself","step":"probe"},{"id":"open-curtain","label":"Lift the curtain","step":"probe"},{"id":"stop-timer","label":"Stop the timer","step":"probe"},{"id":"start-timer","label":"Restart the timer","step":"probe"},{"id":"house-order","label":"Look over the house in your own order","payload":"order","step":"probe"},{"id":"ship-ok","label":"Follow the ship in its order","step":"probe"},{"id":"ship-wrong","label":"Try to see the ship backwards","step":"probe"},{"id":"flip","label":"Turn over the next layer","step":"explain"},{"id":"apply","label":"Submit a real-life case","payload":"record","step":"apply"},{"id":"note","label":"Write what you understood / a question","payload":"fields","step":"save"},{"id":"next","label":"Next"},{"id":"back","label":"Back"}],"state_transitions":[{"from":"observe","on":"cycle","inc":{"cycles":1}},{"from":"judge","on":"judge","set":{"judge1":"$value"}},{"from":"probe","on":"press-a","inc":{"pressA":1},"set":{"last":"press"}},{"from":"probe","on":"open-curtain","set":{"curtain":true,"last":"curtain"}},{"from":"probe","on":"stop-timer","set":{"stopped":true,"last":"stopped"}},{"from":"probe","on":"start-timer","set":{"stopped":false,"last":null}},{"from":"probe","on":"house-order","inc":{"houseOrders":1},"set":{"houseLast":"$value","last":"house"}},{"from":"probe","on":"ship-ok","set":{"shipDone":true,"last":"ship-ok"},"inc":{"shipTries":1}},{"from":"probe","on":"ship-wrong","inc":{"shipWrong":1,"shipTries":1},"set":{"last":"ship-wrong"}},{"from":"rejudge","on":"judge","set":{"judge2":"$value"}},{"from":"explain","on":"flip","inc":{"layers":1}},{"from":"apply","on":"apply","set":{"apply":"$value"}},{"from":"save","on":"note","merge":"$value"},{"from":"*","on":"next","advance":1},{"from":"*","on":"back","advance":-1}],"completion_criteria":{"observe":{"gte":{"cycles":3}},"judge":{"truthy":["judge1"]},"probe":{"all":[{"gte":{"pressA":1}},{"truthy":["curtain"]},{"gte":{"houseOrders":1}},{"truthy":["shipDone"]}]},"rejudge":{"truthy":["judge2"]},"explain":{"gte":{"layers":3}},"apply":{"truthy":["apply"]},"save":{"truthy":[]},"interaction":{"all":[{"truthy":["judge1","judge2","apply"]},{"gte":{"layers":3}}]}},"feedback_rules":[{"step":"observe","when":{"gte":{"cycles":3}},"say":"A lights before B every time. Your mind starts to expect it: A lights, so B is coming.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"yes"}},"say":"You think A caused B. Keep that judgment — next you will test it.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"no"}},"say":"You think not. Then why does B always follow A? Let’s find out.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"unsure"}},"say":"Not sure is a good place to start: order alone is not enough to judge.","tone":"info"},{"step":"probe","when":{"eq":{"last":"press"}},"say":"You pressed A yourself and B stayed dark. A always comes first, yet it is not B’s cause. This move is called intervention.","tone":"good"},{"step":"probe","when":{"eq":{"last":"curtain"}},"say":"Behind the curtain a timer drives both A and B. That is a common cause (a confounder).","tone":"good"},{"step":"probe","when":{"eq":{"last":"stopped"}},"say":"Stop the timer and neither lamp lights. The timer is what really does the work.","tone":"good"},{"step":"probe","when":{"eq":{"last":"house"}},"say":"You chose the order to look at the house — roof first or door first, the house did not change. This is a subjective order.","tone":"info"},{"step":"probe","when":{"eq":{"last":"ship-wrong"}},"say":"The ship doesn’t drift backwards: you can only see it upstream first, then downstream. You don’t get to choose this order.","tone":"warn"},{"step":"probe","when":{"eq":{"last":"ship-ok"}},"say":"The ship’s order is fixed: an objective order — something really happened. Kant’s question is what entitles us to take it as objective.","tone":"good"},{"step":"rejudge","when":{"all":[{"eq":{"judge1":"yes"}},{"eq":{"judge2":"no"}}]},"say":"You changed your mind. What changed it was not more watching, but intervening and finding the common cause.","tone":"good"},{"step":"rejudge","when":{"all":[{"eq":{"judge1":"yes"}},{"eq":{"judge2":"yes"}}]},"say":"You still think it’s cause. Remember: when you pressed A yourself, did B light?","tone":"warn"},{"step":"rejudge","when":{"eq":{"judge2":"no"}},"say":"Right: in this setup both A and B are caused by the timer. Before is not because.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"unsure"}},"say":"You may stay unsure. But intervening already showed that A is not B’s cause.","tone":"info"}],"content":{"layers":[{"id":"order","title":"① Order in time","tag":"Description of fact","body":"A happens before B. That is a fact about order; on its own it says nothing about what produces what.","maps_to":"Watching the lamps","kind":"summary"},{"id":"empirical","title":"② Empirical judgment of cause","tag":"Experience · Scientific method","body":"Hume pointed out that we never see a ‘power’ — only that B always follows A, and habit makes us expect B. Modern causal inference gives ways to test this: intervene on A yourself (not just watch), and rule out common causes (confounders) and reverse causation. That is what you just did with the lamps.","source":"Hume, A Treatise of Human Nature (1739); An Enquiry concerning Human Understanding (1748); modern causal inference (intervention, randomised trials, confounding)","maps_to":"Press A · lift the curtain · stop the timer","kind":"summary"},{"id":"kant","title":"③ Kant’s claim","tag":"Philosophical claim · debated","body":"Kant held that cause and effect is one of the categories of the understanding (under Relation). It is not learned from experience; it is a condition that makes experience possible. Looking over a house, the order of your perceptions can run either way (a subjective order). Watching a ship drift downstream, the order is fixed (an objective order). Kant argues that to take a series of perceptions as an event that objectively happens, we must think it under a rule — the causal law. But the category only says every event has a cause; what causes what must still be found out from experience — layer ② again.","source":"Kant, Critique of Pure Reason (1781/1787), Second Analogy (from A189/B232; the house and ship example is in this section — check page numbers against your edition)","maps_to":"The house and the ship","kind":"interpretation"}],"map_note":"Mind the mapping: the lamps belong to layer ② (experience and method). The house and the ship are Kant’s own example for layer ③.","apply_checks":[{"id":"only-order","label":"I only saw one thing come after the other"},{"id":"common-cause","label":"A third factor could cause both"},{"id":"reverse","label":"It could run the other way (B causes A)"},{"id":"intervene","label":"I could try it myself (intervene)"}],"apply_verdicts":[{"id":"causal","label":"I think it is cause and effect"},{"id":"correlated","label":"Probably just correlated"},{"id":"unsure","label":"Not sure yet — need to check"}]},"result_schema":{"interaction_id":"string","framework_id":"string","concept_id":"string","version":"string","query_id":"string|null","startedAt":"number","finishedAt":"number","completed":"boolean","judge1":"yes|no|unsure","judge2":"yes|no|unsure","changedMind":"boolean","probes":{"pressA":"number","curtain":"boolean","stopped":"boolean","houseOrders":"number","shipTries":"number","shipWrong":"number"},"apply":{"a":"string","b":"string","checks":"string[]","verdict":"causal|correlated|unsure","note":"string","relation_id":"string"},"note":"string","question":"string","log":"[{ at, action, step }]"},"content_review_status":"pending"},"labs/locke-room.json":{"format":"minest.micro/1","interaction_id":"locke-room","framework_id":"locke-liberty","also_for":["berlin-liberty"],"interaction_type":"thought-experiment","version":"0.1.0","fits":["philosophy.political","philosophy.metaphysics.free-will","philosophy.ethics"],"title":"The Locked Room","subtitle":"Staying willingly vs. being free to leave","learning_objective":"Tell apart doing something voluntarily (I want to stay) from being at liberty (I could leave if I wanted) — Locke’s distinction — and connect it to Berlin’s negative and positive liberty.","disclaimer":"A teaching version of Locke’s example; it illustrates his distinction and does not settle the free-will debate.","steps":[{"id":"observe","title":"Observe","scene":"room","prompt":"A man is carried, asleep, into a room. The door is locked. He wakes up, finds good company, and is glad to stay."},{"id":"judge","title":"Judge","scene":"judge","prompt":"He stays because he wants to. Is he free?","field":"judge1","options":[["yes","Yes, he is free"],["no","No, he is not free"],["unsure","Partly / not sure"]]},{"id":"probe","title":"Experiment","scene":"room-probe","prompt":"Change the conditions. Watch the two gauges: ‘does what he wants’ and ‘could do otherwise’."},{"id":"rejudge","title":"Judge again","scene":"judge","prompt":"Is the man in the locked room — who wants to stay — free?","field":"judge2","options":[["yes","Yes, he is free"],["no","No, he is not free to leave"],["unsure","Partly / not sure"]]},{"id":"explain","title":"Explain","scene":"layers","prompt":"Three ways to describe what you saw."},{"id":"apply","title":"Apply","scene":"apply-free","prompt":"Find the same distinction in your own life."},{"id":"save","title":"Keep","scene":"save-free","prompt":"Keep what you understood and what you still wonder about."}],"initial_state":{"step":"observe","seen":0,"judge1":null,"judge2":null,"locked":true,"wish":"stay","knows":false,"tried":[],"layers":0,"apply":null,"note":"","question":"","last":null,"saved":false},"user_actions":[{"id":"seen","label":"Watch the scene","step":"observe"},{"id":"judge","label":"Choose an answer","payload":"value","step":["judge","rejudge"]},{"id":"toggle-lock","label":"Lock / unlock the door","step":"probe"},{"id":"toggle-wish","label":"He wants to stay / leave","step":"probe"},{"id":"toggle-knows","label":"He knows / doesn’t know about the lock","step":"probe"},{"id":"record","label":"Record which combinations were tried","payload":"list","step":"probe"},{"id":"flip","label":"Turn over the next layer","step":"explain"},{"id":"apply","label":"Submit an example","payload":"record","step":"apply"},{"id":"note","label":"Write what you understood","payload":"fields","step":"save"},{"id":"next","label":"Next"},{"id":"back","label":"Back"}],"state_transitions":[{"from":"observe","on":"seen","inc":{"seen":1}},{"from":"judge","on":"judge","set":{"judge1":"$value"}},{"from":"probe","on":"toggle-lock","set":{"locked":"$value","last":"lock"}},{"from":"probe","on":"toggle-wish","set":{"wish":"$value","last":"wish"}},{"from":"probe","on":"toggle-knows","set":{"knows":"$value","last":"knows"}},{"from":"probe","on":"record","set":{"tried":"$value"}},{"from":"rejudge","on":"judge","set":{"judge2":"$value"}},{"from":"explain","on":"flip","inc":{"layers":1}},{"from":"apply","on":"apply","set":{"apply":"$value"}},{"from":"save","on":"note","merge":"$value"},{"from":"*","on":"next","advance":1},{"from":"*","on":"back","advance":-1}],"completion_criteria":{"observe":{"gte":{"seen":1}},"judge":{"truthy":["judge1"]},"probe":{"gte":{"tried.length":3}},"rejudge":{"truthy":["judge2"]},"explain":{"gte":{"layers":3}},"apply":{"truthy":["apply"]},"save":{"truthy":[]},"interaction":{"all":[{"truthy":["judge1","judge2","apply"]},{"gte":{"layers":3}}]}},"feedback_rules":[{"step":"observe","when":{"gte":{"seen":1}},"say":"He does exactly what he wants — but notice the lock he doesn’t know about.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"yes"}},"say":"You say he is free: he does what he wants. Keep that — next, change the conditions.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"no"}},"say":"You say he isn’t free, even though he is doing what he wants. What exactly is missing? Let’s look.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"unsure"}},"say":"‘Partly’ is a good instinct — the next step separates two things that both get called freedom.","tone":"info"},{"step":"probe","when":{"all":[{"eq":{"locked":true}},{"eq":{"wish":"stay"}}]},"say":"Locked and wanting to stay: he acts voluntarily, but he could not leave if he wanted to.","tone":"info"},{"step":"probe","when":{"all":[{"eq":{"locked":true}},{"eq":{"wish":"leave"}}]},"say":"Now he wants to leave and can’t. The lock was there all along — wanting to leave only made it visible.","tone":"warn"},{"step":"probe","when":{"all":[{"eq":{"locked":false}},{"eq":{"wish":"stay"}}]},"say":"Unlocked and staying: he does what he wants and could do otherwise. Both gauges are full.","tone":"good"},{"step":"probe","when":{"all":[{"eq":{"locked":false}},{"eq":{"wish":"leave"}}]},"say":"Unlocked and wanting to leave: he walks out. Doing what he wants and being able to are the same here.","tone":"good"},{"step":"probe","when":{"eq":{"last":"knows"}},"say":"Knowing about the lock changes what he feels, not whether he could leave.","tone":"info"},{"step":"rejudge","when":{"all":[{"eq":{"judge1":"yes"}},{"eq":{"judge2":"no"}}]},"say":"You changed your mind: staying voluntarily turned out to be different from being free to leave.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"no"}},"say":"This is Locke’s answer: he stays voluntarily, but he is not at liberty to leave.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"yes"}},"say":"You still call him free. Many people do — in the sense that he acts on his own wishes. The next step names that sense and the other one.","tone":"info"},{"step":"rejudge","when":{"eq":{"judge2":"unsure"}},"say":"‘Partly’ fits: he is free in one sense and not in another.","tone":"info"}],"content":{"layers":[{"id":"locke","title":"① Locke: voluntary ≠ free","tag":"Philosophical claim · historical","body":"Locke used this kind of case to separate two things. Staying is voluntary — he prefers it. But liberty, for Locke, is the power to act or not act as one chooses; since he could not leave if he chose to, he is not at liberty to leave.","source":"John Locke, An Essay Concerning Human Understanding (1689), Book II, ch. xxi (the locked-room example) — check the section against your edition","maps_to":"The lock gauge vs. the wish gauge","kind":"interpretation"},{"id":"berlin","title":"② Berlin: two concepts of liberty","tag":"Philosophical analysis · political","body":"Isaiah Berlin distinguished negative liberty — how far others leave me unobstructed (the lock) — from positive liberty — being my own master, acting from my own reasons (the wish). The room shows them coming apart.","source":"Isaiah Berlin, “Two Concepts of Liberty” (1958)","maps_to":"Locked door = negative liberty · own wish = positive liberty","kind":"interpretation"},{"id":"open","title":"③ What the room leaves open","tag":"Open question","body":"The room is about acting freely. Whether his wish itself is free — whether anything he wants is ultimately up to him — is the separate free-will debate (determinism, compatibilism, libertarianism). The experiment does not answer it.","source":"See: free will and determinism (e.g. Stanford Encyclopedia of Philosophy, “Free Will”)","maps_to":"Not shown by the gauges","kind":"open-question"}],"map_note":"The room separates two senses of freedom; it is a thinking tool, not evidence for any one theory of freedom."},"result_schema":{"interaction_id":"string","framework_id":"string","version":"string","query_id":"string|null","startedAt":"number","finishedAt":"number","completed":"boolean","judge1":"yes|no|unsure","judge2":"yes|no|unsure","changedMind":"boolean","probes":"object","apply":"{ situation, voluntary, couldOtherwise, kind, note }","note":"string","question":"string","log":"[]"},"content_review_status":"pending"},"labs/plato-cave.json":{"format":"minest.micro/1","interaction_type":"thought-experiment","version":"0.1.0","interaction_id":"plato-cave","framework_id":"plato","fits":["philosophy.epistemology","philosophy.metaphysics","philosophy"],"title":"Plato’s Cave","subtitle":"Shadows, light and where you stand","learning_objective":"Tell apart what you see from what makes you believe it: shadows depend on a light, an object and where you stand. Connect this to Plato’s distinction between opinion and knowledge.","disclaimer":"A teaching version of a philosophical allegory — it is not a scientific experiment about perception and does not prove Plato’s theory of Forms.","steps":[{"id":"observe","title":"Observe","scene":"cave","prompt":"You are chained facing a wall. Shapes move across it. This is all you have ever seen."},{"id":"judge","title":"Judge","scene":"judge","prompt":"What is the shape moving on the wall?","field":"judge1","options":[["horse","A horse"],["shadow","A shadow of something"],["unsure","Not sure"]]},{"id":"probe","title":"Experiment","scene":"cave-probe","prompt":"Move the fire, move the object, turn around, go outside. Watch what happens to the shadow."},{"id":"rejudge","title":"Judge again","scene":"judge","prompt":"Could the shadow alone tell you what the horse is really like?","field":"judge2","options":[["yes","Yes"],["partly","Only partly"],["no","No"]]},{"id":"explain","title":"Explain","scene":"layers","prompt":"Three ways to read what you saw."},{"id":"apply","title":"Apply","scene":"apply-fields","prompt":"Find a ‘shadow’ in your own life."},{"id":"save","title":"Keep","scene":"save-generic","prompt":"Keep what you understood and what you still wonder about."}],"initial_state":{"step":"observe","seen":0,"judge1":null,"judge2":null,"fireX":380,"fireY":120,"objX":240,"view":"wall","tried":[],"layers":0,"apply":null,"note":"","question":"","last":null,"saved":false},"user_actions":[{"id":"seen","label":"Watch the wall","step":"observe"},{"id":"judge","label":"Choose an answer","payload":"value","step":["judge","rejudge"]},{"id":"move-fire","label":"Move the fire","payload":"value","step":"probe"},{"id":"move-object","label":"Move the object","payload":"value","step":"probe"},{"id":"face-wall","label":"Face the wall","step":"probe"},{"id":"turn-around","label":"Turn around","step":"probe"},{"id":"go-outside","label":"Go outside","step":"probe"},{"id":"record","label":"Record what was tried","payload":"list","step":"probe"},{"id":"flip","label":"Turn over the next layer","step":"explain"},{"id":"apply","label":"Submit an example","payload":"record","step":"apply"},{"id":"note","label":"Write what you understood","payload":"fields","step":"save"},{"id":"next","label":"Next"},{"id":"back","label":"Back"}],"state_transitions":[{"from":"observe","on":"seen","inc":{"seen":1}},{"from":"judge","on":"judge","set":{"judge1":"$value"}},{"from":"probe","on":"move-fire","set":{"fireY":"$value","last":"fire"}},{"from":"probe","on":"move-object","set":{"objX":"$value","last":"object"}},{"from":"probe","on":"face-wall","set":{"view":"wall","last":"wall"}},{"from":"probe","on":"turn-around","set":{"view":"fire","last":"turn"}},{"from":"probe","on":"go-outside","set":{"view":"outside","last":"outside"}},{"from":"probe","on":"record","set":{"tried":"$value"}},{"from":"rejudge","on":"judge","set":{"judge2":"$value"}},{"from":"explain","on":"flip","inc":{"layers":1}},{"from":"apply","on":"apply","set":{"apply":"$value"}},{"from":"save","on":"note","merge":"$value"},{"from":"*","on":"next","advance":1},{"from":"*","on":"back","advance":-1}],"completion_criteria":{"observe":{"gte":{"seen":1}},"judge":{"truthy":["judge1"]},"probe":{"gte":{"tried.length":3}},"rejudge":{"truthy":["judge2"]},"explain":{"gte":{"layers":3}},"apply":{"truthy":["apply"]},"save":{"truthy":[]},"interaction":{"all":[{"truthy":["judge1","judge2","apply"]},{"gte":{"layers":3}}]}},"feedback_rules":[{"step":"observe","when":{"gte":{"seen":1}},"say":"To you, these shapes are simply the world. You have nothing else to compare them with.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"horse"}},"say":"That is what anyone in the chains would say. Keep it — next, look at what makes the shape.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"shadow"}},"say":"You already suspect there is more behind the wall. Let’s find out what.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"unsure"}},"say":"Not sure is fair — you have only ever seen the wall.","tone":"info"},{"step":"probe","when":{"eq":{"last":"fire"}},"say":"Move the light and the same object casts a different shadow — higher, lower, stretched.","tone":"info"},{"step":"probe","when":{"eq":{"last":"object"}},"say":"Closer to the fire, the shadow grows; closer to the wall, it shrinks. The object itself did not change size.","tone":"info"},{"step":"probe","when":{"eq":{"last":"turn"}},"say":"Turned around, you see the fire and the carved figures. The ‘horse’ was a puppet — the shadow of a copy.","tone":"good"},{"step":"probe","when":{"eq":{"last":"outside"}},"say":"Outside, in daylight, you see a real horse. In the allegory this stands for understanding what things truly are.","tone":"good"},{"step":"probe","when":{"eq":{"last":"wall"}},"say":"Back facing the wall: the shadows look exactly as before — but now you know what makes them.","tone":"info"},{"step":"rejudge","when":{"eq":{"judge2":"no"}},"say":"Right — the shadow depends on the light, the puppet and your position. It can’t show what a horse is.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"partly"}},"say":"Partly: the outline carries some information, but you couldn’t know which parts — without leaving the chains.","tone":"info"},{"step":"rejudge","when":{"eq":{"judge2":"yes"}},"say":"Think back: the same puppet gave tall, short and stretched shadows. Which one is ‘the horse’?","tone":"warn"}],"content":{"layers":[{"id":"allegory","title":"① What the allegory shows","tag":"Allegory · Republic VII","body":"Prisoners who have only seen shadows take them for reality. One is freed, turns to the fire, climbs out and finally sees things in sunlight. Returning, he is not believed.","source":"Plato, Republic VII, 514a–520a — check the line numbers against your edition","maps_to":"The wall · turning around · going outside","kind":"summary"},{"id":"divided","title":"② Opinion and knowledge","tag":"Philosophical claim","body":"Plato separates opinion (about appearances) from knowledge (of what things truly are, which he calls Forms). The Divided Line in Republic VI orders these levels: images, things, then mathematics and the Forms. The ascent from the cave is often read alongside it, and the sun stands for the Form of the Good.","source":"Plato, Republic VI, 509d–511e (the Divided Line)","maps_to":"From ‘what I see’ to ‘why I believe it’","kind":"interpretation"},{"id":"limits","title":"③ What it is not","tag":"Reading carefully","body":"The cave is a philosophical allegory about knowledge and education, not a scientific account of vision. Plato’s theory of Forms is one position; many philosophers reject it. The experiment helps you ask “what makes me believe this?” — it does not show that Forms exist.","source":"See e.g. Stanford Encyclopedia of Philosophy, “Plato” and “Plato’s Middle Period Metaphysics and Epistemology”","maps_to":"The whole experiment","kind":"interpretation"}],"map_note":"Keep two questions apart: what did I see? — and why do I believe it?","apply_fields":[{"id":"saw","label":"Something I believed because of how it looked","placeholder":"e.g. a photo online","required":true},{"id":"why","label":"Why I believed it","placeholder":"e.g. it looked real","required":true},{"id":"check","label":"How I could check what is really behind it","placeholder":"e.g. find the original source"}],"apply_case":"saw","apply_ok":"Kept as your own example."},"result_schema":{"interaction_id":"string","framework_id":"string","version":"string","completed":"boolean","judge1":"string","judge2":"string","changedMind":"boolean","probes":"object","apply":"{ saw, why, check, case }","note":"string","question":"string","log":"[]"},"content_review_status":"pending"},"labs/aristotle-causes.json":{"format":"minest.micro/1","interaction_type":"thought-experiment","version":"0.1.0","interaction_id":"aristotle-causes","framework_id":"aristotle","fits":["philosophy.metaphysics","philosophy.epistemology.causation","philosophy"],"title":"Aristotle’s Four Causes","subtitle":"Four kinds of ‘because’","learning_objective":"See that ‘why does this exist?’ has four different kinds of answer in Aristotle — material, formal, efficient and final cause — and that they are kinds of explanation, not modern forces or variables.","disclaimer":"A teaching version of Aristotle’s four causes. It shows how he sorted explanations; it does not claim that every thing has a purpose.","steps":[{"id":"observe","title":"Choose","scene":"causes-pick","prompt":"Pick a thing to explain."},{"id":"judge","title":"Judge","scene":"judge","prompt":"Why does it exist? Choose the one best answer.","field":"judge1","options":[["made","Because of what it’s made of"],["maker","Because someone or something made it"],["for","Because of what it’s for"],["shape","Because of its form"]]},{"id":"probe","title":"Experiment","scene":"causes-bench","prompt":"Tap a card, then tap the kind of cause it answers. Two cards don’t belong at all."},{"id":"rejudge","title":"Judge again","scene":"judge","prompt":"How many ‘becauses’ does a full explanation need, for Aristotle?","field":"judge2","options":[["one","One — the real one"],["four","Four kinds, each answering a different question"],["depends","It depends on the thing"]]},{"id":"explain","title":"Explain","scene":"layers","prompt":"What the four causes are — and are not."},{"id":"apply","title":"Apply","scene":"apply-fields","prompt":"Explain something of your own with all four."},{"id":"save","title":"Keep","scene":"save-generic","prompt":"Keep what you understood and what you still wonder about."}],"initial_state":{"step":"observe","obj":null,"judge1":null,"judge2":null,"placed":{},"correct":0,"wrongs":0,"lastResult":null,"layers":0,"apply":null,"note":"","question":"","last":null,"saved":false},"user_actions":[{"id":"pick","label":"Pick a thing","payload":"value","step":"observe"},{"id":"judge","label":"Choose an answer","payload":"value","step":["judge","rejudge"]},{"id":"place","label":"Place a card on a cause","payload":"record","step":"probe"},{"id":"flip","label":"Turn over the next layer","step":"explain"},{"id":"apply","label":"Submit an example","payload":"record","step":"apply"},{"id":"note","label":"Write what you understood","payload":"fields","step":"save"},{"id":"next","label":"Next"},{"id":"back","label":"Back"}],"state_transitions":[{"from":"observe","on":"pick","set":{"obj":"$value","placed":{},"correct":0}},{"from":"judge","on":"judge","set":{"judge1":"$value"}},{"from":"probe","on":"place","merge":"$value"},{"from":"rejudge","on":"judge","set":{"judge2":"$value"}},{"from":"explain","on":"flip","inc":{"layers":1}},{"from":"apply","on":"apply","set":{"apply":"$value"}},{"from":"save","on":"note","merge":"$value"},{"from":"*","on":"next","advance":1},{"from":"*","on":"back","advance":-1}],"completion_criteria":{"observe":{"truthy":["obj"]},"judge":{"truthy":["judge1"]},"probe":{"gte":{"correct":4}},"rejudge":{"truthy":["judge2"]},"explain":{"gte":{"layers":3}},"apply":{"truthy":["apply"]},"save":{"truthy":[]},"interaction":{"all":[{"truthy":["judge1","judge2","apply"]},{"gte":{"layers":3}},{"gte":{"correct":4}}]}},"feedback_rules":[{"step":"observe","when":{"truthy":["obj"]},"say":"Good. Now try to give the single reason it exists.","tone":"info"},{"step":"judge","when":{"truthy":["judge1"]},"say":"You picked one kind of answer. Aristotle would say the others are also answers — to different questions.","tone":"info"},{"step":"probe","when":{"eq":{"lastResult":"right"}},"say":"Yes — that card answers that kind of ‘why’.","tone":"good"},{"step":"probe","when":{"eq":{"lastResult":"wrong"}},"say":"That card answers a different kind of ‘why’. Ask: made of? form? made by? for what?","tone":"warn"},{"step":"probe","when":{"eq":{"lastResult":"none"}},"say":"That one isn’t any of the four causes — it comes from modern science.","tone":"warn"},{"step":"probe","when":{"gte":{"correct":4}},"say":"All four in place. Each answers a different question about the same thing.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"four"}},"say":"That is Aristotle’s view: a full explanation can involve all four kinds of cause.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"one"}},"say":"Today we often look for one cause — but Aristotle counts four kinds, each answering its own question.","tone":"warn"},{"step":"rejudge","when":{"eq":{"judge2":"depends"}},"say":"Partly right: for natural things, form and purpose often coincide — but the four questions can always be asked.","tone":"info"}],"content":{"objects":{"statue":{"label":"A bronze statue","note":"Aristotle’s own example","cards":[{"id":"bronze","text":"The bronze it is cast from","slot":"material"},{"id":"shape","text":"The shape of the figure it shows","slot":"formal"},{"id":"sculptor","text":"The sculptor’s skill and work","slot":"efficient"},{"id":"honour","text":"To honour someone / to be admired","slot":"final"},{"id":"gravity","text":"Gravity (a physical force)","slot":"none","why":"A modern physical force — not one of Aristotle’s four kinds of explanation."},{"id":"variable","text":"An experimental variable you could change","slot":"none","why":"An idea from modern experimental method, not one of the four causes."}]},"house":{"label":"A house","note":"","cards":[{"id":"bricks","text":"Bricks, wood and stone","slot":"material"},{"id":"plan","text":"The plan — walls, roof, rooms arranged as a house","slot":"formal"},{"id":"builder","text":"The builders","slot":"efficient"},{"id":"shelter","text":"To shelter people","slot":"final"},{"id":"gravity","text":"Gravity (a physical force)","slot":"none","why":"A modern physical force — not one of Aristotle’s four kinds of explanation."},{"id":"variable","text":"An experimental variable you could change","slot":"none","why":"An idea from modern experimental method, not one of the four causes."}]},"chair":{"label":"A chair","note":"","cards":[{"id":"wood","text":"Wood and nails","slot":"material"},{"id":"chairshape","text":"A seat raised on legs with a back","slot":"formal"},{"id":"carpenter","text":"The carpenter","slot":"efficient"},{"id":"sit","text":"For sitting on","slot":"final"},{"id":"gravity","text":"Gravity (a physical force)","slot":"none","why":"A modern physical force — not one of Aristotle’s four kinds of explanation."},{"id":"variable","text":"An experimental variable you could change","slot":"none","why":"An idea from modern experimental method, not one of the four causes."}]},"acorn":{"label":"An oak tree","note":"a natural thing","cards":[{"id":"cells","text":"Wood, sap, leaves","slot":"material"},{"id":"oakform","text":"The form of an oak — what makes it an oak and not a pine","slot":"formal"},{"id":"parent","text":"A parent oak (through the acorn)","slot":"efficient"},{"id":"flourish","text":"To grow into a mature, flourishing oak","slot":"final"},{"id":"gravity","text":"Gravity (a physical force)","slot":"none","why":"A modern physical force — not one of Aristotle’s four kinds of explanation."},{"id":"variable","text":"An experimental variable you could change","slot":"none","why":"An idea from modern experimental method, not one of the four causes."}]}},"slots":[{"id":"material","label":"Material cause","q":"What is it made of?"},{"id":"formal","label":"Formal cause","q":"What form makes it what it is?"},{"id":"efficient","label":"Efficient cause","q":"What brought it about?"},{"id":"final","label":"Final cause","q":"What is it for?"}],"layers":[{"id":"four","title":"① Four kinds of explanation","tag":"Aristotle · Physics II.3","body":"For Aristotle, knowing a thing means knowing its ‘why’, and there are four kinds: what it is made of (material), the form or structure that makes it what it is (formal), what brought it about (efficient), and what it is for (final).","source":"Aristotle, Physics II.3; Metaphysics V.2 (Δ.2) — check against your edition","maps_to":"The four slots","kind":"summary"},{"id":"nature","title":"② Purpose in nature","tag":"Philosophical claim · debated","body":"Aristotle applied final causes to natural things too: an acorn grows towards being an oak. For living things, form and purpose often coincide. Whether nature really has purposes (teleology) is one of the most debated parts of his view.","source":"Aristotle, Physics II.8","maps_to":"The oak tree","kind":"interpretation"},{"id":"modern","title":"③ Not modern forces","tag":"Reading carefully","body":"The four causes are kinds of explanation, not physical forces and not experimental variables. Modern science mostly keeps the efficient cause (and the material), and talks about function in its own terms. That is why ‘gravity’ and ‘a variable’ had no slot.","source":"See e.g. Stanford Encyclopedia of Philosophy, “Aristotle on Causality”","maps_to":"The two cards with no slot","kind":"interpretation"}],"map_note":"One thing, four questions: made of? form? made by? for what?","apply_fields":[{"id":"thing","label":"A thing of my own","placeholder":"e.g. my school bag","required":true},{"id":"material","label":"Material cause — made of","required":true},{"id":"formal","label":"Formal cause — its form","required":true},{"id":"efficient","label":"Efficient cause — made by","required":true},{"id":"final","label":"Final cause — for","required":true}],"apply_case":"thing","apply_ok":"Kept as your own analysis."},"result_schema":{"interaction_id":"string","framework_id":"string","version":"string","completed":"boolean","judge1":"string","judge2":"string","changedMind":"boolean","probes":"{ obj, placed, correct, wrongs }","apply":"{ thing, material, formal, efficient, final, case }","note":"string","question":"string","log":"[]"},"content_review_status":"pending"},"labs/hegel-concept.json":{"format":"minest.micro/1","interaction_type":"thought-experiment","version":"0.1.0","interaction_id":"hegel-concept","framework_id":"hegel","fits":["philosophy.metaphysics","philosophy.logic","philosophy"],"title":"Hegel: Being, Nothing, Becoming","subtitle":"A concept that moves on its own","learning_objective":"Follow the opening move of Hegel’s Logic: pure being, without any determination, cannot be told apart from nothing — and their truth is the movement of each into the other, becoming. See why this is not a thesis–antithesis–synthesis template.","disclaimer":"A simplified reading aid for the opening of Hegel’s Science of Logic, pending content review. Hegel scholars read this passage in different ways.","steps":[{"id":"observe","title":"Strip away","scene":"hegel-strip","prompt":"Here is something with many features. Remove every feature, one by one."},{"id":"judge","title":"Judge","scene":"judge","prompt":"What is left — something, or nothing?","field":"judge1","options":[["something","Something: pure being"],["nothing","Nothing"],["unsure","I can’t tell"]]},{"id":"probe","title":"Experiment","scene":"hegel-compare","prompt":"Try to name a difference between pure being and pure nothing. Then watch the two."},{"id":"rejudge","title":"Judge again","scene":"judge","prompt":"Pure being and pure nothing — what is their relation?","field":"judge2","options":[["same","They can’t be told apart"],["different","They are simply different"],["moving","Each passes into the other"]]},{"id":"explain","title":"Explain","scene":"layers","prompt":"What Hegel claims — and what he doesn’t."},{"id":"apply","title":"Apply","scene":"apply-fields","prompt":"Follow a concept of your own through an inner tension."},{"id":"save","title":"Keep","scene":"save-generic","prompt":"Keep what you understood and what you still wonder about."}],"initial_state":{"step":"observe","left":7,"judge1":null,"judge2":null,"tried":[],"watched":false,"layers":0,"apply":null,"note":"","question":"","last":null,"saved":false},"user_actions":[{"id":"strip","label":"Remove a feature","payload":"record","step":"observe"},{"id":"judge","label":"Choose an answer","payload":"value","step":["judge","rejudge"]},{"id":"try-diff","label":"Try a difference","payload":"record","step":"probe"},{"id":"watch","label":"Watch being and nothing","step":"probe"},{"id":"flip","label":"Turn over the next layer","step":"explain"},{"id":"apply","label":"Submit an example","payload":"record","step":"apply"},{"id":"note","label":"Write what you understood","payload":"fields","step":"save"},{"id":"next","label":"Next"},{"id":"back","label":"Back"}],"state_transitions":[{"from":"observe","on":"strip","merge":"$value"},{"from":"judge","on":"judge","set":{"judge1":"$value"}},{"from":"probe","on":"try-diff","merge":"$value"},{"from":"probe","on":"watch","set":{"watched":true,"last":"watch"}},{"from":"rejudge","on":"judge","set":{"judge2":"$value"}},{"from":"explain","on":"flip","inc":{"layers":1}},{"from":"apply","on":"apply","set":{"apply":"$value"}},{"from":"save","on":"note","merge":"$value"},{"from":"*","on":"next","advance":1},{"from":"*","on":"back","advance":-1}],"completion_criteria":{"observe":{"eq":{"left":0}},"judge":{"truthy":["judge1"]},"probe":{"all":[{"gte":{"tried.length":2}},{"truthy":["watched"]}]},"rejudge":{"truthy":["judge2"]},"explain":{"gte":{"layers":3}},"apply":{"truthy":["apply"]},"save":{"truthy":[]},"interaction":{"all":[{"truthy":["judge1","judge2","apply"]},{"gte":{"layers":3}}]}},"feedback_rules":[{"step":"observe","when":{"eq":{"left":0}},"say":"Every feature is gone. What remains has no ‘what’ at all — Hegel calls it pure being.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"something"}},"say":"You say something remains: pure being. Next: can you say how it differs from nothing?","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"nothing"}},"say":"You say nothing remains. Hold on — next you’ll see why Hegel finds both answers right.","tone":"info"},{"step":"judge","when":{"eq":{"judge1":"unsure"}},"say":"‘I can’t tell’ is exactly where Hegel’s Logic begins.","tone":"good"},{"step":"probe","when":{"eq":{"last":"diff"}},"say":"Each difference you name brings back a feature you removed.","tone":"warn"},{"step":"probe","when":{"eq":{"last":"watch"}},"say":"Being vanishes into nothing, nothing into being — ceasing-to-be and coming-to-be. Hegel calls this movement becoming.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"moving"}},"say":"That is close to Hegel: their truth is the movement of each into the other — becoming.","tone":"good"},{"step":"rejudge","when":{"eq":{"judge2":"same"}},"say":"Hegel agrees they can’t be told apart — and adds that they are still not simply the same: each passes over into the other.","tone":"info"},{"step":"rejudge","when":{"eq":{"judge2":"different"}},"say":"Try to say how — every difference you named brought back a feature.","tone":"warn"}],"content":{"features":["Red","Round","Heavy","Here","Now","An apple","One"],"differences":[{"id":"exists","text":"Being exists; nothing doesn’t.","reply":"‘Exists’ already says more than pure being: it adds a determination (being there, being something). Pure being has none."},{"id":"content","text":"Being has some content; nothing is empty.","reply":"Which content? Every content you name is a determination you just stripped away. Pure being is just as empty."},{"id":"think","text":"I can think of being, but not of nothing.","reply":"Try it: thinking pure being, with no ‘what’ at all, is thinking nothing in particular — the same emptiness."},{"id":"positive","text":"Being is positive, nothing is negative.","reply":"‘Positive’ and ‘negative’ are themselves determinations. Without them, the two can’t be told apart."}],"layers":[{"id":"opening","title":"① Being, nothing, becoming","tag":"Hegel · Science of Logic","body":"Hegel’s Logic begins with pure being: with no determination at all, it is ‘in fact nothing’. Pure nothing, thought through, is the same empty thought. Their truth is the movement in which each has already passed into the other — becoming, as coming-to-be and ceasing-to-be.","source":"Hegel, Science of Logic (1812/1832), Doctrine of Being, ch. 1; Encyclopaedia Logic §§86–88 — check against your edition","maps_to":"Stripping the features · watching the two","kind":"interpretation"},{"id":"notriad","title":"② Not thesis–antithesis–synthesis","tag":"Reading carefully","body":"Hegel did not present his method as ‘thesis–antithesis–synthesis’; that formula is linked more with Fichte and later popular summaries. The point is that a concept, thought through, turns into another by itself (immanently) — not that a third idea is added from outside.","source":"See e.g. Stanford Encyclopedia of Philosophy, “Hegel’s Dialectics”","maps_to":"The differences that kept failing","kind":"interpretation"},{"id":"debate","title":"③ An open debate","tag":"Interpretation · contested","body":"What this opening proves, and how to read it, is debated among scholars. This experiment is a reading aid: it lets you feel the move, not decide what it means for all of Hegel.","source":"Pending content review","maps_to":"The whole experiment","kind":"open-question"}],"map_note":"Watch for concepts that change by thinking them through — not because someone adds a new idea.","apply_fields":[{"id":"concept","label":"A concept I hold","placeholder":"e.g. freedom, friendship, fairness","required":true},{"id":"first","label":"What I first thought it meant","required":true},{"id":"tension","label":"A tension inside that meaning","required":true},{"id":"after","label":"What it became — what is kept, what changed"}],"apply_case":"concept","apply_ok":"Kept as your own analysis."},"result_schema":{"interaction_id":"string","framework_id":"string","version":"string","completed":"boolean","judge1":"string","judge2":"string","changedMind":"boolean","probes":"{ left, tried, watched }","apply":"{ concept, first, tension, after, case }","note":"string","question":"string","log":"[]"},"content_review_status":"pending"},"i18n/zh.json":{"format":"minest.i18n/1","lang":"zh-CN","notice":"Chinese for the toolkit's own content (templates, models, experiments, framework texts). Philosophy wording follows the source content's review status.","strings":{"Concept analysis":"概念分析","Any concept you want to understand: what it means, its kinds, who thought about it, where it applies, what argues against it.":"任何你想理解的概念：它的含义、类型、有哪些思想家思考过它、适用于哪里，以及有哪些反对它的论证。","A general structure — fill in what fits, delete what doesn’t.":"一个通用结构——适用的就填写，不适用的就删掉。","Definition":"定义","Core questions":"核心问题","Kinds / types":"种类 / 类型","Related theories":"相关理论","Thinkers":"思想家","Applications":"应用","Disputes & counterexamples":"争议与反例","My understanding":"我的理解","Problem analysis":"问题分析","A real problem or decision: what is going on, why, who is involved, and what could be done.":"一个真实的问题或决定：发生了什么、为什么、涉及哪些人、可以做些什么。","Keeps causes as possibilities until you have evidence.":"在掌握证据之前，先把原因当作可能性看待。","The problem in one sentence":"一句话概括问题","Possible causes":"可能的原因","Who is involved":"涉及哪些人","Constraints":"限制条件","Options":"可选方案","Evidence I still need":"我还需要的证据","Next step":"下一步","Aristotle’s four causes":"亚里士多德的四因说","Understanding a thing or event by asking four kinds of ‘why’: what it is made of, what form makes it what it is, what brought it about, and what it is for.":"通过追问四种“为什么”来理解一个事物或事件：它由什么构成、什么形式使它成为它所是、什么促成了它、它是为了什么。","The four causes are four kinds of explanation, not four modern physical forces or experimental variables.":"四因是四种解释方式，而不是四种现代物理力或实验变量。","Material cause — what it is made of":"质料因——它由什么构成","Formal cause — the form / structure that makes it what it is":"形式因——使它成为它所是的形式 / 结构","Efficient cause — what brought it about":"动力因——什么促成了它","Final cause — what it is for":"目的因——它是为了什么","Platonic questioning (seeking a definition)":"柏拉图式追问（寻求定义）","Testing a definition the way Plato’s dialogues do: propose it, look for examples and counterexamples, then revise.":"像柏拉图对话录那样检验一个定义：提出定义，寻找例子和反例，然后修正。","A way of questioning inspired by the dialogues — the dialogues often end without a final definition, and so may you.":"一种受对话录启发的追问方式——对话录常常没有得出最终定义，你也可以如此。","First definition":"初始定义","Examples that fit":"符合的例子","Counterexamples":"反例","Revised definition":"修正后的定义","What it is not":"它不是什么","Still open":"仍待解决","Kant-inspired analysis of a judgment":"受康德启发的判断分析","Looking at a judgment you make: what comes from experience, what your mind brings to it, what evidence supports it, and where that kind of knowing stops.":"审视你做出的一个判断：哪些来自经验，哪些是你的心灵带入的，有什么证据支持它，以及这种认识方式的界限在哪里。","A Minest prompt inspired by Kant’s distinctions (experience / the mind’s own forms / limits) — not Kant’s own method, and not a test of his theory.":"一个受康德区分（经验 / 心灵自身的形式 / 界限）启发的 Minest 提示——并非康德本人的方法，也不是对其理论的检验。","The judgment":"这个判断","What is given in experience":"经验中给予的是什么","What my mind brings (order, concepts, expectations)":"我的心灵带入了什么（秩序、概念、预期）","Evidence for it":"支持它的证据","What I can’t know this way":"用这种方式我无法知道的是什么","Hegel-inspired concept development":"受黑格尔启发的概念发展","Following how a concept changes: its first meaning, a tension inside it, what is given up, and the richer understanding that keeps what was true.":"追踪一个概念如何变化：它最初的含义、它内部的张力、被舍弃的部分，以及保留了其中真理的更丰富的理解。","Do not reduce Hegel to a thesis–antithesis–synthesis template. This is a reading aid for tracing a concept’s internal tensions; it needs a content review before release.":"不要把黑格尔简化为“正题—反题—合题”的模板。这是一个用于追踪概念内在张力的阅读辅助工具；发布前需要经过内容审核。","First understanding":"最初的理解","A tension inside it":"它内部的张力","What gets given up":"被舍弃的部分","What is kept":"被保留的部分","Richer understanding":"更丰富的理解","Historical context":"历史背景","Systems view":"系统视角","Seeing something as a system: its parts, how they connect, the loops that keep it going, its boundary and purpose, and where a change would matter most.":"把某个事物看作一个系统：它的组成部分、它们如何相互连接、维持它运转的反馈环、它的边界和目的，以及在哪里做出改变最有效。","A map of a system is always simpler than the system.":"系统图总是比系统本身更简单。","Parts":"组成部分","How they connect":"它们如何连接","Feedback loops":"反馈环","Boundary — what’s outside":"边界——外部有什么","Purpose":"目的","Leverage points":"杠杆点","Define":"定义","What is it?":"它是什么？","Compare":"比较","How do views differ?":"观点有何不同？","Cause":"原因","Why does it happen?":"为什么会发生？","Value":"价值","Is it good or right?":"它是好的或正确的吗？","System":"系统","How do parts interact?":"各部分如何相互作用？","Experience":"体验","Try it in an experiment":"在实验中试一试","Cause-and-effect analysis":"因果分析","Coming first is not causing. Check common causes, reverse causation and chance, and ask what evidence would settle it.":"先发生不等于导致。检查共同原因、反向因果和偶然性，并思考什么证据能解决这个问题。","Good for empirical claims. It does not answer philosophical questions about what causation is.":"适用于经验性主张。它不回答“因果关系是什么”这类哲学问题。","The claim":"主张","Write the cause-and-effect claim: A leads to B.":"写下这个因果主张：A 导致 B。","Check it":"检查","Which of these could be going on?":"可能是以下哪种情况？","I only know A came before B":"我只知道 A 发生在 B 之前","A third factor could cause both":"可能有第三个因素同时导致两者","B could cause A":"可能是 B 导致 A","It could be chance":"可能是偶然","Someone could change A and watch B":"有人可以改变 A 并观察 B","Other explanations":"其他解释","List other things that could explain B.":"列出其他可能解释 B 的因素。","Evidence that would settle it":"能够解决问题的证据","What would you need to see?":"你需要看到什么？","Your judgment":"你的判断","For now, I think…":"目前，我认为……","A probably causes B":"A 很可能导致 B","They are probably only correlated":"它们很可能只是相关","Not sure yet":"还不确定","Claim":"主张","Possible issues":"可能的问题","Evidence needed":"所需证据","Judgment":"判断","You only know the order but judged it causal — order alone is not evidence.":"你只知道先后顺序，却判断为因果关系——仅凭顺序不能构成证据。","You named other explanations and the evidence that would decide — that is the core of a causal analysis.":"你提出了其他解释以及能做出判定的证据——这正是因果分析的核心。","Systems thinking (feedback loops)":"系统思维（反馈环）","Outcomes often come from loops: parts that affect each other in circles. Reinforcing loops amplify, balancing loops hold things steady.":"结果往往来自回路：各部分以循环的方式相互影响。增强环会放大变化，平衡环会使事物保持稳定。","A loop diagram is a simplification; real systems have delays and more parts than any sketch.":"回路图是一种简化；真实系统存在延迟，组成部分也比任何草图都多。","List the parts or quantities involved (at least 2).":"列出涉及的组成部分或数量（至少 2 个）。","Links":"连接","Connect parts: when the first goes up, does the second go up (+) or down (−)?":"连接各部分：当第一个增加时，第二个是增加（+）还是减少（−）？","Where to intervene":"干预点","Which link or part would you change, and why?":"你会改变哪个连接或部分？为什么？","Loops found":"发现的回路","Intervention":"干预","Look at the loops below: a loop with an even number of ‘−’ links is reinforcing, an odd number is balancing.":"看看下面的回路：含偶数个“−”连接的回路是增强环，含奇数个的是平衡环。","Incentive analysis":"激励分析","People respond to what they are rewarded and punished for — which may differ from what a rule intends.":"人们会对自己受到的奖励和惩罚做出反应——这可能与规则的本意不同。","People also act from values, habits and identity, not only incentives.":"人们的行为也出于价值观、习惯和身份认同，而不仅仅是激励。","Intended goal":"预期目标","What is the rule or plan supposed to achieve?":"这条规则或计划想要达成什么？","List the people or groups affected.":"列出受影响的个人或群体。","What each actor wants and is rewarded for":"每个行动者想要什么、因什么受到奖励","Fill in what you can.":"尽可能填写。","Wants":"想要","Rewarded for":"因此受奖励","Punished for":"因此受惩罚","Mismatch":"错位","Where does what people are rewarded for differ from the goal?":"人们受奖励的行为在哪些地方与目标不一致？","Goal":"目标","Actors":"行动者","Incentives":"激励","Compare the rows: the same rule can push different actors in different directions.":"比较各行：同一条规则可能把不同的行动者推向不同的方向。","Multiple perspectives":"多元视角","The same issue looks different from different standpoints. Laying them side by side shows what each one notices and misses.":"同一个问题从不同立场看会有所不同。把它们并排放在一起，可以看出每种视角注意到了什么、忽略了什么。","Choosing which perspectives to include already shapes the result.":"选择纳入哪些视角，本身就已经在影响结果。","The issue":"议题","State the issue or question.":"陈述这个议题或问题。","Perspectives":"视角","Add 2–4 standpoints (people, groups or theories).":"添加 2–4 个立场（个人、群体或理论）。","An individual":"个人","Society as a whole":"整个社会","A philosopher’s view":"某位哲学家的观点","Someone who disagrees with me":"与我意见不同的人","What does each perspective see and value?":"每种视角看到了什么、重视什么？","Sees the issue as":"把这个问题看作","Values most":"最重视","Would recommend":"会建议","What I take from this":"我从中得到的启示","Where do they agree or clash, and where do you stand now?":"它们在哪里一致或冲突？你现在的立场是什么？","Issue":"议题","My conclusion":"我的结论","Three or more perspectives — check whether one of them is one you disagree with.":"已有三个或更多视角——检查其中是否有一个是你不同意的。","Socratic definition":"苏格拉底式定义","Propose a definition, test it against examples and counterexamples, and revise it.":"提出一个定义，用例子和反例检验它，然后修正。","Some concepts may not have a neat definition at all; that can be a finding too.":"有些概念可能根本没有简洁的定义；这本身也可以是一个发现。","X is…":"X 是……","Examples":"例子","Cases that fit your definition and really are X.":"符合你的定义、并且确实是 X 的情况。","Cases that fit the definition but are not X — or are X but don’t fit.":"符合定义但不是 X 的情况——或者是 X 却不符合定义的情况。","Improve the definition to handle the counterexamples.":"改进定义，使它能应对这些反例。","Revised":"修正后","You found a counterexample — try revising the definition.":"你发现了一个反例—
