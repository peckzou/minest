—试着修正定义。","Definition revised after a counterexample. You can test the new one again.":"已根据反例修正定义。你可以再次检验新定义。","Necessary & sufficient conditions":"必要条件与充分条件","A necessary condition must hold for something to be X; a sufficient condition guarantees it is X. Test them on cases.":"必要条件是某物成为 X 必须满足的条件；充分条件则保证它一定是 X。用具体情况来检验它们。","Many everyday concepts work by family resemblance rather than strict conditions.":"许多日常概念依靠家族相似性运作，而不是严格的条件。","Necessary conditions":"必要条件","Without these, it can’t be X.":"没有这些，它就不可能是 X。","Sufficient conditions":"充分条件","If these hold, it is definitely X.":"如果满足这些，它就一定是 X。","Test cases":"测试案例","Add cases; mark whether they meet your conditions and whether they really are X.":"添加案例；标记它们是否满足你的条件，以及它们是否真的是 X。","Meets my conditions":"满足我的条件","Really is X":"真的是 X","Necessary":"必要","Sufficient":"充分","Cases":"案例","At least one case doesn’t match — your conditions need another look.":"至少有一个案例对不上——你的条件需要再检查一下。","Before ≠ Because":"先后 ≠ 因果","Two lamps, a house and a ship":"两盏灯、一座房子和一艘船","Tell three things apart: (1) the order in which events happen; (2) empirical judgments of cause (Hume: habit of association; modern causal inference: intervention and ruling out common causes); (3) Kant’s philosophical claim that causality is a category of the understanding — a condition for experiencing an objective order in time.":"区分三件事：(1) 事件发生的先后顺序；(2) 关于原因的经验判断（休谟：联想的习惯；现代因果推断：干预并排除共同原因）；(3) 康德的哲学主张——因果性是知性的一个范畴，是经验到时间中客观顺序的条件。","A teaching analogy to help understand Kant — it does not prove or test his transcendental philosophy.":"这是帮助理解康德的教学类比——它并不证明或检验他的先验哲学。","Observe":"观察","Watch the two lamps: A lights, then B. Watch a few rounds.":"看这两盏灯：A 亮了，然后 B 亮了。多看几轮。","Judge":"判断","Did A cause B?":"是 A 导致了 B 吗？","Experiment":"实验","Change the conditions and see what happens. Then look at the house and the ship.":"改变条件，看看会发生什么。然后再看房子和船。","Judge again":"再判断","Do you still think A caused B?":"你仍然认为是 A 导致了 B 吗？","Explain":"解释","Split what you just saw into three layers.":"把你刚才看到的分成三个层次。","Apply":"应用","Check a claim from real life the same way.":"用同样的方法检验一个现实生活中的说法。","Keep":"保存","Keep what you understood and what you still wonder about.":"保存你理解了的内容和你仍然好奇的问题。","A lights before B every time. Your mind starts to expect it: A lights, so B is coming.":"每次都是 A 先亮、B 后亮。你的头脑开始形成预期：A 亮了，B 就要来了。","You think A caused B. Keep that judgment — next you will test it.":"你认为是 A 导致了 B。先记住这个判断——接下来你要检验它。","You think not. Then why does B always follow A? Let’s find out.":"你认为不是。那为什么 B 总是跟在 A 后面？我们来找找看。","Not sure is a good place to start: order alone is not enough to judge.":"不确定是个好的起点：仅凭先后顺序不足以作出判断。","You pressed A yourself and B stayed dark. A always comes first, yet it is not B’s cause. This move is called intervention.":"你亲自按下 A，B 却没亮。A 总是在前，却不是 B 的原因。这一步叫作干预。","Behind the curtain a timer drives both A and B. That is a common cause (a confounder).":"幕布后面有一个定时器同时控制着 A 和 B。这就是共同原因（混杂因素）。","Stop the timer and neither lamp lights. The timer is what really does the work.":"停掉定时器，两盏灯都不亮。真正起作用的是定时器。","You chose the order to look at the house — roof first or door first, the house did not change. This is a subjective order.":"看房子的顺序由你选择——先看屋顶还是先看门，房子都没有变。这是主观顺序。","The ship doesn’t drift backwards: you can only see it upstream first, then downstream. You don’t get to choose this order.":"船不会倒着漂：你只能先在上游看到它，再在下游看到它。这个顺序不由你选择。","The ship’s order is fixed: an objective order — something really happened. Kant’s question is what entitles us to take it as objective.":"船的顺序是固定的：这是客观顺序——确实发生了某件事。康德的问题是：我们凭什么把它当作客观的？","You changed your mind. What changed it was not more watching, but intervening and finding the common cause.":"你改变了想法。改变你想法的不是看得更多，而是干预和找到共同原因。","You still think it’s cause. Remember: when you pressed A yourself, did B light?":"你仍然认为是因果。回想一下：你亲自按下 A 时，B 亮了吗？","Right: in this setup both A and B are caused by the timer. Before is not because.":"对：在这个设置里，A 和 B 都是由定时器引起的。先后不等于因果。","You may stay unsure. But intervening already showed that A is not B’s cause.":"你可以继续保持不确定。但干预已经表明 A 不是 B 的原因。","① Order in time":"① 时间上的先后","Description of fact":"事实描述","A happens before B. That is a fact about order; on its own it says nothing about what produces what.":"A 发生在 B 之前。这是关于顺序的事实；单凭它，无法说明什么产生了什么。","Watching the lamps":"观察两盏灯","② Empirical judgment of cause":"② 关于原因的经验判断","Experience · Scientific method":"经验 · 科学方法","Hume pointed out that we never see a ‘power’ — only that B always follows A, and habit makes us expect B. Modern causal inference gives ways to test this: intervene on A yourself (not just watch), and rule out common causes (confounders) and reverse causation. That is what you just did with the lamps.":"休谟指出，我们从未看到某种“力量”——只看到 B 总是跟在 A 后面，习惯让我们预期 B。现代因果推断提供了检验的方法：亲自干预 A（而不只是观察），并排除共同原因（混杂因素）和反向因果。这正是你刚才对两盏灯所做的。","Press A · lift the curtain · stop the timer":"按下 A · 掀开幕布 · 停掉定时器","③ Kant’s claim":"③ 康德的主张","Philosophical claim · debated":"哲学主张 · 有争议","Kant held that cause and effect is one of the categories of the understanding (under Relation). It is not learned from experience; it is a condition that makes experience possible. Looking over a house, the order of your perceptions can run either way (a subjective order). Watching a ship drift downstream, the order is fixed (an objective order). Kant argues that to take a series of perceptions as an event that objectively happens, we must think it under a rule — the causal law. But the category only says every event has a cause; what causes what must still be found out from experience — layer ② again.":"康德认为，因果是知性的范畴之一（属于关系范畴）。它不是从经验中学来的，而是使经验成为可能的条件。打量一座房子时，你知觉的顺序可以任意颠倒（主观顺序）；看一艘船顺流而下时，顺序是固定的（客观顺序）。康德论证说，要把一系列知觉当作客观发生的事件，我们必须在一条规则——因果律——之下来思考它。但范畴只说明每个事件都有原因；究竟什么导致什么，仍要从经验中去发现——这又回到了第②层。","The house and the ship":"房子和船","Mind the mapping: the lamps belong to layer ② (experience and method). The house and the ship are Kant’s own example for layer ③.":"注意对应关系：两盏灯属于第②层（经验与方法）。房子和船是康德本人用于第③层的例子。","I only saw one thing come after the other":"我只看到一件事跟在另一件事之后","It could run the other way (B causes A)":"也可能是反过来（B 导致 A）","I could try it myself (intervene)":"我可以亲自试一试（干预）","I think it is cause and effect":"我认为是因果关系","Probably just correlated":"可能只是相关","Not sure yet — need to check":"还不确定——需要检验","Aristotle’s Four Causes":"亚里士多德的四因说","Four kinds of ‘because’":"四种“因为”","See that ‘why does this exist?’ has four different kinds of answer in Aristotle — material, formal, efficient and final cause — and that they are kinds of explanation, not modern forces or variables.":"理解在亚里士多德看来，“这个东西为什么存在？”有四种不同的回答——质料因、形式因、动力因和目的因——它们是解释的种类，而不是现代意义上的力或变量。","A teaching version of Aristotle’s four causes. It shows how he sorted explanations; it does not claim that every thing has a purpose.":"亚里士多德四因说的教学版本。它展示他如何对解释进行分类，并不主张每样东西都有目的。","Choose":"选择","Pick a thing to explain.":"选一个要解释的东西。","Why does it exist? Choose the one best answer.":"它为什么存在？选出最佳的一个答案。","Because of what it’s made of":"因为它是由什么构成的","Because someone or something made it":"因为有人或有东西制造了它","Because of what it’s for":"因为它是用来做什么的","Because of its form":"因为它的形式","Tap a card, then tap the kind of cause it answers. Two cards don’t belong at all.":"点一张卡片，再点它所回答的那种原因。有两张卡片根本不属于任何一类。","How many ‘becauses’ does a full explanation need, for Aristotle?":"在亚里士多德看来，一个完整的解释需要几个“因为”？","One — the real one":"一个——那个真正的原因","Four kinds, each answering a different question":"四种，各自回答不同的问题","It depends on the thing":"要看是什么东西","What the four causes are — and are not.":"四因是什么——以及不是什么。","Explain something of your own with all four.":"用四因来解释一个你自己选的东西。","Good. Now try to give the single reason it exists.":"好。现在试着给出它存在的唯一理由。","You picked one kind of answer. Aristotle would say the others are also answers — to different questions.":"你选了一种回答。亚里士多德会说，其他几种也是回答——只是回答的是不同的问题。","Yes — that card answers that kind of ‘why’.":"对——这张卡片回答的正是这种“为什么”。","That card answers a different kind of ‘why’. Ask: made of? form? made by? for what?":"这张卡片回答的是另一种“为什么”。问问自己：由什么构成？什么形式？由谁造成？为了什么？","That one isn’t any of the four causes — it comes from modern science.":"这一张不属于四因中的任何一种——它来自现代科学。","All four in place. Each answers a different question about the same thing.":"四种都已归位。每一种都在回答关于同一事物的不同问题。","That is Aristotle’s view: a full explanation can involve all four kinds of cause.":"这正是亚里士多德的观点：一个完整的解释可以涉及全部四种原因。","Today we often look for one cause — but Aristotle counts four kinds, each answering its own question.":"今天我们常常只找一个原因——但亚里士多德列出了四种，每一种回答各自的问题。","Partly right: for natural things, form and purpose often coincide — but the four questions can always be asked.":"部分正确：对自然物来说，形式和目的常常重合——但这四个问题总是可以提出的。","① Four kinds of explanation":"① 四种解释","Aristotle · Physics II.3":"亚里士多德 · 《物理学》II.3","For Aristotle, knowing a thing means knowing its ‘why’, and there are four kinds: what it is made of (material), the form or structure that makes it what it is (formal), what brought it about (efficient), and what it is for (final).":"在亚里士多德看来，认识一个事物就是认识它的“为什么”，而这有四种：它由什么构成（质料因），使它成为其所是的形式或结构（形式因），是什么使它产生（动力因），以及它是为了什么（目的因）。","The four slots":"四个位置","② Purpose in nature":"② 自然中的目的","Aristotle applied final causes to natural things too: an acorn grows towards being an oak. For living things, form and purpose often coincide. Whether nature really has purposes (teleology) is one of the most debated parts of his view.":"亚里士多德也把目的因用于自然物：橡子朝着长成橡树的方向生长。对生物来说，形式和目的常常重合。自然是否真有目的（目的论），是他的观点中争议最大的部分之一。","The oak tree":"橡树","③ Not modern forces":"③ 不是现代意义上的力","Reading carefully":"仔细阅读","The four causes are kinds of explanation, not physical forces and not experimental variables. Modern science mostly keeps the efficient cause (and the material), and talks about function in its own terms. That is why ‘gravity’ and ‘a variable’ had no slot.":"四因是解释的种类，既不是物理力，也不是实验变量。现代科学大体保留了动力因（以及质料因），并用自己的术语来谈论功能。这就是为什么“重力”和“变量”没有位置。","The two cards with no slot":"两张没有位置的卡片","One thing, four questions: made of? form? made by? for what?":"一个事物，四个问题：由什么构成？什么形式？由谁造成？为了什么？","A thing of my own":"我自己选的东西","e.g. my school bag":"例如：我的书包","Material cause — made of":"质料因——由什么构成","Formal cause — its form":"形式因——它的形式","Efficient cause — made by":"动力因——由谁造成","Final cause — for":"目的因——为了什么","Kept as your own analysis.":"已作为你自己的分析保存。","Material cause":"质料因","What is it made of?":"它由什么构成？","Formal cause":"形式因","What form makes it what it is?":"什么形式使它成为其所是？","Efficient cause":"动力因","What brought it about?":"是什么使它产生？","Final cause":"目的因","What is it for?":"它是为了什么？","A bronze statue":"一座青铜雕像","Aristotle’s own example":"亚里士多德本人的例子","The bronze it is cast from":"铸造它的青铜","The shape of the figure it shows":"它所表现的人物形状","The sculptor’s skill and work":"雕塑家的技艺和劳动","To honour someone / to be admired":"为了纪念某人 / 供人欣赏","Gravity (a physical force)":"重力（一种物理力）","A modern physical force — not one of Aristotle’s four kinds of explanation.":"一种现代物理力——不属于亚里士多德的四种解释。","An experimental variable you could change":"一个你可以改变的实验变量","An idea from modern experimental method, not one of the four causes.":"来自现代实验方法的概念，不属于四因。","A house":"一座房子","Bricks, wood and stone":"砖、木头和石头","The plan — walls, roof, rooms arranged as a house":"设计——墙、屋顶、房间按房子的样式布置","The builders":"建筑工人","To shelter people":"为人遮风挡雨","A chair":"一把椅子","Wood and nails":"木头和钉子","A seat raised on legs with a back":"由腿架起、带靠背的座位","The carpenter":"木匠","For sitting on":"用来坐","An oak tree":"一棵橡树","a natural thing":"自然物","Wood, sap, leaves":"木质、树液、叶子","The form of an oak — what makes it an oak and not a pine":"橡树的形式——使它成为橡树而不是松树的东西","A parent oak (through the acorn)":"一棵亲代橡树（通过橡子）","To grow into a mature, flourishing oak":"长成一棵成熟、茂盛的橡树","Hegel: Being, Nothing, Becoming":"黑格尔：有、无、变易","A concept that moves on its own":"一个自己运动的概念","Follow the opening move of Hegel’s Logic: pure being, without any determination, cannot be told apart from nothing — and their truth is the movement of each into the other, becoming. See why this is not a thesis–antithesis–synthesis template.":"跟随黑格尔《逻辑学》的开端：没有任何规定的纯有，与无无法区分——而它们的真理是彼此过渡到对方的运动，即变易。看看为什么这不是“正题–反题–合题”的套路。","A simplified reading aid for the opening of Hegel’s Science of Logic, pending content review. Hegel scholars read this passage in different ways.":"黑格尔《逻辑学》开端部分的简化阅读辅助，内容待审核。黑格尔研究者对这段文字有不同的解读。","Strip away":"剥离","Here is something with many features. Remove every feature, one by one.":"这里有一个具有许多特征的东西。把每个特征逐一去掉。","What is left — something, or nothing?":"剩下的是什么——某物，还是无？","Something: pure being":"某物：纯有","Nothing":"无","I can’t tell":"我说不清","Try to name a difference between pure being and pure nothing. Then watch the two.":"试着说出纯有和纯无之间的一个区别。然后观察这两者。","Pure being and pure nothing — what is their relation?":"纯有和纯无——它们是什么关系？","They can’t be told apart":"它们无法区分","They are simply different":"它们就是不同的","Each passes into the other":"每一方都过渡到另一方","What Hegel claims — and what he doesn’t.":"黑格尔主张什么——以及不主张什么。","Follow a concept of your own through an inner tension.":"让你自己的一个概念经历内在张力。","Every feature is gone. What remains has no ‘what’ at all — Hegel calls it pure being.":"所有特征都去掉了。剩下的东西没有任何“什么”——黑格尔称之为纯有。","You say something remains: pure being. Next: can you say how it differs from nothing?":"你说剩下了某物：纯有。接下来：你能说出它和无有什么区别吗？","You say nothing remains. Hold on — next you’ll see why Hegel finds both answers right.":"你说什么都没剩下。先别急——接下来你会看到，为什么黑格尔认为这两个回答都对。","‘I can’t tell’ is exactly where Hegel’s Logic begins.":"“我说不清”恰恰是黑格尔《逻辑学》开始的地方。","Each difference you name brings back a feature you removed.":"你说出的每个区别，都会把一个已去掉的特征带回来。","Being vanishes into nothing, nothing into being — ceasing-to-be and coming-to-be. Hegel calls this movement becoming.":"有消失于无，无消失于有——消逝与生成。黑格尔称这一运动为变易。","That is close to Hegel: their truth is the movement of each into the other — becoming.":"这接近黑格尔的观点：它们的真理是彼此过渡到对方的运动——变易。","Hegel agrees they can’t be told apart — and adds that they are still not simply the same: each passes over into the other.":"黑格尔同意它们无法区分——但他补充说，它们也并非简单地相同：每一方都过渡到另一方。","Try to say how — every difference you named brought back a feature.":"试着说说怎么不同——你说出的每个区别都带回了一个特征。","① Being, nothing, becoming":"① 有、无、变易","Hegel · Science of Logic":"黑格尔 · 《逻辑学》","Hegel’s Logic begins with pure being: with no determination at all, it is ‘in fact nothing’. Pure nothing, thought through, is the same empty thought. Their truth is the movement in which each has already passed into the other — becoming, as coming-to-be and ceasing-to-be.":"黑格尔的《逻辑学》从纯有开始：它没有任何规定，“事实上就是无”。纯无经过思考，也是同样空洞的思想。它们的真理是这样一种运动：每一方都已经过渡到了另一方——变易，即生成与消逝。","Stripping the features · watching the two":"剥离特征 · 观察两者","② Not thesis–antithesis–synthesis":"② 不是“正题–反题–合题”","Hegel did not present his method as ‘thesis–antithesis–synthesis’; that formula is linked more with Fichte and later popular summaries. The point is that a concept, thought through, turns into another by itself (immanently) — not that a third idea is added from outside.":"黑格尔并没有把自己的方法表述为“正题—反题—合题”；这个公式更多与费希特以及后来的通俗概括相关。要点在于：一个概念经过彻底思考，会自行（内在地）转变为另一个概念——而不是从外部再添加第三个观念。","The differences that kept failing":"一再失败的区分","③ An open debate":"③ 一场仍在进行的争论","Interpretation · contested":"诠释 · 有争议","What this opening proves, and how to read it, is debated among scholars. This experiment is a reading aid: it lets you feel the move, not decide what it means for all of Hegel.":"这一开端究竟证明了什么、应当如何解读，学界仍有争论。本实验只是阅读辅助：它让你体会这一步推进，而不是替你判定它对整个黑格尔哲学意味着什么。","The whole experiment":"完整实验","Watch for concepts that change by thinking them through — not because someone adds a new idea.":"留意那些通过彻底思考而发生变化的概念——而不是因为有人加入了新观念。","A concept I hold":"我持有的一个概念","e.g. freedom, friendship, fairness":"例如：自由、友谊、公平","What I first thought it meant":"我最初以为它的意思","A tension inside that meaning":"这一含义内部的张力","What it became — what is kept, what changed":"它变成了什么——保留了什么，改变了什么","Red":"红色","Round":"圆的","Heavy":"重的","Here":"这里","Now":"现在","An apple":"一个苹果","One":"一","Being exists; nothing doesn’t.":"有存在；无不存在。","‘Exists’ already says more than pure being: it adds a determination (being there, being something). Pure being has none.":"“存在”已经比纯有说得更多：它附加了一个规定（在那里存在、是某物）。纯有没有任何规定。","Being has some content; nothing is empty.":"有具有某种内容；无是空的。","Which content? Every content you name is a determination you just stripped away. Pure being is just as empty.":"什么内容？你说出的每一种内容，都是你刚刚剥离掉的规定。纯有同样是空的。","I can think of being, but not of nothing.":"我能思考有，却不能思考无。","Try it: thinking pure being, with no ‘what’ at all, is thinking nothing in particular — the same emptiness.":"试试看：思考毫无“什么”的纯有，就是思考并无特定内容的东西——同样的空无。","Being is positive, nothing is negative.":"有是肯定的，无是否定的。","‘Positive’ and ‘negative’ are themselves determinations. Without them, the two can’t be told apart.":"“肯定”与“否定”本身就是规定。没有它们，两者就无法区分。","The Locked Room":"上锁的房间","Staying willingly vs. being free to leave":"自愿留下 vs. 可以自由离开","Tell apart doing something voluntarily (I want to stay) from being at liberty (I could leave if I wanted) — Locke’s distinction — and connect it to Berlin’s negative and positive liberty.":"区分自愿做某事（我想留下）与拥有自由（只要我想就能离开）——这是洛克的区分——并将其与伯林的消极自由和积极自由联系起来。","A teaching version of Locke’s example; it illustrates his distinction and does not settle the free-will debate.":"这是洛克例子的教学版本；它用来说明他的区分，并不能解决自由意志之争。","A man is carried, asleep, into a room. The door is locked. He wakes up, finds good company, and is glad to stay.":"一个人在熟睡时被抬进一个房间。门被锁上了。他醒来后，发现有好友作伴，很乐意留下来。","He stays because he wants to. Is he free?":"他留下是因为他想留下。他是自由的吗？","Yes, he is free":"是的，他是自由的","No, he is not free":"不，他不是自由的","Partly / not sure":"部分是 / 不确定","Change the conditions. Watch the two gauges: ‘does what he wants’ and ‘could do otherwise’.":"改变条件。观察两个仪表：“做他想做的事”和“本可以不这样做”。","Is the man in the locked room — who wants to stay — free?":"上锁房间里那个想留下来的人——是自由的吗？","No, he is not free to leave":"不，他没有离开的自由","Three ways to describe what you saw.":"用三种方式描述你所看到的。","Find the same distinction in your own life.":"在你自己的生活中找出同样的区分。","He does exactly what he wants — but notice the lock he doesn’t know about.":"他做的正是他想做的——但请注意那把他并不知道的锁。","You say he is free: he does what he wants. Keep that — next, change the conditions.":"你说他是自由的：他在做他想做的事。保留这个答案——接下来，改变条件。","You say he isn’t free, even though he is doing what he wants. What exactly is missing? Let’s look.":"你说他不自由，尽管他在做他想做的事。到底缺了什么？我们来看看。","‘Partly’ is a good instinct — the next step separates two things that both get called freedom.":"“部分是”是个不错的直觉——下一步会区分两种都被称为自由的东西。","Locked and wanting to stay: he acts voluntarily, but he could not leave if he wanted to.":"门锁着且他想留下：他是自愿行动的，但即使他想离开也离不开。","Now he wants to leave and can’t. The lock was there all along — wanting to leave only made it visible.":"现在他想离开却离不开。锁一直都在——想离开只是让它显露出来。","Unlocked and staying: he does what he wants and could do otherwise. Both gauges are full.":"门没锁且他留下：他做他想做的事，而且本可以不这样做。两个仪表都是满的。","Unlocked and wanting to leave: he walks out. Doing what he wants and being able to are the same here.":"门没锁且他想离开：他走了出去。在这里，做想做的事与能够去做是一致的。","Knowing about the lock changes what he feels, not whether he could leave.":"知道有锁会改变他的感受，但不会改变他能否离开。","You changed your mind: staying voluntarily turned out to be different from being free to leave.":"你改变了想法：自愿留下原来不同于可以自由离开。","This is Locke’s answer: he stays voluntarily, but he is not at liberty to leave.":"这就是洛克的回答：他是自愿留下的，但他没有离开的自由。","You still call him free. Many people do — in the sense that he acts on his own wishes. The next step names that sense and the other one.":"你仍然认为他是自由的。很多人都这样认为——就他按照自己的意愿行事这个意义而言。下一步将为这个意义以及另一个意义命名。","‘Partly’ fits: he is free in one sense and not in another.":"“部分是”很贴切：他在一种意义上是自由的，在另一种意义上则不是。","① Locke: voluntary ≠ free":"① 洛克：自愿 ≠ 自由","Philosophical claim · historical":"哲学主张 · 历史性","Locke used this kind of case to separate two things. Staying is voluntary — he prefers it. But liberty, for Locke, is the power to act or not act as one chooses; since he could not leave if he chose to, he is not at liberty to leave.":"洛克用这类情形来区分两件事。留下是自愿的——他更愿意留下。但对洛克而言，自由是按照自己的选择去行动或不行动的能力；既然他即使选择离开也离不开，他就没有离开的自由。","The lock gauge vs. the wish gauge":"锁的仪表 vs. 意愿的仪表","② Berlin: two concepts of liberty":"② 伯林：两种自由概念","Philosophical analysis · political":"哲学分析 · 政治性","Isaiah Berlin distinguished negative liberty — how far others leave me unobstructed (the lock) — from positive liberty — being my own master, acting from my own reasons (the wish). The room shows them coming apart.":"以赛亚·伯林区分了消极自由——他人在多大程度上不阻碍我（锁）——与积极自由——做自己的主人，出于自己的理由行动（意愿）。这个房间展示了两者如何分离。","Locked door = negative liberty · own wish = positive liberty":"上锁的门 = 消极自由 · 自己的意愿 = 积极自由","③ What the room leaves open":"③ 房间留下的开放问题","Open question":"开放问题","The room is about acting freely. Whether his wish itself is free — whether anything he wants is ultimately up to him — is the separate free-will debate (determinism, compatibilism, libertarianism). The experiment does not answer it.":"这个房间关乎的是自由地行动。至于他的意愿本身是否自由——他所想要的任何东西最终是否由他决定——那是另一场自由意志之争（决定论、相容论、自由意志论）。本实验并不回答这个问题。","Not shown by the gauges":"仪表无法显示","The room separates two senses of freedom; it is a thinking tool, not evidence for any one theory of freedom.":"这个房间区分了自由的两种含义；它是一种思考工具，而不是支持某一种自由理论的证据。","Plato’s Cave":"柏拉图的洞穴","Shadows, light and where you stand":"影子、光与你所处的位置","Tell apart what you see from what makes you believe it: shadows depend on a light, an object and where you stand. Connect this to Plato’s distinction between opinion and knowledge.":"区分你看到的东西与让你相信它的东西：影子取决于光源、物体以及你所处的位置。将此与柏拉图关于意见与知识的区分联系起来。","A teaching version of a philosophical allegory — it is not a scientific experiment about perception and does not prove Plato’s theory of Forms.":"这是一则哲学寓言的教学版本——它不是关于知觉的科学实验，也不能证明柏拉图的理型论。","You are chained facing a wall. Shapes move across it. This is all you have ever seen.":"你被锁链束缚，面朝一堵墙。墙上有形状在移动。这就是你见过的一切。","What is the shape moving on the wall?":"墙上移动的形状是什么？","A horse":"一匹马","A shadow of something":"某个东西的影子","Not sure":"不确定","Move the fire, move the object, turn around, go outside. Watch what happens to the shadow.":"移动火光，移动物体，转过身，走到外面去。观察影子会发生什么变化。","Could the shadow alone tell you what the horse is really like?":"仅凭影子，能告诉你那匹马真正是什么样子吗？","Yes":"能","Only partly":"只能部分地","No":"不能","Three ways to read what you saw.":"用三种方式解读你所看到的。","Find a ‘shadow’ in your own life.":"在你自己的生活中找出一个“影子”。","To you, these shapes are simply the world. You have nothing else to compare them with.":"对你来说，这些形状就是世界本身。你没有其他东西可以拿来比较。","That is what anyone in the chains would say. Keep it — next, look at what makes the shape.":"任何被锁链束缚的人都会这么说。保留这个答案——接下来，看看是什么形成了这个形状。","You already suspect there is more behind the wall. Let’s find out what.":"你已经怀疑墙后还有更多东西。我们来找出那是什么。","Not sure is fair — you have only ever seen the wall.":"不确定也很合理——你只见过这堵墙。","Move the light and the same object casts a different shadow — higher, lower, stretched.":"移动光源，同一个物体会投下不同的影子——更高、更低、被拉长。","Closer to the fire, the shadow grows; closer to the wall, it shrinks. The object itself did not change size.":"离火越近，影子越大；离墙越近，影子越小。物体本身的大小并没有改变。","Turned around, you see the fire and the carved figures. The ‘horse’ was a puppet — the shadow of a copy.":"转过身，你看到了火和雕刻的人偶。那匹“马”是个木偶——是一个复制品的影子。","Outside, in daylight, you see a real horse. In the allegory this stands for understanding what things truly are.":"到了外面，在日光下，你看到一匹真正的马。在寓言中，这代表理解事物的真正所是。","Back facing the wall: the shadows look exactly as before — but now you know what makes them.":"重新面朝墙壁：影子看起来和以前一模一样——但现在你知道是什么形成了它们。","Right — the shadow depends on the light, the puppet and your position. It can’t show what a horse is.":"没错——影子取决于光、木偶和你的位置。它无法展示马究竟是什么。","Partly: the outline carries some information, but you couldn’t know which parts — without leaving the chains.":"部分地：轮廓携带了一些信息，但如果不挣脱锁链，你就无法知道是哪些部分。","Think back: the same puppet gave tall, short and stretched shadows. Which one is ‘the horse’?":"回想一下：同一个木偶投下了高的、矮的和被拉长的影子。哪一个才是“那匹马”？","① What the allegory shows":"① 寓言展示了什么","Allegory · Republic VII":"寓言 · 《理想国》第七卷","Prisoners who have only seen shadows take them for reality. One is freed, turns to the fire, climbs out and finally sees things in sunlight. Returning, he is not believed.":"只见过影子的囚徒把影子当作实在。其中一人被释放，转向火光，爬出洞穴，最终在阳光下看见事物。他回来后，却没有人相信他。","The wall · turning around · going outside":"墙壁 · 转身 · 走出洞外","② Opinion and knowledge":"② 意见与知识","Philosophical claim":"哲学主张","Plato separates opinion (about appearances) from knowledge (of what things truly are, which he calls Forms). The Divided Line in Republic VI orders these levels: images, things, then mathematics and the Forms. The ascent from the cave is often read alongside it, and the sun stands for the Form of the Good.":"柏拉图区分了意见（关于现象）与知识（关于事物真正所是，他称之为理型）。《理想国》第六卷中的线喻对这些层次进行了排序：影像、事物，然后是数学与理型。走出洞穴的上升过程常与线喻对照阅读，而太阳象征着善的理型。","From ‘what I see’ to ‘why I believe it’":"从“我看到了什么”到“我为什么相信它”","③ What it is not":"③ 它不是什么","The cave is a philosophical allegory about knowledge and education, not a scientific account of vision. Plato’s theory of Forms is one position; many philosophers reject it. The experiment helps you ask “what makes me believe this?” — it does not show that Forms exist.":"洞穴是一则关于知识与教育的哲学寓言，而不是关于视觉的科学解释。柏拉图的理型论只是一种立场；许多哲学家并不接受它。本实验帮助你追问“是什么让我相信这一点？”——它并不能证明理型存在。","Keep two questions apart: what did I see? — and why do I believe it?":"把两个问题分开：我看到了什么？——以及我为什么相信它？","Something I believed because of how it looked":"我因为它看起来的样子而相信的某件事","e.g. a photo online":"例如：网上的一张照片","Why I believed it":"我为什么相信它","e.g. it looked real":"例如：它看起来很真实","How I could check what is really behind it":"我可以如何查证它背后的真实情况","e.g. find the original source":"例如：找到原始出处","Kept as your own example.":"已作为你自己的例子保存。","One common starting point: being able to act as you choose without being stopped. Philosophers dispute whether that is enough.":"一个常见的出发点：能够按自己的选择行动而不受阻止。至于这是否足够，哲学家们有争议。","Free from what — and free to do what?":"免于什么——又能自由地做什么？","Can I be free if my choices have causes?":"如果我的选择有原因，我还能是自由的吗？","Is a person who stays willingly in a locked room free?":"一个自愿留在上锁房间里的人是自由的吗？","Berlin’s two concepts of liberty":"伯林的两种自由概念","Compatibilism":"相容论","Libertarianism (about free will)":"自由意志论（关于自由意志）","John Locke":"约翰·洛克","Immanuel Kant":"伊曼努尔·康德","John Stuart Mill":"约翰·斯图尔特·密尔","Isaiah Berlin":"以赛亚·伯林","Jean-Paul Sartre":"让-保罗·萨特","Freedom of speech":"言论自由","Rules at school":"学校里的规则","Determinism: if every choice is caused, is anyone free?":"决定论：如果每个选择都有原因，还有人是自由的吗？","One person’s freedom can limit another’s":"一个人的自由可能会限制另一个人的自由","What it means for one thing to bring about another — more than one thing simply coming after another.":"一件事引起另一件事意味着什么——这不只是一件事紧跟在另一件事之后。","Does coming first ever prove causing?":"先发生是否能证明是原因？","How can a cause be tested?":"如何检验一个原因？","Common cause (confounder)":"共同原因（混杂因素）","Reverse causation":"反向因果","Hume on constant conjunction":"休谟论恒常会合","Kant’s category of causality":"康德的因果性范畴","Modern causal inference":"现代因果推断","David Hume":"大卫·休谟","Aristotle":"亚里士多德","Reading health headlines":"解读健康新闻标题","Correlation is not causation":"相关不等于因果","Knowledge needs both experience and the mind’s own forms (space, time, the categories).":"知识既需要经验，也需要心灵自身的形式（空间、时间、范畴）。","Cause and effect is one of the categories of the understanding (under Relation). Kant holds it is a condition that makes experience possible, not something generalised from experience.":"因果是知性的范畴之一（属于关系范畴）。康德认为，它是使经验成为可能的条件，而不是从经验中概括出来的东西。","Reason seeks complete answers — and has to know its limits.":"理性追求完整的答案——同时必须认识到自身的界限。","Asking “how can I be so sure?”":"追问“我凭什么这么确定？”","Telling the order of my perceptions apart from an event that really happens":"区分我知觉的先后顺序与真实发生的事件","Thinking about where knowledge comes from and where it stops":"思考知识从何而来、止于何处","Happening one after the other — or changing together (correlation) — is not enough to show cause.":"一前一后地发生——或者一同变化（相关）——不足以证明因果。","Changing one variable yourself and watching the other (intervention) says more than watching alone.":"亲自改变一个变量并观察另一个变量（干预），比单纯观察更能说明问题。","Rule out common causes (confounders) and reverse causation.":"排除共同原因（混杂因素）和反向因果。","Checking an “A causes B” headline":"检验一条“A 导致 B”的新闻标题","Testing a conclusion from my own experience":"检验从我自身经验得出的结论","Designing a small experiment":"设计一个小实验","A method for testing empirical cause-and-effect claims. It does not answer the philosophical question of what causation itself is.":"一种检验经验性因果主张的方法。它并不回答因果关系本身是什么这一哲学问题。","To tell cause from mere sequence or correlation, change one thing yourself and rule out common causes.":"要区分因果与单纯的先后顺序或相关，就亲自改变一件事，并排除共同原因。","Negative liberty: the area in which I can act without being stopped by others.":"消极自由：我可以不受他人阻止而行动的领域。","Positive liberty: being self-directed — acting from my own reasons and choices.":"积极自由：自我主导——出于自己的理由和选择而行动。","The two can pull apart, and each can be misused when pushed alone.":"两者可能相互背离，而且任何一方单独推到极端都可能被滥用。","Asking what kind of freedom a rule takes away or gives":"追问一条规则拿走或赋予了哪种自由","Comparing ‘free from’ with ‘free to’":"比较“免于……的自由”与“去做……的自由”","One influential analysis of political freedom, not the only one; it does not settle the metaphysical question of free will.":"这是关于政治自由的一种有影响力的分析，但并非唯一的分析；它并不解决自由意志的形而上学问题。","Negative liberty is freedom from interference; positive liberty is being one’s own master.":"消极自由是免于干涉的自由；积极自由是做自己的主人。","Liberty is a power to act or forbear according to one’s own choice.":"自由是按照自己的选择去行动或不行动的能力。","Doing something voluntarily is different from being at liberty to do otherwise.":"自愿做某事，不同于拥有不这样做的自由。","Telling ‘I chose this’ apart from ‘I could have done otherwise’":"区分“我选择了这个”与“我本可以不这样做”","Locke’s account is one historical position in the free-will debate; later philosophers dispute it.":"洛克的观点是自由意志之争中的一种历史立场；后来的哲学家对此有争议。","Liberty is the power to act or not act as one wills; staying willingly is not the same as being free to leave.":"自由是按照自己的意愿去行动或不行动的能力；自愿留下并不等同于可以自由离开。"}},"../knowledge/frameworks/philosophy.json":{"format":"minest.framework-collection/1","collection":"philosophy","title":"Philosophy","frameworks":[{"format":"minest.framework/1","id":"aristotle","version":"1.0.0","name":"Aristotle’s Four Causes & Categories","collection":"philosophy","structureType":"dimensions","author":"Aristotle","summary":"To understand a thing, ask what it is made of, what shape it has, what made it and what it is for.","concepts":[{"id":"material-cause","name":"Material cause","summary":"What it is made of.","order":1,"myName":"What it’s made of"},{"id":"formal-cause","name":"Formal cause","summary":"The shape, pattern or design that makes it this thing.","order":2,"myName":"Its form"},{"id":"efficient-cause","name":"Efficient cause","summary":"What or who brought it about.","order":3,"myName":"What made it"},{"id":"final-cause","name":"Final cause","summary":"What it is for — its purpose or end.","order":4,"myName":"What it’s for"}],"myName":"My Ordered World","source":{"work":"Physics II; Metaphysics V; Categories","year":"c. 350 BCE"},"relatedTemplates":["philosophy-aristotle"],"discoveryTool":"understand-this-thing","about":"Aristotle explained things by asking four kinds of “because”. He also sorted everything that is into categories such as substance, quantity, quality and relation.","scope":"Understanding any object, event or idea from several sides.","limits":"Modern science rarely uses final causes for nature; treat purpose as a question, not a proof.","customizable":true,"notice":"Summaries and My-first wording are Minest’s own. Concept names are standard terms; no protected text is copied."},{"format":"minest.framework/1","id":"kant","version":"1.0.0","name":"Kant’s Critical Philosophy","collection":"philosophy","structureType":"hierarchy","author":"Immanuel Kant","summary":"What we know is shaped both by the world and by the way our minds take it in.","concepts":[{"id":"sensibility","name":"Sensibility","summary":"We receive things in space and time.","parent":null},{"id":"sensibility.space","name":"Space","parent":"sensibility"},{"id":"sensibility.time","name":"Time","parent":"sensibility"},{"id":"understanding","name":"Understanding","summary":"We order what we receive with concepts (the categories).","parent":null},{"id":"understanding.quantity","name":"Quantity","parent":"understanding"},{"id":"understanding.quality","name":"Quality","parent":"understanding"},{"id":"understanding.relation","name":" <script>
/* Minest · Cognitive Navigation Engine — lab prototype (window.MinestCompass)

   which micro-interactions they offer. Every step gives its reasons.
   Local rules only (v0.1): matching cues from tools/compass/taxonomy.json + the frameworks' own names, concepts and
   the sidecar tools/compass/frameworks-ext.json + what the user corrected before. No network, no AI call.
   The engine outputs ids only (taxonomy node ids, framework ids, interaction ids): the Micro-Interaction Engine never
   needs to know how a thought was classified.
   Store: anything with get / set / keys (MinestKnowledge's interface). Keys:
     'cn:q:<id>'   { id, text, at, result, confirmed: { node, framework } | null }

  // ------------------------------------------------------------------ records

    var changed = (q.result.primary ? q.result.primary.id : null) !== q.confirmed.node || (q.result.frameworks[0] ? q.result.frameworks[0].framework_id : null) !== q.confirmed.framework;

<script>
/* Minest · Knowledge Micro-Interaction Engine — lab prototype (window.MinestMicro)
   One runner for every micro-interaction. A definition (format "minest.micro/1", schema in schema/) declares
   steps, initial_state, user_actions, state_transitions, completion_criteria, feedback_rules and result_schema;
   the runner owns the state machine, the feedback, the step gate and the record. Scenes (what is drawn in a step)
   are registered separately by name (MinestMicro.scene) — they only render and call act(action, value).
   The runner knows nothing about classification: it is called with an interaction_id (from the Compass) and an
   optional context { query_id, text }.
   Records (store with get / set / keys):
     'mi:run:<id>'   the result (shape = the definition's result_schema)
     'rel:lab-<id>'  a relationship the user stated in an "apply" step — same shape as philo.js 'rel:' records,
                     marked userJudgment: true (Minest never infers causes). */
(function (root) {
  'use strict';
  var DEFS = {}, SCENES = {};
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ------------------------------------------------------------------ conditions
  function get(st, k) { return k.split('.').reduce(function (o, p) { return o == null ? undefined : o[p]; }, st); }
  function test(c, st) {
    if (!c) return true;
    if (c.all) return c.all.every(function (x) { return test(x, st); });
    if (c.any) return c.any.some(function (x) { return test(x, st); });
    if (c.truthy) return c.truthy.every(function (k) { return !!get(st, k); });
    if (c.gte) return Object.keys(c.gte).every(function (k) { return (get(st, k) || 0) >= c.gte[k]; });
    if (c.eq) return Object.keys(c.eq).every(function (k) { return get(st, k) === c.eq[k]; });
    return false;
  }

  // ------------------------------------------------------------------ the state machine (no DOM — testable)
  function session(def, ctx) {
    var st = clone(def.initial_state), log = [], startedAt = Date.now(), ids = def.steps.map(function (s) { return s.id; });
    st.step = st.step || ids[0];
    function val(v, payload) { return v === '$value' ? payload : v; }
    function dispatch(action, payload) {
      var t = def.state_transitions.filter(function (x) { return x.on === action && (x.from === st.step || x.from === '*'); })[0];
      if (!t) return false;
      if (t.advance) {
        var i = ids.indexOf(st.step) + t.advance;
        if (t.advance > 0 && !canNext()) return false;
        if (i < 0 || i >= ids.length) return false;
        st.step = ids[i]; st.last = null;
      }
      if (t.set) Object.keys(t.set).forEach(function (k) { st[k] = clone(val(t.set[k], payload) == null ? null : val(t.set[k], payload)); });
      if (t.inc) Object.keys(t.inc).forEach(function (k) { st[k] = (st[k] || 0) + t.inc[k]; });
      if (t.merge) { var m = val(t.merge, payload) || {}; Object.keys(m).forEach(function (k) { st[k] = m[k]; }); }
      log.push({ at: Date.now(), action: action, step: st.step });
      return true;
    }
    function canNext() { return test(def.completion_criteria[st.step], st); }
    function feedback() {
      return def.feedback_rules.filter(function (r) { return r.step === st.step && test(r.when, st); });
    }
    var STD = ['step', 'judge1', 'judge2', 'apply', 'note', 'question', 'last', 'saved', 'layers'];
    function probes() { var o = {}; Object.keys(def.initial_state).forEach(function (k) { if (STD.indexOf(k) < 0) o[k] = clone(st[k] == null ? null : st[k]); }); return o; }
    function result() {
      return {
        interaction_id: def.interaction_id, framework_id: def.framework_id, concept_id: def.concept_id || null, version: def.version,
        query_id: (ctx && ctx.query_id) || null, startedAt: startedAt, finishedAt: Date.now(),
        completed: test(def.completion_criteria.interaction, st),
        judge1: st.judge1, judge2: st.judge2, changedMind: !!(st.judge1 && st.judge2 && st.judge1 !== st.judge2),
        probes: probes(),
        apply: st.apply, note: st.note || '', question: st.question || '', log: log.slice()
      };
    }
    return { def: def, state: st, dispatch: dispatch, canNext: canNext, feedback: feedback, result: result, stepIndex: function () { return ids.indexOf(st.step); }, step: function () { return def.steps[ids.indexOf(st.step)]; } };
  }

  // ------------------------------------------------------------------ records
  function save(store, s) {

        type: r.apply.verdict === 'causal' ? 'leads-to' : 'related', note: r.apply.note || '', tool: r.interaction_id, userJudgment: true,
        checks: r.apply.checks || [], verdict: r.apply.verdict, createdAt: Date.now(), updatedAt: Date.now() });

    var ov = doc.createElement('div'); ov.className = 'mi-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', def.title);
    ov.innerHTML = '<div class="mi-card"><header class="mi-hd"><div><b>' + esc(def.title) + '</b><small>' + esc(def.subtitle || '') + '</small></div>' +
      '<ol class="mi-dots">' + def.steps.map(function (x, i) { return '<li data-i="' + i + '"><span>' + (i + 1) + '</span>' + esc(x.title) + '</li>'; }).join('') + '</ol>' +
      '<button class="mi-x" type="button" aria-label="Close">×</button></header>' +
      '<p class="mi-prompt"></p><div class="mi-stage"></div><div class="mi-fb" aria-live="polite"></div>' +
      '<footer class="mi-ft"><span class="mi-disc">' + esc(def.disclaimer || '') + '</span><button type="button" class="mi-back">Back</button><button type="button" class="mi-next">Next</button></footer></div>';
    (opt.host || doc.body).appendChild(ov);
    var stage = ov.querySelector('.mi-stage'), fb = ov.querySelector('.mi-fb'), prompt = ov.querySelector('.mi-prompt'), cur = null, curStep = null;

    function act(action, value) { if (s.dispatch(action, value)) paint(); }
    function mount() {
      if (cur && cur.destroy) cur.destroy(); stage.innerHTML = '';
      var step = s.step(), fn = SCENES[step.scene];
      curStep = step.id; cur = null;   // set first: a scene may act() while it mounts
      prompt.textContent = step.prompt || '';
      cur = fn ? fn({ el: stage, st: s.state, def: def, step: step, act: act, content: def.content || {}, context: opt.context || {},
        save: function () { savedRec = save(opt.store, s); if (opt.onSaved) opt.onSaved(savedRec); paint(); return savedRec; }, saved: function () { return savedRec; } }) : null;
      curStep = step.id;
    }
    function paint() {
      if (s.state.step !== curStep) mount();
      else if (cur && cur.update) cur.update(s.state);
      var i = s.stepIndex();
      [].forEach.call(ov.querySelectorAll('.mi-dots li'), function (li, k) { li.className = k < i ? 'done' : k === i ? 'on' : ''; });
      var f = s.feedback(), lastRule = f[f.length - 1];
      fb.className = 'mi-fb' + (lastRule ? ' show ' + (lastRule.tone || 'info') : '');
      fb.textContent = f.map(function (r) { return r.say; }).join(' ');   // rules are written so that what matches together reads together
      var last = i === def.steps.length - 1;
      ov.querySelector('.mi-back').disabled = i === 0;
      var nx = ov.querySelector('.mi-next'); nx.textContent = last ? (savedRec ? 'Done' : 'Save first') : 'Next';
      nx.disabled = last ? !savedRec : !s.canNext();
    }
    function close() { if (cur && cur.destroy) cur.destroy(); ov.remove(); doc.removeEventListener('keydown', key); if (opt.onClose) opt.onClose(savedRec); }
    function key(e) { if (e.key === 'Escape') close(); }
    ov.querySelector('.mi-x').onclick = close;
    ov.querySelector('.mi-back').onclick = function () { act('back'); };
    ov.querySelector('.mi-next').onclick = function () { if (s.stepIndex() === def.steps.length - 1) { if (savedRec) close(); } else act('next'); };
    doc.addEventListener('keydown', key);
    paint();
    return { session: s, close: close };
  }

  var api = {
    register: function (def) { DEFS[def.interaction_id] = def; return def; }, get: function (id) { return DEFS[id] || null; },
    scene: function (name, fn) { SCENES[name] = fn; }, session: session, test: test, save: save, runs: runs, play: play
  };
  root.MinestMicro = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Scenes for the "kant-causality" micro-interaction (Before ≠ Because). Rendering only: every state change goes
   through ctx.act(action, value) → the runner's state machine (tools/compass/micro.js). */
(function () {
  'use strict';
  var M = window.MinestMicro; if (!M) return;
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ------------------------------------------------------------------ the lamp rig: a hidden timer lights A, then B
  // Drawn per frame (rAF) with a timer fallback, so it keeps time even where CSS animations are paused.
  function rig(host, o) {
    var el = h('div', 'kl-rig', '<div class="kl-lamps"><div class="kl-lamp" data-l="a"><i></i><b>A</b></div><div class="kl-lamp" data-l="b"><i></i><b>B</b></div></div>' +
      '<div class="kl-box"><div class="kl-curtain">?</div><div class="kl-timer"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16"/><line class="kl-hand" x1="20" y1="20" x2="20" y2="7"/></svg><span>timer</span></div>' +
      '<svg class="kl-wires" viewBox="0 0 200 60" preserveAspectRatio="none"><path class="kl-w kl-wa" d="M100 58 C100 30 50 30 50 2"/><path class="kl-w kl-wb" d="M100 58 C100 30 150 30 150 2"/></svg></div>');
    host.appendChild(el);
    var A = el.querySelector('[data-l=a]'), B = el.querySelector('[data-l=b]'), hand = el.querySelector('.kl-hand');
    var P = 2400, t0 = performance.now(), lastCycle = 0, raf = 0, fb = 0, dead = false, stopped = false, manualA = 0;
    function frame(now) {
      if (dead) return;
      var t = (now - t0) % P, cyc = Math.floor((now - t0) / P);
      var aOn = !stopped && t > 300 && t < 800, bOn = !stopped && t > 1000 && t < 1500;
      if (manualA && now < manualA) aOn = true;
      A.classList.toggle('on', aOn); B.classList.toggle('on', bOn);
      el.querySelector('.kl-wa').classList.toggle('on', !stopped && t > 250 && t < 800);
      el.querySelector('.kl-wb').classList.toggle('on', !stopped && t > 950 && t < 1500);
      if (!stopped) hand.setAttribute('transform', 'rotate(' + (t / P * 360) + ' 20 20)');
      if (!stopped && cyc > lastCycle) { lastCycle = cyc; if (o.onCycle) o.onCycle(); }

      stop: function (on) { stopped = !!on; if (!on) { t0 = performance.now(); lastCycle = 0; } el.classList.toggle('stopped', stopped); },
      pressA: function () { var now = performance.now(), cyc = Math.floor((now - t0) / P); if (!stopped) t0 = now - (cyc * P + 1600); manualA = now + 500;   // move the hidden timer just past B, so B can't coincide with the press
        A.classList.add('pressed'); setTimeout(function () { A.classList.remove('pressed'); }, 500); },

    };

    var r = rig(wrap, { onCycle: function () { c.act('cycle'); } });
    var n = h('p', 'kl-count'); wrap.appendChild(n);
    function upd(st) { n.textContent = 'Rounds watched: ' + st.cycles + (st.cycles < 3 ? ' (watch at least 3)' : ''); }

    var f = c.step.field, opts = c.step.options || [['yes', 'Yes, A caused B'], ['no', 'No'], ['unsure', 'Not sure']];
    var w = h('div', 'kl-judge', (f === 'judge2' && c.st.judge1 ? '<p class="kl-was">First you said: <b>' + esc(label(c.st.judge1)) + '</b></p>' : '') +
      '<div class="kl-opts">' + opts.map(function (o) { return '<button type="button" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>');
    c.el.appendChild(w);
    function label(v) { return (opts.filter(function (o) { return o[0] === v; })[0] || [0, v])[1]; }
    w.addEventListener('click', function (e) { var b = e.target.closest('[data-v]'); if (b) c.act('judge', b.getAttribute('data-v')); });
    function upd(st) { [].forEach.call(w.querySelectorAll('[data-v]'), function (b) { b.classList.toggle('on', st[f] === b.getAttribute('data-v')); }); }
    upd(c.st); return { update: upd };
  });

  // ------------------------------------------------------------------ 3 · experiment
  M.scene('probe', function (c) {
    var w = h('div', 'kl-probe');
    w.innerHTML = '<section class="kl-pane"><h4>The lamps</h4><div class="kl-rigslot"></div><div class="kl-ctrl">' +
      '<button type="button" data-a="press-a">Press A yourself</button><button type="button" data-a="open-curtain">Lift the curtain</button><button type="button" data-a="stop-timer">Stop the timer</button></div></section>' +
      '<section class="kl-pane"><div class="kl-tabs"><button type="button" data-tab="house" class="on">The house</button><button type="button" data-tab="ship">The ship</button></div>' +
      '<div class="kl-tab kl-house on"><p class="kl-hint">Look at the three parts in any order you like.</p><div class="kl-hs">' +
      '<button type="button" data-p="roof" class="kl-roof">Roof</button><button type="button" data-p="window" class="kl-win">Window</button><button type="button" data-p="door" class="kl-door">Door</button></div><p class="kl-seq"></p></div>' +

<script>

<script>

   ('apply-fields', 'save-generic') any micro-interaction can use. Rendering only: state changes go through ctx.act().

(function () {

    }
    s += '<rect width="440" height="240" fill="#2a2230"/><rect x="0" y="0" width="' + WALL + '" height="240" fill="#4a3d4f"/>';
    s += '<rect x="' + WALL + '" y="0" width="150" height="240" fill="#3a3040" opacity=".7"/>';
    s += '<polygon class="pc-shadow" points="' + face.map(function (p) { return p.join(','); }).join(' ') + '"/>';
    if (mode !== 'wall') {
      s += '<rect x="196" y="130" width="70" height="60" fill="#5a4a5e"/><text x="200" y="205" class="pc-lab">' + esc(tr('low wall')) + '</text>';
      s += '<g transform="translate(' + ox + ' ' + oy + ') scale(' + k + ')"><polygon points="' + HORSE.map(function (p) { return p.join(','); }).join(' ') + '" fill="#b98a5a" stroke="#6a4a2f"/><line x1="20" y1="18" x2="20" y2="40" stroke="#6a4a2f" stroke-width="2"/></g>';
      s += '<circle cx="' + fx + '" cy="' + fy + '" r="46" fill="url(#pcFire)"/><path d="M' + (fx - 9) + ' ' + (fy + 14) + ' q9 -34 18 0 z" fill="#ffb13b"/>';
      s += '<line class="pc-ray" x1="' + fx + '" y1="' + fy + '" x2="' + WALL + '" y2="' + y0 + '"/><line class="pc-ray" x1="' + fx + '" y1="' + fy + '" x2="' + WALL + '" y2="' + y1 + '"/>';
    }
    var px = mode === 'fire' ? 150 : 120;
    s += '<g transform="translate(' + px + ' 196)"><circle r="9" cy="-26" fill="#c9b7d6"/><rect x="-8" y="-17" width="16" height="22" rx="6" fill="#9c86ad"/>' + (mode === 'fire' ? '' : '<path d="M-14 6 h28" stroke="#888" stroke-width="3" stroke-dasharray="3 2"/>') + '</g>';
    s += '<text x="40" y="22" class="pc-cap">' + esc(tr(mode === 'wall' ? 'What the prisoner sees: the wall' : 'Turned around: the fire and the puppets')) + '</text>';
    return s + '</svg>';
  }
  M.scene('cave', function (c) {
    var w = h('div', 'pc-room'); c.el.appendChild(w);
    var st = { fireX: 380, fireY: 120, objX: 200 }, t0 = performance.now(), live = true;
    function frame() { if (!live) return; st.objX = 230 + Math.sin((performance.now() - t0) / 900) * 40; w.innerHTML = cave(st, 'wall'); setTimeout(frame, 60); }
    frame();
    var b = h('button', 'kl-go', 'I’ve watched the wall'); b.type = 'button'; c.el.appendChild(b);
    b.onclick = function () { c.act('seen'); b.disabled = true; };
    if (c.st.seen) b.disabled = true;
    return { destroy: function () { live = false; } };
  });
  M.scene('cave-probe', function (c) {
    var w = h('div', 'pc-room'); c.el.appendChild(w);
    var ctl = h('div', 'pc-ctl',
      '<label>Fire height<input type="range" min="40" max="200" data-r="fire"></label><label>Puppet: nearer the wall ↔ nearer the fire<input type="range" min="205" max="300" data-r="obj"></label>' +
      '<div class="row"><button type="button" data-v="face-wall">Face the wall</button><button type="button" data-v="turn-around">Turn around</button><button type="button" data-v="go-outside">Go outside</button></div><p class="lr-tried"></p>');
    c.el.appendChild(ctl);
    ctl.querySelector('[data-r=fire]').value = c.st.fireY; ctl.querySelector('[data-r=obj]').value = c.st.objX;
    function note(k) { var t = (c.st.tried || []).slice(); if (t.indexOf(k) < 0) { t.push(k); c.act('record', t); } }
    ctl.addEventListener('input', function (e) {
      if (e.target.matches('[data-r=fire]')) { c.act('move-fire', +e.target.value); note('fire'); }
      if (e.target.matches('[data-r=obj]')) { c.act('move-object', +e.target.value); note('object'); }
    });
    ctl.addEventListener('click', function (e) { var b = e.target.closest('[data-v]'); if (!b) return; var v = b.getAttribute('data-v'); c.act(v); if (v !== 'face-wall') note(v === 'turn-around' ? 'turn' : 'outside'); });
    function upd(s) {
      w.innerHTML = cave(s, s.view);
      [].forEach.call(ctl.querySelectorAll('[data-v]'), function (b) { b.classList.toggle('on', ({ 'face-wall': 'wall', 'turn-around': 'fire', 'go-outside': 'outside' })[b.getAttribute('data-v')] === s.view); });
      ctl.querySelector('.lr-tried').textContent = tr('Things tried') + ': ' + (s.tried || []).length + ' / 4' + ((s.tried || []).length < 3 ? ' — ' + tr('try at least 3') : '');
    }
    upd(c.st);
    return { update: upd };
  });

  // ================================================================== Aristotle’s Four Causes
  M.scene('causes-pick', function (c) {
    var O = c.content.objects, w = h('div', 'ac-pick', Object.keys(O).map(function (k) { return '<button type="button" data-o="' + k + '" class="ac-obj"><span class="ac-ic ic-' + k + '"></span><b>' + esc(O[k].label) + '</b>' + (O[k].note ? '<small>' + esc(O[k].note) + '</small>' : '') + '</button>'; }).join(''));
    c.el.appendChild(w);
    w.addEventListener('click', function (e) { var b = e.target.closest('[data-o]'); if (b) c.act('pick', b.getAttribute('data-o')); });
    function upd(s) { [].forEach.call(w.querySelectorAll('[data-o]'), function (b) { b.classList.toggle('on', b.getAttribute('data-o') === s.obj); }); }
    upd(c.st); return { update: upd };
  });
  M.scene('causes-bench', function (c) {
    var obj = c.content.objects[c.st.obj], S = c.content.slots, sel = null, msg = '';
    var cards = obj.cards.slice().sort(function (a, b) { return (a.id < b.id ? -1 : 1); });
    var w = h('div', 'ac-bench'); c.el.appendChild(w);
    function paint(s) {
      var placed = s.placed || {}, used = {}; Object.keys(placed).forEach(function (k) { used[placed[k]] = k; });
      w.innerHTML = '<p class="ac-thing">' + esc(obj.label) + '</p><div class="ac-slots">' + S.map(function (sl) {
        var cid = placed[sl.id], cd = cards.filter(function (x) { return x.id === cid; })[0];
        return '<button type="button" class="ac-slot' + (cd ? ' full' : '') + '" data-slot="' + sl.id + '"><b>' + esc(sl.label) + '</b><small>' + esc(sl.q) + '</small><span>' + (cd ? esc(cd.text) : '…') + '</span></button>';
      }).join('') + '</div><div class="ac-cards">' + cards.filter(function (x) { return !used[x.id]; }).map(function (x) { return '<button type="button" class="ac-card' + (sel === x.id ? ' sel' : '') + '" data-card="' + x.id + '">' + esc(x.text) + '</button>'; }).join('') + '</div>' +
        '<p class="ac-msg">' + esc(msg) + '</p><p class="lr-tried">' + esc(tr('Correct')) + ': ' + (s.correct || 0) + ' / 4</p>';
    }
    w.addEventListener('click', function (e) {
      var cb = e.target.closest('[data-card]'), sb = e.target.closest('[data-slot]');
      if (cb) { sel = cb.getAttribute('data-card'); msg = ''; return paint(c.st); }
      if (sb && sel) {
        var cd = cards.filter(function (x) { return x.id === sel; })[0], slot = sb.getAttribute('data-slot'), placed = Object.assign({}, c.st.placed || {}), res;
        if (cd.slot === 'none') { res = 'none'; msg = tr(cd.why || ''); }
        else if (cd.slot === slot) { res = 'right'; placed[slot] = cd.id; msg = ''; }
        else { res = 'wrong'; msg = ''; }
        var correct = Object.keys(placed).filter(function (k) { var x = cards.filter(function (y) { return y.id === placed[k]; })[0]; return x && x.slot === k; }).length;
        sel = null; c.act('place', { placed: placed, lastResult: res, correct: correct, wrongs: (c.st.wrongs || 0) + (res === 'right' ? 0 : 1) });
      }
    });
    paint(c.st);
    return { update: paint };
  });

  // ================================================================== Hegel: being, nothing, becoming
  M.scene('hegel-strip', function (c) {
    var F = c.content.features, w = h('div', 'hg-strip'); c.el.appendChild(w);
    var gone = {}; if (c.st.left === 0) F.forEach(function (f) { gone[f] = 1; });
    function paint() {
      var left = F.filter(function (f) { return !gone[f]; });
      w.innerHTML = '<div class="hg-thing" style="--k:' + (left.length / F.length) + '"><span>' + esc(left.length ? tr('something') : tr('pure being')) + '</span></div>' +
        '<div class="hg-feats">' + F.map(function (f) { return '<button type="button" class="chip' + (gone[f] ? ' gone' : '') + '" data-f="' + esc(f) + '"' + (gone[f] ? ' disabled' : '') + '>' + esc(f) + (gone[f] ? '' : ' ×') + '</button>'; }).join('') + '</div>' +
        '<p class="lr-tried">' + (left.length ? esc(tr('Features left')) + ': ' + left.length : esc(tr('No feature left — no ‘what’ at all.'))) + '</p>';
    }
    w.addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; gone[b.getAttribute('data-f')] = 1; paint(); c.act('strip', { left: F.filter(function (f) { return !gone[f]; }).length }); });
    paint(); return {};
  });
  M.scene('hegel-compare', function (c) {
    var D = c.content.differences, w = h('div', 'hg-cmp'), reply = ''; c.el.appendChild(w);
    var live = true;
    function paint(s) {
      w.innerHTML = '<div class="hg-pair' + (s.watched ? ' moving' : '') + '"><span class="hg-b">' + esc(tr('Being')) + '</span><span class="hg-arrows"><i>→ ' + esc(tr('ceasing-to-be')) + '</i><i>← ' + esc(tr('coming-to-be')) + '</i></span><span class="hg-n">' + esc(tr('Nothing')) + '</span></div>' +
        (s.watched ? '<p class="hg-becoming">' + esc(tr('Becoming')) + '</p>' : '') +
        '<p class="dim">' + esc(tr('How does pure being differ from pure nothing? Try one:')) + '</p><div class="hg-diffs">' + D.map(function (d) { return '<button type="button" class="hg-d' + ((s.tried || []).indexOf(d.id) >= 0 ? ' tried' : '') + '" data-d="' + d.id + '">' + esc(d.text) + '</button>'; }).join('') + '</div>' +
        (reply ? '<p class="hg-reply">' + esc(reply) + '</p>' : '') +
        '<div class="row"><button type="button" class="kl-go" data-watch>' + esc(tr(s.watched ? 'Watch again' : 'Watch the two')) + '</button></div>' +
        '<p class="lr-tried">' + esc(tr('Differences tried')) + ': ' + (s.tried || []).length + ' / ' + D.length + ((s.tried || []).length < 2 ? ' — ' + esc(tr('try at least 2')) : '') + '</p>';
    }
    w.addEventListener('click', function (e) {
      var b = e.target.closest('[data-d]');
      if (b) { var d = D.filter(function (x) { return x.id === b.getAttribute('data-d'); })[0], t = (c.st.tried || []).slice(); reply = tr(d.reply); if (t.indexOf(d.id) < 0) t.push(d.id); c.act('try-diff', { tried: t, last: 'diff' }); return; }
      if (e.target.closest('[data-watch]')) { var p = w.querySelector('.hg-pair'); if (p) { p.classList.remove('moving'); void p.offsetWidth; } c.act('watch'); }
    });
    paint(c.st);
    return { update: paint, destroy: function () { live = false; } };
  });
})();

</script>
<script>
/* Minest · Cognitive Toolkit — the shared knowledge store (window.MinestKS)
   One store for all five cards, so nothing is duplicated when the user moves between them.
     ko:<id>   KnowledgeObject  { id, title, original_input, content_type, root_concept, placement, concept_ids[],
                                  framework_instance_ids[], model_run_ids[], lab_run_ids[], sources[], notes[], created_at, updated_at, version }
     cc:<id>   Concept          { id, labels{en,zh}, aliases[], kind, definition, broader_ids[], origin, ref, review, provenance, created_at }
     kr:<id>   Relation         { id, from, to, type, note, provenance, source_ref, review, ko, created_at, updated_at }
     fwi:<id>  FrameworkInstance{ id, ko, template_id, title, nodes[{id, label, concept_id, parent, order, section, refs[]}], view, updated_at }
     mr:<id>   ModelRun         { id, ko, model_id, inputs, result, at, updated_at }
     mi:run:<id>                (written by MinestMicro — linked to the object by lab_run_ids)
   Node refs used by relations: 'cc:<id>' | 'ko:<id>' | 'note:<ko>:<n>' | 'mr:<id>' | 'mi:<id>'.
   provenance: user · rule (local engine suggestion) · ai-suggested · ai-accepted · library (Minest content).
   review: 'pending' marks Minest-written philosophy content that has not had a content review yet.
   Backend: anything with get / set / keys (MinestKnowledge's shape). Every write fires 'change' { kind, id, ko }. */
(function (root) {
  'use strict';
  var REL = [
    { id: 'belongs-to', label: 'Belongs to', inverse: 'Contains', color: '#6b4ce6' },
    { id: 'related', label: 'Related to', inverse: 'Related to', color: '#8c87a8', sym: true },
    { id: 'supports', label: 'Supports', inverse: 'Supported by', color: '#1f9d55' },
    { id: 'refutes', label: 'Refutes', inverse: 'Refuted by', color: '#d1435b' },
    { id: 'influences', label: 'Influences', inverse: 'Influenced by', color: '#f08c3a' },
    { id: 'applies-to', label: 'Applies to', inverse: 'Applied by', color: '#00a6a6' },
    { id: 'illustrates', label: 'Illustrates', inverse: 'Illustrated by', color: '#c9a227' },
    { id: 'leads-to', label: 'Leads to (my judgment)', inverse: 'Follows from (my judgment)', color: '#5e9cff' }
  ];
  var RELBY = {}; REL.forEach(function (r) { RELBY[r.id] = r; });
  var KINDS = { concept: 'Concept', philosopher: 'Philosopher', theory: 'Theory', question: 'Question', case: 'Case', note: 'Note', 'model-run': 'Model analysis', 'lab-run': 'Experiment' };
  var PROV = { user: 'You', rule: 'Suggested (local rules)', 'ai-suggested': 'Suggested by AI', 'ai-accepted': 'AI suggestion you accepted', library: 'Minest library' };
  // what kind of content a record is — kept apart so a quotation, a scholar's reading, AI output and your own view never blur
  var CONTENT = { quote: 'Quotation (with source)', interpretation: 'Scholarly interpretation', summary: 'Minest summary', ai: 'AI / engine suggestion', view: 'My view', evidence: 'Evidence', question: 'My question' };
  function contentKind(rec) { if (!rec) return null; if (rec.content_kind) return rec.content_kind; return { user: 'view', library: 'summary', rule: 'ai', 'ai-suggested': 'ai', 'ai-accepted': 'ai' }[rec.provenance] || null; }

  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s　·,.;:!?？！。，、"“”'’]+/g, ' ').trim(); }
  function now() { return Date.now(); }

  function create(back) {
    var subs = [];
    function emit(kind, id, ko) { var e = { kind: kind, id: id, ko: ko }; subs.slice().forEach(function (f) { try { f(e); } catch (x) { if (root.console) console.error(x); } }); }
    function get(k) { return back.get(k); }
    function put(k, v, kind, ko) { back.set(k, v); emit(kind, k, ko); return v; }
    function all(p) { return back.keys(p).map(function (k) { return back.get(k); }).filter(Boolean); }

    // ---------------------------------------------------------------- knowledge objects
    function createObject(input, o) {
      o = o || {};
      var id = rid(), t = now();
      var ko = { id: id, title: o.title || String(input || '').trim().slice(0, 120), original_input: String(input || ''), content_type: o.content_type || null,
        root_concept: null, placement: null, concept_ids: [], framework_instance_ids: [], model_run_ids: [], lab_run_ids: [], sources: [], notes: [],
        created_at: t, updated_at: t, version: 1 };
      back.set('ko:' + id, ko);
      if (o.topic) { var c = concept(o.topic, { kind: 'concept', provenance: o.topicProvenance || 'rule' }); ko = get('ko:' + id); ko.root_concept = c; if (ko.concept_ids.indexOf(c) < 0) ko.concept_ids.push(c); back.set('ko:' + id, ko); }
      emit('ko', id, id);
      return get('ko:' + id);
    }
    function object(id) { return get('ko:' + id); }
    function objects() { return all('ko:').sort(function (a, b) { return b.updated_at - a.updated_at; }); }
    function updateObject(id, patch) {
      var ko = object(id); if (!ko) return null;
      Object.keys(patch).forEach(function (k) { ko[k] = patch[k]; });
      ko.updated_at = now(); ko.version = (ko.version || 1) + 1;
      return put('ko:' + id, ko, 'ko', id);
    }
    function attach(koId, field, value) {
      var ko = object(koId); if (!ko || ko[field].indexOf(value) >= 0) return;
      var p = {}; p[field] = ko[field].concat([value]); updateObject(koId, p);
    }
    function deleteObject(id) {
      var ko = object(id); if (!ko) return;
      ko.framework_instance_ids.forEach(function (f) { back.set('fwi:' + f, null); });
      ko.model_run_ids.forEach(function (m) { back.set('mr:' + m, null); });
      relations({ ko: id }).forEach(function (r) { back.set('kr:' + r.id, null); });
      back.set('ko:' + id, null); emit('ko', id, id);
    }

    // ---------------------------------------------------------------- concepts (one record per concept, found by label / alias)
    function findConcept(label) {
      var n = norm(label); if (!n) return null;
      return all('cc:').filter(function (c) {
        return [c.labels.en, c.labels.zh].concat(c.aliases || []).some(function (x) { return x && norm(x) === n; });
      })[0] || null;
    }
    function concept(label, o) {
      o = o || {};
      var labels = typeof label === 'object' ? label : (/[㐀-鿿]/.test(label) ? { zh: label } : { en: label });
      var hit = findConcept(labels.en) || findConcept(labels.zh) || (o.ref && all('cc:').filter(function (c) { return c.ref === o.ref; })[0]);
      if (hit) {
        var changed = false;
        ['en', 'zh'].forEach(function (l) { if (labels[l] && !hit.labels[l]) { hit.labels[l] = labels[l]; changed = true; } });
        if (o.kind && hit.kind === 'concept' && o.kind !== 'concept') { hit.kind = o.kind; changed = true; }
        if (changed) put('cc:' + hit.id, hit, 'cc');
        return hit.id;
      }
      var id = rid(), c = { id: id, labels: { en: labels.en || '', zh: labels.zh || '' }, aliases: o.aliases || [], kind: o.kind || 'concept', definition: o.definition || '',
        broader_ids: [], origin: o.origin || (o.provenance === 'user' ? 'user' : 'library'), ref: o.ref || null, review: o.review || null, provenance: o.provenance || 'user', created_at: now() };
      put('cc:' + id, c, 'cc');
      return id;
    }
    function getConcept(id) { return get('cc:' + id); }
    function label(c) {   // in Chinese mode a concept shows its Chinese name when it has one
      if (typeof c === 'string') c = getConcept(c); if (!c) return '—';
      var zh = root.MinestI18n && root.MinestI18n.lang() === 'zh';
      return (zh ? c.labels.zh || c.labels.en : c.labels.en || c.labels.zh) || 'Untitled';
    }
    function updateConcept(id, patch) { var c = getConcept(id); if (!c) return null; Object.keys(patch).forEach(function (k) { c[k] = patch[k]; }); return put('cc:' + id, c, 'cc'); }
    function addToObject(koId, conceptId) { var ko = object(koId); if (ko && ko.concept_ids.indexOf(conceptId) < 0) { ko.concept_ids.push(conceptId); updateObject(koId, { concept_ids: ko.concept_ids }); } }
    function conceptsOf(koId) { var ko = object(koId); return ko ? ko.concept_ids.map(getConcept).filter(Boolean) : []; }
    // a concept stays in the object while anything in the object still uses it
    function maybeDrop(koId, conceptId) {
      var ko = object(koId); if (!ko || ko.root_concept === conceptId) return;
      var used = relations({ ko: koId }).some(function (r) { return r.from === 'cc:' + conceptId || r.to === 'cc:' + conceptId; }) ||
        ko.framework_instance_ids.some(function (f) { var fi = get('fwi:' + f); return fi && fi.nodes.some(function (n) { return n.concept_id === conceptId; }); });
      if (!used) updateObject(koId, { concept_ids: ko.concept_ids.filter(function (x) { return x !== conceptId; }) });
    }

    // ---------------------------------------------------------------- relations (typed, with provenance)
    function relate(from, to, type, o) {
      o = o || {};
      if (type === 'contains') { var t = from; from = to; to = t; type = 'belongs-to'; }
      if (!RELBY[type]) throw new Error('Unknown relation type ' + type);
      if (from === to) return null;
      var same = all('kr:').filter(function (r) { return r.type === type && ((r.from === from && r.to === to) || (RELBY[type].sym && r.from === to && r.to === from)); })[0];
      if (same) { if (o.note) same.note = o.note; if (o.provenance === 'user' && same.provenance !== 'user') same.provenance = 'user'; same.updated_at = now(); return put('kr:' + same.id, same, 'kr', same.ko); }
      var id = rid(), r = { id: id, from: from, to: to, type: type, note: o.note || '', provenance: o.provenance || 'user', source_ref: o.source_ref || null, review: o.review || null, ko: o.ko || null, created_at: now(), updated_at: now() };
      return put('kr:' + id, r, 'kr', r.ko);
    }
    function relations(f) {
      f = f || {};
      return all('kr:').filter(function (r) {
        if (f.ko && r.ko !== f.ko) return false;
        if (f.node && r.from !== f.node && r.to !== f.node) return false;
        if (f.source && (r.source_ref || '').indexOf(f.source) !== 0) return false;
        return true;
      });
    }
    function updateRelation(id, patch) { var r = get('kr:' + id); if (!r) return null; Object.keys(patch).forEach(function (k) { r[k] = patch[k]; }); if (patch.provenance == null && r.provenance !== 'user') r.provenance = 'user'; r.updated_at = now(); return put('kr:' + id, r, 'kr', r.ko); }
    function unrelate(id) { var r = get('kr:' + id); if (!r) return; back.set('kr:' + id, null); emit('kr', id, r.ko); }

    // ---------------------------------------------------------------- notes (the user's understanding, from any card)
    function addNote(koId, text, o) {
      o = o || {}; var ko = object(koId); if (!ko || !String(text || '').trim()) return null;
      var n = { id: rid(), text: String(text).trim(), from: o.from || 'user', ref: o.ref || null, provenance: 'user', content_kind: CONTENT[o.kind] ? o.kind : 'view', source: o.source || '', at: now() };
      ko.notes.push(n); updateObject(koId, { notes: ko.notes });
      if (o.about) relate('note:' + koId + ':' + n.id, o.about, 'illustrates', { ko: koId, provenance: 'user', source_ref: o.ref || ('note:' + n.id) });
      return n;
    }
    function removeNote(koId, nid) { var ko = object(koId); if (!ko) return; updateObject(koId, { notes: ko.notes.filter(function (n) { return n.id !== nid; }) }); relations({ node: 'note:' + koId + ':' + nid }).forEach(function (r) { unrelate(r.id); }); }

    // ---------------------------------------------------------------- frameworks / model runs / lab runs
    function saveFramework(fi) { fi.updated_at = now(); if (!fi.id) fi.id = rid(); put('fwi:' + fi.id, fi, 'fwi', fi.ko); attach(fi.ko, 'framework_instance_ids', fi.id); return fi; }
    function framework(id) { return get('fwi:' + id); }
    function frameworksOf(koId) { var ko = object(koId); return ko ? ko.framework_instance_ids.map(framework).filter(Boolean) : []; }
    function removeFramework(id) {
      var fi = framework(id); if (!fi) return;

<script>
/* Card 01 · Thought Compass — direction.
   A mechanical compass of three rings around the question: outer = knowledge domains, middle = thinking angles,
   inner = the object's concepts. Drag a ring (inertia, then it settles on a tick) or tap a segment; whatever sits
   under the pointer at the top is selected and the panel shows what you can do with it. Placement: the engine's
   suggestion is shown as a suggestion; the user confirms or changes it (several places allowed). */
(function () {
  'use strict';
  var TK = window.MinestToolkit, esc = TK.esc;

    var p = function (a, r) { return [Math.sin(a) * r, -Math.cos(a) * r]; }, A = p(a0, r1), B = p(a1, r1), Cc = p(a1, r0), D = p(a0, r0), lg = a1 - a0 > Math.PI ? 1 : 0;
    return 'M' + A + ' A' + r1 + ' ' + r1 + ' 0 ' + lg + ' 1 ' + B + ' L' + Cc + ' A' + r0 + ' ' + r0 + ' 0 ' + lg + ' 0 ' + D + ' Z';
  }
  function short(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  TK.register({
    id: 'compass', en: 'Thought Compass', zh: '思想罗盘', color: '#9b5de5', line: 'Find where a thought sits and which way to think next.',
    icon: TK.icon('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><path d="M13.6 10.4 9.5 14.5l1-3.4 3.1-0.7z" fill="currentColor"/>'),
    preview: function (ko) {
      var pl = TK.placement(ko);
      if (!pl.primary) return '<span class="dim">Not placed yet — place it yourself</span>';
      var top = TK.C.path(pl.primary)[0];
      return '<span class="pv-compass"><i style="--h:' + HUE[top] + '"></i>' + esc(TK.C.pathNames(pl.primary).join(' › ')) + '</span>' +
        (pl.related.length ? '<span class="dim">also ' + esc(pl.related.map(function (r) { return TK.C.pathNames(r).slice(-1)[0]; }).join(', ')) + '</span>' : '') +
        '<span class="pill ' + (pl.confirmed ? 'ok' : 'sug') + '">' + (pl.confirmed ? 'Confirmed' : 'Suggested') + '</span>';
    },
    mount: function (el, ko) {
      var C = TK.C, ks = TK.ks, ang = TK.data.angles;
      var st = { rings: { outer: 0, middle: 0, inner: 0 }, sel: { outer: 0, middle: 0, inner: 0 }, focus: 'outer' };
      function inner() {
        // the ring holds up to 8: the topic, then what you added, then concepts, theories, thinkers (questions and cases stay in the list below)
        var rank = { concept: 1, theory: 2, philosopher: 3 }, k = ks.object(ko.id);
        var cs = ks.conceptsOf(ko.id).filter(function (c) { return c.id === k.root_concept || rank[c.kind]; })
          .sort(function (a, b) { return (a.id === k.root_concept ? -9 : 0) - (b.id === k.root_concept ? -9 : 0) || ((a.provenance === 'user' ? 0 : 1) - (b.provenance === 'user' ? 0 : 1)) || ((rank[a.kind] || 5) - (rank[b.kind] || 5)) || b.created_at - a.created_at; }).slice(0, 8);
        return cs.length ? cs.map(function (c) { return { id: c.id, label: ks.label(c), kind: c.kind }; }) : [{ id: null, label: 'No concepts yet', kind: 'empty' }];
      }
      var items = { outer: COLS.map(function (c) { return { id: c, label: C.node(c).en }; }), middle: ang.map(function (a) { return { id: a.id, label: a.label }; }), inner: inner() };
      var pl = TK.placement(ko);

      ['outer', 'middle', 'inner'].forEach(function (r) { st.rings[r] = target(r, st.sel[r]); });

      el.innerHTML = '<div class="cp-wrap"><div class="cp-instrument"><div class="cp-bezel"></div><svg class="cp-svg" viewBox="-200 -200 400 400" role="application" aria-label="Thought Compass. Drag a ring or use the arrow keys."></svg>' +
        '<div class="cp-pointer" aria-hidden="true"></div><div class="cp-help">Drag a ring · tap a segment · ← → turns the active ring</div></div><aside class="cp-panel"></aside></div>';

      function seg(r) { return 360 / items[r].length; }
      function target(r, i) { return -(i + 0.5) * (360 / items[r].length); }
      function draw() {
        var s = '<defs><radialGradient id="cpGlass" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>';
        s += '<circle r="198" class="cp-rim"/>';
        for (var t = 0; t < 120; t++) { var a = t * 3 * Math.PI / 180, l = t % 10 === 0 ? 8 : 4; s += '<line class="cp-tick" x1="' + Math.sin(a) * 196 + '" y1="' + -Math.cos(a) * 196 + '" x2="' + Math.sin(a) * (196 - l) + '" y2="' + -Math.cos(a) * (196 - l) + '"/>'; }

          s += '<g class="cp-ring cp-' + r + (st.focus === r ? ' focus' : '') + '" data-ring="' + r + '" style="transform:rotate(' + st.rings[r] + 'deg)">';
          items[r].forEach(function (it, i) {
            var a0 = i * sg, a1 = a0 + sg, on = i === st.sel[r], hue = r === 'outer' ? HUE[it.id] : r === 'middle' ? '#6b4ce6' : '#2f8f83';
            var isPlace = r === 'outer' && pl.primary && C.path(pl.primary)[0] === it.id, isRel = r === 'outer' && pl.related.some(function (x) { return C.path(x)[0] === it.id; });
            s += '<path class="cp-seg' + (on ? ' on' : '') + (isPlace ? ' place' : '') + (isRel ? ' rel' : '') + '" data-ring="' + r + '" data-i="' + i + '" style="--h:' + hue + '" d="' + arc(rr[0], rr[1], a0 + 0.012, a1 - 0.012) + '"/>';
