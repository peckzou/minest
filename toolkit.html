            var maxc = Math.max(6, Math.floor(sg * mid / (r === 'inner' ? 5.6 : 6.2)));
            s += '<text class="cp-lab' + (on ? ' on' : '') + '" transform="translate(' + x + ' ' + y + ') rotate(' + deg + ')">' + esc(short(window.MinestI18n ? MinestI18n.t(it.label) : it.label, window.MinestI18n && MinestI18n.lang() === 'zh' ? Math.max(4, Math.round(maxc / 1.8)) : maxc)) + '</text>';
          });
          s += '</g>';
        });
        s += '<circle r="56" class="cp-core"/><circle r="56" fill="url(#cpGlass)"/>';
        s += '<foreignObject x="-48" y="-40" width="96" height="80"><div xmlns="http://www.w3.org/1999/xhtml" class="cp-q">' + esc(short(ko.title, 70)) + '</div></foreignObject>';
        svg.innerHTML = s;
      }

      // ---------------------------------------------------------------- physics: drag, inertia, settle on a tick
      var drag = null, raf = 0;   // raf = animation token: a new animation cancels the old one
      function frame(cb) { var my = raf, done = false, go = function () { if (done || my !== raf) return; done = true; cb(performance.now()); }; requestAnimationFrame(go); setTimeout(go, 34); }
      function angleAt(e) { var b = svg.getBoundingClientRect(); return Math.atan2(e.clientX - (b.left + b.width / 2), -(e.clientY - (b.top + b.height / 2))) * 180 / Math.PI; }
      function setRot(r, v) { st.rings[r] = v; var g = svg.querySelector('.cp-ring[data-ring=' + r + ']'); if (g) g.style.transform = 'rotate(' + v + 'deg)'; }
      function nearest(r) { var sg = seg(r), v = st.rings[r]; var i = Math.round((-v / sg) - 0.5); var n = items[r].length; return { i: ((i % n) + n) % n, v: -(i + 0.5) * sg }; }
      function animateTo(r, to, done) {
        raf++; var from = st.rings[r], t0 = performance.now(), D = reduce ? 1 : 420;
        (function step(t) { var k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); setRot(r, from + (to - from) * e); if (k < 1) frame(step); else if (done) done(); })(t0);
      }
      function settle(r, vel) {
        var t0 = performance.now(), last = t0;
        raf++;
        (function coast(t) {
          var dt = Math.min(40, t - last); last = t; vel *= Math.pow(0.0025, dt / 1000);
          if (!reduce && Math.abs(vel) > 0.02) { setRot(r, st.rings[r] + vel * dt); frame(coast); return; }
          var n = nearest(r); animateTo(r, n.v, function () { select(r, n.i); });
        })(t0);
      }
      svg.addEventListener('pointerdown', function (e) {
        var g = e.target.closest('[data-ring]'); if (!g) return;
        var r = g.getAttribute('data-ring'); st.focus = r;
        drag = { r: r, a: angleAt(e), start: st.rings[r], moved: 0, t: performance.now(), v: 0, seg: e.target.getAttribute('data-i') };
        try { svg.setPointerCapture(e.pointerId); } catch (x) {} raf++;
        $$('.cp-ring', svg).forEach(function (x) { x.classList.toggle('focus', x.getAttribute('data-ring') === r); });
      });
      svg.addEventListener('pointermove', function (e) {
        if (!drag) return; var a = angleAt(e), d = a - drag.a; if (d > 180) d -= 360; if (d < -180) d += 360;
        var now = performance.now(), v = st.rings[drag.r]; setRot(drag.r, v + d); drag.moved += Math.abs(d);
        drag.v = d / Math.max(1, now - drag.t); drag.t = now; drag.a = a;
      });
      function up() {
        if (!drag) return; var d = drag; drag = null;
        if (d.moved < 4 && d.seg != null) { var i = +d.seg; animateTo(d.r, closestTurn(d.r, target(d.r, i)), function () { select(d.r, i); }); return; }
        settle(d.r, d.v);
      }
      function closestTurn(r, v) { var cur = st.rings[r]; while (v - cur > 180) v -= 360; while (v - cur < -180) v += 360; return v; }
      svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
      svg.tabIndex = 0;
      svg.addEventListener('keydown', function (e) {
        var r = st.focus, n = items[r].length;
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); var i = (st.sel[r] + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; animateTo(r, closestTurn(r, target(r, i)), function () { select(r, i); }); }
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); var o = ['outer', 'middle', 'inner'], k = (o.indexOf(r) + (e.key === 'ArrowDown' ? 1 : 2)) % 3; st.focus = o[k]; draw(); side(); }
      });
      // a gentle parallax: the bezel and glass shift with the pointer, the rings stay flat so dragging stays exact
      inst.addEventListener('pointermove', function (e) { if (drag || reduce) return; var b = inst.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5; inst.style.setProperty('--px', x.toFixed(3)); inst.style.setProperty('--py', y.toFixed(3)); });
      inst.addEventListener('pointerleave', function () { inst.style.setProperty('--px', 0); inst.style.setProperty('--py', 0); });

      function select(r, i) { st.sel[r] = i; st.focus = r; draw(); side(); }

      // ---------------------------------------------------------------- the side panel
      function side() {
        var ko2 = TK.ko; pl = TK.placement(ko2);
        var sug = ko2.placement && ko2.placement.suggested, h = '';
        h += '<section class="cp-sec"><h3>Where this sits</h3>' + placeHTML(pl) +
          (sug && sug.reasons ? '<details class="cp-why"' + (pl.confirmed ? '' : ' open') + '><summary>Why the suggestion</summary><ul>' + sug.reasons.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul><p class="dim">' + esc(sug.engine || '') + ' · knowledge can sit in more than one place</p></details>' : '') +
          '<div class="cp-fix"><label>Primary place<select data-fix="primary"><option value="">— not placed —</option>' + C.nodes().map(function (n) { return '<option value="' + n.id + '"' + (n.id === pl.primary ? ' selected' : '') + '>' + esc(C.pathNames(n.id).join(' › ')) + '</option>'; }).join('') + '</select></label>' +
          '<div class="cp-rel">' + pl.related.map(function (r) { return '<span class="tag">' + esc(C.pathNames(r).join(' › ')) + ' <button type="button" data-unrel="' + r + '" aria-label="Remove">×</button></span>'; }).join('') + '</div>' +
          '<div class="row"><button type="button" class="primary" data-confirm>' + (pl.confirmed ? 'Save placement' : 'Confirm placement') + '</button></div></div></section>';
        var r = st.focus, it = items[r][st.sel[r]];
        if (r === 'outer') {
          var kids = C.nodes().filter(function (n) { return C.path(n.id)[0] === it.id && n.id !== it.id; });
          h += '<section class="cp-sec"><h3><i class="dot" style="--h:' + HUE[it.id] + '"></i>' + esc(it.label) + '</h3><p class="dim">Places in this domain — set one as primary or add it as another place.</p><ul class="cp-tree">' +
            [C.node(it.id)].concat(kids).map(function (n) { var d = C.path(n.id).length; return '<li style="--d:' + d + '"><span>' + esc(n.en) + '</span><button type="button" class="small" data-setp="' + n.id + '">Primary</button><button type="button" class="small ghost" data-addr="' + n.id + '">+ Also</button></li>'; }).join('') + '</ul></section>';
        } else if (r === 'middle') {
          var a = ang[st.sel.middle], mods = modelsFor(a.id), labs = a.id === 'experience' ? TK.data.labs : [];
          h += '<section class="cp-sec"><h3>' + esc(a.label) + ' <small class="dim">' + esc(a.hint) + '</small></h3>' +
            (mods.length ? '<p class="dim">Thinking models for this angle</p>' + mods.map(function (m) { return '<button type="button" class="cp-link" data-model="' + m.id + '">' + esc(m.title) + ' →</button>'; }).join('') : '') +
            (labs.length ? '<p class="dim">Experiments</p>' + labs.map(function (l) { return '<button type="button" class="cp-link" data-lab="' + l.interaction_id + '">' + esc(l.title) + ' →</button>'; }).join('') : '') + '</section>';
        } else if (it.id) {
          var allC = TK.ks.conceptsOf(TK.ko.id);
          var c = TK.ks.getConcept(it.id), up = TK.ks.relations({ node: 'cc:' + it.id }).filter(function (x) { return x.type === 'belongs-to' && x.from === 'cc:' + it.id; });
          var down = TK.ks.relations({ node: 'cc:' + it.id }).filter(function (x) { return x.type === 'belongs-to' && x.to === 'cc:' + it.id; });
          h += '<section class="cp-sec"><h3>' + esc(it.label) + ' <small class="dim">' + esc(TK.ks.KINDS[c.kind] || '') + '</small></h3>' +
            (up.length ? '<p><span class="dim">Belongs to</span> ' + up.map(function (x) { return '<span class="tag">' + esc(nodeLabel(x.to)) + '</span>'; }).join('') + '</p>' : '') +
            (down.length ? '<p><span class="dim">Contains</span> ' + down.map(function (x) { return '<span class="tag">' + esc(nodeLabel(x.from)) + '</span>'; }).join('') + '</p>' : '') +
            '<div class="row"><button type="button" data-open="framework" data-concept="' + it.id + '">Open in Framework</button><button type="button" data-open="graph" data-concept="' + it.id + '">Show in Graph</button></div>' +
            '<details class="cp-why"><summary>All ' + allC.length + ' concepts in this object</summary><div class="cp-all">' + allC.map(function (x) { return '<button type="button" class="chip" data-open="graph" data-concept="' + x.id + '">' + esc(TK.ks.label(x)) + '</button>'; }).join('') + '</div></details></section>';
        } else {
          h += '<section class="cp-sec"><h3>No concepts yet</h3><p class="dim">Concepts appear here when you add them in the Framework Card or the Graph.</p><button type="button" data-open="framework">Open Framework Card</button></section>';
        }
        h += '<section class="cp-sec cp-jump"><h3>Go on with this thought</h3><div class="row">' + ['framework', 'models', 'lab', 'graph'].map(function (id) { var cd = TK.cards[id]; return '<button type="button" data-go="' + id + '" style="--cc:' + cd.color + '">' + cd.icon + esc(cd.en) + '</button>'; }).join('') + '</div></section>';
        panel.innerHTML = h;
      }
      function nodeLabel(ref) { return ref.indexOf('cc:') === 0 ? TK.ks.label(ref.slice(3)) : ref; }
      function placeHTML(pl) {
        if (!pl.primary) return '<p class="dim">Not placed. Choose a place below — or leave it unplaced.</p>';
        return '<p class="cp-path">' + esc(C.pathNames(pl.primary).join(' › ')) + ' <span class="pill ' + (pl.confirmed ? 'ok' : 'sug') + '">' + (pl.confirmed ? 'Confirmed by you' : (pl.uncertain ? 'Suggested · uncertain' : 'Suggested')) + '</span></p>';
      }
      function modelsFor(angle) {
        var extra = { value: ['perspectives', 'incentives'] }[angle] || [];
        return TK.data.models.filter(function (m) { return m.angle === angle || extra.indexOf(m.id) >= 0; });
      }
      var draft = null;   // the placement being edited (primary + related) before it is saved
      function cur() { if (!draft) { var p = TK.placement(TK.ko); draft = { primary: p.primary, related: p.related.slice() }; } return draft; }
      panel.addEventListener('change', function (e) { if (e.target.matches('[data-fix=primary]')) { cur().primary = e.target.value || null; } });
      panel.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-setp')) { cur().primary = b.getAttribute('data-setp'); commit('Primary place set'); }
        else if (b.hasAttribute('data-addr')) { var id = b.getAttribute('data-addr'), d = cur(); if (d.related.indexOf(id) < 0 && id !== d.primary) d.related.push(id); commit('Added as another place'); }
        else if (b.hasAttribute('data-unrel')) { var u = b.getAttribute('data-unrel'), d2 = cur(); d2.related = d2.related.filter(function (x) { return x !== u; }); commit('Removed'); }
        else if (b.hasAttribute('data-confirm')) { var sel = panel.querySelector('[data-fix=primary]'); cur().primary = sel.value || null; commit('Placement saved'); }
        else if (b.hasAttribute('data-model')) TK.open('models', { objectId: TK.ko.id, model: b.getAttribute('data-model') });
        else if (b.hasAttribute('data-lab')) TK.open('lab', { objectId: TK.ko.id, lab: b.getAttribute('data-lab') });
        else if (b.hasAttribute('data-open')) TK.open(b.getAttribute('data-open'), { objectId: TK.ko.id, concept: b.getAttribute('data-concept') });
      });
      function commit(msg) {
        var d = cur(); TK.silently(function () { TK.confirmPlacement(d.primary, d.related.filter(function (x) { return x !== d.primary; })); });
        draft = null; pl = TK.placement(TK.ko);
        if (pl.primary) st.sel.outer = Math.max(0, COLS.indexOf(C.path(pl.primary)[0]));
        animateTo('outer', closestTurn('outer', target('outer', st.sel.outer)), function () { draw(); side(); });
        TK.toast(msg);
      }

      draw(); side();
      return {
        refresh: function () { ko = TK.ko; items.inner = inner(); if (st.sel.inner >= items.inner.length) st.sel.inner = 0; st.rings.inner = target('inner', st.sel.inner); draw(); side(); },
        destroy: function () { raf++; }
      };
      function $$(s, r) { return [].slice.call(r.querySelectorAll(s)); }
    }
  });
})();

<script>
/* Card 02 · Framework Card — structure.
   An editable outline that organises the object's knowledge. Built from a template (tools/toolkit/data/templates.json),
   optionally pre-filled with Minest's starter content for well-known concepts (data/seeds.json, review pending).
   Every item under a concept section IS a concept of the shared store (found by name, never duplicated), and its place
   in the outline is a typed relation (the section says which: belongs-to, applies-to, influences, refutes …), tagged
   source_ref 'fwi:<framework>:<node>' so the Graph can say where a link came from. Moving a node re-types its link;
   deleting it removes only the links this framework made. Views: Outline (edit) · Tree · Levels · Cards. */
(function () {
  'use strict';
  var TK = window.MinestToolkit, esc = TK.esc;
  function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function tpl(id) { return TK.data.templates.filter(function (t) { return t.id === id; })[0]; }
  function kids(fi, pid) { return fi.nodes.filter(function (n) { return n.parent === pid; }).sort(function (a, b) { return a.order - b.order; }); }
  function node(fi, id) { return fi.nodes.filter(function (n) { return n.id === id; })[0]; }
  function rootOf(fi) { return fi.nodes.filter(function (n) { return n.role === 'root'; })[0]; }
  function sectionOf(fi, n) { var p = n; while (p && p.role !== 'section') { p = node(fi, p.parent); } return p || null; }
  function descendants(fi, id) { var out = []; kids(fi, id).forEach(function (k) { out.push(k); out = out.concat(descendants(fi, k.id)); }); return out; }
  function depth(fi, n) { var d = 0, p = n; while (p && p.parent) { d++; p = node(fi, p.parent); } return d; }
  function isConceptNode(fi, n) { if (n.role !== 'item') return false; var s = sectionOf(fi, n); return !s || s.kind !== 'text'; }

  // ------------------------------------------------------------------ concept + relation sync for one node
  function sync(fi, n) {
    if (n.role !== 'item') return;   // the root keeps its topic concept; sections are structure only
    var ks = TK.ks, src = 'fwi:' + fi.id + ':' + n.id;
    ks.relations({ source: src }).forEach(function (r) { if (r.source_ref === src || r.source_ref.indexOf(src + ':') === 0) ks.unrelate(r.id); });
    if (!isConceptNode(fi, n)) { if (n.concept_id) { var old = n.concept_id; n.concept_id = null; ks.maybeDrop(fi.ko, old); } return; }
    var sec = sectionOf(fi, n), kind = (sec && sec.kind && sec.kind !== 'text') ? sec.kind : 'concept';
    if (!n.label.trim()) return;
    var prev = n.concept_id, cid = ks.concept(n.label.trim(), { kind: kind, provenance: n.provenance || 'user', review: n.review || null });
    n.concept_id = cid; ks.addToObject(fi.ko, cid);
    var parent = node(fi, n.parent), root = rootOf(fi), rootC = root && root.concept_id;
    var rel = null, from = 'cc:' + cid, to = null;
    if (parent && parent.role === 'item' && parent.concept_id) { rel = 'belongs-to'; to = 'cc:' + parent.concept_id; }
    else if (parent && parent.role === 'section' && rootC) { rel = parent.rel || 'related'; to = 'cc:' + rootC; if (parent.dir === 'root-item') { var t = from; from = to; to = t; } }
    else if (rootC) { rel = 'related'; to = 'cc:' + rootC; }
    if (rel && to) ks.relate(from, to, rel, { ko: fi.ko, provenance: n.provenance || 'user', review: n.review || null, source_ref: src, note: sec ? 'In ‘' + fi.title + '’ › ' + sec.label : 'In ‘' + fi.title + '’' });
    (n.refs || []).forEach(function (r) { if (r !== cid) ks.relate('cc:' + cid, 'cc:' + r, 'related', { ko: fi.ko, provenance: 'user', source_ref: src + ':ref', note: 'Cross-reference in ‘' + fi.title + '’' }); });
    if (prev && prev !== cid) ks.maybeDrop(fi.ko, prev);
  }

  // ------------------------------------------------------------------ build an instance from a template (+ seed)
  function build(ko, t, useSeed) {
    var ks = TK.ks, seed = useSeed ? TK.data.seeds.filter(function (s) { return s.id === ko.seed && s.template === t.id; })[0] : null;
    var fi = { id: rid(), ko: ko.id, template_id: t.id, title: t.title, view: 'outline', nodes: [] };
    var rootC = ko.root_concept || ks.concept(TK.rootLabel(ko), { kind: 'concept' });
    if (!ko.root_concept) ks.updateObject(ko.id, { root_concept: rootC });
    ks.addToObject(ko.id, rootC);
    var root = { id: rid(), role: 'root', label: ks.label(rootC), concept_id: rootC, parent: null, order: 0 };
    fi.nodes.push(root);
    t.sections.forEach(function (s, i) {
      var sec = { id: rid(), role: 'section', label: s.label, key: s.key, kind: s.kind, rel: s.rel, dir: s.dir, hint: s.hint || '', parent: root.id, order: i };
      fi.nodes.push(sec);
      var fill = seed && seed.fill[s.key];
      (fill || []).forEach(function (f, k) {
        var lab = typeof f === 'string' ? f : (f.en || f.zh);
        var n = { id: rid(), role: 'item', label: lab, parent: sec.id, order: k, provenance: 'library', review: seed.review || null };
        fi.nodes.push(n);
        if (typeof f === 'object' && f.zh && s.kind !== 'text') n.zh = f.zh;
      });
    });
    TK.silently(function () {
      ks.saveFramework(fi);
      fi.nodes.forEach(function (n) { if (n.zh) { n.concept_id = ks.concept({ en: n.label, zh: n.zh }, { kind: (sectionOf(fi, n) || {}).kind || 'concept', provenance: 'library', review: n.review }); } sync(fi, n); });
      if (seed) (seed.relations || []).forEach(function (r) {
        var a = ks.findConcept(r[0]), b = ks.findConcept(r[2]);
        if (a && b) ks.relate('cc:' + a.id, 'cc:' + b.id, r[1], { ko: ko.id, provenance: 'library', review: seed.review || null, source_ref: 'fwi:' + fi.id + ':seed', note: 'Minest starter content' });
      });
      ks.saveFramework(fi);
    });
    return fi;
  }

  function pend(t) { return !!t.content_review_status && TK.ks.reviewStatus('tpl', t.id, t.content_review_status) === 'pending'; }
  TK.frameworkOps = { build: build, sync: sync, kids: kids, rootOf: rootOf };   // for tests and future hosts
  TK.register({
    id: 'framework', en: 'Framework Card', zh: '知识框架卡', color: '#5e9cff', line: 'Organise ideas into a structure you can edit.',
    icon: TK.icon('<rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/><rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v5M6 17v-2.5h12V17"/>'),
    preview: function (ko) {
      var fs = TK.ks.frameworksOf(ko.id);
      if (!fs.length) { var sd = ko.seed && TK.data.seeds.filter(function (s) { return s.id === ko.seed; })[0]; return '<span class="dim">' + (sd ? 'Starter structure ready: ' + esc(tpl(sd.template).title) : 'Start from a template') + '</span>'; }
      var f = fs[0], secs = kids(f, rootOf(f).id).slice(0, 4);
      return '<span class="pv-list">' + secs.map(function (s) { return '<i>' + esc(s.label.split(' — ')[0]) + ' <small>' + kids(f, s.id).length + '</small></i>'; }).join('') + '</span><span class="dim">' + fs.length + ' framework' + (fs.length > 1 ? 's' : '') + ' · ' + f.nodes.filter(function (n) { return n.role === 'item'; }).length + ' items</span>';
    },
    mount: function (el, ko, opts) {
      var ks = TK.ks, fi = null, sel = null, collapsed = {};
      el.innerHTML = '<div class="fw-wrap"><aside class="fw-side"><h3>Frameworks</h3><div class="fw-list"></div><button type="button" class="primary" data-new>+ New framework</button>' +
        '<h3>Notes from other cards</h3><div class="fw-notes"></div></aside><section class="fw-main"></section></div><div class="fw-modal" hidden></div>';
      var list = el.querySelector('.fw-list'), main = el.querySelector('.fw-main'), notes = el.querySelector('.fw-notes'), modal = el.querySelector('.fw-modal');

      function load() {
        var fs = ks.frameworksOf(ko.id);
        if (!fi || !ks.framework(fi.id)) fi = fs[0] || null; else fi = ks.framework(fi.id);
        list.innerHTML = fs.map(function (f) { var t = tpl(f.template_id); return '<button type="button" class="fw-li' + (fi && f.id === fi.id ? ' on' : '') + '" data-fi="' + f.id + '"><b>' + esc(f.title) + '</b><small>' + f.nodes.filter(function (n) { return n.role === 'item'; }).length + ' items' + (t && pend(t) ? ' · review pending' : '') + '</small></button>'; }).join('') || '<p class="dim">No framework yet.</p>';
        var ns = (ks.object(ko.id).notes || []);
        notes.innerHTML = (ns.length ? ns.slice().reverse().map(function (n) { var ck = n.content_kind || 'view'; return '<div class="fw-note"><span class="ck ck-' + ck + '">' + esc(ks.CONTENT[ck]) + '</span><p>' + esc(n.text) + '</p>' + (n.source ? '<small class="dim">Source: ' + esc(n.source) + '</small><br>' : '') + '<small class="dim">from ' + esc(n.from) + '</small>' + (fi ? '<button type="button" class="small" data-notein="' + n.id + '">Add to framework</button>' : '') + '</div>'; }).join('') : '<p class="dim">Understandings saved in the Lab or Models appear here.</p>') +
          '<div class="fw-addnote"><select aria-label="Kind of note"><option value="view">My view</option><option value="evidence">Evidence</option><option value="quote">Quotation (with source)</option><option value="question">My question</option></select><textarea rows="2" placeholder="Add a note…"></textarea><input placeholder="Source (needed for a quotation or evidence)"><button type="button" class="small" data-addnote>Add note</button></div>';
        if (!fi) return chooser(true);
        paint();
      }
      function save() { TK.silently(function () { ks.saveFramework(fi); }); }   // this card repaints itself; other cards read the store when shown

      // ---------------------------------------------------------------- template chooser
      function chooser(inline) {
        var seed = ko.seed && TK.data.seeds.filter(function (s) { return s.id === ko.seed; })[0];
        var h = '<div class="fw-choose"><h3>Choose a framework template</h3><p class="dim">Each template is a starting structure — every node can be renamed, moved or deleted. Philosophy templates say what they are and what they are not.</p>' +
          (seed ? '<label class="fw-seed"><input type="checkbox" checked data-useseed> Start with Minest’s starter content for “' + esc(TK.rootLabel(ks.object(ko.id))) + '” <span class="pill sug">review pending</span></label>' : '') +
          '<div class="fw-tpls">' + TK.data.templates.map(function (t) {
            var rec = seed && seed.template === t.id;
            return '<button type="button" class="fw-tpl' + (rec ? ' rec' : '') + '" data-tpl="' + t.id + '"><b>' + esc(t.title) + (rec ? ' <span class="pill ok">fits</span>' : '') + (pend(t) ? ' <span class="pill sug">review pending</span>' : (t.content_review_status ? ' <span class="pill ok">reviewed</span>' : '')) + '</b><span>' + esc(t.scope) + '</span><em>' + esc(t.caution) + '</em>' + (t.source ? '<small>' + esc(t.source) + '</small>' : '') + '</button>';
          }).join('') + '</div>' + (inline ? '' : '<button type="button" data-close>Cancel</button>') + '</div>';
        if (inline) { main.innerHTML = h; } else { modal.innerHTML = '<div class="fw-modal-card">' + h + '</div>'; modal.hidden = false; }
      }
      function pick(id, host) {
        var t = tpl(id), useSeed = !!(host.querySelector('[data-useseed]') && host.querySelector('[data-useseed]').checked);
        fi = build(ks.object(ko.id), t, useSeed); modal.hidden = true; TK.toast('“' + t.title + '” created'); load();
      }

      // ---------------------------------------------------------------- views
      function paint() {
        var t = tpl(fi.template_id) || {};
        main.innerHTML = '<header class="fw-hd"><input class="fw-title" value="' + esc(fi.title) + '" aria-label="Framework name"><div class="fw-views">' +
          [['outline', 'Outline'], ['tree', 'Tree'], ['levels', 'Levels'], ['cards', 'Cards']].map(function (v) { return '<button type="button" data-view="' + v[0] + '" class="' + (fi.view === v[0] ? 'on' : '') + '">' + v[1] + '</button>'; }).join('') +
          '</div><button type="button" class="ghost small" data-delfw>Delete framework</button></header>' +
          (t.caution ? '<p class="fw-caution">' + (t.content_review_status ? (pend(t) ? '<span class="pill sug">review pending</span> ' : '<span class="pill ok">reviewed</span> ') + '<button type="button" class="small ghost" data-review="' + t.id + '">' + (pend(t) ? 'Mark reviewed' : 'Mark pending') + '</button> ' : '') + esc(t.caution) + (t.source ? ' <span class="dim">· ' + esc(t.source) + '</span>' : '') + '</p>' : '') +
          '<div class="fw-body"></div>';
        var body = main.querySelector('.fw-body');
        if (fi.view === 'tree') tree(body); else if (fi.view === 'levels') levels(body); else if (fi.view === 'cards') cards(body); else outline(body);
        if (opts && opts.concept) { var hit = fi.nodes.filter(function (n) { return n.concept_id === opts.concept; })[0]; opts.concept = null; if (hit) { sel = hit.id; focusRow(hit.id); } }
      }
      function badge(n) {
        if (n.role === 'root') return '<span class="fw-k k-root">Topic</span>';
        if (n.role === 'section') return '';
        var s = sectionOf(fi, n), k = s && s.kind !== 'text' ? s.kind : (s ? 'text' : 'concept');
        return (k === 'text' ? '' : '<span class="fw-k k-' + k + '">' + esc(ks.KINDS[k] || k) + '</span>') + (n.provenance === 'library' ? '<span class="fw-k k-lib" title="Minest starter content — review pending">Minest</span>' : '');
      }
      function outline(body) {
        var rows = [];
        (function walk(pid, d) { kids(fi, pid).forEach(function (n) { rows.push([n, d]); if (!collapsed[n.id]) walk(n.id, d + 1); }); })(null, 0);
        body.innerHTML = '<div class="fw-outline" role="tree">' + rows.map(function (x) {
          var n = x[0], d = x[1], has = kids(fi, n.id).length, refs = (n.refs || []).map(function (r) { return '<span class="fw-ref">↗ ' + esc(ks.label(r)) + '</span>'; }).join('');
          return '<div class="fw-row r-' + n.role + (sel === n.id ? ' sel' : '') + '" data-id="' + n.id + '" style="--d:' + d + '" role="treeitem" aria-expanded="' + (has ? !collapsed[n.id] : '') + '">' +
            (n.role === 'root' ? '<span class="fw-h"></span>' : '<span class="fw-h" data-drag title="Drag to move">⋮⋮</span>') +
            '<button type="button" class="fw-tg" data-tg' + (has ? '' : ' disabled') + '>' + (has ? (collapsed[n.id] ? '▸' : '▾') : '·') + '</button>' +
            '<input class="fw-in" value="' + esc(n.label) + '" placeholder="' + esc(n.role === 'section' ? 'Section' : (n.hint || 'Type…')) + '" aria-label="Node">' + badge(n) + refs +
            '<span class="fw-act"><button type="button" title="Add inside" data-add>＋</button>' + (n.role !== 'root' ? '<button type="button" title="Link to another concept" data-ref>↗</button><button type="button" title="Move up" data-up>↑</button><button type="button" title="Move down" data-down>↓</button><button type="button" title="Indent" data-in>→</button><button type="button" title="Outdent" data-out>←</button><button type="button" title="Delete" data-del>✕</button>' : '') + '</span></div>';
        }).join('') + '</div><p class="dim fw-tip">Enter: new item · Tab / Shift-Tab: indent · drag ⋮⋮ to move (drop on the right half of a row to put it inside) · items under a section become concepts shared with every card.</p>';
      }
      function tree(body) {
        var W = 0, rows = 0, pos = {};
        (function lay(n, d) { var ch = kids(fi, n.id); if (!ch.length || collapsed[n.id]) { pos[n.id] = [d, rows++]; } else { ch.forEach(function (c) { lay(c, d + 1); }); var ys = ch.map(function (c) { return pos[c.id][1]; }); pos[n.id] = [d, (Math.min.apply(0, ys) + Math.max.apply(0, ys)) / 2]; } W = Math.max(W, d); })(rootOf(fi), 0);
        var cw = 210, rh = 30, s = '';
        fi.nodes.forEach(function (n) { if (!pos[n.id] || !n.parent || !pos[n.parent]) return; var a = pos[n.parent], b = pos[n.id]; s += '<path class="fw-edge" d="M' + (a[0] * cw + 170) + ' ' + (a[1] * rh + 15) + ' C' + (a[0] * cw + 190) + ' ' + (a[1] * rh + 15) + ' ' + (b[0] * cw - 10) + ' ' + (b[1] * rh + 15) + ' ' + (b[0] * cw) + ' ' + (b[1] * rh + 15) + '"/>'; });
        fi.nodes.forEach(function (n) { var p = pos[n.id]; if (!p) return; s += '<g class="fw-tn r-' + n.role + '" data-id="' + n.id + '" transform="translate(' + p[0] * cw + ' ' + p[1] * rh + ')"><rect width="170" height="24" rx="8"/><text x="10" y="16">' + esc(n.label.length > 24 ? n.label.slice(0, 23) + '…' : n.label || '…') + '</text></g>'; });
        body.innerHTML = '<div class="fw-treebox"><svg class="fw-tree" viewBox="-10 -10 ' + ((W + 1) * cw + 20) + ' ' + (rows * rh + 20) + '" style="width:' + ((W + 1) * cw + 20) + 'px">' + s + '</svg></div>';
      }
      function levels(body) {
        var by = {}; fi.nodes.forEach(function (n) { var d = depth(fi, n); (by[d] = by[d] || []).push(n); });
        body.innerHTML = '<div class="fw-levels">' + Object.keys(by).map(function (d) { return '<div class="fw-col"><h4>Level ' + (+d + 1) + '</h4>' + by[d].map(function (n) { return '<button type="button" class="fw-chip r-' + n.role + '" data-id="' + n.id + '">' + esc(n.label || '…') + (n.parent && +d > 1 ? '<small>' + esc(node(fi, n.parent).label) + '</small>' : '') + '</button>'; }).join('') + '</div>'; }).join('') + '</div>';
      }
      function cards(body) {
        var root = rootOf(fi);
        body.innerHTML = '<div class="fw-cards">' + kids(fi, root.id).map(function (s) { return '<article class="fw-c" data-id="' + s.id + '"><h4>' + esc(s.label) + '</h4><ul>' + descendants(fi, s.id).map(function (n) { return '<li style="--d:' + (depth(fi, n) - 2) + '" data-id="' + n.id + '">' + esc(n.label || '…') + '</li>'; }).join('') + '</ul></article>'; }).join('') + '</div>';
      }
      var ps = 0; function paintSoon() { clearTimeout(ps); ps = setTimeout(function () { if (!main.contains(document.activeElement) || !document.activeElement.matches('.fw-in')) paint(); }, 200); }
      function focusRow(id) { setTimeout(function () { var r = main.querySelector('.fw-row[data-id="' + id + '"] .fw-in'); if (r) { r.focus(); r.scrollIntoView({ block: 'nearest' }); } }, 20); }

      // ---------------------------------------------------------------- edits
      function addChild(pid, label) { var n = { id: rid(), role: 'item', label: label || '', parent: pid, order: kids(fi, pid).length, provenance: 'user' }; fi.nodes.push(n); collapsed[pid] = false; return n; }
      function addAfter(n) { var sibs = kids(fi, n.parent); sibs.forEach(function (s) { if (s.order > n.order) s.order++; }); var m = { id: rid(), role: 'item', label: '', parent: n.parent, order: n.order + 1, provenance: 'user' }; fi.nodes.push(m); return m; }
      function renumber(pid) { kids(fi, pid).forEach(function (s, i) { s.order = i; }); }
      function move(n, newParent, order) {
        if (n.role === 'root' || newParent === n.id || descendants(fi, n.id).some(function (d) { return d.id === newParent; })) return false;
        var np = node(fi, newParent); if (!np) return false;
        if (n.role === 'section' && np.role !== 'root') return false;
        var old = n.parent; n.parent = newParent;
        kids(fi, newParent).forEach(function (s) { if (s.id !== n.id && s.order >= order) s.order++; }); n.order = order;
        renumber(old); renumber(newParent);
        TK.silently(function () { [n].concat(descendants(fi, n.id)).forEach(function (x) { sync(fi, x); }); });
        return true;
      }
      function del(n) {
        var all = [n].concat(descendants(fi, n.id)), ids = all.map(function (x) { return x.id; });
        fi.nodes = fi.nodes.filter(function (x) { return ids.indexOf(x.id) < 0; });
        TK.silently(function () { all.forEach(function (x) { var src = 'fwi:' + fi.id + ':' + x.id; ks.relations({ source: src }).forEach(function (r) { ks.unrelate(r.id); }); if (x.concept_id) ks.maybeDrop(fi.ko, x.concept_id); }); });
        renumber(n.parent);
      }
      function commit(n, keepFocus) { TK.silently(function () { sync(fi, n); ks.saveFramework(fi); }); paint(); if (keepFocus) focusRow(keepFocus); }

      el.addEventListener('click', function (e) {
        var b = e.target.closest('button, .fw-tn, .fw-chip, .fw-c li, .fw-c h4'); if (!b) return;
        if (b.hasAttribute('data-new')) return chooser(false);
        if (b.hasAttribute('data-close')) { modal.hidden = true; return; }
        if (b.hasAttribute('data-tpl')) return pick(b.getAttribute('data-tpl'), b.closest('.fw-choose'));
        if (b.hasAttribute('data-fi')) { fi = ks.framework(b.getAttribute('data-fi')); return load(); }
        if (b.hasAttribute('data-view')) { fi.view = b.getAttribute('data-view'); save(true); return paint(); }
        if (b.hasAttribute('data-delfw')) { if (confirm('Delete the framework “' + fi.title + '”? Its links are removed; concepts used elsewhere stay.')) { var id = fi.id; fi = null; ks.removeFramework(id); load(); } return; }
        if (b.hasAttribute('data-review')) { var tid = b.getAttribute('data-review'), tt = tpl(tid); TK.silently(function () { ks.setReview('tpl', tid, pend(tt) ? 'reviewed' : 'pending'); }); TK.toast(pend(tt) ? 'Marked as review pending' : 'Marked as reviewed by you'); return paint(); }
        if (b.hasAttribute('data-addnote')) { var box = b.closest('.fw-addnote'), txt = box.querySelector('textarea').value.trim(); if (!txt) return; var kind = box.querySelector('select').value, src = box.querySelector('input').value.trim(); if ((kind === 'quote' || kind === 'evidence') && !src) { TK.toast('Add the source for a quotation or evidence'); return; } TK.silently(function () { var k0 = ks.object(ko.id); ks.addNote(ko.id, txt, { from: 'Framework Card', kind: kind, source: src, about: k0.root_concept ? 'cc:' + k0.root_concept : null }); }); return load(); }
        if (b.hasAttribute('data-notein')) { var nt = (ks.object(ko.id).notes || []).filter(function (x) { return x.id === b.getAttribute('data-notein'); })[0]; var mine = fi.nodes.filter(function (x) { return x.role === 'section' && x.kind === 'text' && /understanding|mine/i.test(x.label + x.key); })[0] || rootOf(fi); var nn = addChild(mine.id, nt.text); nn.from_note = nt.id; return commit(nn); }
        var row = b.closest('[data-id]'); if (!row) return; var n = node(fi, row.getAttribute('data-id')); if (!n) return;
        sel = n.id;
        if (!b.closest('.fw-outline')) { fi.view = 'outline'; save(true); paint(); return focusRow(n.id); }
        if (b.hasAttribute('data-tg')) { collapsed[n.id] = !collapsed[n.id]; return paint(); }
        if (b.hasAttribute('data-add')) { var c = addChild(n.id, ''); save(true); paint(); return focusRow(c.id); }
        if (b.hasAttribute('data-up') || b.hasAttribute('data-down')) { var sibs = kids(fi, n.parent), i = sibs.indexOf(n), j = i + (b.hasAttribute('data-up') ? -1 : 1); if (j < 0 || j >= sibs.length) return; var o = sibs[j].order; sibs[j].order = n.order; n.order = o; save(); return paint(); }
        if (b.hasAttribute('data-in')) { var s2 = kids(fi, n.parent), k = s2.indexOf(n); if (k > 0 && move(n, s2[k - 1].id, kids(fi, s2[k - 1].id).length)) { save(); paint(); } return; }
        if (b.hasAttribute('data-out')) { var p = node(fi, n.parent); if (p && p.parent && move(n, p.parent, p.order + 1)) { save(); paint(); } return; }
        if (b.hasAttribute('data-del')) { if (kids(fi, n.id).length && !confirm('Delete “' + (n.label || 'this node') + '” and everything inside it?')) return; del(n); save(); return paint(); }
        if (b.hasAttribute('data-ref')) return refPicker(n, row);
      });
      main.addEventListener('change', function (e) {
        if (e.target.matches('.fw-title')) { fi.title = e.target.value.trim() || fi.title; save(); return; }
      });
      main.addEventListener('focusout', function (e) { if (e.target.matches('.fw-in')) commitInput(e.target); });
      // save what was typed in a node; called on blur and before Enter / Tab / Backspace change the structure
      function commitInput(t) {
        var row = t.closest('[data-id]'), n = row && node(fi, row.getAttribute('data-id')); if (!n) return;
        var v = t.value.trim(); if (v === n.label) return;
        n.label = v; if (n.provenance === 'library') n.provenance = 'user';
        if (n.role === 'root' && n.concept_id) { renameRoot(n, v); }
        TK.silently(function () { sync(fi, n); descendants(fi, n.id).forEach(function (d) { if (d.role === 'item') sync(fi, d); }); ks.saveFramework(fi); });
        var badgeHost = row.querySelector('.fw-k'); if (!badgeHost && isConceptNode(fi, n)) paintSoon();
      }
      function renameRoot(n, v) {
        var c = ks.findConcept(v);
        if (c && c.id !== n.concept_id) { n.concept_id = c.id; ks.updateObject(ko.id, { root_concept: c.id }); ks.addToObject(ko.id, c.id); }
        else { var cc = ks.getConcept(n.concept_id), lab = cc.labels; if (/[㐀-鿿]/.test(v)) lab.zh = v; else lab.en = v; ks.updateConcept(n.concept_id, { labels: lab }); }
        TK.silently(function () { fi.nodes.forEach(function (x) { if (x.role === 'item') sync(fi, x); }); });
      }
      main.addEventListener('keydown', function (e) {
        if (!e.target.matches('.fw-in')) return; var row = e.target.closest('[data-id]'), n = node(fi, row.getAttribute('data-id'));
        if (e.key === 'Enter' || e.key === 'Tab') commitInput(e.target);
        if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); var m = n.role === 'item' ? addAfter(n) : addChild(n.id, ''); save(true); paint(); focusRow(m.id); }
        else if (e.key === 'Tab' && n.role === 'item') { e.preventDefault(); e.target.blur(); var s = kids(fi, n.parent), k = s.indexOf(n); if (e.shiftKey) { var p = node(fi, n.parent); if (p && p.parent) move(n, p.parent, p.order + 1); } else if (k > 0) move(n, s[k - 1].id, kids(fi, s[k - 1].id).length); save(); paint(); focusRow(n.id); }
        else if (e.key === 'Backspace' && !e.target.value && n.role === 'item' && !kids(fi, n.id).length) { e.preventDefault(); var sibs = kids(fi, n.parent), prev = sibs[sibs.indexOf(n) - 1]; del(n); save(); paint(); focusRow(prev ? prev.id : n.parent); }
      });

      // drag to move: drop on a row's left half → after it (same level); right half → inside it
      var dg = null;
      main.addEventListener('pointerdown', function (e) {
        var h = e.target.closest('[data-drag]'); if (!h) return; var row = h.closest('.fw-row');
        dg = { id: row.getAttribute('data-id'), row: row, ghost: null, target: null, mode: null }; row.classList.add('dragging'); try { h.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault();
      });
      main.addEventListener('pointermove', function (e) {
        if (!dg) return; var over = document.elementFromPoint(e.clientX, e.clientY), row = over && over.closest('.fw-row');
        main.querySelectorAll('.fw-row.drop-in, .fw-row.drop-after').forEach(function (r) { r.classList.remove('drop-in', 'drop-after'); });
        if (!row || row === dg.row) { dg.target = null; return; }
        var b = row.getBoundingClientRect(), inside = e.clientX > b.left + b.width * 0.5;
        dg.target = row.getAttribute('data-id'); dg.mode = inside ? 'in' : 'after'; row.classList.add(inside ? 'drop-in' : 'drop-after');
      });
      function endDrag() {
        if (!dg) return; var d = dg; dg = null; d.row.classList.remove('dragging');
        if (!d.target) return paint();
        var n = node(fi, d.id), t = node(fi, d.target), ok = false;
        if (d.mode === 'in' || t.role === 'root') ok = move(n, t.id, 0); else ok = move(n, t.parent, t.order + 1);
        if (!ok) TK.toast('Can’t move it there'); save(); paint();
      }
      main.addEventListener('pointerup', endDrag); main.addEventListener('pointercancel', endDrag);

      function refPicker(n, row) {
        var cs = ks.conceptsOf(ko.id).filter(function (c) { return c.id !== n.concept_id; });
        var pop = document.createElement('div'); pop.className = 'fw-pop';
        pop.innerHTML = '<label>Link “' + esc(n.label || 'this node') + '” to<select>' + cs.map(function (c) { return '<option value="' + c.id + '">' + esc(ks.label(c)) + '</option>'; }).join('') + '</select></label><div class="row"><button type="button" class="primary" data-ok>Add link</button><button type="button" data-x>Cancel</button></div>' +
          ((n.refs || []).length ? '<p class="dim">Current links: ' + n.refs.map(function (r) { return esc(ks.label(r)) + ' <button type="button" class="small" data-rm="' + r + '">remove</button>'; }).join(' ') + '</p>' : '');
        row.after(pop);
        pop.onclick = function (e) {
          var b = e.target.closest('button'); if (!b) return;
          if (b.hasAttribute('data-ok')) { var v = pop.querySelector('select').value; if (v) { n.refs = (n.refs || []).concat([v]).filter(function (x, i, a) { return a.indexOf(x) === i; }); commit(n); } }
          else if (b.hasAttribute('data-rm')) { n.refs = n.refs.filter(function (x) { return x !== b.getAttribute('data-rm'); }); commit(n); }
          else pop.remove();
        };
      }

      load();
      return { refresh: function () { ko = TK.ko; load(); } };
    }
  });
})();

<script>
/* Card 03 · Thinking Models — method.
   A model (data/models.json, format minest.models/1) is a procedure: principle, what it fits, steps with real inputs
   (text · list · multi · choice · links · matrix · cases), a result assembled from the user's own inputs (plus computed
   parts: feedback loops, mismatched test cases) and rules that comment on the analysis. No AI text is generated.
   A run is saved as mr:<id> on the object and linked to the topic concept ('applies-to', provenance user).
   Several runs on the same object can be compared side by side. */
(function () {
  'use strict';
  var TK = window.MinestToolkit, esc = TK.esc;

  function model(id) { return TK.data.models.filter(function (m) { return m.id === id; })[0]; }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function filled(v) { return Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.keys(v).length > 0 : !!String(v || '').trim(); }
  function cond(c, inp) {
    if (!c) return true;
    if (c.all) return c.all.every(function (x) { return cond(x, inp); });
    if (c.any) return c.any.some(function (x) { return cond(x, inp); });
    if (c.has) return arr(inp[c.has[0]]).indexOf(c.has[1]) >= 0;
    if (c.eq) return Object.keys(c.eq).every(function (k) { return inp[k] === c.eq[k]; });
    if (c.minItems) return Object.keys(c.minItems).every(function (k) { return arr(inp[k]).length >= c.minItems[k]; });
    if (c.empty) return c.empty.every(function (k) { return !filled(inp[k]); });
    if (c.filled) return c.filled.every(function (k) { return filled(inp[k]); });
    if (c.mismatch) return arr(inp[c.mismatch]).some(function (r) { return !!r.a !== !!r.b; });
    return false;
  }
  // feedback loops in a signed directed graph (small graphs: plain DFS over simple cycles)
  function loops(links) {
    var adj = {}, out = [], seen = {};
    links.forEach(function (l) { if (l.from && l.to) (adj[l.from] = adj[l.from] || []).push(l); });
    var nodes = Object.keys(adj).sort();
    nodes.forEach(function (start) {
      (function dfs(at, path, edges) {
        (adj[at] || []).forEach(function (l) {
          if (l.to === start && path.length) { var key = path.slice().sort().join('|'); if (!seen[key]) { seen[key] = 1; var neg = edges.concat([l]).filter(function (x) { return x.sign === '-'; }).length; out.push({ path: path.concat([start]), kind: neg % 2 ? 'balancing' : 'reinforcing' }); } }
          else if (path.indexOf(l.to) < 0 && l.to > start && path.length < 8) dfs(l.to, path.concat([l.to]), edges.concat([l]));
        });
      })(start, [start], []);
    });
    out.forEach(function (o) { o.path = o.path.slice(0, -1).concat([o.path[0]]); });
    return out;
  }
  TK.modelLoops = loops;

  function resultOf(m, inp) {
    var parts = m.result.map(function (r) {
      var v = inp[r.from], step = m.steps.filter(function (s) { return s.id === r.from; })[0] || {}, txt;
      if (r.compute === 'loops') { var L = loops(arr(v)); txt = L.length ? L.map(function (l) { return l.path.join(' → ') + ' (' + l.kind + ')'; }) : ['No closed loop yet']; }
      else if (r.compute === 'mismatch') { var rows = arr(v); txt = rows.map(function (x) { return x.label + ': ' + (!!x.a === !!x.b ? 'consistent' : 'MISMATCH') ; }); }
      else if (step.input === 'multi') txt = arr(v).map(function (id) { var o = (step.options || []).filter(function (x) { return x[0] === id; })[0]; return o ? o[1] : id; });
      else if (step.input === 'choice') { var o = (step.options || []).filter(function (x) { return x[0] === v; })[0]; txt = o ? o[1] : ''; }
      else if (step.input === 'links') txt = arr(v).map(function (l) { return l.from + ' ' + (l.sign === '-' ? '−→' : '+→') + ' ' + l.to; });
      else if (step.input === 'matrix') txt = Object.keys(v || {}).map(function (row) { return row + ': ' + (step.cols || []).map(function (c, i) { return c + ' — ' + ((v[row] || [])[i] || '…'); }).join(' · '); });
      else txt = v;
      return { label: r.label, value: txt };
    });
    var notes = (m.rules || []).filter(function (r) { return cond(r.when, inp); }).map(function (r) { return { say: r.say, tone: r.tone }; });
    var done = m.steps.filter(function (s) { return filled(inp[s.id]); }).length;
    return { parts: parts, notes: notes, steps_done: done, steps_total: m.steps.length };
  }

  TK.register({
    id: 'models', en: 'Thinking Models', zh: '思维模型卡', color: '#1f9d55', line: 'Analyse the question step by step with a method.',
    icon: TK.icon('<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/>'),
    preview: function (ko) {
      var runs = TK.ks.modelRunsOf(ko.id), rec = recommend(ko).slice(0, 3);
      return (runs.length ? '<span class="dim">' + runs.length + ' analysis' + (runs.length > 1 ? 'es' : '') + ' saved</span>' : '') +
        '<span class="pv-list">' + rec.map(function (m) { return '<i>' + esc(m.title) + '</i>'; }).join('') + '</span>';
    },
    mount: function (el, ko, opts) {
      var ks = TK.ks, cur = null, inp = {}, runId = null, compare = [];
      el.innerHTML = '<div class="md-wrap"><aside class="md-side"><h3>Suggested for this question</h3><div class="md-rec"></div><h3>All models</h3><div class="md-all"></div><h3>Saved analyses</h3><div class="md-runs"></div></aside><section class="md-main"></section></div>';
      var main = el.querySelector('.md-main');

      function side() {
        var rec = recommend(ks.object(ko.id)), runs = ks.modelRunsOf(ko.id);
        el.querySelector('.md-rec').innerHTML = rec.slice(0, 3).map(function (m) { return btn(m, true); }).join('') || '<p class="dim">No suggestion — pick any model.</p>';
        el.querySelector('.md-all').innerHTML = TK.data.models.map(function (m) { return btn(m); }).join('');
        el.querySelector('.md-runs').innerHTML = runs.length ? runs.map(function (r) { var m = model(r.model_id); return '<div class="md-run' + (r.id === runId ? ' on' : '') + '"><label><input type="checkbox" data-cmp="' + r.id + '"' + (compare.indexOf(r.id) >= 0 ? ' checked' : '') + '> </label><button type="button" data-run="' + r.id + '"><b>' + esc(m ? m.title : r.model_id) + '</b><small>' + new Date(r.updated_at || r.at).toLocaleString() + '</small></button></div>'; }).join('') +
          '<button type="button" class="small" data-compare' + (compare.length < 2 ? ' disabled' : '') + '>Compare selected (' + compare.length + ')</button>' : '<p class="dim">None yet.</p>';
      }
      function btn(m, rec) { return '<button type="button" class="md-m' + (cur && cur.id === m.id && !runId ? ' on' : '') + '" data-model="' + m.id + '"><b>' + esc(m.title) + '</b>' + (rec ? '<small class="md-pr">' + esc(m.principle) + '</small>' : '') + '</button>'; }

      function open(m, run) {
        cur = m; runId = run ? run.id : null; inp = run ? JSON.parse(JSON.stringify(run.inputs)) : seedInputs(m);
        side(); form();
      }
      function seedInputs(m) {
        var i = {}, t = TK.rootLabel(ks.object(ko.id));
        m.steps.forEach(function (s) { if (s.input === 'text' && (s.id === 'issue' || s.id === 'claim' || s.id === 'goal' || s.id === 'statement')) i[s.id] = ks.object(ko.id).title; });
        if (m.id === 'socratic') i.def = t ? t + ' is ' : '';
        return i;
      }
      function form() {
        var m = cur, t = TK.rootLabel(ks.object(ko.id));
        main.innerHTML = '<header class="md-hd"><h2>' + esc(m.title) + '</h2><p>' + esc(m.principle) + '</p><p class="dim">Fits: ' + esc(fitText(m)) + ' · <b>Limits:</b> ' + esc(m.limits) + '</p></header>' +
          '<ol class="md-steps">' + m.steps.map(function (s, k) { return '<li class="md-step" data-step="' + s.id + '"><h4><span>' + (k + 1) + '</span>' + esc(s.title) + '</h4><p class="dim">' + esc(s.prompt.replace(/\bX\b/g, t || 'X')) + '</p><div class="md-in">' + input(s) + '</div></li>'; }).join('') + '</ol>' +
          '<section class="md-result"></section><div class="row md-save"><button type="button" class="primary" data-save>' + (runId ? 'Save changes' : 'Save analysis') + '</button>' + (runId ? '<button type="button" class="ghost" data-delrun>Delete</button><button type="button" class="ghost" data-again>Start a fresh one</button>' : '') + '<span class="msg"></span></div>';
        result();
      }
      function input(s) {
        var v = inp[s.id];
        if (s.input === 'text') return '<textarea data-k="' + s.id + '" rows="2">' + esc(v || '') + '</textarea>';
        if (s.input === 'multi') return s.options.map(function (o) { return '<label class="kl-chk"><input type="checkbox" data-multi="' + s.id + '" value="' + o[0] + '"' + (arr(v).indexOf(o[0]) >= 0 ? ' checked' : '') + '> ' + esc(o[1]) + '</label>'; }).join('');
        if (s.input === 'choice') return s.options.map(function (o) { return '<label class="kl-chk"><input type="radio" name="c-' + s.id + '" data-choice="' + s.id + '" value="' + o[0] + '"' + (v === o[0] ? ' checked' : '') + '> ' + esc(o[1]) + '</label>'; }).join('');
        if (s.input === 'list') return '<div class="md-list">' + arr(v).map(function (x, i) { return '<span class="tag">' + esc(x) + ' <button type="button" data-rmi="' + s.id + ':' + i + '" aria-label="Remove">×</button></span>'; }).join('') + '</div><div class="row md-add"><input data-addto="' + s.id + '" placeholder="Add and press Enter"><button type="button" data-addbtn="' + s.id + '">Add</button></div>' +
          (s.suggest ? '<div class="md-sug">' + s.suggest.filter(function (x) { return arr(v).indexOf(x) < 0; }).map(function (x) { return '<button type="button" class="chip" data-sug="' + s.id + '">' + esc(x) + '</button>'; }).join('') + '</div>' : '');
        if (s.input === 'links') {
          var parts = arr(inp[s.from]);
          if (parts.length < 2) return '<p class="dim">Add at least two parts in the step above first.</p>';
          var opt = parts.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('');
          return '<div class="md-links">' + arr(v).map(function (l, i) { return '<span class="tag">' + esc(l.from) + ' <b class="' + (l.sign === '-' ? 'neg' : 'pos') + '">' + (l.sign === '-' ? '−' : '+') + '→</b> ' + esc(l.to) + ' <button type="button" data-rml="' + s.id + ':' + i + '">×</button></span>'; }).join('') + '</div>' +
            '<div class="row md-add"><select data-lf>' + opt + '</select><select data-ls><option value="+">+ (same direction)</option><option value="-">− (opposite)</option></select><select data-lt>' + opt + '</select><button type="button" data-addlink="' + s.id + '">Connect</button></div>' + loopSvg(parts, arr(v));
        }
        if (s.input === 'matrix') {
          var rows = arr(inp[s.rows]); if (!rows.length) return '<p class="dim">Add rows in the step above first.</p>';
          return '<div class="md-matrix" style="--n:' + s.cols.length + '"><span></span>' + s.cols.map(function (c) { return '<b>' + esc(c) + '</b>'; }).join('') +
            rows.map(function (r) { return '<b class="md-rh">' + esc(r) + '</b>' + s.cols.map(function (c, i) { return '<textarea rows="2" data-mx="' + s.id + '" data-row="' + esc(r) + '" data-col="' + i + '">' + esc(((v || {})[r] || [])[i] || '') + '</textarea>'; }).join(''); }).join('') + '</div>';
        }
        if (s.input === 'cases') return '<div class="md-cases"><div class="md-ch"><span>Case</span>' + s.cols.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '<span></span></div>' +
          arr(v).map(function (r, i) { return '<div class="md-cr' + (!!r.a !== !!r.b ? ' bad' : '') + '"><span>' + esc(r.label) + '</span><input type="checkbox" data-case="' + s.id + ':' + i + ':a"' + (r.a ? ' checked' : '') + '><input type="checkbox" data-case="' + s.id + ':' + i + ':b"' + (r.b ? ' checked' : '') + '><button type="button" data-rmc="' + s.id + ':' + i + '">×</button></div>'; }).join('') +
          '</div><div class="row md-add"><input data-caseadd="' + s.id + '" placeholder="A case, e.g. a prisoner who likes his cell"><button type="button" data-casebtn="' + s.id + '">Add case</button></div>';
        return '';
      }
      function loopSvg(parts, links) {
        var n = parts.length, R = 90, pos = {}; parts.forEach(function (p, i) { var a = i / n * Math.PI * 2 - Math.PI / 2; pos[p] = [Math.cos(a) * R, Math.sin(a) * R]; });
        var s = links.map(function (l) { var a = pos[l.from], b = pos[l.to]; if (!a || !b) return ''; var mx = (a[0] + b[0]) / 2 * 0.6, my = (a[1] + b[1]) / 2 * 0.6; return '<path class="lp ' + (l.sign === '-' ? 'neg' : 'pos') + '" d="M' + a + ' Q' + mx + ' ' + my + ' ' + b + '" marker-end="url(#lpa)"/><text class="lps" x="' + (mx * 1.05) + '" y="' + (my * 1.05) + '">' + (l.sign === '-' ? '−' : '+') + '</text>'; }).join('');
        s += parts.map(function (p) { var q = pos[p]; return '<g transform="translate(' + q + ')"><rect x="-46" y="-12" width="92" height="24" rx="12" class="lpn"/><text class="lpt" y="4">' + esc(p.length > 13 ? p.slice(0, 12) + '…' : p) + '</text></g>'; }).join('');
        return '<svg class="md-loop" viewBox="-150 -125 300 250"><defs><marker id="lpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>' + s + '</svg>';
      }
      function result() {
        var r = resultOf(cur, inp), box = main.querySelector('.md-result'); if (!box) return;
        box.innerHTML = '<h3>Result <small class="dim">' + r.steps_done + ' of ' + r.steps_total + ' steps · built only from what you entered</small></h3>' +
          r.notes.map(function (n) { return '<p class="md-note ' + (n.tone || 'info') + '">' + esc(n.say) + '</p>'; }).join('') +
          '<dl>' + r.parts.map(function (p) { var v = p.value; return '<dt>' + esc(p.label) + '</dt><dd>' + (Array.isArray(v) ? (v.length ? '<ul>' + v.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<span class="dim">—</span>') : (v ? esc(v) : '<span class="dim">—</span>')) + '</dd>'; }).join('') + '</dl>';
      }
      function changed(repaint) { if (repaint) { var y = window.scrollY; form(); window.scrollTo(0, y); } else result(); }

      el.addEventListener('input', function (e) {
        var t = e.target;
        if (t.matches('[data-k]')) { inp[t.getAttribute('data-k')] = t.value; changed(); }
        else if (t.matches('[data-mx]')) { var k = t.getAttribute('data-mx'), row = t.getAttribute('data-row'), c = +t.getAttribute('data-col'); inp[k] = inp[k] || {}; inp[k][row] = inp[k][row] || []; inp[k][row][c] = t.value; changed(); }
      });
      el.addEventListener('change', function (e) {
        var t = e.target;
        if (t.matches('[data-multi]')) { var k = t.getAttribute('data-multi'); inp[k] = [].slice.call(main.querySelectorAll('[data-multi="' + k + '"]:checked')).map(function (x) { return x.value; }); changed(); }
        else if (t.matches('[data-choice]')) { inp[t.getAttribute('data-choice')] = t.value; changed(); }
        else if (t.matches('[data-case]')) { var p = t.getAttribute('data-case').split(':'); inp[p[0]][+p[1]][p[2]] = t.checked; changed(true); }
        else if (t.matches('[data-cmp]')) { var id = t.getAttribute('data-cmp'); compare = t.checked ? compare.concat([id]) : compare.filter(function (x) { return x !== id; }); side(); }
      });
      el.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var t = e.target;
        if (t.matches('[data-addto]')) { e.preventDefault(); addItem(t.getAttribute('data-addto'), t.value); }
        else if (t.matches('[data-caseadd]')) { e.preventDefault(); addCase(t.getAttribute('data-caseadd'), t.value); }
      });
      function addItem(k, v) { v = String(v || '').trim(); if (!v) return; inp[k] = arr(inp[k]); if (inp[k].indexOf(v) < 0) inp[k].push(v); changed(true); var f = main.querySelector('[data-addto="' + k + '"]'); if (f) f.focus(); }
      function addCase(k, v) { v = String(v || '').trim(); if (!v) return; inp[k] = arr(inp[k]); inp[k].push({ label: v, a: false, b: false }); changed(true); var f = main.querySelector('[data-caseadd="' + k + '"]'); if (f) f.focus(); }
      el.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-model')) return open(model(b.getAttribute('data-model')));
        if (b.hasAttribute('data-run')) { var r = ks.modelRun(b.getAttribute('data-run')); return open(model(r.model_id), r); }
        if (b.hasAttribute('data-compare')) return showCompare();
        if (b.hasAttribute('data-addbtn')) { var k = b.getAttribute('data-addbtn'); return addItem(k, main.querySelector('[data-addto="' + k + '"]').value); }
        if (b.hasAttribute('data-sug')) return addItem(b.getAttribute('data-sug'), b.textContent);
        if (b.hasAttribute('data-rmi')) { var p = b.getAttribute('data-rmi').split(':'); inp[p[0]].splice(+p[1], 1); return changed(true); }
        if (b.hasAttribute('data-addlink')) { var k2 = b.getAttribute('data-addlink'), row = b.parentNode, l = { from: row.querySelector('[data-lf]').value, sign: row.querySelector('[data-ls]').value, to: row.querySelector('[data-lt]').value }; if (l.from === l.to) return TK.toast('Pick two different parts'); inp[k2] = arr(inp[k2]).filter(function (x) { return !(x.from === l.from && x.to === l.to); }).concat([l]); return changed(true); }
        if (b.hasAttribute('data-rml')) { var q = b.getAttribute('data-rml').split(':'); inp[q[0]].splice(+q[1], 1); return changed(true); }
        if (b.hasAttribute('data-casebtn')) { var k3 = b.getAttribute('data-casebtn'); return addCase(k3, main.querySelector('[data-caseadd="' + k3 + '"]').value); }
        if (b.hasAttribute('data-rmc')) { var c = b.getAttribute('data-rmc').split(':'); inp[c[0]].splice(+c[1], 1); return changed(true); }
        if (b.hasAttribute('data-save')) return saveRun();
        if (b.hasAttribute('data-delrun')) { if (confirm('Delete this analysis?')) { TK.silently(function () { ks.removeModelRun(runId); }); compare = compare.filter(function (x) { return x !== runId; }); open(cur); } return; }
        if (b.hasAttribute('data-again')) return open(cur);
        if (b.hasAttribute('data-back')) return form();
      });
      function saveRun() {
        var res = resultOf(cur, inp), k = ks.object(ko.id), rec;
        TK.silently(function () {
          rec = ks.saveModelRun({ id: runId, ko: ko.id, model_id: cur.id, title: cur.title, inputs: JSON.parse(JSON.stringify(inp)), result: res, at: runId ? (ks.modelRun(runId) || {}).at : null });
          if (k.root_concept) ks.relate('mr:' + rec.id, 'cc:' + k.root_concept, 'applies-to', { ko: ko.id, provenance: 'user', source_ref: 'mr:' + rec.id, note: cur.title + ' applied to this topic' });
        });
        runId = rec.id; side(); form(); main.querySelector('.md-save .msg').textContent = 'Saved — it now appears in the Graph.';
      }
      function showCompare() {
        var runs = compare.map(function (id) { return ks.modelRun(id); }).filter(Boolean);
        main.innerHTML = '<header class="md-hd"><h2>Compare analyses</h2><p class="dim">The same question through different models. What does each one make you notice?</p><button type="button" data-back' + (cur ? '' : ' hidden') + '>← Back</button></header><div class="md-cmp" style="--n:' + runs.length + '">' +
          runs.map(function (r) { var m = model(r.model_id), res = resultOf(m, r.inputs); return '<article><h3>' + esc(m.title) + '</h3>' + res.notes.map(function (n) { return '<p class="md-note ' + n.tone + '">' + esc(n.say) + '</p>'; }).join('') + '<dl>' + res.parts.map(function (p) { var v = p.value; return '<dt>' + esc(p.label) + '</dt><dd>' + (Array.isArray(v) ? v.map(esc).join('<br>') || '—' : esc(v || '—')) + '</dd>'; }).join('') + '</dl><p class="dim">Limits: ' + esc(m.limits) + '</p></article>'; }).join('') + '</div>';
      }

      side();
      var first = (opts && opts.model && model(opts.model)) || recommend(ks.object(ko.id))[0] || TK.data.models[0];
      open(first);
      return { refresh: function () { side(); } };
    }
  });

  function fitText(m) { return (m.fits.places || []).filter(function (p) { return p !== '*'; }).map(function (p) { return TK.C.node(p) ? TK.C.node(p).en : p; }).join(', ') || 'most questions'; }
  function recommend(ko) {
    var pl = TK.placement(ko), places = [pl.primary].concat(pl.related || []).filter(Boolean), text = TK.ks.norm(ko.original_input);
    return TK.data.models.map(function (m) {
      var s = 0;
      (m.fits.places || []).forEach(function (p) { if (p === '*') s += 0.2; places.forEach(function (q, i) { var path = TK.C.path(q); if (path.indexOf(p) >= 0) s += (i === 0 ? 2 : 1) * (p.split('.').length); }); });
      (m.fits.words || []).forEach(function (w) { if (text.indexOf(TK.ks.norm(w)) >= 0) s += 1.5; });
      if (ko.content_type === 'concept' && m.angle === 'define') s += 1.5;
      return { m: m, s: s };
    }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; }).map(function (x) { return x.m; });
  }
  TK.recommendModels = recommend;
})();

</script>
<script>
/* Card 04 · Thinking Lab — experience.
   Runs micro-interactions (minest.micro/1, tools/compass/micro.js) for the current object. Each finished run is linked
   to the object (lab_run_ids), its understanding / question become the object's notes (visible in the Framework Card),
   and it appears in the Graph as an experiment that illustrates the topic. The user's own case from the "apply" step
   becomes a 'case' concept with the relation the user chose — never a cause Minest decided. */
(function () {
  'use strict';
  var TK = window.MinestToolkit, esc = TK.esc;

  function recommend(ko) {
    var pl = TK.placement(ko), places = [pl.primary].concat(pl.related || []).filter(Boolean);
    var sugg = (ko.suggested_labs || []).concat(ko.seed ? (TK.data.seeds.filter(function (s) { return s.id === ko.seed; })[0] || {}).labs || [] : []);
    return TK.data.labs.map(function (d) {
      var s = sugg.indexOf(d.interaction_id) >= 0 ? 3 : 0;
      (d.fits || []).forEach(function (p) { places.forEach(function (q, i) { if (TK.C.path(q).indexOf(p) >= 0 || TK.C.path(p).indexOf(q) >= 0) s += i === 0 ? 2 : 1; }); });
      if (d.interaction_id === 'kant-causality') places.forEach(function (q) { if (/causation|causal-inference/.test(q)) s += 2; });
      return { d: d, s: s };
    }).sort(function (a, b) { return b.s - a.s; });
  }
  TK.recommendLabs = recommend;
  function rvw(d) { return TK.ks.reviewStatus('lab', d.interaction_id, d.content_review_status || 'pending'); }

  function summary(rec) {
    var L = { yes: 'yes', no: 'no', unsure: 'not sure' };
    return (rec.judge1 ? 'Answer: ' + (L[rec.judge1] || rec.judge1) + ' → ' + (L[rec.judge2] || '—') + (rec.changedMind ? ' (changed)' : '') : '') +
      (rec.apply ? '<br>Case: ' + esc(rec.apply.case || rec.apply.situation || (rec.apply.a + ' → ' + rec.apply.b)) : '');
  }

  TK.register({
    id: 'lab', en: 'Thinking Lab', zh: '思维实验室', color: '#f08c3a', line: 'Make an idea visible and try it with your own hands.',
    icon: TK.icon('<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/>'),
    preview: function (ko) {
      var top = recommend(ko)[0], runs = TK.ks.labRunsOf(ko.id);
      return (top && top.s > 0 ? '<span class="pv-lab"><b>' + esc(top.d.title) + '</b> ' + esc(top.d.subtitle || '') + '</span>' : '<span class="dim">' + TK.data.labs.length + ' experiments ready</span>') +
        (runs.length ? '<span class="dim">' + runs.length + ' done for this object</span>' : '');
    },
    mount: function (el, ko, opts) {
      var ks = TK.ks;
      function paint() {
        var k = ks.object(ko.id), recs = recommend(k), runs = ks.labRunsOf(ko.id);
        el.innerHTML = '<div class="lb-wrap"><h2>Experiments</h2><p class="dim">Each experiment is a model that helps you understand — none of them proves a philosophical theory.</p><div class="lb-grid">' +
          recs.map(function (x, i) { var d = x.d; return '<article class="lb-tile' + (i === 0 && x.s > 0 ? ' rec' : '') + '"><h3>' + esc(d.title) + (i === 0 && x.s > 0 ? ' <span class="pill ok">fits this question</span>' : '') + (rvw(d) === 'pending' ? ' <span class="pill sug">review pending</span>' : ' <span class="pill ok">reviewed</span>') + '</h3><p class="lb-sub">' + esc(d.subtitle || '') + '</p><p>' + esc(d.learning_objective) + '</p><p class="dim">' + esc(d.disclaimer || '') + '</p><p class="dim">' + d.steps.length + ' steps: ' + esc(d.steps.map(function (s) { return s.title; }).join(' · ')) + '</p><div class="row"><button type="button" class="primary" data-run="' + d.interaction_id + '">▶ Start</button><button type="button" class="small ghost" data-review="' + d.interaction_id + '">' + (rvw(d) === 'pending' ? 'Mark reviewed' : 'Mark pending') + '</button></div></article>'; }).join('') +
          '</div><h2>Done for this object</h2>' + (runs.length ? '<div class="lb-runs">' + runs.slice().reverse().map(function (r) { var d = TK.M.get(r.interaction_id); return '<div class="lb-run"><b>' + esc(d ? d.title : r.interaction_id) + '</b> <span class="pill ' + (r.completed ? 'ok' : '') + '">' + (r.completed ? 'completed' : 'partial') + '</span><p>' + summary(r) + '</p>' + (r.note ? '<p>“' + esc(r.note) + '”</p>' : '') + '<small class="dim">' + new Date(r.finishedAt).toLocaleString() + '</small></div>'; }).join('') + '</div>' : '<p class="dim">Nothing yet.</p>') + '</div>';
      }
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-run]'); if (b) return run(b.getAttribute('data-run'));
        var r = e.target.closest('[data-review]'); if (r) { var d = TK.M.get(r.getAttribute('data-review')); TK.silently(function () { ks.setReview('lab', d.interaction_id, rvw(d) === 'pending' ? 'reviewed' : 'pending'); }); TK.toast(rvw(d) === 'pending' ? 'Marked as review pending' : 'Marked as reviewed by you'); paint(); }
      });
      function run(id) {
        var k = ks.object(ko.id);
        TK.M.play(id, { store: ks.backend, context: { query_id: k.query_id || null, text: k.original_input, framework_id: (TK.M.get(id) || {}).framework_id, object_id: k.id },
          onSaved: function (rec) { TK.silently(function () { link(rec); }); paint(); }, onClose: function () { paint(); } });
      }
      function link(rec) {
        var k = ks.object(ko.id), root = k.root_concept, about = root ? 'cc:' + root : null, def = TK.M.get(rec.interaction_id);
        ks.linkLabRun(k.id, rec);
