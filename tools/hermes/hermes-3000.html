  /** pose the virtual lid at θ (0 = shut over the base, 180 = flat in the top half) */
  function poseLid(d, th){
    const panel=d.querySelector('.panel');
    panel.style.transform=`rotateX(${-(180-th)}deg)`;
    // the face turned away from the light darkens as it swings
    const s=Math.abs(Math.cos(th*Math.PI/180));
    d.querySelectorAll('.shade').forEach(x=>x.style.opacity=(0.5*(1-s)).toFixed(3));
    // the top half: an empty desk while the lid is down, the machine as the lid rises past upright
    d.querySelector('.backdrop').style.opacity=Math.max(0,Math.min(1,(150-th)/70)).toFixed(3);
    setAngle(th);
  }
  function tween(from, to, ms, ease, onStep, done){
    const t0=performance.now();
    const step=(now)=>{
      const k=Math.min(1,(now-t0)/ms), e=ease(k);
      onStep(from+(to-from)*e, k);
      if(k<1) requestAnimationFrame(step); else done&&done();
    };
    requestAnimationFrame(step);
  }
  const easeOpen=k=>{ // lift, swing, and settle back a touch past the stop
    if(k<0.82){ const x=k/0.82; return 1.035*(x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2); }
    const x=(k-0.82)/0.18; return 1.035-0.035*(1-Math.pow(1-x,3));
  };
  const easeShut=k=>k*k*k*(1.2-0.2*k); // gravity: slow, then faster and faster

  function closeCase(stay){
    if(busy||!lid) return; busy=true; initAudio(); slip();
    const real=hingeDeg();
    const finish=()=>{
      thump(); hap('heavy'); if(navigator.vibrate) navigator.vibrate(18);
      setTimeout(()=>{ latchSnap(); hap('rigid'); }, 200);
      setTimeout(()=>{
        lid.classList.remove('slam','up','thud','lift','opening'); lid.classList.add('case-anim');
        const d=$$('h3-lid3d'); if(d) d.style.display='none';
        busy=false;
        if(embedded && !stay){ try{ parent.postMessage({type:'hermes:closed'},'*'); }catch(e){} }
        else lidDismissed=false;
      }, 380);
    };
    if(real!==null && stay){ setAngle(0); finish(); return; }   // the Duo itself is the lid: it just closed
    const d=lid3d();
    creak(.55);
    tween(180, 0, 620, easeShut, th=>poseLid(d, th), finish);
  }
  let focusEl=null;
  function openCase(){
    if(!lid) return; busy=true; initAudio(); slip();
    const real=hingeDeg();
    const app=$$('app'); if(app) app.style.pointerEvents='none';
    const anims=[];
    const An=(el,kf,opt)=>{ if(!el) return; try{ const a=el.animate(kf,opt); anims.push(a); return a; }catch(e){} };
    const at=(ms,fn)=>setTimeout(fn,ms);
    // 01 锁扣：左、右先后弹开
    const latches=lid.querySelectorAll('.lid-latch');
    const pop=[{transform:'none'},{transform:'translateY(-8px) rotateX(60deg) scale(1.06)',offset:.55},{transform:'translateY(-5px) rotateX(72deg)'}];
    at(40, ()=>{ latches[0]&&An(latches[0],pop,{duration:170,easing:'cubic-bezier(.2,1.5,.4,1)',fill:'forwards'}); ping(3200,0,1); hap('rigid'); });
    at(170,()=>{ latches[1]&&An(latches[1],pop,{duration:170,easing:'cubic-bezier(.2,1.5,.4,1)',fill:'forwards'}); ping(2800,0,1); hap('rigid'); });
    let ready=1500;
    if(real!==null){
      // the Duo is the lid: the screens are already open as far as the hand opened them — light follows the angle
      at(300,()=>{ lid.classList.remove('case-anim','lift','up'); setAngle(hingeDeg() ?? 180); });
      ready=700;
    }else{
      // 02 箱盖：先抬起一点（锁扣松开），再绕后方铰链平稳翻起，越过直立后落到 180° 轻轻回弹
      at(300,()=>{
        const d=lid3d(); poseLid(d, 0);
        lid.classList.remove('case-anim','lift','up');
        creak(.9);
        tween(0, 180, 1150, easeOpen, th=>poseLid(d, Math.min(186, th)), ()=>{ poseLid(d,180); d.style.display='none'; });
        // 03 镜头：从俯视推近、倾到打字视角
        An(app,[
          {transform:'perspective(1400px) translateY(-2%) rotateX(11deg) scale(.92)',filter:'brightness(.85)'},
          {transform:'perspective(1400px) translateY(0) rotateX(0deg) scale(1)',filter:'brightness(1)'}
        ],{duration:1200,easing:'cubic-bezier(.33,0,.2,1)',fill:'both'});
      });
    }
    // 04 机械就绪：纸架锁释放、微振，滚筒与色带进入焦点
    at(ready,()=>{
      ping(1900,0,.8); try{ (window.__click2||(()=>{}))(1.0); sfx('ratchet',.35); }catch(e){}
      hap('medium');
      An($$('carriage'),[{translate:'0 0'},{translate:'-3px 0'},{translate:'2px 1px'},{translate:'-1px 0'},{translate:'0 0'}],{duration:280,easing:'ease-out'});
      const glow=[{filter:'brightness(1)'},{filter:'brightness(1.3) drop-shadow(0 0 6px rgba(255,255,255,.5))',offset:.35},{filter:'brightness(1)'}];
      An($$('platen'),glow,{duration:520,easing:'ease-out'});
      An(document.querySelector('.hinge-ribbon'),glow,{duration:520,delay:90,easing:'ease-out'});
    });
    // 05 进入打字
    at(ready+500,()=>{ if(app) app.style.pointerEvents=''; busy=false; lidDismissed=true; applyMode(); });
    at(ready+900,()=>{ anims.forEach(a=>{ try{a.cancel();}catch(e){} }); fit(); });
  }
  // the real hinge moving: the light follows it every step
  addEventListener('minest:hinge',()=>{ const a=hingeDeg(); if(a!==null) setAngle(a); });
  setAngle(hingeDeg() ?? 180);
  // 单独打开时：轻触机盖（盖着的状态）也走开箱动画
  if(lid){
    lid.addEventListener('click',e=>{
      if(lid.classList.contains('case-anim') && !busy){ e.stopImmediatePropagation(); openCase(); }
    }, true);
  }
  const btn=document.querySelector('.top-chrome .chrome-spool:first-of-type');
  if(btn){
    btn.title='关箱';
    btn.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); btn.classList.add('press'); });
    const up=()=>{ if(!btn.classList.contains('press')) return; btn.classList.remove('press'); closeCase(); };
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointerleave',()=>btn.classList.remove('press'));
  }

  /* 按高度排键盘：键宽按屏幕宽度放大（--k），放不下时先把键帽压扁一些（--kh，最低 0.7 倍）、行距收紧，
     还放不下才缩小键宽；整台机器在屏幕内完整显示 */
  let fitting=false;
  function fit(){
    if(fitting) return; fitting=true;
    const deck=$$('deck'), mh=$$('machine-half');
    if(!deck||!mh){ fitting=false; return; }
    deck.style.removeProperty('--k'); deck.style.removeProperty('--kh');
    requestAnimationFrame(()=>{
      const kr=[...deck.querySelectorAll('.krow')].filter(r=>getComputedStyle(r).display!=='none'), lastRow=kr[kr.length-1];
      const over=()=>lastRow ? lastRow.getBoundingClientRect().bottom-(deck.getBoundingClientRect().bottom-6) : 0;
      if(over()>0){
        const k=deck.querySelector('.key[data-ch]').getBoundingClientRect().width;
        let kh=k;
        for(let i=0;i<8 && over()>0 && kh>k*0.7;i++){
          kh=Math.max(k*0.7, kh-Math.max(1,over()/kr.length));
          deck.style.setProperty('--kh', kh+'px');
        }
        let kk=k;
        for(let i=0;i<8 && over()>0 && kk>26;i++){
          kk=Math.max(26, kk-Math.max(1,over()/(kr.length*0.9)));
          deck.style.setProperty('--k', kk+'px'); deck.style.setProperty('--kh', (kk*0.7)+'px');
        }
      }
      fitting=false;
      if(typeof calibrateTypebars==='function') setTimeout(calibrateTypebars,30);
    });
  }
  addEventListener('resize',()=>setTimeout(fit,120));
  addEventListener('minest:hinge',()=>setTimeout(fit,160));
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(fit,700));
  else setTimeout(fit,700);

  /* Minest 发来的消息：开箱 / 铰链状态 */
  addEventListener('message',e=>{
    const d=e.data||{};
    if(d.type==='hermes:open'){ wasFolded=folded(); if(!wasFolded) openCase(); }
    if(d.type==='hermes:hinge'){ window.__minestHinge=d.hinge; dispatchEvent(new CustomEvent('minest:hinge',{detail:d.hinge})); }
  });
  /* 翻开 Duo → 开箱；合上 Duo → 关箱（铰链 closed / partial / open；没有铰链时按屏幕尺寸判断外屏） */
  function folded(){
    const h=window.__minestHinge;
    if(h && h.status && h.status!=='unknown') return h.status==='closed';
    try{ return detectMode()==='closed'; }catch(e){ return false; }
  }
  let wasFolded=folded();
  function onFold(){
    const f=folded(); if(f===wasFolded) return; wasFolded=f;
    const shut=lid && lid.classList.contains('case-anim');
    if(f && !shut){ busy=false; closeCase(true); }
    else if(!f && shut){ if(busy){ setTimeout(onFoldOpen,950); } else openCase(); }
  }
  function onFoldOpen(){ if(!folded() && lid.classList.contains('case-anim') && !busy) openCase(); }
  addEventListener('minest:hinge',()=>setTimeout(onFold,60));
  addEventListener('resize',()=>setTimeout(onFold,140));
  window.hermesCase={open:openCase, close:closeCase, fit:fit, folded:folded};
})();
</script>

<script id="enh-keys2-script">
(function(){
  const $$=id=>document.getElementById(id);
  function move(){
    const kr0=$$('kr0'), kr5=$$('kr5'); if(!kr0||!kr5||kr5.querySelector('.h3-fgrp')) return !!(kr5&&kr5.querySelector('.h3-fgrp'));
    const keys=[...kr0.querySelectorAll('.fkey')]; if(keys.length<6) return false;
    const sp=kr5.querySelector('.k-space'); if(!sp) return false;
    const L=document.createElement('div'); L.className='h3-fgrp l';
    const R=document.createElement('div'); R.className='h3-fgrp r';
    keys.slice(0,3).forEach(k=>L.appendChild(k)); keys.slice(3).forEach(k=>R.appendChild(k));
    kr5.insertBefore(L, sp); sp.after(R);
    return true;
  }
  let tries=0;
  (function wait(){ if(move()){ if(window.hermesCase&&hermesCase.fit) setTimeout(hermesCase.fit,30); return; } if(++tries<40) setTimeout(wait,100); })();
})();
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 正宗机械打字机音效 + 每个键 / 按钮的触感反馈
     声音按真机的发声过程分层合成（不用电子正弦“哔”声）：
       按下键帽：塑料键帽 + 键杆的短促“嗒”
       字锤落纸（84ms）：钢字模撞上橡胶滚筒的尖脆“咔”（瞬态）+ 机身木腔的“嗒”+ 滚筒闷响 + 一点点金属余振
       擒纵放行（+46ms）：字车走一格的细小“嘀”
       空格：段落杆的闷“咚”+ 擒纵
       换档：整个字篮抬起的沉重“哐”
       回车：棘轮一串加速的“咔咔咔”+ 滑轨摩擦 + 撞到左端的“砰”
       边距铃：真黄铜铃（非整数倍泛音，长余音）
     全部经过一个小房间混响 + 压缩，听感像桌面上的实物。
     触感：Minest iOS 里用原生 Taptic（父页面的 MinestNative.haptic），网页里用 navigator.vibrate。
     ══════════════════════════════════════════════════════════ -->
<script id="enh-sound-script">
(function(){
  /* ── 触感 ── */
  function native(){ try{ return window.MinestNative || (window.parent!==window && window.parent.MinestNative) || null; }catch(e){ return null; } }
  let lastHap=0;
  function hap(style, ms){
    const now=performance.now(); if(now-lastHap<28) return; lastHap=now;
    const n=native();
    if(n && n.haptic){ try{ n.haptic(style); return; }catch(e){} }
    if(navigator.vibrate) navigator.vibrate(ms||8);
  }
  window.__hermesHaptic=hap;
  const SEL=[
    ['.key.k-space','medium',12],
    ['.key, .fkey','light',8],
    ['#ret-lever, .ret-lever','heavy',16],
    ['.ink-switch, .touch-lever, .rsel','rigid',10],
    ['#carriage .platen .knob, .knob','soft',8],
    ['.top-chrome .chrome-spool, .hermes-lid, #bell, .bell','medium',12],
    ['button, [role=button]','light',8],
  ];
  document.addEventListener('pointerdown',e=>{
    const t=e.target; if(!t || !t.closest) return;
    for(const [q,style,ms] of SEL){ if(t.closest(q)){ hap(style,ms); if(t.closest('.key, .fkey')) { initAudio(); sfx('key'); } return; } }
  },true);
  addEventListener('keydown',e=>{ if(e.repeat || e.metaKey || e.ctrlKey) return; initAudio(); hap(e.key===' '?'medium':e.key==='Enter'?'heavy':'light'); sfx('key'); },true);

  /* ── 声音 ── */
  const MULT={1:.6,2:1,3:1.4};
  const _old=sfx;
  const rnd=a=>1+(Math.random()-.5)*a;
  let M=null;
  function roomIR(ctx){
    const len=Math.floor(ctx.sampleRate*.16), b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++){ const k=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-k,4)*(i<ctx.sampleRate*.004?0.2:0.55); } }
    return b;
  }
  function bus(ctx){
    if(M && M.ctx===ctx) return M.in;
    const inp=ctx.createGain(), comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=8; comp.ratio.value=4; comp.attack.value=.001; comp.release.value=.09;
    const conv=ctx.createConvolver(); conv.buffer=roomIR(ctx);
    const wet=ctx.createGain(); wet.gain.value=.18;
    const tone=ctx.createBiquadFilter(); tone.type='highshelf'; tone.frequency.value=6000; tone.gain.value=-3;
    inp.connect(comp); inp.connect(conv); conv.connect(wet); wet.connect(comp); comp.connect(tone); tone.connect(ctx.destination);
    M={ctx,in:inp}; return inp;
  }
  function burst(ctx,o,t,dur,decay,type,f,q,g){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf(ctx,dur,decay);
    const fl=ctx.createBiquadFilter(); fl.type=type; fl.frequency.value=f; if(q) fl.Q.value=q;
    const gg=ctx.createGain(); gg.gain.setValueAtTime(g,t); gg.gain.exponentialRampToValueAtTime(.0004,t+dur);
    s.connect(fl); fl.connect(gg); gg.connect(o); s.start(t); s.stop(t+dur+.02);
  }
  function tone(ctx,o,t,f0,f1,g,d,type){
    const os=ctx.createOscillator(); os.type=type||'sine'; os.frequency.setValueAtTime(f0,t);
    if(f1!==f0) os.frequency.exponentialRampToValueAtTime(f1,t+d);
    const gg=ctx.createGain(); gg.gain.setValueAtTime(g,t); gg.gain.exponentialRampToValueAtTime(.0004,t+d);
    os.connect(gg); gg.connect(o); os.start(t); os.stop(t+d+.02);
  }
  /** 钢字模撞滚筒 */
  function impact(ctx,o,t,g){
    const p=rnd(.08);
    burst(ctx,o,t,.005,.25,'highpass',3200,0,1.0*g);                 // 尖脆瞬态
    burst(ctx,o,t,.03,.18,'bandpass',2300*p,1.4,.75*g);               // “咔”的主体（键杆 + 字模）
    burst(ctx,o,t+.001,.05,.22,'bandpass',950*p,1.1,.45*g);           // 机身木腔共鸣
    tone(ctx,o,t,230*p,120,.42*g,.05);                                 // 橡胶滚筒的闷响
    burst(ctx,o,t,.045,.3,'lowpass',650,0,.32*g);
    tone(ctx,o,t+.002,3180*p,3180*p,.035*g,.06);                       // 一丝金属余振
    tone(ctx,o,t+.002,4730*p,4730*p,.02*g,.045);
  }
  /** 擒纵：字车走一格 */
  function escapement(ctx,o,t,g){
    burst(ctx,o,t,.01,.3,'bandpass',5200*rnd(.1),4,.28*g);
    tone(ctx,o,t,6100*rnd(.06),6100,.016*g,.02);
    burst(ctx,o,t+.004,.02,.4,'lowpass',420,0,.1*g);
  }
  sfx=function(kind,vol){
    const ctx=S.audio; if(!ctx) return;
    let v=(vol===undefined?1:vol);
    if(kind==='strike'||kind==='space') v*=MULT[S.touch||2];
    const o=ctx.createGain(); o.gain.value=v; o.connect(bus(ctx));
    const t=ctx.currentTime+.002;
    switch(kind){
      case 'key':     // 按下键帽：塑料 + 键杆的短“嗒”
        burst(ctx,o,t,.014,.25,'bandpass',1400*rnd(.15),1.3,.2);
        tone(ctx,o,t,420*rnd(.1),260,.07,.02);
        return;
      case 'strike':
        impact(ctx,o,t,1);
        escapement(ctx,o,t+.046,1);
        return;
      case 'space':   // 段落杆：闷“咚”+ 擒纵
        tone(ctx,o,t,170*rnd(.06),95,.42,.07);
        burst(ctx,o,t,.06,.25,'lowpass',900,0,.32);
        burst(ctx,o,t,.012,.3,'bandpass',1800,1.2,.14);
        escapement(ctx,o,t+.014,.9);
        return;
      case 'shift':   // 整个字篮抬起 / 落下：沉重的“哐”
        tone(ctx,o,t,125,70,.5,.1);
        burst(ctx,o,t,.08,.22,'lowpass',780,0,.38);
        burst(ctx,o,t+.004,.012,.3,'bandpass',2600,2,.16);
        return;
      case 'back':    // 退格：字车反向走一格
        burst(ctx,o,t,.02,.3,'bandpass',1900,2,.28);
        tone(ctx,o,t,300,180,.14,.03);
        escapement(ctx,o,t+.02,.8);
        return;
      case 'lf':
      case 'ratchet': // 滚筒棘轮：一齿
        burst(ctx,o,t,.009,.3,'bandpass',3400*rnd(.12),4,.26);
        tone(ctx,o,t,520,320,.05,.015);
        if(kind==='ratchet') hap('selection',4);
        return;
      case 'return': {// 回车：棘轮一串加速 + 滑轨摩擦 + 撞到左端
        const n=13; let tt=t;
        for(let i=0;i<n;i++){ burst(ctx,o,tt,.008,.3,'bandpass',3800*rnd(.1),3,.2*(1-i/n*.4)); tt+=.034*(1-i/n*.55); }
        burst(ctx,o,t+.02,.3,.6,'bandpass',900,.7,.12);
        const end=t+.33;
        tone(ctx,o,end,150,62,.62,.09);
        burst(ctx,o,end,.07,.22,'lowpass',1300,0,.48);
        burst(ctx,o,end,.006,.3,'highpass',2800,0,.35);
        tone(ctx,o,end+.002,2650,2650,.03,.12);
        return;
      }
      case 'bell': {  // 黄铜铃：非整数倍泛音，长余音
        const f=2050*rnd(.02);
        burst(ctx,o,t,.004,.3,'highpass',4500,0,.35);
        [[1,.26,1.8],[2.32,.12,1.1],[4.25,.07,.6],[6.63,.035,.35],[1.006,.08,1.6]].forEach(([r,g,d])=>tone(ctx,o,t,f*r,f*r,g,d));
        return;
      }
      default:
        try{ o.disconnect(); }catch(e){}
        return _old(kind,vol);
    }
  };
})();
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 打字机箱（参考 Royal Quiet De Luxe 的箱子）
     Duo 的上下屏就是箱子的上下两半：上屏 = 箱盖内侧（织物内衬、镀铬包边、绑带），纸从滚筒处立在内衬前；
     下屏 = 箱底（打字机坐在里面，前沿是箱边和镀铬锁扣）；颜色沿用 Hermes 的鼠尾草绿。
     内衬明暗与箱盖投在机器上的影子跟着开合角度走（--lid-dark / --lid-shade，由真实铰链或虚拟箱盖设置）。
     ══════════════════════════════════════════════════════════ -->
<style id="enh-royal">
#app{--lid-dark:0;--lid-shade:0;--lid-sheen:1}
#carriage-half{background:#a9bbb3 !important}
.royal-lining{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% 30%,rgba(255,255,255,.16),transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(-45deg,rgba(20,40,32,.05) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#bccbc4 0%,#aebfb8 55%,#9db0a7 100%);
}
.royal-rim{
  position:absolute;inset:0;pointer-events:none;border-radius:26px 26px 0 0;
  border:9px solid transparent;border-bottom:0;
  background:linear-gradient(180deg,#f4f7f8,#aeb8bd 40%,#e3e8ea 60%,#7d878c) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.royal-rim-shadow{position:absolute;inset:9px 9px 0 9px;pointer-events:none;border-radius:18px 18px 0 0;
  box-shadow:inset 0 10px 18px rgba(30,50,42,.32),inset 8px 0 14px rgba(30,50,42,.18),inset -8px 0 14px rgba(30,50,42,.18)}
.royal-strap{
  position:absolute;left:33%;width:34%;top:13%;height:24%;pointer-events:none;
  border:10px solid #2c3a34;border-top:0;border-radius:0 0 3px 3px;
  box-shadow:0 2px 3px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.08);
}
.royal-strap::before,.royal-strap::after{content:"";position:absolute;top:-4px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f4f7f8,#8e999e 60%,#4b555a)}
.royal-strap::before{left:-10px}.royal-strap::after{right:-10px}
/* the angle: dim when nearly shut, a soft sheen sliding down the lining as it opens */
.royal-light{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,calc(.12 * var(--lid-sheen))) 0%,transparent 35%),
    linear-gradient(180deg,rgba(10,22,17,var(--lid-dark)),rgba(10,22,17,calc(var(--lid-dark) * .7)));
  transition:background .12s linear}
.royal-lid-layer{position:absolute;inset:0;z-index:0;pointer-events:none}
/* the base: the lid's shadow over the machine (deepest with the lid upright), the tweed rim and the latch */
.royal-hinge-shadow{position:absolute;left:0;right:0;top:0;height:70px;z-index:65;pointer-events:none;
  background:linear-gradient(180deg,rgba(12,26,20,var(--lid-shade)),transparent)}
.royal-tray{position:absolute;left:0;right:0;bottom:0;height:14px;z-index:66;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(20,40,32,.12) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#93a79e,#6f8379);
  border-top:3px solid #cfd6d9;box-shadow:0 -2px 4px rgba(0,0,0,.25)}
/* the case clasp in the middle of the top rim (it closes the case): a chrome plate, a hinged lever with a lip,
   two screws and a keyhole; pressed, the lever lifts */
.top-chrome .chrome-spool:first-of-type{
  position:absolute !important;left:50% !important;top:50% !important;transform:translate(-50%,-50%);
  width:76px;height:26px;padding:0 !important;margin:0 !important;border-radius:6px !important;display:block !important;
  background:linear-gradient(180deg,#fbfdfd 0%,#c8d1d5 38%,#eef2f3 52%,#8d989d 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25),0 0 0 1px rgba(60,70,75,.45);
}
.top-chrome .chrome-spool:first-of-type > *{display:none !important}
.top-chrome .chrome-spool:first-of-type::before{ /* the lever */
  content:"";position:absolute;left:14px;right:14px;top:4px;height:15px;border-radius:4px 4px 7px 7px;
  background:linear-gradient(180deg,#ffffff,#d5dcdf 45%,#a3aeb3 75%,#6c777c);
  box-shadow:0 2px 2px rgba(0,0,0,.35),inset 0 1px 0 #fff,inset 0 -2px 2px rgba(0,0,0,.18),0 0 0 .8px rgba(60,70,75,.5);
  transform-origin:50% 0;transition:transform .14s cubic-bezier(.3,1.6,.5,1);
}
.top-chrome .chrome-spool:first-of-type::after{ /* screws and keyhole */
  content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:
    radial-gradient(circle at 7px 50%,#5d686d 0 1.3px,#e6ebed 1.4px 3px,transparent 3.2px),
    radial-gradient(circle at calc(100% - 7px) 50%,#5d686d 0 1.3px,#e6ebed 1.4px 3px,transparent 3.2px),
    radial-gradient(ellipse 1.6px 2.6px at 50% 58%,#2b3236 0 100%,transparent 101%);
}
.top-chrome .chrome-spool:first-of-type.press::before{transform:perspective(60px) rotateX(-38deg)}
.top-chrome .chrome-spool:first-of-type.press .lever,.top-chrome .chrome-spool:first-of-type.press .spool{transform:none !important}
.royal-tray::after{content:"";position:absolute;left:50%;top:-6px;width:54px;height:16px;margin-left:-27px;border-radius:3px;
  background:linear-gradient(180deg,#f4f7f8,#aeb8bd 50%,#7d878c);box-shadow:0 2px 3px rgba(0,0,0,.35)}
/* the virtual lid (screens without a hinge) */
#h3-lid3d{position:fixed;inset:0;z-index:1000;pointer-events:none;display:none;perspective:1500px;perspective-origin:50% var(--hy,50%)}
#h3-lid3d .backdrop{position:absolute;left:0;right:0;top:0;height:var(--hy);
  background:radial-gradient(120% 90% at 50% 100%,#3a3d3c,#1b1d1c 70%);opacity:1}
#h3-lid3d .panel{position:absolute;left:0;right:0;top:0;height:var(--hy);transform-origin:50% 100%;transform-style:preserve-3d;will-change:transform}
#h3-lid3d .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px 26px 0 0}
#h3-lid3d .face.out{transform:rotateX(180deg);border-radius:0 0 26px 26px}
#h3-lid3d .face.out .skin{position:absolute !important;inset:0;display:flex !important;transform:none !important;transition:none !important;animation:none !important;opacity:1 !important}
#h3-lid3d .shade{position:absolute;inset:0;background:#0b0907;opacity:0;pointer-events:none}
</style>
<script id="enh-royal-script">
(function(){
  const $$=id=>document.getElementById(id);
  function build(){
    const top=$$('carriage-half'), bot=$$('machine-half');
    if(top && !top.querySelector('.royal-lid-layer')){
      const l=document.createElement('div'); l.className='royal-lid-layer';
      l.innerHTML='<div class="royal-lining"></div><div class="royal-rim"></div><div class="royal-rim-shadow"></div><div class="royal-strap"></div><div class="royal-light"></div>';
      top.prepend(l);
    }
    if(bot && !bot.querySelector('.royal-tray')){
      const s=document.createElement('div'); s.className='royal-hinge-shadow';
      const t=document.createElement('div'); t.className='royal-tray';
      bot.append(s,t);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(build,60));
  else setTimeout(build,60);
})();
</script>

</body>
</html>
