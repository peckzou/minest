<script>
/* ══════════════════════════════════════════════════════════
   状态
   ══════════════════════════════════════════════════════════ */
let HAS_TAP=false;   // 用户是否已交互（vibrate 需要用户手势）
const S = {
  text:'', ink:'black', shift:false, caps:false, numLayer:false,
  col:0, line:0, lineLimit:26,
  carriageX:0, maxCarriage:74,
  docNo:1, audio:null, lastSpool:'r',
  returnAnimating:false,
};

/* DOM */
const $ = id => document.getElementById(id);
const elTyped=$('typed'), elScroll=$('text-scroll'), elCar=$('carriage'),
      elSegment=$('segment'), elFlash=$('strike-flash'), elRibbon=$('ribbon-band'),
      elCounter=$('counter'), elLampShift=$('lamp-shift'), elLampCaps=$('lamp-caps'),
      elLampBell=$('lamp-bell'), elMeter=$('carriage-meter');

/* ══════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  buildTypebars();
  calibrateTypebars();
  buildKeyboard();
  bindLevers();
  bindMarginStop();
  buildScale();
  layoutPushRod();
  bindPushRod();
  syncPushRod(false);
  setDate();
  render();
  updateMeter();
  document.addEventListener('pointerdown',()=>{HAS_TAP=true;initAudio();},{once:true});
  document.addEventListener('keydown',()=>{HAS_TAP=true;},{once:true});
  document.addEventListener('keydown',onPhysical);
});

function setDate(){
  const d=new Date();
  const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  $('doc-date').textContent=`${m[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}, ${d.getFullYear()}`;
  $('doc-no').textContent=`No. ${String(S.docNo).padStart(3,'0')}`;
}

/* ══════════════════════════════════════════════════════════
   字锤篮 — 建立字锤
   ══════════════════════════════════════════════════════════ */
const BAR_CHARS = '1234567890QWERTYUIOPASDFGHJKLZXCVBNM,.?!'.split('');
let barMap = {};   // char -> element

function buildTypebars(){
  const n = BAR_CHARS.length;
  BAR_CHARS.forEach((ch,i)=>{
    const bar=document.createElement('div');
    bar.className='typebar';
    /* 真机：字锤绕篮心枢轴 P 呈放射状排布。
       rotateY(θ) 让杆身在 Y 轴上张开 θ 角，
       所有杆长相同 → 击打时（rotateX=0）杆顶全部落在同一水平线上，
       再配合字模的 rotateY 反向补偿，字面正对击打点。          */
    /* 真机：字锤成扇形排布在篮底，每根的杆底位于弧线上，
       杆身经 rotateZ 指向篮心的击打点。 */
    const a = -58 + (116*i/(n-1));
    bar.style.setProperty('--a', a+'deg');
    /* 真机：字锤呈扇形辐射排列在篮底，每根绕自己的杆底枢轴摆动，
       杆顶汇聚到篮心的击打点。枢轴沿一段圆弧分布：
       横向 ox，竖向 oy（弧的两端下沉，更贴近观察者）。 */
    const R=104;
    const rad=a*Math.PI/180;
    bar.style.setProperty('--ox', (Math.sin(rad)*R).toFixed(1)+'px');
    bar.style.setProperty('--oy', ((1-Math.cos(rad))*R).toFixed(1)+'px');
    /* rotateX 造成的竖直高度损失补偿（初始值，随后由 calibrateTypebars 实测校正） */
    bar.style.setProperty('--lift','0px');
    bar.style.setProperty('--dx','0px');
    bar.dataset.char=ch;

    const rod=document.createElement('div'); rod.className='bar'; bar.appendChild(rod);
    const sp=document.createElement('div'); sp.className='spring'; bar.appendChild(sp);
    const slug=document.createElement('div'); slug.className='slug';
    slug.textContent = ch.toUpperCase();
    bar.appendChild(slug);

    elSegment.appendChild(bar);
    barMap[ch]=bar;
    barMap[ch.toUpperCase()]=bar;
  });
}

/* ══════════════════════════════════════════════════════════
   击打点联动 —— 字模真的敲在纸上
   ══════════════════════════════════════════════════════════ */
function hitPaper(){
  const pp=$('print-point'), ink=$('ink-dot'), spark=$('spark');
  /* 墨迹落在当前列位置（真机：滑车带着字模一起前进） */
  const x=Math.max(2,Math.min(98, (S.col/S.lineLimit)*100));
  const chute=$('paper-chute');
  if(chute) chute.style.setProperty('--ink-x', x+'%');
  // 纸面被字针压出凹痕
  if(pp){
    pp.classList.remove('press');
    void pp.offsetWidth;
    pp.classList.add('press');
  }
  // 墨迹从色带转印到纸面
  if(ink){
    ink.style.background = S.ink==='red'
      ? 'radial-gradient(circle at 40% 35%,rgba(150,35,31,.95),rgba(150,35,31,.5) 62%,transparent 78%)'
      : 'radial-gradient(circle at 40% 35%,rgba(28,22,17,.95),rgba(28,22,17,.5) 62%,transparent 78%)';
    ink.classList.remove('go');
    void ink.offsetWidth;
    ink.classList.add('go');
  }
  // 撞击微光
  if(spark){
    spark.classList.remove('go');
    void spark.offsetWidth;
    spark.classList.add('go');
  }
}

/* ══════════════════════════════════════════════════════════
   字锤落点实测校准
   3D 透视的实际压缩量与角度并非简单余弦关系，
   这里逐根实测：把字模摆到击打位置，量出真实落点偏差，
   反算出需要的 margin-top 补偿，使每根字锤的字针都精确抵住纸面。
   ══════════════════════════════════════════════════════════ */
function calibrateTypebars(){
  const pp=$('print-point');
  if(!pp) return;
  const ppr=pp.getBoundingClientRect();
  const targetY=ppr.bottom;
  const targetX=(ppr.left+ppr.right)/2;
  const bars=[...elSegment.querySelectorAll('.typebar')];
  if(!bars.length) return;

  /* 把字模摆到击打峰值（杆与字模的动画都要 seek，否则量到的是静止位） */
  const poseAt=(bar,slug)=>{
    bar.classList.remove('hit');
    bar.style.animation='';
    slug.style.animation='';
    void bar.offsetWidth;
    bar.classList.add('hit');
    const ba=bar.getAnimations()[0];
    if(ba){ ba.pause(); ba.currentTime=85; }
    const sa=slug.getAnimations()[0];
    if(sa){ sa.pause(); sa.currentTime=85; }
    const r=slug.getBoundingClientRect();
    return { bottom:r.bottom, cx:(r.left+r.right)/2 };
  };
  const thaw=(bar,slug)=>{
    slug.getAnimations().forEach(a=>a.cancel());
    bar.getAnimations().forEach(a=>a.cancel());
    bar.classList.remove('hit');
    bar.style.animation='';
    slug.style.animation='';
  };

  /* 逐根二分求解 --dx（横向）/ --lift（竖直）：
     使该字锤的字模在击打瞬间，底端正好落在击打线上，
     且水平中心正好在打印导轨（击打点）上。
     每根字锤的枢轴位置与扇形角都不同，
     3D 变换下位移非线性，故用二分法收敛到亚像素精度。   */
  bars.forEach(bar=>{
    const slug=bar.querySelector('.slug');
    if(!slug) return;

    /* ── 横向：--dx ── */
    let lo=-150, hi=150, bestDx=0;
    for(let it=0; it<16; it++){
      const mid=(lo+hi)/2;
      bar.style.setProperty('--dx',mid.toFixed(2)+'px');
      const cx=poseAt(bar,slug).cx;
      bestDx=mid;
      if(Math.abs(cx-targetX)<0.4) break;
      /* dx 增大 → 字模右移 → cx 增大 */
      if(cx>targetX) hi=mid; else lo=mid;
    }
    bar.style.setProperty('--dx',bestDx.toFixed(2)+'px');
    {
      const r=poseAt(bar,slug);
      bestDx += (targetX-r.cx);
      thaw(bar,slug);
      bar.style.setProperty('--dx',bestDx.toFixed(1)+'px');
    }

    /* ── 竖直：--lift ── */
    let lo2=-90, hi2=110, bestLift=0;
    for(let it=0; it<16; it++){
      const mid=(lo2+hi2)/2;
      bar.style.setProperty('--lift',mid.toFixed(2)+'px');
      const cur=poseAt(bar,slug).bottom;
      bestLift=mid;
      if(Math.abs(cur-targetY)<0.4) break;
      /* lift 增大 → 字模下移 → 底端 cur 增大 */
      if(cur>targetY) hi2=mid; else lo2=mid;
    }
    bar.style.setProperty('--lift',bestLift.toFixed(2)+'px');
    {
      const b=poseAt(bar,slug).bottom;
      bestLift += (targetY-b);
      thaw(bar,slug);
      bar.style.setProperty('--lift',bestLift.toFixed(1)+'px');
    }
  });
}

/* 击发一根字锤 */
function strikeTypebar(ch){
  const key = ch.toUpperCase();
  let best = barMap[key];
  if(!best){
    // 找不到就找最接近的
    let bestD=99;
    for(const k in barMap){
      if(k.length!==1) continue;
      const d=Math.abs(k.charCodeAt(0)-key.charCodeAt(0));
      if(d<bestD){bestD=d;best=barMap[k];}
    }
  }
  if(!best) return;
  best.classList.remove('hit');
  void best.offsetWidth;
  best.classList.add('hit');
  // 篮体受击反冲
  const seg=elSegment;
  seg.classList.remove('recoil');
  void seg.offsetWidth;
  seg.classList.add('recoil');
}

/* ══════════════════════════════════════════════════════════
   键盘
   ══════════════════════════════════════════════════════════ */
const ROWS=[
  ['1','2','3','4','5','6','7','8','9','0','-','='],
  ['Q','W','E','R','T','Y','U','I','O','P','[',']'],
  ['A','S','D','F','G','H','J','K','L',';','\''],
  ['Z','X','C','V','B','N','M',',','.','/'],
];

/* 真实打字机键位分组（用于排版与阶梯错位） */
const ROW_GROUPS=[
  {row:0, keys:12, lead:0},
  {row:1, keys:12, lead:0.5},
  {row:2, keys:11, lead:1.5},
  {row:3, keys:10, lead:2.5},
];
const SHIFT_MAP={
  '1':'!','2':'@','3':'#','4':'$','5':'%','6':'^','7':'&','8':'*','9':'(','0':')','-':'_','=':'+',
  '[':'{',']':'}',';':':','\'':'"',',':'<','.':'>','/':'?',
};
const NUMSUB={
  'Q':'1','W':'2','E':'3','R':'4','T':'5','Y':'6','U':'7','I':'8','O':'9','P':'0',
  'A':'!','S':'@','D':'#','F':'$','G':'%','H':'^','J':'&','K':'*','L':'(','Z':')',
  'X':'-','C':'_','V':'+','B':'=','N':'[','M':']',',':';','.':':','/':'\\',
};

function buildKeyboard(){
  ROWS.forEach((row,ri)=>{
    const host=$('kr'+(ri+1));
    row.forEach(ch=>{
      const k=document.createElement('div');
      k.className='key';
      k.dataset.ch=ch;
      const stem=document.createElement('div'); stem.className='stem';
      const link=document.createElement('div'); link.className='link';
      const cap=document.createElement('div'); cap.className='cap';
      cap.textContent=ch;
      const sub=document.createElement('div'); sub.className='sub';
      sub.textContent=SHIFT_MAP[ch]||'';
      k.append(stem,link,cap,sub);
      host.appendChild(k);
      bindKey(k,ch);
    });
  });

  // 第五排：左功能键组 | 空格 | 右功能键组（Z 排独立成第四排，不再和功能键挤在一行）
  const r4=$('kr5');
  const leftGrp=document.createElement('div'); leftGrp.className='kgrp';
  const rightGrp=document.createElement('div'); rightGrp.className='kgrp';
  // 左：Shift / Tab / 退格
  leftGrp.appendChild(makeSpecialKey('⇧','shift','k-sm k-shift'));
  leftGrp.appendChild(makeSpecialKey('⇥','tab','k-sm'));
  leftGrp.appendChild(makeSpecialKey('⌫','back','k-sm'));
  // 右：Shift / 回车
  rightGrp.appendChild(makeSpecialKey('⇧','shiftR','k-sm k-shift'));
  rightGrp.appendChild(makeSpecialKey('↵','return','k-sm k-ret'));
  // 空格
  const sp=makeSpecialKey('SPACE','space','k-space');
  r4.append(leftGrp, sp, rightGrp);
}

function makeSpecialKey(label,type,cls){
  const k=document.createElement('div');
  k.className='key '+cls;
  k.dataset.type=type;
  const stem=document.createElement('div'); stem.className='stem';
  const cap=document.createElement('div'); cap.className='cap';
  cap.textContent=label;
  k.append(stem,cap);
  bindSpecial(k,type);
  return k;
}

function bindKey(k,ch){
  k.addEventListener('pointerdown',e=>{
    e.preventDefault();
    k.classList.add('down');
    setTimeout(()=>k.classList.remove('down'),110);
    pressChar(ch);
  });
}
function bindSpecial(k,type){
  k.addEventListener('pointerdown',e=>{
    e.preventDefault();
    k.classList.add('down');
    setTimeout(()=>k.classList.remove('down'),110);
    pressSpecial(type);
  });
}

/* ══════════════════════════════════════════════════════════
   按键处理
   ══════════════════════════════════════════════════════════ */
/* 串行打字队列：真机字锤必须复位后才能击打下一击，
   所以字符进入队列按节奏依次送出，不会因并发 setTimeout 而丢字。 */
let typeQueue = [];      // 待打字符（字符串数组）
let typeAfter = [];      // 与字符对应的"打完后回调"栈
let typeBusy = false;
const TYPE_INTERVAL = 68;

function enqueue(str, after){
  const chars=[...str];
  if(!chars.length){ if(after) after(); return; }
  // 整串入队，回调挂在最后一个字符上
  chars.forEach((c,i)=>{
    typeQueue.push(c);
    typeAfter.push(i===chars.length-1 ? (after||null) : null);
  });
  pumpQueue();
}

function pumpQueue(){
  if(typeBusy || !typeQueue.length) return;
  typeBusy=true;
  const ch=typeQueue.shift();
  const after=typeAfter.shift();
  emitChar(ch);
  setTimeout(()=>{
    typeBusy=false;
    if(after) after();
    pumpQueue();
  }, TYPE_INTERVAL);
}

/* 单字击打 —— 完整机械联动 */
function emitChar(ch){
  // 墨迹落纸
  appendText(ch);
  // 字锤从篮中弹起击打
  strikeTypebar(ch);
  // 字针真的敲在纸上：纸面凹陷 + 墨迹转印 + 撞击微光
  hitPaper();
  // 色带抬起 + 卷轴交替转动
  liftRibbon();
  spinSpool();
  // 撞击闪光
  flashStrike();
  // 纸张受击振动（击打力经色带传到纸面）
  shakePaper();
  // 机身受击微振（整机随击打轻颤）
  rumbleBody();
  // 声音
  sfx(ch===' '?'space':'strike');
  // 滑车左移
  advanceCarriage();
  // 滚筒微转（走纸）
  nudgePlaten();
  // 标尺挡片跟随
  moveMarginStop();
  // 边距铃
  checkBell();
  if(navigator.vibrate && HAS_TAP) navigator.vibrate(9);
}

/* 机身受击微振 */
function rumbleBody(){
  const b=$('machine-half');
  if(!b) return;
  b.classList.remove('rumble');
  void b.offsetWidth;
  b.classList.add('rumble');
}

/* 纸张机械振动 */
function shakePaper(){
  const p=$('paper');
  if(!p) return;
  p.classList.remove('shake');
  void p.offsetWidth;
  p.classList.add('shake');
}

function pressChar(ch){
  initAudio();
  let out;
  if(S.shift){
    // Shift：字母→大写，数字/标点→上档符号
    out = SHIFT_MAP[ch] !== undefined ? SHIFT_MAP[ch] : ch.toUpperCase();
  } else if(S.caps){
    out = ch.toUpperCase();
  } else {
    // 无 Shift：字母→小写，数字/标点→原字符
    out = /^[A-Z]$/.test(ch) ? ch.toLowerCase() : ch;
  }
  const wasShift=S.shift;
  enqueue(out, ()=>{ if(wasShift && S.shift){ S.shift=false; syncShift(); } });
}

function pressSpecial(type){
  initAudio();
  switch(type){
    case 'shift':
    case 'shiftR':
      S.shift=!S.shift;
      syncShift();
      sfx('shift');
      break;
    case 'tab':
      enqueue('    ');
      break;
    case 'back':
      doBackspace();
      break;
    case 'space':
      enqueue(' ');
      break;
    case 'return':
      doReturn();
      break;
  }
}

function syncShift(){
  // 真机：Shift 键把整个字锤篮推向一侧（单边打字位）
  elSegment.classList.toggle('shifted', S.shift);
  elSegment.classList.toggle('unshifted', !S.shift);
  elLampShift.classList.toggle('on', S.shift);
  document.querySelectorAll('.key').forEach(el=>{
    if(el.dataset.type==='shift'||el.dataset.type==='shiftR'){
      el.classList.toggle('locked', S.shift);
    }
  });
}

function typeOut(str){
  enqueue(str);
}

function appendText(ch){
  S.text += ch;
  if(ch==='\n'){S.col=0;S.line++;}
  else S.col++;
  render(ch);
}

/* ══════════════════════════════════════════════════════════
   渲染（带墨迹动画）
   ══════════════════════════════════════════════════════════ */
function render(freshChar){
  const esc=S.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  elTyped.classList.toggle('red',S.ink==='red');
  if(freshChar && freshChar!=='\n' && esc.length){
    // 只给最后一个字符加墨迹动画（按 code point 切分，避免转义错位）
    const chars=[...esc];
    const last=chars.pop();
    elTyped.innerHTML = chars.join('')+'<span class="fresh">'+last+'</span><span class="caret"></span>';
  }else{
    elTyped.innerHTML = esc+'<span class="caret"></span>';
  }
  // 滚到底
  elScroll.style.bottom='0px';
  const layer=$('text-layer');
  layer.scrollTop=layer.scrollHeight;
  updateCounter();
}

function updateCounter(){
  const words=S.text.trim()?S.text.trim().split(/\s+/).length:0;
  elCounter.textContent=`${words}w ${S.text.length}c`;
}

function updateMeter(){
  const p=Math.min(1,S.col/S.lineLimit);
  elMeter.style.top=(p*61)+'px';
}

/* ══════════════════════════════════════════════════════════
   机械联动
   ══════════════════════════════════════════════════════════ */
/* 滑车左移 */
function advanceCarriage(){
  const px=Math.min(S.maxCarriage,(S.col/S.lineLimit)*S.maxCarriage);
  S.carriageX=px;
  elCar.style.transform=`translateX(${-px}px)`;
  updateMeter();
}
/* 回车：滑车复位 + 棘轮 */
/* 回车 —— 棘轮行程：滑车飞回 + 棘轮拨动行距旋钮 + 纸面推进一整行 */
function doReturn(){
  if(S.returnAnimating) return;
  S.returnAnimating=true;
  sfx('return');
  if(navigator.vibrate && HAS_TAP) navigator.vibrate([25,15,25]);

  const crl=$('crl');
  crl.classList.add('pull');

  const start=S.carriageX;
  const dur=300;
  const t0=performance.now();

  /* 棘轮齿数 = 行程比例（真机：飞回距离越长，棘轮爬升齿数越多） */
  const teeth=Math.max(3,Math.round(start/8)+4);

  (function step(){
    const k=Math.min(1,(performance.now()-t0)/dur);
    /* 棘轮式运动：不是平滑 ease，而是逐齿跳动（真机回车是顿挫的） */
    const eased=1-Math.pow(1-k,2.4);
    /* 叠加齿状顿挫 */
    const tooth=eased*teeth;
    const frac=tooth-Math.floor(tooth);
    const jitter=(Math.floor(tooth)%2===0?1:-1)*(1-frac)*1.1;
    const pos=start*(1-eased)+jitter;

    elCar.style.transform=`translateX(${-pos}px)`;

    /* 棘轮爬升时逐齿发声 */
    if(k<1){
      requestAnimationFrame(step);
    }else{
      /* 行程结束：滑车复位到底 */
      elCar.style.transform='translateX(0px)';
      S.carriageX=0;
      /* 棘轮拨动行距旋钮 */
      turnLineKnob(teeth);
      /* 纸面推进一整行（真机：换行 = 滚筒转一格） */
      feedLine();
      /* 换行 */
      S.text+='\n'; S.col=0; S.line++;
      render();
      updateMeter();
      S.returnAnimating=false;
      crl.classList.remove('pull');
    }
  })();

  // 棘轮逐齿声
  for(let i=0;i<teeth;i++) setTimeout(()=>sfx('ratchet',0.32),i*(dur/teeth));

  // 行末触发边距铃
  if(S.col>=S.lineLimit-1) ringBell();
}

/* 棘轮带动行距旋钮 */
function turnLineKnob(teeth){
  const lf=$('lf-knob');
  if(!lf) return;
  lf.classList.remove('turn'); void lf.offsetWidth; lf.classList.add('turn');
  lf.style.setProperty('--turn',(teeth*22)+'deg');
}

/* 换行走纸：滚筒转一格，纸上内容整体上移一行 */
function feedLine(){
  const rules=$('paper-rules');
  if(rules){
    S.paperFeed=(S.paperFeed||0)+24;
    rules.style.backgroundPosition='0px '+(S.paperFeed*0.55)+'px';
  }
  const p=$('platen');
  if(p){
    /* 滚筒绕自身长轴转：只滚动表面纹理（以前用平面 rotate，整根滚筒会被转歪且角度累积） */
    platenAngle+=6;
    p.style.transition='--roll .2s';
    p.style.setProperty('--roll', platenAngle);
  }
}

/* 退格 */
function doBackspace(){
  sfx('back');
  if(navigator.vibrate && HAS_TAP) navigator.vibrate(12);
  const bs=$('bs-lever'); bs.classList.add('pull');
  setTimeout(()=>bs.classList.remove('pull'),180);
  if(S.text.length){
    S.text=S.text.slice(0,-1);
    // 列数按当前行重算（删掉换行后要回到上一行末尾）
    const lines=S.text.split('\n');
    S.col=lines[lines.length-1].length;
    S.line=lines.length-1;
    render();
    advanceCarriage();
  }
}

/* 行距旋钮：手动进一行 */
function lineFeed(){
  const k=$('lf-knob');
  k.classList.remove('turn'); void k.offsetWidth; k.classList.add('turn');
  sfx('lf');
  S.text+='\n'; S.col=0;
  render();
}

/* 色带卷轴转动 */
function spinSpool(){
  const sp = S.lastSpool==='l' ? $('spool-r') : $('spool-l');
  S.lastSpool = S.lastSpool==='l' ? 'r' : 'l';
  sp.classList.remove('spin'); void sp.offsetWidth; sp.classList.add('spin');
  // 摇柄跟随
  const lv = sp.id==='spool-l' ? $('lever-l') : $('lever-r');
  lv.style.transition='transform .18s ease-out';
  lv.style.transform = (sp.id==='spool-l'?'rotate(28deg)':'rotate(-28deg)');
  setTimeout(()=>{lv.style.transform='rotate(0deg)';},200);

  // 顶栏卷轴同步（真机两处卷轴是同一根轴的两端）
  const topSp = sp.id==='spool-l' ? $('top-spool-l') : $('top-spool-r');
  const topLv = sp.id==='spool-l' ? $('top-lever-l') : $('top-lever-r');
  if(topSp){
    topSp.classList.remove('spin'); void topSp.offsetWidth; topSp.classList.add('spin');
  }
  if(topLv){
    topLv.style.transition='transform .18s ease-out';
    topLv.style.transform = (sp.id==='spool-l'?'rotate(28deg)':'rotate(-28deg)');
    setTimeout(()=>{topLv.style.transform='rotate(0deg)';},200);
  }
}

/* 生成标尺刻度与数字（真机：每格等距，每 10 格标数字） */
function buildScale(){
  const ticks=$('scale-ticks'), nums=$('scale-nums');
  if(!ticks||!nums) return;
  const TOTAL=70;            // 总格数
  const PER_MAJOR=10;        // 每 10 格一个长刻度+数字
  let h='',n='';
  for(let i=0;i<=TOTAL;i++){
    const cls = i%PER_MAJOR===0 ? 'maj' : i%5===0 ? 'mid' : 'min';
    h+='<i class="'+cls+'"></i>';
    if(i%PER_MAJOR===0) n+='<span>'+i+'</span>';
  }
  ticks.innerHTML=h;
  nums.innerHTML=n;
}

/* 标尺挡片跟随击打位置 */
function moveMarginStop(){
  const ms=$('margin-stop');
  if(!ms) return;
  const p=Math.min(1,(S.col/S.lineLimit));
  ms.style.right=(2+p*72)+'%';
}

/* 色带抬起（真机：击打瞬间色带被顶起，随即落下） */
function liftRibbon(){
  const base = ribbonBaseY();
  elRibbon.style.transform='translateY('+base+'px)';
  elRibbon.classList.add('lifted');
  setTimeout(()=>{ elRibbon.style.transform='translateY('+base+'px)'; },110);
  setTimeout(()=>elRibbon.classList.remove('lifted'),120);
}

/* 色带架基准高度（黑=0，红=+9，无色=+18） */
function ribbonBaseY(){
  return S.ink==='red' ? 9 : S.ink==='strike' ? 18 : 0;
}

/* 色带升降器：整个色带架沿导轨上下移动到对应字模高度 */
function setRibbonLift(){
  const car=$('ribbon-carriage');
  if(!car) return;
  car.classList.remove('lift-red','lift-strike');
  if(S.ink==='red') car.classList.add('lift-red');
  else if(S.ink==='strike') car.classList.add('lift-strike');
  // 色带本体跟随
  const base = ribbonBaseY();
  elRibbon.style.transform='translateY('+base+'px)';
  // 推杆同步到位
  syncPushRod();
}

/* ── 推杆机构 ──────────────────────────────────────────
   真机：色带选择由一根滑杆推动，推杆行程分为黑/红/无色三档。
   推杆推动 → 色带升降器升降 → 色带对准对应字模高度。      */
const ROD_POS = { black:0, red:0.5, strike:1 };

function layoutPushRod(){
  const slot=$('rod-slot'), rod=$('push-rod'), labels=$('rod-labels');
  if(!slot||!rod) return;
  const sr=slot.getBoundingClientRect();
  const dr=rod.getBoundingClientRect();
  // 槽的绝对位置 → 相对机构甲板
  const deck=$('mech-deck').getBoundingClientRect();
  slot.style.left = (sr.left-deck.left)+'px';
  slot.style.top  = (sr.top-deck.top)+'px';
  slot.style.width= sr.width+'px';
  // 推杆：靠槽右端，行程 = 槽宽 - 推杆宽
  rod.style.top = (sr.top-deck.top)+'px';
  const travel=Math.max(0,sr.width-dr.width-4);
  rod.style.setProperty('--travel',travel+'px');
  if(labels){
    labels.style.left=(sr.left-deck.left)+'px';
    labels.style.top =(sr.top-deck.top-11)+'px';
  }
}

/* 推杆滑到当前色带对应档位 */
function syncPushRod(animate){
  const rod=$('push-rod'), slot=$('rod-slot'), labels=$('rod-labels');
  if(!rod||!slot) return;
  const t=ROD_POS[S.ink]!==undefined?ROD_POS[S.ink]:0;
  const travel=parseFloat(rod.style.getPropertyValue('--travel'))||0;
  rod.classList.toggle('snap',!!animate);
  rod.style.left = (slot.offsetLeft + (slot.offsetWidth-rod.offsetWidth-4) * (1-t))+'px';
  if(labels){
    labels.querySelectorAll('span').forEach(sp=>{
      sp.classList.toggle('active', sp.dataset.ink===S.ink);
    });
  }
}

/* 推杆拖动（真机：可用手指把滑杆推到任一档） */
function bindPushRod(){
  const rod=$('push-rod'), slot=$('rod-slot');
  if(!rod||!slot) return;
  let dragging=false;
  const move=e=>{
    if(!dragging) return;
    const sr=slot.getBoundingClientRect();
    const dr=rod.getBoundingClientRect();
    // 手指位置 → 0..1 行程比例（从右往左推）
    let t=1-(e.clientX-sr.left-dr.width/2)/Math.max(1,sr.width-dr.width);
    t=Math.max(0,Math.min(1,t));
    rod.style.left=(slot.offsetLeft+(slot.offsetWidth-rod.offsetWidth-4)*(1-t))+'px';
    // 就近吸附到档位（真机：推杆有定位阻尼槽，到位会"咔"地卡住）
    const near=[['black',0],['red',0.5],['strike',1]].sort((a,b)=>Math.abs(a[1]-t)-Math.abs(b[1]-t))[0];
    if(near && Math.abs(near[1]-t)<0.16){
      dragging=false;
      rod.classList.add('snap');
      applyInk(near[0]);
      sfx('shift');
      rod.classList.remove('snap');
    }
  };
  rod.addEventListener('pointerdown',e=>{
    e.preventDefault();
    dragging=true;
    rod.classList.add('pulled');
    try{rod.setPointerCapture(e.pointerId);}catch(_){}
  });
  rod.addEventListener('pointermove',move);
  const end=()=>{
    if(!dragging) return;
    dragging=false;
    rod.classList.remove('pulled');
    syncPushRod(true);
  };
  rod.addEventListener('pointerup',end);
  rod.addEventListener('pointercancel',end);
}

/* 撞击闪光 */
function flashStrike(){
  elFlash.style.left=(22+Math.random()*56)+'%';
  elFlash.style.top=(44+Math.random()*8)+'%';
  elFlash.classList.remove('go'); void elFlash.offsetWidth; elFlash.classList.add('go');
}

/* 滚筒微转 + 走纸（纸上升，内容相对下移） */
let platenAngle=0;
function nudgePlaten(){
  const p=$('platen');
  /* 每个字微微转动滚筒（表面纹理下移一点），不再改 transform */
  platenAngle+=0.55;
  p.style.setProperty('--roll', platenAngle);
  // 纸面纹理随滚筒滚动（横格线平移）
  S.paperFeed=(S.paperFeed||0)+1;
  const off=S.paperFeed*0.55;
  const rules=$('paper-rules');
  if(rules) rules.style.backgroundPosition='0px '+off+'px';
  // 垂纸与纸道的格线同步平移（真机：整条纸是一个连续面）
  const drop=$('drop-rules'), cr=$('chute-rules');
  if(drop) drop.style.backgroundPosition='0px '+off+'px';
  if(cr)   cr.style.backgroundPosition='0px '+off+'px';
}

/* 边距铃：到达边距时只响一次 */
let bellArmed=true;
function checkBell(){
  if(S.col>=S.lineLimit-1){
    if(bellArmed){ bellArmed=false; ringBell(); }
  }else{
    bellArmed=true;
  }
}
function ringBell(){
  const b=$('bell');
  b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
  elLampBell.classList.add('warn');
  setTimeout(()=>elLampBell.classList.remove('warn'),700);
  sfx('bell');
}

/* ══════════════════════════════════════════════════════════
   墨色选择
   ══════════════════════════════════════════════════════════ */
/* 统一的色带切换（按钮 / 推杆拖动 都走这里） */
function applyInk(ink){
  S.ink=ink;
  // 按钮高亮
  document.querySelectorAll('.rsel').forEach(x=>x.classList.toggle('on',x.dataset.ink===ink));
  // 色带本体与已印文字的颜色
  elRibbon.classList.toggle('red',ink==='red');
  elTyped.classList.toggle('red',ink==='red');
  // 真机：选色带 = 推杆推动色带架沿导轨升降到对应字模高度
  setRibbonLift();
  syncPushRod(true);
}

document.querySelectorAll('.rsel').forEach(b=>{
  b.addEventListener('click',()=>{
    applyInk(b.dataset.ink);
    sfx('shift');
    toast(S.ink==='red'?'红 色 带':S.ink==='strike'?'无 色 带':'黑 色 带');
  });
});

/* ══════════════════════════════════════════════════════════
   操作杆
   ══════════════════════════════════════════════════════════ */
/* 标尺挡片拖动（真机：可手动调整右边距） */
function bindMarginStop(){
  const ms=$('margin-stop');
  if(!ms) return;
  let dragging=false;
  ms.addEventListener('pointerdown',e=>{
    e.preventDefault();
    dragging=true;
    ms.classList.add('dragging');
    try{ ms.setPointerCapture(e.pointerId); }catch(_){}
  });
  ms.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const plate=ms.parentElement;
    const pr=plate.getBoundingClientRect();
    if(!pr.width) return;
    const rel=1-(e.clientX-pr.left)/pr.width;
    const pct=Math.max(0.02,Math.min(0.92,rel));
    ms.style.right=((1-pct)*100)+'%';
    // 边距变了 → 行宽随之改变
    const newLimit=Math.max(6,Math.round(S.lineLimit*pct/Math.max(0.02,S.lineLimit?pct:1)));
    if(newLimit!==S.lineLimit && newLimit>0){
      S.lineLimit=newLimit;
      updateMeter();
    }
  });
  const end=()=>{
    if(!dragging) return;
    dragging=false;
    ms.classList.remove('dragging');
    sfx('shift');
  };
  ms.addEventListener('pointerup',end);
  ms.addEventListener('pointercancel',end);
}

function bindLevers(){
  $('crl').addEventListener('pointerdown',e=>{e.preventDefault();doReturn();});
  $('lf-knob').addEventListener('pointerdown',e=>{e.preventDefault();lineFeed();});
  $('bs-lever').addEventListener('pointerdown',e=>{e.preventDefault();doBackspace();});

  // 滚筒旋钮拖动 → 走纸
  ['knob-l','knob-r'].forEach(id=>{
    const k=$(id);
    let sy=0,ss=0;
    k.addEventListener('pointerdown',e=>{
      e.preventDefault(); sy=e.clientY; ss=$('text-layer').scrollTop;
      k.setPointerCapture(e.pointerId);
    });
    k.addEventListener('pointermove',e=>{
      if(sy===null&&sy!==0) return;
      const dy=sy-e.clientY;
      $('text-layer').scrollTop=ss-dy*2.2;
    });
    k.addEventListener('pointerup',()=>{sy=null;});
  });
}

/* ══════════════════════════════════════════════════════════
   物理键盘
   ══════════════════════════════════════════════════════════ */
function onPhysical(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  e.preventDefault(); initAudio();
  const k=e.key;

  // Shift：按键按下时锁定，抬起时释放（与真机一次性锁定一致）
  if(k==='Shift'){
    if(!e.repeat) { S.shift=true; syncShift(); sfx('shift'); }
    return;
  }
  if(k==='CapsLock'){
    if(!e.repeat){ S.caps=!S.caps; elLampCaps.classList.toggle('on',S.caps); sfx('shift'); }
    return;
  }
  if(k==='Enter'){ doReturn(); return; }
  if(k==='Backspace'){ doBackspace(); return; }
  if(k==='Tab'){ enqueue('    '); return; }
  if(k===' '){ enqueue(' '); return; }

  if(k.length===1){
    const up=k.toUpperCase();
    // 找到对应的实体键
    let found=null;
    for(const row of ROWS) if(row.includes(up)) found=up;
    if(found){
      highlightKey(found);
      // 物理 Shift 直接决定本字符的大小写/符号
      const wasShift=S.shift;
      S.shift=e.shiftKey;
      pressChar(found);
      S.shift=wasShift;
    }else{
      enqueue(k);
    }
  }
}

/* Shift 抬起时释放 */
function onPhysicalKeyUp(e){
  if(e.key==='Shift' && S.shift){ S.shift=false; syncShift(); }
}
document.addEventListener('keyup',onPhysicalKeyUp);
function highlightKey(ch){
  document.querySelectorAll('.key').forEach(el=>{
    if(el.dataset.ch===ch){
      el.classList.add('down');
      setTimeout(()=>el.classList.remove('down'),110);
    }
  });
}

/* ══════════════════════════════════════════════════════════
   音频引擎 — 机械音
   ══════════════════════════════════════════════════════════ */
function initAudio(){
  if(S.audio) return;
  try{ S.audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}

function noiseBuf(ctx,dur,decay){
  const len=Math.floor(ctx.sampleRate*dur);
  const b=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(len*decay));
  return b;
}

function sfx(kind,vol=1){
  const ctx=S.audio; if(!ctx) return;
  const t=ctx.currentTime;
  const out=ctx.createGain(); out.connect(ctx.destination);
  out.gain.value=vol;

  if(kind==='strike'){
    /* 字锤击打：金属 ping + 键杆 clack + 色带闷响 */
    // 键杆撞击
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.05,0.10);
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1900; nf.Q.value=1.1;
    const ng=ctx.createGain();
    ng.gain.setValueAtTime(.5,t); ng.gain.exponentialRampToValueAtTime(.001,t+.05);
    n.connect(nf); nf.connect(ng); ng.connect(out); n.start(t);
    // 字模金属声
    [3400,5200,7100].forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*(1+(Math.random()-.5)*.04);
      const g=ctx.createGain();
      g.gain.setValueAtTime(.14/(i+1),t);
      g.gain.exponentialRampToValueAtTime(.001,t+.09);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+.1);
    });
    // 色带闷响（低频）
    const b=ctx.createOscillator(); b.type='triangle'; b.frequency.setValueAtTime(140,t);
    b.frequency.exponentialRampToValueAtTime(70,t+.05);
    const bg=ctx.createGain(); bg.gain.setValueAtTime(.25,t); bg.gain.exponentialRampToValueAtTime(.001,t+.06);
    b.connect(bg); bg.connect(out); b.start(t); b.stop(t+.07);

  }else if(kind==='space'){
    /* 空格：沉闷的段落杆声 */
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.09,0.07);
    const nf=ctx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=900;
    const ng=ctx.createGain(); ng.gain.setValueAtTime(.42,t); ng.gain.exponentialRampToValueAtTime(.001,t+.09);
    n.connect(nf); nf.connect(ng); ng.connect(out); n.start(t);
    const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(110,t);
    o.frequency.exponentialRampToValueAtTime(55,t+.07);
    const g=ctx.createGain(); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+.09);

  }else if(kind==='return'){
    /* 回车：棘轮 + 滑车飞回 */
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.28,0.32);
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1500; nf.Q.value=.6;
    const ng=ctx.createGain();
    ng.gain.setValueAtTime(.001,t);
    ng.gain.linearRampToValueAtTime(.28,t+.05);
    ng.gain.exponentialRampToValueAtTime(.001,t+.28);
    n.connect(nf); nf.connect(ng); ng.connect(out); n.start(t);
    // 滑车滑轨摩擦
    const o=ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(320,t); o.frequency.exponentialRampToValueAtTime(90,t+.25);
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
    const g=ctx.createGain(); g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.26);
    o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t+.27);
    // 到底的闷撞
    const e=ctx.createOscillator(); e.type='sine'; e.frequency.setValueAtTime(120,t+.24);
    e.frequency.exponentialRampToValueAtTime(55,t+.3);
    const eg=ctx.createGain(); eg.gain.setValueAtTime(.3,t+.24); eg.gain.exponentialRampToValueAtTime(.001,t+.31);
    e.connect(eg); eg.connect(out); e.start(t+.24); e.stop(t+.32);

  }else if(kind==='ratchet'){
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.02,0.25);
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=3000; nf.Q.value=3;
    const g=ctx.createGain(); g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.022);
    n.connect(nf); nf.connect(g); g.connect(out); n.start(t);

  }else if(kind==='bell'){
    /* 边距铃：黄铜钟 */
    [2093,2637,3136,4186].forEach((f,i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=ctx.createGain();
      g.gain.setValueAtTime(.22/(i+1),t);
      g.gain.exponentialRampToValueAtTime(.0008,t+1.4-i*.2);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+1.5);
    });

  }else if(kind==='back'){
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.03,0.2);
    const nf=ctx.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=1400;
    const g=ctx.createGain(); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.03);
    n.connect(nf); nf.connect(g); g.connect(out); n.start(t);
    const o=ctx.createOscillator(); o.type='square'; o.frequency.setValueAtTime(280,t);
    o.frequency.exponentialRampToValueAtTime(130,t+.03);
    const og=ctx.createGain(); og.gain.setValueAtTime(.09,t); og.gain.exponentialRampToValueAtTime(.001,t+.035);
    o.connect(og); og.connect(out); o.start(t); o.stop(t+.04);

  }else if(kind==='shift'){
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.05,0.12);
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=2600; nf.Q.value=2;
    const g=ctx.createGain(); g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
    n.connect(nf); nf.connect(g); g.connect(out); n.start(t);
    const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(520,t);
    o.frequency.exponentialRampToValueAtTime(230,t+.05);
    const og=ctx.createGain(); og.gain.setValueAtTime(.1,t); og.gain.exponentialRampToValueAtTime(.001,t+.06);
    o.connect(og); og.connect(out); o.start(t); o.stop(t+.07);

  }else if(kind==='lf'){
    const n=ctx.createBufferSource(); n.buffer=noiseBuf(ctx,0.06,0.14);
    const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=2200; nf.Q.value=1.4;
    const g=ctx.createGain(); g.gain.setValueAtTime(.24,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
    n.connect(nf); nf.connect(g); g.connect(out); n.start(t);
  }
}

/* ══════════════════════════════════════════════════════════
   提示

<script id="enh-script">
(function(){
  /* ── 更密的字锤篮：在建篮之前补齐常用标点的字锤（真机 44+ 根） ── */
  ['-','=',';','\'','/','[',']','@','#','&','*','(',')','%','$','"','_','+'].forEach(c=>{ if(!BAR_CHARS.includes(c)) BAR_CHARS.push(c); });
})();

/* ── 真实击打时序 ──
   按键 → 字锤从篮中弹起（约 84ms 摆到纸面）→ 撞击瞬间：字印到纸上、纸面凹陷、墨迹、闪光、机身轻震、声音
   → 字锤回落后，擒纵机构放行，字车左移一格、滚筒微转。空格键不动字锤，只放行字车。 */
const STRIKE_MS = 84;
let pendingImpacts = 0;
let chuteChars = [];        // 当前行（纸道上可见的那一行）：{c, red}
function chuteEl(){
  let line = document.getElementById('chute-line');
  const chute = document.getElementById('paper-chute');
  if(!line && chute){
    line = document.createElement('div'); line.className='chute-line'; line.id='chute-line';
    chute.appendChild(line);
    const g=document.createElement('div'); g.className='type-guide'; chute.appendChild(g);
  }
  return line;
}
let chuteCW = 0;
function chuteCharW(){
  if(chuteCW) return chuteCW;
  const l=chuteEl(); if(!l) return 7.8;
  const probe=document.createElement('span'); probe.textContent='MMMMMMMMMM'; probe.style.visibility='hidden';
  l.appendChild(probe); chuteCW=probe.getBoundingClientRect().width/10 || 7.8; probe.remove();
  return chuteCW;
}
/* 让刚敲出的字正好位于打字点（纸道中线）下：col 个字之后，第 col-1 个字的中心对准中线 */
function syncChute(fresh){
  const l=chuteEl(), chute=document.getElementById('paper-chute');
  if(!l||!chute) return;
  const cw=chuteCharW();
  l.innerHTML = chuteChars.map((o,i)=>{
    const ch=o.c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/ /g,'&nbsp;');
    const cls=(o.red?'r':'')+(fresh && i===chuteChars.length-1?' fresh':'');
    return cls.trim()?`<span class="${cls.trim()}">${ch}</span>`:`<span>${ch}</span>`;
  }).join('');
  const centre = chute.clientWidth/2;
  // 刚击打时：最后一个字在中线；字车放行后：下一格空位到中线
  const at = (fresh ? chuteChars.length - 0.5 : chuteChars.length + 0.5);
  l.style.transform = `translateX(${(centre - at*cw).toFixed(1)}px)`;
}
function emitChar(ch){
  if(ch==='\n'){ appendText(ch); return; }
  const red = S.ink==='red';
  const blank = ch===' ' || S.ink==='strike';
  if(ch!==' ') { strikeTypebar(ch); liftRibbon(); spinSpool(); }
  pendingImpacts++;
  setTimeout(()=>{
    // 撞击瞬间
    appendText(ch);
    chuteChars.push({c: blank && ch!==' ' ? ' ' : ch, red});
    if(ch!==' '){
      hitPaper(); flashStrike(); shakePaper(); rumbleBody();
      if(navigator.vibrate && HAS_TAP) navigator.vibrate(9);
    }
    syncChute(ch!==' ');
    sfx(ch===' '?'space':'strike');
    // 字锤回落 → 擒纵放行：字车左移一格
    setTimeout(()=>{
      advanceCarriage(); nudgePlaten(); moveMarginStop(); checkBell();
      syncChute(false);
      pendingImpacts--;
    }, ch===' ' ? 10 : 46);
  }, STRIKE_MS);   // 所有字（含空格）同一时刻落纸，顺序与按键一致
}
/* 回车 / 退格要等最后一个字真正落纸 */
const _doReturn = doReturn;
doReturn = function(){
  if(pendingImpacts>0){ setTimeout(doReturn, 30); return; }
  const lev=document.getElementById('ret-lever');

const _doBackspace = doBackspace;
doBackspace = function(){

  if(chuteChars.length) chuteChars.pop();

};

/* ── 镀铬回车杆：装在字车左端，拉动即回车 ── */

/* ── 开合三种形态 ──
   open：完整书写；half：Duo 半折，上半屏像笔记本屏幕一样立起、专注书写；closed：外屏 = 机盖，轻触打开。
   ?mode=open|half|closed 可强制（用于预览）。 */
let lidDismissed = false;
function detectMode(){
  const q = new URLSearchParams(location.search).get('mode');
  if(q==='open'||q==='half'||q==='closed') return q;
  const h = window.__minestHinge;
  let posture=''; try{ posture = navigator.devicePosture && navigator.devicePosture.type || ''; }catch(e){}
  if((h && h.status==='partial') || posture==='folded') return 'half';
  const w=innerWidth, hh=innerHeight, mn=Math.min(w,hh), mx=Math.max(w,hh);
  if(mn < 560 && mx/mn < 1.6) return 'closed';
  return 'open';
}
function applyMode(){
  const app=document.getElementById('app');
  if(!app) return;
  let m=detectMode();
  if(m==='closed' && lidDismissed) m='open';
  app.classList.toggle('mode-half', m==='half');
  app.classList.toggle('mode-closed', m==='closed');
  if(m==='closed'){
    const slip=document.getElementById('lid-slip');
    const lines=(S.text||'').trim().split('\n').filter(Boolean);
    if(slip) slip.textContent = lines.length ? lines.slice(-2).join('\n') : 'Write. Reflect.\nLive better.';
  }
}
addEventListener('resize', applyMode);
addEventListener('minest:hinge', applyMode);
try{ navigator.devicePosture && navigator.devicePosture.addEventListener('change', applyMode); }catch(e){}
document.getElementById('hermes-lid').addEventListener('click',()=>{
  const lid=document.getElementById('hermes-lid');
  lid.classList.add('opening');
  initAudio(); try{ sfx('return'); }catch(e){}
  setTimeout(()=>{ lidDismissed=true; lid.classList.remove('opening'); applyMode(); }, 560);
});
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 一张纸：字锤越过铰链，直接敲在上半屏那张纸的打字行上。
     机构窗里不再垂下第二张纸；打字点固定，字车每敲一个字带着整张纸左移一个字宽，
     刚敲出的字永远落在铁针敲下的位置（真机原理）。
     ══════════════════════════════════════════════════════════ -->
<style id="enh-one-sheet">
/* 机构区不再裁剪：字锤伸过铰链、压在纸面上方 */
#machine-half{overflow:visible !important;z-index:5}

.paper-chute::before,.paper-chute::after,
.paper-chute .chute-rules,.chute-line,.type-guide{display:none !important}

/* 字锤杆加长到能够得着纸上的打字行 */

/* 击打时字模压在纸面之上 */

/* 字车/整张纸随擒纵逐格移动 */
#carriage{transition:transform .06s steps(1,end)}
#carriage.flyback{transition:transform .32s cubic-bezier(.2,.9,.25,1)}
/* 打字点的指示：纸下沿两片镀铬字导，夹住当前打字位置（固定不动） */
.type-guide-top{
  position:absolute;z-index:6;pointer-events:none;width:22px;height:14px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent 0 3px,var(--chrome-mid) 3px 5px,transparent 5px 17px,var(--chrome-mid) 17px 19px,transparent 19px);
  opacity:.55;
}
</style>
<script id="enh-one-sheet-script">
(function(){
  const $$=id=>document.getElementById(id);
  let carT = 0;            // 字车当前位移（px，负数 = 左移）
  function strikeX(){ const pp=$$('print-point'); const r=pp.getBoundingClientRect(); return (r.left+r.right)/2; }
  function caretRect(){ const c=document.querySelector('#typed .caret'); return c ? c.getBoundingClientRect() : null; }
  /* 字车对位：让"下一个字的位置"（光标）正好在打字点下 */
  function alignCarriage(fly){
    const c=caretRect(); if(!c) return;
    const car=$$('carriage');
    const cw = c.width || 8;
    const shift = strikeX() - (c.left + cw/2);
    if(Math.abs(shift) < 0.3) return;
    carT += shift;
    car.classList.toggle('flyback', !!fly);
    car.style.transform = 'translateX(' + carT.toFixed(1) + 'px)';
    S.carriageX = -carT;
    if(typeof updateMeter==='function') updateMeter();
  }
  /* 字锤的击打目标 = 纸上打字行（光标所在行）的字底 */
  function alignStrike(){
    const c=caretRect(), chute=$$('paper-chute'), pp=$$('print-point');
    if(!c||!chute||!pp) return;
    const back=chute.offsetParent; if(!back) return;
    const targetY = c.bottom - 2;
    const before = pp.getBoundingClientRect().bottom;
    const br = back.getBoundingClientRect();
    chute.style.top = (targetY - br.top - chute.offsetHeight) + 'px';
    const seg=$$('segment');
    const cur = parseFloat(getComputedStyle(seg).getPropertyValue('--bar-extra')) || 0;
    const extra = Math.max(0, cur + (before - targetY));
    seg.style.setProperty('--bar-extra', extra.toFixed(1)+'px');
    let g=document.querySelector('.type-guide-top');
    const half=$$('carriage-half');
    if(!g && half){ g=document.createElement('div'); g.className='type-guide-top'; half.appendChild(g); }
    if(g && half){ const hr=half.getBoundingClientRect(); g.style.left=(strikeX()-hr.left)+'px'; g.style.top=(c.bottom - hr.top + 1)+'px'; }
    if(typeof calibrateTypebars==='function') calibrateTypebars();
  }
  /* 擒纵：每次放行后对位（覆盖原来"按比例 2.85px/字"的移动） */
  advanceCarriage = function(){ alignCarriage(false); };
  /* 墨迹永远落在打字点（不再跟着列号跑） */
  const _hitPaper = hitPaper;
  hitPaper = function(){ _hitPaper(); const ch=$$('paper-chute'); if(ch) ch.style.setProperty('--ink-x','50%'); };
  /* 回车：原有的棘轮动画结束后，整张纸平滑飞回行首对位 */
  const _ret = doReturn;
  doReturn = function(){
    _ret();
    const wait=()=>{ if(S.returnAnimating) return requestAnimationFrame(wait); requestAnimationFrame(()=>alignCarriage(true)); };
    requestAnimationFrame(wait);
  };
  const _bs = doBackspace;
  doBackspace = function(){ _bs(); requestAnimationFrame(()=>alignCarriage(false)); };
  function setup(){
    carT = 0;
    const car=$$('carriage');
    if(car){ const m=getComputedStyle(car).transform; if(m && m!=='none'){ carT = parseFloat(m.split(',')[4])||0; } }
    alignStrike(); alignCarriage(false);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(setup));
  else requestAnimationFrame(setup);
  addEventListener('resize',()=>requestAnimationFrame(()=>{ alignStrike(); alignCarriage(false); }));
})();
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 推杆可推动 · 字锤篮放大
     1) 原推杆在拖动开始时就判定"已到当前档位"而立刻结束拖动，所以永远推不动；
        改为：拖动全程跟手，经过档位时"咔"一下，松手吸附到最近档位。
     2) 字锤篮只占机构窗中间一小块，比例不协调；整体放大，机构区加高。
     ══════════════════════════════════════════════════════════ -->
<style id="enh-rod-basket">
/* 推杆：更大、更好抓 */
.push-rod{width:44px !important;height:11px !important;border-radius:5.5px !important;cursor:grab;touch-action:none}
.push-rod::before{content:'';position:absolute;left:-16px;right:-22px;top:-16px;bottom:-16px}

#segment{width:290px !important;height:180px !important;perspective:560px !important}

@keyframes typebar-strike{

}
/* 篮体抬离前挡板（铭牌不再挡住扇形） */
#segment{bottom:16px !important}
/* 不要模拟的推杆：真机的色带选择是机身侧面的 BLACK / RED 拨片（.ribbon-selector），
   机构窗里横穿的滑槽、推杆和档位字一并去掉 */
#push-rod,#rod-slot,#rod-labels,.rod-labels,.rod-slot,.push-rod{display:none !important}
</style>
<script id="enh-rod-basket-script">
(function(){
  const $$=id=>document.getElementById(id);
  const DETENTS=[['black',0],['red',0.5],['strike',1]];
  function rebindRod(){
    const old=$$('push-rod'), slot=$$('rod-slot');
    if(!old||!slot) return;
    const rod=old.cloneNode(true);          // 去掉原来会立刻结束拖动的监听
    old.replaceWith(rod);
    let drag=false, lastDetent=null;
    const tAt=x=>{
      const sr=slot.getBoundingClientRect(), dr=rod.getBoundingClientRect();
      return Math.max(0,Math.min(1, 1-(x-sr.left-dr.width/2)/Math.max(1,sr.width-dr.width)));
    };
    const place=t=>{ rod.style.left=(slot.offsetLeft+(slot.offsetWidth-rod.offsetWidth-4)*(1-t))+'px'; };
    rod.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation(); drag=true; lastDetent=S.ink;
      rod.classList.add('pulled'); rod.classList.remove('snap');
      try{ rod.setPointerCapture(e.pointerId); }catch(_){}
      if(typeof initAudio==='function') initAudio();
    });
    rod.addEventListener('pointermove',e=>{
      if(!drag) return;
      const t=tAt(e.clientX); place(t);
      // 经过档位：咔一下（触感 + 声音），但不结束拖动
      const near=DETENTS.find(d=>Math.abs(d[1]-t)<0.06);
      if(near && near[0]!==lastDetent){ lastDetent=near[0]; try{ sfx('shift'); }catch(_){} if(navigator.vibrate) navigator.vibrate(6); }
    });
    const end=e=>{
      if(!drag) return; drag=false; rod.classList.remove('pulled');
      const t=tAt(e.clientX);
      const near=DETENTS.slice().sort((a,b)=>Math.abs(a[1]-t)-Math.abs(b[1]-t))[0];
      rod.classList.add('snap');
      applyInk(near[0]);
      syncPushRod(true);
    };
    rod.addEventListener('pointerup',end);
    rod.addEventListener('pointercancel',end);
  }
  /* 放大后重新对准纸上的打字行（--bar-extra 以篮体自身坐标计，需除以放大倍数） */
  function realign(){
    const seg=$$('segment'); if(!seg) return;
    const k=1;
    // 字锤沿更大的圆弧排布（R 104 → 176）
    seg.querySelectorAll('.typebar').forEach(bar=>{
      const a=parseFloat(bar.style.getPropertyValue('--a'))||0, R=176, rad=a*Math.PI/180;
      bar.style.setProperty('--ox',(Math.sin(rad)*R).toFixed(1)+'px');
      bar.style.setProperty('--oy',((1-Math.cos(rad))*R).toFixed(1)+'px');
    });
    const c=document.querySelector('#typed .caret'), chute=$$('paper-chute'), pp=$$('print-point');
    if(!c||!chute||!pp) return;
    const targetY=c.bottom-2;
    const br=chute.offsetParent.getBoundingClientRect();
    chute.style.top=(targetY-br.top-chute.offsetHeight)+'px';
    // 量出杆顶（静止伸直时）离打字行还差多少，按篮体倍数换算成杆长
    for(let i=0;i<2;i++){
      const bar=seg.querySelector('.typebar'); if(!bar) return;
      const slug=bar.querySelector('.slug');
      bar.classList.remove('hit'); void bar.offsetWidth; bar.classList.add('hit');
      const ba=bar.getAnimations()[0]; if(ba){ ba.pause(); ba.currentTime=85; }
      const sa=slug && slug.getAnimations()[0]; if(sa){ sa.pause(); sa.currentTime=85; }
      const top=(slug||bar).getBoundingClientRect().bottom;
      bar.getAnimations().forEach(a=>a.cancel()); slug && slug.getAnimations().forEach(a=>a.cancel()); bar.classList.remove('hit');
      const cur=parseFloat(getComputedStyle(seg).getPropertyValue('--bar-extra'))||0;
      seg.style.setProperty('--bar-extra', Math.max(0, cur + (top-targetY)/k).toFixed(1)+'px');
    }
    if(typeof calibrateTypebars==='function') calibrateTypebars();
    if(typeof layoutPushRod==='function'){ layoutPushRod(); syncPushRod(false); }
  }
  function setup(){ rebindRod(); requestAnimationFrame(()=>requestAnimationFrame(realign)); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(setup,60));
  else setTimeout(setup,60);
  addEventListener('resize',()=>setTimeout(realign,80));
})();
</script>


<!-- 增强（Claude）· 每个字记住自己落纸时的色带（真机：切换色带不会改变已经打上去的字） -->
<style id="enh-ink">
#typed.red{color:inherit !important}
#typed .ink-red{color:var(--ink-red)}
</style>
<script id="enh-ink-script">
(function(){
  S.inks = S.inks || [];
  const _append = appendText;
  appendText = function(ch){ S.inks.push(S.ink==='red' ? 'r' : 'b'); _append(ch); };
  render = function(freshChar){
    // 与 S.text 对齐（退格删掉的字，颜色记录一并去掉）
    if(S.inks.length > S.text.length) S.inks.length = S.text.length;
    // 回车等直接写入 S.text 的字符（如换行）补在末尾，颜色不错位
    while(S.inks.length < S.text.length) S.inks.push(S.ink==='red' ? 'r' : 'b');
    const chars=[...S.text];
    const esc=c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;
    let html='', run='', runInk=null;
    const flush=()=>{ if(!run) return; html += runInk==='r' ? '<span class="ink-red">'+run+'</span>' : run; run=''; };
    const last = chars.length-1;
    chars.forEach((c,i)=>{
      const ink=S.inks[i]||'b';
      if(i===last && freshChar && freshChar!=='\n'){
        flush();
        html += '<span class="fresh'+(ink==='r'?' ink-red':'')+'">'+esc(c)+'</span>';
        return;
      }
      if(ink!==runInk){ flush(); runInk=ink; }
      run += esc(c);
    });
    flush();
    elTyped.classList.remove('red');
    elTyped.innerHTML = html + '<span class="caret"></span>';
    elScroll.style.bottom='0px';
    const layer=document.getElementById('text-layer');
    if(layer) layer.scrollTop=layer.scrollHeight;
    if(typeof updateCounter==='function') updateCounter();
  };
})();
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 看得见的铁针
     原来击打时每根字锤只是在自己的枢轴处竖直立起，再把字模横向/竖向"挪"到打字点
     （字模与杆分离，杆身看不到连到纸上）。改为真实结构：
     每根字锤击打时整根杆从枢轴直指打字点，杆长 = 枢轴到打字点的距离，
     字模固定在杆顶并反向转正，字面端正地压在纸上；击打全程杆身可见。
     ══════════════════════════════════════════════════════════ -->
<style id="enh-aim">
#segment{z-index:60 !important}
/* 机构区压在铰链之上（#hinge 是 z 100），铁针从篮里一路越过铰链打到纸上，全程可见 */
#machine-half{z-index:120 !important}
#segment .typebar{height:var(--len, 168px) !important;width:4px !important}
#segment .typebar .bar{
  background:linear-gradient(90deg,#4b555a,#f4f8f9 40%,#aeb9be 70%,#59646a) !important;
  box-shadow:0 0 0 .5px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.35) !important;
}
#segment .typebar.hit{z-index:80 !important}
/* 击打：杆从篮里扬起，整根转向打字点（--hitZ），顶端字模压在纸上，然后回落 */
@keyframes typebar-strike{
  0%  {transform:rotateX(50deg) rotateZ(calc(var(--a) * -1))}
  16% {transform:rotateX(16deg) rotateZ(calc(var(--hitZ, 0deg) * .7 + var(--a) * -.3))}
  28% {transform:rotateX(0deg) rotateZ(var(--hitZ, 0deg))}
  40% {transform:rotateX(2deg) rotateZ(var(--hitZ, 0deg))}
  100%{transform:rotateX(50deg) rotateZ(calc(var(--a) * -1))}
}
@keyframes slug-align{
  0%  {transform:translateX(-50%) rotateX(50deg);margin-top:0;margin-left:0}
  28% {transform:translateX(-50%) rotateZ(calc(var(--hitZ, 0deg) * -1));margin-top:0;margin-left:0}
  40% {transform:translateX(-50%) rotateZ(calc(var(--hitZ, 0deg) * -1));margin-top:0;margin-left:0}
  100%{transform:translateX(-50%) rotateX(50deg);margin-top:0;margin-left:0}
}
</style>
<script id="enh-aim-script">
(function(){
  const $$=id=>document.getElementById(id);
  /* 逐根计算：枢轴 → 打字点 的方向与距离 */
  function aimBars(){
    const seg=$$('segment'), pp=$$('print-point'), caret=document.querySelector('#typed .caret');
    if(!seg||!pp||!caret) return;
    seg.style.removeProperty('--bar-extra');
    const sr=seg.getBoundingClientRect();
    const ppr=pp.getBoundingClientRect();
    const tx=(ppr.left+ppr.right)/2;
    const ty=caret.getBoundingClientRect().bottom - 2;   // 字模底 = 纸上打字行
    seg.querySelectorAll('.typebar').forEach(bar=>{
      const ox=parseFloat(bar.style.getPropertyValue('--ox'))||0;
      const oy=parseFloat(bar.style.getPropertyValue('--oy'))||0;
      const slug=bar.querySelector('.slug');
      const slugH=slug ? slug.offsetHeight : 19;
      const px=sr.left + sr.width/2 + ox + 2;     // 杆底中心（枢轴）
      const py=sr.bottom - oy;
      const dx=tx-px, dy=py-ty;
      const len=Math.max(40, Math.hypot(dx,dy) - slugH*0.05);
      const ang=Math.atan2(dx,dy)*180/Math.PI;   // 正 = 顺时针
      bar.style.setProperty('--len', len.toFixed(1)+'px');
      bar.style.setProperty('--hitZ', ang.toFixed(2)+'deg');
      bar.style.setProperty('--lift','0px');
      bar.style.setProperty('--dx','0px');
    });
  }
  window.__aimBars = aimBars;
  // 原来的"挪字模"校准不再需要：之后任何调用都改成按几何对准
  calibrateTypebars = function(){ aimBars(); };
  const go=()=>requestAnimationFrame(()=>requestAnimationFrame(aimBars));
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(go,200));
  else setTimeout(go,200);
  addEventListener('resize',()=>setTimeout(aimBars,150));
})();
</script>


<!-- ══════════════════════════════════════════════════════════

     真机：纸从滚筒后面绕上来，正在打的这一行贴着滚筒；回车时滚筒转一格，整张纸往上卷一行。
     刚放进去的纸只露出页头和第一行，越打，纸往上露出得越多。
     · 纸的上沿与页头随行数上升；回车时文字、格线、页头整张纸一起上卷（带滚动动画）
     · 格线只随换行移动（以前每打一个字就漂一点）
     · 贴着滚筒的一段有弧面阴影（纸绕着滚筒弯过去），纸上沿有卷曲阴影
     ══════════════════════════════════════════════════════════ -->
<style id="enh-roll">
#paper{transition:clip-path .3s cubic-bezier(.3,.9,.3,1)}
/* 只有一张纸：去掉居中那条单独的"垂纸"（看上去像第二张纸） */

#text-scroll.rolling,.paper-rules.rolling{transition:transform .3s cubic-bezier(.3,.9,.3,1) !important}
/* 贴着滚筒：纸绕着圆柱弯过去，越往下越暗、越扁 */
.paper-curl{
  position:absolute;left:0;right:0;bottom:0;height:34px;z-index:5;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.18) 30%,rgba(90,64,30,.0) 46%,rgba(70,50,25,.14) 78%,rgba(40,28,14,.32) 100%);
  mix-blend-mode:multiply;
}
/* 纸的上沿：微微向后卷的阴影 */
.paper-top-curl{
  position:absolute;left:0;right:0;height:14px;z-index:6;pointer-events:none;
  background:linear-gradient(180deg,rgba(70,50,25,.22),rgba(255,255,255,.25) 35%,rgba(255,255,255,0));
  transition:top .3s cubic-bezier(.3,.9,.3,1);
}
.paper-top-shadow{
  position:absolute;left:0;right:0;height:10px;z-index:21;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28));
  transition:top .3s cubic-bezier(.3,.9,.3,1);
}
</style>
<script id="enh-roll-script">
(function(){
  const $$=id=>document.getElementById(id);
  const LH=24, HEADROOM=58;
  let lastLines=-1;
  function ensure(){
    const paper=$$('paper'); if(!paper) return null;
    let curl=paper.querySelector('.paper-curl');
    if(!curl){ curl=document.createElement('div'); curl.className='paper-curl'; paper.appendChild(curl); }
    let tc=paper.querySelector('.paper-top-curl');
    if(!tc){ tc=document.createElement('div'); tc.className='paper-top-curl'; paper.appendChild(tc); }
    const wrap=paper.parentElement;
    let ts=wrap && wrap.querySelector('.paper-top-shadow');
    if(wrap && !ts){ ts=document.createElement('div'); ts.className='paper-top-shadow'; wrap.appendChild(ts); }
    return {paper, tc, ts};
  }
  function updateSheet(){
    const e=ensure(); if(!e) return;
    const {paper, tc, ts}=e;
    const H=paper.clientHeight;
    const lines=(S.text.match(/\n/g)||[]).length;
    // 纸的上沿：打字行（纸底那一行）往上 = 页头的余量 + 已打的行数
    const top=Math.max(0, (H - LH) - HEADROOM - lines*LH);
    paper.style.clipPath = `inset(${top}px 0 0 0)`;
    const head=paper.querySelector('.paper-head');
    if(head) head.style.setProperty('top', (top+12)+'px', 'important');
    tc.style.top = top+'px';
    if(ts){ ts.style.top=(paper.offsetTop + top - 10)+'px'; ts.style.display = top>0 ? '' : 'none'; }
    // 格线与文字行对齐（行底），只随换行移动
    const rules=$$('paper-rules');
    if(rules) rules.style.backgroundPosition = `0 ${(H % LH)}px`;
    // 换行：整张纸往上卷一行
    if(lastLines>=0 && lines>lastLines){
      const ts2=$$('text-scroll');
      [ts2, rules].forEach(el=>{
        if(!el) return;
        el.classList.remove('rolling');
        el.style.transform=`translateY(${LH}px)`;
        void el.offsetWidth;
        el.classList.add('rolling');
        el.style.transform='translateY(0)';
      });
    }
    lastLines=lines;
  }
  // 每次重画后更新纸的位置
  const _render=render;
  render=function(f){ _render(f); updateSheet(); };
  // 滚筒每个字只微转，不再拖着格线漂
  nudgePlaten=function(){ const p=$$('platen'); if(!p) return; platenAngle+=0.55; p.style.setProperty('--roll', platenAngle); };
  // 换行：滚筒转一格（纸的上卷由 updateSheet 完成）
  feedLine=function(){ const p=$$('platen'); if(!p) return; platenAngle+=6; p.style.setProperty('--roll', platenAngle); };
  const go=()=>{ lastLines=-1; updateSheet(); };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(go,50));
  else setTimeout(go,50);
  addEventListener('resize',()=>setTimeout(updateSheet,100));
})();
</script>

(function(){
  const $$=id=>document.getElementById(id);
  function build(){
    const hinge=$$('hinge');
    if(hinge && !hinge.querySelector('.card-holder')){
      const rb=document.createElement('div'); rb.className='hinge-ribbon'; rb.id='hinge-ribbon';
      const ch=document.createElement('div'); ch.className='card-holder';
      hinge.append(rb, ch);
    }
    const car=$$('carriage');
    if(car && !car.querySelector('.carriage-cover')){
      const cv=document.createElement('div'); cv.className='carriage-cover';
      const el=document.createElement('div'); el.className='carriage-end l';
      const er=document.createElement('div'); er.className='carriage-end r';
      car.prepend(cv); car.append(el, er);
    }
  }
  /* 色带升降：字锤起摆时抬起，落纸后放下 */
  const _lift = liftRibbon;
  liftRibbon = function(){
    try{ _lift(); }catch(e){}
    const rb=$$('hinge-ribbon'); if(!rb) return;
    rb.classList.toggle('red', S.ink==='red');
    if(S.ink==='strike') return;   // 无色带档：色带不抬
    rb.classList.add('lift');
    clearTimeout(rb._t);
    rb._t=setTimeout(()=>rb.classList.remove('lift'), 150);
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build);
  else build();
})();
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 真实字锤篮（从外侧翻转）· 功能键行 · 可拨动的色带拨杆与滚筒旋钮 · 立体感
     ══════════════════════════════════════════════════════════ -->
<style id="enh-mech2">
/* ── 字锤篮：枢轴在以击打点为圆心的弧形导轨上；平时向外平躺，击打时绕枢轴向外侧翻转 180° 落到击打点 ── */
#segment{visibility:hidden !important}
#basket2{position:absolute;inset:0;pointer-events:none;z-index:130;overflow:visible}
#basket2 .tb{
  position:absolute;width:4px;transform-origin:50% 0;transform-style:preserve-3d;
  will-change:transform;
}
#basket2 .tb .rod{
  position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(90deg,#3d464a,#f4f8f9 42%,#aeb9be 70%,#4f5a5f);
  box-shadow:0 0 0 .5px rgba(0,0,0,.6),0 3px 4px rgba(0,0,0,.45);
}
#basket2 .tb .slug{
  position:absolute;left:50%;bottom:-9px;width:16px;height:18px;margin-left:-8px;
  border-radius:2px;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 "Courier New",monospace;color:#1a1c1d;
  background:linear-gradient(180deg,#fbfbf6,#cfcfc6 55%,#9fa09a);
  box-shadow:0 0 0 .6px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.45);
  backface-visibility:visible;
}
#basket2 .tb.hit{z-index:5}
#basket2 .tb.hit .slug{background:linear-gradient(180deg,#fffdf2,#ffe9b0);box-shadow:0 0 12px rgba(255,214,120,.9),0 2px 3px rgba(0,0,0,.5)}
#basket2 svg.seg{position:absolute;left:0;top:0;overflow:visible}

/* ── 功能键行与 SHIFT LOCK ── */
.krow.r0{margin-bottom:calc(var(--k) * 0.12);gap:calc(var(--k) * 0.3) !important}
.fkey{position:relative;cursor:pointer;touch-action:none;flex:0 0 auto}
.fkey .cap{
  width:auto !important;min-width:calc(var(--k) * 1.25);height:calc(var(--k) * 0.62) !important;
  padding:0 calc(var(--k) * 0.18);border-radius:calc(var(--k) * 0.18) !important;
  font:700 calc(var(--k) * 0.2)/1.05 "Helvetica Neue",Helvetica,Arial,sans-serif !important;
  text-align:center;white-space:pre;letter-spacing:.3px;
}
.fkey.lock .cap{height:calc(var(--k) * 0.9) !important;min-width:calc(var(--k) * 0.95)}
.fkey.lock.on .cap{transform:translateY(calc(var(--k) * .07)) !important;box-shadow:0 calc(var(--k) * .02) 0 var(--h3-mint-sh),0 2px 4px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.35) !important}

/* ── 立体感：键帽更厚（侧壁），凹槽更深，机身倒角 ── */
.key .cap{
  box-shadow:
    0 calc(var(--k) * .05) 0 #93d6b6,
    0 calc(var(--k) * .1) 0 var(--h3-mint-sh),
    0 calc(var(--k) * .13) calc(var(--k) * .02) #33503f,
    0 calc(var(--k) * .2) calc(var(--k) * .22) rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 calc(var(--k) * -.06) calc(var(--k) * .12) rgba(40,90,66,.25) !important;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%),
    linear-gradient(180deg,var(--h3-mint-hi) 0%,var(--h3-mint) 50%,var(--h3-mint-lo) 100%) !important;
}
.key.down .cap,.fkey.down .cap{transform:translateY(calc(var(--k) * .09)) !important;box-shadow:0 calc(var(--k) * .02) 0 var(--h3-mint-sh),0 2px 4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.6) !important}
.key-platen{box-shadow:inset 0 10px 18px rgba(0,0,0,.9),inset 0 -4px 8px rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.35) !important}
.carriage-cover{box-shadow:0 10px 22px rgba(30,45,38,.45),0 2px 4px rgba(30,45,38,.3),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -10px 16px rgba(40,55,48,.25),inset 6px 0 10px rgba(255,255,255,.18),inset -6px 0 10px rgba(40,55,48,.18) !important}
.mech-face::before{filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)) drop-shadow(0 -1px 0 rgba(255,255,255,.35)) !important}

/* ── 色带拨杆（实体拨动开关）：上 = BLACK，下 = RED ── */
.ribbon-selector{display:none !important}
.ink-switch{
  position:absolute;left:14px;top:6px;z-index:40;width:74px;height:62px;cursor:pointer;touch-action:none;
}
.ink-switch .plate{
  position:absolute;left:0;top:0;width:30px;height:62px;border-radius:15px;
  background:linear-gradient(180deg,#3a403d,#1c201e);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.45),0 -1px 0 rgba(0,0,0,.3);
}
.ink-switch .slot{position:absolute;left:12px;top:10px;width:6px;height:42px;border-radius:3px;background:#0c0e0d;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.ink-switch .lever{
  position:absolute;left:3px;top:4px;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#ffffff,#d4dde1 40%,#8f9ca2 75%,#55626a);
  box-shadow:0 4px 6px rgba(0,0,0,.55),inset 0 -2px 3px rgba(0,0,0,.25);
  transition:top .12s cubic-bezier(.3,1.6,.5,1);
}
.ink-switch.red .lever{top:34px}
.ink-switch .lbl{position:absolute;left:36px;font:700 10px/1 "Helvetica Neue",sans-serif;letter-spacing:1px;padding:4px 6px;border-radius:5px;opacity:.55;transition:opacity .15s}
.ink-switch .lbl.b{top:8px;color:#e8e6dc;background:#2a2d2c}
.ink-switch .lbl.r{top:38px;color:#ffe2db;background:#a52a22}
.ink-switch:not(.red) .lbl.b,.ink-switch.red .lbl.r{opacity:1;box-shadow:0 0 0 1.5px rgba(255,255,255,.8)}

/* ── 滚筒旋钮：可以拧（竖纹随转动） ── */
#carriage .platen .knob{cursor:ns-resize;touch-action:none}
#carriage .platen #knob-r{background:
    repeating-conic-gradient(from var(--kr,0deg),rgba(40,90,66,.3) 0deg 6deg,transparent 6deg 12deg),
    radial-gradient(circle at 36% 30%,var(--h3-mint-hi),var(--h3-mint) 48%,var(--h3-mint-lo) 78%,var(--h3-mint-sh)) !important}
#carriage .platen #knob-l{background:
    repeating-conic-gradient(from var(--kr,0deg),rgba(0,0,0,.2) 0deg 7deg,transparent 7deg 14deg),
    radial-gradient(circle at 36% 30%,#f0f4f5 0%,#c3ced3 42%,#9aa8ae 68%,#6b787e 100%) !important}
</style>
<script id="enh-mech2-script">
(function(){
  const $$=id=>document.getElementById(id);
  const DEG=Math.PI/180;
  /* ── 自定义音效：拨杆咔哒（两段金属声）、旋钮棘轮（细） ── */
  function click2(vol){
    const ctx=S.audio; if(!ctx) return; const t=ctx.currentTime;
    [[0,2600,.35],[0.035,1500,.25]].forEach(([dt,f,g])=>{
      const s=ctx.createBufferSource(); s.buffer=noiseBuf(ctx,0.03,0.06);
      const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=4;
      const gn=ctx.createGain(); gn.gain.setValueAtTime(g*(vol||1),t+dt); gn.gain.exponentialRampToValueAtTime(.001,t+dt+.05);
      s.connect(bp); bp.connect(gn); gn.connect(ctx.destination); s.start(t+dt);
    });
  }
  window.__click2=click2;

  /* ═════ 1. 字锤篮（从外侧翻转） ═════ */
  let bars=[], C=null, R=100;
  function buildBasket(){
    const app=$$('app'); if(!app) return;
    let layer=$$('basket2');
    if(!layer){ layer=document.createElement('div'); layer.id='basket2'; app.appendChild(layer); }
    const pp=$$('print-point'), caret=document.querySelector('#typed .caret');
    if(!pp||!caret) return;
    const ar=app.getBoundingClientRect();
    const pr=pp.getBoundingClientRect(), cr=caret.getBoundingClientRect();
    C={x:(pr.left+pr.right)/2-ar.left, y:cr.bottom-9-ar.top};
    // 弧半径：让平躺的字锤落在机构窗里
    const mh=$$('machine-half').getBoundingClientRect();
    R=Math.max(70, Math.min(118, (mh.top+200-ar.top - C.y)/2.15));
    layer.style.perspective='900px';
    layer.style.perspectiveOrigin=`${C.x}px ${C.y}px`;
    layer.innerHTML='';
    // 弧形导轨（枢轴座）+ 外圈托垫
    const span=52;
    const arc=(r)=>{ const a0=(-span-4)*DEG,a1=(span+4)*DEG; const x0=C.x+r*Math.sin(a0),y0=C.y+r*Math.cos(a0),x1=C.x+r*Math.sin(a1),y1=C.y+r*Math.cos(a1); return `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x0} ${y0}`; };
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','seg'); svg.setAttribute('width',ar.width); svg.setAttribute('height',ar.height);
    svg.innerHTML=`<path d="${arc(R)}" fill="none" stroke="#1a1d1c" stroke-width="13" stroke-linecap="round"/>
      <path d="${arc(R)}" fill="none" stroke="url(#segg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="1.4 2.6"/>
      <path d="${arc(R*2+6)}" fill="none" stroke="#2a2e2c" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <defs><linearGradient id="segg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9eef0"/><stop offset="1" stop-color="#7b878c"/></linearGradient></defs>`;
    layer.appendChild(svg);
    bars=[];
    const n=BAR_CHARS.length;
    BAR_CHARS.forEach((ch,i)=>{
      const a=-span+(2*span*i/(n-1));
      const px=C.x+R*Math.sin(a*DEG), py=C.y+R*Math.cos(a*DEG);
      const el=document.createElement('div'); el.className='tb';
      el.style.left=(px-2)+'px'; el.style.top=py+'px'; el.style.height=R+'px';
      const rest=`rotateZ(${-a}deg) rotateX(-28deg)`;
      el.style.transform=rest;
      el.innerHTML=`<div class="rod"></div><div class="slug" style="transform:rotateX(180deg) rotateZ(${a}deg)">${ch}</div>`;
      layer.appendChild(el);
      bars.push({ch, el, a, rest});
    });
  }
  /* 击打：绕枢轴向外侧翻转 180°（经过竖直朝向观者），字模落到击打点，再翻回 */
  strikeTypebar=function(ch){
    if(!bars.length) return;
    const k=ch.toUpperCase();
    let b=bars.find(x=>x.ch===k);
    if(!b){ let best=1e9; bars.forEach(x=>{ const d=Math.abs(x.ch.charCodeAt(0)-k.charCodeAt(0)); if(d<best){best=d;b=x;} }); }
    if(!b) return;
    const hitT=`rotateZ(${-b.a}deg) rotateX(180deg)`;
    b.el.classList.add('hit');
    b.el.getAnimations().forEach(x=>x.cancel());
    // 逐段缓动（整段缓动会扭曲时间轴，84ms 时还没翻到纸上）：快速扬起 → 84ms 扣到纸面 → 弹回平躺
    const an=b.el.animate([
      {transform:b.rest, easing:'cubic-bezier(.4,0,.9,.6)'},
      {transform:`rotateZ(${-b.a}deg) rotateX(95deg)`, offset:.15, easing:'cubic-bezier(.2,.6,.4,1)'},
      {transform:hitT, offset:.28, easing:'linear'},
      {transform:`rotateZ(${-b.a}deg) rotateX(172deg)`, offset:.40, easing:'cubic-bezier(.3,.1,.3,1)'},
      {transform:b.rest}
    ],{duration:300});
    an.onfinish=()=>b.el.classList.remove('hit');
  };
  calibrateTypebars=function(){ buildBasket(); };

  /* ═════ 2. 功能键行 + SHIFT LOCK ═════ */
  S.tabs=S.tabs||new Set();
  function fkey(label, onPress, cls){
    const k=document.createElement('div'); k.className='key fkey'+(cls?' '+cls:'');
    const cap=document.createElement('div'); cap.className='cap'; cap.textContent=label; k.appendChild(cap);
    k.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); k.classList.add('down'); setTimeout(()=>k.classList.remove('down'),120); onPress(k); });
    return k;
  }
  function buildFkeys(){
    const deck=$$('deck'), kr1=$$('kr1'); if(!deck||!kr1||$$('kr0')) return;
    const row=document.createElement('div'); row.className='krow r0'; row.id='kr0';
    row.append(
      fkey('BACK\nSPACE',()=>{ doBackspace(); }),
      fkey('TAB SET',()=>{ S.tabs.add(S.col); click2(); toast('制表位 · 第 '+S.col+' 格'); }),
      fkey('TAB\nCLEAR',()=>{ S.tabs.delete(S.col); click2(); toast('清除此处制表位'); }),
      fkey('ALL\nCLEAR',()=>{ S.tabs.clear(); click2(); toast('清除全部制表位'); }),
      fkey('MAR.\nREL.',()=>{ S.marRel=true; S.lineLimit=Math.max(S.lineLimit, 999); click2(.8); toast('边距释放（本行）'); }),
      fkey('TAB',()=>{
        const stops=[...S.tabs].filter(c=>c>S.col).sort((a,b)=>a-b);
        if(!stops.length){ sfx('ratchet',.5); toast('没有制表位'); return; }
        const n=stops[0]-S.col; sfx('ratchet',.6); enqueue(' '.repeat(n));
      })
    );
    deck.insertBefore(row, kr1);
    const kr3=$$('kr3');
    if(kr3){
      const lock=fkey('SHIFT\nLOCK',(k)=>{ S.caps=!S.caps; k.classList.toggle('on',S.caps); if(typeof elLampCaps!=='undefined') elLampCaps.classList.toggle('on',S.caps); click2(1.1); },'lock');
      kr3.insertBefore(lock, kr3.firstChild);
    }
  }
  // 换行时取消边距释放（真机：只对当前行有效）
  const _ret=doReturn;
  doReturn=function(){ if(S.marRel){ S.marRel=false; S.lineLimit=S._lineLimit0||26; } _ret(); };

  /* ═════ 3. 色带拨杆（上 BLACK / 下 RED），拖动或轻点拨动，带咔哒声 ═════ */
  function buildInkSwitch(){
    const host=document.querySelector('.ribbon-selector'); if(!host || document.querySelector('.ink-switch')) return;
    const sw=document.createElement('div'); sw.className='ink-switch'; sw.title='色带拨杆';
    sw.innerHTML='<div class="plate"></div><div class="slot"></div><div class="lever"></div><span class="lbl b">BLACK</span><span class="lbl r">RED</span>';
    host.parentElement.appendChild(sw);
    const set=(ink)=>{ if(S.ink===ink) return; applyInk(ink); sw.classList.toggle('red',ink==='red'); click2(1.2); if(navigator.vibrate) navigator.vibrate(8); toast(ink==='red'?'红 色 带':'黑 色 带'); };
    sw.classList.toggle('red',S.ink==='red');
    let y0=null, moved=false;
    sw.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); initAudio(); y0=e.clientY; moved=false; try{sw.setPointerCapture(e.pointerId);}catch(_){} });
    sw.addEventListener('pointermove',e=>{ if(y0===null) return; const dy=e.clientY-y0; if(dy>12){ set('red'); moved=true; y0=e.clientY; } else if(dy<-12){ set('black'); moved=true; y0=e.clientY; } });
    sw.addEventListener('pointerup',()=>{ if(y0!==null && !moved) set(S.ink==='red'?'black':'red'); y0=null; });
    sw.addEventListener('pointercancel',()=>{ y0=null; });
  }

  /* ═════ 4. 滚筒旋钮：上下拧动，每格转滚筒 + 棘轮声；往前拧 = 空走一行，往回拧 = 退回空走的行 ═════ */
  let kAngle=0;
  function bindKnob(knob){
    if(!knob || knob._bound) return; knob._bound=true;
    let y0=null;
    knob.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); initAudio(); y0=e.clientY; try{knob.setPointerCapture(e.pointerId);}catch(_){} });
    knob.addEventListener('pointermove',e=>{
      if(y0===null) return;
      const dy=e.clientY-y0;
      if(Math.abs(dy)<14) return;
      const dir = dy<0 ? 1 : -1;     // 往上拧 = 纸往上走
      y0=e.clientY;
      kAngle+=dir*30;
      document.querySelectorAll('#carriage .platen .knob').forEach(k=>k.style.setProperty('--kr',kAngle+'deg'));
      platenAngle+=dir*6; const p=$$('platen'); if(p) p.style.setProperty('--roll',platenAngle);
      sfx('ratchet',.55); if(navigator.vibrate) navigator.vibrate(4);
      if(S.returnAnimating) return;
      if(dir>0){
        // 空走一行（字车不回位：新行先补到当前列）
        const col=S.col;
        S.text+='\n'+' '.repeat(col); S.line++;
        render();
      }else{
        // 往回拧：只退回末尾的空行
        const m=S.text.match(/\n( *)$/);
        if(m){ S.text=S.text.slice(0, S.text.length-m[0].length); S.line=Math.max(0,S.line-1); render(); }
      }
    });
    const end=()=>{ y0=null; };
    knob.addEventListener('pointerup',end); knob.addEventListener('pointercancel',end);
  }

  function setup(){
    S._lineLimit0=S.lineLimit;
    buildFkeys(); buildInkSwitch();
    bindKnob($$('knob-r')); bindKnob($$('knob-l'));
    buildBasket();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(setup,320));
  else setTimeout(setup,320);
  addEventListener('resize',()=>setTimeout(buildBasket,200));
})();
</script>


<!-- ══════════════════════════════════════════════════════════
     增强（Claude）· 立体深度（参考 Hermes 3000 宣传图 + 部件图）
     · 键盘整体向后倾（透视），后排更高更远；每个键帽下有黑色键杆，前排压住后排
     · 机身：圆角侧壁 + 前沿厚唇（空格键下方那条浅色厚边），前盖在键盘上投影
     · 前盖：HERMES 3000 镀铬铭牌居中；右侧竖槽色带拨杆（#40），左侧竖槽触感拨杆（#5）
     · 底排：Z 排两端方形 Shift（#1/#45），下方一根长空格键（#46）；真机没有回车键
     ══════════════════════════════════════════════════════════ -->
<style id="enh-depth">
/* ── 机身厚度：两侧圆角壁 + 前沿厚唇 ── */
#machine-half{
  box-shadow:
    inset 14px 0 18px -8px rgba(255,255,255,.28),
    inset -14px 0 18px -8px rgba(30,45,38,.35) !important;
}
.h3-lip{
  position:relative;flex:0 0 auto;height:30px;margin:2px 10px 6px;z-index:6;pointer-events:none;
  border-radius:6px 6px 22px 22px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 30%),
    linear-gradient(180deg,#c9d6d0 0%,#b3c4bc 45%,#92a69d 80%,#6f837a 100%);
  box-shadow:0 -2px 0 rgba(0,0,0,.35),0 8px 14px rgba(20,32,26,.55),inset 0 -3px 5px rgba(40,55,48,.35);
}
.h3-lip::after{ /* 唇边下方的阴影槽 */
  content:"";position:absolute;left:6%;right:6%;bottom:-6px;height:6px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,.45),transparent 70%);
}

/* ── 键盘：整体向后倾斜（梯形透视），后排更高 ── */
#deck{
  transform:perspective(1100px) rotateX(16deg);transform-origin:50% 100%;
  transform-style:flat;
}
.key-platen{border-radius:18px 18px 10px 10px !important}
/* 前排压住后排（后排的键杆藏在前排键帽后面） */
#kr0{z-index:2;position:relative}#kr1{z-index:3;position:relative}#kr2{z-index:4;position:relative}
#kr3{z-index:5;position:relative}#kr4{z-index:6;position:relative}#kr5{z-index:7;position:relative}
/* 键杆：键帽下方的黑色金属杆，后排更长（键位分层） */

(function(){

  function rebuildBottom(){

    const sh=[...kr5.querySelectorAll('.key.k-shift')];

  function addLip(){
    const deck=$$('deck'); if(!deck||document.querySelector('.h3-lip')) return;
    const lip=document.createElement('div'); lip.className='h3-lip';
    deck.after(lip);
  }
  /* 触感调节拨杆（左侧竖槽，三档：轻 / 中 / 重）—— 改变击打声的力度 */
  S.touch = S.touch || 2;
  const MULT={1:.6,2:1,3:1.4};
  const _sfx=sfx;
  sfx=function(kind,vol){ const v=(vol===undefined?1:vol); return _sfx(kind,(kind==='strike'||kind==='space')? v*MULT[S.touch] : v); };
  function buildTouch(){
    const md=$$('mech-deck'); if(!md||md.querySelector('.touch-lever')) return;
    const t=document.createElement('div'); t.className='touch-lever'; t.title='触感调节（拖动 / 轻点）';
    t.innerHTML='<div class="plate"></div><div class="slot"></div><div class="lever"></div><div class="marks"><b data-v="3">HEAVY</b><b data-v="2">TOUCH</b><b data-v="1">LIGHT</b></div>';
    md.appendChild(t);
    const lever=t.querySelector('.lever');
    const pos=v=>({3:4,2:23,1:42})[v];
    const paint=()=>{ lever.style.top=pos(S.touch)+'px'; t.querySelectorAll('.marks b').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.touch)); };
    const set=v=>{ v=Math.max(1,Math.min(3,v)); if(v===S.touch) return; S.touch=v; paint(); (window.__click2||(()=>{}))(1.1); if(navigator.vibrate) navigator.vibrate(6); toast('触感：'+({1:'轻',2:'中',3:'重'})[v]); };

    t.addEventListener('pointercancel',()=>{ y0=null; });

  else setTimeout(setup,400);
})();

<script id="enh-case-script">
(function(){
  const $$=id=>document.getElementById(id);

  const lid=$$('hermes-lid');

    const a=document.createElement('div'); a.className='lid-latch l';

     · Duo 上：上屏就是箱盖本身，翻开多少度由真实铰链角度决定，这里只负责光影（内衬明暗、箱盖投在机器上的影子）
       和声音；合上 = 关箱，翻开 = 开箱。
     · 没有铰链的屏幕：虚拟箱盖绕折痕从 0°（盖在箱底上，看到外壳）翻到 180°（平放在上半屏，看到内衬），

  function hingeY(){

    o.connect(og); og.connect(ctx.destination); o.start(t); o.stop(t+.2);

    const ctx=S.audio; if(!ctx) return; const t=ctx.currentTime;
