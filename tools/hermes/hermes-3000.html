<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hermes 3000 — Typewriter Duo</title>
<style>
/* ══════════════════════════════════════════════════════════
   HERMES 3000 — 机械拟物打字机
   折叠屏布局：上半屏=字车(纸/滚筒/标尺)  下半屏=机构(字锤篮/字锤/色带/键盘)
   ══════════════════════════════════════════════════════════ */

:root{
  /* 机身漆色 —— 岁月感薄荷绿 */
  --body-1:#8fbfae;
  --body-2:#6ea694;
  --body-3:#4e8574;
  --body-4:#3a6a5c;
  --body-dark:#2b5047;
  /* 铬件 */
  --chrome-hi:#f2f6f7;
  --chrome:#c3ced3;
  --chrome-mid:#9aa8ae;
  --chrome-lo:#6b787e;
  --chrome-dk:#414d52;
  /* 纸张 */
  --paper:#f4eee0;
  --paper-2:#e9e0cc;
  --paper-line:#cfc3a6;
  --paper-red:#c07a7a;
  /* 墨色 */
  --ink:#1c1611;
  --ink-red:#96231f;
  /* 键帽 */
  --cap-hi:#fdfaf2;
  --cap:#efe8d8;
  --cap-mid:#ddd3bd;
  --cap-lo:#bdb096;
  --cap-sh:#9c8f74;
  /* 其他 */
  --rubber:#2b2724;
  --brass-1:#d9b869;
  --brass-2:#a8873f;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;overflow:hidden;background:#15100c;
  font-family:"Helvetica Neue",-apple-system,sans-serif;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* 机身通用金属漆面 */
.paint{
  background:
    linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 22%),
    linear-gradient(90deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 88%,rgba(0,0,0,.26) 100%),
    linear-gradient(180deg,var(--body-1) 0%,var(--body-2) 45%,var(--body-3) 100%);
}
.paint-inner{
  background:
    linear-gradient(180deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 30%),
    radial-gradient(ellipse 120% 90% at 50% 110%,var(--body-4) 0%,transparent 65%),
    linear-gradient(180deg,var(--body-2) 0%,var(--body-3) 60%,var(--body-4) 100%);
}
/* 漆面磨痕 */
.wear{
  background-image:
    radial-gradient(circle at 12% 78%,rgba(255,255,255,.07) 0 2px,transparent 3px),
    radial-gradient(circle at 47% 22%,rgba(0,0,0,.10) 0 1px,transparent 2px),
    radial-gradient(circle at 82% 64%,rgba(255,255,255,.06) 0 3px,transparent 4px),
    radial-gradient(circle at 28% 46%,rgba(0,0,0,.08) 0 2px,transparent 3px);
  opacity:.85;
}
/* 细密划痕 */
.scratches{
  background-image:
    repeating-linear-gradient(74deg,rgba(255,255,255,.045) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(-58deg,rgba(0,0,0,.05) 0 1px,transparent 1px 11px);
  opacity:.6;
}

#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ══════════════ 上半屏：字车 / 纸 / 滚筒 ══════════════ */
#carriage-half{
  flex:0 0 50%;
  position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 70% at 50% 108%,#1d3b34 0%,transparent 70%),
    linear-gradient(180deg,#5f9684 0%,#4a8070 55%,#356254 100%);
  padding-top:var(--safe-t);
}
/* 顶部铬饰条 */
/* 顶栏：铬制横梁 + 丝印 logo + 左右色带卷轴（图纸标志特征） */
.top-chrome{
  position:absolute;top:0;left:0;right:0;height:34px;z-index:60;
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 34%,var(--chrome-mid) 62%,var(--chrome-lo) 100%);
  box-shadow:0 2px 7px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;
}
/* 丝印 logo */
.brand-script{
  font-family:"Brush Script MT","Snell Roundhand","Segoe Script",cursive;
  font-size:15px;color:#3d4a50;letter-spacing:.4px;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
  user-select:none;
}
/* 顶栏左右卷轴组 */
.chrome-spool{
  display:flex;align-items:center;gap:3px;
}
.chrome-spool .spool{
  position:relative;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#3d3a36,#16130f 62%,#000);
  box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.18);
}
.chrome-spool .spool::before{
  content:'';position:absolute;inset:3px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#241a14 0deg 7deg,#3d2c20 7deg 14deg);
}
.chrome-spool .lever{
  width:11px;height:2.5px;border-radius:2px;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo));
  box-shadow:0 1px 2px rgba(0,0,0,.5);
}

/* —— 字车总成（滚筒+纸+标尺+纸挡板），随打字左右移动 —— */
#carriage{
  position:absolute;inset:0;
  transition:transform .06s linear;
  will-change:transform;
}

/* 滚筒（Platen） */
.platen{
  position:absolute;top:42px;left:6%;right:6%;height:23px;
  border-radius:13px;
  --roll:0;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px) 0 calc(var(--roll) * 1px) / 100% 4px,
    repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#4a4540 0%,#6b6560 22%,#38332f 55%,#5a5550 80%,#2e2a26 100%);
  box-shadow:
    0 3px 8px rgba(0,0,0,.65),
    inset 0 2px 3px rgba(255,255,255,.14),
    inset 0 -3px 5px rgba(0,0,0,.6);
  z-index:30;
}
/* 滚筒橡胶高光 */
.platen::before{
  content:'';position:absolute;left:2%;right:2%;top:3px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32) 18%,rgba(255,255,255,.42) 50%,rgba(255,255,255,.3) 82%,transparent);
}
/* 滚筒齿轮咬合（后端棘轮可见） */
.platen-gear{
  position:absolute;right:-13px;top:50%;transform:translateY(-50%);
  width:15px;height:20px;border-radius:3px;
  background:
    repeating-linear-gradient(90deg,var(--chrome-mid) 0 2px,var(--chrome-lo) 2px 4px);
  box-shadow:1px 0 3px rgba(0,0,0,.6);
  z-index:31;
}
/* 滚筒旋钮（左右，滚花） */
.knob{
  position:absolute;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;z-index:32;cursor:pointer;
  background:
    radial-gradient(circle at 36% 32%,#f0f4f5 0%,var(--chrome) 42%,var(--chrome-mid) 68%,var(--chrome-lo) 100%);
  box-shadow:
    0 3px 7px rgba(0,0,0,.65),
    inset 0 1px 1px rgba(255,255,255,.8),
    inset 0 -2px 3px rgba(0,0,0,.35);
}
.knob::before{ /* 滚花 */
  content:'';position:absolute;inset:3px;border-radius:50%;
  background:repeating-conic-gradient(rgba(0,0,0,.22) 0deg 4deg,transparent 4deg 9deg);
}
.knob::after{ /* 中心凹槽 */
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--chrome-lo),var(--chrome-dk));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
.knob:active{filter:brightness(.9)}
#knob-l{left:-16px}
#knob-r{right:-16px}

/* 标尺（Scale plate） */
.scale-plate{
  position:absolute;top:64px;left:6%;right:6%;height:15px;z-index:29;
  background:linear-gradient(180deg,#e6e2d6,#c9c3b2 55%,#a9a494);
  border-radius:2px;
  box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.55);
  overflow:hidden;
}
.scale-plate::before{ /* 刻度 */
  content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(90deg,rgba(40,35,25,.55) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(90deg,rgba(40,35,25,.75) 0 1px,transparent 1px 35px);
  background-position:0 100%;
  background-size:auto 5px,auto 8px;
  background-repeat:repeat-x;
  opacity:.65;
}
.scale-nums{
  position:absolute;inset:0;display:flex;justify-content:space-between;
  padding:0 3px;align-items:flex-start;
  font:600 6px/1 "Courier New",monospace;color:#3a3428;opacity:.7;
}
/* 标尺刻度带（真机：横向金属刻度尺，刻线自下而上，长短相间） */
.scale-plate .ticks{
  position:absolute;left:0;right:0;bottom:0;height:8px;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 1px;
}
.scale-plate .ticks i{
  display:block;width:1px;background:#4a4234;
  opacity:.62;
}
.scale-plate .ticks i.maj{height:8px;opacity:.85;width:1.2px}
.scale-plate .ticks i.mid{height:5px;opacity:.7}
.scale-plate .ticks i.min{height:3px;opacity:.55}
/* 标尺数字（真机：每 10 格标一个数字） */
.scale-nums span{
  position:relative;
  font:600 6.5px/1 "Courier New",monospace;
  color:#332d22;
  opacity:.82;
}
.scale-nums span::after{
  content:'';position:absolute;left:50%;top:8px;transform:translateX(-50%);
  width:1px;height:6px;background:#4a4234;opacity:.6;
}
/* 边距挡片（真机：可滑动的金属滑标） */
.margin-stop{
  position:absolute;top:0;width:11px;height:15px;z-index:6;
  background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 40%,var(--chrome-mid) 72%,var(--chrome-lo) 100%);
  border-radius:1.5px 1.5px 2px 2px;
  box-shadow:0 1px 3px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.85);
  cursor:ew-resize;touch-action:none;
}
.margin-stop::after{
  content:'';position:absolute;left:50%;top:3px;transform:translateX(-50%);
  width:3px;height:8px;border-radius:1px;
  background:linear-gradient(180deg,var(--chrome-dk),#151515);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.8);
}
/* 挡片顶部的红漆标记 */
.margin-stop::before{
  content:'';position:absolute;left:1px;right:1px;top:0;height:2px;
  background:#b5342c;border-radius:1.5px 1.5px 0 0;
}
.margin-stop.left{left:2px}
.margin-stop.right{right:2px}
.margin-stop.dragging{filter:brightness(1.15)}

/* 纸台（Paper table，铬制折叠臂） */
/* ═══════ 张开的铬制纸台臂（参考图：扁平金属板，带卷边与铆钉，向外斜张） ═══════ */
.paper-arm{
  position:absolute;top:90px;height:9px;z-index:14;
  border-radius:2px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 26%),
    linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 40%,var(--chrome-mid) 72%,var(--chrome-lo) 100%);
  box-shadow:
    0 4px 9px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 1px rgba(0,0,0,.3);
}
/* 卷边（真机：纸台臂末端向上卷起的翻边） */
.paper-arm::after{
  content:'';position:absolute;top:-3px;height:4px;
  border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-mid));
  box-shadow:0 -1px 2px rgba(255,255,255,.4);
}
.paper-arm.l::after{right:2px;width:16px}
.paper-arm.r::after{left:2px;width:16px}
/* 铆钉（真机：臂上的固定铆钉） */
.paper-arm.l::before,
.paper-arm.r::before{
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,var(--chrome-hi),var(--chrome-lo));
  box-shadow:0 1px 1px rgba(0,0,0,.55),inset 0 0 1px rgba(0,0,0,.3);
}
.paper-arm.l::before{left:12px}
.paper-arm.r::before{right:12px}
.paper-arm.l{
  left:2px;width:78px;
  transform:rotate(-9deg);transform-origin:left center;
}
.paper-arm.r{
  right:2px;width:78px;
  transform:rotate(9deg);transform-origin:right center;
}
/* 纸台中央托板 */
.paper-table{
  position:absolute;top:92px;left:50%;transform:translateX(-50%);
  width:36%;height:8px;z-index:20;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 45%,var(--chrome-lo));
  border-radius:2px;
  box-shadow:0 3px 7px rgba(0,0,0,.55);
}

/* —— 纸张 —— */
.paper-wrap{
  position:absolute;top:98px;left:15%;right:15%;bottom:0;z-index:22;
}
.paper{
  position:absolute;inset:0;
  background:linear-gradient(178deg,var(--paper) 0%,var(--paper-2) 100%);
  will-change:transform;
  box-shadow:
    2px 0 7px rgba(0,0,0,.35),-2px 0 7px rgba(0,0,0,.35),
    0 6px 18px rgba(0,0,0,.3),
    inset 0 0 40px rgba(150,120,70,.09);
  overflow:hidden;
}
/* 横格（走纸时随滚筒平移） */
.paper-rules{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:repeating-linear-gradient(180deg,transparent 0 23px,var(--paper-line) 23px 24px);
  background-position:0 0;
  opacity:.42;
  transition:background-position .14s ease-out;
}
/* 左侧红边线 */
.paper::after{
  content:'';position:absolute;top:0;bottom:0;left:32px;width:1px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(190,80,80,.35) 5%,rgba(190,80,80,.35) 95%,transparent);
}
.paper-head{
  position:absolute;top:4px;left:38px;right:8px;z-index:4;
  display:flex;justify-content:space-between;
  font:400 8px/1 "Courier New",monospace;color:rgba(70,58,38,.45);
  letter-spacing:.4px;
}
/* 纸张纹理（纤维） */
.paper-grain{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(circle at 22% 30%,rgba(140,110,60,.05) 0 1px,transparent 2px),
    radial-gradient(circle at 68% 66%,rgba(140,110,60,.045) 0 1px,transparent 2px),
    radial-gradient(circle at 45% 82%,rgba(90,70,40,.05) 0 2px,transparent 3px);
}

/* 文本层 */
#text-layer{
  position:absolute;top:16px;left:38px;right:8px;bottom:0;z-index:2;
  overflow:hidden;
}
#text-scroll{position:absolute;left:0;right:0;bottom:0;}
#typed{
  font-family:"Courier New",Courier,monospace;
  font-size:13.5px;line-height:24px;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;
  letter-spacing:.1px;
}
#typed.red{color:var(--ink-red)}
/* 刚印上去的字：字模压印 + 墨迹晕开 */
.fresh{
  display:inline-block;
  position:relative;
  animation:ink-bleed .26s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes ink-bleed{
  0%{
    opacity:0;
    filter:blur(2.4px);
    transform:scale(1.34) translateY(-1px);
    text-shadow:0 0 6px rgba(0,0,0,.6);
  }
  55%{
    opacity:.9;
    filter:blur(.4px);
    transform:scale(.97) translateY(0);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:scale(1) translateY(0);
    text-shadow:0 .5px 0 rgba(255,255,255,.35);
  }
}
/* 字模压痕（纸被压出凹槽） */
.fresh::after{
  content:'';position:absolute;left:-1px;right:-1px;bottom:-.5px;height:1px;
  background:rgba(255,255,255,.28);
  border-radius:1px;
  animation:press-in .26s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes press-in{
  0%{opacity:0;transform:scaleY(2.4)}
  100%{opacity:1;transform:scaleY(1)}
}
/* 已打印的字符略微淡一些（越久越淡，像真墨水渗透） */
.aged{opacity:.82}
.red .fresh::after{background:rgba(255,255,255,.2)}
/* 光标 */
.caret{
  display:inline-block;width:8px;height:15px;vertical-align:text-bottom;
  background:var(--ink);opacity:.85;
  animation:blink 1s steps(1) infinite;
}
.red .caret{background:var(--ink-red)}
@keyframes blink{0%,50%{opacity:.85}51%,100%{opacity:0}}

/* ═══════ 压纸杆（Paper bail）—— 参考图：扁平铬杆 + 中央抬纸拨杆 + 滚花胶轮 ═══════ */
.paper-bail{
  position:absolute;top:92px;left:13%;right:13%;height:7px;z-index:26;
  background:
    linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 30%),
    linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 42%,var(--chrome-mid) 74%,var(--chrome-lo) 100%);
  border-radius:1px 1px 2px 2px;
  box-shadow:
    0 3px 7px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 1px rgba(0,0,0,.28);
}
/* 压纸杆中央的抬纸拨片（真机：可掀起的拨片，用于把纸塞进滚筒） */
.bail-lifter{
  position:absolute;left:50%;top:-1px;transform:translateX(-50%);
  width:26px;height:11px;z-index:3;
  background:linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 45%,var(--chrome-mid) 78%,var(--chrome-lo) 100%);
  border-radius:2px 2px 4px 4px;
  box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.9);
  cursor:pointer;
}
/* 拨片中央的槽口（真机：一字槽，用手指拨起） */
.bail-lifter::before{
  content:'';position:absolute;left:50%;top:3px;transform:translateX(-50%);
  width:13px;height:2.5px;border-radius:1.5px;
  background:linear-gradient(180deg,var(--chrome-dk),#1a1a1a);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.55);
}
/* 压纸杆下的黑橡胶条 */
.paper-bail::after{
  content:'';position:absolute;left:1%;right:1%;bottom:-2px;height:3px;border-radius:2px;
  background:linear-gradient(180deg,#3a3634,#1a1817);
  opacity:.9;
}
/* 压纸滚轮（真机：滚花橡胶轮，压住纸面） */
.bail-roller{
  position:absolute;bottom:-6px;width:24px;height:11px;border-radius:5.5px;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,#55504c 0%,#35312e 45%,#1c1a18 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.75),inset 0 1px 1px rgba(255,255,255,.22);
  z-index:2;
}
.bail-roller::before{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,var(--chrome-lo),var(--chrome-dk));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.75);
}
.bail-roller.l{left:13%}
.bail-roller.r{right:13%}

/* 机身受击微振（真机：整机会随击打轻微颤动） */
#machine-half.rumble{
  animation:machine-rumble .13s ease-out;
}
@keyframes machine-rumble{
  0%{transform:translate(0,0)}
  25%{transform:translate(.5px,.4px)}
  55%{transform:translate(-.35px,-.25px)}
  80%{transform:translate(.2px,.15px)}
  100%{transform:translate(0,0)}
}

/* 打字时纸张的机械振动（真机：击打力传递到纸面） */
.paper.shake{animation:paper-shake .13s ease-out}
@keyframes paper-shake{
  0%{transform:translate(0,0)}
  22%{transform:translate(.7px,-.4px)}
  48%{transform:translate(-.5px,.3px)}
  74%{transform:translate(.3px,.2px)}
  100%{transform:translate(0,0)}
}

/* 纸面边距参考线（真机：预印的红色边线，打字区左右界限） */
.paper-redline{
  position:absolute;top:0;bottom:0;width:1.5px;z-index:4;
  background:linear-gradient(180deg,rgba(176,58,54,0) 0%,rgba(176,58,54,.72) 5%,rgba(176,58,54,.72) 95%,rgba(176,58,54,0) 100%);
  box-shadow:0 0 2px rgba(176,58,54,.28);
  pointer-events:none;
}
.paper-redline.l{left:15%}
.paper-redline.r{right:15%}

/* 纸上的边缘磨损 */
.paper-edge{
  position:absolute;top:0;left:0;right:0;height:3px;z-index:4;
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent);
}

/* ══════════════ 铰链 ══════════════ */
#hinge{
  flex:0 0 20px;position:relative;z-index:100;
  background:
    repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.16) 3px 4px),
    linear-gradient(180deg,#2b2f31 0%,#4b5256 22%,#6d767b 45%,#545c60 62%,#343a3d 88%,#222628 100%);
  display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:0 -4px 10px rgba(0,0,0,.65),0 4px 10px rgba(0,0,0,.65);
}
.hinge-screw{
  width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,var(--chrome-hi),var(--chrome-mid) 55%,var(--chrome-dk));
  box-shadow:0 1px 2px rgba(0,0,0,.75),inset 0 1px rgba(255,255,255,.7);
}
.hinge-screw::after{
  content:'';position:absolute;
}
.hinge-plate{
  font:700 6.5px/1 "Helvetica Neue",sans-serif;letter-spacing:2.5px;
  color:rgba(210,220,225,.5);text-transform:uppercase;
  padding:2px 8px;border-radius:2px;
  background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(255,255,255,.06));
}

/* ══════════════ 下半屏：机构 + 键盘 ══════════════ */
#machine-half{
  flex:0 0 50%;position:relative;overflow:hidden;
  will-change:transform;
  background:
    linear-gradient(180deg,#3f6f61 0%,#2f5a4e 40%,#24483f 100%);
  padding-bottom:var(--safe-b);
  display:flex;flex-direction:column;
}
/* 面板划痕 */
#machine-half::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(63deg,rgba(255,255,255,.03) 0 1px,transparent 1px 9px),
    repeating-linear-gradient(-41deg,rgba(0,0,0,.06) 0 1px,transparent 1px 13px);
}

/* ══════════════════════════════════════════════════════════
   机构区 —— 镂空开窗（色带罩窗口，可见内部字锤篮）
   ══════════════════════════════════════════════════════════ */
.mech-deck{
  position:relative;flex:0 0 auto;height:140px;z-index:5;
  overflow:visible;
}

/* ═══════ 纸道（Paper chute）—— 真机：纸从滚筒垂下，穿过打字点再向上卷 ═══════ */
/* 垂纸：自机构窗顶沿垂下，下缘即"击打面" */
.paper-chute{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:170px;height:40px;z-index:11;
  /* 纸面在字锤后方，字模自前方探出敲击 */
  background:
    linear-gradient(180deg,var(--paper-2) 0%,var(--paper) 26%,var(--paper) 100%);
  box-shadow:
    -3px 0 8px rgba(0,0,0,.42),
    3px 0 8px rgba(0,0,0,.42),
    inset 0 -14px 20px rgba(150,120,70,.14),
    inset 0 1px 0 rgba(255,255,255,.5);
  border-radius:0 0 2px 2px;
  pointer-events:none;
}
/* 纸的顶沿：从上方滚筒垂下的过渡（略带卷曲阴影） */
.paper-chute::before{
  content:'';position:absolute;left:0;right:0;top:0;height:16px;
  background:linear-gradient(180deg,rgba(0,0,0,.34),transparent);
}
/* 纸面上的横格线（随走纸平移） */
.paper-chute .chute-rules{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(180deg,transparent 0 23px,var(--paper-line) 23px 24px);
  background-position:0 0;
  opacity:.4;
}
/* 纸的边缘暗部（真机：背光时纸边发暗） */
.paper-chute::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(0deg,rgba(120,95,55,.16),transparent);
}

/* 击打点（Printing point）—— 真机：字模顶端的字针正好抵在此处 */
.print-point{
  position:absolute;left:0;right:0;bottom:0;z-index:13;
  height:2px;
  background:linear-gradient(180deg,rgba(120,95,55,.32),rgba(90,70,40,.5));
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}
/* 击打瞬间：纸面被压出的凹痕（真机：纸有弹性，会短暂凹陷） */
.print-point.press{
  animation:print-press .16s ease-out;
}
@keyframes print-press{
  0%{transform:scaleY(1);opacity:.85}
  26%{transform:scaleY(2.4);opacity:1}
  100%{transform:scaleY(1);opacity:.85}
}
/* 落在纸上的墨迹（真机：字模压过，色带转印到纸上） */
.ink-dot{
  position:absolute;left:var(--ink-x,50%);bottom:0;z-index:14;
  width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,50%) scale(.2);
  filter:blur(.2px);
  background:radial-gradient(circle at 40% 35%,rgba(28,22,17,.95),rgba(28,22,17,.5) 62%,transparent 78%);
  opacity:0;pointer-events:none;
}
.ink-dot.go{animation:ink-strike .3s ease-out}
@keyframes ink-strike{
  0%{opacity:.9;transform:translate(-50%,50%) scale(.25)}
  40%{opacity:1;transform:translate(-50%,50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,50%) scale(1.5)}
}
/* 撞击火花（真机：字模与纸面接触瞬间的微光） */
.spark{
  position:absolute;left:var(--ink-x,50%);bottom:0;z-index:15;
  width:22px;height:22px;border-radius:50%;
  transform:translate(-50%,50%) scale(.3);
  background:radial-gradient(circle,rgba(255,246,214,.9),rgba(255,214,140,.35) 45%,transparent 72%);
  opacity:0;pointer-events:none;
}
.spark.go{animation:spark-out .22s ease-out}
@keyframes spark-out{
  0%{opacity:1;transform:translate(-50%,50%) scale(.25)}
  100%{opacity:0;transform:translate(-50%,50%) scale(1.7)}
}

/* ═══════ 推杆机构（Push rod）—— 真机：铬面板长槽 + 槽内金属推杆 ═══════ */
/* 推杆导槽（黑色长条凹槽） */
.rod-slot{
  position:absolute;z-index:24;
  left:8%;top:118px;width:84%;
  height:9px;border-radius:5px;
  background:linear-gradient(180deg,#0d1210,#1c2622 55%,#0a0e0c);
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.85),
    inset 0 -1px 0 rgba(255,255,255,.1),
    0 1px 0 rgba(255,255,255,.14);
}
/* 槽口的铬制边框 */
.rod-slot::before{
  content:'';position:absolute;inset:-2px;border-radius:7px;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 45%,var(--chrome-lo));
  box-shadow:0 1px 3px rgba(0,0,0,.55);
  z-index:-1;
}
/* 槽内刻度（真机：推杆行程有刻度标记） */
.rod-slot .rod-ticks{
  position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);
  height:5px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 9px);
  opacity:.6;
}

/* 推杆本体（金属滑杆，末端带滚花握把） */
.push-rod{
  position:absolute;z-index:25;
  left:8%;top:118px;
  width:30px;height:7px;border-radius:3.5px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 30%),
    linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 42%,var(--chrome-mid) 74%,var(--chrome-lo) 100%);
  box-shadow:
    0 2px 5px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 1px rgba(0,0,0,.28);
  cursor:ew-resize;touch-action:none;
  transition:left .26s cubic-bezier(.3,1.4,.5,1);
}
/* 推杆的滚花握把（真机：指尖捏的滚花端） */
.push-rod .knob{
  position:absolute;right:-8px;top:50%;transform:translateY(-50%);
  width:11px;height:11px;border-radius:50%;
  background:
    repeating-conic-gradient(rgba(0,0,0,.22) 0deg 8deg,transparent 8deg 16deg),
    radial-gradient(circle at 36% 32%,var(--chrome-hi) 0%,var(--chrome) 40%,var(--chrome-mid) 72%,var(--chrome-lo) 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.7);
}
/* 推杆推到位时的顿挫（真机：推杆有定位阻尼） */
.push-rod.snap{transition:left .09s cubic-bezier(.6,.1,.9,.4)}
/* 推杆拉出时的回弹 */
.push-rod.pulled{transition:left .1s ease-out}

/* 推杆标识（真机：槽边丝印 B / R） */
.rod-labels{
  position:absolute;z-index:23;
  left:8%;top:107px;
  display:flex;gap:9px;
  font:700 6px/1 "Helvetica Neue",sans-serif;
  color:rgba(255,255,255,.42);
  letter-spacing:.4px;
  pointer-events:none;
}
.rod-labels span.active{color:#ffd98a;text-shadow:0 0 5px rgba(255,200,110,.8)}

/* 机身后板（在窗口之后，是"洞"的底） */
.mech-back{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,0) 26%),
    radial-gradient(ellipse 70% 120% at 50% 120%,#14261f 0%,#1d3a31 55%,#26473c 100%);
  box-shadow:inset 0 8px 16px rgba(0,0,0,.65);
}
/* 后板上的传动细节（连杆、导轨） */
.mech-back::before{
  content:'';position:absolute;inset:0;opacity:.5;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 1px,transparent 1px 13px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 22px);
}
/* 洞底阴影 */
.mech-back::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 100% at 50% 100%,rgba(0,0,0,.55),transparent 70%);
}

/* —— 镂空实现：上下边框 + 左右立柱 = 中间空洞 —— */
/* 顶边（色带罩横梁）—— 下沿为弧形：真机洞口上沿是一道向上凸的弧 */
.mech-lip-top{
  position:absolute;left:0;right:0;top:0;height:26px;z-index:22;
  background:
    linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%),
    linear-gradient(180deg,var(--body-1),var(--body-2) 70%,var(--body-3));
  box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);
  -webkit-mask-image:radial-gradient(ellipse 78% 100% at 50% 100%,transparent 0 62%,#000 63%);
  mask-image:radial-gradient(ellipse 78% 100% at 50% 100%,transparent 0 62%,#000 63%);
}
/* 弧形边缘的铬制包边（真机：洞口弧沿包一圈铬条） */
.mech-lip-top::after{
  content:'';position:absolute;left:11%;right:11%;top:16px;height:10px;z-index:1;
  border-bottom:1.5px solid rgba(255,255,255,.28);
  border-radius:0 0 50% 50%/0 0 100% 100%;
  pointer-events:none;
}
/* 底边（承键盘的机身前沿） */
.mech-lip-bottom{
  position:absolute;left:0;right:0;bottom:0;height:9px;z-index:22;
  background:linear-gradient(180deg,var(--body-3),var(--body-4) 70%,var(--body-dark));
  box-shadow:0 -2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
}
/* 左右立柱 */
.mech-post{
  position:absolute;top:26px;bottom:9px;z-index:22;width:6%;
  background:
    linear-gradient(90deg,rgba(0,0,0,.26),rgba(255,255,255,.06) 40%,rgba(0,0,0,.2)),
    linear-gradient(180deg,var(--body-2),var(--body-3) 60%,var(--body-4));
  box-shadow:0 2px 6px rgba(0,0,0,.45);
}
.mech-post.l{left:0}
.mech-post.r{right:0}

/* 窗口内框（洞口边缘的厚度感）—— 上沿随洞口为弧形 */
.mech-window-lip{
  position:absolute;left:6%;right:6%;top:22px;bottom:5px;z-index:21;
  border:3px solid rgba(0,0,0,.42);
  border-radius:4px;
  box-shadow:
    inset 0 2px 5px rgba(0,0,0,.6),
    inset 0 -1px 0 rgba(255,255,255,.1),
    0 0 0 1px rgba(255,255,255,.09);
  pointer-events:none;
  overflow:hidden;
}
/* 窗口上沿高光（洞口朝内的一圈受光） */
.mech-window-lip::before{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);
}
.mech-window-lip::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(0deg,rgba(255,255,255,.14),transparent);
}
/* 洞口内壁：弧形铬条（真机：弧沿是抛光金属） */
.mech-window-lip .arch{
  position:absolute;left:50%;top:-14px;transform:translateX(-50%);
  width:118%;height:22px;
  border-bottom:2px solid rgba(215,230,235,.34);
  border-radius:0 0 50% 50%/0 0 100% 100%;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));
}

/* 窗口里的色带横梁（真机：色带从中间横穿，罩在字锤上方） */
.ribbon-slot{
  position:absolute;left:7%;right:7%;top:42%;height:9px;z-index:14;
  transform:translateY(-50%);
  pointer-events:none;
}
/* 色带本体 */
.ribbon-band{
  position:absolute;left:0;right:0;top:2px;height:5px;border-radius:1px;
  background:linear-gradient(180deg,#3f2f24,#1c1512 60%,#0d0908);
  box-shadow:0 2px 4px rgba(0,0,0,.8);
  transition:transform .1s ease,background .3s;
}
.ribbon-band.red{background:linear-gradient(180deg,#9c2f27,#5e1814 60%,#2e0b09)}
.ribbon-band.lifted{transform:translateY(-6px)}
/* 色带支架（左右固定夹） */
.ribbon-clip{
  position:absolute;top:0;width:8px;height:9px;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-mid) 55%,var(--chrome-lo));
  border-radius:1px;
  box-shadow:0 1px 3px rgba(0,0,0,.6);
}
.ribbon-clip.l{left:-2px}
.ribbon-clip.r{right:-2px}

/* 色带升降器导轨（真机：色带架沿竖向导轨升降，选黑/红/无色） */
.ribbon-lift{
  position:absolute;left:9%;right:9%;top:34%;height:34px;z-index:11;
  pointer-events:none;
}
/* 竖向导轨槽 */
.ribbon-lift::before,
.ribbon-lift::after{
  content:'';position:absolute;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.2));
  box-shadow:inset 0 0 1px rgba(0,0,0,.8);
}
.ribbon-lift::before{left:6px}
.ribbon-lift::after{right:6px}
/* 色带架（随选色上下滑动） */
.ribbon-carriage{
  position:absolute;left:0;right:0;top:0;height:100%;
  transition:transform .22s cubic-bezier(.3,1.3,.5,1);
}
.ribbon-carriage.lift-red{transform:translateY(9px)}
.ribbon-carriage.lift-strike{transform:translateY(18px)}
/* 升降滑块 */
.ribbon-carriage .ribbon-clip{
  top:50%;margin-top:-4px;
  width:10px;height:8px;
}
.ribbon-carriage .ribbon-clip.l{left:2px}
.ribbon-carriage .ribbon-clip.r{right:2px}

/* ══════════════════════════════════════════════════════════
   字锤篮（Segment）—— 位于窗口内部
   ══════════════════════════════════════════════════════════ */
#segment{
  position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:172px;height:108px;
  perspective:340px;
  transform-style:preserve-3d;
  transition:transform .12s cubic-bezier(.3,1.6,.5,1);
  z-index:10;
}
/* 字锤篮下移机构（真机：篮体坐在甲板上，字模上伸抵达打字点） */
#segment .bar-reach{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;height:0;
}
#segment.shifted{transform:translateX(calc(-50% - 8px))}
#segment.unshifted{transform:translateX(calc(-50% + 8px))}
/* 字锤篮受击反冲（真机：击打力经字锤传回篮体） */
#segment.recoil{
  animation:segment-recoil .18s ease-out;
}
@keyframes segment-recoil{
  0%{transform:translateX(calc(-50% + 0px))}
  30%{transform:translateX(calc(-50% + 1.6px))}
  62%{transform:translateX(calc(-50% - 0.9px))}
  100%{transform:translateX(calc(-50% + 0px))}
}
#segment.shifted.recoil{
  animation:segment-recoil-shift .18s ease-out;
}
@keyframes segment-recoil-shift{
  0%{transform:translateX(calc(-50% - 8px))}
  30%{transform:translateX(calc(-50% - 6.4px))}
  62%{transform:translateX(calc(-50% - 8.9px))}
  100%{transform:translateX(calc(-50% - 8px))}
}
/* 字锤篮底盘（导轨座） */
.segment-base{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:150px;height:22px;
  background:linear-gradient(180deg,var(--chrome-mid),var(--chrome-lo) 45%,var(--chrome-dk));
  border-radius:75px 75px 4px 4px;
  box-shadow:0 3px 8px rgba(0,0,0,.75),inset 0 1px rgba(255,255,255,.35);
  z-index:1;
}
.segment-base::after{
  content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,var(--chrome-hi),var(--chrome-mid) 60%,var(--chrome-dk));
  box-shadow:0 1px 3px rgba(0,0,0,.7);
}
/* 篮内弧形导轨（真机字锤沿弧形滑轨就位） */
.segment-guide{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  width:150px;height:26px;z-index:0;
  border-top:2px solid rgba(255,255,255,.14);
  border-radius:75px 75px 0 0;
}
.segment-guide::after{
  content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:132px;height:2px;
  background:repeating-linear-gradient(90deg,var(--chrome-lo) 0 2px,transparent 2px 7px);
  opacity:.55;
}
/* 篮内导轨 */
.segment-base::before{
  content:'';position:absolute;left:8%;right:8%;top:3px;height:2px;
  background:repeating-linear-gradient(90deg,var(--chrome-lo) 0 2px,transparent 2px 6px);
  opacity:.7;
}

/* ══════════════════════════════════════════════════════════
   单根字锤 —— 真机原理：
   所有字锤共用篮心枢轴 P，静止时躺在篮里（指向观者），
   击打时绕 P 竖直抬起 → 所有字模顶端汇聚到同一点（击打点）。
   ══════════════════════════════════════════════════════════ */
.typebar{
  position:absolute;
  left:calc(50% + var(--ox,0px));
  bottom:var(--oy,0px);
  width:2.5px;height:102px;
  transform-origin:50% 100%;   /* 杆底 = 枢轴 P */
  transform-style:preserve-3d;
  /* 静止：躺在篮里（rotateX 76° = 指向观者）
     rotateZ 负责扇形展开（2D 旋转，不损失竖直高度） */
  transform:rotateX(76deg) rotateZ(calc(var(--a) * -1));
  z-index:2;
}
/* 字锤杆 */
.typebar .bar{
  position:absolute;inset:0;
  background:linear-gradient(90deg,var(--chrome-lo),var(--chrome-hi) 42%,var(--chrome-mid) 72%,var(--chrome-lo));
  border-radius:1px;
  box-shadow:0 0 2px rgba(0,0,0,.6);
}
/* 字模（Type slug） */
/* 字模（Type slug）—— 真机：铅合金字模，顶面凸起字针，击打时抵住纸面 */
/* 击打时 z 抬到纸道之上：字针从纸前方顶住纸面 */
.typebar.hit .slug{z-index:30}
/* 字模（Type slug） */
.typebar .slug{
  position:absolute;top:-14px;left:50%;   /* 字模底 = 杆顶 = 击打点 */
  /* 反向补偿：rotateX 抵消杆的倾角，rotateY 抵消扇形角 → 字面正对击打点 */
  transform:translateX(-50%) rotateX(76deg);
  /* 击打时字模沿杆下移，抵消 rotateX 带来的高度损失 */
  min-width:12px;height:14px;padding:0 1px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 38%),
    linear-gradient(180deg,#f2f0e8 0%,#c9c7bb 55%,#9d9b90 100%);
  border:1px solid rgba(0,0,0,.45);
  border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font:700 9px/1 "Courier New",monospace;color:#16181a;
  box-shadow:
    0 2px 4px rgba(0,0,0,.78),
    inset 0 1px 0 rgba(255,255,255,.75),
    inset -1px -1px 2px rgba(0,0,0,.22);
}
/* 字模上的字模槽（真机：字面上有细凹槽） */
.typebar .slug::after{
  content:'';position:absolute;left:1px;right:1px;top:50%;height:1px;
  transform:translateY(-50%);
  background:rgba(0,0,0,.13);
  pointer-events:none;
}
/* 弹簧（真机：字锤下端的复位弹簧） */
.typebar .spring{
  position:absolute;left:0;bottom:2px;transform:translateX(-50%);
  width:4px;height:13px;
  background:repeating-linear-gradient(180deg,var(--chrome-hi) 0 1px,var(--chrome-lo) 1px 3px);
  border-radius:2px;opacity:.85;
}
/* 击打 */
.typebar.hit{
  animation:typebar-strike .3s cubic-bezier(.2,1.25,.35,1) both;
  z-index:18;
}
.typebar.hit .slug{
  background:linear-gradient(180deg,#fffdf2,#ffe4a0);
  border-color:#8a6a20;
  box-shadow:0 0 14px rgba(255,214,120,.95),0 2px 4px rgba(0,0,0,.6);
  color:#3a2a00;
}
/* 击打：字锤从篮底猛然弹起 → 竖直抵住纸面 → 回落 */
@keyframes typebar-strike{
  0%  {transform:rotateX(76deg)}
  16% {transform:rotateX(20deg)}
  28% {transform:rotateX(0deg)}
  40% {transform:rotateX(2deg)}
  100%{transform:rotateX(76deg)}
}
/* 击打时字模的补偿角随杆一起变（rotateY 归零 → 字面正对击打点）
   translateY 补偿 3D 透视的高度损失，让字针精确落在击打线上 */
.typebar.hit .slug{
  animation:slug-align .3s cubic-bezier(.2,1.25,.35,1) both;
}
@keyframes slug-align{
  0%  {transform:translateX(-50%) rotateX(76deg) rotateZ(calc(var(--a) * -1));margin-top:0;margin-left:0}
  28% {transform:translateX(-50%) rotateX(0deg) rotateZ(0deg);margin-top:var(--lift,0px);margin-left:var(--dx,0px)}
  40% {transform:translateX(-50%) rotateX(-2deg) rotateZ(0deg);margin-top:var(--lift,0px);margin-left:var(--dx,0px)}
  100%{transform:translateX(-50%) rotateX(76deg) rotateZ(calc(var(--a) * -1));margin-top:0;margin-left:0}
}

/* ══════════════════════════════════════════════════════════
   色带卷轴 / 铃 / 选择器 / 铭牌
   ══════════════════════════════════════════════════════════ */
/* 色带卷轴（架在横梁上方） */
.spool{
  position:absolute;top:2px;width:26px;height:26px;z-index:24;
  border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#3a3a3a,#141414 62%,#000);
  box-shadow:0 3px 8px rgba(0,0,0,.7),inset 0 1px 2px rgba(255,255,255,.16);
  cursor:pointer;
}
.spool::before{ /* 绕线 */
  content:'';position:absolute;inset:4px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#241a14 0deg 6deg,#3d2c20 6deg 12deg);
  box-shadow:inset 0 0 6px rgba(0,0,0,.85);
}
.spool::after{ /* 轮毂 */
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,var(--chrome-hi),var(--chrome-mid) 60%,var(--chrome-dk));
}
.spool.spin{animation:spool-spin .18s ease-out}
@keyframes spool-spin{from{transform:rotate(0)}to{transform:rotate(58deg)}}
#spool-l{left:6%}
#spool-r{right:6%}
/* 摇柄 */
.spool-lever{
  position:absolute;top:12px;width:14px;height:3px;z-index:25;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-lo));
  border-radius:2px;transform-origin:left center;
  box-shadow:0 1px 2px rgba(0,0,0,.5);
}
#lever-l{left:calc(6% + 22px)}
#lever-r{right:calc(6% + 22px);transform-origin:right center}

/* 边距铃 */
.bell{
  position:absolute;right:4%;top:4px;z-index:25;
  width:21px;height:21px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,var(--brass-1),var(--brass-2) 70%,#6b5220);
  box-shadow:0 3px 7px rgba(0,0,0,.65),inset 0 1px 1px rgba(255,255,255,.5);
  cursor:pointer;
}
.bell::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle at 40% 36%,#4a3a12,#1a1408);
}
.bell.ring{animation:bell-shake .5s ease-in-out}
@keyframes bell-shake{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(-13deg)}
  35%{transform:rotate(11deg)}
  55%{transform:rotate(-8deg)}
  75%{transform:rotate(6deg)}
}

/* 色带选择拨杆 */
.ribbon-selector{
  position:absolute;left:4%;top:4px;z-index:26;
  display:flex;flex-direction:column;gap:2px;
}
.rsel{
  width:30px;height:10px;border:none;border-radius:2px;cursor:pointer;
  font:700 5.5px/1 "Helvetica Neue",sans-serif;letter-spacing:.5px;
  box-shadow:0 1px 2px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.25);
  transition:all .12s;
}
.rsel.black{background:linear-gradient(180deg,#4a3a2c,#241811);color:#e0d0b8}
.rsel.red{background:linear-gradient(180deg,#a83830,#5e1a16);color:#ffd8d0}
.rsel.strike{background:linear-gradient(180deg,#5a5a55,#2e2e2b);color:#d0d0c8}
.rsel.on{
  box-shadow:0 0 0 2px rgba(255,255,255,.7),0 1px 3px rgba(0,0,0,.6);
  transform:translateX(3px);
}

/* 铭牌（在下边框上） */
.badge{
  position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
  padding:2px 8px;border-radius:2px;z-index:27;
  background:linear-gradient(135deg,var(--chrome-hi),var(--chrome) 45%,var(--chrome-mid));
  box-shadow:0 1px 3px rgba(0,0,0,.6);
  font:800 6px/1 "Helvetica Neue",sans-serif;letter-spacing:1.4px;color:#3a3428;
}
/* 序列号 */
.serial{
  position:absolute;right:5%;bottom:11px;z-index:27;
  font:600 5px/1 "Courier New",monospace;color:rgba(255,255,255,.32);letter-spacing:.5px;
}

/* 撞击闪光（窗口内） */
.strike-flash{
  position:absolute;z-index:16;pointer-events:none;
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,200,.95),rgba(255,200,120,0) 70%);
  opacity:0;transform:translate(-50%,-50%) scale(.4);
}
.strike-flash.go{animation:flash .18s ease-out}
@keyframes flash{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}
}

/* —— 键盘区 —— */
#deck{
  flex:1;position:relative;z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px 4px;
  min-height:0;
}

/* 键盘底板（凹陷的铝制面板） */
.key-platen{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 30%,rgba(0,0,0,.14));
  box-shadow:inset 0 2px 8px rgba(0,0,0,.4);
  pointer-events:none;
}

.krow{display:flex;gap:3px;align-items:center;justify-content:center;z-index:2}
.krow.r2{margin-left:9px}
.krow.r3{margin-left:16px}
.krow.r4{margin-left:calc(var(--k) * 0.9)}
.krow.r5{margin-left:0;width:min(100%, calc(var(--k) * 13));justify-content:space-between;padding:0 4px;margin-top:4px}

/* 单键 —— 真实打字机比例：圆形键帽 + 可见键杆 */
.key{
  position:relative;width:28px;height:28px;
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  touch-action:none;
}
/* 键杆（stem）—— 可见的连杆 */
.key .stem{
  position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:5px;height:12px;
  background:linear-gradient(90deg,var(--chrome-lo),var(--chrome-hi),var(--chrome-mid));
  border-radius:1px;z-index:-1;
  opacity:.85;
}
/* 连杆（link）—— 擒纵机构：按键时摆动，带动字锤 */
.key .link{
  position:absolute;left:50%;bottom:-15px;transform:translateX(-50%) rotate(34deg);
  width:2px;height:15px;
  background:var(--chrome-mid);
  transform-origin:top center;z-index:-1;opacity:.7;
  transition:transform .06s ease-out;
}
.key.down .link{transform:translateX(-50%) rotate(19deg)}
.key .cap{
  position:relative;z-index:2;
  width:25px;height:25px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  font:700 10px/1 "Helvetica Neue",sans-serif;color:#241d12;
  background:
    radial-gradient(circle at 34% 28%,var(--cap-hi) 0%,var(--cap) 38%,var(--cap-mid) 72%,var(--cap-lo) 100%);
  box-shadow:
    0 3px 0 var(--cap-sh),
    0 5px 8px rgba(0,0,0,.55),
    inset 0 1px 1px rgba(255,255,255,.95),
    inset 0 -2px 3px rgba(120,100,70,.35),
    inset 0 0 8px rgba(255,255,255,.25);
  transition:transform .04s,box-shadow .04s;
}
/* 键帽玻璃反光 */
.key .cap::after{
  content:'';position:absolute;left:16%;top:10%;width:38%;height:26%;
  border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,0));
  transform:rotate(-18deg);
  pointer-events:none;
}
.key.down .cap{
  transform:translateY(3px);
  box-shadow:
    0 0 0 var(--cap-sh),
    0 1px 3px rgba(0,0,0,.6),
    inset 0 2px 5px rgba(90,75,50,.55),
    inset 0 -1px 2px rgba(255,255,255,.5);
}
.key.down .stem{height:8px}
/* 特殊键 */
.key.k-wide{width:42px}
.key.k-wide .cap{border-radius:6px;width:39px;height:27px;font-size:8.5px;letter-spacing:.3px}
.key.k-wide::before{border-radius:8px}
.key.k-space{width:88px}
.key.k-space .cap{border-radius:6px;width:84px;height:24px;font:700 7px/1 "Helvetica Neue",sans-serif;letter-spacing:1.8px}
.key.k-space::before{border-radius:8px}
.key.k-ret{width:40px}
.key.k-ret .cap{
  border-radius:6px;width:37px;height:24px;font-size:12px;
  background:radial-gradient(circle at 34% 28%,#f6f0e2,#ddd2ba 55%,#b6a98d);
}
/* Shift 锁定状态 */
.key.k-shift.down .cap,
.key.k-shift.locked .cap{
  background:radial-gradient(circle at 34% 28%,#dff3e6,#b6d8c4 55%,#8fb09c);
  box-shadow:0 1px 0 var(--cap-sh),0 2px 4px rgba(0,0,0,.5),inset 0 2px 4px rgba(60,80,65,.4);
}
/* 键杆/连杆的可见性（位于键帽下方） */
.key{overflow:visible}
/* 小键（第四排） */
.key.k-sm{width:34px}
.key.k-sm .cap{border-radius:6px;width:31px;height:24px;font-size:10.5px}
.key.k-sm.k-shift .cap{font-size:10px}
.key.k-sm.k-ret .cap{font-size:13px}
/* 第四排分组 */
.kgrp{display:flex;gap:3px;align-items:center}

/* 数字层键 */
.key .sub{
  position:absolute;top:3px;left:0;right:0;text-align:center;
  font:700 5.5px/1 "Helvetica Neue",sans-serif;color:#8a7c60;
  pointer-events:none;
}

/* —— 底部操作杆排 —— */
.lever-deck{
  flex:0 0 auto;height:40px;position:relative;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
  background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.05));
  border-top:1px solid rgba(255,255,255,.08);
}

/* ═══════ 滚筒下方垂下的纸（自滚筒绕下，连续至铰链喉口） ═══════ */
.paper-drop{
  position:absolute;left:50%;transform:translateX(-50%);
  top:72px;height:258px;width:170px;z-index:20;
  background:
    linear-gradient(180deg,var(--paper) 0%,var(--paper) 72%,var(--paper-2) 100%);
  box-shadow:
    -3px 0 8px rgba(0,0,0,.4),
    3px 0 8px rgba(0,0,0,.4),
    inset 0 8px 14px rgba(150,120,70,.1),
    inset 0 -20px 26px rgba(150,120,70,.16);
}
/* 垂纸上的横格线 */
.paper-drop .drop-rules{
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(180deg,transparent 0 23px,var(--paper-line) 23px 24px);
  background-position:0 0;
  opacity:.4;
}
/* 垂纸下缘的喉口暗部 */
.paper-drop::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:26px;
  background:linear-gradient(0deg,rgba(40,32,20,.55),transparent);
}

/* ═══════ 铰链处的纸（真机：机身有"喉口"，纸从滚筒下来被吞入，再吐向打字点） ═══════ */
.hinge-paper{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:170px;height:9px;z-index:1;
  background:linear-gradient(180deg,var(--paper-2),var(--paper));
  box-shadow:
    -3px 0 7px rgba(0,0,0,.4),3px 0 7px rgba(0,0,0,.4),
    inset 0 -3px 6px rgba(150,120,70,.16);
}
/* 喉口阴影（纸被机身收进去的暗部） */
.hinge-paper::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);
}

/* ═══════ 回车杆（Carriage return lever）—— 参考图：长扁铬拨杆 + 卷边握把 ═══════ */
.crl{
  position:relative;width:54px;height:28px;cursor:pointer;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:3px;
}
/* 拨杆本体：扁长渐收的金属条 */
.crl .arm{
  position:absolute;right:10px;top:50%;
  width:46px;height:6px;border-radius:3px 1px 1px 3px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 34%),
    linear-gradient(180deg,var(--chrome-hi) 0%,var(--chrome) 40%,var(--chrome-mid) 74%,var(--chrome-lo) 100%);
  box-shadow:
    0 2px 5px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 1px rgba(0,0,0,.25);
  transform-origin:right center;
  transition:transform .16s cubic-bezier(.4,1.5,.5,1);
}
/* 拨杆根部轴座 */
.crl .arm::before{
  content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  width:7px;height:11px;border-radius:2px;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome-mid) 60%,var(--chrome-lo));
  box-shadow:0 1px 3px rgba(0,0,0,.6);
}
/* 卷边握把（真机：拨杆末端是一枚卷起来的金属握把） */
.crl .ball{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:13px;height:14px;border-radius:3px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 32%),
    linear-gradient(90deg,var(--chrome-lo) 0%,var(--chrome-hi) 34%,var(--chrome) 58%,var(--chrome-mid) 100%);
  box-shadow:
    0 3px 6px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.9),
    inset -1px 0 2px rgba(0,0,0,.3);
}
/* 握把上的滚花 */
.crl .ball::after{
  content:'';position:absolute;inset:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
  opacity:.7;
}
.crl.pull .arm{transform:rotate(-28deg)}
.crl.pull .ball{transform:translateY(-50%) rotate(18deg)}

/* 行距拨杆（Platen knob = 换行旋钮） */
.lf-knob{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 36% 32%,#f0f4f5,var(--chrome) 42%,var(--chrome-mid) 70%,var(--chrome-lo));
  box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.8);
  position:relative;
}
.lf-knob::after{
  content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--chrome-lo),var(--chrome-dk));
}
.lf-knob.turn{animation:knob-turn .3s ease-out}
@keyframes knob-turn{from{transform:rotate(0)}to{transform:rotate(var(--turn,120deg))}}

/* 退格拨杆 */
.bs-lever{
  width:26px;height:20px;cursor:pointer;position:relative;
}
.bs-lever .arm{
  width:22px;height:6px;border-radius:3px;margin-left:auto;
  background:linear-gradient(180deg,var(--chrome-hi),var(--chrome) 45%,var(--chrome-lo));
  box-shadow:0 2px 4px rgba(0,0,0,.5);
  transform-origin:right center;transition:transform .15s;
}
.bs-lever.pull .arm{transform:rotate(22deg)}

/* 标签 */
.lbl{
  font:600 6px/1 "Helvetica Neue",sans-serif;letter-spacing:.7px;
  color:rgba(230,240,235,.42);text-transform:uppercase;
}

/* 状态条 */
.status-strip{
  display:flex;align-items:center;gap:7px;
}
.lamp{
  width:6px;height:6px;border-radius:50%;
  background:rgba(120,160,140,.25);
  transition:all .18s;
}
.lamp.on{background:#7dffa8;box-shadow:0 0 7px #7dffa8}
.lamp.warn{background:#ffc247;box-shadow:0 0 7px #ffc247}
.lamp.red{background:#ff6a5a;box-shadow:0 0 7px #ff6a5a}

/* 计数 */
.counter{
  font:600 7px/1 "Courier New",monospace;color:rgba(220,235,228,.55);letter-spacing:.4px;
}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);
  background:rgba(12,18,16,.94);color:#dcece5;
  padding:8px 16px;border-radius:20px;
  font:600 11px/1 "Helvetica Neue",sans-serif;letter-spacing:.3px;
  border:1px solid rgba(255,255,255,.12);
  opacity:0;pointer-events:none;transition:all .25s;z-index:999;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 折叠提示 */
.fold-tag{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;
  font:600 5.5px/1 "Helvetica Neue",sans-serif;letter-spacing:2px;
  color:rgba(255,255,255,.18);pointer-events:none;
}

/* 滚动指示（滑车位置） */
.carriage-meter{
  position:absolute;right:5px;top:8px;z-index:40;
  width:4px;height:58px;border-radius:2px;
  background:rgba(0,0,0,.4);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
.carriage-meter i{
  position:absolute;left:0;right:0;top:0;height:3px;border-radius:2px;
  background:linear-gradient(90deg,#ff8a6a,#ffd0a0);
  box-shadow:0 0 5px rgba(255,140,100,.8);
  transition:top .06s linear;
}

@media (max-height:640px){
  .mech-deck{height:98px}
  #segment{height:88px}
  .typebar{height:80px}
  .key{width:28px;height:28px}
  .key .cap{width:25px;height:25px;font-size:10px}
  .key.k-space{width:100px}
  .key.k-space .cap{width:96px}
}
@media (max-height:560px){
  .mech-deck{height:84px}
  #segment{height:74px}
