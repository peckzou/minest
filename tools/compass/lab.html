<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thought Compass Lab</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<header class="top">
  <div><h1>Thought Compass <span>Lab</span></h1><p>Cognitive Navigation × Knowledge Micro-Interactions — one closed loop, local first.</p></div>
  <span class="badge">Lab · this browser only · not synced</span>
</header>

<main>
  <section class="ask card">
    <label for="q">Type a word, a question, a thought, something that happened, or a goal</label>
    <textarea id="q" rows="2" placeholder="Why does one event happening after another not mean it was caused by it?"></textarea>
    <div class="row">
      <div class="chips" id="examples"></div>
      <button id="go" class="primary" type="button">Locate</button>
    </div>
  </section>

  <section id="result" class="result" hidden>
    <div class="card compass-card">
      <svg id="compass" viewBox="-160 -160 320 320" role="img" aria-label="Thought Compass"></svg>
      <div class="meta">
        <div><small>Input type</small><b id="r-type"></b><em id="r-typewhy"></em></div>
        <div><small>Primary place</small><b id="r-place"></b><em id="r-unc"></em></div>
        <div><small>Related</small><span id="r-related"></span></div>
      </div>
    </div>

    <div class="card why">
      <h3>Why here</h3>
      <ul id="r-reasons"></ul>
      <div class="fix">
        <h4>Confirm or correct</h4>
        <label>Place <select id="fix-node"></select></label>
        <label>Framework <select id="fix-fw"></select></label>
        <div class="row"><button id="confirm" type="button">Confirm</button><span id="fix-msg" class="msg"></span></div>
      </div>
      <div class="ai">
        <button id="ask-ai" type="button" class="ghost">Ask AI for a second opinion (optional)</button>
        <div id="ai-out" class="msg"></div>
      </div>
    </div>

    <div class="frameworks" id="r-fws"></div>
  </section>

  <section class="card log">
    <div class="row"><h3>Knowledge log</h3><button id="clear" type="button" class="ghost small">Clear lab data</button></div>
    <div id="log"></div>
  </section>
</main>

<script src="compass.js"></script>
<script src="micro.js"></script>
<script src="micro/kant-scenes.js"></script>
<script src="lab.js"></script>
</body>
</html>
