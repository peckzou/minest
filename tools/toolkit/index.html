<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognitive Toolkit</title>
<link rel="stylesheet" href="../compass/lab.css?v=s14">
<link rel="stylesheet" href="toolkit.css?v=s14">
</head>
<body class="tk">
<header class="top">
  <div><h1>Cognitive Toolkit <span>Lab</span></h1><p>Direction · Structure · Method · Experience · Connection — from one thought to your own knowledge system.</p></div>
  <div class="tk-topact"><button type="button" id="tk-nebula" class="tk-nebula" title="Holographic Workbench"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2.2"/><circle cx="5" cy="7" r="1.4"/><circle cx="19" cy="8" r="1.6"/><circle cx="7" cy="18" r="1.3"/><circle cx="17.5" cy="17" r="1.2"/><path d="M10.2 11 6.2 7.9M13.9 11.2l3.6-2.4M10.6 13.6 7.9 17M13.7 13.4l2.9 2.7"/></svg><span>Nebula</span></button><button type="button" id="tk-lang" class="tk-lang" aria-pressed="false" title="一键切换中文"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><b>中</b></button><button type="button" id="tk-cloud" class="tk-cloud s-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg><span>Cloud sync: off — this browser only</span></button><span class="badge">Lab · saved in this browser only · not synced</span></div>
</header>
<main class="tk-main">
  <section class="card tk-ask">
    <label for="tk-q">A word, a question, a thought or a real problem</label>
    <div class="tk-askrow"><input id="tk-q" placeholder="What is freedom?" autocomplete="off"><button id="tk-go" class="primary" type="button">Explore</button><button id="tk-fromworld" type="button" hidden>From My World</button></div>
    <div class="chips" id="tk-examples"><button type="button" class="chip">What is freedom?</button><button type="button" class="chip">什么是自由？</button><button type="button" class="chip">两个事件先后发生，是否就说明前一个导致后一个？</button><button type="button" class="chip">Why didn’t the new policy work as expected?</button></div>
    <div class="chips tk-recent" id="tk-recent"></div>
  </section>

  <section id="tk-start" class="tk-intro">
    <p>Type something above. Five cards open on it — and everything you make in one card is there in the others.</p>
    <label class="ghost small tk-file">Import a knowledge object (JSON)<input type="file" id="tk-import" accept="application/json,.json"></label>
  </section>

  <section id="tk-object" hidden>
    <div class="tk-obj">
      <h2 id="tk-title"></h2>
      <div class="tk-objact"><button type="button" class="small" id="tk-tomw" hidden>Add to My World</button><button type="button" class="ghost small" id="tk-new">New thought</button><button type="button" class="ghost small" id="tk-export">Export JSON</button><button type="button" class="ghost small" id="tk-delete">Delete</button></div>
    </div>
    <nav class="tk-tabs" id="tk-tabs" aria-label="Cards"></nav>
    <div id="tk-stage" class="tk-stage"></div>
  </section>
</main>
<div id="tk-toast" role="status" aria-live="polite"></div>

<script src="i18n.js?v=s14"></script>
<script src="../compass/compass.js?v=s14"></script>
<script src="../compass/micro.js?v=s14"></script>
<script src="../compass/micro/kant-scenes.js?v=s14"></script>
<script src="labs/locke-scenes.js?v=s14"></script>
<script src="labs/stage3-scenes.js?v=s14"></script>
<script src="store.js?v=s14"></script>
<script src="cloud.js?v=s14"></script>
<script src="toolkit.js?v=s14"></script>
<script src="cards/compass.js?v=s14"></script>
<script src="cards/framework.js?v=s14"></script>
<script src="cards/models.js?v=s14"></script>
<script src="cards/lab.js?v=s14"></script>
<script src="cards/graph.js?v=s14"></script>
<script src="nebula.js?v=s14"></script>
</body>
</html>
