<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b16">
<title>Knowledge Drive · Minest</title>
<style>{{CSS}}</style>
<style>{{DRIVE_CSS}}</style>
<style>
/* the drive is the page: the student's own controls sit above it */
#v3-top { display: none !important; }
#v3-pill, #v3-mark, #v3-sheet, #v3-banner, #v3-end { z-index: 2147483646 !important; }
#v3-join { z-index: 2147483647 !important; }
/* above the drive's own controls: progress on the left, 我会了 top middle — the pedals, keys and junction panel stay free */
#v3-pill { top: 40%; bottom: auto !important; right: auto !important; left: calc(env(safe-area-inset-left, 0px) + 10px); padding: 4px 12px 4px 4px; }
#v3-pill #v3-ring { width: 28px; height: 28px; } #v3-pill #v3-ring::after { width: 21px; height: 21px; font-size: 11px; }
body.v3-xl #v3-pill { display: flex !important; }
#v3-sheet { top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: auto !important; right: auto !important; left: calc(env(safe-area-inset-left, 0px) + 10px); }
#v3-mark { top: calc(env(safe-area-inset-top, 0px) + 70px); bottom: auto !important; }
#v3-banner { top: calc(env(safe-area-inset-top, 0px) + 116px); }
#v3-end { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(90% 70% at 50% 20%, rgba(56,189,248,.2), transparent 60%), #070b16; }
#v3-end[hidden] { display: none; }
/* nothing in the drive leads out: no "open the card" */
.kd-root [data-kd="open"] { display: none !important; }
</style>
</head>
<body>
<div id="v3-top"><i>◈</i><b id="v3-ttl"></b></div>
<div id="v3-banner" hidden></div>
<button type="button" id="v3-pill" aria-label="我的进度和词表"><i id="v3-ring"></i><span><b id="v3-n">0 / 0</b><small id="v3-seen">看过 0</small></span></button>
<div id="v3-mark" hidden><button type="button" data-again>再看看</button><button type="button" data-known>我会了</button></div>
<div id="v3-sheet" hidden></div>
<div id="v3-end" hidden><div class="v3j-card"><div class="v3j-logo">🚗</div><h1>这一趟开完了</h1><p>想再看一遍这些词，就再出发一次。</p><button type="button" class="v3j-go" data-again>再出发</button></div></div>
<div id="v3-join" hidden></div>
<script src="/vendor/three.min.js"></script>
<script>{{DRIVE_JS}}</script>
<script>window.__V3_VIEW = 'drive';</script>
<script>{{STUDENT}}</script>
</body>
</html>
