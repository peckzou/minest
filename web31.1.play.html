<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>Minest Live · Arcade</title>
<style>html,body{margin:0;background:#0d1020;color:#f4f6ff;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}
/* ===== Web 15.0 · Game Mode / Study Arcade ===== */
html.arcade-open, html.arcade-open body { overflow: hidden; }
.arcade { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; color: #f1f5f9; -webkit-user-select: none; user-select: none; touch-action: none; overflow: hidden; font-family: inherit; }
.arcade .ar-bg { position: absolute; inset: 0; overflow: hidden; background: #060a16; }
.ar-bg-img, .ar-bg-dim { position: absolute; inset: 0; }
.ar-bg-img { background-size: cover; background-position: center; }
.ar-bgbtn { width: 32px; height: 32px; padding: 0; border-radius: 10px; display: grid; place-items: center; }
.ar-bgbtn.on { border-color: rgba(125,211,252,.7); color: #7dd3fc; }
.ar-bgpanel { position: absolute; z-index: 30; top: 54px; right: 14px; width: min(340px, calc(100vw - 28px)); max-height: calc(100vh - 70px); overflow-y: auto; padding: 14px; border-radius: 20px; touch-action: pan-y;
  background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04)), rgba(15,23,42,.9); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 24px 60px rgba(0,0,0,.5); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.ar-bgpanel-h { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: rgba(203,213,225,.75); margin-bottom: 10px; }
.ar-bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ar-bg-sw { position: relative; height: 58px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16); cursor: pointer; overflow: hidden; padding: 0; background-size: cover !important; }
.ar-bg-sw span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; font-size: 10px; color: #fff; text-align: left; background: linear-gradient(transparent, rgba(0,0,0,.6)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-bg-sw.on { box-shadow: 0 0 0 2px #7dd3fc; border-color: transparent; }
.ar-bg-row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: rgba(203,213,225,.8); }
.ar-bg-row input { width: 100%; accent-color: #38bdf8; }
.ar-bg-row b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.ar-bg-url { display: flex; gap: 8px; margin-top: 12px; }
.ar-bg-url input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; color: #f1f5f9; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 7px 10px; -webkit-user-select: text; user-select: text; }
.ar-bg-url input.bad { border-color: #f87171; }
.ar-bg-url .ar-btn { padding: 7px 12px; }
.ar-top { position: relative; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 18px; }
.ar-brand { display: flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; min-width: 0; }
.ar-logo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px;
  background: linear-gradient(135deg, rgba(56,189,248,.55), rgba(168,85,247,.55)); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 4px 14px rgba(56,189,248,.25); }
.ar-mode-name { color: rgba(226,232,240,.55); font-size: 12px; }
.ar-progress { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 12px; color: rgba(226,232,240,.75); font-variant-numeric: tabular-nums; min-width: 0; }
.ar-bar { width: min(260px, 28vw); height: 5px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.ar-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #38bdf8, #a78bfa); }
.ar-top-idle .ar-progress, .ar-top-idle .ar-chip, .ar-top-idle .ar-end { visibility: hidden; }
.ar-chips { display: flex; align-items: center; gap: 6px; }
.ar-chip { font-size: 12px; padding: 4px 9px; border-radius: 99px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ar-chip.k { color: #6ee7b7; } .ar-chip.a { color: #fdba74; } .ar-chip.l { color: #c4b5fd; }
.ar-btn { -webkit-appearance: none; appearance: none; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #f1f5f9; border-radius: 12px; padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 6px 18px rgba(0,0,0,.18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: background .15s, transform .15s; }
.ar-btn:hover { background: rgba(255,255,255,.14); }
.ar-btn:active { transform: scale(.97); }
.ar-btn:disabled { opacity: .45; cursor: default; }
.ar-btn.primary { background: linear-gradient(135deg, rgba(56,189,248,.9), rgba(129,140,248,.9)); border-color: rgba(255,255,255,.32); color: #fff; }
.ar-btn.know { color: #6ee7b7; } .ar-btn.again { color: #fdba74; }
.ar-x { width: 32px; height: 32px; padding: 0; border-radius: 10px; }
.ar-end { padding: 5px 11px; font-size: 12px; }
.ar-stage { position: relative; z-index: 2; flex: 1; min-height: 0; }

/* shared card look: Liquid Glass tinted by the card's colour */
.ar-card .ar-face, .ar-sw-card { border-radius: 24px; border: 1px solid rgba(255,255,255,.22);
  background: linear-gradient(155deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 45%),
    radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--c, #60a5fa) 30%, transparent), transparent 70%), rgba(15,23,42,.72);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -18px 40px rgba(0,0,0,.18), 0 26px 60px rgba(0,0,0,.45);
  -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); }
.ar-chip-list { align-self: flex-start; font-size: 11px; letter-spacing: .3px; color: rgba(226,232,240,.75); padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ar-word { font-size: clamp(22px, 3.6vw, 34px); font-weight: 750; line-height: 1.15; text-align: center; letter-spacing: -.3px; margin: auto 0; overflow-wrap: anywhere; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
.ar-answer { font-size: 15px; line-height: 1.5; color: rgba(241,245,249,.92); text-align: center; margin: auto 0; overflow-wrap: anywhere; }
.ar-answer.none { color: rgba(203,213,225,.6); font-style: italic; font-size: 14px; }
.ar-face-hint { font-size: 11px; color: rgba(203,213,225,.5); text-align: center; }

/* ---- lobby ---- */
.ar-lobby { position: absolute; inset: 0; overflow-y: auto; padding: 18px 20px 40px; display: flex; flex-direction: column; align-items: center; touch-action: pan-y; }
.ar-lobby-kicker { margin-top: 2vh; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #7dd3fc; }
.ar-lobby-title { margin: 6px 0 4px; font-size: clamp(28px, 4.4vw, 44px); font-weight: 800; letter-spacing: -1px; }
.ar-lobby-sub { margin: 0 0 22px; color: rgba(203,213,225,.7); font-size: 14px; text-align: center; }
.ar-quest { width: min(1040px, 100%); margin: 0 0 18px; padding: 14px 16px; border-radius: 18px; border: 1px solid rgba(250,204,21,.28); background: linear-gradient(120deg, rgba(250,204,21,.12), rgba(56,189,248,.08)); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 12px 28px rgba(0,0,0,.16); }
.ar-quest-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.ar-quest-title { color:#fde68a; font-size:13px; font-weight:800; letter-spacing:.45px; text-transform:uppercase; }
.ar-quest-meta { color:rgba(226,232,240,.7); font-size:12px; }
.ar-quest-list { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.ar-quest-item { display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:7px 10px; background:rgba(0,0,0,.18); color:rgba(241,245,249,.85); font-size:12px; }
.ar-quest-item[type="button"] { font:inherit; cursor:pointer; }
.ar-quest-item.done { border-color:rgba(110,231,183,.55); color:#a7f3d0; background:rgba(16,185,129,.13); }
.ar-quest-bar { height:4px; margin-top:11px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
.ar-quest-bar i { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#fbbf24,#34d399); transition:width .25s ease; }
.ar-modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; width: min(1040px, 100%); }
.ar-mode-tile[data-mode="whack"] em, .ar-mode-tile[data-mode="missing"] em, .ar-mode-tile[data-mode="smash"] em { color: #f0abfc; }
.ar-mode-tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 18px 16px 16px; border-radius: 22px; cursor: pointer; font-family: inherit; color: inherit;
  border: 1px solid rgba(255,255,255,.14); background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 16px 40px rgba(0,0,0,.25);
  transition: transform .2s, border-color .2s, box-shadow .2s; }
.ar-mode-tile:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.26); }
.ar-mode-tile.on { border-color: rgba(125,211,252,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 1px rgba(125,211,252,.45), 0 18px 46px rgba(56,189,248,.22); }
.ar-mode-tile.soon { opacity: .5; cursor: default; }
.ar-mode-tile b { font-size: 16px; }
.ar-mode-tile em { font-style: normal; font-size: 11px; letter-spacing: .4px; color: #7dd3fc; text-transform: uppercase; }
.ar-mode-tile.soon em { color: rgba(203,213,225,.7); }
.ar-mode-desc { font-size: 12.5px; line-height: 1.45; color: rgba(203,213,225,.75); margin-top: 4px; }
.ar-mode-icon { width: 44px; height: 44px; color: #e0f2fe; margin-bottom: 6px; }
.ar-mode-icon svg { width: 100%; height: 100%; }
.ar-opts { width: min(1040px, 100%); margin-top: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 64px; }
.ar-opt-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ar-opt-label { font-size: 12px; color: rgba(203,213,225,.65); min-width: 54px; text-transform: uppercase; letter-spacing: .6px; }
.ar-opt-note { margin: 0; font-size: 12.5px; color: rgba(203,213,225,.65); }
.ar-opt-note.warn { color: #fcd34d; }
.ar-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1); }
.ar-seg-btn { -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: rgba(226,232,240,.7); font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer; }
.ar-seg-btn.on { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.ar-seg-btn.off { opacity: .4; cursor: default; }
.ar-lobby-foot { width: min(1040px, 100%); margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.ar-select { font: inherit; font-size: 13px; color: #f1f5f9; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 7px 10px; max-width: 60vw; }
.ar-select option { color: #0f172a; }
.ar-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: rgba(203,213,225,.8); cursor: pointer; }
.ar-start { padding: 12px 22px; font-size: 14px; border-radius: 14px; }

/* ---- banner / toast ---- */
.ar-banner { position: absolute; left: 50%; top: 44%; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px 34px; border-radius: 26px; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.24); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 30px 70px rgba(0,0,0,.4);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.ar-banner b { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
.ar-banner span { font-size: 13px; color: rgba(203,213,225,.8); }
.ar-toast { position: absolute; left: 50%; bottom: 92px; z-index: 20; padding: 8px 14px; border-radius: 99px; font-size: 13px; pointer-events: none; white-space: nowrap;
  background: rgba(15,23,42,.78); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.ar-toast.l { color: #c4b5fd; } .ar-toast.a { color: #fdba74; }

/* ---- controls ---- */
.ar-ctrls { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 6; }
.ar-ctrls .ar-btn { min-width: 96px; }

/* ---- 1) Card Flinger ---- */
.ar-fl { position: absolute; inset: 0; --cw: min(430px, calc(100vw - 48px)); --ch: min(270px, 40vh); overflow: hidden; }
.ar-fl-fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.ar-fl-slot { position: absolute; left: calc(50% - var(--cw) / 2); top: calc(46% - var(--ch) / 2); width: var(--cw); height: var(--ch); perspective: 1600px; perspective-origin: 50% 50%; z-index: 4; }
.ar-card { position: absolute; inset: 0; cursor: grab; touch-action: none; will-change: transform, filter; transform-style: preserve-3d; border-radius: 26px; }
.ar-card:active { cursor: grabbing; }
.ar-card-in { position: absolute; inset: 0; transform-style: preserve-3d; border-radius: inherit; }
.ar-face {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 22px 26px 18px;
  border-radius: 26px; -webkit-backface-visibility: hidden; backface-visibility: hidden;
  border: 1.2px solid rgba(255, 255, 255, 0.32);
  border-top: 1.8px solid rgba(255, 255, 255, 0.85);
  border-left: 1.4px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 16px 42px rgba(0, 0, 0, 0.42),
              0 2px 8px rgba(0, 0, 0, 0.2),
              inset 0 1.5px 2px rgba(255, 255, 255, 0.55),
              inset 0 -1.5px 1.5px rgba(0, 0, 0, 0.15);
}
.ar-back { transform: rotateY(180deg); }

/* Dynamic Ground Shadow directly cast under the card */
.ar-card-shadow {
  position: absolute; left: 8%; right: 8%; bottom: -30px; height: 38px; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.18) 45%, transparent 72%);
  filter: blur(8px); pointer-events: none; transform-origin: 50% 50%;
  will-change: transform, opacity, filter;
}

.ar-card.ar-thrown { z-index: 10; pointer-events: none; filter: drop-shadow(0 20px 48px rgba(0,0,0,0.65)); }
.ar-card.ar-thrown .ar-face {
  -webkit-backdrop-filter: none; backdrop-filter: none;
  background: linear-gradient(135deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.08) 45%, rgba(15,23,42,0.85) 100%), color-mix(in srgb, var(--c, #60a5fa) 45%, #0f172a);
  border: 1.5px solid rgba(255,255,255,0.85);
  box-shadow: 0 0 32px color-mix(in srgb, var(--c, #60a5fa) 65%, transparent), inset 0 0 0 1.5px rgba(255,255,255,0.7), 0 18px 45px rgba(0,0,0,0.5);
}

/* Source Deck Area at bottom */
.ar-deck-source {
  position: absolute; left: calc(50% - 75px); bottom: 72px; width: 150px; height: 50px;
  border-radius: 14px; border: 1.2px solid rgba(255, 255, 255, 0.22);
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(15, 23, 42, 0.8));
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), inset 0 1px 1.5px rgba(255, 255, 255, 0.35);
  display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
}
.ar-deck-source-plate {
  position: absolute; inset: 0; border-radius: 14px; border: 1px solid rgba(255,255,255,.14);
  background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(15,23,42,.75));
  box-shadow: 0 4px 10px rgba(0,0,0,.3);
}
.ar-deck-source-plate.p0 { transform: translate3d(0, -3px, 0); }
.ar-deck-source-plate.p1 { transform: translate3d(0, -6px, 0); }
.ar-deck-source-cap {
  position: relative; z-index: 2; font-size: 11px; font-weight: 700; color: rgba(226, 232, 240, 0.9);
  letter-spacing: 0.6px; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

.ar-fl-timer { position: absolute; left: calc(50% - var(--cw) / 2 + 24px); width: calc(var(--cw) - 48px); top: calc(46% + var(--ch) / 2 + 22px); height: 3px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.ar-fl-timer i { display: block; height: 100%; background: linear-gradient(90deg, #38bdf8, #a78bfa); transform-origin: left center; }
.ar-bin { position: absolute; z-index: 3; width: 128px; height: 86px; border-radius: 18px; border: 1.5px dashed rgba(255,255,255,.18); background: rgba(255,255,255,.03); }
.ar-bin.k { right: 28px; top: 18px; border-color: rgba(110,231,183,.45); }
.ar-bin.a { left: 28px; bottom: 26px; border-color: rgba(253,186,116,.45); }
.ar-bin-cards { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.ar-bin-card { position: absolute; left: -38px; top: -24px; width: 76px; height: 48px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25);
  background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.04)), color-mix(in srgb, var(--c, #60a5fa) 40%, rgba(15,23,42,.8)); box-shadow: 0 6px 14px rgba(0,0,0,.3); }
.ar-bin-cap { position: absolute; left: 0; right: 0; bottom: -22px; display: flex; justify-content: center; gap: 6px; font-size: 12px; white-space: nowrap; }
.ar-bin.k .ar-bin-cap { color: #6ee7b7; } .ar-bin.a .ar-bin-cap { color: #fdba74; }
.ar-bin.a .ar-bin-cap { bottom: auto; top: -22px; }
.ar-fl-hint { position: absolute; left: 50%; bottom: 82px; transform: translateX(-50%); font-size: 12px; color: rgba(203,213,225,.5); white-space: nowrap; }
/* ---- 2) Swipe Judgment ---- */
.arcade .ar-sw-card { background: linear-gradient(155deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 45%), radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--c, #60a5fa) 26%, transparent), transparent 70%), rgb(17,25,44); }
.ar-sw { position: absolute; inset: 0; overflow: hidden; }
.ar-sw-glow { position: absolute; top: 0; bottom: 0; width: 34%; opacity: 0; pointer-events: none; }
.ar-sw-glow.k { left: 0; background: linear-gradient(90deg, rgba(52,211,153,.32), transparent); }
.ar-sw-glow.a { right: 0; background: linear-gradient(270deg, rgba(251,146,60,.32), transparent); }
.ar-sw-deck { position: absolute; --sw: min(380px, calc(100vw - 48px)); --sh: min(470px, calc(100% - 190px)); left: calc(50% - var(--sw) / 2); top: max(10px, calc(45% - var(--sh) / 2)); width: var(--sw); height: var(--sh); }
.ar-sw-card { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 22px 24px 18px; cursor: grab; touch-action: none; will-change: transform; transform-origin: 50% 70%; }
.ar-sw-card:not(.front) { pointer-events: none; }
.ar-sw-card .ar-word { font-size: clamp(24px, 4vw, 38px); }
.ar-sw-ans { opacity: 0; padding: 14px; border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: none; }
.ar-sw-card.revealed .ar-sw-ans { display: block; }
.ar-sw-card.revealed .ar-face-hint { display: none; }
.ar-sw-ans .ar-answer { font-size: 14px; }
.ar-stamp { position: absolute; top: 22px; padding: 6px 12px; border-radius: 10px; font-size: 22px; font-weight: 900; letter-spacing: 1px; opacity: 0; pointer-events: none; border: 3px solid currentColor; background: rgba(15,23,42,.35); }
.ar-stamp.know { right: 20px; color: #34d399; }
.ar-stamp.again { left: 20px; color: #fb923c; }
.ar-sw-legend { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; gap: 26px; font-size: 12.5px; font-weight: 700; letter-spacing: .6px; white-space: nowrap; }
.ar-sw-legend .k { color: #6ee7b7; } .ar-sw-legend .a { color: #fdba74; } .ar-sw-legend .mid { color: rgba(203,213,225,.45); font-weight: 500; }

/* ---- 3) Glass Slice ---- */
.ar-sl { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; touch-action: none; }
.ar-sl-orbs { position: absolute; inset: 0; pointer-events: none; }
.ar-sl-fx { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }

/* ---- finale ---- */
.ar-fin { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; }
.ar-fin-stack { position: absolute; left: 50%; top: 27%; width: 0; height: 0; }
.ar-mini { position: absolute; left: -70px; top: -44px; width: 140px; height: 88px; border-radius: 14px; padding: 10px 12px; display: flex; align-items: flex-end; font-size: 11.5px; font-weight: 650; line-height: 1.3; color: #f8fafc; overflow: hidden;

.ar-mini span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ar-fin-panel { position: absolute; left: 50%; top: calc(27% + 84px); transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); text-align: center; padding-bottom: 28px; }
.ar-fin-title { font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: -.8px; margin-bottom: 14px; }
.ar-fin-stats { display: flex; justify-content: center; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; }
.ar-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ar-stat b { font-size: clamp(28px, 4.4vw, 42px); font-weight: 800; font-variant-numeric: tabular-nums; }
.ar-stat span { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: rgba(203,213,225,.7); }
.ar-stat.k b { color: #6ee7b7; } .ar-stat.a b { color: #fdba74; }
.ar-fin-meta { margin-top: 10px; font-size: 12.5px; color: rgba(203,213,225,.6); }
.ar-fin-btns { margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

/* the entry button in the top bar */
.arcade-entry-glyph { font-size: 13px; line-height: 1; }

@media (max-width: 760px) {
  .ar-modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ar-progress .ar-bar { display: none; }
  .ar-brand b { display: none; }
  .ar-bin { width: 92px; height: 62px; }
  .ar-bin.k { right: 14px; } .ar-bin.a { left: 14px; }
  .ar-ctrls .ar-btn { min-width: 0; padding: 9px 12px; }

  .ar-bl-hud { left: 12px; bottom: 16px; }

  .ar-ms-grid.c3 { grid-template-columns: repeat(2, 1fr); }
  .ar-ms-card, .ar-ms-slot { height: clamp(52px, 9vh, 80px); }

  .ar-sm-arena { top: 132px; }

  .ar-mole { font-size: 13px; }
  .ar-ast { height: 54px; font-size: 14px; }

@media (max-width: 460px) {
  .ar-modes { grid-template-columns: 1fr; }
  .ar-top { gap: 8px; padding: 10px 12px; }
  /* one-handed phone: keep the top bar to the essentials */
  .ar-mode-name, .ar-round, .ar-chip.a, .ar-chip.l { display: none; }
  .ar-progress { justify-content: flex-start; white-space: nowrap; }
  .ar-chip { padding: 3px 7px; font-size: 11px; }

      if (screen === 'end') {
        var cl = host.levels.filter(function (k) { return s.lv[k]; }).length, st = 0; Object.keys(s.lv).forEach(function (k) { st += s.lv[k]; });
        o.body.innerHTML = '<section class="mlv-card" style="max-width:520px;margin:8vh auto 0;text-align:center"><div class="mlv-av" style="width:84px;height:84px;font-size:54px;margin:0 auto">' + avHtml(withWear(avatar())) + '</div><h2>Game over</h2><p class="sub">Look at your teacher’s screen for the podium.</p><div class="mlv-endgem">💎 +' + endBonus() + ' for your Locker</div>' +
          '<div class="mlv-stat" style="justify-content:center"><div><small>Place</small><strong>' + (myRank() ? '#' + myRank().r : '—') + '</strong></div><div><small>Coins</small><strong>' + money(s.money) + '</strong></div><div><small>Points</small><strong>' + points(totalScore()) + '</strong></div><div><small>Levels</small><strong>' + cl + '/' + host.levels.length + '</strong></div><div><small>Stars</small><strong>' + st + '★</strong></div><div><small>Right</small><strong>' + pct(s.correct, s.wrong) + '</strong></div><div><small>Cards</small><strong>' + Object.keys(s.coll).length + '</strong></div></div>' +
          '<div class="mlv-row" style="justify-content:center;margin-top:16px"><button class="mlv-btn" data-end-shop>👕 Locker & shop</button><button class="mlv-btn alt" data-end-cards>👾 Monsters & badges</button><button class="mlv-btn alt" data-end-map>🗺 Map</button></div></section>';
        $(o.body, '[data-end-shop]').onclick = function () { screen = 'shop'; draw(); save(); };
        $(o.body, '[data-end-cards]').onclick = function () { screen = 'cards'; draw(); save(); };
        $(o.body, '[data-end-map]').onclick = function () { screen = 'map'; draw(); save(); };
        return;
      }
      if (screen === 'shop') { shop(); return; }
      if (screen === 'cards') { collection(); return; }
      var nx = nextLevel();
      var lb = host.lb, ls = learnLv(), firstGame = host.levels.filter(function (k) { return !levelInfo(k).self; })[0];
      var top5 = lb && lb.top && lb.top.length ? '<div class="mlv-card mlv-top5"><h3><span>🏆 Top ' + lb.top.length + '</span><span class="mlv-note" style="margin:0">' + (RANK[lb.by] ? RANK[lb.by].name : '') + '</span></h3>' + lb.top.map(function (t, i) {
        var mine = myRank() && myRank().r === i + 1;
        return '<div class="row' + (mine ? ' me' : '') + '"><span>' + (['🥇', '🥈', '🥉'][i] || '#' + (i + 1)) + '</span><i class="mlv-av" style="width:30px;height:30px;margin:0">' + avHtml(t.av) + '</i><span>' + esc(t.n) + (mine ? ' (you)' : '') + '</span><b>' + esc(t.v) + '</b></div>';
      }).join('') + (myRank() && myRank().r > lb.top.length ? '<div class="row me"><span>#' + myRank().r + '</span><i class="mlv-av" style="width:30px;height:30px;margin:0">' + avHtml(withWear(avatar())) + '</i><span>' + esc(me.name) + ' (you)</span><b></b></div>' : '') + '</div>' : '';
      o.body.innerHTML = hud() + top5 + '<div class="mlv-map">' + host.levels.map(function (k, i) {
        var L = levelInfo(k), done = s.lv[k], open = unlocked(k);
        var head = (i === 0 && ls.length ? '<h4>📖 Learn first</h4>' : '') + (k === firstGame ? '<h4>' + (learned() ? '🎮 Choose any game' : '🔒 Games open after learning') + '</h4>' : '');
        return head + '<button type="button" class="mlv-lv ' + (done ? 'done' : open ? 'open' : 'lock') + '" data-k="' + k + '"' + (open ? '' : ' aria-disabled="true"') + '>' +
          '<span class="ic">' + (open ? L.icon : '🔒') + '</span><span><b>' + (i + 1) + '. ' + esc(L.name) + (i === host.levels.length - 1 && host.levels.length > 2 ? ' 👑' : '') + '</b><small>' + esc(L.tag) + (done ? ' · replay for more' : '') + '</small></span>' +
          '<span class="st">' + (done ? '<span style="color:#fde047">' + '★★★'.slice(0, done) + '</span><span style="opacity:.25">' + '★★★'.slice(done) + '</span>' + (s.sc[k] ? '<small style="color:#c4b5fd;font-size:11px">⭐ ' + points(s.sc[k]) + '</small>' : '') : (k === nx || (open && !L.self)) ? '▶' : '') + '</span></button>';
      }).join('') + '</div>' + (nx ? '' : '<p class="mlv-note" style="text-align:center;margin-top:16px">🏰 Every level cleared! Replay any level to earn more and push your stars to ★★★.</p>');
      wireHud();
      $$(o.body, '[data-k]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-k'); if (unlocked(k)) startLevel(k); }; });
    }
    function wireHud() {
      var a = $(o.body, '[data-shop]'), b = $(o.body, '[data-cards]'), cv = $(o.body, '[data-cover]');
      if (cv) cv.onclick = function () { var was = screen; screen = 'cover'; save(); openCover(me.code, function () { screen = was; save(); draw(); }); };
      if (a) a.onclick = function () { screen = screen === 'shop' ? 'map' : 'shop'; draw(); save(); };
      if (b) b.onclick = function () { screen = screen === 'cards' ? 'map' : 'cards'; draw(); save(); };
    }
    function packPrice(k) { return Math.round(PACKS[k].price(earnOf({ u: s.u, streak: 1 }))); }
    function packsHtml() {
      var cols = ['#94a3b8', '#38bdf8', '#a855f7', '#f59e0b', '#f43f5e'];
      return '<h3>🎁 Treasure chests</h3><div class="mlv-pk-grid">' + Object.keys(PACKS).map(function (k) {
        var P = PACKS[k], price = packPrice(k), can = s.money >= price;
        return '<div class="mlv-pkbtn" style="background:' + P.bg + '"><canvas class="mlv-tilecv" data-tier="' + k + '"></canvas><b>' + P.name + '</b>' +
          '<div class="odds">' + P.odds.map(function (x, i) { return x ? '<i style="width:' + x + '%;background:' + cols[i] + '"></i>' : ''; }).join('') + '</div>' +
          '<div class="ol">' + P.odds.map(function (x, i) { return x ? RAR[RORDER[i]].name[0] + ' ' + x + '%' : ''; }).filter(Boolean).join(' · ') + '</div>' +
          '<button class="mlv-btn' + (can ? '' : ' alt') + '" data-pack="' + k + '"' + (can ? '' : ' disabled') + '>Open · ' + money(price) + '</button></div>';
      }).join('') + '</div>';
    }
    function miniCard(c, lv, eq) {
      var R = RAR[c.r];
      return '<button type="button" class="mlv-mini' + (lv ? '' : ' no') + (eq ? ' eq' : '') + '" data-card="' + c.id + '" style="--c:' + R.c + ';--g:' + R.g + '"' + (lv ? '' : ' disabled') + '>' +
        '<span class="rb">' + R.name + '</span>' + (lv ? '<span class="lvb">Lv ' + Math.min(5, lv) + '</span>' : '') + iconHtml(c, 'mlv-card-icon') + '<b>' + (lv ? esc(c.name) : '???') + '</b><small>' + (lv ? perkText(c, Math.min(5, lv)) : RAR[c.r].name) + '</small></button>';
    }
    function collection() {
      var pk = perksOf(s), list = [];
      if (pk.cash) list.push('💵 +' + pk.cash + '% money'); if (pk.bonus) list.push('🏆 +' + pk.bonus + '% level bonus'); if (pk.guard) list.push('🛡 +' + pk.guard + '% insurance'); if (pk.streak) list.push('🔥 start at ' + pk.streak);
      o.body.innerHTML = hud() + '<h3>My badges this game · ' + Object.keys(s.coll).length + '/' + CARDS.length + '</h3>' +
        '<div class="mlv-perks">' + (list.length ? list.map(function (x) { return '<span>' + x + '</span>'; }).join('') : '<span style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)">Open chests in the 🛒 Shop — every badge gives you a perk</span>') + '</div>' +
        '<p class="mlv-note" style="margin:-4px 0 12px">Tap a badge to make it your avatar (your teacher sees it). Duplicates level a badge up to Lv 5. <a href="#" data-album style="color:#c4b5fd">All my badges →</a></p>' +
        '<div class="mlv-coll">' + CARDS.slice().sort(function (a, b) { return RORDER.indexOf(b.r) - RORDER.indexOf(a.r); }).map(function (c) { return miniCard(c, s.coll[c.id], avatar() === c.id); }).join('') + '</div>';
      wireHud();
      var al = $(o.body, '[data-album]'); if (al) al.onclick = function (e) { e.preventDefault(); showAlbum(); };
      $$(o.body, '[data-card]').forEach(function (b) { b.onclick = function () { var c = cardById(b.getAttribute('data-card')); if (!c || !s.coll[c.id]) return; s.av = c.id; localAv(c.id); beep('buy'); save(); collection(); }; });
    }
    function openPack(k) {
      var price = packPrice(k); if (s.money < price) return;
      s.money -= price; s.packs = (s.packs || 0) + 1;
      var c = pull(k), R = RAR[c.r], had = s.coll[c.id] || 0;
      s.coll[c.id] = had + 1; albumAdd(c.id);
      if (!s.av) s.av = c.id;
      save();
      if (RORDER.indexOf(c.r) >= 2) shout('found ' + (c.r === 'epic' ? 'an' : 'a') + ' ' + R.name.toUpperCase() + ' badge: ' + c.name + '!', c.r);
      var lvNow = Math.min(5, had + 1);
      showChest(k, c, {
        perk: perkText(c, lvNow), tag: had ? (had + 1 <= 5 ? 'Level up! Lv ' + lvNow : 'Max level ✓') : 'NEW BADGE!',
        onAgain: function () { openPack(k); }, againOff: s.money < packPrice(k), againLabel: 'Open another · ' + money(packPrice(k)),
        onEquip: avatar() !== c.id ? function () { s.av = c.id; localAv(c.id); save(); } : null,
        onDone: function () { draw(); }
      });
    }
    function shop() {
      var e = earnOf({ u: s.u, streak: 1 });
      o.body.innerHTML = hud() + lockerHtml(avatar()) + packsHtml() + '<h3 style="margin-top:20px">Upgrades</h3><div class="mlv-shop">' + Object.keys(UPG).map(function (k) {
        var u = UPG[k], lv = s.u[k], nx = lv + 1 < u.vals.length ? lv + 1 : -1, can = nx > 0 && s.money >= u.cost[nx];
        return '<div class="mlv-up"><div class="t">' + u.icon + ' ' + u.name + '</div><div class="lv">' + u.vals.map(function (_, i) { return '<i class="' + (i <= lv ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
          '<div class="v">Now ' + u.fmt(u.vals[lv]) + (nx > 0 ? ' → ' + u.fmt(u.vals[nx]) : ' · max') + '</div>' +
          (nx > 0 ? '<button class="mlv-btn' + (can ? '' : ' alt') + '" data-up="' + k + '"' + (can ? '' : ' disabled') + '>Buy · ' + money(u.cost[nx]) + '</button>' : '') + '</div>';
      }).join('') + '</div><h3 style="margin-top:18px">Power-ups</h3><div class="mlv-shop">' + Object.keys(POWER).map(function (k) {
        var p = POWER[k], price = Math.round(p.price(e)), owned = (k === 'shield' && s.shield > 0) || (k !== 'shield' && s.bonus > 1), can = s.money >= price && !owned;
        return '<div class="mlv-up"><div class="t">' + p.icon + ' ' + p.name + '</div><div class="v">' + p.desc + '</div><button class="mlv-btn' + (can ? '' : ' alt') + '" data-pw="' + k + '"' + (can ? '' : ' disabled') + '>' + (owned ? 'Ready ✓' : 'Buy · ' + money(price)) + '</button></div>';
      }).join('') + '</div>';
      wireHud();
      wireLocker(o.body, function (id) { if (id) { s.av = id; localAv(id); } save(); }, shop);
      $$(o.body, '[data-pack]').forEach(function (b) { b.onclick = function () { openPack(b.getAttribute('data-pack')); }; });
      $$(o.body, '.mlv-tilecv').forEach(function (cv) { chestScene(cv, cv.getAttribute('data-tier'), true); });
      $$(o.body, '[data-up]').forEach(function (b) {
        b.onclick = function () { var k = b.getAttribute('data-up'), u = UPG[k], nx = s.u[k] + 1; if (s.money < u.cost[nx]) return; s.money -= u.cost[nx]; s.u[k] = nx; beep('buy'); save(); shop(); };
      });
      $$(o.body, '[data-pw]').forEach(function (b) {
        b.onclick = function () { var k = b.getAttribute('data-pw'), price = Math.round(POWER[k].price(earnOf({ u: s.u, streak: 1 }))); if (s.money < price) return; s.money -= price; if (k === 'shield') s.shield = 3; else s.bonus = k === 'mega' ? 5 : 2; beep('buy'); save(); shop(); };
      });
    }
    if (host.state === 'live') screen = 'map';
    else if (host.state === 'ended') screen = 'end';
    if (!SA || !SA.level) o.body.innerHTML = '<section class="mlv-card"><h2>The Arcade did not load</h2><p class="sub">Reload this page.</p></section>';
    else draw();
  }

  window.MinestLive = { openTeacher: openTeacher, openJoin: openJoin, close: close, levels: LEVELS, version: '31.5', badges: CARDS, album: albumMap, showAlbum: showAlbum, openLocker: openLocker, gems: function () { return gems(); } };

  // web31.1.play.html?code=CODE (or the play page) opens the join screen straight away
  try {
    var qp = new URLSearchParams(location.search), pc = qp.get('play') || qp.get('code');
    if (window.__MINEST_LIVE_STANDALONE || qp.get('play') != null) {
      var start = function () { openJoin(pc || '', !!window.__MINEST_LIVE_STANDALONE); };
      if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
    }
  } catch (e) {}
})();

</script>
</body>
</html>
