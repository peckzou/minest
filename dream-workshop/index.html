<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121826">
<title>梦工坊 · Dream Workshop</title>
<style>
:root{--bg:#121826;--panel:#182033;--panel2:#1f2940;--line:rgba(255,255,255,.1);--ink:#eef1f7;--muted:#9aa6bd;--brass:#e3b455;--brass2:#f3cf7e;--coral:#ff7a8a;--mint:#3ddc97;--sky:#4cc9f0;--violet:#9b8cff;--rose:#ff7aa8;--r:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#dw-app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
/* top bar */
.dw-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:#0f1522;min-width:0}
.dw-brand{display:flex;flex-direction:column;line-height:1.1;flex:none}
.dw-brand small{font-size:10px;letter-spacing:.14em;color:var(--brass);font-weight:700}
.dw-brand b{font-size:15px}
#dw-title{flex:1;min-width:60px;max-width:280px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:650;font-size:15px}
#dw-title:hover,#dw-title:focus{border-color:var(--line);background:rgba(255,255,255,.04)}
#dw-sync{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.dw-tb{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;white-space:nowrap;font-weight:600;min-height:36px}
.dw-tb:disabled{opacity:.4;cursor:default}
.dw-tb.dw-primary{background:linear-gradient(135deg,var(--brass),#ea8a52);border-color:transparent;color:#1d1408}
/* middle */
.dw-mid{display:grid;grid-template-columns:1fr 340px;min-height:0}
.dw-stage{position:relative;min-height:0;overflow:hidden;background:#0d1422}
#dw-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#dw-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(15,21,34,.9);border:1px solid var(--brass);color:var(--brass2);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
.dw-legend{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:#c7cfdd;background:rgba(15,21,34,.72);border-radius:9px;padding:5px 9px;pointer-events:none}
#dw-toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:rgba(15,21,34,.95);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#dw-toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dw-toast button{border:0;background:var(--brass);color:#1d1408;border-radius:999px;padding:2px 10px;margin-left:6px;font-weight:700}
/* panel */
.dw-panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.dw-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.dw-tabs button{border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);line-height:1.15}
.dw-tabs button b{font-size:13px;color:inherit}
.dw-tabs button small{font-size:10px;letter-spacing:.02em}
.dw-tabs button[aria-selected=true]{background:var(--panel2);border-color:rgba(227,180,85,.45);color:var(--ink)}
.dw-tabs button[aria-selected=true] b{color:var(--brass2)}
#dw-body{overflow:auto;padding:4px 14px 22px;flex:1;-webkit-overflow-scrolling:touch}
#dw-body h3{font-size:12px;letter-spacing:.06em;color:var(--brass2);margin:16px 0 8px;font-weight:700}
#dw-body h3 small{color:var(--muted);font-weight:500;letter-spacing:0;margin-left:4px}
.dw-muted{color:var(--muted);font-size:12px;margin:6px 0}
.dw-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.dw-thing{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 2px;font-size:12px}
.dw-thing span{font-size:22px;line-height:1.1}
.dw-thing:hover{border-color:rgba(227,180,85,.5)}
.dw-f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin:8px 0;flex:1;min-width:0}
.dw-f b{color:var(--ink);font-weight:600}
.dw-f input:not([type=range]):not([type=color]),.dw-f select,.dw-f textarea{background:#10172a;border:1px solid var(--line);border-radius:9px;padding:8px;color:var(--ink);width:100%}
.dw-f textarea{resize:vertical;line-height:1.5}
.dw-f input[type=color]{width:64px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
input[type=range]{accent-color:var(--brass);width:100%}
.dw-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.dw-row>.dw-btn{flex:1}
.dw-btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;font-weight:600;margin:4px 0;min-height:40px}
.dw-btn:disabled{opacity:.4}
.dw-btn.dw-main{background:linear-gradient(135deg,var(--brass),#ea8a52);color:#1d1408;border-color:transparent;width:100%}
.dw-btn.dw-on{background:rgba(61,220,151,.14);border-color:var(--mint);color:#b9f5da;width:100%}
.dw-btn.dw-danger{color:#ffb3bd;border-color:rgba(255,122,138,.4)}
.dw-btn.dw-big{margin-top:18px;padding:13px;font-size:15px}
.dw-check{display:flex;gap:8px;align-items:center;padding:5px 0}
.dw-check input{width:18px;height:18px;accent-color:var(--brass)}
.dw-chips{display:flex;flex-wrap:wrap;gap:6px}
.dw-chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 11px;font-size:12.5px;min-height:34px}
.dw-chip.dw-sel{border-color:var(--brass);color:var(--brass2)}
.dw-chip.dw-act{border-color:rgba(76,201,240,.45)}
.dw-chip.dw-voice{border-color:rgba(255,122,168,.5)}
.dw-chip.dw-light{border-color:rgba(255,209,102,.5)}
.dw-chip.dw-music{border-color:rgba(155,140,255,.5)}
.dw-list{list-style:none;margin:0;padding:0}
.dw-list li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.dw-list li.dw-cur{background:rgba(227,180,85,.08)}
.dw-link{flex:1;text-align:left;border:0;background:none;padding:9px 4px;min-height:38px}
.dw-link small{color:var(--muted);margin-left:6px}
.dw-x{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px}
.dw-x:hover{background:rgba(255,255,255,.06);color:#ffb3bd}
.dw-zone{border:1px solid var(--line);border-radius:10px;padding:2px 8px;margin:6px 0}
.dw-zone.dw-cur{border-color:var(--brass)}
.dw-zone .dw-row{flex-wrap:nowrap;align-items:center}
.dw-journey{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0 2px;font-size:11.5px;color:var(--muted)}
.dw-journey span{background:var(--panel2);border-radius:999px;padding:3px 8px;color:#d7deeb}
.dw-journey i{font-style:normal;opacity:.6}
/* the eight steps */
.dw-steps{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);background:#111827;overflow-x:auto;scrollbar-width:none}
.dw-steps::-webkit-scrollbar{display:none}
.dw-steps button{display:flex;align-items:center;gap:5px;border:1px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:4px 9px 4px 4px;font-size:12.5px;white-space:nowrap;flex:none}
.dw-steps button small{font-size:10px;opacity:.65}
.dw-steps button i{font-style:normal;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:11px;font-weight:700}
.dw-steps button.ok{color:#cfe9dc}.dw-steps button.ok i{background:rgba(61,220,151,.22);color:var(--mint)}
.dw-steps button.cur{border-color:rgba(227,180,85,.55);color:var(--ink)}
.dw-steps span{color:#4a5468;flex:none}
.dw-tabs2{display:flex;gap:6px;margin:10px 0 6px}
.dw-tabs2 button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px;font-weight:650}
.dw-tabs2 button[aria-pressed=true]{border-color:var(--brass);color:var(--brass2)}
.dw-beatpart{margin:12px 0 4px;font-size:11px;letter-spacing:.1em;color:var(--brass);font-weight:700}
.dw-beat{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.dw-beat input{width:64px;flex:none;background:#10172a;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--ink)}
.dw-beatbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.dw-beatbody textarea{background:#10172a;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--ink);resize:vertical}
.dw-ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;background:rgba(15,21,34,.92);border:1px dashed var(--muted);border-radius:10px;padding:6px 10px;font-weight:650;font-size:13px}
.dw-ghost.in{border-color:var(--brass);color:var(--brass2)}
.dw-thing{touch-action:none}
/* the shelf on the left, as a workbench (wide screens) */
@media (min-width:821px){.dw-mid{grid-template-columns:340px 1fr}.dw-panel{order:-1;border-left:0;border-right:1px solid var(--line)}}
/* timeline */
.dw-tl{border-top:1px solid var(--line);background:#0f1522;padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-transport{display:flex;align-items:center;gap:6px;padding:6px 10px}
.dw-transport button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;min-width:38px;height:34px;padding:0 9px}
#dw-play{background:var(--brass);color:#1d1408;border-color:transparent;font-weight:800;min-width:46px}
#dw-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;margin:0 4px;white-space:nowrap}
.dw-transport .dw-sp{flex:1}
#dw-tltoggle{display:none}
.dw-tlgrid{display:grid;grid-template-columns:78px 1fr;height:150px}
#dw-labels{border-right:1px solid var(--line)}
.dw-lruler{height:22px}
.dw-ltrack{height:32px;display:flex;align-items:center;padding-left:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
#dw-tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
#dw-tracks{position:relative;min-width:100%;touch-action:none}
.dw-ruler{height:22px;position:relative;font-size:10.5px;color:var(--muted);cursor:pointer}
.dw-ruler span{position:absolute;top:4px;transform:translateX(2px);white-space:nowrap}
.dw-ruler span::before{content:"";position:absolute;left:-2px;top:-4px;width:1px;height:22px;background:var(--line)}
.dw-track{height:32px;position:relative;border-top:1px solid var(--line);cursor:pointer}
.dw-clip{position:absolute;top:4px;height:24px;border-radius:7px;font-size:11px;font-weight:650;color:#141824;overflow:hidden;white-space:nowrap;cursor:grab;display:flex;align-items:center;padding:0 10px 0 6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dw-clip span{overflow:hidden;text-overflow:ellipsis}
.dw-clip.dw-sel{box-shadow:0 0 0 2px #fff;z-index:2}
.dw-grip{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(0,0,0,.18)}
.dw-c-light{background:#ffd166}.dw-c-action{background:var(--sky)}.dw-c-voice{background:var(--rose)}.dw-c-music{background:var(--violet)}
.dw-head{position:absolute;top:0;bottom:0;width:2px;background:var(--coral);pointer-events:none;z-index:3}
.dw-head::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--coral)}
/* guest preview */
.dw-ghud{display:none}
body.dw-guest .dw-panel,body.dw-guest .dw-tl,body.dw-guest .dw-top,body.dw-guest .dw-legend,body.dw-guest .dw-steps{display:none}
body.dw-guest #dw-app{grid-template-rows:1fr}
body.dw-guest .dw-mid{grid-template-columns:1fr}
body.dw-guest .dw-ghud{display:block}
body.dw-ride #dw-joy{display:none}
#dw-gback{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5}
#dw-gwalk{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5}
.dw-gbtn{border:1px solid rgba(255,255,255,.25);background:rgba(15,21,34,.82);border-radius:999px;padding:9px 15px;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#dw-gmsg{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-10px);opacity:0;transition:.25s;background:rgba(15,21,34,.88);border:1px solid rgba(227,180,85,.6);color:var(--brass2);border-radius:999px;padding:8px 16px;font-weight:650;white-space:nowrap;max-width:calc(100% - 180px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#dw-gmsg.on{opacity:1;transform:translate(-50%,0)}
#dw-joy{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:120px;height:120px;border-radius:50%;background:rgba(15,21,34,.45);border:1px solid rgba(255,255,255,.22);touch-action:none;z-index:5}
#dw-knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(227,180,85,.85);pointer-events:none}
.dw-ghelp{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);font-size:12px;color:#c7cfdd;background:rgba(15,21,34,.6);padding:5px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
@media (hover:none){.dw-ghelp{display:none}}
@media (hover:hover) and (pointer:fine){#dw-joy{opacity:.55}}
/* works sheet */
#dw-sheet{position:fixed;inset:0;background:rgba(5,8,15,.6);z-index:20;display:flex;justify-content:flex-end}
#dw-sheet[hidden],#dw-isheet[hidden]{display:none}
#dw-isheet{position:fixed;inset:0;background:rgba(5,8,15,.6);z-index:20;display:flex;justify-content:flex-end}
#dw-ibody{overflow:auto;padding:4px 14px 24px}
#dw-ibody h3{font-size:14px;color:var(--brass2);margin:4px 0 6px}
.dw-ierr{color:#ffb3bd;font-size:12.5px}
.dw-iplan{margin-top:14px;border:1px solid rgba(227,180,85,.45);border-radius:12px;padding:12px;background:rgba(227,180,85,.06)}
.dw-iplan p{font-size:13px;margin:4px 0 8px}
.dw-iplan ul{margin:0 0 6px;padding-left:18px;font-size:12.5px;color:var(--muted)}
#dw-shelf[aria-pressed=true]{border-color:var(--mint);color:#b9f5da}
.dw-sheetin{width:min(420px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.dw-sheethd{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border-bottom:1px solid var(--line)}
.dw-sheethd b{font-size:15px}
#dw-wbody{overflow:auto;padding:0 14px 24px}
#dw-wbody h3{font-size:12px;letter-spacing:.06em;color:var(--brass2);margin:16px 0 8px}
.dw-tpls{display:grid;gap:8px}
.dw-tpl{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px}
.dw-tpl span{grid-row:1/3;font-size:28px;align-self:center;text-align:center}
.dw-tpl small{color:var(--muted)}
/* narrow: the sandbox on top, the studio below, the timeline folds */
@media (max-width:820px){
  .dw-mid{grid-template-columns:1fr;grid-template-rows:minmax(220px,46vh) 1fr}
  .dw-panel{border-left:0;border-top:1px solid var(--line)}
  #dw-sync{display:none}
  .dw-tb .dw-lbl{display:none}
  #dw-tltoggle{display:inline-block}
  .dw-tlgrid{display:none}
  body.dw-tlopen .dw-tlgrid{display:grid}
  body.dw-tlopen .dw-mid{grid-template-rows:minmax(170px,30vh) 1fr}
  body.dw-tlopen .dw-tlgrid{height:140px}
  .dw-legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="dw-app">
  <header class="dw-top">
    <button class="dw-tb" id="dw-exit" type="button" hidden>←<span class="dw-lbl"> 返回乐园</span></button>
    <div class="dw-brand"><small>MINEST IMAGINEERING</small><b>🎬 梦工坊</b></div>
    <input id="dw-title" aria-label="作品名字" maxlength="40">
    <span id="dw-sync" aria-live="polite"></span>
    <button class="dw-tb" id="dw-imag" type="button">✨<span class="dw-lbl"> Imagineer</span></button>
    <button class="dw-tb" id="dw-shelf" type="button" aria-pressed="false">🎒<span class="dw-lbl"> 放进 My World</span></button>
    <button class="dw-tb" id="dw-undo" type="button" disabled aria-label="撤销">↶<span class="dw-lbl"> 撤销</span></button>
    <button class="dw-tb" id="dw-works" type="button">📁<span class="dw-lbl"> 作品</span></button>
    <button class="dw-tb dw-primary" id="dw-guestbtn" type="button">▶<span class="dw-lbl"> 成为观众</span></button>
  </header>
  <nav class="dw-steps" id="dw-steps" aria-label="Imagineer 的八个步骤"></nav>
  <div class="dw-mid">
    <div class="dw-stage">
      <canvas id="dw-cv" aria-label="体验沙盘：拖动转动视角，拖动物件移动它们，双指或滚轮缩放"></canvas>
      <div id="dw-hint" hidden></div>
      <div class="dw-legend">拖动空白处转视角 · Shift/右键拖动平移 · 滚轮缩放 · 拖动物件摆放 · R 转向 · Delete 移除</div>
      <div id="dw-toast" role="status" aria-live="polite"></div>
      <div class="dw-ghud">
        <button class="dw-gbtn" id="dw-gback" type="button">← 回到导演台</button>
        <div id="dw-gmsg" role="status" aria-live="polite"></div>
        <div id="dw-joy" aria-label="移动摇杆"><div id="dw-knob"></div></div>
        <button class="dw-gbtn" id="dw-gwalk" type="button">🚶 沿观众路线走</button>
        <div class="dw-ghelp">WASD 走动 · 方向键转身 · 拖动看四周 · 点一下活过来的人物或画像 · Esc 回到导演台</div>
      </div>
    </div>
    <aside class="dw-panel" aria-label="工作台">
      <nav class="dw-tabs" role="tablist">
        <button type="button" role="tab" data-tab="story" aria-selected="false"><b>故事</b><small>Story</small></button>
        <button type="button" role="tab" data-tab="model" aria-selected="true"><b>造物</b><small>Model</small></button>
        <button type="button" role="tab" data-tab="behavior" aria-selected="false"><b>赋能</b><small>Behavior</small></button>
        <button type="button" role="tab" data-tab="scene" aria-selected="false"><b>布景</b><small>Scene</small></button>
        <button type="button" role="tab" data-tab="experience" aria-selected="false"><b>导演</b><small>Experience</small></button>
      </nav>
      <div id="dw-body"></div>
    </aside>
  </div>
  <section class="dw-tl" aria-label="演出时间轴">
    <div class="dw-transport">
      <button type="button" id="dw-rew" aria-label="回到开头">⏮</button>
      <button type="button" id="dw-back1" aria-label="后退一秒">−1s</button>
      <button type="button" id="dw-play" aria-label="播放">▶</button>
      <button type="button" id="dw-fwd1" aria-label="前进一秒">+1s</button>
      <span id="dw-time">0.0 / 0 秒</span>
      <span class="dw-sp"></span>
      <button type="button" id="dw-clipdel" disabled aria-label="删除选中的色条">🗑</button>
      <button type="button" id="dw-tltoggle">⏱ 时间轴</button>
    </div>
    <div class="dw-tlgrid">
      <div id="dw-labels"></div>
      <div id="dw-tlscroll"><div id="dw-tracks"></div></div>
    </div>
  </section>
</div>
