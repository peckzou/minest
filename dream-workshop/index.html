<!doctype html>
<meta charset="utf-8">
<title>造梦大楼 · Minest Imagineer</title>
<!-- 梦工坊 is inside the Minest Imagineer Building now (wed-studio/). Old links (?open=<id>, ?play=<id>) are carried over. -->
<script>
  var q = location.search.replace(/([?&])(open|play)=([A-Za-z0-9_-]+)/, function (m, a, k, id) { return a + 'work=' + id + (k === 'play' ? '&play=1' : ''); });
  location.replace('wed-studio/index.html' + q);
</script>
