<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121826">
<title>奇想造梦工坊 · Minest Imagineer</title>
<style>
:root{--bg:#0f172a;--panel:#162038;--panel2:#1e2b4a;--line:rgba(255,255,255,.12);--ink:#f8fafc;--muted:#9fb0cc;--brass:#fbbf24;--brass2:#fde68a;--coral:#fb7185;--mint:#34d399;--sky:#38bdf8;--violet:#a78bfa;--rose:#f472b6;--r:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#dw-app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}
body.dw-easy #dw-steps,body.dw-easy .dw-tl{display:none}
body.dw-easy #dw-app{grid-template-rows:auto 1fr}

/* top bar */
.dw-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#131c34,#0f172a);min-width:0}
.dw-brand{display:flex;flex-direction:column;line-height:1.1;flex:none}
.dw-brand small{font-size:10px;letter-spacing:.12em;color:var(--brass);font-weight:800}
.dw-brand b{font-size:15px}
#dw-title{flex:1;min-width:70px;max-width:240px;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14.5px}
#dw-title:hover,#dw-title:focus{border-color:var(--line);background:rgba(255,255,255,.08)}
#dw-sync{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.dw-tb{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 13px;white-space:nowrap;font-weight:700;min-height:36px;font-size:13px;transition:transform .12s,filter .12s}
.dw-tb:hover:not(:disabled){filter:brightness(1.08)}
.dw-tb:active:not(:disabled){transform:scale(.97)}
.dw-tb:disabled{opacity:.4;cursor:default}
.dw-tb.dw-primary{background:linear-gradient(135deg,#fbbf24,#f97316);border-color:transparent;color:#1e1204;box-shadow:0 4px 14px rgba(251,191,36,.28)}
.dw-tb.dw-park{background:linear-gradient(135deg,#ec4899,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(236,72,153,.32)}
.dw-tb.dw-modebtn[aria-pressed=true]{border-color:var(--sky);color:#bae6fd;background:rgba(56,189,248,.16)}

/* middle */
.dw-mid{display:grid;grid-template-columns:1fr 370px;min-height:0}
.dw-stage{position:relative;min-height:0;overflow:hidden;background:#0b1120}
#dw-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#dw-hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(15,23,42,.92);border:1.5px solid var(--brass);color:var(--brass2);padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;pointer-events:none;max-width:calc(100% - 24px);text-align:center;z-index:4}
.dw-legend{position:absolute;left:12px;bottom:12px;font-size:12px;color:#cbd5e1;background:rgba(15,23,42,.76);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;pointer-events:none}

/* floating quick action bar when an object is selected in 3D! */
#dw-quickbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(15,23,42,.92);border:1.5px solid rgba(251,191,36,.55);border-radius:999px;padding:6px 10px;box-shadow:0 10px 28px rgba(0,0,0,.45);backdrop-filter:blur(10px);max-width:calc(100% - 20px)}
#dw-quickbar[hidden]{display:none}
#dw-quickbar b{font-size:12.5px;color:var(--brass2);padding:0 6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dw-quickbar button{border:1px solid rgba(255,255,255,.15);background:rgba(30,43,74,.9);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;min-height:32px;white-space:nowrap}
#dw-quickbar button:hover{border-color:var(--brass)}
#dw-quickbar button.danger{color:#fda4af;border-color:rgba(251,113,133,.4)}
#dw-quickbar input[type=color]{width:30px;height:30px;border:1px solid rgba(255,255,255,.25);border-radius:50%;padding:2px;background:transparent;cursor:pointer}

#dw-toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-16px);opacity:0;transition:.22s;background:rgba(15,23,42,.95);border:1px solid rgba(251,191,36,.5);color:var(--brass2);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:650;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;z-index:8}
#dw-toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dw-toast button{border:0;background:var(--brass);color:#1d1408;border-radius:999px;padding:2px 10px;margin-left:6px;font-weight:700}

/* panel */
.dw-panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.dw-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line)}
body.dw-easy .dw-tabs-pro{display:none}
body:not(.dw-easy) .dw-tabs-easy{display:none}
.dw-tabs-easy{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;border-bottom:1px solid var(--line);background:rgba(15,23,42,.45)}
.dw-tabs-easy button{border:1.5px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);transition:all .15s}
.dw-tabs-easy button span{font-size:20px;line-height:1.1}
.dw-tabs-easy button b{font-size:13px;color:var(--ink)}
.dw-tabs-easy button[aria-selected=true]{background:linear-gradient(160deg,rgba(251,191,36,.22),rgba(244,114,182,.18));border-color:var(--brass);transform:translateY(-1px)}
.dw-tabs-easy button[aria-selected=true] b{color:var(--brass2)}

.dw-tabs-pro button{border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);line-height:1.15}
.dw-tabs-pro button b{font-size:13px;color:inherit}
.dw-tabs-pro button small{font-size:10px;letter-spacing:.02em}
.dw-tabs-pro button[aria-selected=true]{background:var(--panel2);border-color:rgba(251,191,36,.5);color:var(--ink)}
.dw-tabs-pro button[aria-selected=true] b{color:var(--brass2)}

#dw-body{overflow:auto;padding:8px 14px 26px;flex:1;-webkit-overflow-scrolling:touch}
#dw-body h3{font-size:12.5px;letter-spacing:.04em;color:var(--brass2);margin:14px 0 8px;font-weight:800}
#dw-body h3 small{color:var(--muted);font-weight:500;letter-spacing:0;margin-left:4px}
.dw-muted{color:var(--muted);font-size:12px;margin:6px 0;line-height:1.5}

/* Easy Mode Cards & Toybox */
.dw-dreambox{background:linear-gradient(155deg,rgba(56,189,248,.12),rgba(168,85,247,.14));border:1.5px solid rgba(56,189,248,.4);border-radius:16px;padding:12px;margin:4px 0 12px}
.dw-dreambox h4{margin:0 0 6px;font-size:14px;color:#fde68a;display:flex;align-items:center;gap:6px}
.dw-irow{display:flex;gap:6px;align-items:stretch}
.dw-irow textarea{flex:1;background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:9px 10px;color:var(--ink);resize:none;line-height:1.45}
.dw-mic{width:44px;flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:12px;font-size:20px;display:grid;place-items:center}
.dw-mic.on{background:rgba(251,113,133,.28);border-color:var(--coral);animation:dwPulse 1s infinite}
@keyframes dwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.dw-ipgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dw-ipcard{border:1.5px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:all .14s}
.dw-ipcard:hover{border-color:var(--brass);transform:translateY(-2px)}
.dw-ipcard.cur{border-color:var(--mint);background:rgba(52,211,153,.12)}
.dw-ipcard .top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.dw-ipcard .ic{font-size:26px;line-height:1}
.dw-ipcard .bdg{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08)}
.dw-ipcard b{font-size:13.5px;color:#fff}
.dw-ipcard small{font-size:11px;color:var(--muted);line-height:1.35}

.dw-catpills{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.dw-catpills::-webkit-scrollbar{display:none}
.dw-catpills button{flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.dw-catpills button.on{background:var(--brass);color:#1d1408;border-color:transparent}

.dw-shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.dw-thing{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--line);background:var(--panel2);border-radius:13px;padding:10px 4px;font-size:12px;font-weight:650;touch-action:none;transition:all .12s}
.dw-thing span{font-size:26px;line-height:1.1}
.dw-thing:hover{border-color:var(--brass);transform:translateY(-2px)}

.dw-selcard{background:rgba(251,191,36,.08);border:1.5px solid rgba(251,191,36,.45);border-radius:15px;padding:11px;margin:10px 0}
.dw-selcard h4{margin:0 0 6px;font-size:14px;color:var(--brass2);display:flex;align-items:center;justify-content:space-between}

.dw-magicgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.dw-mcard{border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 10px;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px;text-align:left}
.dw-mcard.on{border-color:var(--brass);background:rgba(251,191,36,.16);color:var(--brass2)}

.dw-f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);margin:8px 0;flex:1;min-width:0}
.dw-f b{color:var(--ink);font-weight:600}
.dw-f input:not([type=range]):not([type=color]),.dw-f select,.dw-f textarea{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);width:100%}
.dw-f textarea{resize:vertical;line-height:1.5}
.dw-f input[type=color]{width:64px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
input[type=range]{accent-color:var(--brass);width:100%}
.dw-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.dw-row>.dw-btn{flex:1}
.dw-btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 12px;font-weight:700;margin:4px 0;min-height:40px}
.dw-btn:disabled{opacity:.4}
.dw-btn.dw-main{background:linear-gradient(135deg,#fbbf24,#f97316);color:#1d1408;border-color:transparent;width:100%}
.dw-btn.dw-parkbtn{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border-color:transparent;width:100%}
.dw-btn.dw-on{background:rgba(52,211,153,.16);border-color:var(--mint);color:#b9f5da;width:100%}
.dw-btn.dw-danger{color:#ffb3bd;border-color:rgba(255,122,138,.4)}
.dw-btn.dw-big{margin-top:14px;padding:13px;font-size:15px}
.dw-check{display:flex;gap:8px;align-items:center;padding:5px 0}
.dw-check input{width:18px;height:18px;accent-color:var(--brass)}
.dw-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.dw-chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:12px;min-height:32px}
.dw-chip.dw-sel{border-color:var(--brass);color:var(--brass2);background:rgba(251,191,36,.15)}
.dw-chip.dw-act{border-color:rgba(56,189,248,.45)}
.dw-chip.dw-voice{border-color:rgba(244,114,182,.5)}
.dw-chip.dw-light{border-color:rgba(251,191,36,.5)}
.dw-chip.dw-music{border-color:rgba(167,139,250,.5)}
.dw-list{list-style:none;margin:0;padding:0}
.dw-list li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.dw-list li.dw-cur{background:rgba(251,191,36,.08)}
.dw-link{flex:1;text-align:left;border:0;background:none;padding:9px 4px;min-height:38px}
.dw-link small{color:var(--muted);margin-left:6px}
.dw-x{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px}
.dw-x:hover{background:rgba(255,255,255,.06);color:#ffb3bd}
.dw-zone{border:1px solid var(--line);border-radius:10px;padding:2px 8px;margin:6px 0}
.dw-zone.dw-cur{border-color:var(--brass)}
.dw-zone .dw-row{flex-wrap:nowrap;align-items:center}
.dw-journey{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:12px 0 2px;font-size:11.5px;color:var(--muted)}
.dw-journey span{background:var(--panel2);border-radius:999px;padding:3px 8px;color:#d7deeb}
.dw-journey i{font-style:normal;opacity:.6}

/* the eight steps (Pro Mode) */
.dw-steps{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);background:#111827;overflow-x:auto;scrollbar-width:none}
.dw-steps::-webkit-scrollbar{display:none}
.dw-steps button{display:flex;align-items:center;gap:5px;border:1px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:4px 9px 4px 4px;font-size:12.5px;white-space:nowrap;flex:none}
.dw-steps button small{font-size:10px;opacity:.65}
.dw-steps button i{font-style:normal;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:11px;font-weight:700}
.dw-steps button.ok{color:#cfe9dc}.dw-steps button.ok i{background:rgba(52,211,153,.22);color:var(--mint)}
.dw-steps button.cur{border-color:rgba(251,191,36,.55);color:var(--ink)}
.dw-steps span{color:#4a5468;flex:none}
.dw-tabs2{display:flex;gap:6px;margin:10px 0 6px}
.dw-tabs2 button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px;font-weight:700}
.dw-tabs2 button[aria-pressed=true]{border-color:var(--brass);color:var(--brass2)}
.dw-beatpart{margin:12px 0 4px;font-size:11px;letter-spacing:.1em;color:var(--brass);font-weight:700}
.dw-beat{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.dw-beat input{width:64px;flex:none;background:#10172a;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--ink)}
.dw-beatbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.dw-beatbody textarea{background:#10172a;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--ink);resize:vertical}
.dw-ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;background:rgba(15,23,42,.95);border:1.5px dashed var(--muted);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13.5px}
.dw-ghost.in{border-color:var(--brass);color:var(--brass2)}

@media (min-width:821px){.dw-mid{grid-template-columns:370px 1fr}.dw-panel{order:-1;border-left:0;border-right:1px solid var(--line)}}

/* timeline (Pro Mode) */
.dw-tl{border-top:1px solid var(--line);background:#0f1522;padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-transport{display:flex;align-items:center;gap:6px;padding:6px 10px}
.dw-transport button{border:1px solid var(--line);background:var(--panel2);border-radius:9px;min-width:38px;height:34px;padding:0 9px}
#dw-play{background:var(--brass);color:#1d1408;border-color:transparent;font-weight:800;min-width:46px}
#dw-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;margin:0 4px;white-space:nowrap}
.dw-transport .dw-sp{flex:1}
#dw-tltoggle{display:none}
.dw-tlgrid{display:grid;grid-template-columns:78px 1fr;height:150px}
#dw-labels{border-right:1px solid var(--line)}
.dw-lruler{height:22px}
.dw-ltrack{height:32px;display:flex;align-items:center;padding-left:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
#dw-tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
#dw-tracks{position:relative;min-width:100%;touch-action:none}
.dw-ruler{height:22px;position:relative;font-size:10.5px;color:var(--muted);cursor:pointer}
.dw-ruler span{position:absolute;top:4px;transform:translateX(2px);white-space:nowrap}
.dw-ruler span::before{content:"";position:absolute;left:-2px;top:-4px;width:1px;height:22px;background:var(--line)}
.dw-track{height:32px;position:relative;border-top:1px solid var(--line);cursor:pointer}
.dw-clip{position:absolute;top:4px;height:24px;border-radius:7px;font-size:11px;font-weight:650;color:#141824;overflow:hidden;white-space:nowrap;cursor:grab;display:flex;align-items:center;padding:0 10px 0 6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.dw-clip span{overflow:hidden;text-overflow:ellipsis}
.dw-clip.dw-sel{box-shadow:0 0 0 2px #fff;z-index:2}
.dw-grip{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(0,0,0,.18)}
.dw-c-light{background:#ffd166}.dw-c-action{background:var(--sky)}.dw-c-voice{background:var(--rose)}.dw-c-music{background:var(--violet)}
.dw-head{position:absolute;top:0;bottom:0;width:2px;background:var(--coral);pointer-events:none;z-index:3}
.dw-head::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--coral)}

/* guest preview */
.dw-ghud{display:none}
body.dw-guest .dw-panel,body.dw-guest .dw-tl,body.dw-guest .dw-top,body.dw-guest .dw-legend,body.dw-guest .dw-steps,body.dw-guest #dw-quickbar{display:none!important}
body.dw-guest #dw-app{grid-template-rows:1fr!important}
body.dw-guest .dw-mid{grid-template-columns:1fr!important;grid-template-rows:1fr!important}
body.dw-guest .dw-ghud{display:block}
body.dw-ride #dw-joy{display:none}
#dw-gback{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5}
.dw-gacts{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 165px)}
.dw-gbtn{border:1.5px solid rgba(255,255,255,.25);background:rgba(15,23,42,.85);border-radius:999px;padding:10px 16px;font-weight:800;font-size:13.5px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.dw-gbtn.gold{background:linear-gradient(135deg,#fbbf24,#f97316);color:#1d1408;border-color:transparent}
.dw-gbtn.pink{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border-color:transparent}
#dw-gmsg{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translate(-50%,-10px);opacity:0;transition:.25s;background:rgba(15,23,42,.92);border:1.5px solid rgba(251,191,36,.65);color:var(--brass2);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:6}
#dw-gmsg.on{opacity:1;transform:translate(-50%,0)}
#dw-joy{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:120px;height:120px;border-radius:50%;background:rgba(15,23,42,.48);border:1.5px solid rgba(255,255,255,.26);touch-action:none;z-index:5}
#dw-knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(251,191,36,.9);pointer-events:none}
.dw-ghelp{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);font-size:12px;color:#e2e8f0;background:rgba(15,23,42,.72);padding:5px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
@media (hover:none),(max-width:900px){.dw-ghelp{display:none}}
@media (hover:hover) and (pointer:fine){#dw-joy{opacity:.58}}

/* sheets */
#dw-sheet,#dw-isheet{position:fixed;inset:0;background:rgba(5,8,15,.65);z-index:20;display:flex;justify-content:flex-end;backdrop-filter:blur(4px)}
#dw-sheet[hidden],#dw-isheet[hidden]{display:none}
#dw-ibody{overflow:auto;padding:4px 14px 24px}
#dw-ibody h3{font-size:14px;color:var(--brass2);margin:4px 0 6px}
.dw-ierr,.dw-inote{color:#fde68a;font-size:12.5px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:8px 10px}
.dw-iplan{margin-top:14px;border:1.5px solid rgba(251,191,36,.5);border-radius:14px;padding:12px;background:rgba(251,191,36,.08)}
.dw-iplan p{font-size:13px;margin:4px 0 8px}
.dw-iplan ul{margin:0 0 8px;padding-left:18px;font-size:12.5px;color:var(--muted)}
#dw-shelf[aria-pressed=true]{border-color:var(--mint);color:#b9f5da}
.dw-sheetin{width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.dw-sheethd{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;border-bottom:1px solid var(--line)}
.dw-sheethd b{font-size:15px}
#dw-wbody{overflow:auto;padding:0 14px 24px}
#dw-wbody h3{font-size:12px;letter-spacing:.06em;color:var(--brass2);margin:16px 0 8px}
.dw-tpls{display:grid;gap:8px}
.dw-tpl{display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px}
.dw-tpl span{grid-row:1/3;font-size:28px;align-self:center;text-align:center}
.dw-tpl small{color:var(--muted)}

@media (max-width:820px){
  .dw-mid{grid-template-columns:1fr;grid-template-rows:minmax(230px,46vh) 1fr}
  .dw-panel{border-left:0;border-top:1px solid var(--line)}
  #dw-sync{display:none}
  .dw-tb .dw-lbl{display:none}
  #dw-tltoggle{display:inline-block}
  .dw-tlgrid{display:none}
  body.dw-tlopen .dw-tlgrid{display:grid;height:140px}
  body.dw-tlopen .dw-mid{grid-template-rows:minmax(170px,30vh) 1fr}
  .dw-legend{display:none}
}
/* Phase 8: the world library, scene kits, missions, knowledge cards and the passport */
.dw-search{width:100%;background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);margin-bottom:8px}
.dw-thing.dw-hasfact{position:relative}
.dw-thing.dw-hasfact::after{content:'📖';position:absolute;top:3px;right:4px;font-size:10px;opacity:.85}
.dw-kits{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.dw-kit{display:grid;grid-template-columns:30px 1fr;column-gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 9px}
.dw-kit span{grid-row:1/3;font-size:22px;align-self:center;text-align:center}
.dw-kit b{font-size:12.5px}
.dw-kit small{color:var(--muted);font-size:11px;line-height:1.35}
.dw-kit:hover{border-color:var(--brass)}
.dw-factbox{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.4);border-radius:11px;padding:8px 10px;margin:8px 0 2px;font-size:12.5px;line-height:1.55}
.dw-factbox b{color:#bae6fd;font-size:12px}
.dw-factbox p{margin:4px 0 0}
.dw-missions{background:rgba(52,211,153,.09);border:1.5px solid rgba(52,211,153,.4);border-radius:14px;padding:9px 11px;margin:4px 0 10px}
.dw-mhd{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.dw-mhd span{color:#b9f5da;font-weight:700;font-size:12px}
.dw-mdots{display:flex;gap:6px;margin:7px 0 5px}
.dw-mdots i{flex:1;height:22px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-style:normal;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.dw-mdots i.ok{background:var(--mint);color:#06281b;border-color:transparent}
.dw-mdots i.cur{border-color:var(--brass);color:var(--brass2)}
.dw-missions p{margin:0;font-size:12.5px;color:var(--ink)}
#dw-kcard{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);width:min(440px,calc(100% - 28px));z-index:7;background:rgba(15,23,42,.94);border:1.5px solid rgba(56,189,248,.65);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#dw-kcard[hidden]{display:none}
body:not(.dw-guest) #dw-kcard{display:none}
.dw-khd{display:flex;gap:10px;align-items:center;padding-right:26px}
.dw-khd span{font-size:30px}
.dw-khd b{display:block;font-size:15px;color:var(--brass2)}
.dw-khd small{color:#bae6fd;font-size:11.5px}
#dw-kcard p{margin:8px 0;font-size:14px;line-height:1.65}
.dw-kft{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.dw-kft em{font-style:normal;color:#b9f5da;font-weight:700}
.dw-kx{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:15px;padding:4px 6px}
#dw-pass{position:fixed;inset:0;background:rgba(5,8,15,.7);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
#dw-pass[hidden]{display:none}
.dw-passin{width:min(560px,100%);max-height:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.dw-passin .dw-sheethd{padding:12px 14px}
#dw-pbody{overflow:auto;padding:12px 14px 18px}
#dw-pbody h3{font-size:12.5px;color:var(--brass2);margin:14px 0 7px}
#dw-pbody h3 small{color:var(--muted);font-weight:400}
.dw-pstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.dw-pstat div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.dw-pstat b{display:block;font-size:17px;color:var(--brass2)}
.dw-pstat small{color:var(--muted);font-size:11px}
.dw-stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px}
.dw-stamp{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px dashed var(--line);background:none;border-radius:13px;padding:9px 4px;font-size:11.5px;color:var(--muted);filter:grayscale(1);opacity:.5}
.dw-stamp span{font-size:24px;line-height:1.1}
.dw-stamp.got{filter:none;opacity:1;border-style:solid;border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.1);color:var(--ink);font-weight:650}
.dw-stamp.cur{border-color:var(--sky)}
.dw-pdetail{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.4);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13.5px;line-height:1.6}
.dw-pdetail small{display:block;color:#bae6fd;font-size:11.5px}
.dw-pdetail p{margin:6px 0 0}
.dw-quiz{text-align:center;padding:6px 2px}
.dw-quiz small{color:var(--muted)}
.dw-quiz h3{font-size:17px!important;color:var(--ink)!important;margin:10px 0 14px!important;line-height:1.5}
.dw-qbig{font-size:54px}
.dw-qopt{display:block;width:100%;border:1.5px solid var(--line);background:var(--panel2);border-radius:13px;padding:12px;margin:7px 0;font-size:15px;font-weight:700;color:var(--ink)}
.dw-qopt.right{border-color:var(--mint);background:rgba(52,211,153,.18);color:#b9f5da}
.dw-qopt.wrong{border-color:var(--coral);background:rgba(251,113,133,.15);color:#ffc2cc}
.dw-qfb{text-align:left;font-size:13px;line-height:1.6;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:11px;padding:9px 11px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="dw-easy">
<div id="dw-app">
  <header class="dw-top">
    <button class="dw-tb" id="dw-exit" type="button" hidden>🏰<span class="dw-lbl"> 返回乐园</span></button>
    <div class="dw-brand"><small>MINEST IMAGINEER 4.0</small><b>✨ 奇想造梦工坊</b></div>
    <input id="dw-title" aria-label="作品名字" maxlength="40">
    <span id="dw-sync" aria-live="polite"></span>
    <button class="dw-tb dw-modebtn" id="dw-pro-toggle" type="button" aria-pressed="false" title="切换轻松模式与专业导演台">🎛<span class="dw-lbl"> 专业台</span></button>
    <button class="dw-tb" id="dw-imag" type="button">🪄<span class="dw-lbl"> AI 造梦</span></button>
    <button class="dw-tb" id="dw-undo" type="button" disabled aria-label="撤销">↶<span class="dw-lbl"> 撤销</span></button>
    <button class="dw-tb" id="dw-works" type="button">📁<span class="dw-lbl"> 作品库</span></button>
    <button class="dw-tb" id="dw-wed" type="button" title="把这个梦搬上 1954 WED 工作室的沙盘">🏛<span class="dw-lbl"> WED 工作坊</span></button>
    <button class="dw-tb" id="dw-shelf" type="button" aria-pressed="false" hidden>🎒</button>
    <button class="dw-tb dw-park" id="dw-place-park" type="button">🏰<span class="dw-lbl"> 放到迪士尼乐园</span></button>
    <button class="dw-tb dw-primary" id="dw-guestbtn" type="button">🌟<span class="dw-lbl"> 走进世界</span></button>
  </header>
  <nav class="dw-steps" id="dw-steps" aria-label="Imagineer 的八个步骤"></nav>
  <div class="dw-mid">
    <div class="dw-stage">
      <canvas id="dw-cv" aria-label="3D 梦想沙盘：拖动空白处转视角，点击或拖动物件自由摆放"></canvas>
      <div id="dw-hint" hidden></div>
      <div class="dw-legend">👆 点选或拖动模型移动 · 拖动空白处转视角 · 滚轮/双指缩放</div>
      <div id="dw-quickbar" hidden></div>
      <div id="dw-toast" role="status" aria-live="polite"></div>
      <div class="dw-ghud">
        <button class="dw-gbtn" id="dw-gback" type="button">← 继续装扮世界</button>
        <div id="dw-gmsg" role="status" aria-live="polite"></div>
        <div id="dw-joy" aria-label="移动摇杆"><div id="dw-knob"></div></div>
        <div class="dw-gacts">
          <button class="dw-gbtn" id="dw-gfirework" type="button">🎆 放烟花</button>
          <button class="dw-gbtn gold" id="dw-gwalk" type="button">🚶 自动游览</button>
          <button class="dw-gbtn pink" id="dw-gpark" type="button">🏰 放到迪士尼乐园</button>
        </div>
        <div class="dw-ghelp">WASD / 摇杆走动 · 拖动看四周 · 点击任何角色或魔法道具互动！</div>
      </div>
    </div>
    <aside class="dw-panel" aria-label="造梦工作台">
      <nav class="dw-tabs-easy" role="tablist" aria-label="三步轻松造梦">
        <button type="button" role="tab" data-etab="ip" aria-selected="true"><span>🌈</span><b>1. 选主题/造梦</b></button>
        <button type="button" role="tab" data-etab="toys" aria-selected="false"><span>🧸</span><b>2. 放模型</b></button>
        <button type="button" role="tab" data-etab="magic" aria-selected="false"><span>🪄</span><b>3. 加魔法</b></button>
      </nav>
      <nav class="dw-tabs dw-tabs-pro" role="tablist" aria-label="专业工作台">
        <button type="button" role="tab" data-tab="story" aria-selected="false"><b>故事</b><small>Story</small></button>
        <button type="button" role="tab" data-tab="model" aria-selected="true"><b>造物</b><small>Model</small></button>
        <button type="button" role="tab" data-tab="behavior" aria-selected="false"><b>赋能</b><small>Behavior</small></button>
        <button type="button" role="tab" data-tab="scene" aria-selected="false"><b>布景</b><small>Scene</small></button>
        <button type="button" role="tab" data-tab="experience" aria-selected="false"><b>导演</b><small>Experience</small></button>
      </nav>
      <div id="dw-body"></div>
    </aside>
  </div>
  <section class="dw-tl" aria-label="演出时间轴">
    <div class="dw-transport">
      <button type="button" id="dw-rew" aria-label="回到开头">⏮</button>
      <button type="button" id="dw-back1" aria-label="后退一秒">−1s</button>
      <button type="button" id="dw-play" aria-label="播放">▶</button>
      <button type="button" id="dw-fwd1" aria-label="前进一秒">+1s</button>
      <span id="dw-time">0.0 / 0 秒</span>
      <span class="dw-sp"></span>
      <button type="button" id="dw-clipdel" disabled aria-label="删除选中的色条">🗑</button>
      <button type="button" id="dw-tltoggle">⏱ 时间轴</button>
    </div>
    <div class="dw-tlgrid">
      <div id="dw-labels"></div>
      <div id="dw-tlscroll"><div id="dw-tracks"></div></div>
    </div>
  </section>
</div>
<div id="dw-isheet" class="dw-sheetwrap" hidden>
  <div class="dw-sheetin" role="dialog" aria-modal="true" aria-label="AI Imagineer">
    <div class="dw-sheethd"><b>✨ AI Imagineer · 奇想造梦师</b><button class="dw-x" id="dw-iclose" type="button" aria-label="关闭">✕</button></div>
    <div id="dw-ibody"></div>
  </div>
</div>
<div id="dw-sheet" hidden>
  <div class="dw-sheetin" role="dialog" aria-modal="true" aria-label="作品库与全部模板">
    <div class="dw-sheethd"><b>📁 我的作品与全部 30 种模板</b><button class="dw-x" id="dw-wclose" type="button" aria-label="关闭">✕</button></div>
    <div id="dw-wbody"></div>
  </div>
</div>
