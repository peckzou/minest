<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦工坊 · Imagineer 3.2</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #workshop { display: block; width: 100%; height: 100%; border: 0; }
    #status { position: fixed; inset: auto 16px 16px; z-index: 2; margin: 0 auto; width: fit-content; max-width: calc(100vw - 48px); padding: 8px 12px; border: 1px solid #777; border-radius: 6px; background: #111; color: #fff; font: 14px/1.4 sans-serif; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <iframe id="workshop" title="梦工坊 · Imagineer 3.2" src="./index.html" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
  <p id="status" role="status" aria-live="polite">正在打开梦工坊 3.2…</p>
  <script>
    (function () {
      var frame = document.getElementById('workshop');
      var status = document.getElementById('status');
      frame.addEventListener('load', function () {
        try {
          var target = frame.contentDocument;
          if (!target || !target.body) throw new Error('page unavailable');
          if (target.getElementById('dw-imagineer-v32-addon')) { status.hidden = true; return; }
          var script = target.createElement('script');
          script.id = 'dw-imagineer-v32-addon';
          script.src = new URL('./dw-imagineer-v3.2.js', frame.contentWindow.location.href).href;
          script.onload = function () { status.hidden = true; };
          script.onerror = function () { status.textContent = '3.2 面板未能载入，请刷新页面重试。'; };
          target.body.appendChild(script);
        } catch (error) {
          status.textContent = '无法载入独立预览，请从 Minest 工作坊页面打开。';
        }
      });
    })();
  </script>
</body>
</html>
