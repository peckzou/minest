    <script>
      /* Hydrate the new wall from the reward state used by the 27.x host. */
      (function () {
        var storageKey = 'minest_badge_wall_30_0_v1';
        var legacyCatalogKey = 'minest_learning_awards_catalog_v27';
        var rewardKey = 'minest_reward_system_v2';
        var strikeKey = 'minest_strike_claimed_v1';
        var challengeKey = 'minest_challenge_wall_v1';
        var strikeMilestones = [3, 7, 14, 30, 40, 50, 60, 80, 90, 100];
        var latestRules = [];
        var readJson = function (key, fallback) {
          try {
            var value = JSON.parse(localStorage.getItem(key) || 'null');

          } catch (error) { return fallback; }
        };
        var addIds = function (set, values) {
          if (!Array.isArray(values)) return;
          values.forEach(function (id) { if (id != null && String(id)) set.add(String(id)); });
        };
        var collectLegacyIds = function () {
          var ids = new Set();
          var catalog = readJson(legacyCatalogKey, []);
          if (Array.isArray(catalog)) catalog.forEach(function (badge) {
            if (badge && (badge.state === 'unlocked' || badge.isUnlocked) && badge.id) ids.add(String(badge.id));
          });
          var rewards = readJson(rewardKey, null);
          addIds(ids, rewards && rewards.collectedIds);
          var challenge = readJson(challengeKey, null);
          addIds(ids, challenge && challenge.unlockedIds);
          var claimed = readJson(strikeKey, []);
          if (Array.isArray(claimed)) claimed.forEach(function (days) {
            if (strikeMilestones.indexOf(Number(days)) >= 0) ids.add('strike-' + Number(days) + '-days');
          });
          return ids;
        };
        var readCurrentIds = function () {
          var saved = readJson(storageKey, []);
          var ids = new Set();
          addIds(ids, Array.isArray(saved) ? saved : saved && saved.unlockedIds);
          return ids;
        };
        var persist = function (ids) {
          try { localStorage.setItem(storageKey, JSON.stringify(Array.from(ids))); } catch (error) {}
        };
        var persistedRules = readJson('minest_badge_unlock_rules_v1', []);
        if (Array.isArray(persistedRules)) latestRules = persistedRules;
        var unlocked = readCurrentIds();
        var claimedIds = collectLegacyIds();
        claimedIds.forEach(function (id) { unlocked.add(id); });
        /* 31.5: badges unlock on the wall only after a real claim. Earlier
           builds also unlocked the three ring-rule badges and Strike
           milestones straight from progress, skipping the claim ceremony.
           Drop those entries unless a claim record backs them. */
        var ruleIds = ['perfect-week-focus', 'perfect-week-review', 'daily-ring-200-percent'];
        (Array.isArray(latestRules) ? latestRules : []).forEach(function (rule) { if (rule && rule.badgeId) ruleIds.push(String(rule.badgeId)); });
        Array.from(unlocked).forEach(function (id) {
          var autoOnly = ruleIds.indexOf(id) >= 0 || /^strike-\d+-days$/.test(id);
          if (autoOnly && !claimedIds.has(id)) unlocked.delete(id);
        });
        persist(unlocked);
        var notifyUnlock = function (id) {
          var value = String(id || '');
          if (!value || unlocked.has(value)) return;
          unlocked.add(value);
          persist(unlocked);
          window.postMessage({ type: 'MINEST_TRIGGER_UNLOCK', badgeId: value }, '*');
        };
        var numeric = function (value) {
          var number = Number(value);
          return Number.isFinite(number) ? number : 0;
        };
        var applyRules = function (data) {
          /* 31.5: progress no longer unlocks badges directly. Ring rewards and
             Strike milestones reach the wall only through their claim flow

          return;
          var progress = data && data.progress && typeof data.progress === 'object' ? data.progress : {};
          var explicitRules = Array.isArray(data && data.rules);
          if (explicitRules) latestRules = data.rules;
          else if (data.type === 'minest:award-progress') {
            var savedRules = readJson('minest_badge_unlock_rules_v1', []);
            if (Array.isArray(savedRules)) latestRules = savedRules;
          }
          var fallbackRules = [
            { badgeId: 'perfect-week-focus', metric: 'focusMinutes', target: 30 },
            { badgeId: 'perfect-week-review', metric: 'checkCount', target: 10 },
            { badgeId: 'daily-ring-200-percent', metric: 'goalPercent', target: 100 }
          ];
          var rules = explicitRules || data.type === 'minest:award-progress' ? (latestRules.length ? latestRules : fallbackRules) : [];
          rules.forEach(function (rule) {
            if (!rule || !rule.badgeId || !rule.metric) return;
            if (numeric(progress[rule.metric]) >= numeric(rule.target)) notifyUnlock(rule.badgeId);
          });
          var qualifiedDates = Array.isArray(progress.qualifiedDates) ? Array.from(new Set(progress.qualifiedDates)) : [];
          var ringClosed = numeric(progress.focusMinutes) >= numeric(progress.targetMinutes || 30) ||
            numeric(progress.checkCount) >= numeric(progress.targetChecks || 10) || numeric(progress.goalPercent) >= 100;
          if (ringClosed && progress.date && qualifiedDates.indexOf(progress.date) < 0) qualifiedDates.push(progress.date);
