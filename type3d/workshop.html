<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Type Workshop</title>
<style>
:root{--ink:#f1e7d8;--dim:rgba(241,231,216,.52);--faint:rgba(241,231,216,.16);--g:#ff5a2a;--panel:rgba(18,12,8,.76);--warn:#ffb36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0806;color:var(--ink);overflow:hidden;
  font:500 11px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.film{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.hud{position:fixed;color:var(--dim);pointer-events:none}
.hud.i{pointer-events:auto}
.b{all:unset;cursor:pointer;color:var(--dim);border-bottom:1px solid transparent;padding-bottom:1px;white-space:nowrap}
.b:hover{color:var(--ink)}
.b.on{color:var(--ink);border-bottom-color:var(--g)}
.b:disabled{opacity:.35;cursor:default}
#top{left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;gap:16px;align-items:baseline}
#back{color:var(--ink)}
#top b{color:var(--ink);font-weight:600}
#badge{color:var(--warn);border:1px solid rgba(255,179,107,.35);padding:0 6px;font-size:10px}
#tabs{left:max(16px,env(safe-area-inset-left));top:calc(max(14px,env(safe-area-inset-top)) + 26px);display:flex;gap:16px}
#ctl{right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#ctl .row{display:flex;gap:12px;align-items:baseline}
#modes{flex-wrap:wrap;justify-content:flex-end;row-gap:5px;max-width:min(470px,calc(100vw - 230px))}
.lab{opacity:.55}
.panel{position:fixed;left:max(16px,env(safe-area-inset-left));top:calc(max(14px,env(safe-area-inset-top)) + 54px);width:min(350px,calc(100vw - 32px));
  max-height:calc(100vh - 230px);overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--faint);padding:12px 14px 14px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--dim)}
.panel[hidden]{display:none}
.panel h3{margin:0 0 8px;font:inherit;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--faint)}
.row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0}
.lst{cursor:pointer}.lst:hover,.lst.on{color:var(--ink)}.lst.on>span:first-child::before{content:'▸ '}
.chips{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
.chip{cursor:pointer;letter-spacing:.12em}
.chip.made{opacity:.45;text-decoration:line-through}
.chip.tgt{color:var(--ink);border-bottom:1px solid var(--g)}
.panel input,.panel textarea,.panel select{display:block;width:100%;background:rgba(0,0,0,.35);border:1px solid var(--faint);color:var(--ink);font:inherit;letter-spacing:.06em;
  text-transform:none;padding:6px 8px;margin:4px 0 8px;-webkit-user-select:text;user-select:text;border-radius:0}
.panel textarea{height:96px;resize:vertical}
.acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:3px}
.item{padding:7px 0 7px 2px;border-top:1px solid rgba(241,231,216,.07);cursor:pointer}
.item.sel{background:rgba(255,255,255,.04);box-shadow:inset 2px 0 0 var(--g);padding-left:8px}
.item .w{color:var(--ink);letter-spacing:.22em}
.item .s{text-transform:none;letter-spacing:.05em;opacity:.85}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.card{margin-top:6px;padding:8px;border:1px solid var(--faint);text-transform:none;letter-spacing:.04em;font-size:10.5px;line-height:1.6;word-break:break-all;cursor:default}
.card div span{opacity:.6;display:inline-block;min-width:78px}
.warn{color:var(--warn)}
.muted{opacity:.6;text-transform:none;letter-spacing:.05em}
#tgt{left:0;right:0;bottom:max(54px,calc(env(safe-area-inset-bottom) + 30px));text-align:center;padding:0 16px}
#tgt b{color:var(--ink);letter-spacing:.3em;font-weight:600}
#tgt .warn{text-transform:none;letter-spacing:.05em}
#line{left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;color:var(--ink);letter-spacing:.32em;white-space:pre;overflow:hidden;padding:0 24px}
#line .bad{color:var(--warn)}
#line .caret{display:inline-block;width:.6em;height:1px;background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#hint{left:0;right:0;bottom:max(80px,calc(env(safe-area-inset-bottom) + 56px));text-align:center;transition:opacity .8s;padding:0 16px}
#hint.off{opacity:0}
#flow{left:0;right:0;bottom:calc(max(86px,calc(env(safe-area-inset-bottom) + 62px)) + var(--tkbh,0px));display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 10px;pointer-events:none;z-index:4}
#flow button{pointer-events:auto;min-width:64px;height:54px;padding:4px 12px;border-radius:12px;border:1.5px solid #b89154;background:linear-gradient(#3a2618,#1c120b);color:#f3e6cc;
  font:700 14px/1.15 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 #4a3216,0 6px 14px rgba(0,0,0,.4);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#flow button small{font:600 9px/1 "Courier New",monospace;letter-spacing:.1em;opacity:.7}
#flow button.on{background:linear-gradient(#a3471d,#5e2410);border-color:#ffb36b;box-shadow:0 1px 0 #4a3216,0 0 16px rgba(255,120,40,.45);transform:translateY(2px)}
#flow button.ready{border-color:#6dff8e;box-shadow:0 3px 0 #1f4a26,0 0 18px rgba(80,255,120,.45)}
#flow button.wide{flex-direction:row;height:44px}
#flow .walk{color:var(--ink);letter-spacing:.08em;padding:12px}
#hint{bottom:calc(158px + var(--tkbh,0px))!important}

/* the on-screen typewriter keyboard: round keycaps on a thin strip at the bottom; the work stays above it */
#tkb{position:fixed;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));width:min(600px,calc(100vw - 16px));z-index:5;
  padding:8px 8px 9px;border-radius:14px;background:linear-gradient(#2a1b12,#1a110b);border:1px solid rgba(214,170,98,.35);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,160,.12);
  display:flex;flex-direction:column;gap:5px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#tkb[hidden]{display:none}
#tkb .r{display:flex;justify-content:center;gap:5px}
#tkb button{--s:min(9vw,46px);width:var(--s);height:var(--s);border-radius:50%;border:2px solid #b89154;background:radial-gradient(circle at 40% 32%,#3a3632,#0d0c0b 70%);
  color:#efe4cc;font:600 calc(var(--s)*.38)/1 "Courier New",ui-monospace,monospace;padding:0;cursor:pointer;box-shadow:0 3px 0 #5a3d1c,0 4px 6px rgba(0,0,0,.5);transition:transform .05s,box-shadow .05s}
#tkb button.dn,#tkb button:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3d1c,0 2px 3px rgba(0,0,0,.5)}
#tkb button.w{width:auto;padding:0 12px;border-radius:calc(var(--s)*.5);font-size:calc(var(--s)*.3);letter-spacing:.08em}
#tkb button.sp{flex:1;max-width:260px;border-radius:calc(var(--s)*.5)}
@media (max-width:560px){#top{flex-direction:column;align-items:flex-start;gap:4px} #badge{font-size:8px;letter-spacing:.04em} #top .ttl{display:none} #tabs{top:calc(max(14px,env(safe-area-inset-top)) + 82px)} #modes .lab{display:none} .panel{top:calc(max(14px,env(safe-area-inset-top)) + 108px)}}
body.tkb #line{bottom:calc(var(--tkbh,0px) + 14px)} body.tkb #tgt{bottom:calc(var(--tkbh,0px) + 40px)} body.tkb #hint{display:none}
#note{left:50%;top:36%;transform:translateX(-50%);color:var(--ink);background:var(--panel);border:1px solid var(--faint);padding:8px 14px;text-transform:none;letter-spacing:.05em;
  opacity:0;transition:opacity .35s;max-width:calc(100vw - 40px);text-align:center}
#note.on{opacity:1}
#err{left:0;right:0;top:46%;text-align:center;color:var(--ink);display:none;text-transform:none;letter-spacing:.04em}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;background:transparent;color:transparent;font-size:16px}
@media (max-width:560px){#top .ttl{display:none}.panel{max-height:44vh}#hint{display:none}}
@media (prefers-reduced-motion:reduce){#line .caret{animation:none}}

/* 2026-11-13 · the mode is chosen the way 3D Type chooses its world: one small name, top centre, ‹ › either side (a swipe
   on the name works too); the gas / colour beneath it the same way. The old rows stay in the page, hidden. */
#modes,#gas,#ctl .lab{display:none!important}
#msw{position:fixed;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 30px);transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:1px;
  font:500 11px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,231,216,.88);user-select:none;-webkit-user-select:none}
#msw .row{display:flex;align-items:center;gap:4px}
#msw button{all:unset;cursor:pointer;color:rgba(241,231,216,.5);padding:3px 9px;font:inherit;letter-spacing:inherit}#msw button:hover{color:#fff}
#msw .nm{min-width:7.5em;text-align:center;font-weight:600;color:#fff;white-space:nowrap;touch-action:pan-y;cursor:grab}
#msw .sub{font-size:9.5px}#msw .sub .nm{min-width:5em;font-weight:500;color:var(--g)}
#msw .nm.go{animation:mswg .3s ease}@keyframes mswg{from{opacity:.2;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
@media (max-width:560px){#msw{top:calc(max(14px,env(safe-area-inset-top)) + 2px)}}
@media (max-width:980px) and (min-width:561px){#top .ttl{display:none}}
/* the work controls are switches: a lever that drops, a valve wheel that turns, a toggle that flips, a red mushroom
   PACK button, a rotary AUTO knob — each on a small engraved plate. Tap the switch itself (or the one on the station). */
#flow button{min-width:62px;height:66px;padding:6px 8px 5px;border-radius:10px;border:1.5px solid #6a4a26;background:linear-gradient(#2a1b12,#130c07);gap:5px;box-shadow:0 3px 0 #3a2410,0 6px 14px rgba(0,0,0,.4)}
#flow button.on{background:linear-gradient(#2a1b12,#130c07);border-color:#c98a3a;box-shadow:0 3px 0 #3a2410,0 0 14px rgba(255,150,60,.35);transform:none}
#flow button small{font:700 8.5px/1 "Courier New",monospace;letter-spacing:.16em;color:#d9b46a;opacity:.9;padding:1px 4px;border:1px solid rgba(217,180,106,.35);border-radius:2px}
#flow button.wide{flex-direction:column;height:66px;min-width:84px}
#flow i.sw{position:relative;display:block;width:30px;height:32px;font-style:normal}
#flow i.sw::before,#flow i.sw::after{content:'';position:absolute;transition:all .18s}
.sw-lever::before{left:13px;top:1px;width:4px;height:30px;border-radius:2px;background:#050302;box-shadow:inset 0 0 0 1px #6a4a26}
.sw-lever::after{left:5px;top:0;width:20px;height:12px;border-radius:6px;background:radial-gradient(circle at 40% 35%,#ff7a4a,#8a1a10);box-shadow:0 2px 0 #3a0a06}
#flow button.on .sw-lever::after{top:20px}
.sw-valve::before{left:2px;top:3px;width:26px;height:26px;border-radius:50%;border:4px solid #c9a24a;box-sizing:border-box}
.sw-valve::after{left:7px;top:8px;width:16px;height:16px;background:linear-gradient(#c9a24a,#c9a24a) center/4px 100% no-repeat,linear-gradient(#c9a24a,#c9a24a) center/100% 4px no-repeat}
#flow button.on .sw-valve::before{border-color:#6dff8e;transform:rotate(90deg)}#flow button.on .sw-valve::after{transform:rotate(45deg)}
.sw-toggle::before{left:1px;top:8px;width:28px;height:16px;border-radius:8px;background:#050302;box-shadow:inset 0 0 0 1px #6a4a26}
.sw-toggle::after{left:3px;top:10px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f3efe6,#8a8a8a)}
#flow button.on .sw-toggle::before{background:#2f7a2a}#flow button.on .sw-toggle::after{left:15px}
.sw-pack::before{left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#ff5a4a,#8a120a 70%);box-shadow:0 4px 0 #3a0806}
#flow button.ready .sw-pack::before{background:radial-gradient(circle at 40% 32%,#7dff9a,#127a2a 70%);box-shadow:0 4px 0 #0a3a14,0 0 14px rgba(80,255,120,.6)}
#flow button:active .sw-pack::before{top:5px;box-shadow:0 1px 0 #3a0806}
.sw-auto::before{left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4038,#120c08);box-shadow:inset 0 0 0 2px #c9a24a}
.sw-auto::after{left:14px;top:5px;width:2px;height:10px;background:#f3e6cc;transform-origin:1px 10px;transform:rotate(-50deg)}
#flow button.on .sw-auto::after{transform:rotate(50deg);background:#ffb36b}#flow button.on .sw-auto::before{box-shadow:inset 0 0 0 2px #ffb36b,0 0 10px rgba(255,170,80,.5)}
.sw-key::before{left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#3a3632,#0d0c0b 70%);box-shadow:0 0 0 2px #b89154,0 3px 0 #5a3d1c}
.sw-key::after{left:9px;top:12px;width:12px;height:2px;background:#efe4cc;box-shadow:-2px -2px 0 -0px transparent}
.sw-brass::before{left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#ffe7a0,#9a6a1a 70%);box-shadow:0 3px 0 #4a3216}
.sw-go::before{left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#9dffb0,#1a7a3a 70%);box-shadow:0 3px 0 #0a3a14}
#flow button:active i.sw::before{filter:brightness(1.15)}
</style>

<body>
<canvas id="gl"></canvas>
<div class="film"></div>
<div class="hud i" id="top"><button class="b" id="back" type="button" tabindex="-1">⟵ Back</button><span class="ttl"><b>Magic Type Workshop</b></span><span id="badge" hidden>local only</span></div>
<div class="hud i" id="tabs"><button class="b" id="tabLists" type="button" tabindex="-1">Lists</button><button class="b" id="tabInv" type="button" tabindex="-1">Inventory <span id="invN"></span></button></div>
<div class="hud i" id="ctl">
  <div class="row"><button class="b" id="viewBtn" type="button" tabindex="-1" title="Tab">View · 3rd</button></div>
  <div class="row" id="modes"><span class="lab">Pipe wall</span></div>
  <div class="row" id="gas"><button class="b" type="button" tabindex="-1" data-gas="neon" title="Neon">NE</button><button class="b" type="button" tabindex="-1" data-gas="argon" title="Argon">AR</button><button class="b" type="button" tabindex="-1" data-gas="helium" title="Helium">HE</button><button class="b" type="button" tabindex="-1" data-gas="xenon" title="Xenon">XE</button></div>
</div>
<section class="panel hud i" id="pLists" hidden></section>
<section class="panel hud i" id="pInv" hidden></section>
<div class="hud" id="hint">Tap the typewriter to type · Return after each word · Tab switches the view</div>
<div class="hud" id="tgt"></div>
<div class="hud" id="line"><span id="txt"></span><span class="caret"></span></div>
<div class="hud" id="note"></div>
<div id="tkb" hidden aria-label="Typewriter keyboard"></div>
<div class="hud" id="flow"></div>
<div class="hud" id="err"></div>
<input id="kb" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Type here">

<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { strokeGlyph, strokeAdvance, STROKE_CHARS } from './strokefont.js';

/* ==== PURE:BEGIN — no DOM, no three.js: this block is unit-tested in node ==== */
const SIZE = 1.5, GAP = 0.34, BASE_Y = 0.42, STAND_Z = -0.52;        // letter units, as in neon.html
const WORD_TOP = BASE_Y + SIZE + 0.26;      // the upper bus bar of the stands: where the gripper holds a word
const WORD_H = WORD_TOP + 0.1, WORD_D = 0.8, PLANK_H = 0.066;
const MAX_WORD = 24, MAX_FORMING = 3;
const PACK_W = 0.27, PACK_H = 0.13, SLOT_W = 0.36, SLOT_H = 0.26;   // metres
const SHELVES = [{ id: 'main', cols: 5, rows: 4 }];                  // every shelf the workshop owns (more can be added)
const SAMPLE_TITLE = 'Sample · ten words';
const SAMPLE_WORDS = ['DREAM', 'OCEAN', 'LIGHT', 'MAGIC', 'HOPE', 'WONDER', 'CREATE', 'EXPLORE', 'DISCOVER', 'IMAGINE'];
const NOT_SUPPORTED = 'This character is not supported yet';
const GAS_KEYS = ['neon', 'argon', 'helium', 'xenon'];
let _seq = 0;
const rid = () => Date.now().toString(36) + (++_seq).toString(36) + Math.random().toString(36).slice(2, 7);
const uid = p => p + rid();
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));

/* glyph lookup: every script the workshop can build goes through these functions (add more SCRIPTS later) */
const STROKE_SET = new Set(STROKE_CHARS);
const SCRIPTS = [{ id: 'latin-stroke', has: c => STROKE_SET.has(c), glyph: c => strokeGlyph(c) }];
function normChar(raw) {
  let s = String(raw ?? ''); if (s === ' ') s = ' ';
  if (s === ' ') return ' ';
  if ([...s].length !== 1) return null;
  const c = s.toUpperCase(); if ([...c].length !== 1) return null;
  for (const sc of SCRIPTS) if (sc.has(c)) return c;
  return null;
}
function glyphFor(c) { for (const sc of SCRIPTS) if (sc.has(c)) return sc.glyph(c); return null; }

/** the typed word and the pieces built for it are one array: the text is derived from it, so they can never disagree */
class WordBuffer {
  constructor(h = {}) { this.h = h; this.items = []; this.cursorX = 0; this.max = h.max || MAX_WORD; }
  get text() { let s = ''; for (const it of this.items) s += it.ch; return s; }
  get length() { return this.items.length; }
  get letterCount() { let n = 0; for (const it of this.items) if (it.ch !== ' ') n++; return n; }
  get width() { const l = this.items[this.items.length - 1]; return Math.max(0.4, this.cursorX - (l && l.ch !== ' ' ? GAP : 0)); }
  /** → 'ok' | 'unsupported' | 'full' | 'ignored' */
  push(raw) {
    const ch = normChar(raw); if (ch === null) return 'unsupported';
    const last = this.items[this.items.length - 1];
    if (ch === ' ' && (!last || last.ch === ' ')) return 'ignored';
    if (this.items.length >= this.max) return 'full';
    const x = this.cursorX, adv = ch === ' ' ? strokeAdvance(' ') * SIZE : glyphFor(ch).w * SIZE + GAP;
    const it = { ch, x, adv, obj: null }; this.items.push(it); this.cursorX = x + adv;
    if (ch !== ' ' && this.h.make) it.obj = this.h.make(ch, x);
    return 'ok';
  }
  pop() { const it = this.items.pop(); if (!it) return false; this.cursorX = it.x; if (it.obj && this.h.kill) this.h.kill(it.obj); return true; }
  trimEnd() { while (this.items.length && this.items[this.items.length - 1].ch === ' ') this.pop(); }
}
/** start queued letters in order, a few at a time; the longer the backlog the faster they all run */
function scheduleLetters(tubes, maxForming, fast) {
  let forming = 0, unsettled = 0;
  for (const L of tubes) { if (!L.settled) unsettled++; if (L.state === 'stand' || L.state === 'form') forming++; }
  for (const L of tubes) { if (forming >= maxForming) break; if (L.state === 'queued') { L.start(); forming++; } }
  return Math.min(5, (fast ? 1.8 : 1) * (1 + 0.45 * Math.max(0, unsettled - 2)));
}
function wordUnits(word) { const b = new WordBuffer({ max: 999 }); for (const c of String(word)) b.push(c); b.trimEnd(); return b.width; }
/** a word's size in its box: the scale of the sculpture, the box, and how much the box shrinks to fit a shelf slot */
function packDims(word) {
  const W = wordUnits(word), s = Math.min(PACK_W / W, PACK_H / WORD_H);
  const w = W * s + 0.07, h = WORD_H * s + 0.06, d = Math.max(0.15, WORD_D * s + 0.09);
  return { W, s, w, h, d, fit: Math.min(1, (SLOT_W - 0.04) / w, (SLOT_H - 0.05) / h) };
}

/* lists, progress, items, slots */

  build(word, look) { const S = new Sculpture(gasOK(look && look.gas), 0.05, id); for (const c of String(word)) S.buf.push(c); S.finish(); return S; },

const modeOf = it => MODES[it && it.mode] || MODES.neon;

let job = null, focusObj = null;
const paperLines = [];
const byId = id => DB.items.find(it => it.id === id) || null;

const _fw = V();

}
let cur = newCur();

let noteT = 0;
function notice(msg) { const n = $('note'); n.textContent = msg; n.classList.add('on'); clearTimeout(noteT); noteT = setTimeout(() => n.classList.remove('on'), 2800); }

}
const isBusy = () => !!(job || jobs.length || travellers.length || waiting.length || pendingSaves || !cur.allSettled());

/* ───────────── typing ───────────── */

}

function afterEdit() { if (flow.phase === 'type') { tw.setColumn(flow.draft.length); tw.drawPaper(flow.order, flow.draft); } renderLine(); renderTarget(); renderFlow(); }
/** Enter: the item is recorded and saved at once; the finishing, boxing and shelving follow as animation */
function enter() {

  cur.buf.trimEnd();
  if (!cur.buf.letterCount) { while (cur.buf.pop()); afterEdit(); return null; }
  const word = cur.buf.text, list = currentList(), tgt = targetEntry(), loc = allocSlot(DB.items);
  const item = makeItem({ word, listId: list ? list.id : null, entryId: tgt ? tgt.id : null, mode: cur.mode, gas: cur.gasKey, loc });
  DB.items.push(item); inFlight.add(item.id); persist(item);

/* ───────────── logistics: one job owns the gripper and packing table; boxes travel on their own ───────────── */

  } catch (e) {

function* wait(d) { let t = 0; while (t < d) t += yield; }
function* tween(d, f) { let t = 0; f(0); while (t < d) { t += yield; f(Math.min(1, t / d)); } }

function crateHome(it) {

    const c = L.slot % SHELF.cols, rb = SHELF.rows - 1 - Math.floor(L.slot / SHELF.cols);

/** (1)(2) finish + surge, (4) gripper carries the word to the packing table, then boxAndShip */

/* ───────────── item actions ───────────── */
function takeOut(id) {
  const it = byId(id); if (!it) return false;
  if (inFlight.has(id)) { notice(BUSY_MSG); return false; }
  const k = it.loc && it.loc.kind;
  if (k === 'room' || k === 'city' || it.use === 'displayed') { notice('On display elsewhere — recall it first'); return false; }
  if (it.use === 'out') { selectItem(id); return true; }
  const other = DB.items.find(x => x !== it && x.use === 'out' && x.loc && x.loc.kind === 'bench' && !inFlight.has(x.id));
  const otherDone = other ? putBack(other.id, { quiet: true }) : true;      // one item on the bench at a time
  it.use = 'out'; it.pack = 'open'; it.loc = { kind: 'bench' };
  if (other && !otherDone) putBack(other.id);                               // the shelf was full: it takes the slot just freed
  persist(it); inFlight.add(id); enqueue('takeout', takeOutJob(it), id);
  ui.selected = id; renderAll(); return true;
}
function putBack(id, opt = {}) {
  const it = byId(id); if (!it) return false;
  if (inFlight.has(id)) { notice(BUSY_MSG); return false; }
  const k = it.loc && it.loc.kind;
  if (k === 'room' || k === 'city' || it.use === 'displayed') return recall(id);
  if (it.use === 'stored' && k === 'shelf') return true;
  const loc = allocSlot(DB.items, SHELVES, id); if (!loc) { if (!opt.quiet) notice(FULL_MSG); return false; }
  const wasOut = it.use === 'out';
  it.use = 'stored'; it.pack = 'boxed'; it.loc = loc; persist(it); inFlight.add(id);
  if (wasOut) { const S = bench.id === id ? bench.S : null; if (bench.id === id) { bench.id = null; bench.S = null; } enqueue('putback', putBackJob(it, S), id); }
  else {
    const c = shelfBoxes.get(id); shelfBoxes.delete(id);
    if (c) startTraveller((function* () { const h = crateHome(it); yield* glide(c.group, V(h.pos.x, h.pos.y, -0.56), 1.0, 0.3, h.scale); yield* glide(c.group, h.pos, 0.4);
      c.homeKey = h.key; inFlight.delete(id); shelfBoxes.set(id, c); syncShelf(); renderInv(); })());
    else { inFlight.delete(id); syncShelf(); }
  }
  renderAll(); return true;
}
/** explicit "recall to workshop": the only way the workshop rewrites an item displayed elsewhere */
function recall(id) {
  const it = byId(id); if (!it) return false;
  if (inFlight.has(id)) { notice(BUSY_MSG); return false; }
  const loc = allocSlot(DB.items, SHELVES, id); if (!loc) { notice(FULL_MSG); return false; }
  if (bench.id === id) { const S = bench.S; bench.id = null; bench.S = null; it.use = 'stored'; it.pack = 'boxed'; it.loc = loc; persist(it); inFlight.add(id); enqueue('putback', putBackJob(it, S), id); renderAll(); return true; }
  it.use = 'stored'; it.pack = 'boxed'; it.loc = loc; persist(it); inFlight.add(id);
  enqueue('recall', boxAndShip(null, it, packDims(it.word)), id);
  renderAll(); return true;
}
async function displayItem(id, where, shop = null) {
  const it = byId(id); if (!it) return false;
  if (inFlight.has(id)) { notice(BUSY_MSG); return false; }
  if (where === 'shelf') return putBack(id);
  let rec;
  try { rec = await Store.display(id, where, where === 'room' ? { room: 'mtw' } : { shop }); }
  catch (e) { notice('Could not display — ' + e.message); return false; }
  Object.assign(it, rec);
  if (bench.id === id) { const S = bench.S; bench.id = null; bench.S = null; if (S) startTraveller(sendOff(S)); }
  ui.shopPick = null;
  notice(Store.kind === 'local' ? 'Saved locally — the room / city display appears only inside Minest'
    : where === 'room' ? 'Displayed in the Type Workshop room' : 'Hung as a City shop sign');
  syncShelf(); syncBench(); renderAll(); return true;
}
async function removeItem(id) {
  const it = byId(id); if (!it) return false;
  if (inFlight.has(id)) { notice(BUSY_MSG); return false; }
  DB.items.splice(DB.items.indexOf(it), 1);
  const c = shelfBoxes.get(id);
  if (c) { shelfBoxes.delete(id); const s0 = c.group.scale.x; startTraveller((function* () { yield* tween(0.35, e => c.group.scale.setScalar(Math.max(0.001, s0 * (1 - e)))); c.dispose(); })()); }

  if (ui.selected === id) ui.selected = null; ui.confirmDel = null; ui.details = null;
  syncShelf(); renderAll();
  pendingSaves++;
  try { await Store.removeItem(id); } catch (e) { notice('Delete failed — ' + e.message); } finally { pendingSaves--; }
  return true;
}

/* ───────────── the shelf and the bench, rebuilt from data ───────────── */
function tagTexture(it) {
  return canvasTex(128, 96, (x, w, h) => {
    x.fillStyle = '#9b7231'; x.fillRect(0, 0, w, h); x.strokeStyle = '#5b3d12'; x.lineWidth = 4; x.strokeRect(2, 2, w - 4, h - 4);
    x.fillStyle = '#2d1c08'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '700 13px ui-monospace, Menlo, monospace'; x.fillText('ON DISPLAY', w / 2, 20);
    let fs = 24; x.font = `700 ${fs}px ui-monospace, Menlo, monospace`; while (x.measureText(it.word).width > w - 14 && fs > 9) { fs -= 1; x.font = `700 ${fs}px ui-monospace, Menlo, monospace`; }
    x.fillText(it.word, w / 2, 50); x.font = '600 12px ui-monospace, Menlo, monospace'; x.fillText(it.loc && it.loc.kind === 'city' ? 'ON SHOW · CITY' : 'ON SHOW · ROOM', w / 2, 78);
  });
}

  for (const it of DB.items) { if (inFlight.has(it.id)) continue; const h = crateHome(it); if (h) want.set(it.id, { it, h }); }
  for (const [id, c] of shelfBoxes) {
    if (inFlight.has(id)) continue; const w = want.get(id);
    if (!w) { c.dispose(); shelfBoxes.delete(id); }
    else if (c.homeKey !== w.h.key) { c.group.position.copy(w.h.pos); c.group.scale.setScalar(w.h.scale); c.homeKey = w.h.key; }
  }
  for (const [id, { it, h }] of want) if (!shelfBoxes.has(id)) {
    const c = new Crate(it, packDims(it.word), listTitleOf(it)); c.compact(); c.group.position.copy(h.pos); c.group.scale.setScalar(h.scale); c.homeKey = h.key; shelfBoxes.set(id, c);
  }
  // items on display elsewhere leave a small brass tag in a free slot (counted from the end of the shelf)
  const shown = DB.items.filter(it => it.use === 'displayed' || (it.loc && (it.loc.kind === 'room' || it.loc.kind === 'city'))).sort((a, b) => (a.made || 0) - (b.made || 0));
  const taken = new Set(); for (const it of DB.items) if (it.loc && it.loc.kind === 'shelf' && it.loc.shelf === 'main') taken.add(it.loc.slot);
  const free = []; for (let i = SHELF.cols * SHELF.rows - 1; i >= 0; i--) if (!taken.has(i)) free.push(i);
  const keep = new Set();
  shown.forEach((it, i) => {
    if (i >= free.length) return; const slot = free[i], key = it.id + ':' + slot + ':' + it.loc.kind + ':' + it.word; keep.add(it.id);
    let t = tags.get(it.id); if (t && t.key !== key) { t.m.geometry.dispose(); t.m.material.map.dispose(); t.m.material.dispose(); t.m.removeFromParent(); t = null; }
    if (!t) { const m = mesh(new THREE.PlaneGeometry(0.12, 0.09), std({ map: tagTexture(it), roughness: 0.4, metalness: 0.5, envMapIntensity: 0.6 }), scene);
      const c = slot % SHELF.cols, rb = SHELF.rows - 1 - Math.floor(slot / SHELF.cols); m.position.set(SHELF.x0 + SHELF.colW * (c + 0.5), SHELF.y0 + rb * SHELF.rowH + 0.06, SHELF.z - 0.17); m.userData.itemId = it.id;
      tags.set(it.id, t = { m, key }); }
  });

}

function syncBench() {
  if (job && (job.kind === 'takeout' || job.kind === 'putback')) return;
  let want = null;
  for (const it of DB.items) if (it.use === 'out' && it.loc && it.loc.kind === 'bench' && !inFlight.has(it.id) && (!want || (it.updated || 0) > (want.updated || 0))) want = it;
  if (bench.id && (!want || want.id !== bench.id)) { if (bench.S) bench.S.dispose(); bench.S = null; bench.id = null; }

/* ───────────── camera: first / third person over one scene ───────────── */
const _sf = new THREE.Vector3();
const cam = { blend: 1, focus: V(0, 0.98, -0.45), raw: V(), fp: V(), fpT: V(), tp: V(), tpT: V(), look: V() };
function workFocus(out) {
  if (grip.owner === 'job') return out.set(grip.x, grip.y - 0.12, RAIL_Z);
  if (focusObj) return out.copy(focusObj.position).setY(focusObj.position.y + 0.1);
  const f = cur.formingLetter(); if (f) return cur.letterWorld(f, out);
  if (ui.selected) { const c = shelfBoxes.get(ui.selected); if (c) return out.copy(c.group.position).setY(c.group.position.y + 0.1); if (bench.id === ui.selected) return out.set(DISPLAY.x, DISPLAY.y + 0.1, RAIL_Z); }

  cam.tpT.set(lerp(0.25, f.x, away ? 0.85 : 0.55), lerp(0.98, f.y, 0.3), -0.38);
  cam.tp.set(cam.tpT.x + 1.9 * k + sway * Math.sin(time * 0.13) * 0.08, cam.tpT.y + 1.15 * k, cam.tpT.z + 2.0 * k);   // from the front-right: the work sits mid-frame, the typist at the left side, never on the line between
  if (flow.phase !== 'type' && !away) {   // at the station: a front view with the typist, the controls and the platform all in frame
    cam.wk = Math.min(1, (cam.wk || 0) + dt / 1.2);

  if (cam.wk > 0) { const w = sm(cam.wk); _sf.set(-0.38, 0.98, -0.05); cam.tpT.lerp(_sf, w); _sf.set(-0.38 + 1.25 * k, 0.98 + 1.55 * k, -0.05 + 2.95 * k); cam.tp.lerp(_sf, w); }

  hero.headMesh.visible = b > 0.15;
}

/* ───────────── frame ───────────── */
function poseCur(dt) {
  const ts = Math.min(0.12, 1.05 / cur.buf.width); cur.s += (ts - cur.s) * (1 - Math.exp(-dt * 4));
  cur.root.position.set(PLAT.x, PLAT.y + PLANK_H * cur.s, RAIL_Z + 0.52 * cur.s);
}
function poseWaiting(dt) {
  const k = 1 - Math.exp(-dt * 4), n = waiting.length;
  for (let i = 0; i < n; i++) { const S = waiting[i], li = (cur.buf.length ? 1 : 0) + (n - 1 - i), ts = S.baseS * (li ? 0.6 : 1);
    S.s += (ts - S.s) * k; const p = S.root.position, ty = PLAT.y + PLANK_H * S.s + li * 0.32;
    p.x += (PLAT.x - p.x) * k; p.y += (ty - p.y) * k; p.z = RAIL_Z + 0.52 * S.s; }
}
function gripFollow(time) {

  const f = cur.formingLetter();
  if (f) { cur.letterWorld(f, _fw); grip.tx = _fw.x; grip.ty = PLAT.y + (PLANK_H + WORD_TOP + 0.45) * cur.s; grip.topen = 0.55 + 0.35 * Math.sin(time * 18); }

}
const DT_MAX = Math.min(1, Number(new URLSearchParams(location.search).get('dtmax')) || 0.05);   // tests on a slow machine may allow longer steps

    if (!reduce) turntable.rotation.y = 0.32 * Math.sin(time * 0.45);
    rig.update(dt, time, ui.gas, !!cur.formingLetter());

}

/* ───────────── start ───────────── */
async function refresh() {

    if (isBusy()) return;
    DB.lists = lists; DB.items = items;
    for (const it of normalizeItems(DB.items)) persist(it);
    if (ui.listId && !listById(ui.listId)) ui.listId = null;

  } catch (e) { /* keep what we have */ }
}
async function init() {

  }
  setBadge();
  try { const [lists, items] = await Promise.all([Store.lists(), Store.items()]); DB.lists = lists; DB.items = items; }
  catch (e) { notice('Could not load the workshop data — ' + e.message); }
  for (const it of normalizeItems(DB.items)) persist(it);
  const prefs = loadPrefs(), q = params.get('list');
  if (q) { if (!selectList(q)) ui.listId = null; } else if (prefs.listId && listById(prefs.listId)) ui.listId = prefs.listId;
  for (const it of [...DB.items].sort((a, b) => (a.made || 0) - (b.made || 0)).slice(-8)) paperLines.push(it.word);
  syncShelf(); syncBench(); ready = true; afterEdit(); renderAll();
  const t = params.get('t');
  if (t) [...t].forEach((c, i) => setTimeout(() => type(c), 500 + i * 160));
}
const params = new URLSearchParams(location.search);
{ const prefs = loadPrefs(); setGas(params.get('gas') || prefs.gas || 'neon'); setView(params.get('view') || prefs.view || 'third'); setMode(MODES[params.get('mode')] ? params.get('mode') : MODES[prefs.mode] ? prefs.mode : 'neon');
  setKeys(params.get('keys') === '1'); flow.auto = params.has('auto') ? params.get('auto') !== '0' : !!prefs.auto; renderFlow(); }
cam.blend = ui.view === 'third' ? 1 : 0;
window.__workshop = {
  type: s => { let any = false; for (const c of String(s)) any = keyType(c) || any; return any; }, backspace: keyBack, enter: keyReturn, build: { type, backspace, enter }, flow: { get phase() { return flow.phase; }, get ctl() { return { ...flow.ctl }; }, handOver, setCtl, toggleCtl, pullPack, setAuto, get packReady() { return packReady(); } }, setView, selectList, useSampleList, takeOut, putBack, recall, display: displayItem, verifyCloud, remove: removeItem, setGas, store: Store,
  get letters() { return cur.tubes.map(L => ({ ch: L.ch, state: L.state, p: +(L.p ?? (L.u && L.u.uGrow.value) ?? 0).toFixed(2), t: +L.t.toFixed(2), dur: L.formDur, boost: +(L.boost || 0).toFixed(2), lum: +(L.lum || 0).toFixed(3) })); },
  get state() { const e = targetEntry(); return { typed: cur.buf.text, view: ui.view, listId: ui.listId, entryId: e ? e.id : null, items: DB.items.length, busy: isBusy() }; },
