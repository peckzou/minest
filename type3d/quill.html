<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signature Quill</title>
<style>
:root{--ink:#f1e7d6;--dim:rgba(241,231,214,.5);--faint:rgba(241,231,214,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0605;color:var(--ink);overflow:hidden;
  font:500 11px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.film{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 90% 80% at 50% 48%,transparent 48%,rgba(6,3,1,.72) 100%)}
.hud{position:fixed;pointer-events:none;color:var(--dim);text-shadow:0 1px 3px rgba(0,0,0,.6)}
#title{left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));right:22px;pointer-events:auto}
#title b{color:var(--ink);font-weight:600}
#title a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:1px}
#title a:hover{color:var(--ink)}
#line{left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;color:var(--ink);letter-spacing:.32em;text-transform:none;white-space:pre;overflow:hidden;padding:0 24px}
#line .caret{display:inline-block;width:.6em;height:1px;background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#line .caret{animation:none}}
#hint{left:0;right:0;bottom:max(52px,calc(env(safe-area-inset-bottom) + 26px));text-align:center;transition:opacity .8s}
#hint.off{opacity:0}
#err{left:0;right:0;top:46%;text-align:center;color:var(--ink);display:none;text-transform:none;letter-spacing:.04em}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;background:transparent;color:transparent;font-size:16px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="film"></div>
<div class="hud" id="title"><a href="index.html">Filament</a> / <a href="firework.html">Firework</a> / <a href="topiary.html">Topiary</a> / <a href="saber.html">Saber</a> / <b>Quill</b> / <a href="neon.html">Neon</a> / <a href="book.html">Book</a></div>
<div class="hud" id="hint">Type — 鹅毛笔替你落笔 · Enter 签名花饰并换纸 · Backspace 吸去墨迹</div>
<div class="hud" id="line"><span id="txt"></span><span class="caret"></span></div>
<div class="hud" id="err"></div>
<input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type here">

const txt = document.getElementById('txt'), hint = document.getElementById('hint'), kb = document.getElementById('kb');

});
kb.value = ' ';
kb.addEventListener('beforeinput', e => { e.preventDefault();
  if (e.inputType === 'deleteContentBackward') backspace(); else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') enter(); else if (e.data) for (const c of e.data) type(c); });

/* ───────────── the pen ───────────── */
const pen = { item: null, mode: 'idle', si: 0, d: 0, ang: -0.6 };
const qpos = new THREE.Vector3(), trav = { from: new THREE.Vector3(), to: new THREE.Vector3(), len: 1, d: 0, lift: 0 };
const rest = new THREE.Vector3(), focus = new THREE.Vector3(), tmpV = new THREE.Vector3();

    candleLight.intensity = 14 * fl; flame.scale.set(0.8, 2.2 * (0.92 + 0.12 * fl), 0.8); flame.position.x = CANDLE.x + Math.sin(time * 7.3) * 0.006; glow.material.opacity = 0.72 * fl; }

requestAnimationFrame(frame);

  const hello = [...(new URLSearchParams(location.search).get('t') ?? 'Signature')].slice(0, 40);
