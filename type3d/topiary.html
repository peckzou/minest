<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Topiary Type</title>
<style>
:root{--ink:#fbfdf6;--dim:rgba(251,253,246,.72);--faint:rgba(251,253,246,.34)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#dbe7ea;color:var(--ink);overflow:hidden;
  font:500 11px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;
  text-shadow:0 1px 2px rgba(12,34,18,.55);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
/* film: a little shade at the top and bottom edges so the HUD reads over sky and lawn, plus a soft vignette */
.film{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(14,40,58,.30),transparent 110px),linear-gradient(to top,rgba(10,32,12,.42),transparent 130px),
  radial-gradient(ellipse 90% 80% at 50% 46%,transparent 60%,rgba(8,26,12,.26) 100%)}
.hud{position:fixed;pointer-events:none;color:var(--dim)}
#title{left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));pointer-events:auto;max-width:calc(100% - 270px)}
#title b{color:var(--ink);font-weight:600}
#title a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:1px}
#title a:hover{color:var(--ink)}
#mode{right:max(22px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));pointer-events:auto;text-align:right;white-space:nowrap}
#mode button{all:unset;cursor:pointer;color:var(--dim);border-bottom:1px solid var(--faint);padding-bottom:1px}
#mode button:hover{color:var(--ink)}
#mode button.on{color:var(--ink);font-weight:600;border-bottom-color:transparent;cursor:default}
@media (max-width:900px){#title{max-width:calc(100% - 44px)}#mode{top:calc(max(20px,env(safe-area-inset-top)) + 58px)}}
#line{left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;color:var(--ink);letter-spacing:.32em;white-space:pre;overflow:hidden;padding:0 24px}
#line .caret{display:inline-block;width:.6em;height:1px;background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#hint{left:0;right:0;bottom:max(52px,calc(env(safe-area-inset-bottom) + 26px));text-align:center;transition:opacity .8s;padding:0 24px}
#hint.off{opacity:0}
#err{left:0;right:0;top:46%;text-align:center;color:var(--ink);display:none;text-transform:none;letter-spacing:.04em}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;background:transparent;color:transparent;font-size:16px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="film"></div>
<div class="hud" id="title"><a href="index.html">Filament</a> / <a href="firework.html">Firework</a> / <b>Topiary</b> / <a href="saber.html">Saber</a> / <a href="quill.html">Quill</a> / <a href="neon.html">Neon</a> / <a href="book.html">Book</a></div>
<div class="hud" id="mode"><button type="button" data-m="topiary" class="on">Topiary</button> &nbsp;/&nbsp; <button type="button" data-m="mow">Lawn Mowing</button></div>
<div class="hud" id="hint">Type — 每个键一株灌木，园艺剪把它修成字母 · Enter 退后欣赏整排 · Backspace 剪掉</div>
<div class="hud" id="line"><span id="txt"></span><span class="caret"></span></div>
<div class="hud" id="err"></div>
<input id="kb" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Type here">
