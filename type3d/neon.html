<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noble Gas Neon</title>
<style>
:root{--ink:#e9ecee;--dim:rgba(233,236,238,.42);--faint:rgba(233,236,238,.16);--g:#ff5a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020203;color:var(--ink);overflow:hidden;
  font:500 11px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.film{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 85% 75% at 50% 45%,transparent 50%,rgba(0,0,0,.66) 100%)}
.hud{position:fixed;pointer-events:none;color:var(--dim)}
#title{left:max(22px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));pointer-events:auto;max-width:calc(100% - 44px)}
#title b{color:var(--ink);font-weight:600}
#title a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--faint);padding-bottom:1px}
#title a:hover{color:var(--ink)}
#gas{right:max(22px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));pointer-events:auto;display:flex;gap:14px}
#gas button{all:unset;cursor:pointer;color:var(--dim);border-bottom:1px solid transparent;padding-bottom:1px}
#gas button:hover{color:var(--ink)}
#gas button.on{color:var(--ink);border-bottom-color:var(--g)}
@media (max-width:820px){#gas{top:calc(max(20px,env(safe-area-inset-top)) + 46px)}}
#line{left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;color:var(--ink);letter-spacing:.32em;white-space:pre;overflow:hidden;padding:0 24px}
#line .caret{display:inline-block;width:.6em;height:1px;background:var(--ink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#hint{left:0;right:0;bottom:max(52px,calc(env(safe-area-inset-bottom) + 26px));text-align:center;transition:opacity .8s}
#hint.off{opacity:0}
#err{left:0;right:0;top:46%;text-align:center;color:var(--ink);display:none;text-transform:none;letter-spacing:.04em}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;background:transparent;color:transparent;font-size:16px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="film"></div>
<div class="hud" id="title"><a href="index.html">Filament</a> / <a href="firework.html">Firework</a> / <a href="topiary.html">Topiary</a> / <a href="saber.html">Saber</a> / <a href="quill.html">Quill</a> / <b>Neon</b> / <a href="book.html">Book</a></div>
<div class="hud" id="gas"><button type="button" tabindex="-1" data-gas="neon" title="Neon">NE</button><button type="button" tabindex="-1" data-gas="argon" title="Argon">AR</button><button type="button" tabindex="-1" data-gas="helium" title="Helium">HE</button><button type="button" tabindex="-1" data-gas="xenon" title="Xenon">XE</button></div>
<div class="hud" id="hint">Type — 每个键一支玻璃放电管 · Enter 让电流走过整个单词 · Backspace 熄灭拆除</div>
<div class="hud" id="line"><span id="txt"></span><span class="caret"></span></div>
<div class="hud" id="err"></div>
<input id="kb" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Type here">

  let slot = 0;
  for (let wi = 0; wi < order.length && wi < alloc.length; wi++) { const k = alloc[wi]; if (!k) continue;
    const w = order[wi], ls = w.tubes, n = ls.length, gp = w.group.position, s = w.group.scale.x;
    for (let j = 0; j < n; j++) { const L = ls[j]; if (L.lum < 0.002) continue;
      const o = (slot + Math.min(k - 1, Math.floor(j * k / n))) * 7, wt = L.lum * s, c = L.gas.light;
      acc[o] += (gp.x + s * (L.x + L.def.cx)) * wt; acc[o + 1] += (gp.y + s * L.def.cy) * wt; acc[o + 2] += (gp.z + s * 0.32) * wt;
      acc[o + 3] += c[0] * wt; acc[o + 4] += c[1] * wt; acc[o + 5] += c[2] * wt; acc[o + 6] += wt; }
    slot += k; }
  const snap = mode !== allocMode; allocMode = mode;
  const a = 1 - Math.exp(-dt * 7); let rr = 0, rg = 0, rb = 0;
  for (let i = 0; i < LIGHTS; i++) { const l = lights[i], o = i * 7, wt = acc[o + 6];
    if (wt < 0.002) { l.intensity = 0; lightOn[i] = 0; continue; }
    _v.set(acc[o] / wt, acc[o + 1] / wt, acc[o + 2] / wt);
    if (!lightOn[i] || snap) l.position.copy(_v); else l.position.lerp(_v, a); lightOn[i] = 1;
    l.color.setRGB(acc[o + 3] / wt, acc[o + 4] / wt, acc[o + 5] / wt); l.intensity = Math.min(42, LIGHT_K * wt);
    rr += l.color.r * l.intensity; rg += l.color.g * l.intensity; rb += l.color.b * l.intensity; }
  _c.setRGB(Math.min(1.2, rr * 0.035), Math.min(1.2, rg * 0.035), Math.min(1.2, rb * 0.035)); roomU.value.lerp(_c, 1 - Math.exp(-dt * 10));
}

/* ───────────── frame ───────────── */
const cam = { x: 0.8, z: 7.2 }; let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), time = now / 1000; last = now; uTime.value = time % 1000;
  // the queue: a few letters are drawn at once; the more are waiting, the faster everything goes
  let forming = 0, unsettled = 0;
  for (const L of cur.tubes) { if (!L.settled) unsettled++; if (L.state === 'stand' || L.state === 'form') forming++; }
  for (const L of cur.tubes) { if (forming >= MAX_FORMING) break; if (L.state === 'queued') { L.start(); forming++; } }
  const speed = Math.min(5, (reduce ? 1.8 : 1) * (1 + 0.45 * Math.max(0, unsettled - 2)));
  for (const L of cur.tubes) L.update(L.settled ? dt : dt * speed, time);
  for (let i = dying.length - 1; i >= 0; i--) { const L = dying[i]; L.update(dt * 1.2, time); if (L.dead) { L.dispose(); dying.splice(i, 1); } }
  for (let i = others.length - 1; i >= 0; i--) { const w = others[i]; updateFinished(w, dt); for (const L of w.tubes) L.update(dt, time);
    if (w.fade <= 0) { disposeWord(w); others.splice(i, 1); } }
  updateLights(dt);
  // camera: frames the row on the bench, eases along it and pulls back as the word grows
  let x1 = Math.max(cur.cursorX - GAP, 1.3);
  if (!cur.items.length && others.length && others[0].fin && others[0].fin.moveT < 0) x1 = Math.max(others[0].cursorX - GAP, 1.3);
  const half = Math.tan(camera.fov * Math.PI / 360), needZ = (x1 / 2 + 1.55) / (half * camera.aspect), tz = Math.max(6.6, needZ);
  cam.x += (x1 / 2 - cam.x) * (1 - Math.exp(-dt * 1.7)); cam.z += (tz - cam.z) * (1 - Math.exp(-dt * 1.3));
  const sway = reduce ? 0 : 1;
  camera.position.set(cam.x + sway * Math.sin(time * 0.17) * 0.32, 1.72 + (cam.z - 6.6) * 0.05 + sway * Math.sin(time * 0.11) * 0.05, cam.z);
  camera.lookAt(cam.x, 1.42 + (cam.z - 6.6) * 0.02, 0);
  composer.render();
  requestAnimationFrame(frame);
}

/* ───────────── start ───────────── */
const params = new URLSearchParams(location.search);
setGas('neon', false); if (params.get('gas')) setGas(params.get('gas'));
window.__neon = { type, backspace, enter, setGas, get letters() { return cur.tubes; }, get words() { return others; }, get gas() { return gasKey; } };
const hello = (params.get('t') ?? 'NEON').slice(0, 24);
[...hello].forEach((c, i) => setTimeout(() => type(c), 500 + i * 380));
requestAnimationFrame(frame);
</script>
