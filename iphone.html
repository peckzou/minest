/* Focusboard 5.5 Enhanced Styling */
.mini-scrubber-pill {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px -4px rgba(0,0,0,0.5), inset 0 1px 1.5px rgba(255,255,255,0.2);
}
.scrubber-dot {
  transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.scrubber-dot:hover {
  transform: scale(1.6);
}
.scrubber-dot.active {
  transform: scale(1.75);
  box-shadow: 0 0 12px currentColor;
}
.sound-wave-anim {
  animation: soundWave 0.7s ease-in-out infinite alternate;
}
@keyframes soundWave {
  0% { height: 4px; opacity: 0.5; }
  100% { height: 14px; opacity: 1; }
}
.column-ribbon {
  writing-mode: vertical-rl;
  text-orientation: mixed;
}
.mastery-star-gold {
  color: #fbbf24;
  filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.6));
}
.perspective-drill {
  perspective: 1200px;
  perspective-origin: 50% 50%;
  transform-style: preserve-3d;
}
.drill-flipper {
  transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1);
  transform-style: preserve-3d !important;
}
.zen-mode-active header {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-100%);
  transition: all 0.4s ease;
}
.zen-mode-active main {
  padding-top: 0 !important;
}
.stats-banner-glass-dark {
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.stats-banner-glass-white {
  background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(245,248,252,0.85) 100%);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 8px 24px rgba(15,23,42,0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

/* iPhone 15 Pro & Mobile Adaptive Styles */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
html, body {
  overscroll-behavior: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.iphone-simulator-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 10px;
  overflow: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  transition: background 0.3s ease;
}
.iphone-simulator-shell::-webkit-scrollbar {
  display: none;
}
.iphone-frame {
  width: 393px;
  height: 852px;
  border-radius: 54px;
  overflow: hidden;
  position: relative;
  transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.iphone-frame.landscape {
  width: 852px;
  height: 393px;
  border-radius: 48px;
}
.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 124px;
  height: 34px;
  background: #000000;
  border-radius: 20px;
  z-index: 100;
  pointer-events: none;
  box-shadow: inset 0 0 1px 1px rgba(255,255,255,0.1);
  transition: all 0.4s ease;
}
.dynamic-island.landscape {
  top: 50%;
  left: 11px;
  transform: translateY(-50%);
  width: 34px;
  height: 124px;
}
.home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  border-radius: 3px;
  z-index: 100;
  pointer-events: none;
  transition: all 0.4s ease;
}
.home-indicator.landscape {
  bottom: 6px;
  width: 170px;
}
.perspective-stage {
  perspective: 1100px;
  perspective-origin: 50% 50%;
  transform-style: preserve-3d;
  touch-action: pan-y;
}
/* Explicit Rounded Corners for Cover Flow Cards */
.coverflow-card-item, .coverflow-flipper, .face-front, .face-back, .coverflow-card-reflection > div {
  border-radius: 32px !important;
}

var SpeechAssistant = {
  isSpeaking: false,

    lang = lang || 'en-US';

    if (!('speechSynthesis' in window)) {
      alert('当前浏览器未启用语音合成功能。');

    var clean = (text || '').replace(/[#*`_\[\]]/g, '').replace(/\s+/g, ' ').trim();
    if (!clean) return;
    var utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = lang;
    utterance.rate = rate;
    var voices = window.speechSynthesis.getVoices();
    var voice = voices.find(function(v) {
      return v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('US'));

    utterance.onstart = function() { SpeechAssistant.isSpeaking = true; };
    utterance.onend = utterance.onerror = function() { SpeechAssistant.isSpeaking = false; };
    window.speechSynthesis.speak(utterance);
  },
  stop: function() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      this.isSpeaking = false;

    try { return localStorage.getItem(GEMINI_KEY_STORAGE) || ""; } catch(e) { return ""; }
  })();
  var model = (function() {

    try {
      var endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model.trim()) + ":generateContent?key=" + encodeURIComponent(apiKey.trim());
      var systemInstruction = "你是一位专注于德州教师资格证 (TExES EC-6) 与 Peck 学习系统 (Input → Organize → Retrieve → Apply → Review) 的顶尖学科导师与任务助教。请针对用户的学习看板与卡片需求，提供结构清晰、富有启发性、直接可落地的专业建议。如涉及英语词汇、自然拼读(Phonics)或语法规则，给出纯正美式范例与易错点辨析。";
      var fullPrompt = systemInstruction + "\n\n[任务类型]: " + taskType + "\n[卡片标题]: " + (cardTitle || "无") + "\n[上下文信息]: " + JSON.stringify(context || {}) + "\n\n[具体需求]: " + prompt;

      var res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            role: "user",
            parts: [{ text: fullPrompt }]
          }]
        })
      });
      if (res.ok) {
        var data = await res.json();
        var text = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
        if (text) return text;
      }

      console.warn("Gemini API call failed, falling back to local domain engine:", err);

  // Try local server /api/ai if present

// Markdown Exporter for Active Board
function exportBoardToMarkdown(board) {
  var md = "# " + board.title + "\n\n";
  if (board.deadline) md += "> **截止目标 / 规划周期**: " + board.deadline + "\n\n";
  (board.columns || []).forEach(function(col) {
    md += "## " + col.title + " (" + (col.cards || []).length + ")\n\n";
    (col.cards || []).forEach(function(card) {
      var status = card.complete ? "[x]" : "[ ]";
      var mastery = card.mastery ? (" ⭐Lv." + card.mastery) : "";
      var date = card.date ? (" 📅 " + card.date) : "";
      var labels = (card.labels && card.labels.length > 0) ? (" 🏷️ " + card.labels.join(", ")) : "";
      md += "### " + status + " " + card.title + mastery + date + labels + "\n\n";
      if (card.desc) md += card.desc + "\n\n";
      if (card.checklistItems && card.checklistItems.length > 0) {
        md += "**待办与要点清单:**\n";
        card.checklistItems.forEach(function(item) {
          md += "- [" + (item.done ? "x" : " ") + "] " + item.text + "\n";
        });
        md += "\n";
      }
    });
  });
  var blob = new Blob([md], { type: "text/markdown;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = board.title.replace(/\s+/g, '_') + "_" + new Date().toISOString().slice(0, 10) + ".md";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
