    <style>
      /* Minest 19.0: Constrain BadgeWall slot cells and prevent badge silhouette/image overflow */
      [class*='aspect-square'] {
        overflow: hidden !important;
        position: relative !important;
      }
      [class*='aspect-square'] > div {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      [class*='aspect-square'] svg,
      [class*='aspect-square'] img,
      [class*='aspect-square'] [style*='min-height'] {
        max-width: 58px !important;
        max-height: 58px !important;
        min-height: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }
      /* Ensure dark mode styling for locked/unlocked cards regardless of system color scheme */
      html.dark div[class*='bg-slate-100'],
      html div[class*='bg-slate-100'] {
        background-color: rgba(14, 15, 20, 0.85) !important;
        border-color: rgba(255, 255, 255, 0.06) !important;
      }
      html.dark span[class*='text-slate-400'],
      html span[class*='text-slate-400'] {
        color: rgba(255, 255, 255, 0.35) !important;
      }
    </style>
